                // DAMPERS (SpringDial + DampingDial) groups. The split divide is the display-space
                // mech balance the MECH BALANCE strip plots; a null falls back to the raw roll-
                // stiffness rear fraction so the card still draws.
                const rsTot=tune.rsSpF+tune.rsAbF+tune.rsSpR+tune.rsAbR;
                const mechBal=tune.mechBalance??(rsTot>0?(tune.rsSpR+tune.rsAbR)/rsTot:0.5);
                return<div ref={visRideRef}>
              <div className="collapsible-hdr" onClick={()=>setOpen(p=>({...p,visRide:!p.visRide}))}
                style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',marginBottom:3,userSelect:'none',padding:'3px 4px'}}>
                <span style={{fontSize:9,letterSpacing:2,color:'#64748b'}}>RIDE · ROLL · DAMPING</span>
                {!open.visRide&&<span style={{fontSize:9,color:'#94a3b8',fontFamily:'var(--font-mono)'}}>
                  R {Math.round(mechBal*100)}% · ×{tune.fHz>0?(tune.rHz/tune.fHz).toFixed(2):'—'} · {tune.rollDeg.toFixed(2)}°</span>}
                <span style={{marginLeft:'auto',fontSize:9,color:'#475569'}}>{open.visRide?'▲':'▼'}</span>
              </div>
              {open.visRide&&
              <div style={{background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:3,padding:'6px 8px',marginBottom:10,display:'flex',flexDirection:'column',gap:8}}>
                <VisRollSplit mechBal={mechBal} natBal={natMechBalance} target={feEffective.arbBalTarget}
                  rsSpF={tune.rsSpF} rsAbF={tune.rsAbF} rsSpR={tune.rsSpR} rsAbR={tune.rsAbR}
                  rollDeg={tune.rollDeg} rollClamped={tune.rollClamped}
                  rollTarget={arbMode==='roll'?tune.rollTarget:null} arbShare={tune.arbShare}/>
                <div style={{height:1,background:'#1e293b'}}/>
                {/* No ceiling in physical modes, so the ARB track gets a dynamic full scale
                    with 25% headroom above the stiffer bar; VisSuspTracks hides its bands. */}
                <VisSuspTracks tune={tune} physics={physics}
                  natBal={natMechBalance} target={feEffective.arbBalTarget}
                  arbLimit={lim.arb??Math.max(1,tune.arbF,tune.arbR)*1.25} physical={physMode}
                  dispF={arbOut(tune.arbF,lim,ch.trackF,ch.arbMotionRatioF).value}
                  dispR={arbOut(tune.arbR,lim,ch.trackR,ch.arbMotionRatioR).value}
                  hzClamped={physics.rearHzClamped}/>
              </div>}
                </div>;
              })()}

              <div className="collapsible-hdr" onClick={()=>setOpen(p=>({...p,visDynamics:!p.visDynamics}))}
                style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',marginBottom:3,userSelect:'none',padding:'3px 4px'}}>
                <span style={{fontSize:9,letterSpacing:2,color:'#334155'}}>DYNAMICS</span>
                <Hint text="Each axle settling back to ride height after one bump. Strip = ±10% of the initial displacement; dashed line = settle time (last exit from the strip); ring = first ride-height crossing." term="dynamics-chart"/>
                {open.visDynamics&&<div style={{marginLeft:'auto',display:'flex',gap:2}} onClick={e=>e.stopPropagation()}>
                  {[['ride','RIDE'],['roll','ROLL']].map(([k,l])=>
                    <button key={k} className={`tog${dynView===k?' on':''}`} style={{fontSize:8,padding:'1px 5px'}}
                      title={k==='roll'?'Roll response per axle: the ARB adds roll stiffness without damping. A comparison view only.':'Ride (heave) response per axle.'}
                      onClick={()=>setDynView(k)}>{l}</button>)}
                </div>}
                <span style={{marginLeft:open.visDynamics?4:'auto',fontSize:9,color:'#475569'}}>{open.visDynamics?'▲':'▼'}</span>
              </div>
              {open.visDynamics&&(()=>{
                // ROLL view: the same damper and spring plus an undamped bar, per axle —
                // s = √(rsSp/(rsSp+rsAb)); ζ scales by s, frequency by 1/s. Settle and neutral
                // markers are the same definitions applied to the roll trace.
                const roll=dynView==='roll';
                const sh=(sp,ab)=>!roll?1:(sp+ab)>0?Math.sqrt(sp/(sp+ab)):1;
                const sF=sh(tune.rsSpF??0,tune.rsAbF??0),sR=sh(tune.rsSpR??0,tune.rsAbR??0);
                const fReb=(tune.zetaF??physics.reboundZeta??70)*sF;
                const fBmp=(tune.bumpZetaF??physics.bumpZeta??39)*sF;
                const rReb=(tune.zetaR??physics.reboundZeta??70)*sR;
                const rBmp=(tune.bumpZetaR??physics.bumpZeta??39)*sR;
                const fHzV=tune.fHz/(sF||1),rHzV=tune.rHz/(sR||1);
                // Settle time is measured off the plotted trace rather than read from
                // tune.settleF/R, because this dashed line annotates THIS curve: the analytic
                // figure sees REBOUND ζ only, while computeOscillation alternates rebound/bump by
                // velocity sign. DAMPERS deliberately keeps quoting the analytic one — it is what
                // SETTLE TIME mode back-solves against, so changing it would break that
                // round-trip. The two therefore disagree on purpose, and the chart's own Hint
                // says so.
                // Three things about this marker surprise people, all properties of the "last
                // band exit" definition rather than of the integration: it can land BEFORE the
                // neutral ring, it steps rather than sliding as ζ rises, and the quickest settle
                // is not at critical damping. docs/PHYSICS.md carries the derivation, the exact
                // figures either side of the step, and the textbook cross-check.
                // Window fit, trace and measurement all live in measureSettle, shared with the
                // DAMPERS table's Settle-row MEAS so the two can never disagree.
                const{durSec,frontPts,rearPts,fSettle,rSettle}=
                  measureSettle(fHzV,fReb,fBmp,rHzV,rReb,rBmp,tune.settleF,tune.settleR);
                const W=280,H=80,midY=40,yScale=32,xScale=W/durSec;
                const toPolyPts=pts=>pts.map(p=>`${(p.t*xScale).toFixed(1)},${(midY-p.x*yScale).toFixed(1)}`).join(' ');
                // null = still outside the band at the window edge; pin the line there so it
                // agrees with the readout's ">" label. A guard, not a common path: the slowest
                // reachable tune (HZ_MIN 0.8, ζ floor 10%) measures ~3.9s inside the 4s cap.
                const fSetX=Math.min(W-1,(fSettle??durSec)*xScale);
                const rSetX=Math.min(W-1,(rSettle??durSec)*xScale);
                // First neutral (ride-height) crossing: linearly interpolate the sample pair
                // that straddles x=0. One ring per axle — a rise-speed indicator, distinct from
                // the settle-time dashed line — same "mark the meaningful point" pattern as the
                // SAG vs LOAD chart's operating-point/bottom-out rings.
                const firstCrossing=pts=>{
                  for(let i=1;i<pts.length;i++){
                    const a=pts[i-1],b=pts[i];
                    if((a.x<0)!==(b.x<0))return a.t+(b.t-a.t)*(a.x/(a.x-b.x));
                  }
                  return null;
                };
                const fCross=firstCrossing(frontPts),rCross=firstCrossing(rearPts);
                const crossMarker=(t,color)=>t==null?null:(
                  <circle cx={t*xScale} cy={midY} r={2.2} fill="#020617" stroke={color} strokeWidth={1.4}/>
                );
                return(
                  <div style={{background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:3,padding:'6px 8px',marginBottom:6,display:'flex',flexDirection:'column',gap:4}}>
                    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
                      {/* The ±10% band the settle markers are measured against. Without it the
                          dashed line reads as arbitrary — worse, past ζ≈60% it lands BEFORE the
                          neutral ring, which looks impossible until you can see that the trace
                          enters the band on the way down and never leaves again. */}
                      <rect x={0} y={midY-SETTLE_ENV*yScale} width={W} height={2*SETTLE_ENV*yScale}
                            fill="#64748b" opacity={0.10}/>
                      <line x1={0} y1={midY-SETTLE_ENV*yScale} x2={W} y2={midY-SETTLE_ENV*yScale}
                            stroke="#475569" strokeWidth={0.5} strokeDasharray="2 3" opacity={0.7}/>
                      <line x1={0} y1={midY+SETTLE_ENV*yScale} x2={W} y2={midY+SETTLE_ENV*yScale}
                            stroke="#475569" strokeWidth={0.5} strokeDasharray="2 3" opacity={0.7}/>
                      <text x={2} y={midY-SETTLE_ENV*yScale-2} fontSize={6} fill="#64748b"
                            fontFamily="JetBrains Mono, monospace">±10%</text>
                      <line x1={0} y1={midY} x2={W} y2={midY} stroke="#1e293b" strokeWidth={1}/>
                      <line x1={fSetX} y1={0} x2={fSetX} y2={H} stroke="#38bdf855" strokeWidth={1} strokeDasharray="3 3"/>
                      <line x1={rSetX} y1={0} x2={rSetX} y2={H} stroke="#fb923c55" strokeWidth={1} strokeDasharray="3 3"/>
                      <polyline points={toPolyPts(rearPts)}  fill="none" stroke="#fb923c" strokeWidth={1.5} strokeLinejoin="round"/>
                      <polyline points={toPolyPts(frontPts)} fill="none" stroke="#38bdf8" strokeWidth={1.5} strokeLinejoin="round"/>
                      {crossMarker(rCross,'#fb923c')}
                      {crossMarker(fCross,'#38bdf8')}
                      <text x={W-6} y={13} textAnchor="end" fontSize={9} fill="#38bdf8" fontFamily="JetBrains Mono, monospace">F</text>
                      <text x={W-6} y={25} textAnchor="end" fontSize={9} fill="#fb923c" fontFamily="JetBrains Mono, monospace">R</text>
                    </svg>
                    <div style={{display:'flex',flexDirection:'column',gap:2,fontFamily:'var(--font-mono)'}}>
                      <div style={{display:'flex',gap:12}}>
                        <span style={{fontSize:9,color:'#38bdf8'}}>settle {fSettle!=null?`${fSettle.toFixed(2)}s`:`>${durSec.toFixed(2)}s`}</span>
                        <span style={{fontSize:9,color:'#fb923c'}}>settle {rSettle!=null?`${rSettle.toFixed(2)}s`:`>${durSec.toFixed(2)}s`}</span>
                      </div>
                      <div style={{display:'flex',gap:12}}>
                        <span style={{fontSize:9,color:'#38bdf8',opacity:0.75}}>{fCross!=null?`neutral ≈${fCross.toFixed(2)}s`:'no neutral cross'}</span>
                        <span style={{fontSize:9,color:'#fb923c',opacity:0.75}}>{rCross!=null?`neutral ≈${rCross.toFixed(2)}s`:'no neutral cross'}</span>
                      </div>
                    </div>
                  </div>
                );
              })()}

              {ch.useRideHeightCG&&(()=>{
                const pF=parseTyre(ch.tyreF),pR=parseTyre(ch.tyreR);
                const tyresOk=pF?.radius!=null&&pR?.radius!=null;
                if(!tyresOk)return null;
                const gConst=9810;
                const sagF=gConst/Math.pow(2*Math.PI*tune.fHz,2);
                const sagR=gConst/Math.pow(2*Math.PI*tune.rHz,2);
                const rhF=ch.rideHeightF*1000,rhR=ch.rideHeightR*1000;
                const riskOf=ratio=>ratio>=1?['BOTTOMED','#ef4444']:ratio>=0.8?['HIGH','#f59e0b']:ratio>=0.5?['MED','#eab308']:['LOW','#4ade80'];
                const[rF]=riskOf(sagF/rhF),[rR]=riskOf(sagR/rhR);
                const COL_F='#60a5fa',COL_R='#fb923c';
                const gBottomF=rhF/sagF,gBottomR=rhR/sagR;
                // Outside-wheel line: adds lateral-load-transfer compression (same LLT model as
                // MECH BAL / grip balance) on top of static sag, so cornering g — not just
                // vertical g — shows up as its own bottoming risk.
                const m_=cornerMasses(ch);
                const Kf_=tune.rsSpF+tune.rsAbF,Kr_=tune.rsSpR+tune.rsAbR;
                const{dWf,dWr}=latLoadTransfer(ch,Kf_,Kr_);
                const kWheelF=m_.front*Math.pow(2*Math.PI*tune.fHz,2),kWheelR=m_.rear*Math.pow(2*Math.PI*tune.rHz,2);
                const dSagF=kWheelF>0?dWf/kWheelF*1000:0,dSagR=kWheelR>0?dWr/kWheelR*1000:0;
                const gBottomOutF=sagF>=rhF?0:(dSagF>0?(rhF-sagF)/dSagF:Infinity);
                const gBottomOutR=sagR>=rhR?0:(dSagR>0?(rhR-sagR)/dSagR:Infinity);
                const gMax=Math.max(1,Math.min(6,Math.max(gBottomF,gBottomR,gBottomOutF,gBottomOutR,1)*1.25));
                const yMax=Math.max(rhF,rhR,sagF*gMax,sagR*gMax,sagF+dSagF*gMax,sagR+dSagR*gMax)*1.08;
                const W=280,H=115,padL=44,padB=20,padT=10,padR=10;
                const plotW=W-padL-padR,plotH=H-padT-padB;
                const xS=g_=>padL+(g_/gMax)*plotW;
                const yS=mm=>padT+plotH-(mm/yMax)*plotH;
                const toDisp=mm=>mLen?mm/10:mm/IN_TO_MM;
                const gEndF=Math.min(gMax,yMax/sagF),gEndR=Math.min(gMax,yMax/sagR);
                const gEndOutF=Math.min(gMax,sagF+dSagF*gMax<=yMax||dSagF<=0?gMax:(yMax-sagF)/dSagF);
                const gEndOutR=Math.min(gMax,sagR+dSagR*gMax<=yMax||dSagR<=0?gMax:(yMax-sagR)/dSagR);
                const xTicks=Array.from({length:Math.floor(gMax)+1},(_,i)=>i).filter(g_=>g_<=gMax);
                return(<>
                  <div className="collapsible-hdr" onClick={()=>setOpen(p=>({...p,visSag:!p.visSag}))}
                    style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',marginBottom:3,marginTop:6,userSelect:'none',padding:'3px 4px'}}>
                    <span style={{fontSize:9,letterSpacing:2,color:'#334155'}}>SAG vs LOAD</span>
                    <Hint text="Solid line = sag vs vertical load; dashed = ride height, and where they meet is the g that bottoms that axle. Short-dashed = outside wheel when cornering. Real springs stiffen near the top." term="sag-vs-load"/>
                    {open.visSag&&<span style={{marginLeft:'auto',display:'flex',gap:8,fontSize:9}}>
                      <span style={{color:COL_F}}>● FRONT {rF}</span>
                      <span style={{color:COL_R}}>● REAR {rR}</span>
                    </span>}
                    <span style={{marginLeft:open.visSag?0:'auto',fontSize:9,color:'#475569'}}>{open.visSag?'▲':'▼'}</span>
                  </div>
                  {open.visSag&&
                  <div style={{background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:2,padding:'6px 8px',marginBottom:4,display:'flex',flexDirection:'column',gap:4}}>
                    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto'}}>
                      {/* axes */}
                      <line x1={padL} y1={padT} x2={padL} y2={H-padB} stroke="#1e293b" strokeWidth={1}/>
                      <line x1={padL} y1={H-padB} x2={W-padR} y2={H-padB} stroke="#1e293b" strokeWidth={1}/>
                      {xTicks.map(g_=>(
                        <g key={g_}>
                          <line x1={xS(g_)} y1={H-padB} x2={xS(g_)} y2={H-padB+3} stroke="#334155" strokeWidth={1}/>
                          <text x={xS(g_)} y={H-padB+13} fontSize={8} fill="#475569" textAnchor="middle" fontFamily="var(--font-mono)">{g_}g</text>
                        </g>
                      ))}
                      <text x={2} y={padT+4} fontSize={8} fill="#475569" fontFamily="var(--font-mono)">{Math.round(toDisp(yMax))}{mLen?'cm':'in'}</text>
                      <text x={2} y={H-padB} fontSize={8} fill="#475569" fontFamily="var(--font-mono)">0</text>
                      {/* bump-stop zone: real springs go progressive well before metal-to-metal
                          contact — shade the top 12% of each axle's travel as a reminder that
                          the diagonal below is a linear-rate approximation, softest right where
                          it matters most. */}
                      <rect x={padL} y={yS(rhF)} width={plotW} height={yS(rhF*0.88)-yS(rhF)} fill={COL_F} opacity={0.08}/>
                      <rect x={padL} y={yS(rhR)} width={plotW} height={yS(rhR*0.88)-yS(rhR)} fill={COL_R} opacity={0.08}/>
                      {/* ride-height (bottom-out) reference lines */}
                      <line x1={padL} y1={yS(rhF)} x2={W-padR} y2={yS(rhF)} stroke={COL_F} strokeWidth={1} strokeDasharray="3,2" opacity={0.6}/>
                      <line x1={padL} y1={yS(rhR)} x2={W-padR} y2={yS(rhR)} stroke={COL_R} strokeWidth={1} strokeDasharray="3,2" opacity={0.6}/>
                      {/* left-side value labels: bottom-out ride height and 1g sag point, front in
                          column 1 and rear in column 2, so front/rear never overlap each other */}
                      <text x={1} y={yS(rhF)+2.5} fontSize={7} fill={COL_F} fontFamily="var(--font-mono)">{toDisp(rhF).toFixed(mLen?1:2)}</text>
                      <text x={22} y={yS(rhR)+2.5} fontSize={7} fill={COL_R} fontFamily="var(--font-mono)">{toDisp(rhR).toFixed(mLen?1:2)}</text>
                      {gMax>=1&&<text x={1} y={yS(sagF)+2.5} fontSize={7} fill={COL_F} fontFamily="var(--font-mono)">{toDisp(sagF).toFixed(mLen?1:2)}</text>}
                      {gMax>=1&&<text x={22} y={yS(sagR)+2.5} fontSize={7} fill={COL_R} fontFamily="var(--font-mono)">{toDisp(sagR).toFixed(mLen?1:2)}</text>}
                      {/* outside-wheel-under-cornering-load diagonals (LLT model) */}
                      <line x1={xS(0)} y1={yS(sagF)} x2={xS(gEndOutF)} y2={yS(sagF+dSagF*gEndOutF)} stroke={COL_F} strokeWidth={1} strokeDasharray="2,2" opacity={0.65}/>
                      <line x1={xS(0)} y1={yS(sagR)} x2={xS(gEndOutR)} y2={yS(sagR+dSagR*gEndOutR)} stroke={COL_R} strokeWidth={1} strokeDasharray="2,2" opacity={0.65}/>
                      {isFinite(gBottomOutF)&&gBottomOutF<=gMax&&<circle cx={xS(gBottomOutF)} cy={yS(rhF)} r={2} fill="none" stroke={COL_F} strokeWidth={1.3}/>}
                      {isFinite(gBottomOutR)&&gBottomOutR<=gMax&&<circle cx={xS(gBottomOutR)} cy={yS(rhR)} r={2} fill="none" stroke={COL_R} strokeWidth={1.3}/>}
                      {/* sag-vs-load diagonals (uniform vertical g) */}
                      <line x1={xS(0)} y1={yS(0)} x2={xS(gEndF)} y2={yS(sagF*gEndF)} stroke={COL_F} strokeWidth={2}/>
                      <line x1={xS(0)} y1={yS(0)} x2={xS(gEndR)} y2={yS(sagR*gEndR)} stroke={COL_R} strokeWidth={2}/>
                      {/* static 1g operating point */}
                      {gMax>=1&&<circle cx={xS(1)} cy={yS(sagF)} r={1.8} fill="#0a0f1a" stroke={COL_F} strokeWidth={1.3}/>}
                      {gMax>=1&&<circle cx={xS(1)} cy={yS(sagR)} r={1.8} fill="#0a0f1a" stroke={COL_R} strokeWidth={1.3}/>}
                      {/* bottom-out markers, only if reached within the plotted range */}
                      {gBottomF<=gMax&&<circle cx={xS(gBottomF)} cy={yS(rhF)} r={2.5} fill={COL_F}/>}
                      {gBottomR<=gMax&&<circle cx={xS(gBottomR)} cy={yS(rhR)} r={2.5} fill={COL_R}/>}
                    </svg>
                    <div style={{display:'flex',flexDirection:'column',gap:2,fontFamily:'var(--font-mono)'}}>
                      <div style={{display:'flex',gap:12}}>
                        <span style={{fontSize:9,color:COL_F}}>{gBottomF<=gMax?`bottoms ≈${gBottomF.toFixed(1)}g`:`no bottom ≤${gMax.toFixed(1)}g`}</span>
                        <span style={{fontSize:9,color:COL_R}}>{gBottomR<=gMax?`bottoms ≈${gBottomR.toFixed(1)}g`:`no bottom ≤${gMax.toFixed(1)}g`}</span>
                      </div>
                      <div style={{display:'flex',gap:12}}>
                        <span style={{fontSize:9,color:COL_F,opacity:0.75}}>{isFinite(gBottomOutF)&&gBottomOutF<=gMax?`outside ≈${gBottomOutF.toFixed(1)}g lat`:'outside: no bottom'}</span>
                        <span style={{fontSize:9,color:COL_R,opacity:0.75}}>{isFinite(gBottomOutR)&&gBottomOutR<=gMax?`outside ≈${gBottomOutR.toFixed(1)}g lat`:'outside: no bottom'}</span>
                      </div>
                    </div>
                  </div>}
                </>);
              })()}
            </div>
          </Sec>
        </div>}
        </div>

        {/* OUTPUT PANEL */}
        <div style={{flex:1,display:'flex',flexDirection:'column',background:'#020617',minHeight:0}}>

          {/* cards — scrollable */}
          <div id="zone-output" style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',overscrollBehavior:'contain',padding:'8px 10px 6px',minHeight:0,...dim('output')}}>
          {/* No maxWidth cap: the output is now full-width rows rather than columns of
              mini-cards, so a wide monitor should use the width instead of leaving dead
              margin either side. containerType lets the BeamNG grid below query this div's
              own rendered width (not the viewport's) to decide when to collapse to 1 column —
              see the .beamng-grid rule in <style>. */}
          <div style={{containerType:'inline-size'}}>

          {/* Forza (horizon/motorsport): the original six full-width, single-column cards,
              unchanged. BeamNG gets its own two-column layout below instead — see physMode
              branch. Nothing in here renders in a physical game mode, so it carries no
              physMode branches: BeamNG wording belongs on the SuspensionCard layout. */}
          {!physMode&&(<>
          {/* 1 — ALIGNMENT */}
          <Card title="ALIGNMENT"
            hint={(()=>{
              const _camberStr={street:'-1.0°',track:'-1.5°',drift:'-2.5°',rally:'-0.8°',offroad:'-0.3°',drag:'-0.2°'}[dr.buildType??'track']??'-1.5°';
              const _prefix=alignMode==='manual'?'Manual values.':'Recommended starting point.';
              return ch.layout==='FWD'
                ?`${_prefix} Camber targets ${_camberStr} dynamic. FWD front camber reduced for traction. Leans to toe-in for stability.`
                :`${_prefix} Camber targets ${_camberStr} dynamic at ${tune.rollDeg.toFixed(2)}° roll. Front leans toe-out on TRACK/DRIFT; rear toe-in except on DRAG.`;
            })()} hintTerm="align-mode">

            <RowGroup>
              <OutRow label="Camber Front" value={align.recCamberF} unit="°"/>
              <OutRow label="Camber Rear"  value={align.recCamberR} unit="°"/>
            </RowGroup>
            <RowGroup>
              <OutRow label="Toe Front" value={align.recToeF} unit="°"/>
              <OutRow label="Toe Rear"  value={align.recToeR} unit="°"/>
            </RowGroup>
            <RowGroup style={{marginBottom:0}}>
              <OutRow label="Caster" value={align.recCaster} unit="°"/>
            </RowGroup>
          </Card>

          {/* 2 — ANTI-ROLL BARS (full width; previously half of a 2-column grid) */}
          <Card title="ANTI-ROLL BARS" accent
            headerRight={`ROLL ${tune.rollDeg.toFixed(2)}°`}
            hint="Click values to enter in the game's ARB menu. Amber means above 88% of the game's limit." hintTerm="arb">

            <RowGroup style={{marginBottom:0}}>
              {[['Front',tune.arbF,tune.rsAbF,tune.rsSpF,ch.trackF,'front',ch.arbMotionRatioF],
                ['Rear', tune.arbR,tune.rsAbR,tune.rsSpR,ch.trackR,'rear',ch.arbMotionRatioR]].map(([lbl,v,rsAb,rsSp,track,side,arbMr])=>{
                const o=arbOut(v,lim,track,arbMr);
                const c=arbCtx(v,lim.arb);
                return <OutRow key={lbl} label={lbl} value={o.value} decimals={o.decimals}
                  warn={warnOver(v,lim.arb)} unit={o.unit}
                  note={c?c[0]:null} noteColor={c?c[1]:undefined}
                  meta={[
                    `${Math.round(rsAb/(rsSp+rsAb)*100)}% roll`,
                    `${Math.round(rsAb/(tune.rsAbF+tune.rsAbR)*100)}% ARB`,
                  ]}/>;
              })}
            </RowGroup>
            {tune.rollClamped&&<div style={{fontSize:11,color:'#f59e0b',lineHeight:1.6,
                 marginTop:8,padding:'6px 8px',background:'#020617',borderRadius:2,
                 border:'1px solid #f5a62333'}}>
              Target {tune.rollTarget.toFixed(2)}° couldn't be reached{lim.arb!=null?` within the 1–${lim.arb} range`:''} —
              achieved {tune.rollDeg.toFixed(2)}°. {tune.rollDeg>tune.rollTarget
                ?'Bars are maxed; stiffer springs would reduce roll further.'
                :'Springs alone already exceed the target; softer springs give the bars room.'} <TermLink id="output-warnings"/>
            </div>}
            {tune.mechBalClamped&&<div style={{fontSize:11,color:'#f97316',lineHeight:1.6,
                 marginTop:8,padding:'6px 8px',background:'#020617',borderRadius:2,
                 border:'1px solid #f9731633'}}>
              Mech balance target ({feEffective.arbBalTarget.toFixed(2)}) couldn't be reached —
              achieved {tune.mechBalance.toFixed(2)}.{mechReachNote({tune,target:feEffective.arbBalTarget,arbMode,arbBalMode,springShareAuto:fe.springShareAuto!==false,arbLim:lim.arb})} <TermLink id="output-warnings"/>
            </div>}
          </Card>

          <Card title="SPRINGS" accent
            hint={`Spring rates in the spring unit chosen in UNITS to enter in the tuning menu. Badge = stiffness band (SOFT/ROAD/FIRM/RACE); REAR × = rear Hz ÷ front Hz.`}
            headerRight={`REAR ×${(tune.rHz/tune.fHz).toFixed(2)}`} hintTerm="spring-rate">

            {(()=>{
              // Spring's own share of each axle's total roll stiffness (springs+ARB) —
              // complements the ARB card's own "% of front/rear roll" line.
              const springPctF=Math.round(tune.rsSpF/(tune.rsSpF+tune.rsAbF)*100);
              const springPctR=Math.round(tune.rsSpR/(tune.rsSpR+tune.rsAbR)*100);
              const rows=[['Front',tune.springF,ch.motionRatioF,tune.fHz,springPctF,'front'],
                          ['Rear', tune.springR,ch.motionRatioR,tune.rHz,springPctR,'rear']];
              return(
                <RowGroup style={{marginBottom:0}}>
                  {rows.map(([lbl,spring,mr,hz,pct,side])=>{
                    const o=springOut(spring,fe.gameMode,mSpring,mr);
                    const c=hzCtx(hz);
                    return <OutRow key={lbl} label={lbl} value={o.value} unit={o.unit} decimals={o.decimals}
                      note={c?c[0]:null} noteColor={c?c[1]:undefined}
                      meta={[`${pct}% roll`,`${hz.toFixed(2)} Hz`]}/>;
                  })}
                </RowGroup>
              );
            })()}
            {hzClampNote&&<div style={{fontSize:11,color:'#f59e0b',lineHeight:1.6,
                 marginTop:8,padding:'6px 8px',background:'#020617',borderRadius:2,
                 border:'1px solid #f5a62333'}}>
              {hzClampNote} <TermLink id="output-warnings"/>
            </div>}
            {tune.coSolveLiftRisk&&<div style={{fontSize:11,color:'#f59e0b',lineHeight:1.6,
                 marginTop:8,padding:'6px 8px',background:'#020617',borderRadius:2,
                 border:'1px solid #f5a62333'}}>
              Rear springs are much stiffer than front ({tune.rHz.toFixed(2)} vs {tune.fHz.toFixed(2)} Hz), risking inside rear wheel lift in hard corners.
              {(fe.springShareAuto!==false)?' Lower the mech balance target or switch to MECH mode.'
                :' Lower Spring Share or enable AUTO.'} <TermLink id="output-warnings"/>
            </div>}
          </Card>

          {/* 4 — DAMPERS */}
          {/* headerRight: F/R bias is the front axle's share of total ζ, not the raw
              dampingBias input — 50% is balanced, above is front-biased. Unlike the raw input it stays
              truthful under SYNC/NEUTRAL Damping Balance Mode or SETTLE TIME character mode,
              where the Damping Bias slider drives a Hz/mass-aware split instead of a raw %.
              Bump Ratio is only actually applied in 'ratio' damping mode; under
              INDEPENDENT the bump ζ is set directly, so showing a ratio there would be a lie. */}
          <Card title="DAMPERS" accent
            headerRight={`F/R BIAS ${(()=>{const zF=tune.zetaF??physics.zetaF,tot=zF+(tune.zetaR??physics.zetaR);
                return tot>0?Math.round(zF/tot*100):50;})()}% F  ·  ${
              (physics.dampingMode??'ratio')==='ratio'
                ?`BUMP RATIO ${physics.bumpRatioVal??56}%`
                :`BUMP ${Math.round(physics.bumpZeta??39)}% ζ`}`}
            hint="Rebound and bump click values for the game's damping menu. Amber means above 88% of the game's limit. F/R BIAS = front share of damping: 50% is balanced, above is front-biased." hintTerm="rebound">

            {(()=>{
              // Matches the RIDE section's existing readouts, which warn on >100 only.
              // The 40% "UNDER" tick on the Rebound ζ slider is a scale marker, not a warning,
              // and it is rebound-specific: the default Bump Ratio of 56% yields a bump ζ near
              // 39%, so treating <40 as a fault would flag the app's own default as broken.
              // Underdamped is therefore only called out on the rebound rows.
              const zNote=(z,isReb)=>z>100?'⚠ OVERDAMPED':(isReb&&z<40?'⚠ UNDERDAMPED':null);
              const row=([lbl,v,z,mr,settle,isReb])=>{
                const o=dampOut(v,lim,mr);
                return <OutRow key={lbl} label={lbl} value={o.value} decimals={o.decimals}
                  warn={warnOver(v,lim.damping)} unit={o.unit} note={zNote(z,isReb)}
                  meta={[settle!=null?`${settle.toFixed(2)}s settle`:null,`${z.toFixed(0)}% ζ`]}/>;
              };
              return(<>
                <RowGroup>
                  {row(['Front Rebound',tune.rebF,tune.zetaF,ch.motionRatioF,tune.settleF,true])}
                  {row(['Rear Rebound', tune.rebR,tune.zetaR,ch.motionRatioR,tune.settleR,true])}
                </RowGroup>
                <RowGroup style={{marginBottom:0}}>
                  {/* Settle time is a property of the rebound stroke (ln(10)/(ζ·ωn) uses the
                      rebound ζ), so it is deliberately not repeated on the bump rows. */}
                  {row(['Front Bump',tune.bumpF,tune.bumpZetaF,ch.motionRatioF,null,false])}
                  {row(['Rear Bump', tune.bumpR,tune.bumpZetaR,ch.motionRatioR,null,false])}
                </RowGroup>
              </>);
            })()}
            {tune.dampingClamped&&<div style={{fontSize:11,color:'#f59e0b',lineHeight:1.6,
                 marginTop:8,padding:'6px 8px',background:'#020617',borderRadius:2,
                 border:'1px solid #f5a62333'}}>
              Dampers scaled to fit within 1–{lim.damping}, keeping the F/R ratio. {uiMode==='beginner'?'Move Character toward AGILE to restore the feel.':'Lower Rebound ζ or Bump Ratio to restore the character.'} <TermLink id="output-warnings"/>
            </div>}
          </Card>

          {/* 5 — BRAKES */}
          <Card title="BRAKES"
            hint="Brake balance starting point. Higher front bias adds entry understeer; lower adds rotation. Fine-tune in 1% steps by feel." hintTerm="brake-balance">

            {(()=>{
              const c=brakeBias>55?['FRONT','#3b82f6']:brakeBias<50?['REAR','#ef4444']:['NEUTRAL','#cbd5e1'];
              return(
                <RowGroup style={{marginBottom:0}}>
                  <OutRow label="Balance" value={brakeBias} unit="% F" note={c[0]} noteColor={c[1]}/>
                </RowGroup>
              );
            })()}
          </Card>

          {/* 6 — DIFFERENTIAL */}
          <Card title="DIFFERENTIAL"
            hint={diff.layout==='FWD'
              ?'Starting point; fine-tune in 1% steps. More accel lock adds exit traction and understeer. Decel near zero frees entry rotation.'
              :diff.layout==='RWD'
              ?'Starting point; fine-tune in 1% steps. More accel lock adds exit rotation. Low decel helps entry rotation; raise it for lift-off stability.'
              :`Starting point; fine-tune in 1% steps. Front decel at 0 minimises entry understeer; keep rear decel low for rotation. Center ${diff.center}% rear.`}
            headerRight={`${({race:'RACE',sport:'SPORT',rally:'RALLY',offroad:'OFFROAD',drift:'DRIFT'})[dr.diffType??'race']??'RACE'} DIFF`} hintTerm="diff-output">
            {(()=>{
              // SPORT is accel-only in-game, so every decel field reads N/A rather than a
              // number the tuning menu won't accept.
              const isSport=(dr.diffType??'race')==='sport';
              const lock=(label,v,unit='%')=>{
                if(isSport&&/Decel|Split/.test(label))
                  return <OutRow key={label} label={label} value="N/A" unit=""/>;
                const c=diffCtx(v);
                return <OutRow key={label} label={label} value={v} unit={unit} decimals={0}
                  note={c?c[0]:null} noteColor={c?c[1]:undefined}/>;
              };
              // AWD genuinely has three differentials (front, rear, centre); FWD/RWD have one,
              // so they get two rows and no split — there is no axle split to show.
              return diff.layout==='AWD'?(
              <>
                <RowGroup>
                  {lock('Front Accel',diff.frontAccel)}
                  {lock('Front Decel',diff.frontDecel)}
                </RowGroup>
                <RowGroup>
                  {lock('Rear Accel',diff.rearAccel)}
                  {lock('Rear Decel',diff.rearDecel)}
                </RowGroup>
                <RowGroup style={{marginBottom:0}}>
                  {lock('Center Split',diff.center,'% rear')}
                </RowGroup>
              </>
            ):(
              <RowGroup style={{marginBottom:0}}>
                {lock('Accel Lock',diff.accel)}
                {lock('Decel Lock',diff.decel)}
              </RowGroup>
            );})()}
            {/* Recommendation call-outs. The per-axle US/OS bias strip that used to sit here
                was removed: the same information is already in the footer's Handling Balance
                contributions breakdown (SPR/ARB/DIFF/BRK), so it was duplicated, not lost. */}
            {(()=>{
              const curType=dr.diffType??'race';
              const recType=recommendedDiffType;
              const recMatch=curType===recType;
              const recLabel={race:'Race',sport:'Sport',rally:'Rally',offroad:'Offroad',drift:'Drift'}[recType];
              const recReason={
                race:'sharpest, most predictable lock — best for grip driving',
                sport:'accel-only lock — clean exit traction without decel snap',
                rally:'softer lock curve — suited to mixed-surface transitions',
                offroad:'most compliant — low-traction stability and forgiveness',
                drift:'most aggressive engagement — maximises rotation and wheelspin',
              }[recType];
              const buildLabel={track:'TRACK',street:'STREET',drift:'DRIFT',rally:'RALLY',offroad:'OFFROAD',drag:'DRAG'}[dr.buildType??'track']??'TRACK';
              const isAWD=diff.layout==='AWD';
              const curCenter=dr.diffCenter??65;
              const centerMatch=curCenter===recommendedCenter;
              const centerReasons={street:'mild rear bias — comfortable AWD character',track:'rear-weighted for rotation and exit drive',drift:'very rear-heavy — maximises rotation and wheelspin',rally:'more neutral — front traction on mixed surfaces',offroad:'slight front bias — stability on loose and uneven ground',drag:'rear-heavy for straight-line launch traction'};
              // CENTER SPLIT is its own box to the right of RECOMMENDED rather than a
              // section stacked inside it. FWD/RWD (and SPORT, which has no centre lock)
              // have no split, so RECOMMENDED simply keeps the full width there.
              const showSplit=isAWD&&(dr.diffType??'race')!=='sport';
              const box={flex:'1 1 240px',minWidth:0,padding:'6px 8px',
                         background:'#0f172a',borderRadius:2,border:'1px solid #1e293b'};
              if(uiMode==='beginner')return null;
              return(
                <div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:6}}>
                  <div style={box}>
                    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:recMatch?0:4}}>
                      <span style={{fontSize:10,color:'#475569',letterSpacing:1}}>RECOMMENDED</span>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:11,fontWeight:700,
                        color:recMatch?'#22c55e':'#f59e0b',marginLeft:'auto'}}>
                        {recLabel.toUpperCase()}
                      </span>
                      {!recMatch&&<button className="tbtn" style={{fontSize:9,color:'#60a5fa',padding:'2px 6px'}}
                        onClick={()=>setDr(p=>({...p,diffType:recType}))}>
                        → USE {recType.toUpperCase()}
                      </button>}
                    </div>
                    <div style={{fontSize:10,color:recMatch?'#334155':'#475569',lineHeight:1.5}}>
                      {buildLabel} build → {recLabel}: {recReason}.
                    </div>
                  </div>
                  {showSplit&&<div style={box}>
                    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:centerMatch?0:4}}>
                      <span style={{fontSize:10,color:'#475569',letterSpacing:1}}>CENTER SPLIT</span>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:11,fontWeight:700,
                        color:centerMatch?'#22c55e':'#f59e0b',marginLeft:'auto'}}>
                        {recommendedCenter}% REAR
                      </span>
                      {!centerMatch&&<button className="tbtn" style={{fontSize:9,color:'#60a5fa',padding:'2px 6px'}}
                        onClick={()=>setDr(p=>({...p,diffCenter:recommendedCenter}))}>
                        → USE {recommendedCenter}%
                      </button>}
                    </div>
                    <div style={{fontSize:10,color:centerMatch?'#334155':'#475569',lineHeight:1.5}}>
                      {buildLabel} build → {recommendedCenter}% rear: {centerReasons[dr.buildType??'track']}.
                      {uiMode==='pro'&&(_weightAdj!==0||_diamAdj!==0||_natAdj!==0)&&<div style={{fontSize:9,color:centerMatch?'#1e293b':'#334155',marginTop:2}}>
                        base {_baseCenter}%{_weightAdj!==0?` · weight ${_weightAdj>0?'+':''}${_weightAdj}%`:''}{_diamAdj!==0?` · tyres ${_diamAdj>0?'+':''}${_diamAdj}%`:''}{_natAdj!==0?` · balance ${_natAdj>0?'+':''}${_natAdj}%`:''}
                      </div>}
                    </div>
                  </div>}
                </div>
              );
            })()}
          </Card>
          </>)}

          {/* BeamNG: two-column, per-axle layout matching BeamNG's own tuning-menu grouping
              (Differentials/Suspension/Alignment, each Front then Rear) instead of Forza's
              menu order. Same computed values as the six cards above (tune/align/diff/etc.),
              just regrouped — no new physics. See docs/CODE_MAP.md. */}
          {physMode&&(()=>{
            const isAWD=diff.layout==='AWD';
            const isFWD=diff.layout==='FWD';
            const isRWD=diff.layout==='RWD';
            const isSport=(dr.diffType??'race')==='sport';

            // Cross-axle callouts lifted out of the ARB/SPRINGS/DAMPERS cards being merged/
            // split below — these compare front vs rear, so they don't belong to one axle.
            const warnBox=(key,color,text)=>(
              <div key={key} style={{fontSize:11,color,lineHeight:1.6,marginTop:8,
                   padding:'6px 8px',background:'#020617',borderRadius:2,border:`1px solid ${color}33`}}>
                {text}
              </div>
            );
            const warnings=[];
            if(tune.rollClamped)warnings.push(warnBox('roll','#f59e0b',<>
              Target {tune.rollTarget.toFixed(2)}° couldn't be reached{lim.arb!=null?` within the 1–${lim.arb} range`:''} —
              achieved {tune.rollDeg.toFixed(2)}°. {tune.rollDeg>tune.rollTarget
                ?'Bars are maxed; stiffer springs would reduce roll further.'
                :'Springs alone already exceed the target; softer springs give the bars room.'} <TermLink id="output-warnings"/>
            </>));
            if(tune.mechBalClamped)warnings.push(warnBox('mechbal','#f97316',<>
              Mech balance target ({feEffective.arbBalTarget.toFixed(2)}) couldn't be reached —
              achieved {tune.mechBalance.toFixed(2)}.{mechReachNote({tune,target:feEffective.arbBalTarget,arbMode,arbBalMode,springShareAuto:fe.springShareAuto!==false,arbLim:physMode?null:lim.arb})} <TermLink id="output-warnings"/>
            </>));
            if(hzClampNote)warnings.push(warnBox('rearhz','#f59e0b',<>{hzClampNote} <TermLink id="output-warnings"/></>));
            if(tune.coSolveLiftRisk)warnings.push(warnBox('lift','#f59e0b',<>
              Rear springs are much stiffer than front ({tune.rHz.toFixed(2)} vs {tune.fHz.toFixed(2)} Hz), risking inside rear wheel lift in hard corners.
              {(fe.springShareAuto!==false)?' Lower the mech balance target or switch to MECH mode.'
                :' Lower Spring Share or enable AUTO.'} <TermLink id="output-warnings"/>
            </>));
            if(tune.dampingClamped)warnings.push(warnBox('damp','#f59e0b',<>
              Dampers scaled to fit within 1–{lim.damping}, keeping the F/R ratio. {uiMode==='beginner'?'Move Character toward AGILE to restore the feel.':'Lower Rebound ζ or Bump Ratio to restore the character.'} <TermLink id="output-warnings"/>
            </>));

            // Per-axle suspension rows — same arbOut/springOut/dampOut/arbCtx/hzCtx/warnOver
            // functions the Forza cards above call, just assembled into row-prop objects
            // instead of inline OutRows, since SuspensionCard merges three subsystems into one.
            const buildArbRow=(side,v,rsAb,rsSp,track,arbMr)=>{
              const o=arbOut(v,lim,track,arbMr);
              const c=arbCtx(v,lim.arb);
              return {label:'Anti-Roll',value:o.value,decimals:o.decimals,warn:warnOver(v,lim.arb),unit:o.unit,
                note:c?c[0]:null,noteColor:c?c[1]:undefined,
                meta:[`${Math.round(rsAb/(rsSp+rsAb)*100)}% roll`,`${Math.round(rsAb/(tune.rsAbF+tune.rsAbR)*100)}% ARB`]};
            };
            const buildSpringRow=(side,spring,mr,hz,pct)=>{
              const o=springOut(spring,fe.gameMode,mSpring,mr);
              const c=hzCtx(hz);
              return {label:'Spring',value:o.value,unit:o.unit,decimals:o.decimals,
                note:c?c[0]:null,noteColor:c?c[1]:undefined,meta:[`${pct}% roll`,`${hz.toFixed(2)} Hz`]};
            };
            const zNote=(z,isReb)=>z>100?'⚠ OVERDAMPED':(isReb&&z<40?'⚠ UNDERDAMPED':null);
            const buildDampRow=(lbl,v,z,mr,settle,isReb)=>{
              const o=dampOut(v,lim,mr);
              return {label:lbl,value:o.value,decimals:o.decimals,warn:warnOver(v,lim.damping),unit:o.unit,note:zNote(z,isReb),
                meta:[settle!=null?`${settle.toFixed(2)}s settle`:null,`${z.toFixed(0)}% ζ`]};
            };

            const springPctF=Math.round(tune.rsSpF/(tune.rsSpF+tune.rsAbF)*100);
            const springPctR=Math.round(tune.rsSpR/(tune.rsSpR+tune.rsAbR)*100);
            const suspHint="Values in BeamNG's own units: N/m for Anti-Roll and Spring, N/m/s for the dampers. Anti-Roll reads soft; see the note under that row.";
            const arbCaveat=(ch.arbMotionRatioF??1)===1&&(ch.arbMotionRatioR??1)===1
              ?(uiMode==='pro'
                ?"Reads ~4–6× soft at ARB Motion Ratio 1.0. Set the ratio in CHASSIS (arm ÷ track, typically 0.4–0.5) if you know the geometry."
                :"Reads ~4–6× soft: BeamNG rates the bar at its own lever, so treat it as a direction.")
              :null;

            const frontSuspension=<SuspensionCard side="FRONT" hint={suspHint} arbCaveat={arbCaveat}
              arbRow={buildArbRow('front',tune.arbF,tune.rsAbF,tune.rsSpF,ch.trackF,ch.arbMotionRatioF)}
              springRow={buildSpringRow('front',tune.springF,ch.motionRatioF,tune.fHz,springPctF)}
              dampRebRow={buildDampRow('Rebound',tune.rebF,tune.zetaF,ch.motionRatioF,tune.settleF,true)}
              dampBumpRow={buildDampRow('Bump',tune.bumpF,tune.bumpZetaF,ch.motionRatioF,null,false)} hintTerm="beamng-output"/>;
            const rearSuspension=<SuspensionCard side="REAR" hint={suspHint} arbCaveat={arbCaveat}
              arbRow={buildArbRow('rear',tune.arbR,tune.rsAbR,tune.rsSpR,ch.trackR,ch.arbMotionRatioR)}
              springRow={buildSpringRow('rear',tune.springR,ch.motionRatioR,tune.rHz,springPctR)}
              dampRebRow={buildDampRow('Rebound',tune.rebR,tune.zetaR,ch.motionRatioR,tune.settleR,true)}
              dampBumpRow={buildDampRow('Bump',tune.bumpR,tune.bumpZetaR,ch.motionRatioR,null,false)} hintTerm="beamng-output"/>;

            // Alignment — same degree targets as Forza, but BeamNG's Camber/Caster/Toe Adjust
            // sliders are % of a per-vehicle Jbeam range, not degrees, and that % shifts if
            // Spring Height changes afterward (ride height affects the camber curve). Live
            // tuning-screen readout confirmed real-time as of BeamNG 0.39.
            const alignPrefix=(()=>{
              const _camberStr={street:'-1.0°',track:'-1.5°',drift:'-2.5°',rally:'-0.8°',offroad:'-0.3°',drag:'-0.2°'}[dr.buildType??'track']??'-1.5°';
              const _prefix=alignMode==='manual'?'Manual values.':'Recommended starting point.';
              return ch.layout==='FWD'
                ?`${_prefix} Camber targets ${_camberStr} dynamic. FWD front camber reduced for traction. Leans to toe-in for stability.`
                :`${_prefix} Camber targets ${_camberStr} dynamic at ${tune.rollDeg.toFixed(2)}° roll. Front leans toe-out on TRACK/DRIFT; rear toe-in except on DRAG.`;
            })();
            const beamngAlignHint=`${alignPrefix} Sliders are %, not degrees: match BeamNG's live readout.`;

            const frontAlign=<AlignCard side="FRONT" camber={align.recCamberF} toe={align.recToeF} caster={align.recCaster} hint={beamngAlignHint} hintTerm="beamng-output"/>;
            const rearAlign=<AlignCard side="REAR" camber={align.recCamberR} toe={align.recToeR} caster={null} hint={beamngAlignHint} hintTerm="beamng-output"/>;

            // Differential — same isSport/lock/diffCtx pattern as the Forza card, scoped per
            // axle since BeamNG groups Front/Rear/Center as separate menu sections. Placement
            // is axle-matched: FWD's single diff sits in the front column, RWD's in the rear.
            const lock=(label,v,unit='%')=>{
              if(isSport&&/Decel|Split/.test(label))return <OutRow key={label} label={label} value="N/A" unit=""/>;
              const c=diffCtx(v);
              return <OutRow key={label} label={label} value={v} unit={unit} decimals={0}
                note={c?c[0]:null} noteColor={c?c[1]:undefined}/>;
            };
            const frontDiff=(isAWD||isFWD)&&<DiffCard title="FRONT DIFFERENTIAL"
              rows={isAWD?[lock('Accel',diff.frontAccel),lock('Decel',diff.frontDecel)]:[lock('Accel',diff.accel),lock('Decel',diff.decel)]}/>;
            const rearDiff=(isAWD||isRWD)&&<DiffCard title="REAR DIFFERENTIAL"
              rows={isAWD?[lock('Accel',diff.rearAccel),lock('Decel',diff.rearDecel)]:[lock('Accel',diff.accel),lock('Decel',diff.decel)]}/>;

            // Center split — combines diff.center with its recommendation call-out, AWD only.
            // No RECOMMENDED-diff-type box here: that race/sport/rally/offroad/drift system is
            // a Forza concept and doesn't apply to BeamNG (Forza's DIFFERENTIAL card keeps it).
            const centerSplit=isAWD&&(()=>{
              const curCenter=dr.diffCenter??65;
              const centerMatch=curCenter===recommendedCenter;
              const buildLabel={track:'TRACK',street:'STREET',drift:'DRIFT',rally:'RALLY',offroad:'OFFROAD',drag:'DRAG'}[dr.buildType??'track']??'TRACK';
              const centerReasons={street:'mild rear bias — comfortable AWD character',track:'rear-weighted for rotation and exit drive',drift:'very rear-heavy — maximises rotation and wheelspin',rally:'more neutral — front traction on mixed surfaces',offroad:'slight front bias — stability on loose and uneven ground',drag:'rear-heavy for straight-line launch traction'};
              return (
                <Card title="CENTER SPLIT">
                  <RowGroup style={{marginBottom:uiMode==='beginner'?0:6}}>
                    {lock('Base Torque Split',diff.center,'% rear')}
                  </RowGroup>
                  {uiMode!=='beginner'&&<div style={{padding:'6px 8px',background:'#0f172a',borderRadius:2,border:'1px solid #1e293b'}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:centerMatch?0:4}}>
                      <span style={{fontSize:10,color:'#475569',letterSpacing:1}}>RECOMMENDED</span>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:11,fontWeight:700,
                        color:centerMatch?'#22c55e':'#f59e0b',marginLeft:'auto'}}>
                        {recommendedCenter}% REAR
                      </span>
                      {!centerMatch&&<button className="tbtn" style={{fontSize:9,color:'#60a5fa',padding:'2px 6px'}}
                        onClick={()=>setDr(p=>({...p,diffCenter:recommendedCenter}))}>
                        → USE {recommendedCenter}%
                      </button>}
                    </div>
                    <div style={{fontSize:10,color:centerMatch?'#334155':'#475569',lineHeight:1.5}}>
                      {buildLabel} build → {recommendedCenter}% rear: {centerReasons[dr.buildType??'track']}.
                      {uiMode==='pro'&&(_weightAdj!==0||_diamAdj!==0||_natAdj!==0)&&<div style={{fontSize:9,color:centerMatch?'#1e293b':'#334155',marginTop:2}}>
                        base {_baseCenter}%{_weightAdj!==0?` · weight ${_weightAdj>0?'+':''}${_weightAdj}%`:''}{_diamAdj!==0?` · tyres ${_diamAdj>0?'+':''}${_diamAdj}%`:''}{_natAdj!==0?` · balance ${_natAdj>0?'+':''}${_natAdj}%`:''}
                      </div>}
                    </div>
                  </div>}
                </Card>
              );
            })();

            const brakesCard=(()=>{
              const c=brakeBias>55?['FRONT','#3b82f6']:brakeBias<50?['REAR','#ef4444']:['NEUTRAL','#cbd5e1'];
              return (
                <Card title="BRAKES" hint="Brake balance starting point. Higher front bias adds entry understeer; lower adds rotation. Fine-tune in 1% steps by feel." hintTerm="brake-balance">
                  <RowGroup style={{marginBottom:0}}>
                    <OutRow label="Balance" value={brakeBias} unit="% F" note={c[0]} noteColor={c[1]}/>
                  </RowGroup>
                </Card>
              );
            })();

            return (<>
              <div style={{display:'flex',flexWrap:'wrap',gap:12,alignItems:'center',
                           padding:'6px 8px',background:'#0f172a',border:'1px solid #1e293b',
                           borderRadius:2,marginBottom:10,fontSize:10,color:'#64748b',
                           fontFamily:'var(--font-mono)'}}>
                <span>ROLL {tune.rollDeg.toFixed(2)}°</span>
                <span>REAR ×{(tune.rHz/tune.fHz).toFixed(2)}</span>
                <span>F/R BIAS {(()=>{const zF=tune.zetaF??physics.zetaF,tot=zF+(tune.zetaR??physics.zetaR);
                  return tot>0?Math.round(zF/tot*100):50;})()}% F</span>
                <span>{(physics.dampingMode??'ratio')==='ratio'
                  ?`BUMP RATIO ${physics.bumpRatioVal??56}%`
                  :`BUMP ${Math.round(physics.bumpZeta??39)}% ζ`}</span>
                {warnings.length>0&&<div style={{flexBasis:'100%'}}>{warnings}</div>}
              </div>
              {/* Fixed 4-row × 2-column grid (Brakes/Center, Front/Rear Diff, Front/Rear
                  Suspension, Front/Rear Alignment). DOM order is row-major, so collapsing to
                  one column at narrow widths (auto-fit) reproduces the PDF's own top-to-bottom
                  order for free — no separate mobile branch needed. */}
              <div className="beamng-grid">

            const doCopy=()=>copyToClipboard(sharePayload,()=>setShareCopied('code'));

                <div style={{position:'relative',marginBottom:14}}>
                  <select value={dataMode} onChange={e=>{setDataMode(e.target.value);setShareCopied(false);setImportErr('');setRestoreData(null);setRestoreErr('');}}
                    style={selectStyle}>
                    <option value="share">COPY CODE — generate a tune code</option>
                    <option value="load">LOAD CODE — load from a tune code</option>
                    <option value="backup">BACKUP — download saved data</option>
                    <option value="restore">RESTORE — load from a backup file</option>
                  </select>
                  <span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',
                                color:'#475569',pointerEvents:'none',fontSize:10}}>▾</span>
                </div>
                {(()=>{
                  const hints={
                    share:'A code for the current tune. COPY LINK puts the same code in a URL that opens SUSP.OS ready to load. Garage entries are not included.',
                    load:'Paste a code or link, then READ CODE. Nothing changes until APPLY SELECTED, and only ticked parts are taken. TO GARAGE saves the result as a new entry instead.',
                    backup:'Downloads your garage entries as a JSON file. The unsaved current tune is not included.',
                    restore:'Loads garage entries from a backup file. Ticked kinds replace yours for good, so RESTORE takes two taps. The current tune is not touched.',
                  };
                  return<div style={{fontSize:10,color:'#94a3b8',lineHeight:1.6,marginBottom:12,letterSpacing:0.3}}>{hints[dataMode]} <TermLink id={dataMode==='backup'||dataMode==='restore'?'backup':'share-code'}/></div>;
                })()}

                {/* SHARE */}
                {dataMode==='share'&&(<>
                  <div style={{fontSize:9,letterSpacing:2,color:'#475569',marginBottom:6}}>INCLUDE</div>
                  {[
                    {key:'ch',label:'CHASSIS',sub:'Weight · bias · tyres · geometry · layout'},
                    {key:'fe',label:'FEEL',sub:'Ride · damping · ARB · balance'},
                    {key:'dr',label:'DRIVETRAIN',sub:'Build type · diff'},
                  ].map(({key,label,sub})=>chkRow(key,label,sub,shareSel[key],
                    e=>{setShareSel(s=>({...s,[key]:e.target.checked}));setShareCopied(false);}))}
                  <textarea readOnly value={sharePayload} rows={3} onFocus={e=>e.target.select()}
                    style={{width:'100%',background:'#020617',border:'1px solid #1e293b',borderRadius:2,
                            padding:'6px 8px',fontSize:10,color:'#e2e8f0',outline:'none',resize:'none',
                            fontFamily:'var(--font-mono)',letterSpacing:0.5,marginTop:10,marginBottom:6,cursor:'text'}}/>
                  <div style={{fontSize:9,color:'#475569',marginBottom:12,letterSpacing:0.5}}>
                    Paste into LOAD CODE on any device, or send the link.
                  </div>
                  <div style={{display:'flex',gap:6}}>
                    <button className="tbtn" style={{flex:1,fontSize:10}} onClick={close}>CLOSE</button>
                    <button className={`tbtn${shareCopied==='code'?' saved':' on'}`} style={{flex:1,fontSize:10}}
                      onClick={doCopy}>{shareCopied==='code'?'COPIED':'COPY CODE'}</button>
                    <button className={`tbtn${shareCopied==='link'?' saved':''}`} style={{flex:1,fontSize:10}}
                      onClick={doCopyLink}>{shareCopied==='link'?'COPIED':'COPY LINK'}</button>
                  </div>
                </>)}

                {/* LOAD CODE */}
                {dataMode==='load'&&(()=>{
                  // The picker is always on screen. With nothing staged it summarises the
                  // user's OWN values, so the ticks read as "what a code may touch"; once a
                  // code is staged it summarises the code's values and tags the parts that
                  // already match. Staging never moves a tick — see importSel/pending in App.
                  const cur={ch,fe,dr};
                  const src=pending?pending.tune:cur;
                  const r1=v=>Math.round(v*10)/10;
                  const up=v=>String(v??'').toUpperCase();
                  const summary={
                    ch:  t=>`${Math.round(t.ch.weight)} lb · ${r1(t.ch.frontBias)}% front · ${t.ch.tyreF}`,
                    ride:t=>`${r1(t.fe.rideStiffness)} Hz · rear ${up(t.fe.rearHzMode)}`,
                    damp:t=>`${Math.round(t.fe.reboundZeta)}% ζ · bump ${Math.round(t.fe.bumpRatio)}% · ${up(t.fe.dampBalMode)}`,
                    arb: t=>`${up(t.fe.arbMode)} · bias ${Math.round(t.fe.arbBias)} · spring ${Math.round(t.fe.springShare)}%`,
                    dr:  t=>`${up(t.dr.buildType)} · ${up(t.dr.diffType)} diff`,
                  };
                  const none=!SHARE_PART_IDS.some(id=>importSel[id]);
                  // arbManF/arbManR are the only codec fields whose UNITS depend on another
                  // part's field: clicks under a click-scale gameMode, roll stiffness under a
                  // physical one, and gameMode rides with `ride` (see docs/CODEC.md ids 46/47).
                  // So ARB without SPRINGS, across that boundary, copies numbers the receiving
                  // mode reads as a different quantity.
                  //
                  // All four terms are needed, and together they almost never fire. computeTune
                  // reads the MAN pair ONLY in its arbMode==='man' branch — under auto/roll/share
                  // the pair rides along inert while the solver recomputes bars from the intent
                  // fields, and the MAN button reseeds from the clamped output, so an inert value
                  // never becomes live. Ticking `ride` too brings gameMode and the units agree.
                  //
                  // Warned, not blocked: the output is clamped to a legal value either way, and
                  // the ticks in this picker are deliberately independent — a cross-part refusal
                  // would be the first thing here that overrides the reader. Same choice MEASURE
                  // makes with its A/B spread, which suggests rather than accuses.
                  // See docs/KNOWN_ISSUES.md for the options that were weighed.
                  const arbUnitClash=!!pending&&!!importSel.arb&&!importSel.ride
                    &&pending.tune.fe.arbMode==='man'
                    &&isPhysical(pending.tune.fe.gameMode)!==isPhysical(cur.fe.gameMode);
                  // Everything below works off one merge, so APPLY and TO GARAGE can never
                  // disagree about what the ticks mean.
                  const merged=pending?mergeTune(cur,pending.tune,importSel):null;
                  const feTicked=!!(importSel.ride||importSel.damp||importSel.arb);
                  const applyPending=()=>{
                    if(!merged||none)return;
                    commit('load share code',()=>{
                      // merged.* is built from the LIVE tune, so fields the codec doesn't
                      // carry (e.g. useRideHeightCG, local-only per docs/CODEC.md) survive.
                      if(importSel.ch) setCh(prev=>({...DEF_CH,...prev,...merged.ch}));
                      if(feTicked)     setFe(merged.fe);
                      if(importSel.dr) setDr(merged.dr);
                      if(feTicked||importSel.dr) dnaUnlink();
                    });
                    setPending(null);setImportCode('');
                    close();
                  };
                  return(<>
                  <textarea value={importCode} onChange={e=>{setImportCode(e.target.value);setImportErr('');}}
                    placeholder="Paste a tune code or link here…" rows={3}
                    style={{width:'100%',background:'#020617',border:'1px solid #1e293b',borderRadius:2,
                            padding:'6px 8px',fontSize:10,color:'#e2e8f0',outline:'none',resize:'none',
                            fontFamily:'var(--font-mono)',letterSpacing:0.5,marginBottom:8}}/>
                  <div style={{display:'flex',gap:6,marginBottom:10}}>
                    <button className="tbtn" style={{flex:1,fontSize:10}} disabled={!importCode.trim()}
                      onClick={()=>{
                        // A pasted LINK is accepted too: everything after #t= is the code.
                        const raw=importCode.trim();
                        const h=raw.indexOf('#t=');
                        stageCode(h>=0?decodeURIComponent(raw.slice(h+3)):raw,'paste');
                      }}>{pending?'RE-READ CODE':'READ CODE'}</button>
                  </div>
                  {importErr&&<div style={{fontSize:9,color:'#f87171',marginBottom:8,letterSpacing:0.5}}>{importErr}</div>}
                  <div style={{fontSize:9,letterSpacing:2,color:'#475569',marginBottom:6}}>
                    {pending?'THIS CODE CARRIES':'PARTS A CODE MAY LOAD'}</div>
                  {SHARE_PARTS.filter(p=>p.applies!==false).map(p=>{
                    const same=pending&&!partDiffers(cur,pending.tune,p.id);
                    return chkRow(p.id,p.label,
                      <>{summary[p.id](src)}
                        <span style={{color:same?'#4ade80':'#334155',marginLeft:6}}>{'· '}
                          {pending?(same?'same as yours':'from the code'):'yours now'}</span></>,
                      !!importSel[p.id],e=>setImportSel(s=>({...s,[p.id]:e.target.checked})));
                  })}
                  {arbUnitClash&&(()=>{
                    const theirs=GAME_MODE_LABEL[pending.tune.fe.gameMode];
                    const lands=isPhysical(cur.fe.gameMode)
                      ?'sit far below anything that moves the car'
                      :`pin both bars at the ${limitsOf(cur.fe.gameMode).arb}-click ceiling`;
                    return<div style={{fontSize:10,color:'#f59e0b',lineHeight:1.5,marginTop:8,
                                       letterSpacing:0.3}}>
                      This code sets its bars by hand in {theirs}, whose ARB units differ from yours,
                      so ARB without SPRINGS would {lands}. Tick SPRINGS too, or take the whole code.
                    </div>;
                  })()}
                  {/* Tier is recorded by the code and shown, never applied — it has no tick.
                      Applying a sender's tier would rewrite the tune being loaded (the BEG/INT
                      fallback effects) and can demand a tier the reader can't reach. */}
                  <div style={{fontSize:9,color:'#64748b',margin:'8px 0 2px',letterSpacing:0.5}}>
                    {pending
                      ?(pending.tier
                        ?<>Written in <span style={{color:'#818cf8'}}>{TIER_LABEL[pending.tier]}</span> tier. Shown, never applied — your own tier is unchanged.</>
                        :<>Tier not recorded — this code predates the field.</>)
                      :<>Your tier is <span style={{color:'#818cf8'}}>{TIER_LABEL[uiMode]}</span>. A loaded code never changes it.</>}
                  </div>
                  {none&&<div style={{fontSize:9,color:'#f87171',margin:'6px 0',letterSpacing:0.5}}>
                    Tick at least one part.</div>}
                  <div style={{display:'flex',gap:6,marginTop:14}}>
                    <button className="tbtn" style={{flex:1,fontSize:10}}
                      onClick={pending?()=>{setPending(null);setImportErr('');}:close}>
                      {pending?'DISCARD':'CLOSE'}</button>
                    <button className="tbtn on" style={{flex:1,fontSize:10}}
                      disabled={!pending||none} onClick={applyPending}>APPLY SELECTED</button>
                    <button className="tbtn" style={{flex:1,fontSize:10}}
                      disabled={!pending||none}
                      onClick={()=>{
                        // The entry is exactly what APPLY would have given you: your tune with
                        // the ticked parts taken from the code. Garage LOADS stay whole-tune.
                        if(!merged)return;
                        garageImport(merged.ch,merged.fe,merged.dr,
                          {ch:!!importSel.ch,fe:feTicked,dr:!!importSel.dr},pending.tier);
                        setPending(null);setImportCode('');
                        close();
                      }}>TO GARAGE</button>
                  </div>
                  </>);
                })()}

                {/* BACKUP */}
                {dataMode==='backup'&&(<>
                  <div style={{fontSize:9,color:'#475569',marginBottom:10,letterSpacing:0.5,lineHeight:1.5}}>
                    Use it to move your garage to another device or browser.
                  </div>
                  {[
                    {key:'chassis',label:'CHASSIS',sub:'Chassis-only entries'},
                    {key:'build',  label:'BUILDS', sub:'Tune-only entries'},
                    {key:'car',    label:'CARS',   sub:'Chassis + tune entries'},
                    {key:'dna',    label:'DNA',    sub:'Saved handling DNAs'},
                  ].map(({key,label,sub})=>chkRow(key,label,sub,exportSel[key],
                    e=>setExportSel(s=>({...s,[key]:e.target.checked})),
                    !entries.some(en=>kindOf(en)===key)))}
                  <div style={{display:'flex',gap:6,marginTop:14}}>
                    <button className="tbtn" style={{flex:1,fontSize:11}} onClick={close}>CANCEL</button>
                    <button className="tbtn on" style={{flex:1,fontSize:11}}
                      disabled={!exportSel.chassis&&!exportSel.build&&!exportSel.car&&!exportSel.dna}
                      onClick={()=>{
                        // 'empty' (corrupt) entries are excluded from every kind, so they
                        // never propagate into a backup file
                        const out={version:2,entries:entries.filter(en=>exportSel[kindOf(en)])};
                        const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
                        const url=URL.createObjectURL(blob);
                        const a=document.createElement('a');
                        a.href=url;a.download='suspos-data.json';a.click();
                        URL.revokeObjectURL(url);
                        close();
                      }}>DOWNLOAD</button>
                  </div>
                </>)}

                {/* RESTORE */}
                {dataMode==='restore'&&(<>
                  {!restoreData&&(<>
                    <div style={{fontSize:9,color:'#475569',marginBottom:10,letterSpacing:0.5,lineHeight:1.5}}>
                      Load a suspos-data.json backup file to restore saved data.
                    </div>
                    {restoreErr&&<div style={{fontSize:9,color:'#f87171',marginBottom:8,letterSpacing:0.5}}>{restoreErr}</div>}
                    <div style={{display:'flex',gap:6,marginTop:4}}>
                      <button className="tbtn" style={{flex:1,fontSize:11}} onClick={close}>CANCEL</button>
                      <button className="tbtn on" style={{flex:1,fontSize:11}} onClick={()=>{
                        const inp=document.createElement('input');
                        inp.type='file';inp.accept='.json,application/json';
                        inp.onchange=e=>{
                          const file=e.target.files?.[0];
                          if(!file)return;
                          const reader=new FileReader();
                          reader.onload=ev=>{
                            try{
                              // accepts both the v2 {version,entries} shape and old
                              // {garage,builds} files; returns normalized entries or null
                              const ents=parseBackup(JSON.parse(ev.target.result));
                              if(!ents)throw new Error();
                              setRestoreData(ents);
                              setRestoreSel({chassis:ents.some(e=>kindOf(e)==='chassis'),
                                             build:  ents.some(e=>kindOf(e)==='build'),
                                             car:    ents.some(e=>kindOf(e)==='car'),
                                             dna:    ents.some(e=>kindOf(e)==='dna')});
                              setRestoreErr('');
                            }catch{setRestoreErr('Invalid backup file.');}
                          };
                          reader.readAsText(file);
                        };
                        inp.click();
                      }}>CHOOSE FILE</button>
                    </div>
                  </>)}
                  {restoreData&&(()=>{
                    // RESTORE replaces whole kinds and the garage is outside undo history (see
                    // docs/KNOWN_ISSUES.md), so it is the most destructive action in the app. It used
                    // to be four ticks with fixed subtitles and one RESTORE click, and it never said
                    // how much was coming in or how much of yours was going out — "Tune-only entries"
                    // reads the same whether the file holds one build or ninety. LOAD CODE next door
                    // already stages a code and prints its actual values before anything moves; this
                    // is the same idea on the path where getting it wrong costs more.
                    const KINDS=[
                      {key:'chassis',label:'CHASSIS',what:'Chassis-only entries'},
                      {key:'build',  label:'BUILDS', what:'Tune-only entries'},
                      {key:'car',    label:'CARS',   what:'Chassis + tune entries'},
                      {key:'dna',    label:'DNA',    what:'Saved handling DNAs'},
                    ];
                    const inFile=k=>restoreData.filter(e=>kindOf(e)===k).length;
                    const mine=k=>entries.filter(e=>kindOf(e)===k).length;
                    // Mirrors the apply below exactly: a kind the file has none of never counts as
                    // chosen, however its tick is left, so it can't be read as "delete mine".
                    const chosen=k=>restoreSel[k]&&inFile(k)>0;
                    const picked=KINDS.filter(({key})=>chosen(key));
                    const incoming=picked.reduce((a,{key})=>a+inFile(key),0);
                    const replaced=picked.reduce((a,{key})=>a+mine(key),0);
                    const kept=entries.length-replaced;
                    const n=(c,one,many)=>`${c} ${c===1?one:many}`;
                    return(<>
                    <div style={{fontSize:9,color:'#475569',marginBottom:8,letterSpacing:0.5,lineHeight:1.5}}>
                      This backup holds {n(restoreData.length,'entry','entries')}.
                      Ticked kinds replace yours; unticked kinds are kept.
                    </div>
                    {KINDS.map(({key,label,what})=>{
                      const f=inFile(key),m=mine(key);
                      // What the kind is, then what ticking it does to this garage right now — so the
                      // consequence sits on the row you are ticking rather than in a footnote. Amber
                      // only on the rows that actually drop something of yours.
                      const trade=f===0?`None in this backup — your ${n(m,'entry','entries')} kept`
                        :!restoreSel[key]?`${f} here, not taken — your ${n(m,'entry','entries')} kept`
                        :m===0?`${f} restored — nothing of yours to replace`
                        :`${f} restored, replacing your ${n(m,'entry','entries')}`;
                      const sub=<>{what}
                        <div style={{marginTop:2,color:chosen(key)&&m>0?'#f59e0b':'#64748b'}}>{trade}</div></>;
                      return chkRow(key,`${label}${f?'  '+f:''}`,sub,restoreSel[key],
                        e=>setRestoreSel(s=>({...s,[key]:e.target.checked})),f===0);
                    })}
                    {/* The net effect in one line, because four rows of arithmetic is still arithmetic
                        and the number that matters — how many of your entries stop existing — is not
                        on any single row. */}
                    <div style={{fontSize:10,color:'#94a3b8',lineHeight:1.6,background:'#0a0f1a',
                                 border:'1px solid #1e293b',borderRadius:2,padding:'6px 8px',marginTop:10}}>
                      {picked.length===0
                        ?'Nothing ticked — RESTORE would change nothing.'
                        :<>Your garage becomes <span style={{color:'#e2e8f0'}}>{n(incoming+kept,'entry','entries')}</span>:
                          {' '}{incoming} from this backup, {kept} of yours kept.</>}
                      {replaced>0&&<div style={{color:'#f59e0b',marginTop:4}}>
                        {n(replaced,'entry','entries')} of yours {replaced===1?'is':'are'} replaced
                        and cannot be recovered — the garage is outside undo. BACKUP first if you want them.
                      </div>}
                    </div>
                    <div style={{display:'flex',gap:6,marginTop:14}}>
                      <button className="tbtn" style={{flex:1,fontSize:11}} onClick={close}>CANCEL</button>
                      {/* Two taps, like deleting a garage entry, for the same reason: this one throws
                          away more and there is nothing to undo it with. */}
                      <ConfirmBtn label="RESTORE" style={{flex:1}}
                        disabled={picked.length===0}
                        title={replaced>0?`Replaces ${replaced} of your entries with ${incoming} from this backup.`
                          :`Adds ${incoming} entries from this backup.`}
                        onConfirm={()=>{
                          // Replace the selected kinds, KEEP the rest. The old per-list restore
                          // replaced one whole list and left the other alone; with a single list
                          // a naive setEntries(fromFile) would silently delete the unselected
                          // kinds. Same spirit, now that "list" means "kind".
                          // One set call — usePersist's setter closes over the render-time value.
                          // Dedup incoming ids against what's being kept — same bump-on-collision
                          // approach unifyLegacy uses for legacy imports, but here against the
                          // live garage rather than a second legacy list. v2 entries carry explicit
                          // createdAt/updatedAt (unlike legacy ones), so bumping id alone is safe.
                          // `chosen` above is the single definition of what is being replaced: the
                          // counts printed to the user and the entries actually dropped read the
                          // same predicate, so the summary can never describe a different restore
                          // than the one that runs.
                          const keptEntries=entries.filter(e=>!chosen(kindOf(e)));
                          const usedIds=new Set(keptEntries.map(e=>e.id));
                          const incomingEntries=restoreData.filter(e=>chosen(kindOf(e))).map(e=>{
                            let nid=e.id;
                            while(usedIds.has(nid))nid++;
                            usedIds.add(nid);
                            return nid===e.id?e:{...e,id:nid};
                          });
                          setEntries([...incomingEntries,...keptEntries].sort((a,b)=>b.createdAt-a.createdAt));
                          close();
                        }}/>
                    </div>
                    </>);
                  })()}
                </>)}
              </div>
              </div>
            </div>
            );
          })()}

          {/* PINNED — HANDLING BALANCE */}
          <div id="zone-balance-bar" style={{flexShrink:0,borderTop:'1px solid #1e293b',background:'#020617',
                                             paddingBottom:'env(safe-area-inset-bottom,0px)',...dim('balance-bar')}}>
            {/* compact header row — tap to expand */}
            <div className="collapsible-hdr"
                 onClick={()=>{
                   if(isPhone){
                     // On phones the tap reveals/hides the full bar stack (the summary line stays).
