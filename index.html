    {id:'hz-multiplier',term:'MULTIPLIER (Hz Mode)',tier:'intermediate',short:'Multiplier',def:"MULTIPLIER derives the second axle's Hz as a fixed ratio of the first. With a FRONT reference it is the Rear Multiplier: rear Hz = front × ratio. With REAR it is the Front Multiplier, applied as a divisor: ÷1.20 makes front Hz 83% of rear, useful when you want the front consistently softer. With SHARED it is the F/R Ratio, rear to front, which shifts stiffness between axles while Avg Stiffness holds the average. It runs ×0.50–×3.00; MATCH (×1.00) is equal Hz, and ×1.20 is the default and a typical starting point. A higher ratio stiffens the rear relative to the front and leans toward oversteer; lower leans toward understeer.\n\nIt is the default Hz mode and the one Beginner always runs, where the Balance slider nudges it.",see:['hz-mode','ride-ref','balance-slider']},
    {id:'flat-ride',term:'Flat Ride',tier:'intermediate',def:"Flat Ride is an Hz MODE option that reduces pitch bounce over bumps at a chosen Target Speed. The rear wheels meet a bump one wheelbase's travel time after the front, so the rear gets a slightly higher Hz whose shorter period lets it catch up: the axles come back into phase and the body stays level instead of rocking nose to tail. This is Olley's flat-ride rule. It concerns ride over bumps, not dive under braking or squat under power, which come from load transfer.\n\nThe resulting rear/front ratio grows as Ride Stiffness rises or Target Speed falls. Published practice keeps it within about 10–20%; above ×1.25 the app warns, and the fix is a higher Target Speed (toward OFF) or a lower Ride Stiffness, not abandoning flat ride. With RIDE REF. REAR the front is solved softer instead, and with SHARED the average is held and split. Paired with TIME SYNC damping it gives the lowest pitch in the app's model.",see:['target-speed','hz-mode','flat-ride-time-sync']},
    {id:'target-speed',term:'Target Speed',tier:'intermediate',def:"Target Speed is the road speed at which FLAT RIDE times front and rear to hit bumps in phase. It runs 60–200 mph (km/h if you use metric speed) and defaults to 70 mph. The slider is reversed: right (CITY) is a lower speed and a bigger front/rear Hz gap; full left (OFF, 200 mph) disables the correction, so both axles run equal Hz and their spring rates differ only by corner mass — useful for very high-speed circuits. The box shows and takes the speed itself.\n\nWith a FRONT reference a lower speed stiffens the rear; with REAR it softens the front; with SHARED it changes how the average is split. Stiffer setups need a higher Target Speed to keep the ratio in range. ⚠ in the readout means the derived axle hit the Hz limit.",see:['flat-ride','hz-mode','ride-ref']},
  ]},
  {group:'Damping',terms:[
    {id:'zeta',term:'ζ (Zeta / Damping Ratio)',tier:'beginner',short:'ζ damping ratio',def:"ζ (zeta), the damping ratio, is how quickly a bounce dies out, as a percentage of critical damping. 100% is critically damped: back to rest in one smooth motion with no overshoot. SUSP.OS defaults rebound to 70% (Butterworth): one small overshoot of about 4%, then done, without feeling harsh. Below about 40% feels bouncy and underdamped; above 100% feels sluggish and overdamped, and the DAMPERS card flags rebound below 40% and any value above 100%. No single ζ is best at everything: about 59% gives the quickest settle after one bump, about 70% the flattest response to a continuous rough surface, and 100% the quickest with no overshoot at all.\n\n[INT] The Rebound ζ slider runs 10–200%, with 55–70% typical. The text beside it reads BUTTERWORTH at 68–72%, FIRM above 72% (planted but stiff) and ⚠ OVERDAMPED above 100%.",see:['critical-damping','butterworth','rebound','settle-time']},
    {id:'critical-damping',term:'Critical Damping',tier:'beginner',def:"Critical damping is the exact amount of damping that stops a spring's oscillation as fast as possible without overshooting past rest. It is the reference ζ is measured against: ζ is always a percentage of this value for that corner's spring and mass, not an absolute number. Beyond it, above 100%, the suspension creeps back to rest more slowly rather than faster.\n\n[INT] That is why SETTLE TIME never back-solves above 100% ζ: past critical damping, more damping settles slower.",see:['zeta','settle-time']},
    {id:'butterworth',term:'Butterworth (≈70% ζ)',tier:'intermediate',def:"Butterworth damping is the ratio of about 0.707, rounded to 70% here, that gives the flattest response with no resonant peak, borrowed from Butterworth filter design. That is a frequency-domain property: in the idealised model no road frequency is amplified more than the rest, which keeps a rough surface from setting the body rocking. It is not a settling-time claim: a single bump at 70% overshoots about 4%, and the quickest ±10% settle sits nearer 59%. Butterworth gives up only a few hundredths of a second against that, which is why Rebound ζ defaults to 70%: firm enough to control the car, soft enough not to feel harsh over bumps. The Rebound ζ slider marks it BWORTH and names only 68–72% BUTTERWORTH, since it is a point, not a region.",see:['zeta','settle-time']},
    {id:'rebound',term:'Rebound',tier:'beginner',def:"Rebound is damping resistance as the suspension extends — the wheel dropping back after being compressed. It controls how fast the wheel returns after a bump or during weight transfer, and settle time is calculated from it. Bump damping is usually set as a share of it.\n\nThe DAMPERS card lists rebound and bump per axle with each value's ζ, plus the rebound settle time. Values above 88% of the game's limit turn amber; if either end would pass the limit, both are scaled down together so the front/rear ratio holds. F/R BIAS in its header is the front's share of total rebound ζ: 50% is balanced, above is front-biased. Rebound ζ also feeds the RESPONSE bar; bump does not.",see:['bump','zeta','bump-ratio','response']},
    {id:'bump',term:'Bump (Compression)',tier:'beginner',def:"Bump is damping resistance as the suspension compresses — the wheel moving up into a bump or under load transfer. It is usually softer than rebound: soft bump absorbs sharp hits while rebound controls how fast the wheel extends back. Bump Ratio expresses it as a percentage of rebound.\n\n[INT] BUMP MODE INDEPENDENT sets a Bump ζ directly (10–115%, default 39%) for combinations the ratio cannot express, such as soft bump with firm rebound. It is an anchor, not a per-axle value: Damping Balance Mode splits it front/rear the same way it splits rebound, and the readout shows both axles when they differ. Keep it below rebound for normal handling; ⚠ CROSSED means an axle's bump ζ is above that axle's rebound ζ.",see:['rebound','bump-ratio','bump-mode']},
    {id:'bump-ratio',term:'Bump Ratio',tier:'beginner',def:"Bump Ratio sets bump damping as a percentage of rebound ζ, so the two strokes stay linked as rebound changes. Lower is softer over sharp hits and more compliant on rough roads; higher gives a more consistent feel between the two strokes. 40–65% is the typical range and 56% the default. The DAMPERS card header shows it.\n\n[INT] The slider runs 10–100%, marked UNDER below 30% and FIRM at 65%; the text beside it is the resulting bump ζ, which never exceeds rebound. Switching from INDEPENDENT seeds the ratio from the bump damping in force, clamped to 10–100%, so a crossed tune (bump above rebound) does change.",see:['bump','rebound','bump-mode','character']},
    {id:'settle-time',term:'Settle Time',tier:'beginner',def:"Settle time is the seconds until the suspension is back inside ±10% of the initial bump and stays there — the standard settling-time definition. Short feels planted and controlled; long is more compliant over rough surfaces but can leave the car still moving mid-corner. The DAMPERS card shows it per axle, from rebound ζ and ride frequency.\n\n[INT] Two figures carry the name: the DAMPERS rows and the damper table's Settle row give a quick estimate from rebound ζ and Hz alone, while the DYNAMICS chart and the table's MEAS figure measure the drawn curve, which also sees bump damping, so they can differ. The table grades the slower axle PLANTED (under 0.35 s), RACE (0.60), SPORT (0.90), ROAD (1.30) or SOFT.\n\n[INT] Settle Target, under REBOUND MODE SETTLE TIME, runs 0.10–1.50 s (default 0.80) and back-solves rebound ζ on the reference axle against the quick estimate, so bump damping does not move it. The solve stops at 100% ζ, since past critical damping more damping settles slower. Damping Bias skews the front/rear timing.",see:['zeta','rebound-mode','dynamics-chart','damper-table']},
    {id:'character',term:'Character (Stable / Agile)',tier:'beginner',short:'Character',def:"Character sets damping feel in Beginner — how quickly the suspension settles after a bump or weight transfer — by moving rebound ζ and Bump Ratio together. STABLE (left) raises rebound ζ and lowers the bump ratio: more damped, settles quickly, planted and predictable. AGILE (right) lowers rebound ζ and raises the bump ratio: lighter, livelier and quicker to change direction. Centre is the defaults, 70% rebound ζ and a 56% bump ratio; start there and match it to your driving style.\n\nIt covers only part of the rebound ζ range, so a tune with very light or very heavy rebound damping shows the handle pinned at an end; moving it then overwrites both values.\n\n[INT] It is the Rebound ζ and Bump Ratio sliders in one. Beginner always runs CHARACTER rebound mode, STANDARD damping balance and zero Damping Bias.",see:['zeta','bump-ratio','rebound','settle-time']},
    {id:'rebound-mode',term:'Rebound Mode (CHARACTER / SETTLE TIME)',tier:'intermediate',short:'Rebound Mode',def:"REBOUND MODE decides how the anchor rebound ζ is obtained. CHARACTER: you type it on the Rebound ζ slider and nothing is back-solved. SETTLE TIME: you set a target settle time in seconds and the app back-solves the ζ that hits it on the ride-reference axle. Switching carries the value across — the time you were holding becomes the equivalent ζ and vice versa — so the car does not jump; above 100% ζ the round trip lands on the underdamped ζ with the same settle time, since time alone cannot tell the two apart.\n\nIt is independent of Damping Balance Mode, which decides how the anchor becomes a front/rear pair. Under SETTLE TIME only the anchored axle is guaranteed to hit the target: TIME SYNC matches the other axle to the same time at 0 Damping Bias, while STANDARD, HYBRID and EQUAL FORCE split differently, and the damper table shows the other axle's real time.",see:['settle-time','zeta','damping-balance-mode']},
    {id:'bump-mode',term:'Bump Mode (BUMP RATIO / INDEPENDENT)',tier:'intermediate',short:'Bump Mode',def:"BUMP MODE sets how bump damping is chosen. BUMP RATIO, the default, sets it as a percentage of rebound ζ, so the two strokes stay linked as rebound changes. INDEPENDENT sets a bump ζ directly, decoupled from rebound, for combinations the ratio cannot express, such as soft bump with firm rebound. Switching seeds the new control from the bump damping already in force (the ride-reference axle's, or the midpoint under SHARED), clamped to the new slider's range, so the tune does not jump; a crossed tune (bump above rebound) moves when switched to BUMP RATIO, which cannot express it. In either mode, Damping Balance Mode splits the bump stroke front/rear as well as rebound.",see:['bump','bump-ratio','damping-balance-mode']},
    {id:'damping-balance-mode',term:'Damping Balance Mode',tier:'intermediate',def:"Damping Balance Mode decides how the single anchor ζ becomes a front/rear pair; it is independent of REBOUND MODE, which only decides how the anchor is obtained. It has four modes. STANDARD holds the anchor on the ride-reference axle and lets Damping Bias raise or lower the other by a percentage — simplest, and blind to any front/rear Hz difference. TIME SYNC gives both axles equal settle time from their own Hz and ignores mass. EQUAL FORCE gives equal damping force, scaled by corner mass × Hz. HYBRID sits halfway between TIME SYNC and EQUAL FORCE on each axle.\n\nAll four split the bump stroke as well as rebound, under either BUMP MODE. The damper table highlights the row the mode equalises: Rebound ζ, Settle, Force, or both Settle and Force for HYBRID. The Damping Bias slider works in every mode and never resets on a switch; only the formula reading it changes. Under SETTLE TIME only the anchored axle is guaranteed to hit the target time.",see:['time-sync','equal-force','hybrid','damping-bias']},
    {id:'time-sync',term:'TIME SYNC',tier:'intermediate',def:"TIME SYNC, one of four Damping Balance Modes, solves the front/rear damping split so both axles finish settling at the same time. It holds your ζ on the ride-reference axle and derives the other from its own spring frequency, so the stiffer axle gets proportionally less ζ; corner mass is ignored. It solves in settle-rate terms, so it stays exact past 100% ζ, and if the other axle's Hz is too low to ever match, that axle stops at 100% (critical damping).\n\nDamping Bias skews the timing: left (FRONT) makes the front settle faster, right (REAR) the rear, reaching a 2× ratio at ±50. Under SETTLE TIME it carries the target time to both axles. The damper table highlights its Settle row. Paired with FLAT RIDE it gives the lowest pitch in the app's model.",see:['damping-balance-mode','equal-force','hybrid','flat-ride-time-sync']},
    {id:'hybrid',term:'HYBRID',tier:'intermediate',def:"HYBRID, one of four Damping Balance Modes, gives each axle a ζ halfway between the TIME SYNC and EQUAL FORCE solutions — close to equal settle time and close to equal damping force, without fully committing to either. Both of those hold the ride-reference axle at your ζ, so HYBRID does too. Damping Bias firms the front (left) or the rear (right), reaching a 2× skew at ±50. The damper table highlights both its Settle and Force rows.",see:['time-sync','equal-force','damping-balance-mode']},
    {id:'equal-force',term:'EQUAL FORCE',tier:'intermediate',def:"EQUAL FORCE, one of four Damping Balance Modes, solves the front/rear damping split so both axles push the same actual damping force. Force scales with ζ × corner mass × Hz, so unlike TIME SYNC it accounts for corner mass as well as spring frequency — useful when TIME SYNC's equal timing still leaves one end feeling harsher. It holds your ζ on the ride-reference axle and derives the other. Damping Bias shifts force toward the front (left) or the rear (right), reaching a 2× skew at ±50. The damper table's Force row, highlighted in this mode, reads 50/50 at centre.",see:['time-sync','hybrid','corner-mass','damping-balance-mode']},
    {id:'flat-ride-time-sync',term:'FLAT RIDE + TIME SYNC',tier:'intermediate',def:"FLAT RIDE + TIME SYNC is the lowest-pitch pairing in the app's model: FLAT RIDE times the rear Hz so the rear axle's bounce lines up with the front's at your Target Speed, and TIME SYNC makes both axles finish settling together. It was checked against every other damping split and against a FLAT RIDE that matches damped rather than undamped periods; neither beat it by more than about 1%, and the damped version pitched more in every case.",see:['flat-ride','time-sync','target-speed']},
    {id:'damping-bias',term:'Damping Bias',tier:'intermediate',def:"Damping Bias shifts damping between front and rear. Whichever axle ends up relatively firmer pushes the balance: a firmer front leans understeer and a planted entry, a firmer rear leans oversteer and easier direction changes, shown in the DAMP row of the handling balance. Left (FRONT) always leaves the front relatively firmer and right (REAR) the rear; the reference axle is held and the other moves. The anchor is Rebound ζ under CHARACTER and the Settle Target under SETTLE TIME.\n\nWhat it moves depends on Damping Balance Mode. STANDARD: the other axle swings up to 50% at ±50, firmer one way and softer the other; with a SHARED reference both axles share the swing. TIME SYNC skews settle time, EQUAL FORCE skews force and HYBRID skews both, each reaching a 2× ratio at ±50. The slider never resets when you change mode. The DAMP row reads the rebound ζ difference between the axles whatever caused it, so a TIME SYNC or EQUAL FORCE split can move it even at 0 bias.",see:['damping-balance-mode','damper-table','understeer','oversteer']},
    {id:'damper-table',term:'Damper Comparison Table',tier:'intermediate',short:'Damper table',def:"The table under Damping Bias compares front and rear on five rows and highlights the one the current Damping Balance Mode equalises. A mismatched row turns amber, with ◄ or ► pointing at the axle that is firmer, faster, working harder or less roll-damped; hover a row for its full reading.\n\nRebound ζ and Bump ζ are each axle's damping ratios; Bump ζ's tooltip adds the bump/rebound mean, a rough overall figure that hides which stroke comes first. Settle is the quick settle-time estimate SETTLE TIME targets, graded by the slower axle, with the DYNAMICS chart's measured figure (MEAS) in its tooltip. Force is each axle's share of actual damping force, ζ × corner mass × Hz; EQUAL FORCE targets 50/50. Roll ζ is rebound ζ in roll: ζ × √(the springs' share of that axle's roll stiffness), since the bar adds stiffness without damping. The less roll-damped axle takes its load first on turn-in, and front and rear match in both ride and roll only when the bar fractions match (NEUTRAL EQUAL ROLL). Roll centres and chassis coupling are ignored.",see:['damping-balance-mode','settle-time','equal-force','bal-neutral']},
  ]},
  {group:'Alignment',terms:[
    {id:'camber',term:'Camber',tier:'beginner',def:"Camber is the wheel's tilt seen from the front; negative camber leans the top of the tyre inward. It keeps more of the contact patch flat on the road once the body rolls in a corner.\n\nThe ALIGNMENT card gives a static camber chosen so the tyre reaches a dynamic target for your build at the tune's body roll: STREET −1.0°, TRACK −1.5°, DRIFT −2.5°, RALLY −0.8°, OFFROAD −0.3°, DRAG −0.2°. More roll means more static negative camber, and a low-CG car gets more correction per degree of roll. The rear takes only part of the front's roll correction (FWD 0.50, AWD 0.70, RWD 0.75), and FWD front camber is reduced by 0.3° to protect traction. Front stays within −4.0° to 0°, rear within −3.5° to 0°.\n\n[PRO] MANUAL alignment takes camber directly within those ranges. A MECH or GRIP nudge that leans toward oversteer adds front negative camber and removes rear camber, up to 0.5° front and 0.3° rear at full strength; an understeer-leaning nudge does the reverse.",see:['toe','caster','align-mode','nudge']},
    {id:'toe',term:'Toe',tier:'beginner',def:"Toe is the angle the wheels point relative to straight ahead, seen from above. In SUSP.OS positive is toe-in and negative is toe-out. Toe-in adds stability; toe-out sharpens turn-in at some cost to straight-line stability.\n\nThe recommendation starts from a build and layout table that leans to front toe-out on RWD and AWD TRACK and DRIFT builds, slight front toe-in on OFFROAD and on FWD STREET and TRACK, and rear toe-in on every build except DRAG. Front toe then moves toward toe-in with stiffer front springs; rear toe-in grows with rear weight share and shrinks when the rear springs are stiffer than the front. Toe rounds to 0.1°, the precision the game accepts. Front toe also feeds the RESPONSE bar, where toe-out reads reactive.\n\n[PRO] MANUAL takes front toe from −0.20° to +0.15° and rear from 0° to +0.25°. A MECH or GRIP nudge moves each by up to 0.10° (oversteer-leaning: more front toe-out, less rear toe-in), so a partial nudge often rounds back to the AUTO value.",see:['camber','caster','align-mode','response']},
    {id:'caster',term:'Caster',tier:'beginner',def:"Caster is the steering axis's fore-aft tilt. More caster adds self-centring and camber gain while steering (the outside tyre gains negative camber as you turn in), at the cost of heavier steering.\n\nThe recommendation starts from a build base (TRACK and RALLY 5.8°, STREET 5.2°, DRIFT 4.8°, OFFROAD 4.5°, DRAG 4.0°), rises with stiffer front springs and more front weight bias, drops 0.5° on FWD, and stays within 4.0–7.5°. Lower caster reads reactive on the RESPONSE bar.\n\n[PRO] Caster is never nudged by MECH or GRIP, because it is not an understeer or oversteer lever. MANUAL takes it directly within 4.0–7.5°.",see:['camber','toe','align-mode','response']},
    {id:'align-mode',term:'Alignment Mode',tier:'beginner',def:"Alignment Mode decides where the ALIGNMENT card's camber, toe and caster come from. By default (AUTO) the app recommends them from build type, layout, front weight bias, front and rear ride Hz and body roll: general chassis-setup starting points, not values calibrated against the game, so fine-tune by feel.\n\nThe card's hint names your build's dynamic camber target and the layout's toe pattern: FWD gets reduced front camber for traction and leans to toe-in; RWD and AWD TRACK and DRIFT builds get front toe-out for turn-in; rear toe-in adds stability on every build but DRAG.\n\n[PRO] The ALIGNMENT section offers AUTO or MANUAL. MANUAL takes exact values and bypasses the recommendation. Under AUTO, Nudge OFF, MECH or GRIP can tilt camber and toe; picking AUTO resets Nudge to OFF, which gives the pure build-type values. Mode, nudge and manual values live in this browser only (share codes and garage entries do not carry them). Leaving PRO returns the mode to AUTO with Nudge OFF; the manual values are kept for the next MANUAL.",see:['camber','toe','caster','nudge']},
    {id:'nudge',term:'Nudge Strength',tier:'pro',def:"Nudge Strength sets how far a MECH or GRIP nudge moves camber and toe away from the AUTO values: 0% gives the pure build-type AUTO values, 100% the full nudge, default 50%. It sets size only; direction comes from the nudge source.\n\nMECH nudges toward the gap between your resolved Mech Balance Target and natural balance, reinforcing the understeer or oversteer intent set there (the same signal MATCH CHASSIS uses). GRIP nudges against the chassis's own grip tendency, how far GRIP BIAS sits from 0.5, independent of ARB mode. The gap is normalised over 0.30, so a gap of 0.30 or more gives the full nudge.\n\nAt full strength an oversteer-leaning nudge adds up to 0.5° of front negative camber, removes up to 0.3° of rear camber and moves front and rear toe up to 0.10° toward toe-out; an understeer-leaning one does the reverse. Toe rounds to 0.1°, so small nudges often leave it unchanged. Caster is never nudged.",see:['align-mode','camber','toe','mech-balance-target']},
  ]},
  {group:'Brakes',terms:[
    {id:'brake-balance',term:'Brake Balance',tier:'beginner',def:"Brake balance is the share of braking force sent to the front axle, in % front. SUSP.OS always computes it; there is no brake input. The BRAKES card tags it FRONT above 55%, REAR below 50%, NEUTRAL between. More front bias steadies corner entry (toward understeer); less lets the car rotate on the brakes. Fine-tune in 1% steps by feel.\n\nThe recommendation is front weight % plus braking weight transfer (CG height ÷ wheelbase × 50) plus a build offset (TRACK +3, DRIFT −5, OFFROAD −3, DRAG −8, STREET and RALLY 0), kept within 45–68%. Weight transfer front-biases most cars; DRIFT and DRAG on a rear-weighted car can land below 50%, a real trail-braking and drift technique, not an error.\n\nThe recommendation and the balance readouts do not share one reference, so they can disagree. The BEG and INT BRK row scores the bias against a fixed 50/50, (bias − 50) × 0.20 points, understeer (−) above 50% front, so a front-biased recommendation reads as mild understeer. BRK describes the recommendation; it is not a request to move it.\n\n[PRO] The recommendation adds a chassis grip term, (GRIP BIAS − 0.5) × 15 points, so an oversteer-prone chassis gets more front bias. PRO's ENTRY phase measures the bias against the entry-load ideal, a load-proportional split at 0.3 g braking (front weight share plus 0.3 × CG height ÷ wheelbase): forward of it is toward understeer, behind it toward oversteer. That ideal carries less weight transfer than the card, so ENTRY usually also leans understeer at the recommended value.",see:['balance-contributors','phase-verdict','load-transfer','build-type']},
  ]},
  {group:'Handling Balance',terms:[
    {id:'understeer',term:'Understeer (US)',tier:'beginner',def:"Understeer is when the front tyres run out of grip before the rears, so the car turns less than the steering asks and runs wide. It feels stable and safe but resists rotation.\n\nSUSP.OS shows understeer as negative (−) and blue, on the US side of the Handling Balance bar. More front roll stiffness (springs or bars), more front brake bias, more front rebound damping, more decel lock, and more accel lock on a driven front axle all push toward it.",see:['oversteer','balance-bar','roll-stiffness','response']},
    {id:'oversteer',term:'Oversteer (OS)',tier:'beginner',def:"Oversteer is when the rear tyres run out of grip before the fronts, so the car rotates more than the steering asks. It feels lively and turns in freely but can snap if overdone.\n\nSUSP.OS shows oversteer as positive (+) and red, on the OS side of the Handling Balance bar. More rear roll stiffness, more rear brake bias, more rear rebound damping, less decel lock (freer lift-off rotation), and more accel lock on a driven rear axle all push toward it.",see:['understeer','balance-bar','roll-stiffness','response']},
    {id:'grip-bias',term:'Grip Bias',tier:'pro',def:"Grip Bias is the car's at-the-limit lateral grip balance at its natural point, from the load-transfer grip model: tyre widths, track widths, CG height and weight split at the chassis's natural roll-stiffness split, before any tuning. Below 0.5 the front grips out first (understeer-prone); above 0.5 the rear does (oversteer-prone). A MEASURE NAT BAL reading shifts it along with natural balance.\n\nIt is not Mech Balance: two cars with identical mech balance can have different grip bias if their tyre widths or load transfer differ. The Balance Guide shows it as the GRIP BIAS row, which also carries a stability tag (AGILE, BALANCED, STABLE or PLANTED) from average track and tyre width. PRO's Handling Balance figure, grip margin, is the same model's front-minus-rear difference, quoted in percent rather than on the 0–1 scale.",see:['grip-neutral','mech-balance','natural-balance','phase-verdict']},
    {id:'load-transfer',term:'Load Transfer',tier:'beginner',def:"Load transfer is weight shifting between tyres as the car corners, brakes or accelerates: onto the outside tyres in a corner, onto the fronts under braking, onto the rears under power. Tyres gain grip more slowly than they gain load, so an axle carrying more transfer has less total grip left. A lower CG and wider track reduce cornering transfer; a lower CG and longer wheelbase reduce fore-aft transfer.\n\nHow roll stiffness is split front to rear decides which axle takes more of the cornering transfer, which is why that split sets handling balance. Forward transfer under braking is also why the recommended brake balance sits in front of the weight split.\n\n[PRO] LOAD TRANSFER, at the bottom of the expanded Handling Balance panel, lists at 1 g cornering: CORNER (static corner mass), XFER (axle load transfer per g, 2 × corner mass × CG height ÷ track width) and OUT / IN (outer and inner wheel loads, inner floored at zero). Use it to judge how hard the bars have to work and how much camber the loaded outer tyre needs.",see:['roll-stiffness','brake-balance','sag-vs-load','grip-bias']},
    {id:'grip-neutral',term:'Grip-Neutral',tier:'pro',def:"Grip-Neutral is the mech balance at which the grip model reads exactly neutral (0.50) for this chassis at the current springs and bars, shown as GRIP TARGET in the Balance Guide. Targeting it cancels the chassis's built-in push or looseness instead of reinforcing it.\n\nGRIP target mode aims here plus Balance Offset, so it lands exactly on grip-neutral only at a 0 offset. It is not the mirror of GRIP BIAS: the two are in different units, and the model is not symmetric enough for a mirror to land on neutral. The Balance Guide's RANGE is scaled between natural balance and this point, and a Vehicle DNA's BALANCE axis is measured from it.",see:['grip-bias','target-grip','target-range','mech-balance-target']},
    {id:'response',term:'Response (Planted / Reactive)',tier:'beginner',def:"Response is a separate bar from understeer/oversteer that rates transient character: how quickly the car reacts to steering, not which end lets go. PLANTED (left) is settled and damped, predictable but slower to change direction; REACTIVE (right) turns in immediately but can feel nervous. Within ±15 it reads BALANCED. A car can be perfectly neutral and still sit at either extreme.\n\nThe score weights front Hz 35%, rear Hz 20%, front toe 15%, caster 10%, front rebound damping 12% and rear rebound damping 8%. Higher Hz, lower rebound damping, more front toe-out and lower caster all read reactive. Anti-roll bars and weight bias are left out: they set balance, not response speed.\n\nBump damping is deliberately absent. At low shaft speed it resists roll initiation (planted); over bumps it deflects the car instead of absorbing them (skittish). One damping ratio cannot separate the two, so any sign here would be wrong on some surface.",see:['response-factors','hz','rebound','toe']},
  ]},
  {group:'Readouts & Visuals',terms:[
    {id:'balance-bar',term:'Handling Balance Bar',tier:'beginner',def:"The Handling Balance bar, pinned under the results, combines every tuning input into one steady-state number: + (red, OS) toward oversteer, − (blue, US) toward understeer, NEUTRAL within ±3 points. Zero means neither end should give up grip first.\n\nContributors stack outward from the centre as coloured segments (CHAS, SPR, ARB, DIFF, BRK, DAMP); tiny ones are hidden. Shaded zones mark neutral, mild and aggressive, but the right number depends on the goal: rotation and drift builds typically run +15 to +35, track builds +5 to +20 for feel under power, street and GT builds mild understeer for stability. Read it for where balance comes from, not as a target to zero. Tap it (on phones, then CONTRIBUTIONS) for the breakdown and a tip.\n\n[PRO] PRO uses a different unit: mid-corner grip margin, how much more lateral grip the front axle has left than the rear at the limit, as a percent of their mean (+ = the rear gives up first), NEUTRAL within ±1%. The bar draws only CHAS, SPR and ARB, with ±10% filling a half, and an ENTRY / MID / EXIT line below; the point ranges do not apply.",see:['balance-contributors','handling-verdict','phase-verdict','understeer']},
    {id:'balance-contributors',term:'Balance Contributors',tier:'beginner',short:'Contributors',def:"The rows behind the BEG and INT Handling Balance number, in points, + toward oversteer, each with its share of the total. MECHANICAL: CHASSIS is the car's own at-limit lean from tyre widths, track widths, CG height and weight split, shown as the stiffness bias it takes to cancel it (−10 means 10 points of rear-biased roll stiffness just to reach neutral). SPRINGS and ARB compare each one's front/rear roll-stiffness split with the weight split, weighted by its share of total roll stiffness: + means the rear is relatively stiffer.\n\nDYNAMIC: DIFF EXIT and DIFF ENTRY on FWD and RWD, or DIFF F and DIFF R on AWD (accel and decel combined, scaled by centre split and axle weight). Rear accel lock is +; front accel lock and decel lock on either axle are −. BRAKES is the computed brake bias against 50/50, − above 50% front. DAMP is the front/rear rebound damping split, − when the front is firmer.\n\nAlignment is not counted, though it also affects balance.",see:['balance-bar','handling-verdict','brake-balance','mech-balance']},
    {id:'handling-verdict',term:'Correction Tip',tier:'beginner',def:"The line atop the expanded Handling Balance panel at BEG and INT. Within ±3 points it calls the setup balanced, naming any contributor over 2 points to watch; otherwise it names the largest contributor (if over 2 points) and which way to move. BEG spring, bar and damping tips point to the Balance slider (toward UNDERSTEER against oversteer, toward OVERSTEER against understeer); BEG diff tips explain the lock comes from Build Type and Layout. A CHASSIS tip means the car itself leans that way: shift balance toward the front for oversteer, the rear for understeer. For big shifts the main balance control has the most leverage.\n\n[INT] INT tips name the control, here for oversteer (reverse for understeer): ARB Bias toward FRONT HEAVY (in MAN, raise ARB F relative to ARB R); lower rear Hz relative to front via the RIDE multiplier; Damping Bias toward FRONT; EXIT toward GRIP or ENTRY toward STABLE (AWD: FRONT AXLE EXIT toward PUSH, REAR AXLE EXIT toward GRIP). ARB Bias and Damping Bias suit small residual changes.\n\nA BRAKES tip describes the computed brake balance, measured from 50/50; it is not a setting to chase.",see:['balance-contributors','balance-bar','balance-slider','arb-bias']},
    {id:'phase-verdict',term:'Phase Breakdown',tier:'pro',def:"PRO's expanded Handling Balance panel, by corner phase in grip-margin percent (+ = the rear gives up first; within ±1% is NEUTRAL). MID is the steady-state margin: CHASSIS at the weight-matched split (the car's own lean), with SPRINGS and ARB sharing the rest in proportion to how far each moves the split. ENTRY adds BRAKES, the bias against the entry-load ideal (the load-proportional split at 0.3 g braking). EXIT adds DRIVE (CENTRE on AWD), the drive split against the load-proportional one at 0.2 g of drive; + means the rear carries more than its share.\n\nPITCH, the car's own weight transfer at that load, is shown muted and left out of the totals: it is not tunable, depends on how hard you brake or accelerate, and would bury every setting. Diff lock (DIFF ENTRY, DIFF EXIT) and damping (DAMP, under TRANSIENT) show a direction only, marked NO SIZE, since nothing has calibrated how far they push; the compact line shows the diff's direction as an arrow.\n\nTips name the dominant MID term, compare brake bias with the ENTRY ideal (Brake Balance explains why that differs from the card), and for EXIT point to the centre split on AWD; on FWD and RWD only throttle and exit diff lock manage it.",see:['balance-bar','brake-balance','grip-bias','load-transfer']},
    {id:'mech-balance-strip',term:'MECH BALANCE Strip',tier:'pro',def:"A PRO readout under the Handling Balance bar: mech balance on the 0–1 scale as the game displays it, the rear share of roll stiffness with each tyre counted in series with its axle in Forza. NAT is what the game would show for this car on equal front and rear springs with the bars backed off: your MEASURE NAT BAL reading when set, otherwise the model's prediction of it. CUR is where the current setup lands. TGT, with its own tick, appears while something solves toward a target: ARB Balance Mode MECH or CO-SOLVE, or Hz MODE MECH.\n\nThe shaded band from NAT to CUR is how much correction the setup applies. The signed delta after CUR, also shown after MECH in the bar header, is CUR − NAT: blue means more rear-biased than natural (toward oversteer), amber more front-biased. Balance Target offsets are measured from NAT, so 0 means stay there.",see:['mech-balance','natural-balance','mech-balance-target','measure-nat-bal']},
    {id:'fit-badge',term:'FIT? Badge',tier:'pro',def:"A PRO badge in the Handling Balance header that appears only when the tune sits outside the set the balance model was calibrated on. Grey tags mean extrapolated, not wrong: the model has no measurements that far out, and nothing is clamped to these bounds. HZ: a spring frequency outside 2.5–3.5 Hz, so an ordinary softer street tune shows it. MASS: a corner mass outside 269–476 kg. TYRE: a section width outside 215–335 mm. LIFT: at 1 g lateral an inside wheel unloads completely, so more bar or spring on that end will not move the balance further.\n\nAmber CG is the one hard flag: the ride-height CG estimate is outside the 200–1500 mm CG Height range, so CG stops following ride-height edits and the load-transfer model runs on the clamped value. HZ, MASS and TYRE are skipped in BeamNG, whose balance has no tyre-series term; LIFT and CG apply in every game mode. Never flagged because it is always true: the tyre fit, and any MEASURE reading, hold only at the tyre pressures they were taken at.",see:['mech-balance','load-transfer','measure-nat-bal','game-mode']},
    {id:'response-factors',term:'Response Breakdown',tier:'beginner',def:"The RESPONSE rows in the expanded Handling Balance panel: Hz F, DAMP F, Hz R, DAMP R, TOE F and CASTER. Each row is that factor's weighted distance from the middle of its range, + toward reactive, with its share of the total; the largest is highlighted and drives the tip. Ranges: ride Hz 0.8–5.5, rebound ζ 10–115% (anything above 115% scores the same), front toe from +0.20° (planted) to −0.20° (reactive), caster from 7.5° (planted) down to 4.0° (reactive).\n\nTips for a REACTIVE car suggest softer springs, more rebound damping, more front toe-in or more caster on the dominant row; a PLANTED car gets the reverse. Within ±15 the tip calls response balanced. Only rebound damping counts; bump is left out because its effect on turn-in flips with surface roughness.",see:['response','hz','rebound','caster']},
    {id:'output-cards',term:'Output Cards',tier:'beginner',def:"The results cards hold the values to type into the game's tuning menu; in Horizon and Motorsport: ALIGNMENT, ANTI-ROLL BARS, SPRINGS, DAMPERS, BRAKES, DIFFERENTIAL. They are starting points to fine-tune by feel. A click value turns amber above 88% of the game's limit (Horizon: ARB 65, damping 20; Motorsport: 40 and 40): soften inputs slightly.\n\nANTI-ROLL BARS: header = body roll at 1 g; each row shows the bar's share of its axle's roll stiffness, its share of all bar stiffness, and LOW, MED, HIGH or MAX up the click range. SPRINGS: rates in your UNITS choice, tagged SOFT, ROAD, FIRM or RACE (edges 1.2, 1.8, 2.5 Hz), with the spring's share of its axle's roll stiffness; header REAR × = rear Hz ÷ front Hz. DAMPERS: each row's ζ, flagged OVERDAMPED above 100% and, on rebound only, UNDERDAMPED below 40%; F/R BIAS = front share of the two rebound ζ (50% = even). The settle time on rebound rows is a quick estimate from rebound ζ and Hz alone.",see:['output-warnings','diff-output','beamng-output','spring-rate']},
    {id:'output-warnings',term:'Output Warnings',tier:'beginner',def:"Amber boxes under the output cards mean the solver could not deliver what the inputs asked. Dampers scaled: one passed the game's click limit, so all four were scaled down together to keep the front/rear ratio; lower rebound damping or Bump Ratio to restore the character (at BEG, Character toward AGILE). Hz clamped: the axle derived from the other left the 0.8–5.5 Hz band and was held at its edge; the box names the axle and the lever.\n\n[INT] Roll target missed (ROLL °): either the bars are at their limit (stiffer springs would cut roll further) or the springs alone already exceed the target (softer springs give the bars room). Hz clamp levers: FLAT RIDE, raise Target Speed, which always narrows the split; MULTIPLIER, move it toward 1.00; SHARED, adjust the bottom-out target or bring ride heights closer; or move Ride Stiffness.\n\n[PRO] Mech target missed (MECH, CO-SOLVE): the box names the bar at its floor or click ceiling and what reaches the target: spring balance or Hz MODE MECH, more Spring Share in CO-SOLVE, or a bigger bar budget. Rear lift risk (CO-SOLVE): rear springs much stiffer than the front cut droop and can lift the inside rear; lower the target, use MECH, or lower Spring Share. An Hz MECH clamp: move the target toward natural or adjust Ride Stiffness.",see:['output-cards','hz-mode','flat-ride','bal-cosolve']},
    {id:'diff-output',term:'DIFFERENTIAL Card',tier:'beginner',def:"The DIFFERENTIAL card lists lock % to enter: Accel and Decel Lock on FWD and RWD; Front and Rear Accel and Decel plus Center Split (% rear) on AWD. A SPORT diff is accel-only in game, so its decel and split rows read N/A. Tags: OFF at 0, LOW below 20, MED below 45, HIGH below 70, MAX from 70. Start there and fine-tune in 1% steps.\n\nAccel lock governs exit: on a driven rear axle more lock adds power-on rotation, on a driven front axle more exit understeer. Decel lock governs entry: more steadies lift-off, less lets the car rotate on entry and trail-braking; front decel near 0 minimises entry understeer.\n\n[INT] RECOMMENDED names the diff type for your build (TRACK and DRAG: RACE; STREET: SPORT; DRIFT, RALLY, OFFROAD: their own), turning a RACE pick into SPORT when the balance total passes +8; → USE applies it. On AWD with a non-SPORT diff, CENTER SPLIT recommends a rear % with the build's reason and its own → USE.\n\n[PRO] CENTER SPLIT also breaks its figure into the build's base % plus weight, tyre-diameter and natural-balance adjustments.",see:['accel-lock','decel-lock','build-type','balance-bar']},
    {id:'beamng-output',term:'BeamNG Output',tier:'beginner',def:"With the game mode on BEAMNG the results follow BeamNG's menu grouping (Brakes and Center Split, Front and Rear Differential, Suspension, Alignment) in physical units: springs N/m in 500 steps, dampers N/m/s in 100 steps, anti-roll rate N/m in 1000 steps. No click limits means no amber limit warnings, and there is no RECOMMENDED diff type (a Forza concept). The settle figure by each damper is the quick rebound-only estimate.\n\nAnti-Roll reads roughly 4–6× soft by default: the app assumes the bar acts at the wheel, but BeamNG rates it at the bar's own lever, so treat it as a direction unless you know the geometry.\n\nBeamNG's Camber, Caster and Toe Adjust sliders are % of a per-vehicle range, not degrees, so no formula converts the angle: dial each while watching BeamNG's live tuning-screen alignment readout until it matches, and recheck after changing Spring Height.\n\n[PRO] Motion Ratio and ARB Motion Ratio in CHASSIS divide the outputs by the ratio squared; setting ARB Motion Ratio (arm ÷ track, typically 0.4–0.5) corrects the soft anti-roll reading.",see:['game-mode','output-cards','align-mode','units']},
    {id:'ride-roll-damping',term:'RIDE · ROLL · DAMPING',tier:'intermediate',def:"The first VISUALS group; collapsed it reads R (rear % of roll stiffness), × (rear ÷ front Hz) and body roll. ROLL SPLIT is the car's front/rear share of roll stiffness as the game's Mech Balance counts it, each end shaded springs (solid) vs ARBs (light). The grey tick is NAT, the natural balance: a divide right of it means more front roll stiffness (toward understeer), left toward oversteer. Below: body roll at 1 g (plus your Roll Target in ROLL ° mode) and the springs / ARBs share of total roll stiffness.\n\nRIDE Hz puts front and rear on one SOFT to RACE scale (0.8–5.5 Hz), R/F × in the header, amber when the derived axle hit a limit. ARB runs 0 to the game's ceiling, bands at 50, 75 and 90%, amber past 88% (BeamNG: N/m, scaled to the stiffer bar, no bands). DAMPING ζ shows rebound (filled) and bump (hollow) on 10–200%, zoned UNDER below 40, →BW to 70, BWORTH+ to 100, OVER beyond; the header gives bump as a % of rebound, amber if bump exceeds rebound. Hollow grey rings on the derived axle (the one Ride Reference does not fix) show where it would sit for springs alone, or bars alone, to carry natural balance. Green ticks and rings mark the Balance Target (set in PRO's BALANCE section; 0.60 until set) when it differs from NAT.\n\n[PRO] The divide sits where the MECH BALANCE strip's CUR does.",see:['roll-stiffness','mech-balance','hz','zeta']},
    {id:'dynamics-chart',term:'DYNAMICS Chart',tier:'intermediate',def:"A VISUALS chart of each axle's damped step response: the trace starts displaced, as after one bump or corner, and settles to ride height (front blue, rear orange). The shaded strip is ±10% of that initial displacement. The dashed line is settle time, the last moment the trace leaves the strip, measured off the drawn curve, so it reflects the bump/rebound split, not just rebound ζ. The ring is the first ride-height crossing, a rise-speed marker. Both read out below.\n\nTwo correct results look wrong: past roughly 60% ζ the dashed line can land before the ring, because the trace enters the strip on the way down and stays; and it falls in steps as rebound ζ rises, each step one overshoot peak dropping inside the strip. The quickest settle is not at critical damping.\n\nThe DAMPERS rows quote a quick estimate from rebound ζ and Hz alone, blind to bump damping: long below about 79% ζ, short above (about 40% at 100%). SETTLE TIME mode back-solves against it, so the two differ on purpose. RIDE / ROLL switches to roll response: the ARB adds stiffness without damping, so roll ζ = ζ × √(spring share) and roll Hz = Hz ÷ √(spring share); a comparison that ignores roll centres and chassis coupling.",see:['settle-time','zeta','rebound-mode','bump']},
    {id:'sag-vs-load',term:'SAG vs LOAD',tier:'intermediate',def:"A VISUALS chart of suspension compression against load, per axle, shown only with the RIDE HEIGHT CG source and both tyre sizes valid. The solid line is static sag times load factor (compression scales linearly with vertical wheel load; mass cancels out of the spring/frequency relation), with a ring at the static 1 g point. The dashed line is your ride height: where the solid line reaches it (filled dot, bottoms ≈ g) is the vertical load that bottoms that axle.\n\nThe faint short-dashed line adds the outside wheel's compression from cornering load transfer (the balance figures' model); its hollow ring gives the lateral g that bottoms that wheel from roll alone. FRONT and REAR tags rate static sag against ride height: LOW below 50%, MED from 50%, HIGH from 80%, BOTTOMED at 100%.\n\nThe shaded top 12% of travel is a reminder that real springs stiffen near the bump stop, so near the top this linear line reads softer than the real spring. It does not combine cornering with braking or bump load, and treats the axles independently.",see:['sag','bottoming','load-transfer','ride-ref']},
    {id:'dna-match',term:'DNA Match',tier:'pro',def:"After a Vehicle DNA is applied the tune stays linked to it: a chip in the sidebar names it, the sliders it set carry a mark, and VISUALS shows DNA MATCH with each axis's TARGET and NOW. ✓ means the axis still sits where APPLY left it; amber ≠ means it has moved beyond rounding since APPLY; MODE means that control is no longer in the mode the DNA set, so the value is not comparable.\n\nTARGET is the DNA's own target, which can differ from what APPLY achieved when an axis gave way or used its slack; drift is judged against the achieved value. Loading a garage build replaces the link with the DNA saved in that entry, if any. A FACTORY preset, a share code's feel or drivetrain parts, RESET, or leaving PRO removes it.",see:['dna','dna-priority','garage','share-code']},
  ]},
  {group:'Tools',terms:[
    {id:'tune-check',term:'Tune Check (DECODE)',tier:'beginner',short:'Tune Check',def:"Tune Check (the CHECK button) reads an existing tune back into the app's model. DECODE is for a tune with no share code: step 1 takes its springs, dampers and bars exactly as the game prints them, plus weight and front bias, shared with the sidebar because a spring rate only means a frequency against the right mass. Fields open on stock seeds, and nothing decodes until you type. Step 2 shows front and rear Hz and rebound and bump damping ratios.\n\nIMPORT TUNE writes it onto this car's ride, dampers and bars: a front Hz with a rear multiplier, a front rebound ζ with one Damping Bias that sets both the rebound and bump splits (clamped to ±50, so some splits land close, with a warning), and the bars entered directly. Review afterward. The window closes only with ✕, so MEASURE readings survive a stray click.\n\n[INT] The import sets RIDE REF FRONT, Hz MODE MULTIPLIER, REBOUND MODE CHARACTER, BUMP MODE BUMP RATIO, Damping Balance STANDARD and ARB Stiffness Mode MAN.\n\n[PRO] IMPORT AS DNA loads the tune as targets into the DNA editor instead (the bars become ARB SHARE and BALANCE targets), leaving this car alone, to apply here or on another car. In BeamNG both imports convert the Anti-Roll Spring Rate to roll stiffness through the track widths and ARB Motion Ratio, so set those in CHASSIS before importing.",see:['measure-nat-bal','measure-arb-scale','dna','hz']},
    {id:'measure-nat-bal',term:'MEASURE NAT BAL',tier:'beginner',def:"Step 1 of Tune Check's MEASURE tab: an in-game reading of this car's natural mech balance that replaces the app's prediction. Set the spring rates it lists (solved for the Measure Hz from each corner's mass) and both bars to 1 in Forza, then type the Mech Balance the game shows (0.30–0.90). The reading and its Hz save with the chassis and travel in its share code; CLEAR returns to the prediction.\n\nMeasure Hz runs 1.0–3.5, default 2.20. Softer is more accurate: at a lower Hz the bars account for more of the balance Forza displays, so the same two-decimal reading pins this result, and step 2's ARB scale, more tightly. Use the lowest Hz whose rates the game accepts. If the chassis later changes enough to move the prediction by 0.01 or more, the step reads RE-MEASURE: a reading describes one car in one state and is used as-is until you retake or clear it.\n\n[PRO] MEASURE NAT BAL in the BALANCE section opens this step. Once set, the reading drives NATURAL, GRIP BIAS and every target measured from natural, and the track-width fields hide, since it already reflects the car's real geometry, track width upgrades included; wheelbase stays for flat ride and brake balance.",see:['natural-balance','measure-arb-scale','tune-check','mech-balance']},
    {id:'measure-arb-scale',term:'ARB SCALE SETUP',tier:'beginner',def:"Step 2 of Tune Check's MEASURE tab, Forza only. Forza scales its ARB slider differently per car; this finds what one click is worth on this one, so bar-driven balance lands where the game shows it. It unlocks once step 1 is set and is solved against it: keep step 1's springs, ride height and tyres, set the bars each reading lists (front 1 with rear at the ceiling, then the reverse) and type the Mech Balance Forza shows.\n\nEach reading solves its own scale and both are shown, so you can see whether they agree. SCALE IN USE: MEASURED takes their average, DEFAULT returns to the shared 540. Readings over 45% apart get a warning (two-decimal rounding alone can spread them by a quarter, and unequal front and rear bars read wider), but if both are typed as Forza showed them, the average is still the best estimate. A reading no plausible bar fits shows CHECK.\n\nThe scale saves with the chassis and travels in its share code. If step 1 is re-taken or cleared, it reads RE-MEASURE and stays in use until you re-measure or pick DEFAULT. Changing Measure Hz after step 1 does not move the solve, which stays at step 1's Hz.",see:['arb-scale','measure-nat-bal','tune-check','arb']},
    {id:'dna',term:'Vehicle DNA',tier:'beginner',def:"A Vehicle DNA is a set of handling targets the app turns into a complete tune for the current car, so one character can move from car to car. Building and applying one is PRO; below PRO the DNA window only says so.\n\n[PRO] Nine axes: PLATFORM (front Hz), PITCH (rear ÷ front Hz), ARB SHARE (% of roll stiffness from bars), BALANCE (mech balance past grip-neutral, + toward oversteer), REBOUND ζ, BUMP RATIO, DAMP BIAS, DIFF EXIT, DIFF ENTRY. APPLY writes them through fixed modes (FRONT ride reference, Hz stiffness, MULTIPLIER, SHARE %, MECH balance on a GRIP target, CHARACTER, BUMP RATIO, TIME SYNC, AUTO diff), listed under SWITCHES when they change; it overwrites the tune once and ↩ undoes it.\n\n[PRO] The four archetypes (MOMENTUM, RALLY / B-ROAD, GT3, TAIL-HAPPY RWD) are hypotheses to tune in game, not calibration. MY DNA saves DNAs as garage entries (LOAD DNA fills the editor, it does not apply); CODE copies or pastes one DNA on its own code, separate from tune codes. Leaving PRO with a DNA applied changes the tune (BEG and INT cannot use MECH balance; BEG also loses TIME SYNC and damping bias) and removes the link, which returning to PRO does not restore.",see:['dna-priority','dna-match','grip-neutral','tune-check']},
    {id:'dna-priority',term:'DNA Priority & Slack',tier:'pro',short:'DNA priority',def:"How a Vehicle DNA resolves targets that the game's limits will not let it hit together. PRIORITY ranks the five axes that can give way (PLATFORM, BALANCE, ARB SHARE, PITCH, REBOUND ζ; BUMP RATIO rides with REBOUND ζ), most protected first. When an axis misses, APPLY tries moving less-protected axes, nearest clearing value first, and never breaks an axis ranked above the one it moves; if nothing clears the miss, the miss is accepted and reported. The setting axes (DAMP BIAS, DIFF EXIT, DIFF ENTRY) are written verbatim and always land.\n\nACCEPT ± is per-axis slack: how far an outcome axis may land from its target and still count as met, on top of the allowance for game rounding. 0 is a point target.\n\nON THIS CHASSIS previews every axis: ✓ on target (or within ± slack), moved to keep a higher-ranked axis, missed with the cause (such as the rear axle leaving the Hz band or bars at their limit), or not expressible with this diff (a SPORT diff has no ENTRY).",see:['dna','dna-match']},
    {id:'share-code',term:'Share Code',tier:'beginner',def:"SHARE → COPY CODE turns the tune into a compact text code; COPY LINK wraps it in a URL that opens SUSP.OS with it staged. Include any of CHASSIS (weight, bias, tyres, geometry, layout, MEASURE readings), FEEL (ride, damping, ARB, balance) and DRIVETRAIN (build type, diff). Codes never carry garage entries, and always record the author's tier.\n\nLOAD CODE: paste a code or link, READ CODE to stage it; nothing moves until APPLY SELECTED. Parts are CHASSIS, SPRINGS (which also carries the game mode), DAMPERS, ARB and DRIVETRAIN, each marked same as yours or from the code; only ticked parts are taken, and the ticks persist. TO GARAGE saves the merged result as a new entry and leaves the tune alone. A shared link stages the same way.\n\nThe sender's tier is shown, never applied. Taking ARB without SPRINGS from a code whose bars were set by hand in a game with different ARB units warns you, since the numbers would mean another quantity: tick SPRINGS too. Applying feel or drivetrain parts removes a DNA link; APPLY is one undo step.",see:['backup','garage','game-mode','undo-reset']},
    {id:'backup',term:'Backup & Restore',tier:'beginner',def:"SHARE → BACKUP downloads your garage as suspos-data.json, by kind: CHASSIS, BUILDS, CARS and DNA. It never includes the current unsaved tune. The garage lives only in this browser, so a backup is how you move it to another device or browser, or keep a copy.\n\nRESTORE reads a backup, including files from before the garage was unified, and lists for each kind how many entries the file holds and how many of yours ticking it would replace; a summary gives the net result. Ticked kinds are replaced wholesale by the file's, unticked kinds are kept. A replaced entry cannot be recovered because the garage is outside undo, so RESTORE takes two taps; BACKUP first if you want to keep them. The current tune is not touched.",see:['garage','share-code','undo-reset']},
    {id:'garage',term:'Garage',tier:'beginner',def:"The GARAGE drawer holds everything you save. Name the setup, then SAVE CHASSIS (weight, bias, geometry, layout), SAVE BUILD (feel settings, diff and any applied DNA) or SAVE CAR (both). A car entry has separate LOAD CHASSIS and LOAD BUILD buttons, so one car's chassis can take another's tune; each load is one undo step. An entry's COPY CODE copies it as a share code.\n\nEntries carry notes (up to 2000 characters), your own tags, and automatic tags worked out when shown: layout, BALANCED, NOSE HEAVY or TAIL HEAVY (BALANCED within 2 points of 50% front), stiffness band, build type and the tier it was saved in. All are searchable. Filter by kind and sort by RECENT, OLDEST, NAME A–Z or KIND. ↺ rewrites an entry from the current setup as CHASSIS, BUILD or BOTH (BOTH turns a chassis entry into a car). Deleting takes two taps and cannot be undone, since the garage is outside undo.",see:['factory-presets','backup','share-code','undo-reset']},
    {id:'factory-presets',term:'Factory Presets',tier:'beginner',def:"Six read-only starting tunes under FACTORY in the garage: STREET (road comfort), TRACK (corner focus), RALLY (high travel), DRIFT (rotation), MOTORSPT (max grip) and X COUNTRY (max travel). ★ FOR YOUR BUILD marks the ones matching your Build Type (a TRACK build gets TRACK and MOTORSPT; DRAG gets TRACK). LOAD replaces the feel settings and drivetrain but never the chassis, so the preset fits your car's weight; it removes any DNA link and is one undo step. Presets are not garage entries, so they never appear in counts, search or backups.\n\nAt BEG a loaded preset is adapted to the Beginner controls (automatic bar stiffness, weight-based bar split, a rear-Hz multiplier and standard damping), so the Balance slider behaves the same whether or not you have touched it.",see:['garage','build-type','balance-slider','undo-reset']},
    {id:'undo-reset',term:'Undo, Redo & Reset',tier:'beginner',def:"↩ and ↪ in the toolbar undo and redo tune changes; Ctrl+Z and Ctrl+Shift+Z (⌘ on Mac) do the same, while text fields keep their own undo. Each load, whether a preset, garage entry, share code, DNA APPLY or RESET, is one step, and the button's tooltip names what it will undo. Undo covers the chassis, feel, drivetrain, alignment and DNA link, but not the garage: deleting or restoring garage entries cannot be undone.\n\n⟲ RESET returns the tune (chassis, feel, drivetrain, alignment; brakes follow) to defaults and removes a DNA link, one ↩ away from being undone. It can also mark every tutorial unseen: each guide then opens again when you enter its tier, and INT and PRO lock until the guide before them is opened. Garage saves are never touched.",see:['garage','backup','factory-presets']},
    {id:'game-mode',term:'Game Mode',tier:'beginner',def:"The header selector for the game the tune is for: HORIZON, MOTORSPORT or BEAMNG. Horizon and Motorsport output Forza click values against each game's ceilings (Horizon: ARB 65, damping 20; Motorsport: 40 and 40), with amber warnings near them. BEAMNG outputs physical units with no ceiling and regroups the results to match BeamNG's menus. The game mode travels in a share code's SPRINGS part.\n\n[INT] Switching between clicks and physical units converts MAN bar values so they keep their meaning, and BASIC stiffness mode, a % of the click ceiling, is unavailable in BeamNG. Moving from Horizon to Motorsport clamps MAN bar values to the lower ceiling.",see:['beamng-output','output-cards','units','share-code']},
    {id:'units',term:'Units',tier:'beginner',def:"UNITS sets display units per category: weight (lb or kg), spring rate (lb/in, N/mm or kgf/mm), ride height (in or cm) and speed (mph or km/h). Pick the spring unit your Forza tuning screen uses so values can be typed straight in: Forza's N/mm and kgf/mm are both 10× the true unit, as the game shows them, and ALL METRIC picks kgf/mm because that is Forza's own metric default. BeamNG output ignores the spring choice and always uses BeamNG's own units: N/m for springs and bars, N/m/s for dampers.",see:['output-cards','game-mode']},
  ]},
];
// Lookup + link plumbing for the glossary. GLOSSARY_BY_ID resolves a hint's term id;
// glossaryLabel is the text of its "TERMS: … ›" link; App sets glossaryBridge.open.
const GLOSSARY_BY_ID=Object.fromEntries(GLOSSARY.flatMap(g=>g.terms.map(t=>[t.id,t])));
const glossaryLabel=id=>{const t=GLOSSARY_BY_ID[id];return t?(t.short||t.term.replace(/\s*\([^)]*\)$/,'')):id;};
const glossaryBridge={open:null};

// Shared hint copy for controls that exist in both the BEG panel and the INT/PRO
// sectioned sidebar. Same control, same meaning — kept as one string so the two
// call sites can't drift apart the way the BEG/INT builds drawers once did.
const HINT_LAYOUT='Which wheels the engine drives. It changes the differential and alignment recommendations.';
const HINT_BUILD_TYPE='The car\'s intended use. It shifts the alignment, differential and brake recommendations.';

// Shared by the UNITS modal and the beginner tutorial's units step.
const UnitsPicker=({units,setUnits})=>(<>
  <div style={{display:'flex',gap:4,marginBottom:12}}>
    <button className="tbtn" style={{fontSize:10,flex:1}} onClick={()=>setUnits(UNITS_IMP)}>ALL IMPERIAL</button>
    <button className="tbtn" style={{fontSize:10,flex:1}} onClick={()=>setUnits(UNITS_MET)}>ALL METRIC</button>
  </div>
  {UNIT_GROUPS.map(g=>(
    <div key={g.k} style={{marginBottom:10}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
        <span style={{fontSize:11,color:'#cbd5e1'}}>{g.label}</span>
        <div style={{display:'flex',gap:3}}>
          {g.opts.map(([v,lbl])=>(
            <button key={v} className={`tbtn${units[g.k]===v?' on':''}`} style={{fontSize:11,minWidth:48}}
              onClick={()=>setUnits({...units,[g.k]:v})}>{lbl}</button>
          ))}
        </div>
      </div>
      {g.note&&<div style={{fontSize:9,color:'#475569',marginTop:3,lineHeight:1.4}}>{g.note} <TermLink id="units"/></div>}
    </div>
  ))}
</>);

const TutorialPanel=({mode,step,quick=false,onQuick,onNext,onPrev,onClose,onDone,zoom=1,units,setUnits,appState,notice})=>{
  const steps=tutSteps(mode,quick);
  const total=steps.length;
  const t=steps[step];
  // Optional step task: snapshot appState when the step opens so "changed" means
  // changed during this step, then latch done once check(appState,snap) passes.
  // Never gates NEXT — it's a nudge, not a lock.
  const task=t?.task;
  const taskSnap=useRef(null);
  const[taskDone,setTaskDone]=useState(false);
  useEffect(()=>{taskSnap.current=appState;setTaskDone(false);},[mode,step]); // eslint-disable-line
  useEffect(()=>{
    if(!task||taskDone||!appState||!taskSnap.current)return;
    try{if(task.check(appState,taskSnap.current))setTaskDone(true);}catch(e){}
  },[appState,task,taskDone]);
  // balance mode always anchors to the balance bar zone even though its steps have focus:null
  const focusKey=mode==='balance'?'balance-bar':(t?.focus?.[0]??null);
  // Widen on desktop: at the mobile width this stays 264 (unchanged), but a fixed
  // 264px card in a monospace font forces heavy line-wrapping on wide screens even
  // when the surrounding panel has plenty of room — a 4-sentence step can end up
  // needing a scrollbar purely from wrap count, not from actually being too long.
  const CARD_W=Math.round(Math.min(380,Math.max(264,(window.innerWidth/zoom)*0.24)));
  // pos: {top,left?,right?,arrowDir,arrowOff} or null = centred
  const[pos,setPos]=useState(null);
  const cardRef=useRef(null);
  const bodyRef=useRef(null);
  const[showMore,setShowMore]=useState(false);
  const checkOverflow=()=>{
    const el=bodyRef.current;
    setShowMore(!!el&&el.scrollHeight-el.scrollTop-el.clientHeight>4);
  };

  useEffect(()=>{
    const el=focusKey?document.getElementById('zone-'+focusKey):null;
    // Scroll sidebar so element is visible — use direct scrollTop rather than
    // scrollIntoView which can target the wrong scroll container on mobile
    if(el){
      const sidebar=document.querySelector('.sidebar-scroll');
      if(sidebar){
        const sr=sidebar.getBoundingClientRect();
        const er=el.getBoundingClientRect();
        if(er.top<sr.top+40||er.bottom>sr.bottom-40){
          const relTop=er.top-sr.top+sidebar.scrollTop;
          // Instant, not smooth — an in-flight smooth scroll wouldn't be done yet
          // when measure() reads positions below, leaving the card pointing at
          // where the target *used to* be instead of where it ends up.
          sidebar.scrollTo({top:Math.max(0,relTop-80),behavior:'auto'});
        }
      }
    }
    const measure=()=>{
      if(!el){setPos(null);return;}
      // Anchor to every spotlit zone, not just the first — a step spotlighting two
      // stacked controls would otherwise place the card over the second one.
      const keys=mode==='balance'?['balance-bar']:(t?.focus??[focusKey]);
      const rects=keys.map(k=>document.getElementById('zone-'+k)?.getBoundingClientRect())
        .filter(b=>b&&(b.width||b.height)&&b.right>0);
      // Hidden element (sidebar collapsed on desktop, or the mobile drawer parked off-screen
      // at translateX(-100%) — it stays mounted there so it can slide) → centre card
      if(!rects.length){setPos(null);return;}
      const raw={top:Math.min(...rects.map(b=>b.top)),bottom:Math.max(...rects.map(b=>b.bottom)),
        left:Math.min(...rects.map(b=>b.left)),right:Math.max(...rects.map(b=>b.right))};
      // getBoundingClientRect() returns visual (viewport) pixels, but position:fixed
      // coordinates inside a CSS-zoomed container are in zoomed units (divide by zoom).
      const r={top:raw.top/zoom,bottom:raw.bottom/zoom,left:raw.left/zoom,right:raw.right/zoom};
      const vw=window.innerWidth/zoom;
      // Use the *visible* viewport height (excludes the iOS address bar/toolbar).
      const vh=((window.visualViewport&&window.visualViewport.height)||window.innerHeight)/zoom;
      const midY=(r.top+r.bottom)/2;
      const midX=(r.left+r.right)/2;
      // Beside the sidebar only when the card fits there. On phones the sidebar is
      // nearly full-width, so the clamp below would drop the card on top of the very
      // control it points at — fall through to above/below placement instead.
      const sbEl=document.querySelector('.sidebar-scroll');
      const sbRight=sbEl?sbEl.getBoundingClientRect().right/zoom:r.right;
      if(midX<vw/2&&sbRight+10+CARD_W<=vw-8){
        // LEFT panel: float card just past the sidebar's right edge, sized to its
        // actual content rather than a fixed offset from the target's midpoint —
        // a target sitting low in a long sidebar section (e.g. a tall BALANCE
        // section) shouldn't pin the card low too and starve it of height the
        // (mostly empty, since it's just dimmed background above) rest of the
        // screen has plenty of. Ceiling is near-full viewport height; the card
        // then only takes what its own content actually needs, centred on the
        // target and clamped to stay fully on-screen.
        const left=sbRight+10;
        const maxH=Math.max(140,vh-16);
        const rawCardH=cardRef.current?.getBoundingClientRect().height;
        const cardH=Math.min(rawCardH?rawCardH/zoom:maxH,maxH);
        const top=Math.max(8,Math.min(vh-cardH-8,midY-cardH/2));
        const arrowOff=Math.max(16,Math.min(cardH-16,midY-top));
        setPos({top,left,arrowDir:'left',arrowOff,maxH});
      } else {
        // RIGHT panel (output, balance-bar), or a sidebar target with no room beside
        // the sidebar (phones): float the card above or below the
        // element, whichever side has more room — hugging its actual rendered
        // height rather than filling all available space on that side, but a
        // target sitting near the top of the viewport (little room above, most
        // of the screen free below it) shouldn't get starved into a short box
        // above it when the space below goes unused.
        const GAP=10;
        const availAbove=r.top-8-GAP;
        const availBelow=vh-r.bottom-GAP-8;
        const below=availBelow>availAbove;
        const availH=below?availBelow:availAbove;
        // cardRef's rect is raw (post-zoom) viewport pixels, but everything else in this
        // branch (r.top, maxH, vh) is pre-zoom — must divide by zoom before mixing them,
        // or the card renders too tall/low and can push off the bottom of the viewport
        // at any zoom level other than 100% (the default is 110%, so this hit everyone).
        // Reads the card's *unconstrained* height from its last render — steps always
        // render once via the centred fallback (generous ~100dvh cap) before this first
        // measure() runs, so this reflects what the content actually needs, not last
        // step's clamped leftovers.
        const rawCardH=cardRef.current?.getBoundingClientRect().height;
        const naturalH=rawCardH?rawCardH/zoom:null;
        // Some right-panel targets (zone-output) span nearly the full panel height,
        // starting almost at the very top — leaving no real room to float a card
        // above OR below them. Picking whichever sliver is merely the *larger* of
        // two bad options still forces a scrollbar on content that would fit fine
        // centred with the ~full-viewport room that fallback gets. Centre instead
        // whenever neither side can actually fit what the card needs.
        const MIN_USABLE=180;
        const need=naturalH?Math.min(naturalH,vh-24):MIN_USABLE;
        if(availH<MIN_USABLE||availH<need){
          // A sidebar section taller than the screen (phones): no side is free, and
          // centring covers the middle of it. Pin to the bottom edge instead so the
          // section header and its first controls — where the sidebar scroll put
          // them — stay in view.
          if(midX<vw/2){
            const maxH=Math.max(140,vh-24);
            const cardH=Math.min(naturalH??maxH,maxH);
            setPos({top:vh-cardH-8,left:Math.max(8,(vw-CARD_W)/2),arrowDir:'none',maxH});
            return;
          }
          setPos(null); return;
        }
        const maxH=Math.max(140,Math.min(availH,vh-24));
        const cardH=Math.min(naturalH??maxH,maxH);
        const top=below?Math.min(vh-cardH-8,r.bottom+GAP):Math.max(8,r.top-cardH-GAP);
        const left=Math.max(8,Math.min(vw-CARD_W-8,midX-CARD_W/2));
        const arrowOff=Math.max(12,Math.min(CARD_W-24,midX-left));
        setPos({top,left,arrowDir:below?'up':'down',arrowOff,maxH});
      }
    };
    // Slight delay lets the accordion open/collapse reflow settle before we measure
    const tid=setTimeout(measure,60);
    // Again once the mobile drawer's .2s slide has finished — at 60ms it is still moving.
    const tid2=setTimeout(measure,260);
    window.addEventListener('resize',measure);
    if(window.visualViewport)window.visualViewport.addEventListener('resize',measure);
    return()=>{clearTimeout(tid);clearTimeout(tid2);window.removeEventListener('resize',measure);
      if(window.visualViewport)window.visualViewport.removeEventListener('resize',measure);};
  },[focusKey,step]); // eslint-disable-line

  // Detect body text overflowing its scrollable area (can happen when the target sits
  // low enough that maxH gets clamped small) so we can show a "more below" affordance —
  // otherwise clipped content has no visual cue that it's there at all.
  useEffect(()=>{
    // Two staggered checks: pos settling (measure()'s own 60ms delay) doesn't guarantee
    // the body div's final scrollHeight is painted yet, so re-check once more shortly
    // after — cheap, and avoids a "false: fits" read that hides a real overflow.
    const t1=setTimeout(checkOverflow,120);
    const t2=setTimeout(checkOverflow,320);
    window.addEventListener('resize',checkOverflow);
    return()=>{clearTimeout(t1);clearTimeout(t2);window.removeEventListener('resize',checkOverflow);};
  },[step,pos]); // eslint-disable-line

  if(!t)return null;
  // 'HANDLING' (not 'BALANCE') — this tutorial mode walks through the Handling Balance
  // results bar, which would otherwise render as "BALANCE GUIDE" and collide with the
  // sidebar's actual BALANCE section, which has its own unrelated "BALANCE GUIDE" widget.
  const mLabel={beginner:'BEG',intermediate:'INT',pro:'PRO',balance:'HANDLING'}[mode]??mode.toUpperCase();
  const btnStyle={background:'none',border:'1px solid #1e293b',borderRadius:2,color:'#9ca3af',
    fontFamily:'var(--font-mono)',fontSize:10,padding:'4px 10px',cursor:'pointer',letterSpacing:1};

  const cardBase={position:'fixed',zIndex:700,width:CARD_W,
    maxHeight:'calc(100dvh - 40px)',display:'flex',flexDirection:'column',
    background:'#0f172a',border:'1px solid #334155',borderRadius:4,
    padding:'16px 16px 14px',boxShadow:'0 8px 40px #000d',fontFamily:'var(--font-mono)'};
  const cardStyle=pos
    ?{...cardBase,top:pos.top,...(pos.left!==undefined?{left:pos.left}:{right:pos.right}),
       maxHeight:pos.maxH}
    :{...cardBase,top:'50%',left:'50%',transform:'translate(-50%,-50%)'};

  const arrow=(()=>{
    if(!pos||pos.arrowDir==='none')return null;
    const base={position:'absolute',width:0,height:0};
    if(pos.arrowDir==='left') return(<>
      <div style={{...base,left:-8,top:pos.arrowOff-8,
        borderTop:'8px solid transparent',borderBottom:'8px solid transparent',borderRight:'8px solid #334155'}}/>
      <div style={{...base,left:-6,top:pos.arrowOff-7,
        borderTop:'7px solid transparent',borderBottom:'7px solid transparent',borderRight:'7px solid #0f172a'}}/>
    </>);
    if(pos.arrowDir==='up') return(<>
      <div style={{...base,top:-8,left:pos.arrowOff-8,
        borderLeft:'8px solid transparent',borderRight:'8px solid transparent',borderBottom:'8px solid #334155'}}/>
      <div style={{...base,top:-6,left:pos.arrowOff-7,
        borderLeft:'7px solid transparent',borderRight:'7px solid transparent',borderBottom:'7px solid #0f172a'}}/>
    </>);
    return(<>
      <div style={{...base,bottom:-8,left:pos.arrowOff-8,
        borderLeft:'8px solid transparent',borderRight:'8px solid transparent',borderTop:'8px solid #334155'}}/>
      <div style={{...base,bottom:-6,left:pos.arrowOff-7,
        borderLeft:'7px solid transparent',borderRight:'7px solid transparent',borderTop:'7px solid #0f172a'}}/>
    </>);
  })();

  return(
    <div ref={cardRef} style={cardStyle}>
      {arrow}
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:6}}>
        <div>
          <span style={{fontSize:10,color:'#94a3b8',letterSpacing:2}}>{mLabel} GUIDE  ·  {step+1} / {total}</span>
          <div style={{fontSize:13,color:'#e2e8f0',fontWeight:700,marginTop:3,letterSpacing:0.5}}>{t.title}</div>
        </div>
        <button onClick={onClose} style={{...btnStyle,padding:'3px 8px',marginTop:2,color:'#94a3b8'}}>✕</button>
      </div>
      {/* progress bar */}
      <div style={{display:'flex',gap:3,marginBottom:10}}>
        {steps.map((_,i)=>(
          <div key={i} style={{height:2,flex:1,borderRadius:1,transition:'background .2s',
            background:i<step?'#334155':i===step?'#6366f1':'#1e293b'}}/>
        ))}
      </div>
      <div style={{position:'relative',flex:1,minHeight:0,display:'flex',flexDirection:'column'}}>
        {notice&&step===0&&(
          <div style={{fontSize:11,color:'#fbbf24',border:'1px solid #78350f',background:'#1c1206',
                       borderRadius:2,padding:'6px 8px',margin:'0 0 8px',lineHeight:1.5}}>🔒 {notice}</div>
        )}
        <div ref={bodyRef} onScroll={checkOverflow}
             style={{fontSize:11,color:'#94a3b8',lineHeight:1.65,margin:'0 0 10px',
                 overflowY:'auto',flex:1,minHeight:0,
                 WebkitOverflowScrolling:'touch',overscrollBehavior:'contain',whiteSpace:'pre-line'}} data-tut-body>
          {t.body}
          {quick&&step===total-1&&<div style={{marginTop:10,color:'#818cf8'}}>That's the quick start. Tap ? in the header any time to replay the full tour.</div>}
          {t.units&&units&&<div style={{marginTop:10}}><UnitsPicker units={units} setUnits={setUnits}/></div>}
          {task&&<div data-tut-task={taskDone?'done':'pending'}
               style={{marginTop:10,padding:'6px 8px',border:'1px solid '+(taskDone?'#166534':'#312e81'),
                 borderRadius:2,display:'flex',gap:8,alignItems:'flex-start',
                 color:taskDone?'#4ade80':'#c7d2fe',transition:'color .2s,border-color .2s'}}>
            <span style={{fontWeight:700,flexShrink:0}}>{taskDone?'✓':'○'}</span>
            <span><span style={{letterSpacing:1,fontSize:9,opacity:.8}}>TRY IT · </span>{task.text}</span>
          </div>}
          {t.glossary&&t.glossary.length>0&&<div data-tut-terms
               style={{marginTop:10,display:'flex',flexWrap:'wrap',alignItems:'center',rowGap:4,whiteSpace:'normal'}}>
            <span style={{fontSize:9,color:'#64748b',letterSpacing:1,marginRight:8}}>TERMS</span>
            {t.glossary.map(id=>(
              <button key={id} type="button" data-tut-term={id}
                onClick={e=>glossaryBridge.open&&glossaryBridge.open(id,{from:e.currentTarget,keyboard:e.detail===0})}
                style={{color:'#818cf8',fontSize:10,fontFamily:'var(--font-mono)',letterSpacing:1,
                        background:'none',border:'1px solid #312e81',padding:'2px 6px',borderRadius:2,
                        marginRight:6,cursor:'pointer'}}>{glossaryLabel(id)}</button>
            ))}
          </div>}
        </div>
        {showMore&&<div style={{position:'absolute',left:0,right:0,bottom:10,height:26,
             background:'linear-gradient(transparent,#0f172a)',pointerEvents:'none',
             display:'flex',alignItems:'flex-end',justifyContent:'center'}}>
          <span style={{fontSize:9,color:'#818cf8',letterSpacing:1,paddingBottom:1}}>▼ SCROLL FOR MORE</span>
        </div>}
      </div>
      <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
        {step>0&&<button style={btnStyle} onClick={onPrev}>← PREV</button>}
        {t.pathChoice&&!quick&&onQuick
          ?<><button style={btnStyle} onClick={onQuick}>QUICK START</button>
             <button style={{...btnStyle,borderColor:'#4f46e5',color:'#818cf8'}} onClick={onNext}>FULL TOUR →</button></>
          :step<total-1
          ?<button style={{...btnStyle,borderColor:'#4f46e5',color:'#818cf8'}} onClick={onNext}>NEXT →</button>
          :<button style={{...btnStyle,borderColor:'#16a34a',color:'#4ade80'}} onClick={onDone??onClose}>DONE ✓</button>}
      </div>
    </div>
  );
};

// ────────────────────────────────────────────────────────────────────────────
function App(){
  // The *Raw setters bypass undo history. Only effects that DERIVE state (migrations, the RIDE
  // HEIGHT → CG sync, tier fallbacks, BOTTOM G, ARB unit conversion) and the restore itself use
  // them. Everything a user does goes through setCh/setFe/setDr/setAl below, which record.
  const[ch,setChRaw]=usePersist('suspos_ch_v8',DEF_CH);
  const[fe,setFeRaw]=usePersist('suspos_fe_v8',DEF_FE,repairFe);
  const[dr,setDrRaw]=usePersist('suspos_dr_v8',DEF_DR);
  const[al,setAlRaw]=usePersist('suspos_al_v2',DEF_AL);
  // Declared this early because the tier effects below list restoreTick as a dependency, and
  // Babel's const→var would read it as undefined further down. Wiring: "Undo / redo wiring".
  const histRef=useRef(null);
  if(!histRef.current)histRef.current=makeHistory();
  const[,bumpHist]=useReducer(x=>x+1,0);
  const[restoreTick,setRestoreTick]=useState(0);
  const restoringRef=useRef(false);
  const recordChangeRef=useRef(()=>{});
  const recordChange=()=>recordChangeRef.current();
  const setCh=v=>{recordChange();setChRaw(v);};
  const setFe=v=>{recordChange();setFeRaw(v);};
  const setDr=v=>{recordChange();setDrRaw(v);};
  const setAl=v=>{recordChange();setAlRaw(v);};
  const[units,setUnits]=usePersist('suspos_units_v2',legacyUnits());
