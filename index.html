  const mMass=units.mass==='kg',mSpring=springUnit(units.spring),mLen=units.length==='cm',mSpeed=units.speed==='kmh';
  const[showUnits,setShowUnits]=useState(false);
  const[saves]=usePersist('suspos_saves_v9',PRESET_SAVES); // read-only: legacy slots, source for one-time MY BUILDS migration
  const[uiMode,setUiMode]=usePersist('suspos_uimode_v1','beginner');
  // Read-only since the header zoom buttons were removed — the persisted value is still
  // honoured (anyone who had set a custom zoom keeps it) but the app no longer writes it.
  // Browser zoom (Ctrl +/-) covers the same need.
  const[uiZoom]=usePersist('suspos_zoom_v1',1.1);
  const[tutSeen,setTutSeen]=usePersist('suspos_tutorial_seen_v1',{beginner:false,intermediate:false,pro:false});
  const[balTutSeen,setBalTutSeen]=usePersist('suspos_baltut_seen_v1',false);
  // Last step reached per tier guide, so ? can offer RESUME. 0 = nothing to resume;
  // cleared on DONE and by RESET (Tutorials). Clamped on read — steps get added and removed.
  const[tutProgress,setTutProgress]=usePersist('suspos_tutorial_step_v1',{beginner:0,intermediate:0,pro:0});
  const[balTutOpen,setBalTutOpen]=useState(false);
  const[balTutStep,setBalTutStep]=useState(0);
  const openBalTut=()=>{setBalTutStep(0);setBalTutOpen(true);};
  const closeBalTut=()=>setBalTutOpen(false);
  const[onboardSeen,setOnboardSeen]=usePersist('suspos_onboard_v1',true);
  // LEGACY — still read by the saves_v9 migration below and by the Beginner builds drawer.
  // The suspos_builds_v1 KEY itself is also a migration source for the unified garage; see
  // the note on that effect. Do not remove.
  const[myBuilds,setMyBuilds]=usePersist('suspos_builds_v1',[]);
  // Unified GARAGE entry list — chassis / build / car entries in one place.
  const[entries,setEntries]=usePersist('suspos_garage_v2',[]);
  // Standalone, deliberately NOT a key in `open`: the SECTIONS −/+ buttons blanket-toggle
  // every key in that object, which would fling a full-height overlay across the results
  // with no visible cause.
  const[garagePanelOpen,setGaragePanelOpen]=useState(false);
  const[entryName,setEntryName]=useState('');
  // Filter and sort are stable preferences worth persisting. Deliberately an OBJECT-valued
  // key, so mergeDefaults actually merges it — unlike the entry array, a new field added
  // here later gets its default for free. Search text is intentionally NOT persisted: a
  // search box that silently hides most of the garage after a reload, with the reason
  // scrolled out of view, is a bug factory.
  const[garageUI,setGarageUI]=usePersist('suspos_garage_ui_v1',{filter:'all',sort:'recent'});
  const[garageSearch,setGarageSearch]=useState('');
  // Vehicle DNA. `draft` is the DNA modal's editor; `applied` is the last APPLY — its name, the
  // axis targets, and what measureDNA read straight after, which is the baseline drift is judged
  // against. Cleared by anything that replaces the tune wholesale, and before leaving PRO.
  const[dnaStore,setDnaStore]=usePersist('suspos_dna_v1',{draft:DNA_ARCHETYPES[0],applied:null});
  const[dnaTierWarn,setDnaTierWarn]=useState(null);
  const[dnaEntryName,setDnaEntryName]=useState('');
  const[dnaCodeIn,setDnaCodeIn]=useState('');
  const[dnaCodeErr,setDnaCodeErr]=useState('');
  const[dnaCodeCopied,setDnaCodeCopied]=useState(false);
  const[showDnaModal,setShowDnaModal]=useState(false);
  // One-time migration: pull any customized old preset slots (suspos_saves_v9) into MY BUILDS.
  // The 6 factory slots that match their defaults are skipped; only renamed/overwritten slots move.
  // Non-destructive (old key left intact); guarded by a flag so it runs at most once per browser.
  useEffect(()=>{
    try{
      if(localStorage.getItem('suspos_builds_migrated_v1'))return;
      const migrated=[];
      for(let i=1;i<=6;i++){
        const s=saves[i],def=PRESET_SAVES[i];
        if(!s||!def)continue;
        const customized=s.name!==def.name||JSON.stringify(s.fe)!==JSON.stringify(def.fe)||JSON.stringify(s.dr)!==JSON.stringify(def.dr);
        if(!customized)continue;
        // skip if MY BUILDS already has an identical entry (idempotency safety)
        const dup=myBuilds.some(b=>b.name===s.name&&JSON.stringify(b.fe)===JSON.stringify(s.fe)&&JSON.stringify(b.dr)===JSON.stringify(s.dr));
        if(dup)continue;
        migrated.push({id:Date.now()+i,name:s.name,fe:{...DEF_FE,...s.fe},dr:{...DEF_DR,...s.dr},savedAt:'imported'});
      }
      if(migrated.length)setMyBuilds(b=>[...migrated,...b]);
      localStorage.setItem('suspos_builds_migrated_v1','1');
    }catch(e){/* corrupt/unavailable storage — skip migration, never block load */}
  },[]); // eslint-disable-line
  // One-time migration: fold the two legacy lists (chassis-only GARAGE + tune-only MY BUILDS)
  // into the unified suspos_garage_v2 entry list. Third link in the chain
  // suspos_saves_v9 → suspos_builds_v1 → suspos_garage_v2, so it must run AFTER the effect
  // above or it would miss slots that migration just pulled in.
  //
  // Reads localStorage directly rather than the `garage`/`myBuilds` state: both effects run
  // on the same mount pass, so the state variables still hold their render-time (pre-migration)
  // values, while localStorage is already current — usePersist's setter writes synchronously.
  useEffect(()=>{
    try{
      // NOTE: suspos_garage_v1 and suspos_builds_v1 no longer have any UI or React binding —
      // these two getItem calls are their ONLY remaining readers. They look like dead keys to
      // a search-based audit; deleting them (or this effect) silently loses every saved
      // chassis and build for anyone who hasn't opened the app since the unification.
      if(localStorage.getItem('suspos_garage_unified_v2'))return;
      const rd=k=>{try{const v=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(v)?v:[];}catch{return[];}};
      const migrated=unifyLegacy(rd('suspos_garage_v1'),rd('suspos_builds_v1'));
      if(migrated.length){
        const sig=e=>JSON.stringify([e.name,e.ch??null,e.fe??null,e.dr??null]);
        const seen=new Set(entries.map(sig));
        const fresh=migrated.filter(e=>!seen.has(sig(e)));
        // exactly ONE set call — see the usePersist note; combining two would clobber
        if(fresh.length)setEntries([...fresh,...entries]);
      }
      localStorage.setItem('suspos_garage_unified_v2','1');
    }catch(e){/* corrupt/unavailable storage — skip migration, never block load */}
  },[]); // eslint-disable-line
  // One-time migration: MAN moved from Balance Mode (arbBalMode) to Stiffness Mode (arbMode).
  // sanitizeTune carries the matching fix for LOAD CODE imports; this covers plain persisted
  // state from before the move (self-guarding — once fixed, the condition never matches again).
  useEffect(()=>{
    if(fe.arbBalMode==='man'&&fe.arbMode!=='man'){
      setFeRaw(p=>({...p,arbBalMode:'manual',arbMode:'man'}));
    }
  },[]); // eslint-disable-line
  // One-time migration: Settle Sync (boolean settleMode + its own settleBias field) replaced
  // by dampBalMode (STANDARD/SYNC/NEUTRAL) + the unified dampingBias. sanitizeTune carries the
  // matching fix for LOAD CODE imports; this covers plain persisted state from before the move.
  // mergeDefaults spreads DEF_FE under the persisted blob, so a legacy save still carries
  // settleMode/settleBias verbatim (DEF_FE no longer defines those keys to override them) —
  // self-guarding, since destructuring them out here means the condition never matches again.
  useEffect(()=>{
    if(fe.settleMode!=null){
      setFeRaw(p=>{
        const{settleMode:_sm,settleBias:_sb,...rest}=p;
        return{...rest,...migrateDampBalMode(p)};
      });
    }
  },[]); // eslint-disable-line
  const[showComplexity,setShowComplexity]=useState(false);
  const closeOnboard=()=>{setOnboardSeen(true);setShowComplexity(false);};
  const[tutMode,setTutMode]=useState(null);
  const[tutStep,setTutStep]=useState(0);
  const[tutQuick,setTutQuick]=useState(false); // QUICK START chosen on a pathChoice card — see tutSteps
  const[tutResume,setTutResume]=useState(null); // {mode, step} while the RESUME / START OVER choice is up

    // Display space, like the target it is compared with. (This was an inline geometry copy,
    // described as "Forza's scale" — it wasn't, by the tyre term and the tyre-series compression.)
    const natBal=natDisplayOf(ch,fe.gameMode);
    // Stability index: track width × tire width normalised to typical values
    const avgTrack=(ch.trackF+ch.trackR)/2;   // metres
    const avgTire=(twF+twR)/2;                 // mm
    const stabIdx=Math.sqrt((avgTrack/1.6)*(avgTire/265));
    // Recommendation target: the Balance Target when something is solving toward it, else neutral 0.50.
    const hasMechTarget=hasBalTargetSolve(feEffective);
    // resolveFeEffective always resolves arbBalTarget to a number, so the fallback is unreachable —
    // it matches the solvers' MECH_BALANCE_TARGET rather than a second, different default.
    const targetBal=hasMechTarget?clampBalTarget(feEffective.arbBalTarget??MECH_BALANCE_TARGET):0.50;
    // REACH: find track-width changes that bring natural rsBalance toward target.
    // Tyre width affects grip capacity (shown via CHASSIS BAL physical display) but NOT
    // roll-stiffness fraction, so REACH shows track-only recommendations.
    // The natural a HYPOTHETICAL track width would give, in the target's display space. The model
    // predicts the change; a measured reading supplies where the current car actually sits. Not
    // natDisplayOf directly: a reading ignores the chassis, so every hypothetical track would come
    // back as the same number and the scan would return its first candidate.
    const _reachOff=natBal-natDisplayModelOf(ch,fe.gameMode);
    const rsBalOf=o=>natDisplayModelOf({...ch,...o},fe.gameMode)+_reachOff;
    const scan=f=>{let best=f.lo,err=Infinity;
      for(let i=0;i<=80;i++){const v=f.lo+(f.hi-f.lo)*i/80;const e=Math.abs(f.bal(v)-targetBal);if(e<err){err=e;best=v;}}return best;};
    const r5=v=>Math.round(v/5)*5;
    const trackF_rec=r5(Math.max(800,Math.min(2200,scan({lo:0.8,hi:2.2,bal:t=>rsBalOf({trackF:t})})*1000)));
    const trackR_rec=r5(Math.max(800,Math.min(2200,scan({lo:0.8,hi:2.2,bal:t=>rsBalOf({trackR:t})})*1000)));
    const trackF_curr=Math.round(ch.trackF*1000),trackR_curr=Math.round(ch.trackR*1000);
    const dTrackF=trackF_rec-trackF_curr,dTrackR=trackR_rec-trackR_curr;
    // Feasibility: track ± 65mm
    const trackFfeas=Math.abs(dTrackF)<=65;
    const trackRfeas=Math.abs(dTrackR)<=65;
    return{natBal,stabIdx,targetBal,hasMechTarget,
           trackF_rec,trackR_rec,dTrackF,dTrackR,trackFfeas,trackRfeas};
  })();
  const{twF:_twF,twR:_twR}=tyreWidths(ch);
  // Display space: the NAT that targets, the Balance Guide, the MECH BALANCE strip and the VISUALS
  // roll-split ticks and ghost rings are all measured against.
  const natMechBalance=natDisplayOf(ch,fe.gameMode);
  // Gap-dependent chassis recommendations — use natMechBalance so measured mode takes effect here too
  const _sgap=chassisAnalysis.targetBal-natMechBalance;
  const gap=Math.abs(_sgap);
  // Recommended AWD center split (rear %) — build type baseline trimmed by three chassis factors.
  const _baseCenterLookup={street:65,track:70,drift:80,rally:60,offroad:55,drag:75};
  const _baseCenter=_baseCenterLookup[dr.buildType??'track']??65;
  const _rearBias=1-ch.frontBias/100;
  const _parsedTyreF=parseTyre(ch.tyreF);
  const _parsedTyreR=parseTyre(ch.tyreR);
  const _diamRatio=(_parsedTyreR?.diameter??642)/(_parsedTyreF?.diameter??642);
  const _weightAdj=Math.round((_rearBias-0.50)*30);          // +3% per 10% extra rear weight
  const _diamAdj  =Math.round((_diamRatio-1)*50);             // +2.5% per 5% larger rear diam
  const _natAdj   =Math.round(-(natMechBalance-0.50)*20);     // −2% per 0.1 above neutral natBal
  const recommendedCenter=Math.max(45,Math.min(90,_baseCenter+_weightAdj+_diamAdj+_natAdj));

  const loadPreset=i=>{
    const s=PRESET_SAVES[i];if(!s)return;
    let adjustedFe={...DEF_FE,...s.fe};
    // Hz is already weight-neutral (spring rate = Hz² × cornerMass), so no scaling needed.
    if(uiMode==='beginner'){
      // Match the Beginner Balance slider's own mechanism (WEIGHT ARB mode + rearHzMult
      // nudge) so the car's achieved balance stays consistent whether or not the user
      // has touched the slider since loading this preset.
      adjustedFe.arbBalMode='weight';
      adjustedFe.rearHzMode='multiplier';
      adjustedFe.dampCharMode='zeta';
      adjustedFe.dampBalMode='standard';
      adjustedFe.dampingBias=0;
      adjustedFe.arbMode='auto';
    }
    commit(`load ${s.name??'preset'}`,()=>{
      setFe(adjustedFe);
      setDr(p=>({...DEF_DR,...s.dr}));
      dnaUnlink();
    });
  };
  // ── GARAGE actions ────────────────────────────────────────────────────────
  // Every mutation is a single setEntries call that stamps updatedAt (usePersist's setter
  // closes over the render-time value, so two calls in one tick would clobber).
  const mutEntry=(id,fn)=>setEntries(list=>list.map(e=>e.id===id?{...fn(e),updatedAt:Date.now()}:e));
  const garageSave=which=>{
    const now=Date.now();
    setEntries(list=>[normalizeEntry({
      id:now,name:entryName.trim()||'Untitled',
      ...(which==='chassis'||which==='both'?{ch:{...ch}}:{}),
      ...(which==='build'  ||which==='both'?{fe:{...fe},dr:{...dr},...(dnaStore.applied?{dna:dnaStore.applied}:{})}:{}),
      tier:uiMode,
      createdAt:now,updatedAt:now,
    }),...list]);
    setEntryName('');
  };
  // Imported straight into the garage as a new entry, leaving the live ch/fe/dr untouched —
  // the counterpart to APPLY SELECTED in the LOAD CODE tab, which applies to the live tune
  // instead. Both take the same merge, so the entry is exactly what APPLY would have given you.
  // tier is the SENDER's, taken from the decoded code — this entry is their tune, and
  // stamping the importer's own tier on it would erase the one fact the field records.
  // Codes with no id 77 pass null through and the card shows no tier chip.
  const garageImport=(ic,ife,idr,sel,tier)=>{
    const now=Date.now();
    setEntries(list=>[normalizeEntry({
      id:now,name:'Imported '+new Date(now).toLocaleDateString(),
      ...(tierOf(tier)?{tier}:{}),
      ...(sel.ch?{ch:{...DEF_CH,...ic}}:{}),
      ...((sel.fe||sel.dr)?{fe:{...DEF_FE,...ife},dr:{...DEF_DR,...idr}}:{}),
      createdAt:now,updatedAt:now,
    }),...list]);
  };
  const garageRewrite=(id,which)=>mutEntry(id,e=>{
    if(which==='dna')return{...e,dna:{...dnaDraft,name:e.name}};
    const{dna:_d,...rest}=e;
    // Rewriting replaces the payload with the live one, so the tier is restamped too —
    // leaving the old one would label the new contents with the session that wrote the
    // contents they replaced.
    return{...(which==='build'||which==='both'?rest:e),tier:uiMode,
      ...(which==='chassis'||which==='both'?{ch:{...ch}}:{}),
      ...(which==='build'  ||which==='both'?{fe:{...fe},dr:{...dr},...(dnaStore.applied?{dna:dnaStore.applied}:{})}:{}),
    };
  });
  const garageDelete=id=>setEntries(list=>list.filter(e=>e.id!==id));
  const garageRename=(id,name)=>mutEntry(id,e=>({...e,name:name.trim()||'Untitled'}));
  const garageNotes=(id,notes)=>mutEntry(id,e=>({...e,notes}));
  const garageAddTag=(id,tag)=>mutEntry(id,e=>({...e,
    tags:(e.tags||[]).includes(tag)?e.tags:[...(e.tags||[]),tag]}));
  const garageRemoveTag=(id,tag)=>mutEntry(id,e=>({...e,tags:(e.tags||[]).filter(t=>t!==tag)}));
  // Each load is one undo step (commit), labelled with the entry name for the ↩/↪ tooltips.
  const garageLoadChassis=e=>{if(e.ch)commit(`load chassis ${e.name}`,()=>setCh({...DEF_CH,...e.ch}));};
  // A build entry saved before dampBalMode existed still carries the legacy settleMode/
  // settleBias fields verbatim (same reason sanitizeTune/the mount-effect migration exist) —
  // a plain {...DEF_FE,...e.fe} spread doesn't migrate them, so route through the shared helper.
  const garageLoadBuild=e=>{if(e.fe||e.dr)commit(`load build ${e.name}`,()=>{
    if(e.fe){
      const merged={...DEF_FE,...e.fe};
      const dampBal=migrateDampBalMode(merged);
      const{settleMode:_sm,settleBias:_sb,...rest}=merged;
      setFe({...rest,...dampBal});
    }
    if(e.dr)setDr({...DEF_DR,...e.dr});
    setDnaStore({...dnaStore,applied:e.dna??null});
  });};
  const allTags=[...new Set(entries.flatMap(e=>e.tags||[]))].sort();
  // filter by kind -> filter by text -> sort. Filtering first keeps the sort stable with
  // respect to what's actually visible.
  const garageEntries=entries.filter(e=>kindOf(e)!=='dna');
  const dnaEntries=entries.filter(e=>kindOf(e)==='dna').sort((a,b)=>stampOf(b)-stampOf(a));
  const kindCounts=entries.reduce((a,e)=>{const k=kindOf(e);a[k]=(a[k]||0)+1;return a;},{});
  const garageList=(()=>{
    const q=garageSearch.trim().toLowerCase();
    let out=garageUI.filter==='all'?garageEntries:garageEntries.filter(e=>kindOf(e)===garageUI.filter);
    if(q)out=out.filter(e=>{
      // derived auto-tag labels are searchable too — typing AWD or RACE or DRIFT filters
      // instantly with no manual tagging effort, which is what earns the feature its place
      const hay=[e.name,e.notes||'',...(e.tags||[]),...autoTagsOf(e).map(t=>t.label)].join(' ').toLowerCase();
      return hay.includes(q);
    });
    // Precompute once per sort — stampOf falls back to Date.now() for timestamp-less entries,
    // so calling it fresh inside the comparator would give the same entry a different value
    // on each comparison, an inconsistent comparator that can produce unstable ordering.
    const stamp=new Map(out.map(e=>[e,stampOf(e)]));
    const by={
      recent:(a,b)=>stamp.get(b)-stamp.get(a),
      oldest:(a,b)=>stamp.get(a)-stamp.get(b),
      name:(a,b)=>(a.name||'').toLowerCase().localeCompare((b.name||'').toLowerCase()),
      kind:(a,b)=>{const o={chassis:0,build:1,car:2,dna:3,empty:4};
        return (o[kindOf(a)]-o[kindOf(b)])||(stamp.get(b)-stamp.get(a));},
    };
    return[...out].sort(by[garageUI.sort]||by.recent);
  })();
  const performGlobalReset=()=>{
    if(resetOpts.tune)commit('reset',()=>{
      setCh({...DEF_CH});
      setFe({...DEF_FE});
      setDr({...DEF_DR});
      setAl({...DEF_AL});
      dnaUnlink();
    });
    if(resetOpts.tutorials){setTutSeen({beginner:false,intermediate:false,pro:false});setBalTutSeen(false);setTutProgress({beginner:0,intermediate:0,pro:0});}
    setShowResetModal(false);
    setResetOpts({tune:true,tutorials:false});
  };

  // Keep LAST among App's effects: every effect above has already seen this render's restore.
  useEffect(()=>{restoringRef.current=false;});

  // Phones render at natural 1.0× (zoom controls are hidden there); desktop keeps the saved preference.
  const effZoom=isPhone?1:uiZoom;
  return(
    <div style={{display:'flex',flexDirection:'column',height:`calc(100dvh / ${effZoom})`,minHeight:'-webkit-fill-available',overflow:'hidden',zoom:effZoom}}>
      {showChecker&&<CheckerModal onClose={()=>setShowChecker(false)} lim={lim} units={units} ch={ch} setCh={setCh} setFe={v=>commit('import from CHECK',()=>setFe(v))}
        onImportDna={uiMode==='pro'?dnaFromDecoded:null} initialMode={checkerInitMode}/>}
      {/* DNA — PRO only. The editor holds a draft; APPLY stamps it onto fe/dr once and records
          the link the sidebar marks and the VISUALS match card read. Opened from the sidebar
          toolbar; below PRO the modal still opens so the feature is discoverable. */}
      {/* UNITS modal — per-category display units (see UNIT_GROUPS). Opened from the
          header's UNITS button, or the sidebar's on a compact header. */}
      {showUnits&&(
        <div style={{position:'fixed',inset:0,background:'#000000cc',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}}
             onClick={()=>setShowUnits(false)}>
          <div style={{background:'#020617',border:'1px solid #1e293b',borderRadius:2,width:360,maxWidth:'calc(100vw - 20px)',
                       maxHeight:'88vh',display:'flex',flexDirection:'column',overflow:'hidden',fontFamily:'var(--font-mono)'}}
               onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                         padding:'8px 14px',borderBottom:'1px solid #1e293b',flexShrink:0}}>
              <span style={{fontSize:12,color:'#9ca3af',letterSpacing:2}}>UNITS</span>
              <button onClick={()=>setShowUnits(false)} aria-label="Close" style={{background:'none',border:'none',color:'#94a3b8',
                cursor:'pointer',fontSize:14}}>✕</button>
            </div>
            <div style={{padding:'10px 14px 14px',flex:1,minHeight:0,overflowY:'auto',overscrollBehavior:'contain'}}>
              <UnitsPicker units={units} setUnits={setUnits}/>
            </div>
          </div>
        </div>
      )}
      {showDnaModal&&(
        <div style={{position:'fixed',inset:0,background:'#000000cc',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}}
             onClick={()=>setShowDnaModal(false)}>
          <div style={{background:'#020617',border:'1px solid #1e293b',borderRadius:2,width:420,maxWidth:'calc(100vw - 20px)',
                       maxHeight:'88vh',display:'flex',flexDirection:'column',overflow:'hidden',fontFamily:'var(--font-mono)'}}
               onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                         padding:'8px 14px',borderBottom:'1px solid #1e293b',flexShrink:0}}>
              <span style={{fontSize:12,color:'#9ca3af',letterSpacing:2}}>VEHICLE DNA
                {uiMode!=='pro'&&<span style={{fontSize:8,color:'#818cf8',letterSpacing:1,marginLeft:8}}>PRO</span>}</span>
              <button onClick={()=>setShowDnaModal(false)} aria-label="Close" style={{background:'none',border:'none',color:'#94a3b8',
                cursor:'pointer',fontSize:14}}>✕</button>
            </div>
            {/* Header stays put; only this body scrolls. */}
            <div style={{padding:'10px 14px 14px',flex:1,minHeight:0,overflowY:'auto',overscrollBehavior:'contain'}}>
                {uiMode!=='pro'&&<div style={{fontSize:9,color:'#475569',padding:'0 0 4px'}}>
                  Switch to PRO to build a tune from a handling DNA.</div>}
                {dnaPreview&&(()=>{
                  const r=dnaPreview;
                  const setAxis=(k,v)=>setDnaStore({...dnaStore,draft:{...dnaStore.draft,axes:{...dnaDraft.axes,[k]:v}}});
                  // sanitizeDNA keeps `slack` sparse, so a 0 is written and then dropped on the
                  // way back in rather than stored as a zero entry.
                  const setSlack=(k,v)=>setDnaStore({...dnaStore,draft:{...dnaStore.draft,slack:{...dnaDraft.slack,[k]:v}}});
                  const labelOf=k=>DNA_AXIS_UI.find(a=>a.k===k)?.label??k;
                  // Swap with the neighbour. Writing the whole array keeps it a permutation, so
                  // sanitizeDNA never has to repair what the editor produced.
                  const keepMove=(i,d)=>{
                    const a=[...dnaDraft.keep],j=i+d;
                    if(j<0||j>=a.length)return;
                    [a[i],a[j]]=[a[j],a[i]];
                    setDnaStore({...dnaStore,draft:{...dnaStore.draft,keep:a}});
                  };
                  const modeDiffs=DNA_MODE_FIELDS.filter(([o,f])=>(o==='fe'?fe:dr)[f]!==(o==='fe'?r.fe:r.dr)[f]);
                  return(<>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4,marginBottom:8}}>
                      {DNA_ARCHETYPES.map(a=>{
                        const on=dnaRef?.id==null&&dnaRef?.name===a.name;
                        return <button key={a.name} className={`tbtn${on?' on':''}`} style={{fontSize:9,padding:'4px 2px'}}
                          onClick={()=>setDnaStore({...dnaStore,draft:{...a,ref:{name:a.name,axes:a.axes,slack:a.slack}}})}>{a.name}</button>;
                      })}
                    </div>
                    {/* MY DNA — saved DNAs as garage entries of kind 'dna', laid out like the saved
                        garage list below: a save row, then EntryCards. LOAD DNA fills the editor;
                        it does not apply. */}
                    <div style={{marginBottom:10}}>
                      <div onClick={()=>setOpen(p=>({...p,dnaSavedOpen:!p.dnaSavedOpen}))}
                        style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',marginBottom:5,userSelect:'none'}}>
                        <span style={{fontSize:9,letterSpacing:2,color:'#334155'}}>MY DNA</span>
                        <span style={{fontSize:9,color:'#475569'}}>{dnaEntries.length}</span>
                        <span style={{marginLeft:'auto',fontSize:9,color:'#475569'}}>{open.dnaSavedOpen?'▲':'▼'}</span>
                      </div>
                      {open.dnaSavedOpen&&<>
                        <div style={{marginBottom:6}}>
                          <input value={dnaEntryName} onChange={e=>setDnaEntryName(e.target.value)}
                            onKeyDown={e=>{if(e.key==='Enter')dnaSave();}}
                            placeholder={`Name this DNA… (${dnaName})`}
                            style={{width:'100%',background:'#0f172a',border:'1px solid #1e293b',borderRadius:2,
                                    padding:'4px 7px',fontSize:11,color:'#e2e8f0',outline:'none',
                                    fontFamily:'inherit',marginBottom:5}}/>
                          <button className="tbtn" style={{width:'100%',fontSize:9}} onClick={dnaSave}>SAVE DNA</button>
                        </div>
                        {dnaEntries.length===0
                          ?<div style={{fontSize:10,color:'#374151',textAlign:'center',padding:'10px 0',letterSpacing:1}}>
                             NO SAVED DNA<div style={{fontSize:9,marginTop:6,letterSpacing:0}}>
                               Set the sliders below, name it above, then save.</div></div>
                          :dnaEntries.map(e=>(
                             <EntryCard key={e.id} entry={e} metricUnits={mMass} allTags={allTags}
                               onLoadDna={dnaLoadSaved}
                               onRewrite={garageRewrite} onDelete={garageDelete} onRename={garageRename}
                               onNotes={garageNotes} onAddTag={garageAddTag} onRemoveTag={garageRemoveTag}/>
                           ))}
                      </>}
                    </div>
                    {/* CODE — a DNA travels on its own code, never in the tune codec. Paste one in
                        and it replaces the draft with no `ref`, the way IMPORT AS DNA does: it came
                        from somewhere else, so "edited from" would name a DNA this app never had. */}
                    <div style={{marginBottom:10}}>
                      <div style={{fontSize:9,letterSpacing:2,color:'#334155',marginBottom:4}}>CODE</div>
                      <div style={{display:'flex',gap:4,marginBottom:5}}>
                        <input readOnly value={encodeDNA(dnaDraft)} onFocus={e=>e.target.select()}
                          aria-label="This DNA as a share code"
                          style={{flex:1,minWidth:0,background:'#0f172a',border:'1px solid #1e293b',borderRadius:2,
                                  padding:'4px 7px',fontSize:9,color:'#64748b',outline:'none',fontFamily:'inherit'}}/>
                        <button className={`tbtn${dnaCodeCopied?' saved':''}`} style={{fontSize:9}}
                          onClick={()=>copyToClipboard(encodeDNA(dnaDraft),()=>setDnaCodeCopied(true))}>
                          {dnaCodeCopied?'COPIED':'COPY'}</button>
                      </div>
                      <div style={{display:'flex',gap:4}}>
                        <input value={dnaCodeIn} onChange={e=>{setDnaCodeIn(e.target.value);setDnaCodeErr('');}}
                          onKeyDown={e=>{if(e.key==='Enter')dnaLoadCode();}}
                          placeholder="Paste a DNA code…" aria-label="Paste a DNA code"
                          style={{flex:1,minWidth:0,background:'#0f172a',border:'1px solid #1e293b',borderRadius:2,
                                  padding:'4px 7px',fontSize:9,color:'#e2e8f0',outline:'none',fontFamily:'inherit'}}/>
                        <button className="tbtn" style={{fontSize:9}} disabled={!dnaCodeIn.trim()}
                          onClick={dnaLoadCode}>LOAD</button>
                      </div>
                      {dnaCodeErr&&<div style={{fontSize:9,color:'#f87171',marginTop:4}}>{dnaCodeErr}</div>}
                    </div>
                    <div style={{fontSize:9,color:dnaEdited?'#f59e0b':'#64748b',marginBottom:6,letterSpacing:0.5}}>
                      {dnaEdited?<>EDITED FROM {dnaRef.name} · <span style={{cursor:'pointer',textDecoration:'underline'}}
                        onClick={()=>setDnaStore({...dnaStore,draft:{...dnaStore.draft,axes:{...dnaRef.axes},
                          slack:{...dnaSlackRef},keep:[...dnaKeepRef]}})}>REVERT</span></>
                        :<>EDITING {dnaName}</>}</div>
                    {DNA_AXIS_UI.map(({k,label,step,unit,dp})=>(
                      <div key={k}>
                        <FeelSlider label={label} value={dnaDraft.axes[k]}
                          onChange={v=>setAxis(k,v)} min={DNA_AXES[k].min} max={DNA_AXES[k].max} step={step}
                          box={{unit:(unit||'').trim()||undefined,dp}}/>
                        {/* Slack: how far this axis may land from the target and still count as
                            met. 0 is a point target, which is how every DNA behaved before it
                            existed. Only outcome axes have one — the setting axes always land. */}
                        {DNA_SLACK_AXES.includes(k)&&(
                          <div style={{display:'flex',alignItems:'center',gap:5,margin:'-2px 0 6px',fontSize:9}}>
                            <span style={{color:'#475569',letterSpacing:1}}>ACCEPT ±</span>
                            <NumBox value={dnaDraft.slack[k]??0} min={0} max={dnaSlackMax(k)} dp={dp}
                              label={`${label} slack`} placeholder="0"
                              onCommit={v=>setSlack(k,v)}/>
                            <span style={{color:'#334155'}}>{(unit||'').trim()}</span>
                          </div>
                        )}
                      </div>
                    ))}
                    {/* PRIORITY — the draft's `keep` order, most protected first. The resolver
                        only ever spends an axis ranked BELOW the one it is trying to reach, so
                        this list decides which target survives when they conflict. Only the five
                        yieldable axes appear: the setting axes are written verbatim and bump ratio
                        rides on rebound ζ's rank. See docs/DNA.md. */}
                    <div style={{borderTop:'1px solid #1e293b',paddingTop:6,marginTop:4,marginBottom:6}}>
                      <div style={{fontSize:9,letterSpacing:2,color:'#334155',marginBottom:1}}>PRIORITY</div>
                      <div style={{fontSize:8,color:'#475569',marginBottom:4}}>
                        Most protected first — the lowest gives way when targets conflict.</div>
                      {dnaDraft.keep.map((k,i)=>{
                        const moved=r.moves.some(m=>m.axis===k),missed=r.misses.some(m=>m.axis===k);
                        return(
                          <div key={k} style={{display:'flex',alignItems:'center',gap:6,fontSize:9,lineHeight:1.9}}>
                            <span style={{color:'#475569',width:12,flexShrink:0,textAlign:'right'}}>{i+1}</span>
                            <span style={{color:missed||moved?'#f59e0b':'#94a3b8',flex:1,minWidth:0}}>
                              {labelOf(k)}{moved&&' · gave way'}{missed&&' · missed'}</span>

                            <button className="tbtn" disabled={i===dnaDraft.keep.length-1} onClick={()=>keepMove(i,1)}
                              aria-label={`Protect ${labelOf(k)} less`} title="Less protected"
                              style={{fontSize:8,padding:'0 5px',opacity:i===dnaDraft.keep.length-1?0.25:1}}>▼</button>
                          </div>
                        );
                      })}

            {uiMode==='pro'&&<div style={{background:'#060c17',border:'1px solid #1e293b',borderRadius:2,padding:'5px 10px',marginTop:6,display:'flex',alignItems:'center',gap:6}}>

            {(()=>{

            {(()=>{
              const rRef=physics.rideRef??'front'; // 'front', 'rear', or 'shared'
              // Use tune.fHz/tune.rHz (not physics values) so CO-SOLVE effectiveRHz is reflected.
              // physics.rearHz is the pre-CO-SOLVE flatRide value; tune.rHz is the actual solved Hz.

              const primaryHz=rRef==='rear'?tune.rHz:rRef==='shared'?avgHz:tune.fHz;
              // Bottom-out g <-> Hz, same sag model as the SAG vs LOAD chart (gConst=9810mm/s^2).
              const rhPrimary_mm=rRef==='rear'?ch.rideHeightR*1000:rRef==='shared'?(ch.rideHeightF+ch.rideHeightR)/2*1000:ch.rideHeightF*1000;
              const hzToBottomG=hz=>rhPrimary_mm*Math.pow(2*Math.PI*hz,2)/9810;
              const bottomGToHz=g=>Math.sqrt(9810*Math.max(0,g)/rhPrimary_mm)/(2*Math.PI);
              const bottomGLo=hzToBottomG(HZ_MIN), bottomGHi=hzToBottomG(HZ_MAX);
              const primaryBottomG=hzToBottomG(primaryHz);
              // Translational parity for the REAR HZ mode: 'shared' (equal bottom-out) only
              // exists under BOTTOM G's, and 'independent' only under FRONT/REAR ref, so those
              // combinations have to be rehomed when the mode they belong to is left. Falling
              // back to flatRide re-derived the split and visibly moved both axles' Hz; pinning
              // MULTIPLIER to the ratio the car is sitting at right now reproduces the exact
              // same front and rear frequencies, so only the control changes, not the car.
              const holdHzRatio={rearHzMode:'multiplier',
                rearHzMult:Math.round(Math.max(0.5,Math.min(3,physics.frontHz>0?physics.rearHz/physics.frontHz:1.2))*100)/100};
              return(<>
                {/* Ride reference toggle — always visible, works in CO-SOLVE via Hz inversion */}
                <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:4}}>
                  <span style={{flex:1,fontSize:10,color:'#94a3b8',letterSpacing:1}}>RIDE REF.<Hint text="Which axle the stiffness slider sets. FRONT or REAR: that axle, the other is derived. SHARED: the average, with the mode below setting the ratio. Switching never changes the actual Hz." term="ride-ref"/></span>
                  <button className={`tog${rRef==='front'?' on':''}`}
                    onClick={()=>setFe(p=>({...p,
                      rideRef:'front',
                      rideStiffness:hzToRs(physics.frontHz),
                      ...(p.rearHzMode==='independent'?{rearHzMan:Math.round(physics.rearHz*100)/100}:{}),
                      ...(p.rearHzMode==='shared'?holdHzRatio:{})}))}>FRONT</button>
                  <button className={`tog${rRef==='shared'?' on':''}`}
                    onClick={()=>setFe(p=>({...p,
                      rideRef:'shared',
                      rideStiffness:hzToRs((tune.fHz+tune.rHz)/2),
                      ...(p.rearHzMode==='independent'?holdHzRatio:{})}))}>SHARED</button>
                  <button className={`tog${rRef==='rear'?' on':''}`}
                    onClick={()=>setFe(p=>({...p,
                      rideRef:'rear',
                      rideStiffness:hzToRs(tune.rHz),
                      ...(p.rearHzMode==='independent'?{rearHzMan:Math.round(tune.fHz*100)/100}:{}),
                      ...(p.rearHzMode==='shared'?holdHzRatio:{})}))}>REAR</button>
                </div>
                {(()=>{
                  const effStiffMode=(fe.rideStiffMode??'hz')==='bottomG'&&ch.useRideHeightCG?'bottomG':'hz';
                  return ch.useRideHeightCG&&<div style={{display:'flex',alignItems:'center',gap:4,marginBottom:4}}>
                  <span style={{flex:1,fontSize:10,color:'#94a3b8',letterSpacing:1}}>STIFFNESS<Hint text="What the stiffness slider below sets. HZ: spring frequency. BOTTOM G's: the vertical load at which the RIDE REF. axle bottoms out. Shown only with RIDE HEIGHT → CG on (CHASSIS section)." term="bottom-g"/></span>
                  <button className={`tog${effStiffMode==='hz'?' on':''}`} onClick={()=>setFe(p=>({...p,rideStiffMode:'hz',
                    ...(p.rearHzMode==='shared'?holdHzRatio:{})}))}>HZ</button>
                  <button className={`tog${effStiffMode==='bottomG'?' on':''}`} onClick={()=>setFe(p=>({...p,rideStiffMode:'bottomG',rideBottomG:primaryBottomG}))}>BOTTOM G's</button>
                </div>;
                })()}
                {(fe.rideStiffMode??'hz')==='bottomG'&&ch.useRideHeightCG?
                <FeelSlider
                  label={rRef==='rear'?'Rear Bottom-Out':rRef==='shared'?'Avg Bottom-Out':'Front Bottom-Out'}
                  value={primaryBottomG}
                  onChange={v=>setFe(p=>({...p,rideStiffness:hzToRs(bottomGToHz(v)),rideBottomG:v}))}
                  min={bottomGLo} max={bottomGHi} step={0.01} leftLabel={bottomGLo.toFixed(2)} rightLabel={bottomGHi.toFixed(2)}
                  markers={null}
                  box={{unit:'g'}}
                  hint={`Vertical load, in g, at which the ${rRef==='rear'?'rear':rRef==='shared'?'average':'front'} axle bottoms out, from static ride height and 1g sag. Saved with the build; Hz re-solves to hold it.`} hintTerm="bottom-g"/>
                :
                <FeelSlider
                  label={<>{dnaDot('platformHz',rRef!=='front')}{rRef==='rear'?'Rear Stiffness':rRef==='shared'?'Avg Stiffness':'Ride Stiffness'}</>}
                  value={primaryHz}
                  onChange={v=>pFe('rideStiffness')(hzToRs(v))}
                  min={HZ_MIN} max={HZ_MAX} step={0.01} leftLabel={HZ_MIN.toFixed(2)} rightLabel={HZ_MAX.toFixed(2)}
                  markers={HZ_MARKERS}
                  box={{unit:'Hz'}}
                  hint={rRef==='rear'
                    ?'Rear spring frequency, the reference; the mode below derives the front. Typical: 1.0–1.8 Hz street, 1.8–2.6 Hz track.'
                    :rRef==='shared'
                    ?'Average of front and rear spring frequency; both axles move together while the mode below holds the ratio.'
                    :'Front spring frequency, the reference; the mode below derives the rear. Typical: 1.0–1.8 Hz street, 1.8–2.6 Hz track.'} hintTerm="ride-stiffness"/>}
              </>);
            })()}
            {/* secondary Hz mode toggle — hidden in CO-SOLVE (rear Hz solved automatically) */}
            {arbBalMode!=='coSolve'&&(()=>{
              const isShared=(physics.rideRef??'front')==='shared';
              // SHARED Hz mode only makes sense with an actual per-axle bottom-out g to equalise —
              // that's only exposed while STIFFNESS is BOTTOM G's (RIDE HEIGHT → CG required for it).
              const showSharedG=isShared&&(fe.rideStiffMode??'hz')==='bottomG'&&ch.useRideHeightCG;
              const btnCount=2+(uiMode==='pro'?1:0)+(!isShared?1:0)+(showSharedG?1:0);
              return<>
                <div style={{display:'flex',alignItems:'center',marginBottom:3,marginTop:-2}}>
                  <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1,flex:1}}>Hz MODE<Hint text={`Derives the other axle's Hz. MULTIPLIER: fixed ratio. FLAT RIDE: less pitch bounce at Target Speed. INDEPENDENT: by hand. SHARED: same bottom-out g.${uiMode==='pro'?' MECH: from Mech Balance Target. Hidden in CO-SOLVE.':''}`} term="hz-mode"/></span>
                </div>
                <div style={{display:'grid',gridTemplateColumns:`repeat(${btnCount},1fr)`,gap:3,marginBottom:10}}>
                  <button className={`tog${rearHzMode==='multiplier'?' on':''}`}
                    onClick={()=>setFe(p=>({...p,rearHzMode:'multiplier',
                      rearHzMult:Math.round(physics.rearHz/physics.frontHz*100)/100}))}>MULTIPLIER</button>
                  {uiMode==='pro'&&<button className={`tog${rearHzMode==='mech'?' on':''}`}
                    onClick={()=>setFe(p=>({...p,rearHzMode:'mech'}))}>MECH</button>}
                  <button className={`tog${rearHzMode==='flatRide'?' on':''}`}
                    onClick={()=>setFe(p=>({...p,rearHzMode:'flatRide'}))}>FLAT RIDE</button>
                  {!isShared&&<button className={`tog${rearHzMode==='independent'?' on':''}`}
                    onClick={()=>setFe(p=>({...p,rearHzMode:'independent',
                      rearHzMan:Math.round((physics.rideRef==='rear'?physics.frontHz:physics.rearHz)*100)/100}))}>INDEPENDENT</button>}
                  {showSharedG&&<button className={`tog${rearHzMode==='shared'?' on':''}`}
                    onClick={()=>setFe(p=>({...p,rearHzMode:'shared'}))}>SHARED</button>}
                </div>
              </>;
            })()}
            {arbBalMode!=='coSolve'&&(()=>{
              const rRef=physics.rideRef??'front';
              const isShared=rRef==='shared';
              const secLabel=rRef==='rear'?'front':'rear';
              const secHz=rRef==='rear'?physics.frontHz:physics.rearHz;
              // Olley's own reference point is front ≈80% of rear (×1.25); Penske/Race Comp's
              // practitioner range tops out around ×1.20. Above ×1.25 the flat-ride ratio has
              // drifted outside every published source, usually because Ride Stiffness rose
              // without Target Speed following it — the correct fix is to raise Target Speed
              // (lower OFF/CITY position), not to abandon flat ride. See docs/PHYSICS.md.
              const flatRideRatio=tune.fHz>0?tune.rHz/tune.fHz:1;
              const flatRideRatioHigh=flatRideRatio>1.25;
              return rearHzMode==='flatRide'
              ? <>
                <FeelSlider label="Target Speed" value={240-fe.targetSpeed}
                  onChange={v=>pFe('targetSpeed')(240-v)} min={40} max={180} step={5}
                  leftLabel="OFF" rightLabel="CITY"
                  // The slider runs inverted (240 − speed); the box shows and takes the speed itself,
                  // in the display unit, and stores whole mph inside sanitizeTune's 60–200.
                  box={{
                    value:mSpeed?Math.round(fe.targetSpeed*KMH_PER_MPH):fe.targetSpeed,
                    onCommit:v=>pFe('targetSpeed')(Math.max(60,Math.min(200,Math.round(mSpeed?v/KMH_PER_MPH:v)))),
                    min:mSpeed?Math.round(60*KMH_PER_MPH):60,
                    max:mSpeed?Math.round(200*KMH_PER_MPH):200,
                    dp:0,unit:mSpeed?'km/h':'mph'}}
                  // Resulting Hz is in the FRONT/REAR strip below; flag only OFF and a clamp.
                  readout={[fe.targetSpeed>=200&&'OFF',physics.rearHzClamped&&'⚠'].filter(Boolean).join(' ')||null}
                  hint={isShared
                    ?"Sets how the Avg Stiffness is split front/rear using flat-ride timing; the average stays put."
                    :rRef==='rear'
                    ?"Speed at which front and rear hit bumps in phase. Right (CITY) = lower speed, softer front. Left (OFF) = disabled, equal front and rear Hz."
                    :"Speed at which front and rear hit bumps in phase. Right (CITY) = lower speed, stiffer rear. Left (OFF) = disabled, equal front and rear Hz."} hintTerm="target-speed"/>
                {flatRideRatioHigh&&<div style={{fontSize:11,color:'#f59e0b',lineHeight:1.6,
                     marginTop:6,padding:'6px 8px',background:'#020617',borderRadius:2,
                     border:'1px solid #f5a62333'}}>
                  Rear is running ×{flatRideRatio.toFixed(2)} over front, above the typical
                  10–20% flat-ride range: raise Target Speed (toward OFF) or lower Ride
                  Stiffness. <TermLink id="flat-ride"/>
                </div>}
                </>
            : rearHzMode==='multiplier'
              ? <FeelSlider
                  label={<>{dnaDot('pitchRatio',rRef!=='front')}{isShared?'F/R Ratio':rRef==='rear'?'Front Multiplier':'Rear Multiplier'}</>}
                  value={fe.rearHzMult??1.20}
                  onChange={pFe('rearHzMult')} min={0.50} max={3.00} step={0.01}
                  leftLabel="×0.50" rightLabel="×3.00"
                  markers={[{value:1.00,color:'#94a3b8',label:'MATCH'}]}
                  // The resulting Hz is in the FRONT/REAR strip right below, so no readout.
                  box={{unit:rRef==='rear'?'÷':'×'}}
                  hint={isShared
                    ?"Rear-to-front Hz ratio; shifts stiffness between axles while Avg Stiffness holds the average."
                    :rRef==='rear'
                    ?"Front Hz as a fraction of rear Hz. ÷1.20 = front is 83% of rear Hz."
                    :"Rear Hz as a multiple of front Hz. ×1.00 = matched; ×1.20 is a typical start. Higher leans toward oversteer."} hintTerm="hz-multiplier"/>
            : rearHzMode==='mech'
              ? <div style={{background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:2,
                             padding:'6px 10px',marginBottom:6}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                    <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>
                      {isShared?'SOLVED SPLIT':'SOLVED '+secLabel.toUpperCase()+' Hz'}
                    </span>
                    {isShared
                      ?<><span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:physics.rearHzClamped?'#f59e0b':'#e2e8f0'}}>F {physics.frontHz.toFixed(2)}</span>
                        <span style={{fontSize:10,color:'#94a3b8'}}>Hz</span>
                        <span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:physics.rearHzClamped?'#f59e0b':'#e2e8f0'}}>R {physics.rearHz.toFixed(2)}</span>
                        <span style={{fontSize:10,color:'#94a3b8'}}>Hz</span></>
                      :<><span style={{fontFamily:'var(--font-mono)',fontSize:14,fontWeight:700,
                                    color:physics.rearHzClamped?'#f59e0b':'#e2e8f0'}}>
                          {secHz.toFixed(2)}
                        </span>
                        <span style={{fontSize:10,color:'#94a3b8'}}>Hz</span></>}
                    {physics.rearHzClamped&&<span style={{fontSize:10,color:'#f59e0b',letterSpacing:1}}>CLAMPED</span>}
                    <span style={{flex:1}}/>
                    <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'#94a3b8'}}>
                      ×{(physics.rearHz/physics.frontHz).toFixed(2)}
                    </span>
                  </div>
                  <div style={{fontSize:10,color:'#94a3b8',lineHeight:1.4}}>
                    {isShared?'Both springs solved from average to reach':rRef==='rear'?'Front spring stiffness solved to reach':'Rear spring stiffness solved to reach'} mech balance target{' '}
                    <span style={{color:'#9ca3af',fontFamily:'var(--font-mono)'}}>{feEffective.arbBalTarget.toFixed(2)}</span>.
                    {' '}{isShared?'Avg Stiffness slider shifts both together.':'Set target in the BALANCE section above.'}
                  </div>
                </div>
            : rearHzMode==='shared'
              ? (()=>{
                  const rhF_mm=(ch.rideHeightF??0.13)*1000,rhR_mm=(ch.rideHeightR??0.12)*1000;
                  const gF=rhF_mm*Math.pow(2*Math.PI*physics.frontHz,2)/9810;
                  const gR=rhR_mm*Math.pow(2*Math.PI*physics.rearHz,2)/9810;
                  return <div style={{background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:2,
                                 padding:'6px 10px',marginBottom:6}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                      <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>SOLVED SPLIT</span>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:physics.rearHzClamped?'#f59e0b':'#e2e8f0'}}>F {physics.frontHz.toFixed(2)}</span>
                      <span style={{fontSize:10,color:'#94a3b8'}}>Hz</span>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:physics.rearHzClamped?'#f59e0b':'#e2e8f0'}}>R {physics.rearHz.toFixed(2)}</span>
                      <span style={{fontSize:10,color:'#94a3b8'}}>Hz</span>
                      {physics.rearHzClamped&&<span style={{fontSize:10,color:'#f59e0b',letterSpacing:1}}>CLAMPED</span>}
                    </div>
                    <div style={{fontSize:10,color:'#94a3b8',lineHeight:1.4}}>
                      Front ({gF.toFixed(2)} g) and rear ({gR.toFixed(2)} g) are solved to bottom
                      out at the same g, set by Avg Bottom-Out above.
                    </div>
                  </div>;
                })()
              : <FeelSlider
                  label={rRef==='rear'?'Front Hz':'Rear Hz'}
                  value={fe.rearHzMan??secHz}
                  onChange={pFe('rearHzMan')} min={HZ_MIN} max={HZ_MAX} step={0.01}
                  leftLabel={HZ_MIN.toFixed(2)} rightLabel={HZ_MAX.toFixed(2)}
                  box={{value:secHz,unit:'Hz'}}
                  hint={rRef==='rear'
                    ?"Front spring frequency, set by hand; the stiffness slider above still sets the rear."
                    :"Rear spring frequency, set by hand; the stiffness slider above still sets the front."} hintTerm="hz-mode"/>;
            })()}
            <div style={{display:'flex',alignItems:'center',gap:6,
                         padding:'5px 8px',background:'#0a0f1a',borderRadius:2,
                         border:'1px solid #1e293b',marginBottom:10,marginTop:-6}}>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>FRONT</span>
              {/* Amber on the derived axle when the Hz band clamped it — the same cue MECH's own
                  SOLVED readout gives. Under SHARED both ends are derived, so both light up. */}
              <span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:physics.rearHzClamped&&(physics.rideRef??'front')!=='front'?'#f59e0b':'#e2e8f0'}}>{physics.frontHz.toFixed(2)}</span>
              <span style={{fontSize:10,color:'#94a3b8'}}>Hz</span>
              <div style={{flex:1,height:1,background:'#1e293b'}}/>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:0.5,fontFamily:'var(--font-mono)'}}>
                {`×${(tune.rHz/physics.frontHz).toFixed(2)}`}
              </span>
              <div style={{flex:1,height:1,background:'#1e293b'}}/>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>REAR</span>
              <span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:physics.rearHzClamped&&(physics.rideRef??'front')!=='rear'?'#f59e0b':'#e2e8f0'}}>{tune.rHz.toFixed(2)}</span>
              <span style={{fontSize:10,color:'#94a3b8'}}>Hz</span>
            </div>
            {/* spring rate strip */}
            <div style={{display:'flex',alignItems:'center',gap:6,
                         padding:'4px 8px',background:'#0a0f1a',borderRadius:2,
                         border:'1px solid #1e293b',marginBottom:8,marginTop:-4}}>
              {/* Same springOut the SPRINGS card uses, so this strip can't drift from it —
                  it previously hardcoded the IMP/MET branch and would have shown N/mm in a
                  mode whose card says N/m. */}
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>SPR F</span>
              <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'#9ca3af'}}>
                {(()=>{const o=springOut(tune.springF,fe.gameMode,mSpring,ch.motionRatioF);
                  return `${o.value.toFixed(o.decimals)} ${o.unit}`;})()}
              </span>
              <div style={{flex:1,height:1,background:'#1e293b'}}/>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>SPR R</span>
              <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'#9ca3af'}}>
                {(()=>{const o=springOut(tune.springR,fe.gameMode,mSpring,ch.motionRatioR);
                  return `${o.value.toFixed(o.decimals)} ${o.unit}`;})()}
              </span>
            </div>
            </div>
          </Sec></div>

          <div id="zone-damping" style={dim('damping')}><Sec title="DAMPERS" open={open.dampers} onToggle={tog('dampers')}
            onReset={()=>setFe(p=>({...p,
              dampingMode:DEF_FE.dampingMode,
              dampingBias:DEF_FE.dampingBias,
              reboundZeta:DEF_FE.reboundZeta,
              bumpRatio:DEF_FE.bumpRatio,
              bumpZeta:DEF_FE.bumpZeta,
              dampCharMode:DEF_FE.dampCharMode,
              dampBalMode:DEF_FE.dampBalMode,
              settleTarget:DEF_FE.settleTarget}))}>
            {/* damping character mode toggle — INT/PRO only */}
            {uiMode!=='beginner'&&<>
              <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:3}}>
                <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>REBOUND MODE</span>
                <Hint text={dampCharMode==='settle'
                  ?"SETTLE TIME: set a target settle time and the app back-solves the rebound ζ that hits it on the ride-reference axle. DAMPING BALANCE MODE below sets how the other axle follows."
                  :"CHARACTER: type rebound ζ directly on the slider below; nothing is back-solved."} term="rebound-mode"/>
              </div>
              {(()=>{
                // Translational parity, the same idea as RIDE's HZ <-> BOTTOM G's: both modes
                // describe the SAME anchor ζ, one as a number and one as the time it produces,
                // so switching carries the current value across instead of snapping back to
                // whatever the other slider was last left at. physics.baseZeta is the anchor
                // actually in force (the typed ζ under CHARACTER, the back-solved one under
                // SETTLE TIME), and refHz must match the Hz the SETTLE TIME back-solve itself
                // uses — pre-CO-SOLVE physics.frontHz/rearHz on the ride-reference axle — or the
                // round trip lands a few hundredths off.
                const refHz=physics.rideRef==='rear'?physics.rearHz
                          :physics.rideRef==='shared'?(physics.frontHz+physics.rearHz)/2
                          :physics.frontHz;
                // Carried time clamps to the slider's own 0.10-1.50s; ζ above 100% reads out as
                // its underdamped twin, since settle time alone can't distinguish the two roots
                // (see rateToZeta) and this app prefers the underdamped one.
                const carriedSettle=Math.max(0.10,Math.min(1.50,settleTimeFromZeta(physics.baseZeta,refHz)));
                const carriedZeta=Math.round(Math.max(10,Math.min(200,physics.baseZeta))*10)/10;
                return <div style={{display:'flex',gap:3,marginBottom:8}}>
                <button className={`tog${dampCharMode==='zeta'?' on':''}`}
                  onClick={()=>setFe(p=>({...p,dampCharMode:'zeta',reboundZeta:carriedZeta}))}>CHARACTER</button>
                <button className={`tog${dampCharMode==='settle'?' on':''}`}
                  onClick={()=>setFe(p=>({...p,dampCharMode:'settle',settleTarget:Math.round(carriedSettle*100)/100}))}>SETTLE TIME</button>
              </div>;
              })()}
            </>}
            {dampCharMode==='settle'
              ? <FeelSlider label="Settle Target" value={fe.settleTarget??0.80}
                  onChange={pFe('settleTarget')} min={0.10} max={1.50} step={0.01}
                  leftLabel="0.10s" rightLabel="1.50s"
                  hint="Target settle time after a bump; the app back-solves the rebound ζ that hits it. Lower = tighter, more controlled. Higher = softer, more comfortable. Damping Bias skews the F/R timing."
                  markers={[
                    {value:0.35,color:'#ef4444',label:'PLANTED'},
                    {value:0.60,color:'#f59e0b',label:'RACE'},
                    {value:0.90,color:'#9ca3af',label:'SPORT'},
                    {value:1.30,color:'#60a5fa',label:'ROAD'},
                  ]}
                  box={{unit:'s'}}
                  readout={`→ F ${Math.round(tune.zetaF??physics.zetaF)}% R ${Math.round(tune.zetaR??physics.zetaR)}%`} hintTerm="settle-time"/>
              : <FeelSlider label={<>{dnaDot('reboundZeta')}Rebound ζ</>} value={fe.reboundZeta??70}
                  onChange={pFe('reboundZeta')} min={10} max={200} step={1}
                  leftLabel="10%" rightLabel="200%"
                  hint="Damping ratio for the rebound (extension) stroke. 55–70% is typical; 70% (default) is Butterworth. Above 70% feels planted but stiff; above 100% (overdamped) sluggish."
                  markers={[
                    {value:40, color:'#60a5fa',label:'UNDER',lessThan:true},
                    {value:70, color:'#f59e0b',label:'BWORTH'},
                    {value:100,color:'#ef4444',label:'OVER'},
                  ]}
                  box={{unit:'%'}}
                  readout={(()=>{
                    const z=fe.reboundZeta??70;
                    if(z>100)return'⚠ OVERDAMPED';
                    // Butterworth is a point (ζ≈70.7%), not a region — label its neighbourhood
                    // only, and call everything above it what it actually is: firm.
                    if(z>72) return'FIRM';
                    if(z>=68) return'BUTTERWORTH';
                    return null;
                  })()} hintTerm="zeta"/> }
            {/* bump ratio / independent toggle */}
            <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:3,marginTop:8}}>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>BUMP MODE</span>
              <Hint text={dampingMode==='independent'
                ?"INDEPENDENT: set bump ζ directly, decoupled from rebound, e.g. soft bump with firm rebound."
                :"BUMP RATIO: set bump damping as a percentage of rebound ζ, so the two strokes stay linked."} term="bump-mode"/>
            </div>
            <div style={{display:'flex',gap:3,marginBottom:10}}>
              <button className={`tog${dampingMode==='ratio'?' on':''}`}
                onClick={()=>setFe(p=>({...p,dampingMode:'ratio',
                  // Mirror of the INDEPENDENT seed below: express the bump anchor currently in
                  // force as a % of the rebound anchor, so INDEPENDENT-RATIO lands on the tune
                  // already on screen. physics.bumpZeta is the anchor BEFORE Damping Balance
                  // Mode splits it, which is exactly what this slider feeds, so no per-axle
                  // reconstruction is needed in this direction.
                  // Clamped to the slider's own 10-100: RATIO cannot express bump above
                  // rebound, so a CROSSED tune does move here. Unavoidable, not a bug.
                  bumpRatio:Math.max(10,Math.min(100,Math.round(
                    physics.baseZeta>0?100*physics.bumpZeta/physics.baseZeta:56)))}))}>BUMP RATIO</button>
              <button className={`tog${dampingMode==='independent'?' on':''}`}
                onClick={()=>setFe(p=>({...p,dampingMode:'independent',
                  // Seed the typed anchor from whichever axle the active Damping Balance Mode
                  // anchors, so RATIO→INDEPENDENT lands on the tune already on screen instead
                  // of jumping. Seeding from the front unconditionally was only right for a
                  // FRONT ride reference. SHARED anchors neither axle, so its midpoint is the
                  // nearest equivalent — approximate by design, it only has to not jump.
                  // Clamped to the slider's own range: a firm rebound ζ can push a resolved
                  // bump ζ past 115, and an out-of-range value leaves the handle pinned at the
                  // end while the tune uses something else.
                  bumpZeta:Math.max(10,Math.min(115,Math.round(
                    physics.rideRef==='rear'?physics.bumpZetaR
                    :physics.rideRef==='shared'?(physics.bumpZetaF+physics.bumpZetaR)/2
                    :physics.bumpZetaF)))}))}>INDEPENDENT</button>
            </div>
            {dampingMode==='ratio'
              ? <FeelSlider label={<>{dnaDot('bumpRatio')}Bump Ratio</>} value={fe.bumpRatio??56}
                  onChange={pFe('bumpRatio')} min={10} max={100} step={1}
                  leftLabel="10%" rightLabel="100%"
                  hint="Bump damping as a percentage of rebound. Lower = softer over sharp hits, more compliant on rough roads; higher = more consistent between strokes. 40–65% is typical."
                  markers={[{value:30,color:'#60a5fa',label:'UNDER',lessThan:true},{value:65,color:'#f59e0b',label:'FIRM'}]}
                  box={{unit:'%'}}
                  readout={(()=>{
                    const ratio=Math.min(100,fe.bumpRatio??56);
                    const effReb=physics.zetaF;
                    const bz=Math.max(10,Math.min(effReb,effReb*ratio/100));
                    const bzR=Math.round(bz);
                    const zLabel=bz>100?`${bzR}% ⚠ OVERDAMPED`:
                                 bz>72 ?`${bzR}% · FIRM`:
                                 bz>=68?`${bzR}% · BUTTERWORTH`:
                                         `${bzR}%`;
                    return`ζ ${zLabel}`;
                  })()} hintTerm="bump-ratio"/>
              : <FeelSlider label="Bump ζ" value={fe.bumpZeta??39}
                  onChange={pFe('bumpZeta')} min={10} max={115} step={1}
                  leftLabel="10%" rightLabel="115%"
                  hint="Bump damping ratio set directly, independent of rebound. Keep it below rebound for normal handling; Damping Balance Mode splits it front/rear like rebound."
                  markers={[
                    {value:40, color:'#60a5fa',label:'UNDER',lessThan:true},
                    {value:70, color:'#f59e0b',label:'BWORTH'},
                    {value:100,color:'#ef4444',label:'OVER'},
                  ]}
                  readout={(()=>{
                    // Report what the axles actually run, not the raw typed number. Every
                    // Damping Balance Mode turns this into a front/rear pair, so the typed
                    // value is one axle's ζ at best (STANDARD, at the ride-reference axle) and
                    // neither axle's under SYNC/EQUAL FORCE, which diverge on Hz and mass even at
                    // bias 0. Mirrors the RATIO readout, which likewise shows resulting ζ.
                    const bF=physics.bumpZetaF,bR=physics.bumpZetaR;
                    const split=Math.abs(bF-bR)>0.5;
                    // CROSSED compares each axle's bump against THAT axle's rebound ζ. The old
                    // check used fe.reboundZeta, which is the wrong yardstick under SETTLE TIME
                    // (the anchor is back-solved, not typed) and under any split at all.
                    const cross=(bF>physics.zetaF+0.5||bR>physics.zetaR+0.5)?' ⚠ CROSSED':'';
                    const tag=z=>z>100?' ⚠ OVERDAMPED':z>72?' · FIRM':z>=68?' · BUTTERWORTH':'';
                    // The box already shows the typed anchor; repeat the axle ζ only when it differs.
                    const txt=split
                      ?`F ${Math.round(bF)}% | ${Math.round(bR)}% R${tag(Math.max(bF,bR))}${cross}`
                      :Math.round(bF)!==Math.round(fe.bumpZeta??39)
                      ?`→ ${Math.round(bF)}%${tag(bF)}${cross}`
                      :`${tag(bF)}${cross}`.replace(/^ · /,'').trim();
                    return txt||null;
                  })()}
                  box={{unit:'%'}} hintTerm="bump"/>}
            <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:3,marginTop:2}}>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>DAMPING BALANCE MODE</span>
              <Hint text="How the anchor ζ becomes a front/rear split. STANDARD: bias by percentage. TIME SYNC: equal settle time. EQUAL FORCE: equal damping force. HYBRID: halfway between those two." term="damping-balance-mode"/>
            </div>
            {/* One row of four — was STANDARD/SYNC plus a SYNC METHOD sub-row. Ids unchanged
                (codec indices are permanent). */}
            <div style={{display:'flex',gap:3,marginBottom:8,flexWrap:'wrap'}}>
              {[['standard','STANDARD'],['sync','TIME SYNC'],['hybrid','HYBRID'],['neutral','EQUAL FORCE']].map(([k,l])=>
                <button key={k} className={`tog${dampBalMode===k?' on':''}`}
                  onClick={()=>setFe(p=>({...p,dampBalMode:k}))}>{l}</button>)}
            </div>
            {(()=>{
              const anchor=dampCharMode==='settle'?'the Settle Target':'Rebound ζ';
              const hint=dampBalMode==='sync'
                ?`TIME SYNC: skews settle time front/rear; centre = equal settle time (anchored to ${anchor}). Left (FRONT) makes the front settle faster, right (REAR) the rear.`
                :dampBalMode==='hybrid'
                ?`HYBRID: centre sits halfway between TIME SYNC and EQUAL FORCE (anchored to ${anchor}). Left (FRONT) firms the front, right (REAR) the rear.`
                :dampBalMode==='neutral'
                ?`EQUAL FORCE: skews actual damping force front/rear; centre = equal force (anchored to ${anchor}). Left (FRONT) shifts force to the front, right (REAR) to the rear.`
                :`Your Ride Reference axle holds the base ζ (anchored to ${anchor}); the other swings up to 50% at ±50 (SHARED: both share it). Firmer front leans understeer, firmer rear oversteer.`;
              // No readout: the table below shows settle and force per axle for every mode.
              return(
                <FeelSlider label={<>{dnaDot('dampBias')}Damping Bias</>} value={-(fe.dampingBias??0)}
                  onChange={v=>pFe('dampingBias')(-v)} min={-50} max={50} step={1}
                  leftLabel="FRONT" rightLabel="REAR"
                  markers={[{value:0,color:'#94a3b8',label:'EQUAL'}]}
                  hint={hint} hintTerm="damping-bias"/>
              );
            })()}
            {(()=>{
              // DAMPERS table: fixed label | FRONT | REAR, every row always two-column so nothing
              // reflows as the tune moves (the old box switched layout on a `biased` test). A
              // mismatched row turns its values amber and points ◄/► at the axle that leads or
              // is faster; the wording lives in the row's title. The row the chosen Damping
              // Balance Mode equalises is highlighted. physics.zeta* already reflect the active
              // REBOUND MODE + mode combination, so the table reads them rather than re-deriving.
              const worst=Math.max(tune.settleF,tune.settleR);
              const[cat,col]=worst<0.35?['PLANTED','#ef4444']:worst<0.60?['RACE','#f59e0b']:
                             worst<0.90?['SPORT','#9ca3af']:worst<1.30?['ROAD','#60a5fa']:['SOFT','#818cf8'];
              const pct=v=>`${Math.round(v)}%`;
              // Relative front-rear difference; n>0 means front is larger.
              const rel=(f,r)=>{const a=(f+r)/2;return a>0?(f-r)/a:0;};
              // MEAS: the DYNAMICS chart's bump-aware settle. SETTLE stays analytic because
              // SETTLE TIME mode back-solves against it (type 0.55s, read 0.55s); see HISTORY.
              // The tune's own zetas: computeTune re-solves the balance on the final (post-CO-SOLVE) rear
              // Hz and re-derives ζ from the snapped game damper values. physics.zeta* is the pre-CO-SOLVE
              // solve, so pairing it with tune.fHz/rHz made the Force row miss 50/50 under EQUAL FORCE.
              const zetaF=tune.zetaF??physics.zetaF,zetaR=tune.zetaR??physics.zetaR;
              const bumpZetaF=tune.bumpZetaF??physics.bumpZetaF,bumpZetaR=tune.bumpZetaR??physics.bumpZetaR;
              const m=measureSettle(tune.fHz,zetaF,bumpZetaF,
                                    tune.rHz,zetaR,bumpZetaR,
                                    tune.settleF,tune.settleR);
              const fmtS=s=>s!=null?`${s.toFixed(2)}s`:`>${m.durSec.toFixed(2)}s`;
              const mF=(ch.weight/KG_TO_LB)*(ch.frontBias/100)/2,mR=(ch.weight/KG_TO_LB)*(1-ch.frontBias/100)/2;
              const fF=zetaF*mF*tune.fHz,fR=zetaR*mR*tune.rHz;
              const fP=fF+fR>0?Math.round(fF/(fF+fR)*100):50;
              // ROLL ζ: the ARB adds roll stiffness with no damping, so per axle
              // ζ_roll = ζ_ride·√(rsSp/(rsSp+rsAb)) (track and corner mass cancel). A front/rear
              // comparison index, not the true body-roll mode — roll centres and chassis
              // coupling are ignored. The less roll-damped axle takes its load first on turn-in.
              const sh=(sp,ab)=>(sp+ab)>0?Math.sqrt(sp/(sp+ab)):1;
              const rlF=zetaF*sh(tune.rsSpF??0,tune.rsAbF??0),rlR=zetaR*sh(tune.rsSpR??0,tune.rsAbR??0);
              const rlD=rel(rlF,rlR);
              const avgF=(zetaF+bumpZetaF)/2,avgR=(zetaR+bumpZetaR)/2;
              const sD=tune.settleF-tune.settleR;
              const rows=[
                {k:'reb',l:'Rebound ζ',f:pct(zetaF),r:pct(zetaR),
                 mis:Math.abs(zetaF-zetaR)>0.5,dir:zetaF>zetaR?'F':'R',
                 t:'Rebound damping ratio per axle. The arrow points at the firmer axle.'},
                {k:'bmp',l:'Bump ζ',f:pct(bumpZetaF),r:pct(bumpZetaR),
                 mis:Math.abs(bumpZetaF-bumpZetaR)>0.5,dir:bumpZetaF>bumpZetaR?'F':'R',
                 t:`Bump damping ratio per axle. AVG ζ (bump/rebound mean): F ≈${Math.round(avgF)}% · R ≈${Math.round(avgR)}%.`},
                {k:'settle',l:'Settle',f:`${tune.settleF.toFixed(2)}s`,r:`${tune.settleR.toFixed(2)}s`,
                 mis:Math.abs(sD)>=0.01,dir:sD<0?'F':'R',col,
                 t:`Settle estimate SETTLE TIME targets. Arrow = faster axle; grade ${cat} is the slower axle's. MEAS: F ${fmtS(m.fSettle)} · R ${fmtS(m.rSettle)}.`},
                {k:'force',l:'Force',f:`${fP}%`,r:`${100-fP}%`,
                 mis:Math.abs(fP-50)>=1,dir:fP>50?'F':'R',
                 t:'Share of actual damping force (ζ × corner mass × Hz). Arrow = axle doing more work. EQUAL FORCE targets 50/50.'},
                {k:'roll',l:'Roll ζ',f:pct(rlF),r:pct(rlR),
                 mis:Math.abs(rlD)>=0.03,dir:rlD<0?'F':'R',
                 t:`Rebound ζ in roll; the ARB adds no damping. Arrow = less roll-damped axle, loads first on turn-in${Math.abs(rlD)>=0.03?` (${rlD<0?'F':'R'} LEADS ${Math.round(Math.abs(rlD)*100)}%)`:' (MATCHED)'}.`},
              ];
              const target={standard:['reb'],sync:['settle'],hybrid:['settle','force'],neutral:['force']}[dampBalMode]??[];
              const hd={fontSize:9,color:'#64748b',letterSpacing:1,textAlign:'right'};
              return(
                <div style={{padding:'4px 8px',background:'#0a0f1a',borderRadius:2,border:'1px solid #1e293b',
                             marginBottom:4,marginTop:-6,display:'grid',gridTemplateColumns:'1fr 64px 64px',
                             columnGap:4,rowGap:1,alignItems:'center'}}>
                  <span/><span style={hd}>FRONT</span><span style={hd}>REAR</span>
                  {rows.map(r=>{
                    const on=target.includes(r.k);
                    const vc=r.mis?'#f59e0b':'#9ca3af';
                    const cell=(v,side)=><span title={r.t} style={{fontFamily:'var(--font-mono)',fontSize:11,color:vc,textAlign:'right',
                      background:on?'#1e293b':'transparent',padding:'0 2px'}}>
                      {r.mis&&r.dir===side&&side==='F'?'◄ ':''}{v}{r.mis&&r.dir===side&&side==='R'?' ►':''}</span>;
                    return(
                      <div key={r.k} style={{display:'contents'}}>
                        <span title={r.t} style={{fontSize:10,letterSpacing:1,color:on?'#e2e8f0':'#94a3b8',
                          background:on?'#1e293b':'transparent',padding:'0 2px',borderLeft:on?'2px solid #38bdf8':'2px solid transparent'}}>
                          {r.l}{r.col&&<span style={{color:r.col,fontSize:8,marginLeft:4}}>{cat}</span>}</span>
                        {cell(r.f,'F')}{cell(r.r,'R')}
                      </div>);
                  })}
                </div>
              );
            })()}
          </Sec></div>

          {uiMode==='pro'&&<div id="zone-alignment" style={dim('alignment')}><Sec title="ALIGNMENT" open={open.alignment} onToggle={tog('alignment')}
            onReset={()=>setAl({...DEF_AL})}>
            <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:6}}>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:2}}>ALIGNMENT MODE</span>
              <Hint text="AUTO: camber, toe and caster recommended from build type, layout, weight bias, ride Hz and roll, optionally nudged (below). MANUAL: type exact values." term="align-mode"/>
            </div>
            <div style={{display:'flex',gap:3,marginBottom:10,flexWrap:'wrap'}}>
              <button className={`tog${alignMode!=='manual'?' on':''}`}
                onClick={()=>setAl(p=>({...p,mode:'build'}))}>AUTO</button>
              <button className={`tog${alignMode==='manual'?' on':''}`}
                onClick={()=>setAl(p=>({...p,mode:'manual'}))}>MANUAL</button>
            </div>
            {alignMode!=='manual'&&<div style={{marginBottom:10}}>
              <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:4}}>
                <span style={{fontSize:12,color:'#94a3b8'}}>Nudge</span>
                <Hint text="OFF: AUTO values unchanged. MECH: nudges camber and toe toward your Mech Balance Target's understeer/oversteer intent. GRIP: counters the chassis's own grip tendency. Caster is never nudged." term="nudge"/>
              </div>
              <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>
                {['build','mech','grip'].map(m=>(
                  <button key={m} className={`tog${alignMode===m?' on':''}`}
                    // MECH reads the Balance Target, so it is a no-op (dimmed) while nothing solves toward it.
                    style={m==='mech'&&!hasBalTargetSolve(feEffective)?{opacity:0.45}:undefined}
                    onClick={()=>setAl(p=>({...p,mode:m}))}>{m==='build'?'OFF':m.toUpperCase()}</button>
                ))}
              </div>
              {(alignMode==='mech'||alignMode==='grip')&&
                <div style={{marginTop:8}}>
                <FeelSlider label="Nudge Strength" value={al.nudgeStrength??50}
                  onChange={pAl('nudgeStrength')} min={0} max={100} step={1}
                  leftLabel="SUBTLE" rightLabel="STRONG"
                  box={{unit:'%'}}
                  hint="How far MECH or GRIP moves camber and toe from the AUTO values: 0% = pure AUTO, 100% = full nudge. Caster is never adjusted." hintTerm="nudge"/>
                </div>}
            </div>}
            {alignMode==='manual'&&<>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 10px'}}>
                <Field noSlider label="Camber F" value={al.camberF} onChange={pAl('camberF')} min={-4.0} max={0.0} step={0.1} unit="°"
                  hint="Front static camber. Negative = top of the tyre leans inward." hintTerm="camber"/>
                <Field noSlider label="Camber R" value={al.camberR} onChange={pAl('camberR')} min={-3.5} max={0.0} step={0.1} unit="°"
                  hint="Rear static camber. Negative = top of the tyre leans inward." hintTerm="camber"/>
                <Field noSlider label="Toe F" value={al.toeF} onChange={pAl('toeF')} min={-0.20} max={0.15} step={0.1} unit="°"
                  hint="Front toe. Negative = toe-out, positive = toe-in." hintTerm="toe"/>
                <Field noSlider label="Toe R" value={al.toeR} onChange={pAl('toeR')} min={0.0} max={0.25} step={0.1} unit="°"
                  hint="Rear toe. Positive = toe-in." hintTerm="toe"/>
              </div>
              <Field noSlider label="Caster" value={al.caster} onChange={pAl('caster')} min={4.0} max={7.5} step={0.1} unit="°"
                hint="Caster angle. More = stronger self-centring and heavier steering." hintTerm="caster"/>
            </>}
          </Sec></div>}

          </>}
        </div>
        {/* PINNED — stays put while the scrollable content above it scrolls, so the graphs
            here stay visible regardless of which input section is currently open. BEG mode has
            its own simplified panel with no ARB/RIDE/DAMPERS sections for these readouts to relate
            to, so VISUALS stays hidden there. */}
        {uiMode!=='beginner'&&!(isPhone&&sbTyping)&&<div id="zone-visuals" style={{flexShrink:0,borderTop:'1px solid #0f172a',...dim('visuals')}}>
          <Sec title="VISUALS" open={open.visuals} onToggle={tog('visuals')}>
            <div style={{maxHeight:open.visRide&&visCap?visCap:(isPhone?'32vh':'50vh'),overflowY:'auto',overscrollBehavior:'contain'}}>
              {dnaLink&&<>
              <div className="collapsible-hdr" onClick={()=>setOpen(p=>({...p,visDna:!p.visDna}))}
                style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',marginBottom:3,userSelect:'none',padding:'3px 4px'}}>
                <span style={{fontSize:9,letterSpacing:2,color:'#334155'}}>DNA MATCH</span>
                <span style={{fontSize:9,color:'#818cf8'}}>{dnaLink.name}</span>
                <span style={{marginLeft:'auto',fontSize:9,color:'#475569'}}>{open.visDna?'▲':'▼'}</span>
              </div>
              {open.visDna&&<div style={{padding:'0 4px',marginBottom:14,fontSize:10}}>
                <div style={{display:'grid',gridTemplateColumns:'1fr 64px 64px 14px',gap:'2px 6px',color:'#475569',fontSize:9,letterSpacing:1,marginBottom:2}}>
                  <span>AXIS</span><span style={{textAlign:'right'}}>TARGET</span><span style={{textAlign:'right'}}>NOW</span><span/>
                </div>
                {dnaLink.rows.map(r=>{
                  const ui=DNA_AXIS_UI.find(a=>a.k===r.k);
                  return(
                    <div key={r.k} style={{display:'grid',gridTemplateColumns:'1fr 64px 64px 14px',gap:'2px 6px',lineHeight:1.7}}>
                      <span style={{color:'#94a3b8'}}>{ui.label}</span>
                      <span style={{textAlign:'right',color:'#64748b',fontFamily:'var(--font-mono)'}}>{dnaFmt(r.k,r.target)}</span>
                      <span style={{textAlign:'right',color:r.drift?'#f59e0b':'#cbd5e1',fontFamily:'var(--font-mono)'}}>
                        {r.cur==null?'MODE':dnaFmt(r.k,r.cur)}</span>
                      <span style={{color:r.drift?'#f59e0b':'#22c55e',textAlign:'center'}}>{r.drift?'≠':'✓'}</span>
                    </div>
                  );
                })}
                <div style={{fontSize:9,color:'#475569',marginTop:4,lineHeight:1.5}}>
                  ≠ = changed since APPLY. MODE = that control is no longer in the mode DNA set. <TermLink id="dna-match"/>
                </div>
              </div>}
              </>}
              {(()=>{
                // RIDE · ROLL · DAMPING — replaced the ARB (ArbDial + roll seesaw) and RIDE /
