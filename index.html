  const dnaUnlink=()=>{if(dnaStore.applied)setDnaStore({...dnaStore,applied:null});};
  const dnaApply=()=>{
    const r=applyDNA(ch,fe,dr,dnaDraft);
    commit(`apply DNA ${dnaName}`,()=>{
      setFe(r.fe);setDr(r.dr);
      setDnaStore({...dnaStore,applied:{name:dnaName,axes:r.dna.axes,achieved:r.measured}});
    });
  };
  // TUNE CHECK's IMPORT AS DNA button. Runs the decoded fe through the same funnel every other
  // read takes, then reads the result back as axis targets. Not a commit: the undo snapshot
  // carries the APPLIED link, never the editor's draft, and nothing on the car changes here. The
  // draft loses its `ref`, so the editor shows a fresh DNA, not "edited from" whatever was loaded.
  const dnaFromDecoded=mkFe=>{
    const nfe=mkFe(fe);
    const t=solveTune(ch,resolveFeEffective(ch,nfe),nfe.gameMode??DEF_FE.gameMode).tune;
    setDnaStore({...dnaStore,draft:{...dnaDraft,name:'DECODED TUNE',
      axes:dnaReadBack(ch,nfe,dr,t,dnaDraft.axes)}});
    setShowChecker(false);
    setShowDnaModal(true);
  };
  // A mark on a sidebar control a DNA set: indigo while it still reads as applied, amber once it
  // has drifted (edited, or the chassis changed under it).
  const dnaDot=k=>{
    const r=dnaLink?.by[k];if(!r)return null;
    return <span title={'DNA '+dnaLink.name+': target '+dnaFmt(k,r.target)+(r.drift?', drifted':'')}
      style={{color:r.drift?'#f59e0b':'#818cf8',marginRight:4,fontSize:9}}>●</span>;
  };
  // BOTTOM G's stiffness mode: fe.rideBottomG is a stored TARGET load factor (not a Hz), so it
  // must keep resolving to a fresh Hz whenever the chassis it applies to changes — ride height
  // edits, or a build/share-code load landing a new target on the current chassis. Switching
  // RIDE REF. is the one exception: it must NEVER itself change the actual front/rear Hz (see
  // the RIDE REF. hint text), so on an axle switch this mirrors the target to the new axle's
  // already-current g instead of resolving Hz from the old axle's target.
  //
  // This used to be two separate effects (a "resolve" one and a "mirror" one). Splitting them
  // caused a real bug: a single fe update that changes rideStiffness AND rideBottomG together
  // (e.g. LOAD BUILD) makes BOTH effects' dependencies fire in the SAME commit, both reading the
  // SAME pre-resolve tune snapshot — the mirror effect would stomp the freshly-loaded target with
  // a value derived from the not-yet-resolved Hz, fighting the resolve effect into converging on
  // the wrong number (or oscillating). One effect making one atomic decision per fire — using a
  // ref to remember only whether RIDE REF. itself just changed, since that's the sole case that
  // should mirror instead of resolve — avoids the race entirely.
  const bottomGPrevRef=useRef({rh:null,rRef:null});
  useEffect(()=>{
    if((fe.rideStiffMode??'hz')!=='bottomG'){bottomGPrevRef.current={rh:null,rRef:null};return;}
    const rRef=physics.rideRef??'front';
    const rhPrimary_mm=rRef==='rear'?ch.rideHeightR*1000:rRef==='shared'?(ch.rideHeightF+ch.rideHeightR)/2*1000:ch.rideHeightF*1000;
    if(!(rhPrimary_mm>0))return;
    const prev=bottomGPrevRef.current;
    const refSwitched=prev.rRef!==null&&prev.rRef!==rRef;
    bottomGPrevRef.current={rh:rhPrimary_mm,rRef};
    // A restore can flip RIDE REF., but the snapshot already holds the rideBottomG that goes with it.
    if(restoringRef.current)return;
    const hzNow=rRef==='rear'?tune.rHz:rRef==='shared'?(tune.fHz+tune.rHz)/2:tune.fHz;
    if(refSwitched){
      const curG=Math.round(rhPrimary_mm*Math.pow(2*Math.PI*hzNow,2)/9810*100)/100;
      if(fe.rideBottomG==null||Math.abs(curG-fe.rideBottomG)>0.001)setFeRaw(p=>({...p,rideBottomG:curG}));
      return;

        <div

          {uiMode==='beginner'&&(()=>{
            const stAgVal=Math.max(-50,Math.min(50,Math.round((70-(fe.reboundZeta??70))*2)));

            const rideRefBeg=physics.rideRef??'front';

            // Beginner can't reach MECH/CO-SOLVE/MAN (PRO-only) — only whatever INT uses.

              <div style={{padding:'14px 12px 20px'}}>
                <div id="zone-layout-build" style={dim('layout-build')}>

                <Toggle label="Layout" value={ch.layout} onChange={pCh('layout')}

                </div>
                <div id="zone-build-type" style={dim('build-type')}>

                  hint={HINT_BUILD_TYPE}/>
                </div>
                <div id="zone-weight" style={dim('weight')}>
                <Field label="Weight"
                  value={mMass?ch.weight/KG_TO_LB:ch.weight}

                  unit={mMass?'kg':'lb'} logScale={true} logMid={mMass?2722:6000}

                <Field label="Front Weight Bias" value={ch.frontBias} onChange={pCh('frontBias')}

                {(()=>{

                <div id="zone-balance" style={dim('balance')}>
                <FeelSlider label="Balance" value={balVal}
                  onChange={v=>{const c=Math.max(-50,Math.min(50,v));setFe(p=>{
                    // Centre is WEIGHT's own neutral: bars split by weight distribution, springs
                    // at whatever MULTIPLIER ratio is set. Moving off centre nudges both toward
                    // the handling asked for — ARB Bias under WEIGHT (±20 points of bar split at
                    // the ends) and rearHzMult (±4%). It used to switch to NEUTRAL, whose centre
                    // solves the bars to cancel the springs and can push them to 0/100.
                    // Nudge rearHzMult incrementally from wherever it already sits (e.g. a
                    // loaded preset's tuned ratio) rather than overwriting it outright, so
                    // touching this slider doesn't erase a preset's Hz character.
                    const prevC=p.arbBias??0;
                    const baseMult=p.rearHzMode==='multiplier'?(p.rearHzMult??1.20):1.20;
                    const nudged=Math.max(0.50,Math.min(3.00,baseMult*(1+(c-prevC)*0.0008)));
                    return{...p,
                      arbBalMode:'weight',
                      rearHzMode:'multiplier',

            onReset={()=>setCh({...DEF_CH})}>

            <Field label="Weight"
              value={mMass?ch.weight/KG_TO_LB:ch.weight}
              onChange={mMass?v=>pCh('weight')(v*KG_TO_LB):pCh('weight')}
              min={mMass?45:100} max={mMass?8165:18000} step={1}
              unit={mMass?'kg':'lb'} logScale={true} logMid={mMass?2722:6000}
              hint={mMass
                ?"Total vehicle weight in kg. Find this on the car's stat page. Affects spring rates, damper forces, and ARB stiffness directly."
                :"Total vehicle weight in pounds. Find this on the car's stat page. Affects spring rates, damper forces, and ARB stiffness directly."}/>
            <Field label="Front Weight Bias" value={ch.frontBias} onChange={pCh('frontBias')} min={30} max={70} step={1} unit="%"
              hint="Percentage of total weight on the front axle. Shown on the car selection screen. 50% = perfect balance. Most front-engined cars are 52–58% front."/>
            {(()=>{
              if(uiMode!=='pro')return null;

                const val=ch[key]??DEF_CH[key];
                const isBlank=val.trim()==='';
                const parsed=parseTyre(val);
                return(
                  <div style={{flex:1}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}}>
                      <div style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>{label}</div>
                      {onCopyFront&&
                        <button type="button" onClick={onCopyFront}
                          style={{fontSize:9,letterSpacing:0.5,color:'#64748b',background:'transparent',

                    </div>
                    <input type="text" value={val}
                      onChange={e=>pCh(key)(e.target.value)}
                      placeholder="265/30R19"
                      style={{width:'100%',boxSizing:'border-box',background:'#020617',
                              border:`1px solid ${isBlank||parsed?'#1e293b':'#7f1d1d'}`,borderRadius:2,
                              color:'#e2e8f0',fontFamily:'var(--font-mono)',fontSize:12,

            {uiMode==='pro'&&<>

            {!ch.useMeasuredNatBal&&
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 10px'}}>
              <Field label="Track Width F" value={Math.round(ch.trackF*1000)} onChange={v=>pCh('trackF')(v/1000)} min={1000} max={2600} step={5} unit="mm"
                hint="Distance between left and right wheels at the front. Typical: 1400–1800 mm. Wider = more roll resistance."/>
              <Field label="Track Width R" value={Math.round(ch.trackR*1000)} onChange={v=>pCh('trackR')(v/1000)} min={1000} max={2600} step={5} unit="mm"
                hint="Distance between left and right wheels at the rear. Typical: 1400–1800 mm. Often slightly wider than front."/>

            {/* Physical-unit modes only. Forza's tuning screen shows wheel rate, which is what

                  hint={`How far the ${side.toLowerCase()} spring and damper move per unit of wheel travel. 1.0 = direct-acting (strut on the hub). Lower means the spring sits inboard on a control arm and must be stiffer to give the same wheel rate — the output is divided by the ratio squared, so 0.7 raises it by about double. BeamNG's sliders act at the spring, so this is what makes the numbers match; it does not change Hz, roll stiffness, or handling balance. Leave at 1.0 unless you know the car's geometry.`}/>
              ))}
            </div>}
            {/* ARB drop link, not the spring mount — separate geometry, separate field. Only the

            {physMode&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 10px'}}>
              {[['F','arbMotionRatioF','Front'],['R','arbMotionRatioR','Rear']].map(([ax,key,side])=>(
                <Field key={ax} label={`ARB Motion Ratio ${ax}`} value={ch[key]??1.0}
                  onChange={pCh(key)} min={0.2} max={1.5} step={0.01}
                  hint={`Length of the ${side.toLowerCase()} anti-roll bar's arm as a fraction of track — where the drop link attaches, not where the spring does. 1.0 assumes the bar acts at the wheels, which makes the N/m read low; a typical inboard link is around 0.4–0.5, which raises the printed rate by (1/ratio)². Display and entry only: the roll stiffness this app solves, the balance bar and Hz are unchanged.`}/>
              ))}
            </div>}
            </>}
            <div style={{display:'flex',alignItems:'center',gap:6,marginTop:4,marginBottom:8,flexWrap:'wrap'}}>

              <Hint text="RIDE HEIGHT estimates CG height from the front/rear ride height Forza shows on the car's stat screen, plus tyre radius — a rough heuristic (real CG height also depends on engine position, body height, and mass distribution, none of which are available inputs), but a better starting point than a guess. MANUAL lets you enter CG height directly if you have a better source."/>

                  onClick={()=>setCh(p=>({...p,useRideHeightCG:false}))}>MANUAL</button>
              </div>
            </div>
            {ch.useRideHeightCG?(()=>{
              const pF=parseTyre(ch.tyreF),pR=parseTyre(ch.tyreR);
              const tyresOk=pF?.radius!=null&&pR?.radius!=null;
              const inMm=mLen?10:IN_TO_MM; // display unit → mm: cm ×10, in ×25.4

              return(<>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 10px'}}>
                  <Field label="Ride Height F" value={Math.round((ch.rideHeightF*1000/inMm)*10)/10}

                    min={mLen?1.3:0.5} max={mLen?122:48} step={mLen?0.5:0.1} unit={unitLbl}
                    hint={`Front ride height as shown on the car's stat/tuning screen in Forza (${unitLbl}). Used with tyre radius to estimate CG height, and to gauge bottoming risk from natural sag.`}/>
                  <Field label="Ride Height R" value={Math.round((ch.rideHeightR*1000/inMm)*10)/10}
                    onChange={v=>pCh('rideHeightR')((v*inMm)/1000)}
                    min={mLen?1.3:0.5} max={mLen?122:48} step={mLen?0.5:0.1} unit={unitLbl}
                    hint={`Rear ride height as shown on the car's stat/tuning screen in Forza (${unitLbl}).`}/>
                </div>
                <div style={{background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:2,padding:'6px 8px',marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
                  <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>CG HEIGHT (EST.)</span>
                  <span style={{marginLeft:'auto',fontFamily:'var(--font-mono)',fontSize:13,color:'#60a5fa'}}>{Math.round(ch.cgHeight*1000)} mm</span>
                </div>
                {!tyresOk&&<div style={{fontSize:9,color:'#f59e0b',padding:'2px 0 8px'}}>{uiMode==='pro'?'Enter valid tyre sizes above to compute CG height from ride height.':'Invalid tyre size on this chassis — switch to PRO to fix it, or use MANUAL CG entry.'}</div>}
                <div style={{fontSize:9,color:'#475569',padding:'0 0 4px'}}>SAG vs LOAD is in the pinned VISUALS card below ↓</div>

              <Field label="CG Height" value={Math.round(ch.cgHeight*1000)} onChange={v=>pCh('cgHeight')(v/1000)} min={200} max={1500} step={5} unit="mm"
                hint="Estimated height of the centre of gravity above ground. The game doesn't expose this — use 400–460 mm for sports cars, 480–550 mm for sedans, 580–700 mm for SUVs, 800–1100 mm for lifted off-roaders. Affects roll moment and ARB stiffness."/>
            }

          <div id="zone-drivetrain" style={dim('drivetrain')}><Sec title="DRIVETRAIN" open={open.drivetrain} onToggle={tog('drivetrain')}

            {uiMode!=='beginner'&&<div style={{display:'flex',alignItems:'center',gap:4,marginTop:8,marginBottom:6,flexWrap:'wrap'}}>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:2,marginRight:2}}>DIFF TYPE</span>
              <Hint text="Differential type installed on the car. Sport is accel-only (no decel control). Race is aggressive — the same lock % produces stronger effective locking than Rally or Offroad. Drift is even more aggressive than Race, for maximum rotation. Rally and Offroad use gentler lock curves suited to low-traction surfaces. The AUTO solver scales its output to match your chosen type."/>
              <div style={{display:'flex',gap:3,marginLeft:'auto'}}>
                {['race','sport','rally','offroad','drift'].map(t=>(
                  <button key={t} className={`tog${(dr.diffType??'race')===t?' on':''}`}

            {uiMode==='pro'&&<div style={{display:'flex',alignItems:'center',gap:6,marginTop:4,marginBottom:10,flexWrap:'wrap'}}>

            {!dr.diffManual&&(()=>{

                    rightLabel="NEUTRAL"
                    markers={[{value:0,color:'#475569'}]}

                <div style={groupHdr}>{ch.layout==='FWD'?'FRONT AXLE':'REAR AXLE'}</div>
                {uiMode==='pro'&&<div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                  <button className={`tog${dr.diffComplement?' on':''}`}

                    title="Bias the auto-solver to match chassis mech target.">
                    MATCH CHASSIS
                  </button>
                  <Hint text="When on, the diff auto-solver factors how far your mech balance target lies from the chassis's natural balance. A target tuned for more oversteer biases the diff toward rotation; a target tuned for understeer leans the diff toward stability. Off (default) means the diff ignores chassis target entirely. Has no effect in MANUAL mode. Affects the EXIT/ENTRY sliders in this group."/>
                </div>}
                <FeelSlider
                  label={<>{dnaDot('diffExit')}EXIT</>}
                  // NOTE: this FWD-only sign flip is the fix for FWD's inverted lock polarity —
                  // do NOT also flip the sign inside computeDiff's FWD accel formula (the
                  // `+effBiasExit*0.15` term, ~index.html:840). That formula is intentionally
                  // uniform across layouts precisely because this UI layer already carries the
                  // per-layout inversion; flipping both would double-cancel and silently
                  // reintroduce the original bug. See docs/HISTORY.md's MATCH CHASSIS entry.
                  value={ch.layout==='FWD'?-(dr.diffBiasExit??0):(dr.diffBiasExit??0)}
                  onChange={v=>pDr('diffBiasExit')(ch.layout==='FWD'?-v:v)}
                  min={-50} max={50}
                  leftLabel="GRIP"
                  rightLabel="ROTATE"
                  markers={[{value:0,color:'#475569'}]}
                  hint={(ch.layout==='FWD'
                    ?'Front diff accel lock. Toward GRIP increases lock — more corner-exit traction, but more push. Toward ROTATE reduces lock for a freer pivot and less understeer.'
                    :ch.layout==='RWD'
                    ?'Rear diff accel lock. Toward ROTATE increases lock — more power oversteer on exit. Toward GRIP reduces lock for cleaner exit traction.'
                    :'Rear diff exit character. Toward ROTATE increases rear accel lock — more oversteer on exit. Toward GRIP reduces rear accel lock for traction.')
                    +(dr.diffComplement?' MATCH CHASSIS is on — this is further biased by your chassis mech target.':'')}
                  readout={diff.layout==='AWD'
                    ?`R.Accel ${diff.rearAccel}%`
                    :`Accel ${diff.accel}%`}/>
                {dt!=='sport'&&<FeelSlider
                  label={<>{dnaDot('diffEntry')}ENTRY</>}
                  value={-(dr.diffBiasEntry??0)}
                  onChange={v=>pDr('diffBiasEntry')(-v)}
                  min={-50} max={50}
                  leftLabel="STABLE"
                  rightLabel="LOOSE"
                  markers={[{value:0,color:'#475569'}]}
                  hint={(ch.layout==='FWD'
                    ?'Front diff decel lock. Toward STABLE increases lock — more resistance to rotation on entry (understeer). Toward LOOSE reduces lock for freer corner entry.'
                    :ch.layout==='RWD'
                    ?'Rear diff decel lock. Toward STABLE increases lock — resists lift-off oversteer. Toward LOOSE reduces lock for freer rotation on entry.'
                    :'Rear diff decel lock. Toward STABLE increases lock — resists lift-off oversteer. Toward LOOSE reduces lock for more rear rotation on entry.')
                    +(dr.diffComplement?' MATCH CHASSIS is on — this is further biased (at half strength) by your chassis mech target.':'')}
                  readout={diff.layout==='AWD'
                    ?`R.Decel ${diff.rearDecel}%`
                    :`Decel ${diff.decel}%`}/>}
                {ch.layout==='AWD'&&uiMode!=='beginner'&&dt!=='sport'&&<>
                  <div style={groupHdr}>CENTER</div>
                  <FeelSlider
                    label="POWER SPLIT"
                    value={(dr.diffCenter??65)-50}
                    onChange={v=>pDr('diffCenter')(Math.round(v+50))}
                    min={-30} max={30}
                    leftLabel="FRONT"
                    rightLabel="REAR"
                    markers={[{value:0,color:'#475569'}]}

                    box={{value:dr.diffCenter??65,min:20,max:80,dp:0,unit:'% rear',

            {uiMode==='pro'&&dr.diffManual&&(()=>{

              const pairCols=dt!=='sport'?'1fr 1fr':'1fr';

                      <Field label="Front Accel" value={dr.diffFrontAccel} onChange={pDr('diffFrontAccel')}

                        hint={`Front axle lock under power. Higher = more front pull out of corners but risks understeer. Typical for ${dt}: ${ranges.frontAccel[0]}–${ranges.frontAccel[1]}%.`}/>
                      <RangeHint r={ranges.frontAccel}/>
                    </div>
                    {dt!=='sport'&&
                    <div>
                      <Field label="Front Decel" value={dr.diffFrontDecel} onChange={pDr('diffFrontDecel')}

                  <div style={{display:'grid',gridTemplateColumns:pairCols,gap:'0 10px'}}>
                    <div>
                      <Field label="Rear Accel" value={dr.diffRearAccel} onChange={pDr('diffRearAccel')}

                      <RangeHint r={ranges.rearAccel}/>
                    </div>
                    {dt!=='sport'&&
                    <div>
                      <Field label="Rear Decel" value={dr.diffRearDecel} onChange={pDr('diffRearDecel')}

                      <RangeHint r={ranges.decel}/>

                  </div>
                  <Field label="Center Split" value={dr.diffCenter} onChange={pDr('diffCenter')}

                <div style={{display:'grid',gridTemplateColumns:pairCols,gap:'0 10px'}}>
                  <div>
                    <Field label="Accel Lock" value={dr.diffAccel} onChange={pDr('diffAccel')}
                      min={0} max={100} step={1} unit="%"
                      hint={ch.layout==='RWD'
                        ?`RWD rear accel lock. Higher = more exit oversteer. Typical for ${dt}: ${ranges.accel[0]}–${ranges.accel[1]}%.`
                        :`FWD front accel lock. Higher = more understeer on exit. Typical for ${dt}: ${ranges.accel[0]}–${ranges.accel[1]}%.`}/>
                    <RangeHint r={ranges.accel}/>
                  </div>
                  {dt!=='sport'&&
                  <div>
                    <Field label="Decel Lock" value={dr.diffDecel} onChange={pDr('diffDecel')}
                      min={0} max={100} step={1} unit="%"
                      hint={ch.layout==='RWD'
                        ?`RWD rear decel lock. Lower = better corner entry rotation, less lift-off oversteer. Typical for ${dt}: ${ranges.decel[0]}–${ranges.decel[1]}%.`
                        :`FWD front decel lock. Lower = less understeer on entry. Typical for ${dt}: ${ranges.decel[0]}–${ranges.decel[1]}%.`}/>
                    <RangeHint r={ranges.decel}/>
                  </div>}
                </div>
              );
            })()}
          </Sec></div>

          <div id="zone-build" style={dim('build')}><Sec title="BUILD" open={open.build} onToggle={tog('build')}>
            <Toggle label="Build Type" value={dr.buildType??'track'} onChange={pDr('buildType')}
              options={[{value:'street',label:'STREET'},{value:'track',label:'TRACK'},{value:'drift',label:'DRIFT'},{value:'rally',label:'RALLY'},{value:'offroad',label:'OFFROAD'},{value:'drag',label:'DRAG'}]}
              hint={HINT_BUILD_TYPE}/>
          </Sec></div>

          {uiMode==='pro'&&<div id="zone-balance-target" style={dim('balance-target')}><Sec title="BALANCE" open={open.balance} onToggle={tog('balance')}
            onReset={()=>setFe(p=>({...p,arbBalTarget:DEF_FE.arbBalTarget,arbBalTargetMode:DEF_FE.arbBalTargetMode,arbBalDelta:DEF_FE.arbBalDelta}))}>
            {(()=>{
              const _hasMechTarget=hasBalTargetSolve(fe);
              if(!_hasMechTarget)return(
                <div style={{fontSize:11,color:'#64748b',lineHeight:1.5,background:'#0a0f1a',
                             border:'1px solid #1e293b',borderRadius:2,padding:'8px 10px',marginBottom:2}}>
                  Balance Target only applies in MECH or CO-SOLVE ARB mode, or MAN ARB with MECH Hz mode (set below in ANTI-ROLL BARS / RIDE) — those are the combinations that solve toward a target. Otherwise nothing targets a balance, so the BALANCE GUIDE below shows your car's current achieved balance instead.
                </div>
              );
              return(<>
                <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6,marginTop:2}}>
                  <span style={{fontSize:13,color:'#94a3b8'}}>Balance Target</span>
                  <Hint text="Sets how the mech balance target is determined. TARGET: set the value manually — use the Balance Guide range as a reference. GRIP: auto-derives the target as the mirror of the car's natural grip bias (1 − natGripBalance), so the suspension directly counteracts the chassis's understeer or oversteer tendency. Use the Balance Offset slider to shift intentionally away from neutral."/>
                  <div style={{display:'flex',gap:3,marginLeft:'auto'}}>
                    <button className={`tog${(fe.arbBalTargetMode??'manual')==='manual'?' on':''}`}
                      onClick={()=>setFe(p=>({...p,arbBalTargetMode:'manual'}))}>TARGET</button>
                    <button className={`tog${(fe.arbBalTargetMode??'manual')==='grip'?' on':''}`}
                      onClick={()=>setFe(p=>({...p,arbBalTargetMode:'grip'}))}>GRIP</button>
                  </div>
                </div>
                {(fe.arbBalTargetMode??'manual')==='manual'
                  ?<Field label="Mech Balance Target" value={fe.arbBalTarget??Math.round((MECH_BALANCE_TARGET-natMechBalance)*100)/100}
                      onChange={v=>pFe('arbBalTarget')(Math.round(v*100)/100)}
                      min={Math.round((0.20-natMechBalance)*100)/100} max={Math.round((0.90-natMechBalance)*100)/100} step={0.01} unit="from NAT"
                      hint="Deviation from the chassis natural roll balance. 0 = target the natural balance exactly — no ARB correction needed. Positive = rear-biased from natural (oversteer tendency), negative = front-biased (understeer tendency). The BALANCE GUIDE below shows the recommended range for your drivetrain and build type as deltas from NAT — use those as your reference."/>
                  :<Field label={<>{dnaDot('balanceOffset')}Balance Offset</>} value={fe.arbBalDelta??0} onChange={pFe('arbBalDelta')}
                      min={-0.20} max={0.20} step={0.01}
                      hint="Offset from the grip-neutralising target. 0 = mech balance exactly opposes the car's natural grip tendency for neutral at-limit handling. Positive = more rear bias (oversteer tendency). Negative = more front bias (understeer tendency). The derived target is shown in the balance guide below."/>
                }
              </>);
            })()}
            {(()=>{
              if(uiMode!=='pro')return null;
              const _layout=ch.layout??'RWD';
              const _build=dr.buildType??'track';
              // RANGE is a fraction of the NATURAL→GRIP TARGET gap, not a flat delta, so the
              // band scales with how biased this particular chassis actually is. Fractions >1
              // (DRIFT) overshoot past grip-neutral on purpose. See docs/PHYSICS.md's "Balance
              // Guide RANGE". The fraction table is BALANCE_BAND_FRACS, shared with GRIP GAP below.
              const[_fracLo,_fracHi]=balanceBandFracs(_layout,_build);
              const _gap=(1-natGripBalance)-natMechBalance;
              // balanceBandDelta, not a bare _frac*_gap: it keeps the >1 fractions' overshoot
              // pointed at oversteer when _gap is negative. A negative _gap is ordinary — any
              // chassis under ~50% front bias — see the helper's own comment for the full why.
              // balanceBandRange, not a fixed lo/hi assignment or min/max of the two endpoints:
              // a negative _gap flips which fraction produces the smaller delta (see
              // docs/PHYSICS.md for what the fixed assignment did), and since the sign fix the
              // delta is V-shaped in _frac there, bottoming out at _frac=1 — so for a pair that
              // straddles 1 the low extreme is grip-neutral itself, which neither endpoint
              // reaches. The helper includes it.
              const[_dlo,_dhi]=balanceBandRange(_fracLo,_fracHi,_gap);
              // Signed: _dlo/_dhi go negative whenever _gap does, and a hardcoded '+' in the
              // caption below rendered "Δ+-0.17 → +-0.10" on every rear-biased chassis.
              const _dfmt=v=>(v>=0?'+':'')+v.toFixed(2);
              const _lo=Math.max(0.20,Math.min(0.87,natMechBalance+_dlo));
              const _hi=Math.max(_lo+0.03,Math.min(0.90,natMechBalance+_dhi));
              // Strip spans 0.10–0.90 so 0.50 (even roll stiffness) sits in the middle.
              const _MIN=0.10,_RNG=0.80;
              const _pct=v=>Math.max(0,Math.min(100,(v-_MIN)/_RNG*100));
              const _hasMechTarget=hasBalTargetSolve(fe);
              const _cur=_hasMechTarget?(feEffective.arbBalTarget??natMechBalance):tune.mechBalance;
              const _curLabel=_hasMechTarget?'TARGET':'CURRENT';
              const _inRange=_cur>=_lo&&_cur<=_hi;
              const _tc=_inRange?'#4ade80':_cur>_hi?'#f97316':'#60a5fa';
              const{stabIdx}=chassisAnalysis;
              const[stabLabel,stabCol]=stabIdx<0.85?['AGILE','#f59e0b']
                :stabIdx<0.97?['BALANCED','#9ca3af']
                :stabIdx<1.10?['STABLE','#60a5fa']
                :['PLANTED','#3b82f6'];
              return(
                <div style={{background:'#060c17',border:'1px solid #1e293b',borderRadius:2,
                             padding:'8px 10px',marginBottom:0,marginTop:8}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                    <span style={{display:'flex',alignItems:'center',gap:4}}>
                      <span style={{fontSize:11,color:'#94a3b8',letterSpacing:1}}>BALANCE GUIDE</span>
                      <Hint text="Compares your suspension's mech balance to the chassis's natural, uncorrected balance. Tap each row's ⓘ for details."/>
                    </span>
                    <span style={{fontSize:11,color:'#94a3b8'}}>{_layout} · {_build.toUpperCase()}</span>
                  </div>
                  {(()=>{
                    return(
                    <div style={{position:'relative',height:22,marginBottom:3}}>
                      <div style={{position:'absolute',top:9,left:0,right:0,height:6,background:'#0f172a',borderRadius:3}}/>
                      <div style={{position:'absolute',top:9,left:`${_pct(_lo)}%`,width:`${_pct(_hi)-_pct(_lo)}%`,height:6,background:'#14532d',borderRadius:2}}/>
                      {[0.15,0.25,0.35,0.45,0.55,0.65,0.75,0.85].map(v=>(
                        <div key={v} style={{position:'absolute',top:9,left:`${_pct(v)}%`,transform:'translateX(-50%)',width:1,height:6,background:'#2d5a72'}}/>
                      ))}
                      {[0.20,0.30,0.40,0.50,0.60,0.70,0.80].map(v=>(
                        <div key={v} style={{position:'absolute',top:6,left:`${_pct(v)}%`,transform:'translateX(-50%)',width:1,height:12,background:'#3a6b84'}}/>
                      ))}
                      <div style={{position:'absolute',top:4,left:`${_pct(natMechBalance)}%`,transform:'translateX(-50%)',width:3,height:14,background:'#94a3b8',borderRadius:1}}/>
                      <div style={{position:'absolute',bottom:1,left:`${_pct(natGripBalance)}%`,transform:'translateX(-50%)',
                                   width:0,height:0,borderLeft:'6px solid transparent',borderRight:'6px solid transparent',borderBottom:'9px solid #3b82f6'}}/>
                      <div style={{position:'absolute',top:6,left:`${_pct(1-natGripBalance)}%`,transform:'translateX(-50%)',
                                   width:10,height:10,borderRadius:'50%',background:'#2dd4bf',border:'2px solid #0f172a'}}/>
                      <div style={{position:'absolute',top:1,left:`${_pct(_cur)}%`,transform:'translateX(-50%)',
                                   width:0,height:0,borderLeft:'7px solid transparent',borderRight:'7px solid transparent',borderTop:`10px solid ${_tc}`}}/>
                    </div>);
                  })()}
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#94a3b8',marginBottom:7}}>
                    <span>0.10</span>
                    <span style={{color:'#64748b',letterSpacing:0.5}}>NAT {natMechBalance.toFixed(2)}</span>
                    <span>0.90</span>
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:'5px 0'}}>
                    <span style={{fontSize:11,color:'#94a3b8',display:'flex',alignItems:'center',gap:5}}>
                      <span style={{display:'inline-block',width:3,height:11,background:'#94a3b8',borderRadius:1,flexShrink:0}}/> NATURAL
                      <Hint text="Baseline mech balance from chassis geometry and weight alone — before any spring or ARB correction."/>
                    </span>
                    <span style={{textAlign:'right',fontFamily:'var(--font-mono)',fontSize:11,color:'#cbd5e1',display:'flex',alignItems:'center',gap:5,justifyContent:'flex-end'}}>
                      {natMechBalance.toFixed(2)}
                    </span>
                    <span style={{fontSize:11,color:'#94a3b8',display:'flex',alignItems:'center',gap:5}}>
                      <span style={{display:'inline-block',width:0,height:0,borderLeft:'5px solid transparent',borderRight:'5px solid transparent',borderBottom:'8px solid #3b82f6',flexShrink:0}}/> GRIP BIAS
                      <Hint text="At-limit lateral grip balance at the natural point (LLT model). Below 0.5 the front grips out first (understeer-prone); above 0.5 the rear does (oversteer-prone)."/>
                    </span>
                    <span style={{textAlign:'right',display:'flex',alignItems:'center',gap:8,justifyContent:'flex-end'}}>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'#3b82f6'}}>{natGripBalance.toFixed(2)}</span>
                      <span style={{fontSize:10,color:stabCol,letterSpacing:0.5}}>{stabLabel}</span>
                    </span>
                    <span style={{fontSize:11,color:'#94a3b8',display:'flex',alignItems:'center',gap:5}}>
                      <span style={{display:'inline-block',width:10,height:10,borderRadius:'50%',background:'#2dd4bf',flexShrink:0}}/> GRIP TARGET
                      <Hint text="Mirrors grip bias — target this in GRIP mode to exactly counteract the chassis's natural handling tendency."/>
                    </span>
                    <span style={{textAlign:'right',fontFamily:'var(--font-mono)',fontSize:11,color:'#2dd4bf'}}>{(1-natGripBalance).toFixed(2)}</span>
                    <span style={{fontSize:11,color:'#94a3b8',display:'flex',alignItems:'center',gap:5}}>
                      <span style={{display:'inline-block',width:12,height:4,background:'#14532d',borderRadius:1,flexShrink:0}}/> RANGE
                      <Hint text="Recommended target range for your layout and build, scaled between natural balance and the grip-neutral point (GRIP TARGET) — not a flat offset."/>
                    </span>
                    <span style={{textAlign:'right',display:'flex',flexDirection:'column',alignItems:'flex-end',gap:1}}>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'#16a34a'}}>{_lo.toFixed(2)} – {_hi.toFixed(2)}</span>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:10,color:'#475569',letterSpacing:0.3}}>Δ{_dfmt(_dlo)} → {_dfmt(_dhi)}</span>
                    </span>
                    <span style={{fontSize:13,color:'#cbd5e1',display:'flex',alignItems:'center',gap:5,fontWeight:600}}>
                      <span style={{display:'inline-block',width:0,height:0,borderLeft:'6px solid transparent',borderRight:'6px solid transparent',borderTop:`9px solid ${_tc}`,flexShrink:0}}/> {_curLabel}
                      <Hint text="In MECH or CO-SOLVE ARB mode, shows how far you're deliberately pushing away from natural. In WEIGHT or MAN mode there's no target to solve toward, so this shows your car's actual achieved balance instead."/>
                    </span>
                    {(()=>{
                      const _d=_cur-natMechBalance;
                      const _dabs=Math.abs(_d);
                      const _dstr=(_d>=0?'+':'')+_d.toFixed(2);
                      const _ddir=_dabs<0.015?'≈nat':_d>0?'OS':'US';
                      // Same direction colours as the marker (_tc): orange = oversteer side, blue = understeer side.
                      const _dcol=_dabs<0.015?'#94a3b8':_d>0?'#f97316':'#60a5fa';
                      return(
                        <span style={{textAlign:'right',display:'flex',flexDirection:'column',alignItems:'flex-end',gap:1}}>
                          <span style={{fontFamily:'var(--font-mono)',fontSize:15,color:_tc,fontWeight:600}}>
                            {_cur.toFixed(2)}{_inRange?' ✓':_cur>_hi?' ↑':' ↓'}
                          </span>
                          <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:_dcol,letterSpacing:0.3}}>
                            Δ{_dstr} {_ddir}
                          </span>
                        </span>
                      );
                    })()}
                  </div>
                </div>

          <div id="zone-feel" style={dim('ride','feel')}><Sec title="RIDE" open={open.ride} onToggle={tog('ride')}

              rearHzMan:DEF_FE.rearHzMan,

            <div style={dim('feel')}>
            {(()=>{
              const rRef=physics.rideRef??'front'; // 'front', 'rear', or 'shared'
              // Use tune.fHz/tune.rHz (not physics values) so CO-SOLVE effectiveRHz is reflected.
              // physics.rearHz is the pre-CO-SOLVE flatRide value; tune.rHz is the actual solved Hz.
              const avgHz=(tune.fHz+tune.rHz)/2;
              const primaryHz=rRef==='rear'?tune.rHz:rRef==='shared'?avgHz:tune.fHz;
              // Bottom-out g <-> Hz, same sag model as the SAG vs LOAD chart (gConst=9810mm/s^2).
              const rhPrimary_mm=rRef==='rear'?ch.rideHeightR*1000:rRef==='shared'?(ch.rideHeightF+ch.rideHeightR)/2*1000:ch.rideHeightF*1000;
              const hzToBottomG=hz=>rhPrimary_mm*Math.pow(2*Math.PI*hz,2)/9810;
              const bottomGToHz=g=>Math.sqrt(9810*Math.max(0,g)/rhPrimary_mm)/(2*Math.PI);
              const bottomGLo=hzToBottomG(HZ_MIN), bottomGHi=hzToBottomG(HZ_MAX);
              const primaryBottomG=hzToBottomG(primaryHz);
              return(<>
                {/* Ride reference toggle — always visible, works in CO-SOLVE via Hz inversion */}
                <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:4}}>
                  <span style={{flex:1,fontSize:10,color:'#94a3b8',letterSpacing:1}}>RIDE REF.<Hint text="Which axle the stiffness slider controls. FRONT: slider sets front Hz, rear is derived. REAR: slider sets rear Hz, front is derived. SHARED: slider sets the average of both axles, the mode below sets the front/rear ratio. Switching never changes the actual front or rear frequencies — it just moves which axle the slider follows. Works in CO-SOLVE too."/></span>
                  <button className={`tog${rRef==='front'?' on':''}`}
                    onClick={()=>setFe(p=>({...p,
                      rideRef:'front',

                      ...(p.rearHzMode==='independent'?{rearHzMan:Math.round(physics.rearHz*100)/100}:{}),

                  <button className={`tog${rRef==='shared'?' on':''}`}
                    onClick={()=>setFe(p=>({...p,

                      rideStiffness:hzToRs((tune.fHz+tune.rHz)/2),

                  <button className={`tog${rRef==='rear'?' on':''}`}
                    onClick={()=>setFe(p=>({...p,
                      rideRef:'rear',
                      rideStiffness:hzToRs(tune.rHz),
                      ...(p.rearHzMode==='independent'?{rearHzMan:Math.round(tune.fHz*100)/100}:{}),

                </div>
                {(()=>{
                  const effStiffMode=(fe.rideStiffMode??'hz')==='bottomG'&&ch.useRideHeightCG?'bottomG':'hz';

                  <button className={`tog${effStiffMode==='hz'?' on':''}`} onClick={()=>setFe(p=>({...p,rideStiffMode:'hz',

                  <button className={`tog${effStiffMode==='bottomG'?' on':''}`} onClick={()=>setFe(p=>({...p,rideStiffMode:'bottomG',rideBottomG:primaryBottomG}))}>BOTTOM G's</button>

                {(fe.rideStiffMode??'hz')==='bottomG'&&ch.useRideHeightCG?

                  hint={`Vertical-g load factor at which the ${rRef==='rear'?'rear':rRef==='shared'?'average':'front'} axle bottoms out, from static ride height and 1g sag — same model as the SAG vs LOAD chart. This target is saved with the build/share code and re-solves Hz on whatever chassis it's applied to.`}/>

                <FeelSlider
                  label={<>{rRef==='front'&&dnaDot('platformHz')}{rRef==='rear'?'Rear Stiffness':rRef==='shared'?'Avg Stiffness':'Ride Stiffness'}</>}
                  value={primaryHz}
                  onChange={v=>pFe('rideStiffness')(hzToRs(v))}
                  min={HZ_MIN} max={HZ_MAX} step={0.01} leftLabel={HZ_MIN.toFixed(2)} rightLabel={HZ_MAX.toFixed(2)}

                  box={{unit:'Hz'}}
                  hint={rRef==='rear'
                    ?'Rear spring frequency — the fixed reference. The mode below derives front Hz from it. Typical range: 1.0–1.8 Hz for street, 1.8–2.6 Hz for track.'
                    :rRef==='shared'
                    ?'Average of front and rear spring frequency. Moving the slider scales both axles together while the mode below holds the front/rear ratio.'
                    :'Front spring frequency — the fixed reference. The mode below derives rear Hz from it. Typical range: 1.0–1.8 Hz for street, 1.8–2.6 Hz for track.'}/>}
              </>);
            })()}
            {/* secondary Hz mode toggle — hidden in CO-SOLVE (rear Hz solved automatically) */}
            {arbBalMode!=='coSolve'&&(()=>{

            {arbBalMode!=='coSolve'&&(()=>{
              const rRef=physics.rideRef??'front';

              // Olley's own reference point is front ≈80% of rear (×1.25); Penske/Race Comp's

              const flatRideRatioHigh=flatRideRatio>1.25;
              return rearHzMode==='flatRide'
              ? <>
                <FeelSlider label="Target Speed" value={240-fe.targetSpeed}
                  onChange={v=>pFe('targetSpeed')(240-v)} min={40} max={180} step={5}
                  leftLabel="OFF" rightLabel="CITY"
                  // The slider runs inverted (240 − speed); the box shows and takes the speed itself,

                  box={{
                    value:mSpeed?Math.round(fe.targetSpeed*KMH_PER_MPH):fe.targetSpeed,
                    onCommit:v=>pFe('targetSpeed')(Math.max(60,Math.min(200,Math.round(mSpeed?v/KMH_PER_MPH:v)))),
                    min:mSpeed?Math.round(60*KMH_PER_MPH):60,
                    max:mSpeed?Math.round(200*KMH_PER_MPH):200,
                    dp:0,unit:mSpeed?'km/h':'mph'}}
                  // Resulting Hz is in the FRONT/REAR strip below; flag only OFF and a clamp.
                  readout={[fe.targetSpeed>=200&&'OFF',physics.rearHzClamped&&'⚠'].filter(Boolean).join(' ')||null}
                  hint={isShared
                    ?"Scales both axles together using flat-ride timing. The average Hz is held by the Avg Stiffness slider above; this speed sets how the average is split between front and rear."
                    :rRef==='rear'
                    ?"Solves front Hz so rear and front wheels hit the road's bumps in phase at your chosen speed. Right (CITY) = lower target speed, softer front. Left (OFF) = disabled, front Hz matches rear adjusted for mass only."
                    :"The speed at which front and rear wheels hit bumps in phase (flat ride). Right (CITY) = lower target speed, stiffer rear. Left (OFF) = flat-ride correction disabled — rear Hz matches front Hz adjusted for mass only, useful for very high-speed circuits."}/>
                {flatRideRatioHigh&&<div style={{fontSize:11,color:'#f59e0b',lineHeight:1.6,
                     marginTop:6,padding:'6px 8px',background:'#020617',borderRadius:2,
                     border:'1px solid #f5a62333'}}>
                  Rear is running ×{flatRideRatio.toFixed(2)} over front — above the typical

                </>
            : rearHzMode==='multiplier'

                      ?<><span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:physics.rearHzClamped?'#f59e0b':'#e2e8f0'}}>F {physics.frontHz.toFixed(2)}</span>
                        <span style={{fontSize:10,color:'#94a3b8'}}>Hz</span>
                        <span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:physics.rearHzClamped?'#f59e0b':'#e2e8f0'}}>R {physics.rearHz.toFixed(2)}</span>
                        <span style={{fontSize:10,color:'#94a3b8'}}>Hz</span></>
                      :<><span style={{fontFamily:'var(--font-mono)',fontSize:14,fontWeight:700,
                                    color:physics.rearHzClamped?'#f59e0b':'#e2e8f0'}}>
                          {secHz.toFixed(2)}
                        </span>
                        <span style={{fontSize:10,color:'#94a3b8'}}>Hz</span></>}

                  <div style={{fontSize:10,color:'#94a3b8',lineHeight:1.4}}>
                    {isShared?'Both springs solved from average to reach':'Rear spring stiffness solved to reach'} mech balance target{' '}
                    <span style={{color:'#9ca3af',fontFamily:'var(--font-mono)'}}>{feEffective.arbBalTarget.toFixed(2)}</span>.
                    {' '}{isShared?'Avg Stiffness slider shifts both together.':'Set target in ARB section above.'}
                  </div>
                </div>
            : rearHzMode==='shared'
              ? (()=>{
                  const rhF_mm=(ch.rideHeightF??0.13)*1000,rhR_mm=(ch.rideHeightR??0.12)*1000;
                  const gF=rhF_mm*Math.pow(2*Math.PI*physics.frontHz,2)/9810;
                  const gR=rhR_mm*Math.pow(2*Math.PI*physics.rearHz,2)/9810;
                  return <div style={{background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:2,
                                 padding:'6px 10px',marginBottom:6}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                      <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>SOLVED SPLIT</span>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:physics.rearHzClamped?'#f59e0b':'#e2e8f0'}}>F {physics.frontHz.toFixed(2)}</span>
                      <span style={{fontSize:10,color:'#94a3b8'}}>Hz</span>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:physics.rearHzClamped?'#f59e0b':'#e2e8f0'}}>R {physics.rearHz.toFixed(2)}</span>
                      <span style={{fontSize:10,color:'#94a3b8'}}>Hz</span>
                      {physics.rearHzClamped&&<span style={{fontSize:10,color:'#f59e0b',letterSpacing:1}}>CLAMPED</span>}
                    </div>
                    <div style={{fontSize:10,color:'#94a3b8',lineHeight:1.4}}>

                      out at the same vertical load factor, from each axle's own ride height.{' '}
                      Avg Bottom-Out slider above sets that shared target.
                    </div>
                  </div>;

              : <FeelSlider
                  label={rRef==='rear'?'Front Hz':'Rear Hz'}

                  box={{value:secHz,unit:'Hz'}}

          <div id="zone-damping" style={dim('damping')}><Sec title="DAMPERS" open={open.dampers} onToggle={tog('dampers')}
            onReset={()=>setFe(p=>({...p,

              reboundZeta:DEF_FE.reboundZeta,
              bumpRatio:DEF_FE.bumpRatio,
              bumpZeta:DEF_FE.bumpZeta,
              dampCharMode:DEF_FE.dampCharMode,

              settleTarget:DEF_FE.settleTarget}))}>
            {/* damping character mode toggle — INT/PRO only */}

                  onClick={()=>setFe(p=>({...p,dampCharMode:'zeta'}))}>CHARACTER</button>
                <button className={`tog${dampCharMode==='settle'?' on':''}`}
                  onClick={()=>setFe(p=>({...p,dampCharMode:'settle'}))}>SETTLE TIME</button>
              </div>
            </>}
            {dampCharMode==='settle'
              ? <FeelSlider label="Settle Target" value={fe.settleTarget??0.80}
                  onChange={pFe('settleTarget')} min={0.10} max={1.50} step={0.01}
                  leftLabel="0.10s" rightLabel="1.50s"
                  hint="Target settle time — how quickly oscillations die out after a bump. The app back-calculates rebound ζ for each axle from its spring frequency, against the same ζ-only estimate the DAMPERS rows show — bump damping doesn't move it, and the DYNAMICS chart, which measures the real curve, can read differently. The back-solve stops at 100% ζ: past critical damping more damping settles slower, not faster. Lower = tighter, more controlled. Higher = softer, more comfortable. Damping Bias skews the F/R timing ratio."
                  markers={[
                    {value:0.35,color:'#ef4444',label:'PLANTED'},
                    {value:0.60,color:'#f59e0b',label:'RACE'},
                    {value:0.90,color:'#9ca3af',label:'SPORT'},
                    {value:1.30,color:'#60a5fa',label:'ROAD'},
                  ]}
                  box={{unit:'s'}}
                  readout={`→ F ${Math.round(physics.zetaF)}% R ${Math.round(physics.zetaR)}%`}/>
              : <FeelSlider label={<>{dnaDot('reboundZeta')}Rebound ζ</>} value={fe.reboundZeta??70}
                  onChange={pFe('reboundZeta')} min={10} max={200} step={1}
                  leftLabel="10%" rightLabel="200%"
                  hint="Damping ratio for the rebound (extension) stroke — how quickly the suspension returns after compression. 55–70% is typical. 70% is Butterworth: the flattest response to a rough surface, which is not the same as the quickest settle after a single bump (that sits nearer 59%). Above 70% the car feels planted but stiff. Above 100% (overdamped) the suspension moves sluggishly."
                  markers={[
                    {value:40, color:'#60a5fa',label:'UNDER',lessThan:true},
                    {value:70, color:'#f59e0b',label:'BWORTH'},
                    {value:100,color:'#ef4444',label:'OVER'},
                  ]}
                  box={{unit:'%'}}
                  readout={(()=>{
                    const z=fe.reboundZeta??70;
                    if(z>100)return'⚠ OVERDAMPED';
                    // Butterworth is a point (ζ≈70.7%), not a region — label its neighbourhood
                    // only, and call everything above it what it actually is: firm.
                    if(z>72) return'FIRM';
                    if(z>=68) return'BUTTERWORTH';
                    return null;
                  })()}/> }
            {/* bump ratio / independent toggle */}
            <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:3,marginTop:8}}>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>BUMP MODE</span>
              <Hint text={dampingMode==='independent'
                ?"INDEPENDENT: set bump ζ directly, decoupled from rebound. Use this when you want a specific bump/rebound combination the ratio can't express — e.g. soft bump with firm rebound."
                :"BUMP RATIO: set bump damping as a percentage of rebound ζ — the app derives the bump ζ from that ratio, so the two strokes stay linked as rebound changes."}/>
            </div>
            <div style={{display:'flex',gap:3,marginBottom:10}}>
              <button className={`tog${dampingMode==='ratio'?' on':''}`}
                onClick={()=>setFe(p=>({...p,dampingMode:'ratio'}))}>BUMP RATIO</button>
              <button className={`tog${dampingMode==='independent'?' on':''}`}
                onClick={()=>setFe(p=>({...p,dampingMode:'independent',
                  // Seed the typed anchor from whichever axle the active Damping Balance Mode
                  // anchors, so RATIO→INDEPENDENT lands on the tune already on screen instead
                  // of jumping. Seeding from the front unconditionally was only right for a
                  // FRONT ride reference. SHARED anchors neither axle, so its midpoint is the
                  // nearest equivalent — approximate by design, it only has to not jump.
                  // Clamped to the slider's own range: a firm rebound ζ can push a resolved
                  // bump ζ past 115, and an out-of-range value leaves the handle pinned at the
                  // end while the tune uses something else.
                  bumpZeta:Math.max(10,Math.min(115,Math.round(
                    physics.rideRef==='rear'?physics.bumpZetaR
                    :physics.rideRef==='shared'?(physics.bumpZetaF+physics.bumpZetaR)/2
                    :physics.bumpZetaF)))}))}>INDEPENDENT</button>
            </div>
            {dampingMode==='ratio'
              ? <FeelSlider label={<>{dnaDot('bumpRatio')}Bump Ratio</>} value={fe.bumpRatio??56}
                  onChange={pFe('bumpRatio')} min={10} max={100} step={1}
                  leftLabel="10%" rightLabel="100%"
                  hint="Bump damping as a percentage of rebound. Lower = softer over sharp hits, more compliant on rough roads. Higher = more consistent feel between bump and rebound strokes. 40–65% is the typical range for most builds. The box is the ratio; the text beside it is the resulting bump ζ."
                  markers={[{value:30,color:'#60a5fa',label:'UNDER',lessThan:true},{value:65,color:'#f59e0b',label:'FIRM'}]}
                  box={{unit:'%'}}
                  readout={(()=>{
                    const ratio=Math.min(100,fe.bumpRatio??56);
                    const effReb=physics.zetaF;
                    const bz=Math.max(10,Math.min(effReb,effReb*ratio/100));
                    const bzR=Math.round(bz);
                    const zLabel=bz>100?`${bzR}% ⚠ OVERDAMPED`:
                                 bz>72 ?`${bzR}% · FIRM`:
                                 bz>=68?`${bzR}% · BUTTERWORTH`:
                                         `${bzR}%`;
                    return`ζ ${zLabel}`;
                  })()}/>
              : <FeelSlider label="Bump ζ" value={fe.bumpZeta??39}
                  onChange={pFe('bumpZeta')} min={10} max={115} step={1}
                  leftLabel="10%" rightLabel="115%"
                  hint="Bump damping ratio set independently from rebound. Useful when you want precise control — e.g. soft bump for road compliance with firm rebound for body control. Keep below rebound for normal handling. This is the anchor value: Damping Balance Mode splits it front/rear the same way it splits rebound, so the readout shows both axles whenever they diverge."
                  markers={[
                    {value:40, color:'#60a5fa',label:'UNDER',lessThan:true},
                    {value:70, color:'#f59e0b',label:'BWORTH'},
                    {value:100,color:'#ef4444',label:'OVER'},
                  ]}
                  readout={(()=>{
                    // Report what the axles actually run, not the raw typed number. Every
                    // Damping Balance Mode turns this into a front/rear pair, so the typed
                    // value is one axle's ζ at best (STANDARD, at the ride-reference axle) and
                    // neither axle's under SYNC/EQUAL FORCE, which diverge on Hz and mass even at
                    // bias 0. Mirrors the RATIO readout, which likewise shows resulting ζ.
                    const bF=physics.bumpZetaF,bR=physics.bumpZetaR;
                    const split=Math.abs(bF-bR)>0.5;
                    // CROSSED compares each axle's bump against THAT axle's rebound ζ. The old
                    // check used fe.reboundZeta, which is the wrong yardstick under SETTLE TIME
                    // (the anchor is back-solved, not typed) and under any split at all.
                    const cross=(bF>physics.zetaF+0.5||bR>physics.zetaR+0.5)?' ⚠ CROSSED':'';
                    const tag=z=>z>100?' ⚠ OVERDAMPED':z>72?' · FIRM':z>=68?' · BUTTERWORTH':'';
                    // The box already shows the typed anchor; repeat the axle ζ only when it differs.
                    const txt=split
                      ?`F ${Math.round(bF)}% | ${Math.round(bR)}% R${tag(Math.max(bF,bR))}${cross}`
                      :Math.round(bF)!==Math.round(fe.bumpZeta??39)
                      ?`→ ${Math.round(bF)}%${tag(bF)}${cross}`
                      :`${tag(bF)}${cross}`.replace(/^ · /,'').trim();
                    return txt||null;
                  })()}
                  box={{unit:'%'}}/>}
            <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:3,marginTop:2}}>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>DAMPING BALANCE MODE</span>
              <Hint text="Independent of REBOUND MODE above — REBOUND MODE decides how the anchor ζ is obtained (typed directly under CHARACTER, back-solved from a target time under SETTLE TIME); this decides how that single value becomes a front/rear split. STANDARD biases it directly by percentage — simplest, ignores any front/rear Hz difference. SYNC derives the other axle from its own Hz, then offers three methods: TIME SYNC (equal settle time, ignores corner mass), EQUAL FORCE (equal actual damping force, Hz- and corner-mass-aware), and HYBRID (halfway between them). Under SETTLE TIME, only the axle REBOUND MODE anchors to is guaranteed to hit your target time exactly — the other axle's real time is whatever this mode's split produces, shown honestly in the readout below even when it isn't equal. The Damping Bias slider below works in every mode and never resets when you switch between them — only the formula interpreting it changes."/>
            </div>
            <div style={{display:'flex',gap:3,marginBottom:8}}>
              <button className={`tog${dampBalMode==='standard'?' on':''}`}
                onClick={()=>setFe(p=>({...p,dampBalMode:'standard'}))}>STANDARD</button>
              <button className={`tog${dampBalMode!=='standard'?' on':''}`}
                onClick={()=>setFe(p=>({...p,dampBalMode:p.dampBalMode&&p.dampBalMode!=='standard'?p.dampBalMode:'sync'}))}>SYNC</button>
            </div>
            {dampBalMode!=='standard'&&<>
              <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:3}}>
                <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>SYNC METHOD</span>
                <Hint text="TIME SYNC: front and rear finish settling at the same time (Hz-aware, ignores corner mass). EQUAL FORCE: both axles push the same actual damping force (Hz- and corner-mass-aware) — useful when equal timing still leaves one end feeling harsher. HYBRID: halfway between the two, per axle."/>
              </div>
              <div style={{display:'flex',gap:3,marginBottom:8}}>
                {[['sync','TIME SYNC'],['hybrid','HYBRID'],['neutral','EQUAL FORCE']].map(([k,l])=>
                  <button key={k} className={`tog${dampBalMode===k?' on':''}`}
                    onClick={()=>setFe(p=>({...p,dampBalMode:k}))}>{l}</button>)}
              </div>
            </>}
            {(()=>{
              const timeBased=dampCharMode==='settle'||dampBalMode==='sync';
              const anchor=dampCharMode==='settle'?'the Settle Target':'Rebound ζ';
              const hint=dampBalMode==='sync'
                ?`TIME SYNC: biases settle time between front and rear. At centre (0), front and rear damp out in equal time regardless of any Hz difference between them (anchored to ${anchor}). Left (FRONT) makes the front settle faster. Right (REAR) makes the rear settle faster. The bias scales as 2× at ±50.`
                :dampBalMode==='hybrid'
                ?`HYBRID: at centre (0), each axle's ζ sits halfway between the TIME SYNC (equal settle time) and EQUAL FORCE (equal damping force) solutions (anchored to ${anchor}). Left (FRONT) firms the front. Right (REAR) firms the rear. The bias scales as 2× at ±50.`
                :dampBalMode==='neutral'
                ?`EQUAL FORCE: biases actual damping force between front and rear. At centre (0), both axles push the same physical force — accounts for Hz and corner mass, not just a raw ζ split (anchored to ${anchor}). Left (FRONT) shifts force toward the front. Right (REAR) shifts it toward the rear. The bias scales as 2× at ±50.`
                :`Biases damping around whichever axle is your Ride Reference — that axle holds the base ζ (anchored to ${anchor}); the other axle swings up to 50% at ±50, firmer one way and softer the other. Whichever axle ends up relatively firmer keeps more grip: firmer front leans understeer/stable, firmer rear leans oversteer/loose. SHARED splits the swing across both axles instead of pinning one.`;
              const settleTxt=Math.abs(tune.settleF-tune.settleR)<0.01?'EQUAL':`F ${tune.settleF.toFixed(2)}s | ${tune.settleR.toFixed(2)}s R`;
              const forceTxt=(()=>{
                const mF=(ch.weight/KG_TO_LB)*(ch.frontBias/100)/2,mR=(ch.weight/KG_TO_LB)*(1-ch.frontBias/100)/2;
                const fF=physics.zetaF*mF*tune.fHz,fR=physics.zetaR*mR*tune.rHz;
                const tot=fF+fR,fP=tot>0?Math.round(fF/tot*100):50;
                return Math.abs(fP-50)<1?'EQUAL':`F ${fP} | ${100-fP} R`;
              })();
              // HYBRID sits between equal time and equal force. Settle time already has its own
              // row in the summary table just below, and the label + value row is too narrow for
              // both, so the readout carries the force split (the half TIME SYNC's readout lacks),
              // plus a short TIME EQ flag when the settle times do land equal (same 0.01 s test
              // as settleTxt). Kept terse — anything longer truncates the Damping Bias label.
              const readout=dampBalMode==='hybrid'
                ? (()=>{
                    const timeEq=settleTxt==='EQUAL',forceEq=forceTxt==='EQUAL';
                    const f=forceTxt.replace(/^F (\d+) \| (\d+) R$/,'$1/$2');
                    return timeEq&&forceEq?'EQUAL':timeEq?`TIME EQ · F ${f}`:`FORCE ${forceEq?'EQUAL':f}`;
                  })()
                : timeBased
                ? settleTxt
                : dampBalMode==='neutral'
                ? forceTxt
                : (()=>{const tot=physics.zetaF+physics.zetaR;const fP=tot>0?Math.round(physics.zetaF/tot*100):50;return`F ${fP} | ${100-fP} R`;})();
              return(
                <FeelSlider label={<>{dnaDot('dampBias')}Damping Bias</>} value={-(fe.dampingBias??0)}
                  onChange={v=>pFe('dampingBias')(-v)} min={-50} max={50} step={1}
                  leftLabel="FRONT" rightLabel="REAR"
                  markers={[{value:0,color:'#94a3b8',label:'EQUAL'}]}
                  readout={readout}
                  hint={hint}/>
              );
            })()}
            {(()=>{
              // Whether front/rear actually diverge — not just whether the bias slider is off
              // centre. SYNC/NEUTRAL can diverge at bias 0 (Hz/mass differ even unbiased), and
              // physics.zetaF/zetaR already reflect whichever REBOUND MODE + Damping Balance
              // Mode combination is active, so checking them directly (rather than re-deriving
              // "should differ" from fe.dampingBias) is the only condition that can't drift out
              // of sync with the actual computed values.
              const biased=Math.abs(physics.zetaF-physics.zetaR)>0.5;
              const worst=Math.max(tune.settleF,tune.settleR);
              const[cat,col]=worst<0.35?['PLANTED','#ef4444']:worst<0.60?['RACE','#f59e0b']:
                             worst<0.90?['SPORT','#9ca3af']:worst<1.30?['ROAD','#60a5fa']:['SOFT','#818cf8'];
              const lbl=t=><span style={{fontSize:10,color:'#94a3b8',letterSpacing:1,width:44,flexShrink:0}}>{t}</span>;
              const val=v=><span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'#9ca3af'}}>{v}</span>;
              return(
                <div style={{padding:'5px 8px',background:'#0a0f1a',borderRadius:2,
                             border:'1px solid #1e293b',marginBottom:4,marginTop:-6}}>
                  {biased&&(
                    <div style={{display:'flex',marginBottom:3}}>
                      <span style={{width:44,flexShrink:0}}/>
                      <span style={{flex:1,fontSize:10,color:'#94a3b8',letterSpacing:1}}>FRONT</span>
                      <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>REAR</span>
                    </div>
                  )}
                  <div style={{display:'flex',alignItems:'center',marginBottom:biased?2:0}}>
                    {lbl('REB')}
                    {biased?<>{val(`${Math.round(physics.zetaF)}%`)}<div style={{flex:1}}/>{val(`${Math.round(physics.zetaR)}%`)}</>
                           :<>{val(`${Math.round(physics.zetaF)}%`)}<div style={{flex:1,height:1,background:'#1e293b',margin:'0 6px'}}/><span style={{fontSize:10,color:'#94a3b8',letterSpacing:1,marginRight:6}}>BUMP</span>{val(`${Math.round(physics.bumpZetaF)}%`)}</>}
                  </div>
                  {biased&&(
                    <div style={{display:'flex',alignItems:'center',marginBottom:2}}>
                      {lbl('BUMP')}
                      {val(`${Math.round(physics.bumpZetaF)}%`)}<div style={{flex:1}}/>{val(`${Math.round(physics.bumpZetaR)}%`)}
                    </div>
                  )}
                  <div style={{display:'flex',alignItems:'center',marginTop:biased?0:-2}}>
                    {lbl('SETTLE')}
                    {biased?<>{val(`${tune.settleF.toFixed(2)}s`)}<div style={{flex:1}}/>{val(`${tune.settleR.toFixed(2)}s`)}</>
                           :<>{val(`${tune.settleF.toFixed(2)}s`)}</>}
                    <span style={{fontSize:10,color:col,letterSpacing:1,marginLeft:biased?4:6}}>{cat}</span>
                  </div>
                  {/* AVG ζ: bump/rebound mean — an asymmetric damper removes about as much
                      energy per cycle as a symmetric one at the average, so this is how damped
                      the car is overall. Informational only and deliberately uncoloured: whether
                      softer bump helps or hurts depends on surface (KNOWN_ISSUES, bump damping in
                      the RESPONSE bar), so it must not read as a verdict. */}
                  <div style={{display:'flex',alignItems:'center',marginTop:2}}
                       title="Average of bump and rebound ζ — roughly how damped the car is overall once bump and rebound differ. An approximation: it hides which stroke comes first.">
                    {lbl('AVG ζ')}
                    {biased?<>{val(`≈${Math.round((physics.zetaF+physics.bumpZetaF)/2)}%`)}<div style={{flex:1}}/>{val(`≈${Math.round((physics.zetaR+physics.bumpZetaR)/2)}%`)}</>
                           :<>{val(`≈${Math.round((physics.zetaF+physics.bumpZetaF)/2)}%`)}</>}
                  </div>
                  {(()=>{
                    // MEASURED: the DYNAMICS chart's bump-aware settle, beside the analytic
                    // SETTLE above. SETTLE stays analytic because SETTLE TIME mode back-solves
                    // against it (type 0.55s, read 0.55s); see HISTORY.
                    const m=measureSettle(tune.fHz,tune.zetaF??physics.zetaF,tune.bumpZetaF??physics.bumpZetaF,
                                          tune.rHz,tune.zetaR??physics.zetaR,tune.bumpZetaR??physics.bumpZetaR,
                                          tune.settleF,tune.settleR);
                    const fmt=s=>s!=null?`${s.toFixed(2)}s`:`>${m.durSec.toFixed(2)}s`;
                    const split=biased||m.fSettle==null||m.rSettle==null||Math.abs(m.fSettle-m.rSettle)>=0.01;
                    return(
                      <div style={{display:'flex',alignItems:'center',marginTop:2}}
                           title="Settle time measured off the DYNAMICS trace, which alternates bump and rebound damping. SETTLE above uses rebound ζ alone, so the two differ; SETTLE is what SETTLE TIME mode targets.">
                        {lbl('MEAS')}
                        {split?<>{val(fmt(m.fSettle))}<div style={{flex:1}}/>{val(fmt(m.rSettle))}</>
                              :<>{val(fmt(m.fSettle))}</>}
                      </div>
                    );
                  })()}
                </div>
              );
            })()}
          </Sec></div>

          {uiMode==='pro'&&<div id="zone-alignment" style={dim('alignment')}><Sec title="ALIGNMENT" open={open.alignment} onToggle={tog('alignment')}
            onReset={()=>setAl({...DEF_AL})}>
            <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:6}}>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:2}}>ALIGNMENT MODE</span>
              <Hint text="AUTO: camber/toe/caster recommended from build type, layout, weight bias, and roll angle — optionally nudged toward your Mech Balance Target or the chassis's natural grip tendency (see Nudge below). MANUAL: type in exact values, bypassing all of this."/>
            </div>
            <div style={{display:'flex',gap:3,marginBottom:10,flexWrap:'wrap'}}>
              <button className={`tog${alignMode!=='manual'?' on':''}`}
                onClick={()=>setAl(p=>({...p,mode:'build'}))}>AUTO</button>
              <button className={`tog${alignMode==='manual'?' on':''}`}
                onClick={()=>setAl(p=>({...p,mode:'manual'}))}>MANUAL</button>
            </div>
            {alignMode!=='manual'&&<div style={{marginBottom:10}}>
              <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:4}}>
                <span style={{fontSize:12,color:'#94a3b8'}}>Nudge</span>
                <Hint text="OFF: BUILD's numbers, unchanged. MECH: nudges camber and toe toward your resolved Mech Balance Target's gap from natural — reinforces whatever oversteer/understeer intent you've already dialed in via the ARB/Mech Balance Target. GRIP: nudges to counteract the chassis's own natural grip tendency instead, independent of ARB mode. Caster is never nudged — it isn't an oversteer/understeer lever."/>
              </div>
              <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>
                {['build','mech','grip'].map(m=>(
                  <button key={m} className={`tog${alignMode===m?' on':''}`}
                    onClick={()=>setAl(p=>({...p,mode:m}))}>{m==='build'?'OFF':m.toUpperCase()}</button>
                ))}
              </div>
              {(alignMode==='mech'||alignMode==='grip')&&
                <div style={{marginTop:8}}>
                <FeelSlider label="Nudge Strength" value={al.nudgeStrength??50}
                  onChange={pAl('nudgeStrength')} min={0} max={100} step={1}
                  leftLabel="SUBTLE" rightLabel="STRONG"
                  box={{unit:'%'}}
                  hint="How strongly camber and toe are nudged away from the BUILD baseline. 0% = identical to BUILD mode. 100% = full nudge toward the MECH/GRIP gap. Caster is never adjusted by this — it isn't an oversteer/understeer lever."/>
                </div>}
            </div>}
            {alignMode==='manual'&&<>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 10px'}}>
                <Field label="Camber F" value={al.camberF} onChange={pAl('camberF')} min={-4.0} max={0.0} step={0.1} unit="°"
                  hint="Front camber, entered directly."/>
                <Field label="Camber R" value={al.camberR} onChange={pAl('camberR')} min={-3.5} max={0.0} step={0.1} unit="°"
                  hint="Rear camber, entered directly."/>
                <Field label="Toe F" value={al.toeF} onChange={pAl('toeF')} min={-0.20} max={0.15} step={0.1} unit="°"
                  hint="Front toe, entered directly. Negative = toe-out, positive = toe-in."/>
                <Field label="Toe R" value={al.toeR} onChange={pAl('toeR')} min={0.0} max={0.25} step={0.1} unit="°"
                  hint="Rear toe, entered directly."/>
              </div>
              <Field label="Caster" value={al.caster} onChange={pAl('caster')} min={4.0} max={7.5} step={0.1} unit="°"
                hint="Caster, entered directly."/>
            </>}
          </Sec></div>}

          </>}
        </div>
        {/* PINNED — stays put while the scrollable content above it scrolls, so graphs/dials
            here stay visible regardless of which input section is currently open. BEG mode has
            its own simplified panel with no ARB/RIDE/DAMPERS sections for these dials to relate
            to, so VISUALS stays hidden there. */}
        {uiMode!=='beginner'&&!(isPhone&&sbTyping)&&<div id="zone-visuals" style={{flexShrink:0,borderTop:'1px solid #0f172a',...dim('visuals')}}>
          <Sec title="VISUALS" open={open.visuals} onToggle={tog('visuals')}>
            <div style={{maxHeight:isPhone?'32vh':'50vh',overflowY:'auto',overscrollBehavior:'contain'}}>
              {dnaLink&&<>
              <div className="collapsible-hdr" onClick={()=>setOpen(p=>({...p,visDna:!p.visDna}))}
                style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',marginBottom:3,userSelect:'none',padding:'3px 4px'}}>
                <span style={{fontSize:9,letterSpacing:2,color:'#334155'}}>DNA MATCH</span>
                <span style={{fontSize:9,color:'#818cf8'}}>{dnaLink.name}</span>
                <span style={{marginLeft:'auto',fontSize:9,color:'#475569'}}>{open.visDna?'▲':'▼'}</span>
              </div>
              {open.visDna&&<div style={{padding:'0 4px',marginBottom:14,fontSize:10}}>
                <div style={{display:'grid',gridTemplateColumns:'1fr 64px 64px 14px',gap:'2px 6px',color:'#475569',fontSize:9,letterSpacing:1,marginBottom:2}}>
                  <span>AXIS</span><span style={{textAlign:'right'}}>TARGET</span><span style={{textAlign:'right'}}>NOW</span><span/>
                </div>
                {dnaLink.rows.map(r=>{
                  const ui=DNA_AXIS_UI.find(a=>a.k===r.k);

                      {uiMode==='pro'&&(_weightAdj!==0||_diamAdj!==0||_natAdj!==0)&&<div style={{fontSize:9,color:centerMatch?'#1e293b':'#334155',marginTop:2}}>
                        base {_baseCenter}%{_weightAdj!==0?` · weight ${_weightAdj>0?'+':''}${_weightAdj}%`:''}{_diamAdj!==0?` · tyres ${_diamAdj>0?'+':''}${_diamAdj}%`:''}{_natAdj!==0?` · balance ${_natAdj>0?'+':''}${_natAdj}%`:''}
                      </div>}

                ?(arbBalMode==='coSolve'&&fe.springShareAuto!==false

                  :arbBalMode==='coSolve'
                  ?' ARB Share % limits the total ARB budget — increase Spring Share so CO-SOLVE contributes more spring correction, or raise ARB Share % to give the bars more range.'
                  :' ARB Share % limits the total ARB budget — raise ARB Share % to give the bars more range.')
                :arbMode==='basic'
                ?(arbBalMode==='coSolve'&&fe.springShareAuto!==false
                  ?' ARB Stiffness limits the total ARB budget — disable AUTO and increase Spring Share to let CO-SOLVE contribute more correction from springs.'
