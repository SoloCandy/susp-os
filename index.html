const CheckerModal=({onClose,lim,units,ch,setCh,setFe,onImportDna,initialMode})=>{
  const mMass=units.mass==='kg',su=springUnit(units.spring);
  // A physical-unit game mode has no click ceiling, so the inputs here take BeamNG's own
  // units — N/m springs and anti-roll rate, N/m/s damping — which also means computeCheck
  // must not divide the damping calibration back out. Seeds differ by orders of magnitude
  // between the two, so they key off the same flag rather than being hardcoded. Seed values
  // are the stock figures observed on a test vehicle.
  const phys=lim.damping==null;
  const[ckMode,setCkMode]=useState(initialMode??'decode');
  // Seeded from the Hz this car's MEAS. NAT BAL was read at, because step 2 is defined to be
  // taken on step 1's springs and solveArbScale's own natural-balance offset is isolated at
  // ch.measuredNatBalHz. Opening at a flat 2.20 on a car read at any other Hz put the springs
  // the card printed, and the springs the solve assumed, at two different frequencies: a car
  // saved at 2.5 solved ~32% low, at 3.0 ~59% low, at 1.8 ~100% high, and silently, because
  // both readings shift the same way so the A/B spread stays narrow. Null means a reading from
  // before the Hz was recorded, which NAT_BAL_REF_HZ covers — the same fallback the offset uses.
  // 2.20 Hz, not the 2.5 this defaulted to: the softer the probe springs, the more of the
  // displayed balance the bars account for, so the same 2-decimal reading pins the ARB click
  // scale harder. Measured against solveArbScale over four representative cars, a 2dp reading
  // is worth about +-6.8% of the scale at 2.5 Hz, +-6.0% at 2.20 and +-4.8% at 1.5. Not lower
  // by default because the spring rate this asks for has to still exist in the game's range on
  // a heavy car; the field goes to 1.0 for anyone whose car allows it. NAT_BAL_REF_HZ stays
  // 2.5 — it is what unrecorded legacy readings were taken at, not this default.
  const[probeHz,setProbeHz]=useState(()=>ch.useMeasuredNatBal?(ch.measuredNatBalHz??NAT_BAL_REF_HZ):NAT_BAL_PROBE_HZ);
  // MEASURE ARB: Forza's mech balance with the bars rear-biased (A) and front-biased (B).
  const[arbReadA,setArbReadA]=useState(null);
  const[arbReadB,setArbReadB]=useState(null);
  const[ckSpr,setCkSpr]=useState(phys?{f:70000/LB_IN_TO_NM,r:200000/LB_IN_TO_NM}:{f:400,r:300});
  const[ckDmp,setCkDmp]=useState(phys?{rebF:16000,rebR:10000,bumpF:6000,bumpR:4000}
                                     :{rebF:5,rebR:5,bumpF:3,bumpR:3});
  const[ckArb,setCkArb]=useState(phys?{f:40000,r:60000}:{f:20,r:20});
  const[imported,setImported]=useState(false);
  const[dnaSet,setDnaSet]=useState(false);
  const flash=set=>{set(true);setTimeout(()=>set(false),2000);};
  // Whether anything in DECODE's step 1 has actually been typed. The spring/damper/ARB fields open
  // on stock figures (see the seeds above) because Field needs a number, so before this flips the
  // card below would otherwise print a complete, confident decode of a tune nobody entered, with
  // both import buttons live beside it. Step 2 stays empty until it flips — the same choice MEASURE
  // makes with its NOT SET readings rather than letting 0.50 read as a measurement.
  // Vehicle Mass is excluded on purpose: it writes to ch and is shared with the sidebar, so editing
  // it is not entering a tune.
  const[ckEntered,setCkEntered]=useState(false);
  const pS=k=>v=>{setCkEntered(true);setCkSpr(p=>({...p,[k]:v}));};
  const pD=k=>v=>{setCkEntered(true);setCkDmp(p=>({...p,[k]:v}));};
  const pA=k=>v=>{setCkEntered(true);setCkArb(p=>({...p,[k]:v}));};
  const masses=useMemo(()=>cornerMasses(ch),[ch]);
  const ck=useMemo(()=>computeCheck(ckSpr,ckDmp,masses,phys?1:DAMPING_CALIBRATION),[ckSpr,ckDmp,masses,phys]);
  // The Damping Bias the decoded front/rear ζ split asks for, before the slider's ±50 clamps it.
  // Read by decodedFe and shown below when it doesn't fit, because the alternative is handing
  // back a damper split that is not the one you typed and saying nothing about it.
  const biasWanted=ck.zRebF>0?Math.round(100*(1-ck.zRebR/ck.zRebF)):0;
  // The decoded numbers as one fe patch, shared by both buttons below: IMPORT TUNE writes it to
  // the sidebar, IMPORT AS DNA measures the tune it produces and hands the axes to the DNA
  // editor. One function so the two can never read the same inputs differently.
  const decodedFe=prev=>{
    const hzF=clampHz(ck.hF);
    const hzR=clampHz(ck.hR);
    const mult=Math.max(0.5,Math.min(3.0,Math.round((hzR/hzF)*100)/100));
    // The FRONT axle is the anchor because the patch below writes rideRef:'front', and STANDARD's
    // exact-anchor axle follows Ride Reference — so zetaF lands on reboundZeta and the rear is
    // whatever dampingBias makes of it: zetaR = zetaF·(1 − dampingBias/100). Both halves have to
    // agree with that one formula. Anchoring instead to whichever axle damps harder (what this
    // did until the Ride-Reference change landed) puts the rear's ζ on the front, and a bias
    // scaled 200·(1−ratio) moves the rear twice as far as asked; see docs/HISTORY.md.
    const reboundZeta=Math.max(10,Math.min(200,Math.round(ck.zRebF)));
    // ±50 is the slider's range, so a rear axle outside 0.5..1.5× the front's ζ lands at the end
    // of it rather than on its real split. Nothing in the app can express that spread, so the
    // card warns instead of pretending.
    const dampingBias=Math.max(-50,Math.min(50,biasWanted));
    // Bump anchors on the front for the same reason, and RATIO then gives the rear bump the same
    // dampingBias split rebound got. A tune whose bump split differs from its rebound split is
    // therefore not exactly reproducible — one slider drives both — which the DECODED TUNE card's
    // hint states outright.
    const bumpRatio=Math.max(10,Math.min(100,Math.round(ck.zRebF>0?ck.zBmpF/ck.zRebF*100:56)));
    return{...prev,
      rideStiffness:Math.round(hzF*100)/100,
      rideRef:'front',rearHzMode:'multiplier',rearHzMult:mult,
      dampingMode:'ratio',dampCharMode:'zeta',dampBalMode:'standard',
      reboundZeta,bumpRatio,dampingBias,
      arbBalMode:'manual',
      arbMode:'man',
      // fe.arbMan* is always roll stiffness; the physical inputs above are BeamNG's linear
      // N/m, so invert k = 2·rs/(track·mr)² on the way in — the same ARB Motion Ratio the
      // output card and MAN entry use, or an imported tune reads back at a different rate.
      arbManF:phys?Math.max(0,ckArb.f*ch.trackF*ch.trackF*mrDiv(ch.arbMotionRatioF)/2):Math.max(1,Math.min(lim.arb,ckArb.f)),
      arbManR:phys?Math.max(0,ckArb.r*ch.trackR*ch.trackR*mrDiv(ch.arbMotionRatioR)/2):Math.max(1,Math.min(lim.arb,ckArb.r))};
  };
  const importDecoded=()=>{setFe(decodedFe);flash(setImported);};
  // Overwrites the DNA editor's draft and nothing else — the sidebar tune is left where it is.
  const importDecodedDna=()=>{onImportDna(decodedFe);flash(setDnaSet);};
  const probeMasses=useMemo(()=>cornerMasses(ch),[ch]);
  const probeRateF=useMemo(()=>(2*Math.PI*probeHz)**2*probeMasses.front/LB_IN_TO_NM,[probeHz,probeMasses]);
  const probeRateR=useMemo(()=>(2*Math.PI*probeHz)**2*probeMasses.rear /LB_IN_TO_NM,[probeHz,probeMasses]);
  // MEASURE ARB's two setups: one bar at the ceiling, the other at 1, then swapped.
  // Each reading solves for a scale on its own; they are averaged because a single 2dp reading
  // moves the answer by several percent, and the swap cancels any front/rear bias in the model.
  // The ceiling, not the 70% of it this used, because the wider the bar spread the more of the
  // displayed balance the bars account for and the harder a 2dp reading pins the scale: ±5.3%
  // against ±5.8% at the 2.20 Hz default. The gain shrinks and reverses on very soft springs —
  // by 1.0 Hz the balance is far enough toward the extremes that the tyre-in-series term
  // compresses it — so this and the probe Hz are not additive. No car's reading leaves the
  // 0.05–0.95 entry bounds at any scale in ARB_SCALE_MIN..MAX.
  const arbProbeHi=lim?.arb??null;
  // The springs step 2's readings are taken on are step 1's, so the solve is anchored to the Hz
  // step 1 was read at rather than to the live slider. Moving the slider afterwards changes the
  // rates the card prints without re-taking step 1, and solving those readings at the new Hz
  // against an offset isolated at the old one is not a measurement of anything — arbHzMismatch
  // says so on screen instead.
  const arbSolveHz=ch.useMeasuredNatBal?(ch.measuredNatBalHz??NAT_BAL_REF_HZ):probeHz;
  const arbHzMismatch=ch.useMeasuredNatBal&&Math.abs(probeHz-arbSolveHz)>1e-9;
  const arbScaleA=arbProbeHi&&arbReadA!=null?solveArbScale(ch,arbSolveHz,1,arbProbeHi,arbReadA):null;
  const arbScaleB=arbProbeHi&&arbReadB!=null?solveArbScale(ch,arbSolveHz,arbProbeHi,1,arbReadB):null;
  const arbScaleNew=arbScaleA!=null&&arbScaleB!=null?(arbScaleA+arbScaleB)/2:null;
  // How far apart the two independent solves are, as a fraction of their mean. A wide gap is not
  // by itself an error — see ARB_SCALE_SPREAD_WARN for how much rounding and front/rear asymmetry
  // produce on their own.
  const arbScaleSpread=arbScaleNew!=null&&arbScaleNew>0?Math.abs(arbScaleA-arbScaleB)/arbScaleNew:null;
  return(
    // No backdrop close here, unlike the other modals: MEASURE's two ARB readings live in this
    // component's state and are taken one at a time with a trip into the game between them, so a
    // stray click on the dim margin used to discard them silently. ✕ is the only way out.
    <div style={{position:'fixed',inset:0,background:'#000c',zIndex:999,
                 display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{background:'#020617',border:'1px solid #1e293b',borderRadius:2,
                   width:660,maxWidth:'calc(100vw - 20px)',maxHeight:'88vh',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                     padding:'8px 14px',borderBottom:'1px solid #1e293b',flexShrink:0}}>
          <span style={{fontSize:12,color:'#9ca3af',letterSpacing:2}}>TUNE CHECK</span>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            <button className="tbtn" style={{fontSize:9,color:ckMode==='decode'?'#e2e8f0':'#475569'}}
              onClick={()=>setCkMode('decode')}>DECODE</button>
            <button className="tbtn" style={{fontSize:9,color:ckMode==='probe'?'#60a5fa':'#475569'}}
              onClick={()=>setCkMode('probe')}>MEASURE</button>
            <button onClick={onClose} style={{background:'none',border:'none',color:'#94a3b8',
                                             cursor:'pointer',fontSize:17,lineHeight:1}}>✕</button>
          </div>
        </div>
        <div style={{padding:14,flex:1,minHeight:0,overflowY:'auto',overscrollBehavior:'contain'}}>
          {/* DECODE is one procedure in a fixed order — enter the tune, then choose where it lands —
              so it reads as two numbered steps in one column, matching MEASURE next door. It used to
              be five side-by-side cards with a HOW TO USE card among them carrying all four stages of
              instruction in prose: the guidance sat beside the fields instead of on them, the two
              destinations differed only in a paragraph nobody reads at the point of clicking, and the
              DECODED TUNE card printed a full decode of the seed numbers the moment it opened. The
              card title keeps DECODED TUNE below the step number: the tutorials and glossary name it. */}
          {ckMode==='decode'&&(()=>{
            const destHint=onImportDna
              ?'Two destinations. IMPORT TUNE keeps the numbers; IMPORT AS DNA keeps the handling.'
              :'IMPORT TUNE writes these numbers onto this car. IMPORT AS DNA needs PRO.';
            return(
            <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:10}}>
              <CkIntro>
                Type in a tune that has no share code, exactly as the game shows it. Nothing changes
                until you pick a destination in step 2. <TermLink id="tune-check"/>
              </CkIntro>

              <Card title="STEP 1 · TUNE INPUTS" accent
                headerRight={<CkChip on={ckEntered}>{ckEntered?'ENTERED':'NOT SET'}</CkChip>}>
                <div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6}}>
                  Enter the tune's numbers as the game prints them; the fields open on stock figures, so
                  overwrite them.
                </div>
                <CkNote>Vehicle Mass is the car, not the tune — set it before reading step 2.</CkNote>
                <CkPhase>VEHICLE MASS — SHARED WITH THE SIDEBAR</CkPhase>
                <Field noSlider label="Weight"
                  value={mMass?ch.weight/KG_TO_LB:ch.weight}
                  onChange={mMass?v=>setCh(p=>({...p,weight:v*KG_TO_LB})):v=>setCh(p=>({...p,weight:v}))}
                  min={mMass?45:100} max={mMass?8165:18000} step={1}
                  unit={mMass?'kg':'lb'} logScale={true} logMid={mMass?2722:6000}/>
                <Field label="Front Bias" value={ch.frontBias} onChange={v=>setCh(p=>({...p,frontBias:v}))} min={30} max={70} step={1} unit="%"/>
                <Stat label="Corner mass front" value={masses.front} unit="kg"/>
                <Stat label="Corner mass rear" value={masses.rear} unit="kg"/>
                {/* Physical modes always take N/m regardless of the UNITS spring choice, because that
                    is the unit BeamNG's slider and this mode's SPRINGS card both use — asking
                    for lb/in here while printing N/m there would break the round-trip.
                    LB_IN_TO_NM is N/m per lb/in; NMM_PER_LBIN is the MET toggle's N/mm.
                    One `conv` drives value/onChange/min/max so the round-trip stays symmetric.
                    MET carries a decimal and a 0.1 step to match Forza's own "N/mm" readout
                    (which is 10x true N/mm — see NMM_PER_LBIN). */}
                <CkPhase>SPRING RATES</CkPhase>
                {[['Spring Rate Front','f'],['Spring Rate Rear','r']].map(([lbl,k])=>{
                  const conv=phys?LB_IN_TO_NM:su.f;
                  const dp=phys?0:su.dp;
                  const converted=conv!==1;
                  return <Field noSlider key={k} label={lbl}
                    value={converted?+(ckSpr[k]*conv).toFixed(dp):ckSpr[k]}
                    onChange={converted?v=>pS(k)(v/conv):pS(k)}
                    min={+(50*conv).toFixed(dp)} max={+(2500*conv).toFixed(dp)}
                    step={phys?100:su.step} unit={phys?'N/m':su.label}/>;
                })}
                <CkPhase>DAMPING</CkPhase>
                {[['Rebound Front','rebF'],['Rebound Rear','rebR'],
                  ['Bump Front','bumpF'],['Bump Rear','bumpR']].map(([lbl,k])=>(
                  <Field noSlider key={k} label={lbl} value={ckDmp[k]} onChange={pD(k)}
                    min={phys?0:1} max={phys?40000:lim.damping} step={phys?50:0.1}
                    unit={phys?'N/m/s':`/ ${lim.damping}`}/>
                ))}
                <CkPhase>ANTI-ROLL BARS</CkPhase>
                <div style={{fontSize:10,color:'#475569',lineHeight:1.5,marginBottom:4}}>{phys
                  ?"Anti-Roll Spring Rate in N/m, straight off BeamNG's slider."
                  :'Clicks, exactly as the in-game tune shows them.'}</div>
                {[['ARB Front','f'],['ARB Rear','r']].map(([lbl,k])=>(
                  <Field noSlider key={k} label={lbl} value={ckArb[k]} onChange={pA(k)}
                    min={phys?0:1} max={phys?200000:lim.arb} step={phys?500:0.1}
                    unit={phys?'N/m':`/ ${lim.arb}`}/>
                ))}
              </Card>

              <Card title="STEP 2 · DECODED TUNE" accent
                headerRight={<CkChip on={ckEntered}>{ckEntered?'READY':'WAITING'}</CkChip>}
                hint="The tune read back as Hz and damping ratios. One front/rear split drives both rebound and bump, so some damper splits land close rather than exact." hintTerm="tune-check">
                {/* Hidden rather than dimmed while nothing is entered: the point of the gate is that
                    there is no decode yet, and a greyed-out number is still a number on screen. */}
                {!ckEntered
                  ?<div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6}}>
                    Waiting on step 1 — the decode appears once you type the tune's springs, dampers or
                    bars.</div>
                  :<>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4,marginBottom:6}}>
                    <Readout label="Hz FRONT" value={ck.hF} unit="Hz"/>
                    <Readout label="Hz REAR" value={ck.hR} unit="Hz"/>
                  </div>
                  <Stat label="Rebound ratio front" value={ck.zRebF} unit="%" decimals={1}/>
                  <Stat label="Rebound ratio rear"  value={ck.zRebR} unit="%" decimals={1}/>
                  <Stat label="Bump ratio front"    value={ck.zBmpF} unit="%" decimals={1}/>
                  <Stat label="Bump ratio rear"     value={ck.zBmpR} unit="%" decimals={1}/>
                  <Stat label="ARB front" value={ckArb.f} unit={phys?'N/m':`/ ${lim.arb}`} decimals={phys?0:1}/>
                  <Stat label="ARB rear"  value={ckArb.r} unit={phys?'N/m':`/ ${lim.arb}`} decimals={phys?0:1}/>
                  {Math.abs(biasWanted)>50&&<CkWarn>
                    This split needs a front/rear damping bias of {biasWanted>0?'+':''}{biasWanted}, past the ±50 limit, so
                    the front is matched and the rear lands as close as it can.</CkWarn>}
                  {/* The two destinations are a fork, not a pair of similar buttons, and which one you
                      want is the only real decision in this tab — so each says in a line what it keeps
                      and what it touches, where a shared HOW TO USE card used to say it once, far away
                      and before the reader had anything to apply it to.
                      No trailing ? on either label — elsewhere in the app that marks a second click
                      (SURE?), and both of these act on the first one. */}
                  <CkPhase>WHERE IT GOES</CkPhase>
                  <div style={{fontSize:10,color:'#475569',lineHeight:1.5,marginBottom:6}}>{destHint}</div>
                  <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    <div>
                      <button className={`tbtn${imported?' saved':''}`} style={{width:'100%',fontSize:10}}
                        title="Writes these numbers onto this car's springs, dampers and anti-roll bars."
                        onClick={importDecoded}>{imported?'IMPORTED ✓':'IMPORT TUNE'}</button>
                      <div style={{fontSize:10,color:'#94a3b8',lineHeight:1.5,marginTop:4}}>
                        Keeps the numbers: replaces this car's springs, dampers and anti-roll bars, close
                        rather than exact — review them afterward.
                      </div>
                    </div>
                    <div>
                      <button className={`tbtn${dnaSet?' saved':''}`} disabled={!onImportDna}
                        style={{width:'100%',fontSize:10,opacity:onImportDna?1:0.35}}
                        title={onImportDna
                          ?"Replaces the DNA editor's draft with this tune's handling; this car is left alone."
                          :'Vehicle DNA is PRO only — switch tier to use it.'}
                        onClick={importDecodedDna}>{dnaSet?'DNA SET ✓':'IMPORT AS DNA'}
                        {!onImportDna&&<span style={{color:'#475569'}}> · PRO</span>}</button>
                      <div style={{fontSize:10,color:'#94a3b8',lineHeight:1.5,marginTop:4}}>
                        {onImportDna
                          ?'Keeps the handling: loads it into the DNA editor (toolbar DNA) as targets and leaves this car alone — APPLY it to this car or another.'
                          :'Keeps the handling: turns the tune into a Vehicle DNA, a PRO tool.'}
                      </div>
                    </div>
                  </div>
                </>}
              </Card>
            </div>);
          })()}
          {/* MEASURE is two procedures in a fixed order — natural balance first, because the ARB
              scale is solved against it — so it reads as two numbered steps in one column rather
              than the three side-by-side cards it used to be. Those put a HOW TO USE card beside
              the thing it described, split one procedure's instructions across two places, and gave
              no sense of which came first or how far through you were. The card titles are
              unchanged below the step number: the tutorials and docs name them. */}
          {ckMode==='probe'&&(()=>{
            const natDone=!!ch.useMeasuredNatBal;
            const natStale=natBalStale(ch);
            const arbDone=!!ch.useMeasuredArbClick;
            // MEASURED is selectable once there is something to select: a fresh pair of readings to
            // apply, or a scale already applied (so the toggle still reads as a pair when the modal
            // is reopened on a calibrated car and nothing has been typed yet).
            const arbCanMeasure=arbScaleNew!=null||arbDone;
            return(
            <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:10}}>
              <CkIntro>
                Two in-game readings per car that replace the app's predictions with what Forza shows —
                take them in order, in one sitting. <TermLink id="measure-nat-bal"/>
              </CkIntro>

              <Card title="STEP 1 · NAT BAL SETUP" accent
                headerRight={<CkChip on={natDone} warn={natStale}>
                  {natStale?'RE-MEASURE '+(ch.measuredNatBal??0).toFixed(2)
                    :natDone?'SET '+(ch.measuredNatBal??0).toFixed(2):'NOT SET'}</CkChip>}>
                <div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6}}>
                  What this car's Mech Balance reads on the springs below with both bars at 1; it
                  replaces the app's prediction.
                </div>
                <CkPhase>SPRINGS TO SOLVE FOR</CkPhase>
                <Field noSlider label="Measure Hz" value={probeHz} onChange={setProbeHz} min={1.0} max={3.5} step={0.01} unit="Hz"
                  hint="The ride frequency the springs below are solved for. Softer is more accurate: use the lowest Hz whose spring rates the game accepts on this car." hintTerm="measure-nat-bal"/>
                <div style={{fontSize:10,color:'#475569',lineHeight:1.5}}>
                  Corner mass {probeMasses.front.toFixed(0)} kg front, {probeMasses.rear.toFixed(0)} kg rear.
                </div>
                <CkPhase>SET THESE FOUR IN FORZA</CkPhase>
                <Stat label="Spring front" value={probeRateF*su.f} unit={su.label} decimals={Math.max(1,su.dp)}/>
                <Stat label="Spring rear"  value={probeRateR*su.f} unit={su.label} decimals={Math.max(1,su.dp)}/>
                <Stat label="ARB front" value={1} unit=""/>
                <Stat label="ARB rear"  value={1} unit=""/>
                <CkPhase>THEN TYPE THE MECH BALANCE IT SHOWS</CkPhase>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}}>
                  <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>MEAS. NAT BAL</span>
                  <span style={{display:'flex',alignItems:'center',gap:6}}>
                    {!natDone&&<span style={{fontSize:10,color:'#475569',letterSpacing:1}}>NOT SET</span>}
                    <NumBox value={ch.measuredNatBal??0.50} min={0.30} max={0.90} dp={2} label="Measured natural balance"
                      onCommit={v=>setCh(p=>({...p,useMeasuredNatBal:true,measuredNatBal:v,measuredNatBalHz:probeHz,
                        measuredNatBalRef:natBalRefOf(p)}))}/>
                  </span>
                </div>
                <input type="range" className="sli" min={0.30} max={0.90} step={0.01}
                  value={ch.measuredNatBal??0.50}
                  onChange={e=>setCh(p=>({...p,useMeasuredNatBal:true,measuredNatBal:parseFloat(e.target.value),measuredNatBalHz:probeHz,
                    measuredNatBalRef:natBalRefOf(p)}))}
                  style={{width:'100%'}}/>
                {natStale&&<CkWarn>
                  The chassis has changed since this reading: the app predicted {ch.measuredNatBalRef.toFixed(2)} then
                  and {natBalRefOf(ch).toFixed(2)} now. It is still in use — retake it on the car as it stands, or CLEAR it.
                  {arbDone&&' The ARB scale below rests on it too.'}
                </CkWarn>}
                {natDone&&<div style={{fontSize:10,color:'#475569',letterSpacing:1,marginTop:6,
                                       display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <span>SAVED AT {(ch.measuredNatBalHz??NAT_BAL_REF_HZ).toFixed(2)} HZ</span>
                  <button className="tbtn" style={{fontSize:10,padding:'2px 6px',color:'#6b7280'}}
                    title="Clear this reading and go back to the app's prediction."
                    onClick={()=>setCh(p=>({...p,useMeasuredNatBal:false,measuredNatBal:null,measuredNatBalHz:null,measuredNatBalRef:null}))}>CLEAR</button>
                </div>}
              </Card>

              <Card title="STEP 2 · ARB SCALE SETUP" accent
                headerRight={!lim?.arb?<CkChip>N/A</CkChip>
                  :<CkChip on={arbDone} warn={arbScaleStale(ch)}>
                    {arbScaleStale(ch)?'RE-MEASURE '+Math.round(arbScaleOf(ch))
                      :arbDone?'SET '+Math.round(arbScaleOf(ch)):'DEFAULT '+ARB_RS_SCALE}</CkChip>}>
                {!lim?.arb?<div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6}}>Forza only — BeamNG's anti-roll values are already in physical units.</div>
                :!natDone?<div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6}}>Locked until step 1 is set — this reading is solved against it, on the same springs.
                  {/* A scale measured against a NAT BAL that has since been cleared is still being
                      applied, and this branch used to offer only the word RE-MEASURE — which needs
                      step 1 back. Dropping to the default was unreachable from anywhere, so the
                      stale scale stayed in force. DEFAULT is the escape hatch, so it lives here too. */}
                  {arbScaleStale(ch)&&<>
                    <CkWarn>A measured scale ({Math.round(arbScaleOf(ch))}) is still in use but its NAT BAL was cleared.
                      Set step 1 again to re-measure, or drop to the default.</CkWarn>
                    <button className="tog on" style={{fontSize:10,marginTop:6}}
                      title={'Use the default click scale ('+ARB_RS_SCALE+'), the same for every car.'}
                      onClick={()=>setCh(p=>({...p,useMeasuredArbClick:false,measuredArbClick:null,measuredArbNat:null,measuredArbNatHz:null}))}>
                      USE DEFAULT {ARB_RS_SCALE}</button>
                  </>}</div>
                :<>
                  <div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6}}>
                    Finds what one anti-roll bar click is worth on this car — Forza scales that slider
                    differently on every car. <TermLink id="measure-arb-scale"/>
                  </div>
                  <CkNote>Keep step 1's springs, ride height and tyres unchanged through both readings.</CkNote>
                  {arbHzMismatch&&<CkWarn>
                    Measure Hz is {probeHz.toFixed(2)}, but step 1 was read at {arbSolveHz.toFixed(2)}, so these
                    readings solve on step 1's springs, not the rates above. Retake step 1 to measure at {probeHz.toFixed(2)}.</CkWarn>}
                  {/* Each reading's own solved scale is shown, not just their average, because
                      averaging hid the one thing worth seeing: whether the two agree. The average of
                      a good reading and a mistyped one is bad and nothing said so. The gap itself is
                      not evidence of a mistake — rounding and front/rear asymmetry account for a lot
                      of it, see ARB_SCALE_SPREAD_WARN — so the wording below suggests, not accuses. */}
                  {[['A',1,arbProbeHi,arbReadA,setArbReadA,arbScaleA],['B',arbProbeHi,1,arbReadB,setArbReadB,arbScaleB]]
                    .map(([k,f,r,val,set,sc],i)=>(
                    <React.Fragment key={k}>
                      <CkPhase>READING {i+1} — SET FRONT {f} · REAR {r}</CkPhase>
                      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                        <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>MECH BALANCE SHOWN</span>
                        <span style={{display:'flex',alignItems:'center',gap:6}}>
                          {val==null&&<span style={{fontSize:10,color:'#475569',letterSpacing:1}}>NOT SET</span>}
                          {val!=null&&sc==null&&<span style={{fontSize:10,color:'#f59e0b',letterSpacing:1}}>CHECK</span>}
                          {sc!=null&&<span style={{fontFamily:'var(--font-mono)',fontSize:10,
                                                   color:arbScaleSpread!=null&&arbScaleSpread>ARB_SCALE_SPREAD_WARN?'#f59e0b':'#60a5fa'}}>
                            → {Math.round(sc)}</span>}
                          {/* Starts at 0.50 with a NOT SET marker, exactly as step 1's box does — the two
                              readings are the same kind of entry and shouldn't open differently. An empty
                              box (value NaN, placeholder "0.00") read as a reading of zero rather than as
                              somewhere to type. NumBox only calls onCommit when the draft differs from
                              what it opened with, so tabbing through a NOT SET box leaves it unset rather
                              than committing a fictitious 0.50. */}
                          <NumBox value={val??0.50} min={0.05} max={0.95} dp={2} label={'Mech balance with ARB '+f+' / '+r} onCommit={set}/>
                        </span>
                      </div>
                    </React.Fragment>))}
                  {((arbReadA!=null&&arbScaleA==null)||(arbReadB!=null&&arbScaleB==null))&&
                    <CkWarn>That reading doesn't fit any plausible bar stiffness. Check the bars, springs and MEAS. NAT BAL match this card.</CkWarn>}
                  {arbScaleSpread!=null&&arbScaleSpread>ARB_SCALE_SPREAD_WARN&&
                    <CkWarn>The two readings disagree by {Math.round(100*arbScaleSpread)}% ({Math.round(arbScaleA)} vs {Math.round(arbScaleB)}).
                      Check the springs didn't move, MEAS. NAT BAL was taken on these springs, and both are typed
                      as Forza showed them — if so, the average is still the best estimate.</CkWarn>}
                  <CkPhase>RESULT</CkPhase>
                  {arbScaleNew!=null
                    ?<Stat label="Click scale from these readings" value={arbScaleNew} unit="" decimals={0}/>
                    :<div style={{fontSize:10,color:'#475569',lineHeight:1.5}}>
                      Both readings are needed before a scale can be measured.</div>}
                  {/* Which scale the car actually uses is a mode, so it is a toggle, the way every
                      other either/or in the app is. It replaces an APPLY/RESET pair that named the
                      actions but never the state: nothing said which scale was in force, RESET read
                      as "clear my work" rather than "use the default", and APPLY looked available
                      when there was nothing to apply. DEFAULT nulls the stored reading because
                      sanitizeTune holds the invariant that the flag being off means those fields are
                      null — the typed readings stay in this modal, so flipping back is one tap while
                      it is open. */}
                  <CkPhase>SCALE IN USE</CkPhase>
                  <div style={{display:'flex',gap:3}}>
                    <button className={'tog'+(arbDone?'':' on')} style={{fontSize:10}}
                      title={'Use the default click scale ('+ARB_RS_SCALE+'), the same for every car.'}
                      onClick={()=>setCh(p=>({...p,useMeasuredArbClick:false,measuredArbClick:null,measuredArbNat:null,measuredArbNatHz:null}))}>
                      DEFAULT {ARB_RS_SCALE}</button>
                    <button className={'tog'+(arbDone?' on':'')} style={{fontSize:10,opacity:arbCanMeasure?1:0.35}} disabled={!arbCanMeasure}
                      title={arbCanMeasure?"Use the scale measured from these readings. Saved with the chassis and shared in its build code."
                        :'Type both readings above first.'}
                      onClick={()=>{if(arbScaleNew!=null)setCh(p=>({...p,useMeasuredArbClick:true,measuredArbClick:Math.round(arbScaleNew),
                        measuredArbNat:p.measuredNatBal,measuredArbNatHz:p.measuredNatBalHz??NAT_BAL_REF_HZ}));}}>
                      MEASURED {arbDone||arbScaleNew!=null?Math.round(arbScaleNew??arbScaleOf(ch)):'—'}</button>
                  </div>
                  {/* Both sides rounded: MEASURED stores Math.round, but id 74 decodes a raw number,
                      so a fractional scale from an old or hand-made code would otherwise never compare
                      equal and this would nag forever on a car that is already exactly where it wants. */}
                  {arbDone&&arbScaleNew!=null&&Math.round(arbScaleNew)!==Math.round(arbScaleOf(ch))&&
                    <div style={{fontSize:10,color:'#60a5fa',lineHeight:1.5,marginTop:6}}>
                      The readings above now give {Math.round(arbScaleNew)}, and {Math.round(arbScaleOf(ch))} is in use —
                      tap MEASURED again to move to it.</div>}
                  {arbScaleStale(ch)&&<CkWarn>
                    MEAS. NAT BAL has changed since this scale was measured ({ch.measuredArbNat.toFixed(2)} at {(ch.measuredArbNatHz??NAT_BAL_REF_HZ).toFixed(2)} Hz).
                    It's still in use; take both readings again and tap MEASURED.</CkWarn>}
                </>}
              </Card>
            </div>);
          })()}
        </div>
      </div>
    </div>
  );
};

// Glossary tier tags. Nothing else in the app colours the tiers (the header BEG/INT/PRO
// buttons are plain .tbtn), so the badge and filter-chip colours live here. TIER_LABEL is
// the module-level one next to TIER_ENC; both are read at render time only.
const TIER_RANK={beginner:0,intermediate:1,pro:2};
const TIER_COLOR={beginner:'#4ade80',intermediate:'#38bdf8',pro:'#fbbf24'};
const TierBadge=({tier})=>(
  <span data-tier-badge={tier}
    style={{display:'inline-block',fontSize:9,letterSpacing:1,lineHeight:'13px',padding:'0 4px',
            color:TIER_COLOR[tier],border:'1px solid '+TIER_COLOR[tier],borderRadius:2,
            fontWeight:400,verticalAlign:'middle',whiteSpace:'nowrap'}}>{TIER_LABEL[tier]}</span>
);
// A def is paragraphs split on a blank line; one that opens "[INT] " or "[PRO] " only
// applies from that tier up. The label becomes a badge; the brackets are never shown.
const glossParas=def=>def.split('\n\n').map((text,i)=>{
  const m=/^\[(INT|PRO)\] /.exec(text);
  return m?{i,tier:m[1]==='INT'?'intermediate':'pro',text:text.slice(m[0].length)}:{i,tier:null,text};
});

// focus: a GLOSSARY id to scroll to and flash on open (App re-keys the modal per focus).
// uiMode only marks the viewer's own tier chip; the filter always starts at ALL.
const GlossaryModal=({onClose,focus=null,uiMode='beginner'})=>{
  const[q,setQ]=useState('');
  const[filter,setFilter]=useState('all');      // 'all' | a tier: entries and paragraphs at or below it
  const[pending,setPending]=useState(null);     // {id,n}: a jump waiting for the next commit
  const[flash,setFlash]=useState(null);         // {id,n}: the entry highlighted after a jump
  const scrollRef=useRef(null);
  const closeRef=useRef(onClose);
  closeRef.current=onClose;
  const entries=useMemo(()=>GLOSSARY.map(g=>({group:g.group,
    terms:g.terms.map(t=>({t,paras:glossParas(t.def)}))})),[]);
  const query=q.trim().toLowerCase();
  const rankOf=f=>f==='all'?2:TIER_RANK[f];
  const tierOk=(t,f)=>TIER_RANK[t.tier]<=rankOf(f);
  const visParas=(paras,f)=>paras.filter(p=>!p.tier||TIER_RANK[p.tier]<=rankOf(f));
  const matches=(e,f,qq)=>!qq||e.t.term.toLowerCase().includes(qq)
    ||(e.t.short||'').toLowerCase().includes(qq)
    ||visParas(e.paras,f).some(p=>p.text.toLowerCase().includes(qq));
  const filtered=entries.map(g=>({group:g.group,
    terms:g.terms.filter(e=>tierOk(e.t,filter)&&matches(e,filter,query))})).filter(g=>g.terms.length);
  const jump=id=>{
    const t=GLOSSARY_BY_ID[id];
    if(!t)return;
    const f=tierOk(t,filter)?filter:'all';
    if(f!==filter)setFilter(f);
    const e=entries.flatMap(g=>g.terms).find(x=>x.t.id===id);
    if(query&&e&&!matches(e,f,query))setQ('');
    setPending({id,n:Date.now()});
  };
  // Scroll by offsetTop inside the scroller (position:relative), never scrollIntoView,
  // which can drag the page behind the modal on mobile.
  useEffect(()=>{
    if(!pending)return;
    const sc=scrollRef.current;
    const el=sc&&sc.querySelector(`[data-glossary-entry="${pending.id}"]`);
    if(el){
      sc.scrollTop=Math.max(0,el.offsetTop-28);
      try{el.focus({preventScroll:true});}catch(err){}
    }
    setFlash(pending);
    setPending(null);
  },[pending]);
  useEffect(()=>{
    if(!flash)return;
    const tm=setTimeout(()=>setFlash(null),2500);
    return()=>clearTimeout(tm);
  },[flash]);
  useEffect(()=>{if(focus&&GLOSSARY_BY_ID[focus])jump(focus);},[]); // eslint-disable-line
  // Capture phase on document: the glossary sits above every other modal and tooltip, so
  // Escape closes it alone and never reaches a Hint or anything underneath.
  useEffect(()=>{
    const onKey=e=>{
      if(e.key!=='Escape'||e.isComposing)return;
      e.stopPropagation();
      closeRef.current();
    };
    document.addEventListener('keydown',onKey,true);
    return()=>document.removeEventListener('keydown',onKey,true);
  },[]);
  const chipCol=k=>k==='all'?'#e2e8f0':TIER_COLOR[k];
  return(
    <div style={{position:'fixed',inset:0,background:'#000c',zIndex:1100,
                 display:'flex',alignItems:'center',justifyContent:'center'}}
         onClick={onClose}>
      <div style={{background:'#020617',border:'1px solid #1e293b',borderRadius:2,
                   width:560,maxWidth:'calc(100vw - 20px)',maxHeight:'88vh',
                   display:'flex',flexDirection:'column'}}
           onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                     padding:'8px 14px',borderBottom:'1px solid #1e293b',flexShrink:0}}>
          <span style={{fontSize:12,color:'#9ca3af',letterSpacing:2}}>GLOSSARY</span>
          <button onClick={onClose} style={{background:'none',border:'none',color:'#94a3b8',
                   fontSize:16,cursor:'pointer',lineHeight:1,padding:2}}>✕</button>
        </div>
        <div role="group" aria-label="Filter by tier"
             style={{display:'flex',flexWrap:'wrap',gap:4,padding:'8px 14px 0',flexShrink:0}}>
          {['all','beginner','intermediate','pro'].map(k=>{
            const on=filter===k,mine=k===uiMode,col=chipCol(k);
            return(
              <button key={k} type="button" data-glossary-filter={k} aria-pressed={on}
                aria-label={mine?`${TIER_LABEL[k]}, your tier`:undefined}
                onClick={()=>setFilter(k)}
                style={{background:on?'#0f172a':'none',border:'1px solid '+(on?col:'#1e293b'),
                        borderRadius:2,color:on?col:'#94a3b8',fontFamily:'var(--font-mono)',
                        fontSize:10,letterSpacing:1,padding:'3px 9px',cursor:'pointer',lineHeight:1.4}}>
                {k==='all'?'ALL':TIER_LABEL[k]}
                {mine&&<span title="Your tier" style={{color:col,marginLeft:4}}>•</span>}
              </button>
            );
          })}
        </div>
        <div style={{padding:'8px 14px 10px',borderBottom:'1px solid #1e293b',flexShrink:0}}>
          <input type="text" value={q} onChange={e=>setQ(e.target.value)}
            placeholder="Search terms — e.g. zeta, ARB, camber…" autoFocus={!focus}
            style={{width:'100%',boxSizing:'border-box',background:'#0a0f1a',
                    border:'1px solid #1e293b',borderRadius:2,color:'#e2e8f0',
                    fontFamily:'var(--font-mono)',fontSize:13,padding:'7px 9px',outline:'none'}}/>
        </div>
        <div ref={scrollRef}
             style={{overflow:'auto',padding:'10px 14px 16px',flex:1,minHeight:0,overscrollBehavior:'contain',
                     position:'relative'}}>
          {filtered.length===0&&
            <div style={{fontSize:12,color:'#475569',textAlign:'center',padding:'20px 0'}}>
              {filter==='all'
                ?<>No terms match "{q}".</>
                :<>No {TIER_LABEL[filter]}-and-below terms match "{q}". Try ALL.</>}
            </div>}
          {filtered.map(g=>(
            <div key={g.group} style={{marginBottom:14}}>
              <div style={{fontSize:10,color:'#64748b',letterSpacing:2,marginBottom:6}}>
                {g.group.toUpperCase()}
              </div>
              {g.terms.map(({t,paras})=>{
                const lit=flash&&flash.id===t.id;
                return(
                  <div key={t.id} id={'gl-'+t.id} data-glossary-entry={t.id} tabIndex={-1}
                       style={{marginBottom:10,paddingLeft:8,outline:'none',
                               borderLeft:'2px solid '+(lit?'#818cf8':'transparent'),
                               background:lit?'#818cf811':'transparent',
                               transition:'background .4s,border-color .4s'}}>
                    <div style={{display:'flex',alignItems:'center',flexWrap:'wrap',gap:8,marginBottom:2}}>
                      <span style={{fontSize:13,fontWeight:700,color:'#e2e8f0',
                                    fontFamily:'var(--font-mono)'}}>{t.term}</span>
                      <TierBadge tier={t.tier}/>
                    </div>
                    {visParas(paras,filter).map((p,j)=>(
                      <div key={p.i} style={{fontSize:12,color:'#94a3b8',lineHeight:1.5,whiteSpace:'pre-line',
                                             marginTop:j?6:0}}>
                        {p.tier&&<><TierBadge tier={p.tier}/>{' '}</>}{p.text}
                      </div>
                    ))}
                    {t.see&&t.see.length>0&&
                      <div style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap:'4px 6px',marginTop:6}}>
                        <span style={{fontSize:9,color:'#64748b',letterSpacing:1}}>SEE</span>
                        {t.see.map(s=>(
                          <button key={s} type="button" data-glossary-see={s} onClick={()=>jump(s)}
                            style={{background:'none',border:'1px solid #312e81',borderRadius:2,color:'#818cf8',
                                    fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:1,
                                    padding:'1px 6px',cursor:'pointer'}}>{glossaryLabel(s)}</button>
                        ))}
                      </div>}
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// Appending 'beamng':2 needs no codec version bump: encodeTune omits fields still at
// their default (so horizon codes never carry id 10 at all), decodeTune ignores ids it
// doesn't know, and sanitizeTune's GAME_MODE_DEC.includes() check drops an out-of-range
// value back to horizon. An older client fed a beamng code degrades to horizon instead
// of throwing. Values are permanent — never renumber.
const GAME_MODE_ENC={'horizon':0,'motorsport':1,'beamng':2};
const GAME_MODE_DEC=['horizon','motorsport','beamng'];
const DAMPING_MODE_ENC={'ratio':0,'independent':1};
const DAMPING_MODE_DEC=['ratio','independent'];
const REAR_HZ_MODE_ENC={'flatRide':0,'independent':1,'multiplier':2,'mech':3,'shared':4};
const REAR_HZ_MODE_DEC=['flatRide','independent','multiplier','mech','shared'];
const ARB_MODE_ENC={'auto':0,'roll':1,'share':2,'man':4,'basic':5};
const ARB_MODE_DEC=['auto','roll','share','auto','man','basic']; // index 3 was legacy 'balance' → auto; index 4 = MAN (moved from ARB_BAL_MODE — see sanitizeTune migration)
const ARB_BAL_MODE_ENC={'weight':0,'mech':1,'coSolve':2,'man':3,'neutral':4,'chassis':5,'manual':6};
const ARB_BAL_MODE_DEC=['weight','mech','coSolve','man','neutral','chassis','manual']; // 'man' kept for old-code decode only — see sanitizeTune migration
// 'manual': invisible placeholder used when Stiffness Mode is MAN — behaves identically to
// 'weight' everywhere (see feelToPhysics/computeTune) but never lights up a Balance Mode
// button, so switching Stiffness Mode away from MAN doesn't look like the user chose WEIGHT.
const RIDE_REF_ENC={'front':0,'rear':1,'shared':2};
const RIDE_REF_DEC=['front','rear','shared'];
const DAMP_BAL_MODE_ENC={'standard':0,'sync':1,'neutral':2,'hybrid':3};
const DAMP_BAL_MODE_DEC=['standard','sync','neutral','hybrid']; // UI: sync = TIME SYNC, neutral = EQUAL FORCE, hybrid = HYBRID — four peer modes; indices are permanent
// Settle Sync (boolean settleMode + its own settleBias field) → dampBalMode + the unified
// dampingBias. Shared by every path that can hand the app a raw, possibly-legacy fe object:
// sanitizeTune (LOAD CODE), the one-time persisted-state migration effect, and garageLoadBuild
// (a GARAGE entry saved before this feature existed carries the legacy fields verbatim, same
// as a legacy localStorage blob — a plain `{...DEF_FE,...e.fe}` merge doesn't migrate them).
// IMPORTANT: `fe.dampBalMode` being present/valid is NOT a reliable "already migrated" signal
// on its own — decodeTune pre-fills every CODEC_FIELD (including id 62, dampBalMode) with its
// default before overlaying whatever ids the code actually carries, and mergeDefaults spreads
// DEF_FE the same way for persisted state. So a legacy fe object that still carries settleMode
// ALSO arrives here with dampBalMode already sitting at 'standard' (inherited, not chosen) — a
// naive `DAMP_BAL_MODE_DEC.includes(fe.dampBalMode)` check would treat that as "already
// migrated" and silently ignore the real settleMode/settleBias values (this shipped broken
// once already — see the git history for the fix). settleMode is only ever present on a
// pre-migration object (nothing in this app writes it anymore), so its mere presence — not
// dampBalMode's — is the only reliable "this needs migrating" signal.
const migrateDampBalMode=fe=>{
  const clBias=v=>Math.max(-50,Math.min(50,(typeof v==='number'&&isFinite(v))?v:DEF_FE.dampingBias));
  if(fe?.settleMode!=null){
    const legacyActive=!!fe.settleMode&&fe.settleBias!=null;
    return{
      dampBalMode:fe.settleMode?'sync':'standard',
      dampingBias:clBias(legacyActive?-fe.settleBias:fe?.dampingBias),
    };
  }
  return{
    dampBalMode:DAMP_BAL_MODE_DEC.includes(fe?.dampBalMode)?fe.dampBalMode:'standard',
    dampingBias:clBias(fe?.dampingBias),
  };
};
const LAYOUT_ENC={'FWD':0,'RWD':1,'AWD':2};
const LAYOUT_DEC=['FWD','RWD','AWD'];
const BUILD_ENC={'street':0,'track':1,'drift':2,'rally':3,'offroad':4,'drag':5};
const BUILD_DEC=['street','track','drift','rally','offroad','drag'];

// ── Share codec ──────────────────────────────────────────────────────────
// Single source of truth: each live field is one entry below (stable id,
// never reassigned once shipped — retire dead ids by deleting the entry,
// never reuse the number). encodeTune/decodeTune are generic loops over
// this table, so adding a field later never touches existing codes or
// requires a length guard — codes are sparse "id:value" pairs, defaults
// are omitted, and unknown ids are ignored on decode (forward-compatible).
const CODEC_VERSION=1;
// ── complexity tier, as saved metadata ──
// uiMode lives in its own localStorage key, not in ch/fe/dr — it's a property of the
// SESSION, not the tune. But which tier a tune was authored in tells you how much of it
// was hand-set versus left to the simpler tiers' automatic modes, so garage entries and
// share codes record it. It is shown and never applied: switching tier runs the BEG/INT
// fallback effects, which rewrite arbBalMode and rearHzMode (see docs/HISTORY.md), and
// canAccessMode can lock a tier outright — so loading a PRO tune must not drag a BEG user
// into PRO, nor silently rewrite the tune it just loaded. See docs/CODEC.md id 77.
const TIER_ENC={beginner:0,intermediate:1,pro:2};
const TIER_DEC=['beginner','intermediate','pro'];
const TIER_LABEL={beginner:'BEG',intermediate:'INT',pro:'PRO'};
const tierOf=v=>TIER_DEC.includes(v)?v:null;
// meta is a codec group with no DEF_CH/DEF_FE/DEF_DR behind it. Its default is null, which
// TIER_ENC cannot encode, so encodeTune's "skip fields still at their default" test never
// fires for a real tier and every new code carries id 77 — including beginner, which would
// otherwise vanish as the 0 value. Codes written before id 77 existed simply lack it and
// decode back to null, which reads as "not recorded" rather than a guessed tier.
const DEF_META={tier:null};
const DEF_GROUPS={ch:DEF_CH,fe:DEF_FE,dr:DEF_DR,meta:DEF_META};
const CODEC_FIELDS=[
  {id:1, group:'ch',key:'weight'},
  {id:2, group:'ch',key:'frontBias'},
  {id:3, group:'ch',key:'wheelbase'},
  {id:4, group:'ch',key:'cgHeight'},
  {id:5, group:'ch',key:'trackF'},
  {id:6, group:'ch',key:'trackR'},
  {id:7, group:'fe',key:'rideStiffness'},
  {id:8, group:'fe',key:'arbBias'},
  {id:9, group:'fe',key:'targetSpeed'},
  {id:10,group:'fe',key:'gameMode',enc:GAME_MODE_ENC,dec:GAME_MODE_DEC},
  {id:11,group:'fe',key:'dampingMode',enc:DAMPING_MODE_ENC,dec:DAMPING_MODE_DEC},
  {id:12,group:'fe',key:'reboundZeta'},
  {id:13,group:'fe',key:'bumpRatio'},
  {id:14,group:'fe',key:'bumpZeta'},
  {id:15,group:'fe',key:'arbMode',enc:ARB_MODE_ENC,dec:ARB_MODE_DEC},
  {id:16,group:'fe',key:'arbTargetRollMan'},
  {id:17,group:'fe',key:'arbShareMan'},
  {id:57,group:'fe',key:'arbBasicMan'},
  {id:18,group:'ch',key:'layout',enc:LAYOUT_ENC,dec:LAYOUT_DEC},
  {id:19,group:'dr',key:'buildType',enc:BUILD_ENC,dec:BUILD_DEC},
  {id:20,group:'dr',key:'diffManual',bool:true},

  {id:33,group:'fe',key:'dampingBias'},

  {id:36,tyre:'F',part:'aspectRatio',def:35},
  {id:37,tyre:'F',part:'rimDiameter',def:18},
  {id:38,tyre:'R',part:'aspectRatio',def:35},

  {id:41,group:'fe',key:'arbBalMode',enc:ARB_BAL_MODE_ENC,dec:ARB_BAL_MODE_DEC},

  {id:43,group:'fe',key:'springShare'},

  {id:47,group:'fe',key:'arbManR'},
  // 48/49: retired — Settle Sync's boolean on/off + its own bias field, replaced by
  // dampBalMode (id 62) + the unified dampingBias (id 33). Kept for old-code decode only —
  // sanitizeTune migrates them into dampBalMode/dampingBias.
  {id:48,group:'fe',key:'settleBias'},
  {id:49,group:'fe',key:'settleMode',bool:true},
  {id:50,group:'fe',key:'settleTarget'},
  {id:51,group:'fe',key:'dampCharMode',enc:{zeta:0,settle:1},dec:['zeta','settle']},
  {id:52,group:'dr',key:'diffType',enc:DIFF_TYPE_ENC,dec:DIFF_TYPE_DEC},
  // 53: 0 was stored as 'manual' before RANGE and MANUAL existed; it always meant NATURAL (offset
  // from natural). The alias keeps a persisted 'manual' encoding as 0. MANUAL is 'abs' (3).
  {id:53,group:'fe',key:'arbBalTargetMode',enc:{natural:0,manual:0,grip:1,range:2,abs:3},dec:['natural','grip','range','abs']},
  {id:54,group:'fe',key:'arbBalDelta'},
  {id:79,group:'fe',key:'arbBalAbs'},
  {id:55,group:'fe',key:'springShareAuto',bool:true},
  {id:56,group:'fe',key:'arbSplitOpposite',bool:true},
  // 58/59: motion ratios. group:'ch' because they describe the car's suspension geometry,
  // so they travel with a chassis entry rather than a tune — same reasoning as id 18.
  // (57 is arbBasicMan, declared above out of numeric order.)
  {id:58,group:'ch',key:'motionRatioF'},
  {id:59,group:'ch',key:'motionRatioR'},
  {id:68,group:'ch',key:'arbMotionRatioF'},
  {id:69,group:'ch',key:'arbMotionRatioR'},

  // same reasoning as motionRatioF/R. Unlike useRideHeightCG (whose resulting cgHeight
  // already travels via id 4), arbBalTarget/arbBalDelta store DELTAS from natDisplayOf(ch) and
  // gripNeutralOf(ch,gameMode), both of which read it, so the baseline itself must travel too or a shared build
  // re-targets against the wrong (geometry-only) natural balance. See docs/CODEC.md.
  {id:60,group:'ch',key:'useMeasuredNatBal',bool:true},
  {id:61,group:'ch',key:'measuredNatBal'},
  {id:62,group:'fe',key:'dampBalMode',enc:DAMP_BAL_MODE_ENC,dec:DAMP_BAL_MODE_DEC},

  {id:63,group:'fe',key:'rideStiffMode',enc:{'hz':0,'bottomG':1},dec:['hz','bottomG']},
  {id:64,group:'fe',key:'rideBottomG'},
  // 65/66: rideHeightF/R. Previously excluded on the assumption they were pure calibration
  // inputs to cgHeight (id 4), which already travels — true for that one consumer, but ids
  // 63/64 (added later) re-solve rideStiffness from rideBottomG against ch.rideHeightF/R
  // directly, regardless of the CG toggle. Without these two ids that resolve ran against
  // whichever ride height happened to be local on the receiving device, silently landing a
  // different Hz than the sender tuned even though the g-target read the same. Same class of

  {id:65,group:'ch',key:'rideHeightF'},

  {id:72,group:'ch',key:'measuredNatBalHz'},

  {id:74,group:'ch',key:'measuredArbClick'},

  {id:75,group:'ch',key:'measuredArbNat'},
  {id:76,group:'ch',key:'measuredArbNatHz'},
  // 78: the model's own prediction at the moment MEAS. NAT BAL was read, so natBalStale can tell
  // a reading that still describes this chassis from one the chassis has moved out from under.
  {id:78,group:'ch',key:'measuredNatBalRef'},

  // not an input to any solve. Decoding surfaces it for display only; nothing applies it.
  {id:77,group:'meta',key:'tier',enc:TIER_ENC,dec:TIER_DEC},
