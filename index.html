                  return(
                    <div style={{marginTop:10,paddingTop:8,borderTop:'1px solid #0f172a'}}>
                      <div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6,padding:'6px 8px',marginBottom:8,
                                   background:'#020617',borderRadius:2,border:'1px solid #0f172a'}}>{tip}</div>
                      {segs.map(({label,deviation,hint,term})=>{
                        // bar: deviation scaled so ±0.25 (max spring deviation) = ±50%
                        const barPct=Math.min(50,Math.abs(deviation)/0.25*50);
                        const barStyle=deviation>=0?{left:'50%',width:`${barPct}%`}:{right:'50%',width:`${barPct}%`};
                        const c=deviation>0.02?'#f59e0b':deviation<-0.02?'#22c55e':'#cbd5e1';
                        const pctOfTotal=totalAbsDev>0.01?Math.round(Math.abs(deviation)/totalAbsDev*100):null;
                        const isDom=label===dom.label&&domBig;
                        return(
                          <div key={label} style={{display:'flex',alignItems:'center',gap:6,marginBottom:3,
                                   ...(isDom?{background:'#0a0f1a',
                                     borderLeft:'2px solid '+(deviation>0?'#f59e0b66':'#22c55e66'),
                                     borderRadius:2,padding:'3px 0 3px 4px',margin:'0 -2px 3px -4px'}:{})}}>
                            <div style={{width:80,display:'flex',alignItems:'center',gap:2,flexShrink:0}}>
                              <span style={{fontSize:10,color:isDom?'#cbd5e1':'#94a3b8',letterSpacing:1,
                                             whiteSpace:'nowrap',fontWeight:isDom?700:400}}>{label}</span>
                              <Hint text={hint} term={term}/>
                            </div>
                            <div style={{flex:1,position:'relative',height:8,background:'#0f172a',borderRadius:2}}>
                              <div style={{position:'absolute',left:'50%',top:0,bottom:0,width:1,background:'#1e293b'}}/>
                              {barPct>1&&<div style={{position:'absolute',top:1,bottom:1,borderRadius:1,
                                background:c+(isDom?'ee':'99'),...barStyle}}/>}
                            </div>
                            <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:c,width:34,
                                           textAlign:'right',flexShrink:0,fontWeight:isDom?700:400}}>
                              {deviation>=0?'+':''}{(deviation*100).toFixed(1)}
                            </span>
                            <span style={{fontSize:10,color:pctOfTotal>40?c:'#475569',width:28,textAlign:'right',flexShrink:0}}>
                              {pctOfTotal!=null?`${pctOfTotal}%`:''}
                            </span>
                          </div>
                        );
                      })}
                      <div style={{fontSize:10,color:'#475569',lineHeight:1.5,marginTop:4}}>
                        Higher Hz and lower damping shift toward reactive. <TermLink id="response-factors"/>
                      </div>
                    </div>
                  );
                })()}
                {uiMode==='pro'&&(()=>{
                  const xferF=2*cm.front*ch.cgHeight/ch.trackF;
                  const xferR=2*cm.rear*ch.cgHeight/ch.trackR;
                  const Row=({la,lv,ra,rv,dim,last})=>(
                    <div style={{display:'flex',alignItems:'center',gap:6,padding:'2px 8px',
                                 ...(last?{}:{borderBottom:'1px solid #0f172a'}),
                                 opacity:dim?0.55:1}}>
                      <span style={{fontSize:9,color:'#475569',letterSpacing:1,minWidth:54}}>{la}</span>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'#64748b'}}>{lv}</span>
                      <div style={{flex:1,height:1,background:'#0f172a'}}/>
                      <span style={{fontSize:9,color:'#475569',letterSpacing:1}}>{ra}</span>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'#64748b'}}>{rv}</span>
                    </div>
                  );
                  return(
                    <div style={{marginTop:10,paddingTop:8,borderTop:'1px solid #0f172a'}}>
                      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                        <span style={{fontSize:9,color:'#334155',letterSpacing:2}}>LOAD TRANSFER</span>
                        <Hint text="Loads at 1 g cornering. CORNER: static corner mass. XFER: axle load transfer per g. OUT / IN: outer and inner wheel loads." term="load-transfer"/>
                      </div>
                      <div style={{border:'1px solid #0f172a',borderRadius:2,overflow:'hidden'}}>
                        <Row la="F CORNER" lv={dispMass(cm.front)} ra="R CORNER" rv={dispMass(cm.rear)} dim/>
                        <Row la="XFER F" lv={`${dispMass(xferF)}/g`} ra="XFER R" rv={`${dispMass(xferR)}/g`}/>
                        <Row la="OUT F" lv={dispMass(cm.front+xferF)} ra="OUT R" rv={dispMass(cm.rear+xferR)}/>
                        <Row la="IN F" lv={dispMass(Math.max(0,cm.front-xferF))} ra="IN R" rv={dispMass(Math.max(0,cm.rear-xferR))} last/>
                      </div>
                    </div>
                  );
                })()}
                </div>
              </div>}
          </div>

        </div>{/* end output panel */}

        {/* GARAGE DRAWER — mirrors the left sidebar's overlay pattern with the axis
            flipped. Lives inside the flex body (not position:fixed) so the header and the
            pinned balance bar stay reachable while it's open. */}
        {garagePanelOpen&&isMobile&&
            <div onClick={()=>setGaragePanelOpen(false)}
                 style={{position:'absolute',inset:0,background:'#00000088',zIndex:150}}/>}
          <div id="zone-garage" style={{
            position:'absolute',top:0,right:0,bottom:0,zIndex:200,
            width:isMobile?'100%':Math.min(420,Math.max(320,Math.floor(windowWidth*0.26))),
            background:'#020617',borderLeft:'1px solid #0f172a',
            display:'flex',flexDirection:'column',
            transform:garagePanelOpen?'translateX(0)':'translateX(100%)',
            transition:'transform .2s ease',
            boxShadow:garagePanelOpen?'-4px 0 24px #000000cc':'none',
            // a translated-off element is still focusable — without this, Tab from the
            // output panel would land in the closed drawer's inputs
            visibility:garagePanelOpen?'visible':'hidden',
            ...dim('garage'),
          }}>
            <div style={{display:'flex',alignItems:'center',gap:6,padding:'9px 12px',
                         borderBottom:'1px solid #0f172a',flexShrink:0}}>
              <span style={{fontSize:11,letterSpacing:2,color:'#9ca3af'}}>GARAGE</span>
              <span style={{fontSize:10,color:'#475569'}}>{entries.length}</span>
              <span style={{flex:1}}/>
              <button onClick={()=>setGaragePanelOpen(false)}
                style={{background:'none',border:'none',color:'#94a3b8',cursor:'pointer',
                        fontSize:16,lineHeight:1,padding:0}}>✕</button>
            </div>
            {/* save row */}
            <div style={{padding:'8px 12px',borderBottom:'1px solid #0f172a',flexShrink:0}}>
              <input value={entryName} onChange={e=>setEntryName(e.target.value)}
                placeholder="Name this entry…"
                style={{width:'100%',background:'#0f172a',border:'1px solid #1e293b',borderRadius:2,
                        padding:'4px 7px',fontSize:11,color:'#e2e8f0',outline:'none',
                        fontFamily:'inherit',marginBottom:5}}/>
              <div style={{display:'flex',gap:4}}>
                {[['chassis','SAVE CHASSIS'],['build','SAVE BUILD'],['both','SAVE CAR']].map(([k,l])=>(
                  <button key={k} className="tbtn" style={{flex:1,fontSize:9}}
                    onClick={()=>garageSave(k)}>{l}</button>
                ))}
              </div>
            </div>
            {/* filter / sort / search */}
            <div style={{padding:'7px 12px',borderBottom:'1px solid #0f172a',flexShrink:0,
                         display:'flex',flexDirection:'column',gap:5}}>
              <div style={{display:'flex',gap:3}}>
                {[['all','ALL',garageEntries.length],['chassis','CHASSIS',kindCounts.chassis||0],
                  ['build','BUILDS',kindCounts.build||0],['car','CARS',kindCounts.car||0]].map(([k,l,n])=>(
                  <button key={k} className={`tbtn${garageUI.filter===k?' on':''}`}
                    style={{flex:1,fontSize:9,padding:'3px 2px'}}
                    onClick={()=>setGarageUI(u=>({...u,filter:k}))}>{l} {n}</button>
                ))}
              </div>
              <div style={{display:'flex',gap:4,alignItems:'center'}}>
                <div style={{position:'relative',flex:1}}>
                  <input value={garageSearch} onChange={e=>setGarageSearch(e.target.value)}
                    placeholder="Search name, notes, tags…"
                    style={{width:'100%',background:'#0f172a',border:'1px solid #1e293b',borderRadius:2,
                            padding:'3px 18px 3px 7px',fontSize:10,color:'#e2e8f0',outline:'none',
                            fontFamily:'inherit'}}/>
                  {garageSearch&&<span onClick={()=>setGarageSearch('')}
                    style={{position:'absolute',right:5,top:'50%',transform:'translateY(-50%)',
                            cursor:'pointer',color:'#64748b',fontSize:11,lineHeight:1}}>×</span>}
                </div>
                <select value={garageUI.sort} onChange={e=>setGarageUI(u=>({...u,sort:e.target.value}))}
                  style={{background:'#0f172a',border:'1px solid #1e293b',borderRadius:2,
                          padding:'3px 4px',fontSize:9,color:'#94a3b8',outline:'none',
                          fontFamily:'inherit',cursor:'pointer',flexShrink:0}}>
                  <option value="recent">RECENT</option>
                  <option value="oldest">OLDEST</option>
                  <option value="name">NAME A–Z</option>
                  <option value="kind">KIND</option>
                </select>
              </div>
            </div>
            <div style={{flex:1,minHeight:0,overflowY:'auto',overscrollBehavior:'contain',
                         WebkitOverflowScrolling:'touch',padding:'8px 12px'}}>
              {/* FACTORY — read-only, deliberately NOT entries. Keeping them out of the list
                  avoids a `readonly` flag branching through every rewrite/delete/notes/tags
                  affordance, keeps them out of counts/search/backups, and preserves
                  loadPreset's tier-specific overrides. One LOAD button and no chassis button,
                  which is what structurally enforces "a preset never touches ch". */}
              <div style={{marginBottom:10}}>
                <div onClick={()=>setOpen(p=>({...p,factoryOpen:!p.factoryOpen}))}
                  style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',
                          marginBottom:5,userSelect:'none'}}>
                  <span style={{fontSize:9,letterSpacing:2,color:'#334155'}}>FACTORY</span>
                  <span style={{marginLeft:'auto',fontSize:9,color:'#475569'}}>{open.factoryOpen?'▲':'▼'}</span>
                </div>
                {open.factoryOpen&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4}}>
                  {[1,2,3,4,5,6].map(i=>{
                    const rec=(BUILD_PRESET_MAP[dr.buildType??'track']??[]).includes(i);
                    return(
                      <div key={i} style={{background:'#0f172a',borderRadius:2,padding:'5px 6px',
                        border:`1px solid ${rec?'#4f46e5':'#1e293b'}`,
                        display:'flex',flexDirection:'column',gap:2,minWidth:0}}>
                        <span style={{fontSize:10,color:'#cbd5e1',fontWeight:600,letterSpacing:.5}}>{PRESET_SAVES[i].name}</span>
                        <span style={{fontSize:8,color:'#475569',lineHeight:1.3}}>{PRESET_DESC[i].tag}</span>
                        <span style={{fontSize:8,color:'#334155',lineHeight:1.3}}>{PRESET_DESC[i].sub}</span>
                        {rec&&<span style={{fontSize:8,color:'#818cf8',letterSpacing:.5}}>★ FOR YOUR BUILD</span>}
                        <button onClick={()=>loadPreset(i)}
                          style={{marginTop:2,padding:'2px 0',fontSize:8,letterSpacing:1,
                                  background:rec?'#1e1b4b':'#1e293b',
                                  border:`1px solid ${rec?'#4338ca':'#334155'}`,borderRadius:1,
                                  color:rec?'#a5b4fc':'#64748b',cursor:'pointer',width:'100%'}}>LOAD</button>
                      </div>
                    );
                  })}
                </div>}
              </div>
              {/* three distinct empty states, each with an inline escape hatch — the failure
                  mode of a filter UI is a user who can't find their data and doesn't know why */}
              {garageList.length===0
                ?<div style={{fontSize:10,color:'#374151',textAlign:'center',padding:'20px 0',letterSpacing:1}}>
                   {garageEntries.length===0
                     ?<>NO SAVED ENTRIES<div style={{fontSize:9,marginTop:6,letterSpacing:0}}>
                        Name your setup above, then save it as a chassis, a build, or both. <TermLink id="garage"/></div></>
                     :garageSearch.trim()
                     ?<>NO MATCHES<div style={{marginTop:8}}>
                        <button className="tbtn" style={{fontSize:9}}
                          onClick={()=>setGarageSearch('')}>CLEAR SEARCH</button></div></>
                     :<>NO {garageUI.filter.toUpperCase()} ENTRIES<div style={{marginTop:8}}>
                        <button className="tbtn" style={{fontSize:9}}
                          onClick={()=>setGarageUI(u=>({...u,filter:'all'}))}>SHOW ALL</button></div></>}
                 </div>
                :garageList.map(e=>(
                   <EntryCard key={e.id} entry={e} metricUnits={mMass} allTags={allTags}
                     onLoadChassis={garageLoadChassis} onLoadBuild={garageLoadBuild}
                     onRewrite={garageRewrite} onDelete={garageDelete} onRename={garageRename}
                     onNotes={garageNotes} onAddTag={garageAddTag} onRemoveTag={garageRemoveTag}/>
                 ))}
            </div>
          </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App/></ErrorBoundary>
);
</script>
<script>
(function(){
  var preload=document.getElementById('pre-load');
  function showError(msg,detail){
    if(preload){
      preload.style.display='block';
      preload.innerHTML='<div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">SUSP.OS \u2014 Failed to load</div>'
        +'<div style="color:#6b7280;margin-bottom:12px">'+msg+'</div>'
        +'<div style="background:#0f172a;padding:12px;border-radius:4px;color:#ef4444;word-break:break-all;line-height:1.6;font-size:11px">'+(detail||'')+'</div>'
        +'<button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#0f172a;border:1px solid #1e293b;color:#e2e8f0;border-radius:4px;cursor:pointer;font-family:var(--font-mono);font-size:12px">RELOAD</button>';
    }
  }
  try{
    if(typeof Babel==='undefined'){showError('Babel failed to load','Check your internet connection and reload.');return;}
    var src=document.getElementById('app-source').textContent;
    var compiled;
    try{
      compiled=Babel.transform(src,{
        presets:['env','react'],
        plugins:['transform-optional-chaining','transform-nullish-coalescing-operator','transform-logical-assignment-operators'],
        filename:'susp-os.jsx'
      }).code;
    }catch(e){
      showError('Babel compilation failed',e.message||String(e));
      return;
    }
    // Use indirect eval so errors are catchable on all browsers including iOS WebKit.
    // Direct script injection loses the error context on WebKit.
    try{
      (0,eval)(compiled);
    }catch(e){
      showError('Runtime error',e.message||String(e));
    }
  }catch(e){
    showError('Load failed',e.message||String(e));
  }
})();
</script>
</body>
</html>
