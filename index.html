            if(tune.coSolveLiftRisk)warnings.push(warnBox('lift','#f59e0b',<>
              Rear springs are significantly stiffer than front ({tune.rHz.toFixed(2)} vs {tune.fHz.toFixed(2)} Hz).
              Stiff rear springs reduce droop travel and can cause inside rear wheel lift under hard cornering.
              {(fe.springShareAuto!==false)?' Lower the mech balance target or switch to MECH mode to decouple spring Hz from balance.'
                :' Lower Spring Share or enable AUTO to let ARBs carry more of the balance correction.'}
            </>));
            if(tune.dampingClamped)warnings.push(warnBox('damp','#f59e0b',<>
              F/R balance preserved — damper values scaled proportionally to fit within 1–{lim.damping}.
              Reduce Rebound ζ or Bump Ratio to achieve target damping character.
            </>));

            // Per-axle suspension rows — same arbOut/springOut/dampOut/arbCtx/hzCtx/warnOver
            // functions the Forza cards above call, just assembled into row-prop objects
            // instead of inline OutRows, since SuspensionCard merges three subsystems into one.
            const buildArbRow=(side,v,rsAb,rsSp,track,arbMr)=>{
              const o=arbOut(v,lim,track,arbMr);
              const c=arbCtx(v,lim.arb);
              return {label:'Anti-Roll',value:o.value,decimals:o.decimals,warn:warnOver(v,lim.arb),unit:o.unit,
                note:c?c[0]:null,noteColor:c?c[1]:undefined,
                meta:[`${Math.round(rsAb/(rsSp+rsAb)*100)}% roll`,`${Math.round(rsAb/(tune.rsAbF+tune.rsAbR)*100)}% ARB`]};
            };
            const buildSpringRow=(side,spring,mr,hz,pct)=>{
              const o=springOut(spring,fe.gameMode,mSpring,mr);
              const c=hzCtx(hz);
              return {label:'Spring',value:o.value,unit:o.unit,decimals:o.decimals,
                note:c?c[0]:null,noteColor:c?c[1]:undefined,meta:[`${pct}% roll`,`${hz.toFixed(2)} Hz`]};
            };
            const zNote=(z,isReb)=>z>100?'⚠ OVERDAMPED':(isReb&&z<40?'⚠ UNDERDAMPED':null);
            const buildDampRow=(lbl,v,z,mr,settle,isReb)=>{
              const o=dampOut(v,lim,mr);
              return {label:lbl,value:o.value,decimals:o.decimals,warn:warnOver(v,lim.damping),unit:o.unit,note:zNote(z,isReb),
                meta:[settle!=null?`${settle.toFixed(2)}s settle`:null,`${z.toFixed(0)}% ζ`]};
            };

            const springPctF=Math.round(tune.rsSpF/(tune.rsSpF+tune.rsAbF)*100);
            const springPctR=Math.round(tune.rsSpR/(tune.rsSpR+tune.rsAbR)*100);
            const suspHint="Anti-Roll Spring Rate, Spring Rate, and Rebound/Bump Damping in N/m / N/m/s, matching BeamNG's sliders — divided by motion ratio squared if you set one. Spring badge shows frequency category (SOFT/ROAD/FIRM/RACE); damping notes flag over/underdamped. The settle figure beside each damper is the quick ζ-only estimate — it cannot see bump damping, so the DYNAMICS chart, which measures its drawn curve, may read differently. Anti-Roll reads soft — see the note under that row.";
            const arbCaveat=(ch.arbMotionRatioF??1)===1&&(ch.arbMotionRatioR??1)===1
              ?"Reads ~4–6× soft: at ARB Motion Ratio 1.0 this assumes the bar acts at the wheels, but BeamNG sets the rate at the bar's own lever. Set the ratio in CHASSIS (arm ÷ track, typically 0.4–0.5) if you know the geometry."
              :null;

            const frontSuspension=<SuspensionCard side="FRONT" hint={suspHint} arbCaveat={arbCaveat}
              arbRow={buildArbRow('front',tune.arbF,tune.rsAbF,tune.rsSpF,ch.trackF,ch.arbMotionRatioF)}
              springRow={buildSpringRow('front',tune.springF,ch.motionRatioF,tune.fHz,springPctF)}
              dampRebRow={buildDampRow('Rebound',tune.rebF,tune.zetaF,ch.motionRatioF,tune.settleF,true)}
              dampBumpRow={buildDampRow('Bump',tune.bumpF,tune.bumpZetaF,ch.motionRatioF,null,false)}/>;
            const rearSuspension=<SuspensionCard side="REAR" hint={suspHint} arbCaveat={arbCaveat}
              arbRow={buildArbRow('rear',tune.arbR,tune.rsAbR,tune.rsSpR,ch.trackR,ch.arbMotionRatioR)}
              springRow={buildSpringRow('rear',tune.springR,ch.motionRatioR,tune.rHz,springPctR)}
              dampRebRow={buildDampRow('Rebound',tune.rebR,tune.zetaR,ch.motionRatioR,tune.settleR,true)}
              dampBumpRow={buildDampRow('Bump',tune.bumpR,tune.bumpZetaR,ch.motionRatioR,null,false)}/>;

            // Alignment — same degree targets as Forza, but BeamNG's Camber/Caster/Toe Adjust
            // sliders are % of a per-vehicle Jbeam range, not degrees, and that % shifts if
            // Spring Height changes afterward (ride height affects the camber curve). Live
            // tuning-screen readout confirmed real-time as of BeamNG 0.39.
            const alignPrefix=(()=>{
              const _camberStr={street:'-1.0°',track:'-1.5°',drift:'-2.5°',rally:'-0.8°',offroad:'-0.3°',drag:'0.0°'}[dr.buildType??'track']??'-1.5°';
              const _prefix=alignMode==='manual'?'Manual values.':'Recommended starting point.';
              return ch.layout==='FWD'
                ?`${_prefix} Camber targets ${_camberStr} dynamic. FWD front camber reduced for traction. Toe-in front and rear for stability.`
                :ch.layout==='RWD'
                ?`${_prefix} Camber targets ${_camberStr} dynamic at ${tune.rollDeg.toFixed(1)}° roll. Front toe-out for turn-in, rear toe-in for stability.`
                :`${_prefix} Camber targets ${_camberStr} dynamic at ${tune.rollDeg.toFixed(1)}° roll. Front toe-out for turn-in, rear toe-in scaled to center bias.`;
            })();
            const beamngAlignHint=`${alignPrefix} BeamNG's Camber/Caster/Toe Adjust sliders are % of this vehicle's Jbeam-defined range, not degrees — there's no formula to convert this target angle into that %. Dial the slider while watching BeamNG's own live tuning-screen alignment readout until it matches the angle below. If you change Spring Height afterward, recheck against the readout — the %-to-angle relationship shifts with ride height.`;

            const frontAlign=<AlignCard side="FRONT" camber={align.recCamberF} toe={align.recToeF} caster={align.recCaster} hint={beamngAlignHint}/>;
            const rearAlign=<AlignCard side="REAR" camber={align.recCamberR} toe={align.recToeR} caster={null} hint={beamngAlignHint}/>;

            // Differential — same isSport/lock/diffCtx pattern as the Forza card, scoped per
            // axle since BeamNG groups Front/Rear/Center as separate menu sections. Placement
            // is axle-matched: FWD's single diff sits in the front column, RWD's in the rear.
            const lock=(label,v,unit='%')=>{
              if(isSport&&/Decel|Split/.test(label))return <OutRow key={label} label={label} value="N/A" unit=""/>;
              const c=diffCtx(v);
              return <OutRow key={label} label={label} value={v} unit={unit} decimals={0}
                note={c?c[0]:null} noteColor={c?c[1]:undefined}/>;
            };
            const frontDiff=(isAWD||isFWD)&&<DiffCard title="FRONT DIFFERENTIAL"
              rows={isAWD?[lock('Accel',diff.frontAccel),lock('Decel',diff.frontDecel)]:[lock('Accel',diff.accel),lock('Decel',diff.decel)]}/>;
            const rearDiff=(isAWD||isRWD)&&<DiffCard title="REAR DIFFERENTIAL"
              rows={isAWD?[lock('Accel',diff.rearAccel),lock('Decel',diff.rearDecel)]:[lock('Accel',diff.accel),lock('Decel',diff.decel)]}/>;

            // Center split — combines diff.center with its recommendation call-out, AWD only.
            // No RECOMMENDED-diff-type box here: that race/sport/rally/offroad/drift system is
            // a Forza concept and doesn't apply to BeamNG (Forza's DIFFERENTIAL card keeps it).
            const centerSplit=isAWD&&(()=>{
              const curCenter=dr.diffCenter??65;
              const centerMatch=curCenter===recommendedCenter;
              const buildLabel={track:'TRACK',street:'STREET',drift:'DRIFT',rally:'RALLY',offroad:'OFFROAD',drag:'DRAG'}[dr.buildType??'track']??'TRACK';
              const centerReasons={street:'mild rear bias — comfortable AWD character',track:'rear-weighted for rotation and exit drive',drift:'very rear-heavy — maximises rotation and wheelspin',rally:'more neutral — front traction on mixed surfaces',offroad:'slight front bias — stability on loose and uneven ground',drag:'rear-heavy for straight-line launch traction'};
              return (
                <Card title="CENTER SPLIT">
                  <RowGroup style={{marginBottom:uiMode==='beginner'?0:6}}>
                    {lock('Base Torque Split',diff.center,'% rear')}
                  </RowGroup>
                  {uiMode!=='beginner'&&<div style={{padding:'6px 8px',background:'#0f172a',borderRadius:2,border:'1px solid #1e293b'}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:centerMatch?0:4}}>
                      <span style={{fontSize:10,color:'#475569',letterSpacing:1}}>RECOMMENDED</span>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:11,fontWeight:700,
                        color:centerMatch?'#22c55e':'#f59e0b',marginLeft:'auto'}}>
                        {recommendedCenter}% REAR
                      </span>
                      {!centerMatch&&<button className="tbtn" style={{fontSize:9,color:'#60a5fa',padding:'2px 6px'}}
                        onClick={()=>setDr(p=>({...p,diffCenter:recommendedCenter}))}>
                        → USE {recommendedCenter}%
                      </button>}
                    </div>
                    <div style={{fontSize:10,color:centerMatch?'#334155':'#475569',lineHeight:1.5}}>
                      {buildLabel} build → {recommendedCenter}% rear: {centerReasons[dr.buildType??'track']}.
                      {uiMode==='pro'&&(_weightAdj!==0||_diamAdj!==0||_natAdj!==0)&&<div style={{fontSize:9,color:centerMatch?'#1e293b':'#334155',marginTop:2}}>
                        base {_baseCenter}%{_weightAdj!==0?` · weight ${_weightAdj>0?'+':''}${_weightAdj}%`:''}{_diamAdj!==0?` · tyres ${_diamAdj>0?'+':''}${_diamAdj}%`:''}{_natAdj!==0?` · balance ${_natAdj>0?'+':''}${_natAdj}%`:''}
                      </div>}
                    </div>
                  </div>}
                </Card>
              );
            })();

            const brakesCard=(()=>{
              const c=brakeBias>55?['FRONT','#3b82f6']:brakeBias<50?['REAR','#ef4444']:['NEUTRAL','#cbd5e1'];
              return (
                <Card title="BRAKES" hint="Brake balance starting point. Balance affects corner entry — higher front bias increases understeer tendency, lower increases rotation. The recommendation accounts for forward weight transfer under braking (CG height and wheelbase), which front-biases it for most builds. DRIFT and DRAG on a rear-weighted car can land below 50% — a rear bias is a real trail-braking and drift technique, not an error. Fine-tune in 1% steps by feel.">
                  <RowGroup style={{marginBottom:0}}>
                    <OutRow label="Balance" value={brakeBias} unit="% F" note={c[0]} noteColor={c[1]}/>
                  </RowGroup>
                </Card>
              );
            })();

            return (<>
              <div style={{display:'flex',flexWrap:'wrap',gap:12,alignItems:'center',
                           padding:'6px 8px',background:'#0f172a',border:'1px solid #1e293b',
                           borderRadius:2,marginBottom:10,fontSize:10,color:'#64748b',
                           fontFamily:'var(--font-mono)'}}>
                <span>ROLL {tune.rollDeg.toFixed(1)}°</span>
                <span>REAR ×{(tune.rHz/tune.fHz).toFixed(2)}</span>
                <span>F/R BIAS {(()=>{const tot=physics.zetaF+physics.zetaR;
                  return tot>0?Math.round(physics.zetaF/tot*100):50;})()}% F</span>
                <span>{(physics.dampingMode??'ratio')==='ratio'
                  ?`BUMP RATIO ${physics.bumpRatioVal??56}%`
                  :`BUMP ${Math.round(physics.bumpZeta??39)}% ζ`}</span>
                {warnings.length>0&&<div style={{flexBasis:'100%'}}>{warnings}</div>}
              </div>
              {/* Fixed 4-row × 2-column grid (Brakes/Center, Front/Rear Diff, Front/Rear
                  Suspension, Front/Rear Alignment). DOM order is row-major, so collapsing to
                  one column at narrow widths (auto-fit) reproduces the PDF's own top-to-bottom
                  order for free — no separate mobile branch needed. */}
              <div className="beamng-grid">
                {brakesCard}
                {centerSplit||<div/>}
                {frontDiff||<div/>}
                {rearDiff||<div/>}
                {frontSuspension}
                {rearSuspension}
                {frontAlign}
                {rearAlign}
              </div>
            </>);
          })()}

          </div>{/* end maxWidth wrapper */}
          </div>{/* end cards */}

          {/* DISCLAIMER + FEEDBACK */}
          <div style={{flexShrink:0,borderTop:'1px solid #0f172a',padding:'6px 12px'}}>
            <p style={{margin:0,fontSize:9,color:'#334155',lineHeight:1.5,textAlign:'center'}}>
              SUSP.OS is an independent tool not affiliated with, endorsed by, or associated with Microsoft Corporation or Turn 10 Studios. Forza Horizon and Forza Motorsport are registered trademarks of Microsoft Corporation.
            </p>
            <p style={{margin:'3px 0 0',fontSize:9,color:'#334155',lineHeight:1.5,textAlign:'center'}}>
              Found a bug or have an idea?<br/>
              <a href="https://github.com/SoloCandy/susp-os/issues/new/choose" target="_blank" rel="noopener noreferrer"
                 style={{color:'#475569'}}>Report an issue</a>
              {' · '}
              <a href="https://github.com/SoloCandy/susp-os/discussions" target="_blank" rel="noopener noreferrer"
                 style={{color:'#475569'}}>Start a discussion</a>
              {' · '}
              <a href="mailto:soloc4ndy@gmail.com" style={{color:'#475569'}}>Email</a>
              {' · '}
              <a href="https://ko-fi.com/solocandy" target="_blank" rel="noopener noreferrer"
                 style={{color:'#475569'}}>Tip jar</a>
            </p>
          </div>


          {/* DATA MODAL — share / import / export */}
          {showDataModal&&(()=>{
            const close=()=>setShowDataModal(false);
            const sharePayload=encodeTune(
              shareSel.ch?ch:DEF_CH,
              shareSel.fe?fe:DEF_FE,
              shareSel.dr?dr:DEF_DR
            );
            const doCopy=()=>copyToClipboard(sharePayload,()=>setShareCopied(true));
            const selectStyle={width:'100%',background:'#020617',border:'1px solid #1e293b',
              borderRadius:2,padding:'5px 8px',fontSize:11,color:'#e2e8f0',outline:'none',
              fontFamily:'var(--font-mono)',letterSpacing:1,marginBottom:14,cursor:'pointer',
              appearance:'none',WebkitAppearance:'none'};
            const chkRow=(key,label,sub,checked,onChange,disabled=false)=>(
              <label key={key} style={{display:'flex',alignItems:'center',gap:10,
                                       padding:'7px 0',borderBottom:'1px solid #1e293b',
                                       cursor:disabled?'default':'pointer',userSelect:'none',
                                       opacity:disabled?0.35:1}}>
                <input type="checkbox" checked={checked} disabled={disabled}
                  onChange={onChange}
                  style={{accentColor:'#94a3b8',width:14,height:14,cursor:disabled?'default':'pointer'}}/>
                <div>
                  <div style={{fontSize:11,color:'#e2e8f0',letterSpacing:1}}>{label}</div>
                  <div style={{fontSize:9,color:'#475569'}}>{sub}</div>
                </div>
              </label>
            );
            return(
            <div style={{position:'fixed',inset:0,zIndex:900,display:'flex',alignItems:'center',
                         justifyContent:'center',background:'#000a'}}
                 onClick={e=>{if(e.target===e.currentTarget)close();}}>
              <div style={{background:'#0f172a',border:'1px solid #334155',borderRadius:4,
                           padding:'20px 22px',width:280,fontFamily:'var(--font-mono)',
                           boxShadow:'0 8px 40px #000d',maxHeight:'88vh',display:'flex',flexDirection:'column'}}>
                <div style={{fontSize:11,letterSpacing:2,color:'#94a3b8',marginBottom:12,flexShrink:0}}>SHARE</div>
                {/* Title stays put; only this body scrolls. */}
                <div style={{flex:1,minHeight:0,overflowY:'auto',overscrollBehavior:'contain'}}>
                {/* mode selector */}
                <div style={{position:'relative',marginBottom:14}}>
                  <select value={dataMode} onChange={e=>{setDataMode(e.target.value);setShareCopied(false);setImportErr('');setRestoreData(null);setRestoreErr('');}}
                    style={selectStyle}>
                    <option value="share">COPY CODE — generate a tune code</option>
                    <option value="load">LOAD CODE — load from a tune code</option>
                    <option value="backup">BACKUP — download saved data</option>
                    <option value="restore">RESTORE — load from a backup file</option>
                  </select>
                  <span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',
                                color:'#475569',pointerEvents:'none',fontSize:10}}>▾</span>
                </div>
                {(()=>{
                  const hints={
                    share:'Generates a compact code for the current tune — chassis, springs, dampers, ARBs, and all feel settings. Share it with any SUSP.OS user. Does not include your garage entries.',
                    load:'Paste a code from another device or user. OVERWRITE replaces your current setup — TO GARAGE saves it as a new garage entry instead, without touching your current tune.',
                    backup:'Downloads a JSON file of your garage entries. Use this to move your collection to another device or keep a local copy. Does not include the current unsaved tune.',
                    restore:'Loads garage entries from a backup file — older backups from before the garage was unified are read too. Pick which kinds to restore; the kinds you leave unticked are kept as they are. Does not affect the current unsaved tune.',
                  };
                  return<div style={{fontSize:10,color:'#94a3b8',lineHeight:1.6,marginBottom:12,letterSpacing:0.3}}>{hints[dataMode]}</div>;
                })()}

                {/* SHARE */}
                {dataMode==='share'&&(<>
                  <div style={{fontSize:9,letterSpacing:2,color:'#475569',marginBottom:6}}>INCLUDE</div>
                  {[
                    {key:'ch',label:'CHASSIS',sub:'Weight · bias · tyres · geometry · layout'},
                    {key:'fe',label:'FEEL',sub:'Ride · damping · ARB · balance'},
                    {key:'dr',label:'DRIVETRAIN',sub:'Build type · diff'},
                  ].map(({key,label,sub})=>chkRow(key,label,sub,shareSel[key],
                    e=>{setShareSel(s=>({...s,[key]:e.target.checked}));setShareCopied(false);}))}
                  <textarea readOnly value={sharePayload} rows={3} onFocus={e=>e.target.select()}
                    style={{width:'100%',background:'#020617',border:'1px solid #1e293b',borderRadius:2,
                            padding:'6px 8px',fontSize:10,color:'#e2e8f0',outline:'none',resize:'none',
                            fontFamily:'var(--font-mono)',letterSpacing:0.5,marginTop:10,marginBottom:6,cursor:'text'}}/>
                  <div style={{fontSize:9,color:'#475569',marginBottom:12,letterSpacing:0.5}}>
                    Paste into LOAD CODE on any device running SUSP.OS
                  </div>
                  <div style={{display:'flex',gap:6}}>
                    <button className="tbtn" style={{flex:1,fontSize:11}} onClick={close}>CLOSE</button>
                    <button className={`tbtn${shareCopied?' saved':' on'}`} style={{flex:1,fontSize:11}}
                      onClick={doCopy}>{shareCopied?'COPIED':'COPY'}</button>
                  </div>
                </>)}

                {/* LOAD CODE */}
                {dataMode==='load'&&(<>
                  <textarea value={importCode} onChange={e=>{setImportCode(e.target.value);setImportErr('');}}
                    placeholder="Paste tune code here…" rows={3}
                    style={{width:'100%',background:'#020617',border:'1px solid #1e293b',borderRadius:2,
                            padding:'6px 8px',fontSize:10,color:'#e2e8f0',outline:'none',resize:'none',
                            fontFamily:'var(--font-mono)',letterSpacing:0.5,marginBottom:10}}/>
                  {importErr&&<div style={{fontSize:9,color:'#f87171',marginBottom:8,letterSpacing:0.5}}>{importErr}</div>}
                  <div style={{fontSize:9,letterSpacing:2,color:'#475569',marginBottom:6}}>APPLY TO</div>
                  {[
                    {key:'ch',label:'CHASSIS',sub:'Weight · bias · tyres · geometry · layout'},
                    {key:'fe',label:'FEEL',sub:'Ride · damping · ARB · balance'},
                    {key:'dr',label:'DRIVETRAIN',sub:'Build type · diff'},
                  ].map(({key,label,sub})=>chkRow(key,label,sub,importSel[key],
                    e=>setImportSel(s=>({...s,[key]:e.target.checked}))))}
                  <div style={{display:'flex',gap:6,marginTop:14}}>
                    <button className="tbtn" style={{flex:1,fontSize:10}} onClick={close}>CANCEL</button>
                    <button className="tbtn on" style={{flex:1,fontSize:10}}
                      disabled={!importCode.trim()||(!importSel.ch&&!importSel.fe&&!importSel.dr)}
                      onClick={()=>{
                        const code=importCode.replace(/\s/g,'');
                        try{
                          const{ch:ic,fe:ife,dr:idr}=sanitizeTune(decodeTune(code));
                          // ic (sanitizeTune's ch) always has every codec-covered field filled in,
                          // but fields the codec doesn't carry (e.g. useRideHeightCG, still
                          // deliberately local-only per docs/CODEC.md) are absent from it — merge
                          // over the CURRENT chassis, not DEF_CH, so those stay as the user set them.
                          commit('load share code',()=>{
                            if(importSel.ch) setCh(prev=>({...DEF_CH,...prev,...ic}));
                            if(importSel.fe) setFe({...DEF_FE,...ife});
                            if(importSel.dr) setDr({...DEF_DR,...idr});
                            if(importSel.fe||importSel.dr) dnaUnlink();
                          });
                          close();
                        }catch(e){
                          console.error('Import failed:',e,code);
                          setImportErr('Invalid code — make sure you pasted the full string.');
                        }
                      }}>OVERWRITE</button>
                    <button className="tbtn" style={{flex:1,fontSize:10}}
                      disabled={!importCode.trim()||(!importSel.ch&&!importSel.fe&&!importSel.dr)}
                      onClick={()=>{
                        const code=importCode.replace(/\s/g,'');
                        try{
                          const{ch:ic,fe:ife,dr:idr}=sanitizeTune(decodeTune(code));
                          garageImport(ic,ife,idr,importSel);
                          close();
                        }catch(e){
                          console.error('Import failed:',e,code);
                          setImportErr('Invalid code — make sure you pasted the full string.');
                        }
                      }}>TO GARAGE</button>
                  </div>
                </>)}

                {/* BACKUP */}
                {dataMode==='backup'&&(<>
                  <div style={{fontSize:9,color:'#475569',marginBottom:10,letterSpacing:0.5,lineHeight:1.5}}>
                    Download a JSON backup of your saved data. Use this to transfer between devices or browsers.
                  </div>
                  {[
                    {key:'chassis',label:'CHASSIS',sub:'Chassis-only entries'},
                    {key:'build',  label:'BUILDS', sub:'Tune-only entries'},
                    {key:'car',    label:'CARS',   sub:'Chassis + tune entries'},
                    {key:'dna',    label:'DNA',    sub:'Saved handling DNAs'},
                  ].map(({key,label,sub})=>chkRow(key,label,sub,exportSel[key],
                    e=>setExportSel(s=>({...s,[key]:e.target.checked})),
                    !entries.some(en=>kindOf(en)===key)))}
                  <div style={{display:'flex',gap:6,marginTop:14}}>
                    <button className="tbtn" style={{flex:1,fontSize:11}} onClick={close}>CANCEL</button>
                    <button className="tbtn on" style={{flex:1,fontSize:11}}
                      disabled={!exportSel.chassis&&!exportSel.build&&!exportSel.car&&!exportSel.dna}
                      onClick={()=>{
                        // 'empty' (corrupt) entries are excluded from every kind, so they
                        // never propagate into a backup file
                        const out={version:2,entries:entries.filter(en=>exportSel[kindOf(en)])};
                        const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
                        const url=URL.createObjectURL(blob);
                        const a=document.createElement('a');
                        a.href=url;a.download='suspos-data.json';a.click();
                        URL.revokeObjectURL(url);
                        close();
                      }}>DOWNLOAD</button>
                  </div>
                </>)}

                {/* RESTORE */}
                {dataMode==='restore'&&(<>
                  {!restoreData&&(<>
                    <div style={{fontSize:9,color:'#475569',marginBottom:10,letterSpacing:0.5,lineHeight:1.5}}>
                      Load a suspos-data.json backup file to restore saved data.
                    </div>
                    {restoreErr&&<div style={{fontSize:9,color:'#f87171',marginBottom:8,letterSpacing:0.5}}>{restoreErr}</div>}
                    <div style={{display:'flex',gap:6,marginTop:4}}>
                      <button className="tbtn" style={{flex:1,fontSize:11}} onClick={close}>CANCEL</button>
                      <button className="tbtn on" style={{flex:1,fontSize:11}} onClick={()=>{
                        const inp=document.createElement('input');

                          // replaced one whole list and left the other alone; with a single list
                          // a naive setEntries(fromFile) would silently delete the unselected
                          // kinds. Same spirit, now that "list" means "kind".
                          // One set call — usePersist's setter closes over the render-time value.
                          // Dedup incoming ids against what's being kept — same bump-on-collision
                          // approach unifyLegacy uses for legacy imports, but here against the
                          // live garage rather than a second legacy list. v2 entries carry explicit
                          // createdAt/updatedAt (unlike legacy ones), so bumping id alone is safe.

                          // replacing it would delete that kind outright. Every backup made before
                          // saved DNAs existed is one of those, so a kind only counts as selected

                            return nid===e.id?e:{...e,id:nid};
                          });
                          setEntries([...incoming,...kept].sort((a,b)=>b.createdAt-a.createdAt));

                          <div key={label} style={{display:'flex',alignItems:'center',gap:6,marginBottom:3,
                                   ...(isDom?{background:'#0a0f1a',
                                     borderLeft:'2px solid '+(deviation>0?'#f59e0b66':'#22c55e66'),
                                     borderRadius:2,padding:'3px 0 3px 4px',margin:'0 -2px 3px -4px'}:{})}}>
                            <div style={{width:80,display:'flex',alignItems:'center',gap:2,flexShrink:0}}>
                              <span style={{fontSize:10,color:isDom?'#cbd5e1':'#94a3b8',letterSpacing:1,
                                             whiteSpace:'nowrap',fontWeight:isDom?700:400}}>{label}</span>
                              <Hint text={hint}/>
                            </div>
                            <div style={{flex:1,position:'relative',height:8,background:'#0f172a',borderRadius:2}}>
                              <div style={{position:'absolute',left:'50%',top:0,bottom:0,width:1,background:'#1e293b'}}/>
                              {barPct>1&&<div style={{position:'absolute',top:1,bottom:1,borderRadius:1,
                                background:c+(isDom?'ee':'99'),...barStyle}}/>}
                            </div>
                            <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:c,width:34,
                                           textAlign:'right',flexShrink:0,fontWeight:isDom?700:400}}>
                              {deviation>=0?'+':''}{(deviation*100).toFixed(1)}
                            </span>
                            <span style={{fontSize:10,color:pctOfTotal>40?c:'#475569',width:28,textAlign:'right',flexShrink:0}}>
                              {pctOfTotal!=null?`${pctOfTotal}%`:''}
                            </span>
                          </div>
                        );
                      })}
                      <div style={{fontSize:10,color:'#475569',lineHeight:1.5,marginTop:4}}>
                        Transient response factors. Higher Hz and lower damping shift toward reactive.
                      </div>
                    </div>
                  );
                })()}
                {uiMode==='pro'&&(()=>{
                  const xferF=2*cm.front*ch.cgHeight/ch.trackF;
                  const xferR=2*cm.rear*ch.cgHeight/ch.trackR;
                  const Row=({la,lv,ra,rv,dim,last})=>(
                    <div style={{display:'flex',alignItems:'center',gap:6,padding:'2px 8px',
                                 ...(last?{}:{borderBottom:'1px solid #0f172a'}),
                                 opacity:dim?0.55:1}}>
                      <span style={{fontSize:9,color:'#475569',letterSpacing:1,minWidth:54}}>{la}</span>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'#64748b'}}>{lv}</span>
                      <div style={{flex:1,height:1,background:'#0f172a'}}/>
                      <span style={{fontSize:9,color:'#475569',letterSpacing:1}}>{ra}</span>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'#64748b'}}>{rv}</span>
                    </div>
                  );
                  return(
                    <div style={{marginTop:10,paddingTop:8,borderTop:'1px solid #0f172a'}}>
                      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                        <span style={{fontSize:9,color:'#334155',letterSpacing:2}}>LOAD TRANSFER</span>
                        <Hint text="Corner weights and lateral load transfer at 1g cornering — see the LOAD TRANSFER entry in TERMS for what drives it. CORNER WT: static per-corner mass. XFER: total axle load transfer per g. OUT/IN: outer and inner wheel loads at 1g."/>
                      </div>
                      <div style={{border:'1px solid #0f172a',borderRadius:2,overflow:'hidden'}}>
                        <Row la="F CORNER" lv={dispMass(cm.front)} ra="R CORNER" rv={dispMass(cm.rear)} dim/>
                        <Row la="XFER F" lv={`${dispMass(xferF)}/g`} ra="XFER R" rv={`${dispMass(xferR)}/g`}/>
                        <Row la="OUT F" lv={dispMass(cm.front+xferF)} ra="OUT R" rv={dispMass(cm.rear+xferR)}/>
                        <Row la="IN F" lv={dispMass(Math.max(0,cm.front-xferF))} ra="IN R" rv={dispMass(Math.max(0,cm.rear-xferR))} last/>
                      </div>
                    </div>
                  );
                })()}
                </div>
              </div>}
          </div>

        </div>{/* end output panel */}

        {/* GARAGE DRAWER — mirrors the left sidebar's overlay pattern with the axis
            flipped. Lives inside the flex body (not position:fixed) so the header and the
            pinned balance bar stay reachable while it's open. */}
        {garagePanelOpen&&isMobile&&
            <div onClick={()=>setGaragePanelOpen(false)}
                 style={{position:'absolute',inset:0,background:'#00000088',zIndex:150}}/>}
          <div id="zone-garage" style={{
            position:'absolute',top:0,right:0,bottom:0,zIndex:200,
            width:isMobile?'100%':Math.min(420,Math.max(320,Math.floor(windowWidth*0.26))),
            background:'#020617',borderLeft:'1px solid #0f172a',
            display:'flex',flexDirection:'column',
            transform:garagePanelOpen?'translateX(0)':'translateX(100%)',
            transition:'transform .2s ease',
            boxShadow:garagePanelOpen?'-4px 0 24px #000000cc':'none',
            // a translated-off element is still focusable — without this, Tab from the
            // output panel would land in the closed drawer's inputs
            visibility:garagePanelOpen?'visible':'hidden',
            ...dim('garage'),
          }}>
            <div style={{display:'flex',alignItems:'center',gap:6,padding:'9px 12px',
                         borderBottom:'1px solid #0f172a',flexShrink:0}}>
              <span style={{fontSize:11,letterSpacing:2,color:'#9ca3af'}}>GARAGE</span>
              <span style={{fontSize:10,color:'#475569'}}>{entries.length}</span>
              <span style={{flex:1}}/>
              <button onClick={()=>setGaragePanelOpen(false)}
                style={{background:'none',border:'none',color:'#94a3b8',cursor:'pointer',
                        fontSize:16,lineHeight:1,padding:0}}>✕</button>
            </div>
            {/* save row */}
            <div style={{padding:'8px 12px',borderBottom:'1px solid #0f172a',flexShrink:0}}>
              <input value={entryName} onChange={e=>setEntryName(e.target.value)}
                placeholder="Name this entry…"
                style={{width:'100%',background:'#0f172a',border:'1px solid #1e293b',borderRadius:2,
                        padding:'4px 7px',fontSize:11,color:'#e2e8f0',outline:'none',
                        fontFamily:'inherit',marginBottom:5}}/>
              <div style={{display:'flex',gap:4}}>
                {[['chassis','SAVE CHASSIS'],['build','SAVE BUILD'],['both','SAVE CAR']].map(([k,l])=>(
                  <button key={k} className="tbtn" style={{flex:1,fontSize:9}}
                    onClick={()=>garageSave(k)}>{l}</button>
                ))}
              </div>
            </div>
            {/* filter / sort / search */}
            <div style={{padding:'7px 12px',borderBottom:'1px solid #0f172a',flexShrink:0,
                         display:'flex',flexDirection:'column',gap:5}}>
              <div style={{display:'flex',gap:3}}>
                {[['all','ALL',garageEntries.length],['chassis','CHASSIS',kindCounts.chassis||0],
                  ['build','BUILDS',kindCounts.build||0],['car','CARS',kindCounts.car||0]].map(([k,l,n])=>(
                  <button key={k} className={`tbtn${garageUI.filter===k?' on':''}`}
                    style={{flex:1,fontSize:9,padding:'3px 2px'}}
                    onClick={()=>setGarageUI(u=>({...u,filter:k}))}>{l} {n}</button>
                ))}
              </div>
              <div style={{display:'flex',gap:4,alignItems:'center'}}>
                <div style={{position:'relative',flex:1}}>
                  <input value={garageSearch} onChange={e=>setGarageSearch(e.target.value)}
                    placeholder="Search name, notes, tags…"
                    style={{width:'100%',background:'#0f172a',border:'1px solid #1e293b',borderRadius:2,
                            padding:'3px 18px 3px 7px',fontSize:10,color:'#e2e8f0',outline:'none',
                            fontFamily:'inherit'}}/>
                  {garageSearch&&<span onClick={()=>setGarageSearch('')}
                    style={{position:'absolute',right:5,top:'50%',transform:'translateY(-50%)',
                            cursor:'pointer',color:'#64748b',fontSize:11,lineHeight:1}}>×</span>}
                </div>
                <select value={garageUI.sort} onChange={e=>setGarageUI(u=>({...u,sort:e.target.value}))}
                  style={{background:'#0f172a',border:'1px solid #1e293b',borderRadius:2,
                          padding:'3px 4px',fontSize:9,color:'#94a3b8',outline:'none',
                          fontFamily:'inherit',cursor:'pointer',flexShrink:0}}>
                  <option value="recent">RECENT</option>
                  <option value="oldest">OLDEST</option>
                  <option value="name">NAME A–Z</option>
                  <option value="kind">KIND</option>
                </select>
              </div>
            </div>
            <div style={{flex:1,minHeight:0,overflowY:'auto',overscrollBehavior:'contain',
                         WebkitOverflowScrolling:'touch',padding:'8px 12px'}}>
              {/* FACTORY — read-only, deliberately NOT entries. Keeping them out of the list
                  avoids a `readonly` flag branching through every rewrite/delete/notes/tags
                  affordance, keeps them out of counts/search/backups, and preserves
                  loadPreset's tier-specific overrides. One LOAD button and no chassis button,
                  which is what structurally enforces "a preset never touches ch". */}
              <div style={{marginBottom:10}}>
                <div onClick={()=>setOpen(p=>({...p,factoryOpen:!p.factoryOpen}))}
                  style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',
                          marginBottom:5,userSelect:'none'}}>
                  <span style={{fontSize:9,letterSpacing:2,color:'#334155'}}>FACTORY</span>
                  <span style={{marginLeft:'auto',fontSize:9,color:'#475569'}}>{open.factoryOpen?'▲':'▼'}</span>
                </div>
                {open.factoryOpen&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4}}>
                  {[1,2,3,4,5,6].map(i=>{
                    const rec=(BUILD_PRESET_MAP[dr.buildType??'track']??[]).includes(i);
                    return(
                      <div key={i} style={{background:'#0f172a',borderRadius:2,padding:'5px 6px',
                        border:`1px solid ${rec?'#4f46e5':'#1e293b'}`,
                        display:'flex',flexDirection:'column',gap:2,minWidth:0}}>
                        <span style={{fontSize:10,color:'#cbd5e1',fontWeight:600,letterSpacing:.5}}>{PRESET_SAVES[i].name}</span>
                        <span style={{fontSize:8,color:'#475569',lineHeight:1.3}}>{PRESET_DESC[i].tag}</span>
                        <span style={{fontSize:8,color:'#334155',lineHeight:1.3}}>{PRESET_DESC[i].sub}</span>
                        {rec&&<span style={{fontSize:8,color:'#818cf8',letterSpacing:.5}}>★ FOR YOUR BUILD</span>}
                        <button onClick={()=>loadPreset(i)}
                          style={{marginTop:2,padding:'2px 0',fontSize:8,letterSpacing:1,
                                  background:rec?'#1e1b4b':'#1e293b',
                                  border:`1px solid ${rec?'#4338ca':'#334155'}`,borderRadius:1,
                                  color:rec?'#a5b4fc':'#64748b',cursor:'pointer',width:'100%'}}>LOAD</button>
                      </div>
                    );
                  })}
                </div>}
              </div>
              {/* three distinct empty states, each with an inline escape hatch — the failure
                  mode of a filter UI is a user who can't find their data and doesn't know why */}
              {garageList.length===0
                ?<div style={{fontSize:10,color:'#374151',textAlign:'center',padding:'20px 0',letterSpacing:1}}>
                   {garageEntries.length===0
                     ?<>NO SAVED ENTRIES<div style={{fontSize:9,marginTop:6,letterSpacing:0}}>
                        Name your setup above, then save it as a chassis, a build, or both.</div></>
                     :garageSearch.trim()
                     ?<>NO MATCHES<div style={{marginTop:8}}>
                        <button className="tbtn" style={{fontSize:9}}
                          onClick={()=>setGarageSearch('')}>CLEAR SEARCH</button></div></>
                     :<>NO {garageUI.filter.toUpperCase()} ENTRIES<div style={{marginTop:8}}>
                        <button className="tbtn" style={{fontSize:9}}
                          onClick={()=>setGarageUI(u=>({...u,filter:'all'}))}>SHOW ALL</button></div></>}
                 </div>
                :garageList.map(e=>(
                   <EntryCard key={e.id} entry={e} metricUnits={mMass} allTags={allTags}
                     onLoadChassis={garageLoadChassis} onLoadBuild={garageLoadBuild}
                     onRewrite={garageRewrite} onDelete={garageDelete} onRename={garageRename}
                     onNotes={garageNotes} onAddTag={garageAddTag} onRemoveTag={garageRemoveTag}/>
                 ))}
            </div>
          </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App/></ErrorBoundary>
);
</script>
<script>
(function(){
  var preload=document.getElementById('pre-load');
  function showError(msg,detail){
    if(preload){
      preload.style.display='block';
      preload.innerHTML='<div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">SUSP.OS \u2014 Failed to load</div>'
        +'<div style="color:#6b7280;margin-bottom:12px">'+msg+'</div>'
        +'<div style="background:#0f172a;padding:12px;border-radius:4px;color:#ef4444;word-break:break-all;line-height:1.6;font-size:11px">'+(detail||'')+'</div>'
        +'<button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#0f172a;border:1px solid #1e293b;color:#e2e8f0;border-radius:4px;cursor:pointer;font-family:var(--font-mono);font-size:12px">RELOAD</button>';
    }
  }
  try{
    if(typeof Babel==='undefined'){showError('Babel failed to load','Check your internet connection and reload.');return;}
    var src=document.getElementById('app-source').textContent;
    var compiled;
    try{
      compiled=Babel.transform(src,{
        presets:['env','react'],
        plugins:['transform-optional-chaining','transform-nullish-coalescing-operator','transform-logical-assignment-operators'],
        filename:'susp-os.jsx'
      }).code;
    }catch(e){
      showError('Babel compilation failed',e.message||String(e));
      return;
    }
    // Use indirect eval so errors are catchable on all browsers including iOS WebKit.
    // Direct script injection loses the error context on WebKit.
    try{
      (0,eval)(compiled);
    }catch(e){
      showError('Runtime error',e.message||String(e));
    }
  }catch(e){
    showError('Load failed',e.message||String(e));
  }
})();
</script>
</body>
</html>
