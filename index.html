const Hint=({text})=>{
  const[pos,setPos]=useState(null);
  const ref=useRef(null);
  const isTouch=useRef(false);

  const calcPos=()=>{
    if(!ref.current)return null;
    const r=ref.current.getBoundingClientRect();
    const PAD=8,GAP=6;
    const TW=Math.min(260,window.innerWidth-PAD*2);
    const TH=240; // generous estimate — ensures correct above/below decision for long tooltips
    // Prefer below; fall back to above. Clamp both so tooltip never leaves viewport.
    const showBelow=r.bottom+GAP+TH<=window.innerHeight;
    const top=Math.max(PAD,showBelow?r.bottom+GAP:r.top-TH-GAP);
    // Centre on icon, then clamp to viewport edges
    const iconCx=(r.left+r.right)/2;
    const left=Math.max(PAD,Math.min(iconCx-TW/2,window.innerWidth-TW-PAD));
    return{top,left,width:TW};
  };

  const onMouseEnter=()=>{ if(!isTouch.current) setPos(calcPos()); };
  const onMouseLeave=()=>{ if(!isTouch.current) setPos(null); };

  const onClick=e=>{
    isTouch.current=true; // mark as touch device once we see a click from touch
    e.stopPropagation();
    setPos(p=>p?null:calcPos());
  };

  useEffect(()=>{
    if(!pos)return;
    const dismiss=()=>setPos(null);
    const t=setTimeout(()=>document.addEventListener('click',dismiss,{once:true}),10);
    return()=>{clearTimeout(t);document.removeEventListener('click',dismiss);};
  },[pos]);

  return(
    <span ref={ref} role="button" tabIndex={0} aria-label="Help"
          style={{display:'inline-block',cursor:'help',WebkitTapHighlightColor:'transparent'}}
          onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave}
          onTouchStart={()=>{isTouch.current=true;}}
          onFocus={()=>setPos(calcPos())} onBlur={()=>setPos(null)}
          onKeyDown={e=>{
            if(e.key==='Enter'||e.key===' '){e.preventDefault();setPos(p=>p?null:calcPos());}
            else if(e.key==='Escape'){setPos(null);}
          }}
          onClick={onClick}>
      <span style={{fontSize:12,color:'#94a3b8'}}>ⓘ</span>
      {pos&&ReactDOM.createPortal(
        <div style={{position:'fixed',top:pos.top,left:pos.left,zIndex:1000,width:pos.width??220,
                     background:'#0f172a',border:'1px solid #e2e8f011',borderRadius:2,
                     padding:'7px 9px',fontSize:11,color:'#94a3b8',lineHeight:1.6,
                     pointerEvents:'none',boxShadow:'0 4px 16px #00000088'}}>
          {text}
        </div>,
        document.body
      )}
    </span>
  );
};

// The unit label beside a `.num` box. Field and every readout that embeds a `.num` share it, so
// all typed-entry boxes read the same: CHASSIS's weight, the Hz fields, BOTTOM G, FeelSlider's.
const NUM_UNIT_STYLE={fontSize:10,color:'#94a3b8',fontFamily:'var(--font-mono)',whiteSpace:'nowrap'};
const Field=({label,value,onChange,min,max,step=0.01,unit='',hint=null,logScale=false,logMid=null})=>{
  const mid=logMid??Math.sqrt(min*max);
  const valToT=v=>{
    if(!logScale)return(v-min)/(max-min);
    if(v<=mid)return 0.5*Math.log(Math.max(v,min)/min)/Math.log(mid/min);
    return 0.5+0.5*Math.log(v/mid)/Math.log(max/mid);
  };
  const tToVal=t=>{
    if(!logScale)return min+(max-min)*t;
    if(t<=0.5)return min*Math.pow(mid/min,t*2);
    return mid*Math.pow(max/mid,(t-0.5)*2);
  };
  const t=Math.max(0,Math.min(1,valToT(value)));
  const pct=t*100;
  const clamp=v=>Math.max(min,Math.min(max,v));
  const [draft,setDraft]=useState(null);
  const focused=draft!==null;
  const commit=()=>{
    if(draft===null)return;
    const v=parseFloat(draft);
    onChange(isNaN(v)?value:clamp(v));
    setDraft(null);
  };
  const numRef=useRef(null), sliRef=useRef(null);
  const valRef=useRef(value);
  const draftRef=useRef(draft);
  const onChangeRef=useRef(onChange); useLayoutEffect(()=>{onChangeRef.current=onChange;},[onChange]);
  useLayoutEffect(()=>{valRef.current=value;},[value]);
  useLayoutEffect(()=>{draftRef.current=draft;},[draft]);
  const stepBy=dir=>{
    const base=draftRef.current!==null&&!isNaN(parseFloat(draftRef.current))
      ? parseFloat(draftRef.current) : valRef.current;
    const dynStep=logScale?(base<6000?1:Math.max(1,Math.round((base-6000)/600))):step;
    const next=clamp(base+dir*dynStep);
    const snapped=logScale?Math.round(next):Math.round(next/step)*step;
    onChangeRef.current(parseFloat(snapped.toFixed(6)));
    if(draftRef.current!==null)setDraft(null);
  };
  useEffect(()=>{
    const onWheel=e=>{
      const focused=document.activeElement===numRef.current||document.activeElement===sliRef.current;
      if(!focused)return;
      e.preventDefault();
      e.stopPropagation();
      stepBy(e.deltaY<0?1:-1);
    };
    const n=numRef.current, s=sliRef.current;
    n&&n.addEventListener('wheel',onWheel,{passive:false});
    s&&s.addEventListener('wheel',onWheel,{passive:false});
    return()=>{
      n&&n.removeEventListener('wheel',onWheel);
      s&&s.removeEventListener('wheel',onWheel);
    };
  },[min,max,step,logScale]);
  return(
    <div style={{marginBottom:10,minWidth:0}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
        <span style={{fontSize:12,color:'#9ca3af',minWidth:0,overflow:'hidden',
                      textOverflow:'ellipsis',whiteSpace:'nowrap',marginRight:6}}>
          {label}{hint&&<Hint text={hint}/>}
        </span>
        <div style={{display:'flex',alignItems:'center',gap:3,flexShrink:0}}>
          <button type="button" className="nudge-btn" onClick={()=>stepBy(-1)}
            style={{border:'1px solid #1e293b',background:'#0a0f1a',color:'#9ca3af',
                    borderRadius:2,fontFamily:'var(--font-mono)',fontSize:14,lineHeight:1,
                    WebkitTapHighlightColor:'transparent'}}>&#8722;</button>
          <input ref={numRef} type="number" className="num" min={min} max={max} step={logScale?1:step}
            value={focused?draft:value}
            onFocus={()=>setDraft(String(value))}
            onChange={e=>setDraft(e.target.value)}
            onBlur={commit}
            onKeyDown={e=>{if(e.key==='Enter')e.target.blur();}}/>
          {unit&&<span style={NUM_UNIT_STYLE}>{unit}</span>}
          <button type="button" className="nudge-btn" onClick={()=>stepBy(1)}
            style={{border:'1px solid #1e293b',background:'#0a0f1a',color:'#9ca3af',
                    borderRadius:2,fontFamily:'var(--font-mono)',fontSize:14,lineHeight:1,
                    WebkitTapHighlightColor:'transparent'}}>&#43;</button>
        </div>
      </div>
      <input ref={sliRef} type="range" className="sli" min={0} max={1} step={0.0001}
        value={logScale?t:undefined}
        {...(!logScale&&{min,max,step,value})}
        style={{background:`linear-gradient(to right,#e2e8f0 ${pct}%,#1e293b ${pct}%)`}}
        onChange={e=>onChange(logScale
          ?Math.round(clamp(tToVal(parseFloat(e.target.value))))
          :parseFloat(e.target.value))}/>
    </div>
  );
};


// Field's always-visible number box on its own — the one every FeelSlider shows (see its `box`
// prop). Same behaviour as Field's input: it shows the value, typing edits a draft, Enter or
// blur commits clamped to min/max, Escape cancels. A draft left unedited never commits, so
// focusing and leaving can't nudge a value. While it's focused and unedited it follows the value,
// so the slider's own wheel stepping stays visible in the box.
const NumBox=({value,onCommit,min,max,dp=0,unit,label,disabled=false,placeholder})=>{
  const fmt=v=>{
    if(!Number.isFinite(v))return'';
    const raw=String(parseFloat(v.toFixed(6)));
    return v.toFixed(Math.max(dp,(raw.split('.')[1]||'').length));
  };
  const[draft,setDraft]=useState(null);
  const openedRef=useRef(null);
  const cancelRef=useRef(false);
  useEffect(()=>{
    if(draft!==null&&draft===openedRef.current){const t=fmt(value);openedRef.current=t;setDraft(t);}
  },[value]); // eslint-disable-line
  const commit=()=>{
    const v=parseFloat(draft);
    if(!cancelRef.current&&draft!==openedRef.current&&!isNaN(v))
      onCommit(parseFloat(Math.max(min,Math.min(max,v)).toFixed(6)));
    cancelRef.current=false;
    setDraft(null);
  };
  return(
    <span style={{display:'flex',alignItems:'center',gap:3}}>
      {/* An empty box has no text to show where it is, so it keeps its border (.num.empty). */}
      <input type="number" className={`num${Number.isFinite(value)?"":" empty"}`} aria-label={label} min={min} max={max} disabled={disabled} placeholder={placeholder}
        step={dp>0?Number((1/10**dp).toFixed(dp)):1}
        value={draft??fmt(value)}
        onFocus={e=>{const t=fmt(value);openedRef.current=t;setDraft(t);e.target.select();}}
        onChange={e=>setDraft(e.target.value)}
        onBlur={commit}
        onKeyDown={e=>{
          if(e.key==='Enter')e.target.blur();
          else if(e.key==='Escape'){cancelRef.current=true;e.target.blur();}
        }}/>
      {unit&&<span style={NUM_UNIT_STYLE}>{unit}</span>}
    </span>
  );
};

// Every FeelSlider carries Field's number box (NumBox) beside its label, as CHASSIS does, so any
// slider can be typed. `box` configures it: `unit`, and `value`/`onCommit`/`min`/`max`/`dp`
// overrides where the stored field isn't the slider's (Target Speed, displayed inverted and in mph
// or km/h; POWER SPLIT, centred on 50). `readout` is secondary text to the left of the box.
const FeelSlider=({label,value,onChange,min,max,step=1,leftLabel,rightLabel,readout=null,locked=false,hint=null,markers=null,box={}})=>{
  const pct=((value-min)/(max-min))*100;
  const bg=`linear-gradient(to right,#e2e8f0 ${pct}%,#1e293b ${pct}%)`;
  const wrapRef=useRef(null);
  const valRef=useRef(value);
  useLayoutEffect(()=>{valRef.current=value;},[value]);
  const lockRef=useRef(locked); lockRef.current=locked;
  const onChangeRef=useRef(onChange); useLayoutEffect(()=>{onChangeRef.current=onChange;},[onChange]);
  const dp=Math.min(6,(String(step).split('.')[1]||'').length);
  useEffect(()=>{
    const onWheel=e=>{
      if(document.activeElement!==wrapRef.current&&!wrapRef.current?.contains(document.activeElement))return;
      e.preventDefault();
      e.stopPropagation();
      if(lockRef.current)return;
      const dir=e.deltaY<0?1:-1;
      const next=Math.max(min,Math.min(max,valRef.current+dir*step));
      const snapped=Math.round(next/step)*step;
      onChangeRef.current(parseFloat(snapped.toFixed(6)));
    };
    const w=wrapRef.current;
    w&&w.addEventListener('wheel',onWheel,{passive:false});
    return()=>{w&&w.removeEventListener('wheel',onWheel);};
  },[min,max,step]);
  return(
    <div ref={wrapRef} style={{marginBottom:markers&&markers.some(m=>m.label)?18:10,opacity:locked?0.38:1,transition:'opacity .15s'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
        <span style={{fontSize:12,color:'#9ca3af',minWidth:0,overflow:'hidden',
                      textOverflow:'ellipsis',whiteSpace:'nowrap',marginRight:6}}>{label}{hint&&<Hint text={hint}/>}</span>
        <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
          {locked&&<span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>MANUAL</span>}
          {readout&&(typeof readout==='string'
            ?<span style={{fontSize:11,color:'#9ca3af',fontFamily:'var(--font-mono)',whiteSpace:'nowrap'}}>{readout}</span>
            :readout)}
          <NumBox value={box.value??value} onCommit={box.onCommit??onChange}
            min={box.min??min} max={box.max??max} dp={box.dp??dp} unit={box.unit}
            disabled={locked} label={typeof label==='string'&&label?label:undefined}/>
        </div>
      </div>
      <div style={{position:'relative'}}>
        <input type="range" className="sli" min={min} max={max} step={step} value={value}
          style={{background:bg,cursor:locked?'not-allowed':'pointer',pointerEvents:locked?'none':'auto'}}
          onChange={e=>!locked&&onChange(parseFloat(e.target.value))}/>
        {markers&&markers.map(m=>{
          const pct=(m.value-min)/(max-min);
          const left=`calc(${pct*100}% + ${(0.5-pct)*14}px)`;
          const active=m.lessThan?value<m.value:value>=m.value;
          return(
            <div key={m.value} style={{position:'absolute',left,top:'50%',
                transform:'translate(-50%,-50%)',pointerEvents:'none',
                display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
              <div style={{width:1.5,height:8,borderRadius:1,
                           background:active?m.color:'#1e293b',
                           transition:'background .15s'}}/>
              {m.label&&<span style={{fontSize:10,color:active?m.color:'#94a3b8',
                                      letterSpacing:0.5,whiteSpace:'nowrap',
                                      transition:'color .15s',marginTop:2}}>
                {m.label}
              </span>}
            </div>
          );
        })}
      </div>
      <div style={{display:'flex',justifyContent:'space-between',marginTop:4}}>
        <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>{leftLabel}</span>
        <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>{rightLabel}</span>
      </div>
    </div>
  );
};

const DampingDial=({rebound,bump})=>{
  const[hover,setHover]=useState(null); // 'rebound'|'bump'|null
  const SIZE=120,CX=60,CY=58,R=46;
  const GAP_DEG=60; // gap at bottom
  const START=180+GAP_DEG/2;  // 210° from top-clockwise = lower-left
  const SWEEP=360-GAP_DEG;
  const MIN_Z=10,MAX_Z=200;
  const zetaToAngle=z=>START+((z-MIN_Z)/(MAX_Z-MIN_Z))*SWEEP;
  const polar=(deg,r=R)=>{
    const rad=((deg-90)*Math.PI)/180; // SVG: 0deg = top, clockwise
    return[CX+r*Math.cos(rad),CY+r*Math.sin(rad)];
  };
  const arcPath=(a1,a2,r=R)=>{
    const[x1,y1]=polar(a1,r);
    const[x2,y2]=polar(a2,r);
    const sweep=((a2-a1)+360)%360;
    const large=sweep>180?1:0;
    return`M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large},1 ${x2.toFixed(2)},${y2.toFixed(2)}`;
  };
  const rebA=zetaToAngle(rebound);
  const bumpA=zetaToAngle(bump);
  const endA=START+SWEEP;
  const [rxSvg,rySvg]=polar(rebA);
  const [bxSvg,bySvg]=polar(bumpA);
  const bumpPct=rebound>0?Math.round((bump/rebound)*100):0;
  const label=hover==='rebound'?`${Math.round(rebound)}%`
             :hover==='bump'   ?`${Math.round(bump)}%`
             :`${bumpPct}%`;
  const labelSub=hover==='rebound'?'REBOUND'
                :hover==='bump'   ?'BUMP'
                :'B/R';
  const loA=Math.min(rebA,bumpA), hiA=Math.max(rebA,bumpA);
  const crossed=bump>rebound;
  // Background zone bands use the same UNDER/BWORTH/OVER thresholds (40/70/100) as the
  // Rebound ζ/Bump ζ sliders elsewhere, styled like SpringDial's SOFT→RACE bands.
  const a40=zetaToAngle(40),a70=zetaToAngle(70),a100=zetaToAngle(100);
  return(
    <div style={{display:'flex',justifyContent:'center',marginBottom:4}}>
      <div style={{position:'relative',display:'inline-block'}}>
        <svg width={SIZE} height={SIZE} style={{overflow:'visible'}}>
          {/* background track — zone-tinted like SpringDial's SOFT→RACE bands */}
          <path d={arcPath(START,a40)}  fill="none" stroke="#1e3a5f" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(a40,a70)}    fill="none" stroke="#14532d" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(a70,a100)}   fill="none" stroke="#713f12" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(a100,endA)}  fill="none" stroke="#7f1d1d" strokeWidth={4} strokeLinecap="round"/>
          {/* rebound arc: START → rebA, red */}
          <path d={arcPath(START,rebA)} fill="none" stroke="#ef4444" strokeWidth={4} strokeLinecap="round" opacity={0.7}/>
          {/* bump arc: START → bumpA, blue */}
          <path d={arcPath(START,bumpA)} fill="none" stroke="#3b82f6" strokeWidth={4} strokeLinecap="round" opacity={0.7}/>
          {/* fill between thumbs */}
          <path d={arcPath(loA,hiA)} fill="none"
            stroke={crossed?'#f59e0b':'#7c3aed'} strokeWidth={3} strokeLinecap="round" opacity={0.5}/>
          {/* rebound thumb */}
          <circle cx={rxSvg} cy={rySvg} r={5} fill="#ef4444" stroke="#0f172a" strokeWidth={1.5}
            style={{cursor:'default'}}
            onMouseEnter={()=>setHover('rebound')} onMouseLeave={()=>setHover(null)}
            onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='rebound'?null:'rebound');}}/>
          {/* bump thumb */}
          <circle cx={bxSvg} cy={bySvg} r={5} fill="#3b82f6" stroke="#0f172a" strokeWidth={1.5}
            style={{cursor:'default'}}
            onMouseEnter={()=>setHover('bump')} onMouseLeave={()=>setHover(null)}
            onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='bump'?null:'bump');}}/>
          {/* center label */}
          <text x={CX} y={CY-4} textAnchor="middle" fill={crossed?'#f59e0b':'#e2e8f0'}
            fontSize={16} fontFamily="JetBrains Mono, monospace" fontWeight="700">{label}</text>
          <text x={CX} y={CY+11} textAnchor="middle" fill="#475569"
            fontSize={9} fontFamily="sans-serif" letterSpacing={2}>{labelSub}</text>
          <text x={CX} y={CY+32} textAnchor="middle" fill="#334155"
            fontSize={8} fontFamily="sans-serif" letterSpacing={2}>DAMPERS</text>
        </svg>
        <span style={{position:'absolute',top:2,right:2,lineHeight:1}}>
          <Hint text="Red dot = rebound damping %, blue dot = bump damping %, both on a 10–200 range. Hover or tap a dot to read its value. Center shows the bump-to-rebound ratio. The fill between them turns amber if bump exceeds rebound — bump should generally be softer (lower %) than rebound for a compliant, predictable ride. The background ring is tinted by zone: blue = under-damped (bouncy), green = approaching Butterworth, amber = at or past Butterworth (≈70% ζ), red = overdamped (sluggish) — same thresholds as the Rebound ζ/Bump ζ sliders."/>
        </span>
      </div>
    </div>
  );
};

const _dialBase=(SIZE=120,CX=60,CY=58,R=46,GAP_DEG=60)=>{
  const START=180+GAP_DEG/2, SWEEP=360-GAP_DEG;
  const polar=(deg,r=R)=>{const rad=((deg-90)*Math.PI)/180;return[CX+r*Math.cos(rad),CY+r*Math.sin(rad)];};
  const arcPath=(a1,a2,r=R)=>{
    const[x1,y1]=polar(a1,r);const[x2,y2]=polar(a2,r);
    const sweep=((a2-a1)+360)%360;const large=sweep>180?1:0;
    return`M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large},1 ${x2.toFixed(2)},${y2.toFixed(2)}`;
  };
  return{START,SWEEP,polar,arcPath,CX,CY,SIZE};
};

const SpringDial=({fHz,rHz,rsSpF,rsSpR,clamped,natBal,target,rideRef})=>{
  const[hover,setHover]=useState(null);
  const{START,SWEEP,polar,arcPath,CX,CY,SIZE}=_dialBase();
  const MIN_HZ=HZ_MIN,MAX_HZ=HZ_MAX;
  const toA=hz=>START+((Math.min(Math.max(hz,MIN_HZ),MAX_HZ)-MIN_HZ)/(MAX_HZ-MIN_HZ))*SWEEP;
  const endA=START+SWEEP;
  const a12=toA(HZ_BANDS[0]),a18=toA(HZ_BANDS[1]),a25=toA(HZ_BANDS[2]);
  const fA=toA(fHz),rA=toA(rHz);
  const[fxS,fyS]=polar(fA);const[rxS,ryS]=polar(rA);
  // Ghost dots: where the derived axle (the one the ride ref ISN'T) would sit for the
  // spring split to carry a given rear roll-stiffness fraction. Roll stiffness ∝ Hz², so
  // hold the reference axle fixed and scale the derived axle's Hz by √(target rs / current rs).
  const derived=rideRef==='rear'?'front':'rear';
  const ghostHz=frac=>{
    if(frac==null||rsSpF<=0||rsSpR<=0)return null;
    const f=Math.max(0.05,Math.min(0.95,frac));
    const hz=derived==='rear'
      ? rHz*Math.sqrt((f/(1-f)*rsSpF)/rsSpR)
      : fHz*Math.sqrt(((1-f)/f*rsSpR)/rsSpF);
    return(hz>=MIN_HZ&&hz<=MAX_HZ)?hz:null;
  };
  const natG=ghostHz(natBal),tgtG=ghostHz(target);
  const showTgtG=tgtG!=null&&(natG==null||Math.abs(tgtG-natG)>0.03);
  const ghostDot=(hz,col,key)=>{if(hz==null)return null;const[x,y]=polar(toA(hz));
    return<circle key={key} cx={x} cy={y} r={4} fill="none" stroke={col} strokeWidth={1.5} opacity={0.75}/>;};
  const dispVal=hover==='front'?fHz.toFixed(2):hover==='rear'?rHz.toFixed(2)
    :(fHz>0?`×${(rHz/fHz).toFixed(2)}`:'-');
  const dispSub=hover==='front'?'FRONT':hover==='rear'?'REAR':'F/R';
  const centerCol=clamped?'#f59e0b':'#e2e8f0';
  return(
    <div style={{display:'flex',justifyContent:'center',marginBottom:0}}>
      <div style={{position:'relative',display:'inline-block'}}>
        <svg width={SIZE} height={SIZE-20} style={{overflow:'visible',display:'block'}}>
          <path d={arcPath(START,endA)} fill="none" stroke="#1e293b" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(START,a12)} fill="none" stroke="#1e3a5f" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(a12,a18)}   fill="none" stroke="#14532d" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(a18,a25)}   fill="none" stroke="#713f12" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(a25,endA)}  fill="none" stroke="#7f1d1d" strokeWidth={4} strokeLinecap="round"/>
          {ghostDot(natG,'#64748b','natG')}
          {showTgtG&&ghostDot(tgtG,'#4ade80','tgtG')}
          <circle cx={fxS} cy={fyS} r={5} fill="#818cf8" stroke="#0f172a" strokeWidth={1.5} style={{cursor:'default'}}
            onMouseEnter={()=>setHover('front')} onMouseLeave={()=>setHover(null)}
            onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='front'?null:'front');}}/>
          <circle cx={rxS} cy={ryS} r={5} fill="#f97316" stroke="#0f172a" strokeWidth={1.5} style={{cursor:'default'}}
            onMouseEnter={()=>setHover('rear')} onMouseLeave={()=>setHover(null)}
            onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='rear'?null:'rear');}}/>
          <text x={CX} y={CY-4} textAnchor="middle" fill={centerCol}
            fontSize={15} fontFamily="JetBrains Mono, monospace" fontWeight="700">{dispVal}</text>
          <text x={CX} y={CY+11} textAnchor="middle" fill="#475569"
            fontSize={9} fontFamily="sans-serif" letterSpacing={2}>{dispSub}</text>
          <text x={CX} y={CY+32} textAnchor="middle" fill="#334155"
            fontSize={8} fontFamily="sans-serif" letterSpacing={2}>RIDE</text>
        </svg>
        <span style={{position:'absolute',top:2,right:2,lineHeight:1}}>
          <Hint text="Purple dot = front spring Hz, orange dot = rear Hz, plotted on a SOFT→RACE arc. Hover or tap a dot to read its value. Hollow rings mark where the derived axle would need to sit for natural balance (grey) and your target (green) — close the gap to green to hit your balance target."/>
        </span>
      </div>
    </div>
  );
};

// `arbLimit` is the arc's full scale. In the Forza modes that's the game's click ceiling,
// which is what makes the 50/75/90% bands and the amber warning meaningful. Physical modes
// have no ceiling, so the caller passes a dynamic scale and sets `physical` — the arc then
// reads purely as an F/R split (which is what the centre readout shows anyway) and the
// bands, which would otherwise imply a limit that doesn't exist, are suppressed.
const ArbDial=({arbF,arbR,arbLimit,rsAbF,rsAbR,natBal,target,rideRef,physical=false,dispF,dispR})=>{
  const[hover,setHover]=useState(null);
  const{START,SWEEP,polar,arcPath,CX,CY,SIZE}=_dialBase();
  const toA=v=>START+(Math.min(Math.max(v,0),arbLimit)/arbLimit)*SWEEP;
  const endA=START+SWEEP;
  const a50=toA(arbLimit*0.50),a75=toA(arbLimit*0.75),a90=toA(arbLimit*0.90);
  const fA=toA(arbF),rA=toA(arbR);
  const[fxS,fyS]=polar(fA);const[rxS,ryS]=polar(rA);
  const abTot=rsAbF+rsAbR;
  const rearAbFrac=abTot>0?rsAbR/abTot:0.5;
  // Ghost dots: where the derived axle's ARB clicks would land for the ARB split to carry a
  // given rear roll-stiffness fraction. ARB roll stiffness ∝ clicks, so scale linearly.
  const derived=rideRef==='rear'?'front':'rear';
  const ghostClicks=frac=>{
    if(frac==null||rsAbF<=0||rsAbR<=0)return null;
    const f=Math.max(0.05,Math.min(0.95,frac));
    const v=derived==='rear'
      ? arbR*((f/(1-f)*rsAbF)/rsAbR)
      : arbF*(((1-f)/f*rsAbR)/rsAbF);
    return(v>=0&&v<=arbLimit)?v:null;
  };
  const natG=ghostClicks(natBal),tgtG=ghostClicks(target);
  const showTgtG=tgtG!=null&&(natG==null||Math.abs(tgtG-natG)>arbLimit*0.02);
  const ghostDot=(v,col,key)=>{if(v==null)return null;const[x,y]=polar(toA(v));
    return<circle key={key} cx={x} cy={y} r={4} fill="none" stroke={col} strokeWidth={1.5} opacity={0.75}/>;};
  const rearPct=Math.round(rearAbFrac*100);
  // In physical mode the dial's own values are roll stiffness; `dispF`/`dispR` carry the
  // N/m figures the ARB card shows, so hovering here can't contradict what you'd type in.
  const hv=hover==='front'?(physical?(dispF??arbF):arbF):(physical?(dispR??arbR):arbR);
  const dispVal=hover?hv.toFixed(physical?0:1):`${rearPct}%`;
  const dispSub=hover==='front'?(physical?'N/m F':`/ ${arbLimit} F`)
               :hover==='rear' ?(physical?'N/m R':`/ ${arbLimit} R`):'R SPLIT';
  const warnF=!physical&&arbF>arbLimit*0.88,warnR=!physical&&arbR>arbLimit*0.88;
  const centerCol=warnF||warnR?'#f59e0b':'#e2e8f0';
  return(
    <div style={{display:'flex',justifyContent:'center',marginBottom:0}}>
      <div style={{position:'relative',display:'inline-block'}}>
        <svg width={SIZE} height={SIZE-20} style={{overflow:'visible',display:'block'}}>
          <path d={arcPath(START,endA)} fill="none" stroke="#1e293b" strokeWidth={4} strokeLinecap="round"/>
          {!physical&&<>
            <path d={arcPath(START,a50)} fill="none" stroke="#1e3a5f" strokeWidth={4} strokeLinecap="round"/>
            <path d={arcPath(a50,a75)}   fill="none" stroke="#713f12" strokeWidth={4} strokeLinecap="round"/>
            <path d={arcPath(a75,a90)}   fill="none" stroke="#7c2d12" strokeWidth={4} strokeLinecap="round"/>
            <path d={arcPath(a90,endA)}  fill="none" stroke="#7f1d1d" strokeWidth={4} strokeLinecap="round"/>
          </>}
          {ghostDot(natG,'#64748b','natG')}
          {showTgtG&&ghostDot(tgtG,'#4ade80','tgtG')}
          <circle cx={fxS} cy={fyS} r={5} fill={warnF?'#f59e0b':'#818cf8'} stroke="#0f172a" strokeWidth={1.5} style={{cursor:'default'}}
            onMouseEnter={()=>setHover('front')} onMouseLeave={()=>setHover(null)}
            onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='front'?null:'front');}}/>
          <circle cx={rxS} cy={ryS} r={5} fill={warnR?'#f59e0b':'#f97316'} stroke="#0f172a" strokeWidth={1.5} style={{cursor:'default'}}
            onMouseEnter={()=>setHover('rear')} onMouseLeave={()=>setHover(null)}
            onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='rear'?null:'rear');}}/>
          <text x={CX} y={CY-4} textAnchor="middle" fill={centerCol}
            fontSize={15} fontFamily="JetBrains Mono, monospace" fontWeight="700">{dispVal}</text>
          <text x={CX} y={CY+11} textAnchor="middle" fill="#475569"
            fontSize={9} fontFamily="sans-serif" letterSpacing={2}>{dispSub}</text>
          <text x={CX} y={CY+32} textAnchor="middle" fill="#334155"
            fontSize={8} fontFamily="sans-serif" letterSpacing={2}>ARB</text>
        </svg>
        <span style={{position:'absolute',top:2,right:2,lineHeight:1}}>
          <Hint text="Purple dot = front ARB clicks, orange dot = rear ARB clicks, plotted from 0 to your ceiling. Hover or tap a dot to read its value. Hollow rings mark where the derived axle would need to sit for natural balance (grey) and your target (green)."/>
        </span>
      </div>
    </div>
  );
};


const Toggle=({label,value,onChange,options,hint})=>(
  <div style={{marginBottom:9}}>
    {label&&<span style={{fontSize:12,color:'#9ca3af',display:'flex',alignItems:'center',gap:4,marginBottom:3}}>{label}{hint&&<Hint text={hint}/>}</span>}
    <div style={{display:'flex',gap:3}}>
      {options.map(o=><button key={o.value} className={`tog${value===o.value?' on':''}`}
        onClick={()=>onChange(o.value)}>{o.label}</button>)}
    </div>
  </div>
);

const Sec=({title,open,onToggle,onReset,children})=>{
  const[pending,setPending]=useState(false);
  const timer=useRef(null);
  const handleReset=e=>{
    e.stopPropagation();
    if(pending){clearTimeout(timer.current);setPending(false);onReset();}
    else{setPending(true);timer.current=setTimeout(()=>setPending(false),2000);}
  };
  useEffect(()=>()=>clearTimeout(timer.current),[]);
  // The header is a div (not a <button>) because RESET needs to be a real,
  // independently focusable <button> nested inside it — buttons can't nest
  // inside buttons in valid HTML. role="button"+tabIndex+onKeyDown restores
  // the same Enter/Space keyboard activation a native button gets for free.
  return(
    <div style={{borderBottom:'1px solid #0f172a',marginBottom:8}}>
      <div className={`stog${open?' stog-open':''}`} role="button" tabIndex={0}
           onClick={onToggle}
           onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onToggle();}}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:2,height:10,borderRadius:1,flexShrink:0,
                       background:open?'#e2e8f0':'#1e293b',transition:'background .12s'}}/>
          <span>{title}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          {onReset&&<button type="button"
            onClick={handleReset}
            title={pending?'Click again to confirm':'Reset to defaults'}
            style={{fontSize:10,color:pending?'#f59e0b':'#94a3b8',padding:'1px 5px',borderRadius:2,
                    background:'none',fontFamily:'inherit',
                    border:`1px solid ${pending?'#f59e0b44':'#1e293b'}`,lineHeight:1.4,cursor:'pointer',
                    transition:'color .12s,border-color .12s',userSelect:'none'}}>
            {pending?'SURE?':'RESET'}
          </button>}
          <span style={{fontSize:11,color:open?'#e2e8f0':'#94a3b8',transition:'color .12s'}}>
            {open?'▲':'▼'}
          </span>
        </div>
      </div>
      {open&&<div style={{padding:'8px 12px 10px'}}>{children}</div>}
    </div>
  );
};

// ── Output rows ─────────────────────────────────────────────────────────────
// The output panel is a "read it, type it into the game" checklist, so each value
// gets one full-width line rather than a bordered mini-card (Readout, still used by
// Tune Check and the sidebar). Label left, optional mono meta in the middle, value
// hard right — which is where the eye lands when transcribing into a tuning menu.
// Deliberately no per-value hint icon and no boxed context badge: section-level
// hints live on Card, and ctx reads as inline text here instead.
const OutRow=({label,meta=[],value,unit,decimals=1,warn=false,note=null,noteColor='#f59e0b'})=>(
  <div style={{display:'flex',alignItems:'baseline',gap:10,padding:'7px 10px'}}>
    <span style={{fontSize:11,color:'#cbd5e1',letterSpacing:0.5,flexShrink:0}}>{label}</span>
    {(Array.isArray(meta)?meta:[meta]).filter(Boolean).map((m,i)=>(
      <span key={i} style={{fontSize:10,color:'#64748b',fontFamily:'var(--font-mono)',
                            whiteSpace:'nowrap'}}>{m}</span>
    ))}
    <span style={{flex:1,minWidth:8}}/>
    {note&&<span style={{fontSize:10,color:noteColor,whiteSpace:'nowrap'}}>{note}</span>}
    <span style={{fontFamily:'var(--font-mono)',fontSize:15,fontWeight:700,
                  color:warn?'#f59e0b':'#e2e8f0',whiteSpace:'nowrap'}}>
      {typeof value==='number'?value.toFixed(decimals):value}
    </span>
    {unit&&<span style={{fontSize:10,color:'#64748b',whiteSpace:'nowrap'}}>{unit}</span>}
  </div>
);
// Bordered wrapper grouping related OutRows (Camber F+R, Toe F+R, …), mirroring the
// nested boxes in the wireframe. No internal dividers — the grouping is the signal.
// Background matches the DIFFERENTIAL card's RECOMMENDED / CENTER SPLIT call-outs so
// every boxed element in the output panel sits on one surface colour.
const RowGroup=({children,style})=>(
  <div style={{border:'1px solid #1e293b',borderRadius:2,marginBottom:5,
               background:'#0f172a',...style}}>{children}</div>
);

const Stat=({label,value,unit,decimals=2})=>(
  <div className="sr">
    <span className="sl">{label}</span>
    <span className="sv">{typeof value==='number'?value.toFixed(decimals):value}

const Card=({title,accent=false,hint=null,headerRight=null,children})=>(

// ── BeamNG output cards ─────────────────────────────────────────────────────
// physMode-only presentational shells for the two-column output layout (see
// docs/CODE_MAP.md). All three take pre-computed OutRow prop objects/elements —
// the row math itself still comes from the same arbOut/springOut/dampOut/diffCtx
// functions the Forza cards above use, just assembled differently: one card per
// axle instead of one card per subsystem (ARB+Spring+Damper merge into
// SuspensionCard; Caster is front-only on AlignCard, matching BeamNG's actual
// menu — there is no rear caster slider).
const SuspensionCard=({side,arbRow,springRow,dampRebRow,dampBumpRow,arbCaveat,hint})=>(
  <Card title={`${side} SUSPENSION`} accent hint={hint}>
    <RowGroup><OutRow {...arbRow}/></RowGroup>
    {arbCaveat&&<div style={{fontSize:10,color:'#f59e0b',lineHeight:1.6,margin:'-2px 0 6px'}}>{arbCaveat}</div>}
    <RowGroup><OutRow {...springRow}/></RowGroup>
    <RowGroup style={{marginBottom:0}}>
      <OutRow {...dampRebRow}/>
      <OutRow {...dampBumpRow}/>
    </RowGroup>
  </Card>
);
const AlignCard=({side,camber,toe,caster,hint})=>(
  <Card title={`${side} ALIGNMENT`} hint={hint}>
    <RowGroup><OutRow label="Camber" value={camber} unit="°"/></RowGroup>
    <RowGroup style={caster==null?{marginBottom:0}:{}}><OutRow label="Toe" value={toe} unit="°"/></RowGroup>
    {caster!=null&&<RowGroup style={{marginBottom:0}}><OutRow label="Caster" value={caster} unit="°"/></RowGroup>}
  </Card>

const DiffCard=({title,rows})=>(
  <Card title={title}><RowGroup style={{marginBottom:0}}>{rows}</RowGroup></Card>
);

const BiasSeg=({label,val,hint,primary,totalAbs})=>{
  // positive = oversteer (red/right), negative = understeer (blue/left)
  const c=val>0.5?'#ef4444':val<-0.5?'#3b82f6':'#cbd5e1';
  const scale=15;
  const pct=Math.min(50,Math.abs(val)/scale*50);
  const barStyle=val>=0?{left:'50%',width:`${pct}%`}:{right:'50%',width:`${pct}%`};
  const pctOfTotal=totalAbs>0.5?Math.round(Math.abs(val)/totalAbs*100):null;
  return(
    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3,
                 ...(primary?{background:'#0a0f1a',borderLeft:'2px solid '+(val>0?'#ef444466':'#3b82f666'),
                               borderRadius:2,padding:'3px 0 3px 4px',margin:'0 -2px 3px -4px'}:{})}}>
      <div style={{width:80,display:'flex',alignItems:'center',gap:2,flexShrink:0}}>
        <span style={{fontSize:10,color:primary?'#cbd5e1':'#94a3b8',letterSpacing:1,lineHeight:1.2,
                       whiteSpace:'nowrap',fontWeight:primary?700:400}}>{label}</span>
        <Hint text={hint}/>
      </div>
      <div style={{flex:1,position:'relative',height:8,background:'#0f172a',borderRadius:2}}>
        <div style={{position:'absolute',left:'50%',top:0,bottom:0,width:1,background:'#1e293b'}}/>
        {Math.abs(val)>0.5&&<div style={{position:'absolute',top:1,bottom:1,borderRadius:1,
          background:c+(primary?'ee':'99'),...barStyle}}/>}
      </div>
      <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:c,width:34,textAlign:'right',flexShrink:0,
                     fontWeight:primary?700:400}}>
        {val>=0?'+':''}{val.toFixed(1)}
      </span>
      <span style={{fontSize:10,color:pctOfTotal>40?c:'#475569',width:28,textAlign:'right',flexShrink:0}}>
        {pctOfTotal!=null?`${pctOfTotal}%`:''}
      </span>
    </div>
  );
};

const HandlingVerdict=({total,bSp,bAb,bDiffAccel,bDiffDecel,bDiffFront,bDiffRear,diffLayout,bBrakeEntry,bDampBias,gripBalance,uiMode})=>{
  const abs=Math.abs(total);
  // positive = oversteer, negative = understeer
  const label=abs<3?'NEUTRAL':total>0?'OVERSTEER':'UNDERSTEER';
  const col=abs<3?'#e2e8f0':total>0?'#ef4444':'#3b82f6';
  const isAWD=diffLayout==='AWD';
  const contributors=[
    {name:'springs',val:bSp??0},{name:'ARB',val:bAb??0},
    ...(isAWD
      ?[{name:'diff front',val:bDiffFront??0},{name:'diff rear',val:bDiffRear??0}]
      :[{name:'diff exit',val:bDiffAccel??0},{name:'diff entry',val:bDiffDecel??0}]),
    {name:'brakes',val:bBrakeEntry??0},{name:'damping',val:bDampBias??0}
  ];
  const totalAbs=contributors.reduce((s,c)=>s+Math.abs(c.val),0);
  // Sort by magnitude so dominant driver appears first
  const sorted=[...contributors].sort((a,b)=>Math.abs(b.val)-Math.abs(a.val));
  const dom=sorted[0];
  const domBig=Math.abs(dom.val)>2;
  // Actionable tip per dominant contributor
  const domTips={
    springs:   total>0?'Reduce the Mech Balance Target or use CO-SOLVE to balance spring stiffness.':'Raise the Mech Balance Target — springs are biased toward the front.',
    ARB:       total>0?'Reduce the Mech Balance Target or shift ARB Bias toward front-heavy.':'Raise the Mech Balance Target or shift ARB Bias toward rear-heavy.',
    'diff exit':  total>0?'Reduce rear exit lock in the Differential section.':'Increase rear exit lock to add rotation under power.',
    'diff entry': total>0?`Increase ${diffLayout==='FWD'?'front':'rear'} entry lock — more decel lock resists oversteer.`:`Reduce ${diffLayout==='FWD'?'front':'rear'} entry lock to allow freer rotation on entry.`,
    'diff front': total>0?'Reduce front accel lock in the AWD Differential section.':'Raise front accel lock.',
    'diff rear':  total>0?'Reduce rear accel lock in the AWD Differential section.':'Raise rear accel lock.',
    ...(uiMode==='pro'?{brakes:total>0?'Add more front brake bias to reduce entry rotation.':'Reduce front brake bias to add entry rotation.'}:{}),
    damping:   total>0?'Increase front rebound (Damping Bias toward positive) to resist forward weight transfer.':'Reduce front rebound bias.',
  };
  const tip=abs<3
    ? 'Setup is well balanced.'+(domBig?' Keep an eye on '+dom.name.toUpperCase()+' if the car feels inconsistent.':'')
    : (domBig?(domTips[dom.name]||'Adjust the dominant contributor.'):'Adjust Balance Target or ARB Bias.');
  const hints={
    springs:'Spring roll-stiffness bias vs weight distribution. + = oversteer (rear springs relatively stiffer). − = understeer (front springs relatively stiffer).',
    ARB:'ARB roll-stiffness bias vs weight distribution. + = oversteer (rear ARBs relatively stiffer). − = understeer (front ARBs relatively stiffer).',
    'diff front':'AWD front diff net contribution (accel+decel). Front lock pushes understeer (−). Center split and front weight fraction are factored in.',
    'diff rear':'AWD rear diff net contribution (accel+decel). Accel lock pushes oversteer (+); decel lock resists it, pushing understeer (−). Center split and rear weight fraction are factored in.',
    'diff exit':diffLayout==='FWD'?'Front accel lock on-throttle exit. Higher lock = more understeer (−).':'Rear accel lock on-throttle exit. Higher lock = more oversteer (+).',
    'diff entry':diffLayout==='FWD'?'Front decel lock off-throttle entry. Higher lock = more entry understeer (−).':'Rear decel lock off-throttle entry. Higher lock resists lift-off oversteer, pushing understeer (−).',
    brakes:'Brake-balance contribution to entry. High front bias = understeer on entry (−). Low front bias (rear-biased) = oversteer tendency (+). Based on deviation from 50% neutral.',
    damping:'Damping bias contribution. More front rebound damping resists weight transfer off the front, producing understeer tendency (−). More rear damping does the opposite (+).',
  };
  const labelMap={'diff front':'DIFF F','diff rear':'DIFF R','diff exit':'DIFF EXIT','diff entry':'DIFF ENTRY','brakes':'BRAKES','damping':'DAMP'};
  const mechGroup=contributors.filter(c=>c.name==='springs'||c.name==='ARB');
  const dynGroup=contributors.filter(c=>c.name!=='springs'&&c.name!=='ARB');
  const GroupSection=({title,items})=>items.length===0?null:(
    <div style={{marginBottom:6}}>
      <div style={{fontSize:9,color:'#475569',letterSpacing:2,marginBottom:3,paddingBottom:2,
                   borderBottom:'1px solid #0f172a'}}>{title}</div>
      {items.map(({name,val})=>{
        const isDom=name===dom.name&&domBig;
        return <BiasSeg key={name} label={labelMap[name]??(name.toUpperCase())} val={val}
          hint={hints[name]??''} primary={isDom} totalAbs={totalAbs}/>;
      })}
    </div>
  );
  return(
    <div>
      {/* tip first — most actionable info at the top */}
      <div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6,padding:'6px 8px',marginBottom:8,
                   background:'#020617',borderRadius:2,border:'1px solid #0f172a'}}>{tip}</div>
      {/* contributors grouped: MECHANICAL (intentional setup) vs DYNAMIC (phase/behaviour) */}
      <GroupSection title="MECHANICAL" items={mechGroup}/>
      <GroupSection title="DYNAMIC" items={dynGroup}/>
      {/* grip balance context — physical at-limit tendency from LLT model */}
      {uiMode==='pro'&&gripBalance!=null&&Math.abs(gripBalance-0.5)>0.03&&<div style={{
          fontSize:10,color:'#4b5563',lineHeight:1.5,marginBottom:6,
          padding:'4px 8px',borderLeft:'2px solid #1e293b'}}>
        GRIP BIAS {gripBalance.toFixed(2)} — physical handling at limit
        {gripBalance<0.45?' (understeer-prone chassis — more suspension correction needed for neutral limit balance)':
         gripBalance>0.55?' (oversteer-prone chassis — less correction needed to achieve rotation)':''}
      </div>}
      <div style={{fontSize:10,color:'#475569',lineHeight:1.5,marginTop:4}}>
        Roll-stiffness and differential contributions. Alignment also affects balance.
      </div>
    </div>
  );
};

const CheckerModal=({onClose,lim,units,ch,setCh,setFe,onImportDna,initialMode})=>{
  const mMass=units.mass==='kg',su=springUnit(units.spring);
  // A physical-unit game mode has no click ceiling, so the inputs here take BeamNG's own
  // units — N/m springs and anti-roll rate, N/m/s damping — which also means computeCheck
  // must not divide the damping calibration back out. Seeds differ by orders of magnitude
  // between the two, so they key off the same flag rather than being hardcoded. Seed values
  // are the stock figures observed on a test vehicle.
  const phys=lim.damping==null;
  const[ckMode,setCkMode]=useState(initialMode??'decode');
  const[probeHz,setProbeHz]=useState(2.5);
  // MEASURE ARB: Forza's mech balance with the bars rear-biased (A) and front-biased (B).
  const[arbReadA,setArbReadA]=useState(null);
  const[arbReadB,setArbReadB]=useState(null);
  const[ckSpr,setCkSpr]=useState(phys?{f:70000/LB_IN_TO_NM,r:200000/LB_IN_TO_NM}:{f:400,r:300});
  const[ckDmp,setCkDmp]=useState(phys?{rebF:16000,rebR:10000,bumpF:6000,bumpR:4000}
                                     :{rebF:5,rebR:5,bumpF:3,bumpR:3});
  const[ckArb,setCkArb]=useState(phys?{f:40000,r:60000}:{f:20,r:20});
  const[imported,setImported]=useState(false);
  const[dnaSet,setDnaSet]=useState(false);
  const flash=set=>{set(true);setTimeout(()=>set(false),2000);};
  const pS=k=>v=>setCkSpr(p=>({...p,[k]:v}));
  const pD=k=>v=>setCkDmp(p=>({...p,[k]:v}));
  const pA=k=>v=>setCkArb(p=>({...p,[k]:v}));
  const masses=useMemo(()=>cornerMasses(ch),[ch]);
  const ck=useMemo(()=>computeCheck(ckSpr,ckDmp,masses,phys?1:DAMPING_CALIBRATION),[ckSpr,ckDmp,masses,phys]);
  // The Damping Bias the decoded front/rear ζ split asks for, before the slider's ±50 clamps it.
  // Read by decodedFe and shown below when it doesn't fit, because the alternative is handing
  // back a damper split that is not the one you typed and saying nothing about it.
  const biasWanted=ck.zRebF>0?Math.round(100*(1-ck.zRebR/ck.zRebF)):0;
  // The decoded numbers as one fe patch, shared by both buttons below: IMPORT TUNE writes it to
  // the sidebar, IMPORT AS DNA measures the tune it produces and hands the axes to the DNA
  // editor. One function so the two can never read the same inputs differently.
  const decodedFe=prev=>{
    const hzF=clampHz(ck.hF);
    const hzR=clampHz(ck.hR);
    const mult=Math.max(0.5,Math.min(3.0,Math.round((hzR/hzF)*100)/100));
    // The FRONT axle is the anchor because the patch below writes rideRef:'front', and STANDARD's
    // exact-anchor axle follows Ride Reference — so zetaF lands on reboundZeta and the rear is
    // whatever dampingBias makes of it: zetaR = zetaF·(1 − dampingBias/100). Both halves have to
    // agree with that one formula. Anchoring instead to whichever axle damps harder (what this
    // did until the Ride-Reference change landed) puts the rear's ζ on the front, and a bias
    // scaled 200·(1−ratio) moves the rear twice as far as asked; see docs/HISTORY.md.
    const reboundZeta=Math.max(10,Math.min(200,Math.round(ck.zRebF)));
    // ±50 is the slider's range, so a rear axle outside 0.5..1.5× the front's ζ lands at the end
    // of it rather than on its real split. Nothing in the app can express that spread, so the
    // card warns instead of pretending.
    const dampingBias=Math.max(-50,Math.min(50,biasWanted));
    // Bump anchors on the front for the same reason, and RATIO then gives the rear bump the same
    // dampingBias split rebound got. A tune whose bump split differs from its rebound split is
    // therefore not exactly reproducible — one slider drives both — which the DECODED TUNE card's
    // hint states outright.
    const bumpRatio=Math.max(10,Math.min(100,Math.round(ck.zRebF>0?ck.zBmpF/ck.zRebF*100:56)));
    return{...prev,
      rideStiffness:Math.round(hzF*100)/100,
      rideRef:'front',rearHzMode:'multiplier',rearHzMult:mult,
      dampingMode:'ratio',dampCharMode:'zeta',dampBalMode:'standard',
      reboundZeta,bumpRatio,dampingBias,
      arbBalMode:'manual',
      arbMode:'man',
      // fe.arbMan* is always roll stiffness; the physical inputs above are BeamNG's linear
      // N/m, so invert k = 2·rs/(track·mr)² on the way in — the same ARB Motion Ratio the
      // output card and MAN entry use, or an imported tune reads back at a different rate.
      arbManF:phys?Math.max(0,ckArb.f*ch.trackF*ch.trackF*mrDiv(ch.arbMotionRatioF)/2):Math.max(1,Math.min(lim.arb,ckArb.f)),
      arbManR:phys?Math.max(0,ckArb.r*ch.trackR*ch.trackR*mrDiv(ch.arbMotionRatioR)/2):Math.max(1,Math.min(lim.arb,ckArb.r))};
  };
  const importDecoded=()=>{setFe(decodedFe);flash(setImported);};
  // Overwrites the DNA editor's draft and nothing else — the sidebar tune is left where it is.
  const importDecodedDna=()=>{onImportDna(decodedFe);flash(setDnaSet);};
  const probeMasses=useMemo(()=>cornerMasses(ch),[ch]);
  const probeRateF=useMemo(()=>(2*Math.PI*probeHz)**2*probeMasses.front/LB_IN_TO_NM,[probeHz,probeMasses]);
  const probeRateR=useMemo(()=>(2*Math.PI*probeHz)**2*probeMasses.rear /LB_IN_TO_NM,[probeHz,probeMasses]);
  // MEASURE ARB's two setups: one bar at 70% of the ceiling, the other at 1, then swapped.
  // Each reading solves for a scale on its own; they are averaged because a single 2dp reading
  // moves the answer by several percent, and the swap cancels any front/rear bias in the model.
  const arbProbeHi=lim?.arb?Math.round(0.7*lim.arb):null;
  const arbScaleA=arbProbeHi&&arbReadA!=null?solveArbScale(ch,probeHz,1,arbProbeHi,arbReadA):null;
  const arbScaleB=arbProbeHi&&arbReadB!=null?solveArbScale(ch,probeHz,arbProbeHi,1,arbReadB):null;
  const arbScaleNew=arbScaleA!=null&&arbScaleB!=null?(arbScaleA+arbScaleB)/2:null;
  return(
    <div style={{position:'fixed',inset:0,background:'#000c',zIndex:999,
                 display:'flex',alignItems:'center',justifyContent:'center'}}
         onClick={onClose}>
      <div style={{background:'#020617',border:'1px solid #1e293b',borderRadius:2,
                   width:660,maxWidth:'calc(100vw - 20px)',maxHeight:'88vh',display:'flex',flexDirection:'column',overflow:'hidden'}}
           onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                     padding:'8px 14px',borderBottom:'1px solid #1e293b',flexShrink:0}}>
          <span style={{fontSize:12,color:'#9ca3af',letterSpacing:2}}>TUNE CHECK</span>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            <button className="tbtn" style={{fontSize:9,color:ckMode==='decode'?'#e2e8f0':'#475569'}}
              onClick={()=>setCkMode('decode')}>DECODE</button>
            <button className="tbtn" style={{fontSize:9,color:ckMode==='probe'?'#60a5fa':'#475569'}}
              onClick={()=>setCkMode('probe')}>MEASURE</button>
            <button onClick={onClose} style={{background:'none',border:'none',color:'#94a3b8',
                                             cursor:'pointer',fontSize:17,lineHeight:1}}>✕</button>
          </div>
        </div>
        <div style={{padding:14,flex:1,minHeight:0,overflowY:'auto',overscrollBehavior:'contain'}}>
          {ckMode==='decode'&&<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:10,marginBottom:10}}>
            <Card title="HOW TO USE">
              <div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6}}>
                <div style={{color:'#e2e8f0',letterSpacing:1,fontSize:9,marginBottom:2}}>PURPOSE</div>
                <div style={{marginBottom:8}}>Bring in a tune you don't have a share code for — copied off a screenshot, a forum post, or read straight from the game's values — by matching its raw spring/damper/ARB numbers here.</div>
                <div style={{color:'#e2e8f0',letterSpacing:1,fontSize:9,marginBottom:2}}>ENTER</div>
                <div style={{marginBottom:8}}>Fill in the cards below with those raw values. Vehicle Mass stays synced with the sidebar; the rest are the tune's numbers as-is.</div>
                <div style={{color:'#e2e8f0',letterSpacing:1,fontSize:9,marginBottom:2}}>IMPORT TUNE</div>
                <div style={{marginBottom:8}}>Keeps the numbers. DECODED TUNE is how the app reads them in its own Hz + ζ model; IMPORT TUNE writes that onto this car, replacing its RIDE, DAMPERS and ANTI-ROLL BARS. It comes back close rather than exact, so review those sections afterward.</div>
                <div style={{color:'#e2e8f0',letterSpacing:1,fontSize:9,marginBottom:2}}>IMPORT AS DNA <span style={{color:'#475569'}}>· PRO</span></div>
                <div>Keeps the handling. IMPORT AS DNA reads the decoded tune back as handling targets and loads them into the DNA editor (sidebar DNA button) — this car doesn't change. APPLY it here, or on another car to carry the handling across.</div>
              </div>
            </Card>
            <Card title="VEHICLE MASS" hint="Synced with the CHASSIS Weight and Front Weight Bias fields in the sidebar — editing either place updates both.">
              <Field label="Weight"
                value={mMass?ch.weight/KG_TO_LB:ch.weight}
                onChange={mMass?v=>setCh(p=>({...p,weight:v*KG_TO_LB})):v=>setCh(p=>({...p,weight:v}))}
                min={mMass?45:100} max={mMass?8165:18000} step={1}
                unit={mMass?'kg':'lb'} logScale={true} logMid={mMass?2722:6000}/>
              <Field label="Front Bias" value={ch.frontBias} onChange={v=>setCh(p=>({...p,frontBias:v}))} min={30} max={70} step={1} unit="%"/>
              <Stat label="Corner mass front" value={masses.front} unit="kg"/>
              <Stat label="Corner mass rear" value={masses.rear} unit="kg"/>
            </Card>
            <Card title="ARB INPUTS" hint={phys
              ?"Anti-Roll Spring Rate in N/m, copied straight off BeamNG's slider. Converted to roll stiffness internally by rs = k·track²/2, so the chassis track widths matter here."
              :"ARB clicks are entered directly — no conversion needed, same units as the in-game tune."}>
              {[['ARB Front','f'],['ARB Rear','r']].map(([lbl,k])=>(
                <Field key={k} label={lbl} value={ckArb[k]} onChange={pA(k)}
                  min={phys?0:1} max={phys?200000:lim.arb} step={phys?500:0.1}
                  unit={phys?'N/m':`/ ${lim.arb}`}/>
              ))}
            </Card>
            <Card title="SPRING INPUTS">
              {/* Physical modes always take N/m regardless of the UNITS spring choice, because that
                  is the unit BeamNG's slider and this mode's SPRINGS card both use — asking
                  for lb/in here while printing N/m there would break the round-trip.
                  LB_IN_TO_NM is N/m per lb/in; NMM_PER_LBIN is the MET toggle's N/mm.
                  One `conv` drives value/onChange/min/max so the round-trip stays symmetric.
                  MET carries a decimal and a 0.1 step to match Forza's own "N/mm" readout
                  (which is 10× true N/mm — see NMM_PER_LBIN). */}
              {[['Spring Rate Front','f'],['Spring Rate Rear','r']].map(([lbl,k])=>{
                const conv=phys?LB_IN_TO_NM:su.f;
                const dp=phys?0:su.dp;
                const converted=conv!==1;
                return <Field key={k} label={lbl}
                  value={converted?+(ckSpr[k]*conv).toFixed(dp):ckSpr[k]}
                  onChange={converted?v=>pS(k)(v/conv):pS(k)}
                  min={+(50*conv).toFixed(dp)} max={+(2500*conv).toFixed(dp)}

            </Card>
            <Card title="DAMPING INPUTS">
              {[['Rebound Front','rebF'],['Rebound Rear','rebR'],
                ['Bump Front','bumpF'],['Bump Rear','bumpR']].map(([lbl,k])=>(
                <Field key={k} label={lbl} value={ckDmp[k]} onChange={pD(k)}

            </Card>
            <Card title="DECODED TUNE" accent

              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4,marginBottom:6}}>

              <Stat label="ARB rear"  value={ckArb.r} unit={phys?'N/m':`/ ${lim.arb}`} decimals={phys?0:1}/>
              {Math.abs(biasWanted)>50&&<div style={{fontSize:9,color:'#f59e0b',marginTop:6,letterSpacing:0.3,lineHeight:1.5}}>
                This split needs a Damping Bias of {biasWanted>0?'+':''}{biasWanted}, past the slider's ±50.

              <div style={{display:'flex',gap:4,marginTop:8}}>

                <button className={`tbtn${imported?' saved':''}`} style={{flex:1,fontSize:10}}

                  onClick={importDecoded}>{imported?'IMPORTED ✓':'IMPORT TUNE'}</button>
                <button className={`tbtn${dnaSet?' saved':''}`} disabled={!onImportDna}
                  style={{flex:1,fontSize:10,opacity:onImportDna?1:0.35}}
                  title={onImportDna
                    ?"Reads this tune back as a handling DNA and replaces the DNA editor's draft. This car's own settings are left alone — edit the axes there, then APPLY, or carry the DNA onto another car."
                    :'Vehicle DNA is PRO only — switch tier to use it.'}
                  onClick={importDecodedDna}>{dnaSet?'DNA SET ✓':'IMPORT AS DNA'}</button>
              </div>
            </Card>
          </div>}
          {ckMode==='probe'&&<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:10,marginBottom:10}}>
            <Card title="HOW TO USE">
              <div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6}}>
                <div style={{color:'#e2e8f0',letterSpacing:1,fontSize:9,marginBottom:2}}>SETUP</div>
                <div style={{marginBottom:8}}>Apply the spring and ARB values shown in the setup to your car in Forza.</div>
                <div style={{color:'#e2e8f0',letterSpacing:1,fontSize:9,marginBottom:2}}>MEASURE</div>
                <div style={{marginBottom:8}}>Open the tune menu and note the <span style={{color:'#e2e8f0'}}>Mech Balance</span> value.</div>
                <div style={{color:'#e2e8f0',letterSpacing:1,fontSize:9,marginBottom:2}}>RECORD</div>
                <div>Dial the <span style={{color:'#e2e8f0'}}>MEAS. NAT BAL</span> slider to match, then close this window. No track widths needed for balance — the calculator uses your reading in their place. Wheelbase is still used separately for the flat-ride and brake balance calculations.</div>
              </div>
            </Card>
            <Card title="NAT BAL SETUP" accent>
              <Field label="Measure Hz" value={probeHz} onChange={setProbeHz} min={1.0} max={3.5} step={0.05} unit="Hz"/>
              <Stat label="Corner mass front" value={probeMasses.front} unit="kg" decimals={1}/>
              <Stat label="Corner mass rear"  value={probeMasses.rear}  unit="kg" decimals={1}/>
              <Stat label="Spring front" value={probeRateF*su.f} unit={su.label} decimals={Math.max(1,su.dp)}/>
              <Stat label="Spring rear"  value={probeRateR*su.f} unit={su.label} decimals={Math.max(1,su.dp)}/>

              <div style={{marginTop:8,paddingTop:8,borderTop:'1px solid #1e293b'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}}>
                  <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>MEAS. NAT BAL</span>
                  <span style={{display:'flex',alignItems:'center',gap:6}}>
                    {!ch.useMeasuredNatBal&&<span style={{fontSize:10,color:'#475569',letterSpacing:1}}>NOT SET</span>}
                    <NumBox value={ch.measuredNatBal??0.50} min={0.30} max={0.90} dp={2} label="Measured natural balance"
                      onCommit={v=>setCh(p=>({...p,useMeasuredNatBal:true,measuredNatBal:v,measuredNatBalHz:probeHz}))}/>
                  </span>
                </div>
                <input type="range" className="sli" min={0.30} max={0.90} step={0.01}
                  value={ch.measuredNatBal??0.50}
                  onChange={e=>setCh(p=>({...p,useMeasuredNatBal:true,measuredNatBal:parseFloat(e.target.value),measuredNatBalHz:probeHz}))}
                  style={{width:'100%'}}/>
              </div>
            </Card>
            <Card title="ARB SCALE SETUP" accent>
              {!lim?.arb?<div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6}}>Forza only — BeamNG's anti-roll values are already in physical units.</div>
              :!ch.useMeasuredNatBal?<div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6}}>Set MEAS. NAT BAL first. This reading is measured against it, on the same springs.
                {arbScaleStale(ch)&&<div style={{fontSize:10,color:'#f59e0b',marginTop:4}}>A measured scale ({Math.round(arbScaleOf(ch))}) is still in use but its NAT BAL was cleared — RE-MEASURE.</div>}</div>
              :<>
                <div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6,marginBottom:8}}>
                  Forza scales its ARB slider differently on every car. This finds how much one click is worth on this one,
                  so bar-driven balance lands where the game shows it.
                  <ol style={{margin:'6px 0 0',paddingLeft:18}}>
                    <li>In Forza, keep the springs from NAT BAL SETUP above. Don't touch springs, ride height or tyres between readings.</li>
                    <li>Set front ARB {1} and rear ARB {arbProbeHi}. Type the Mech Balance Forza shows into the first box, then press Enter.</li>
                    <li>Swap them: front {arbProbeHi}, rear {1}. Type that reading into the second box.</li>
                    <li>Once both are in, Click scale updates. Press APPLY. It's saved with this car's chassis.</li>
                  </ol>
                  <div style={{marginTop:6}}>Type exactly what Forza displays (two decimals). Both readings are needed; the scale is their average.
                  RESET goes back to the default. If you change MEAS. NAT BAL later, re-measure this too.</div></div>
                {[['A',1,arbProbeHi,arbReadA,setArbReadA,arbScaleA],['B',arbProbeHi,1,arbReadB,setArbReadB,arbScaleB]].map(([k,f,r,val,set,sc])=>(
                  <div key={k} style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                    <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>ARB {f} / {r}</span>
                    <span style={{display:'flex',alignItems:'center',gap:6}}>
                      {val!=null&&sc==null&&<span style={{fontSize:10,color:'#f59e0b',letterSpacing:1}}>CHECK</span>}
                      <NumBox value={val??NaN} placeholder="0.00" min={0.05} max={0.95} dp={2} label={`Mech balance with ARB ${f} / ${r}`} onCommit={set}/>
                    </span>
                  </div>))}
                {((arbReadA!=null&&arbScaleA==null)||(arbReadB!=null&&arbScaleB==null))&&
                  <div style={{fontSize:10,color:'#f59e0b',lineHeight:1.5,marginBottom:6}}>
                    That reading doesn't fit any plausible bar stiffness. Check the bars, springs and MEAS. NAT BAL match this card.</div>}
                <Stat label="Click scale" value={arbScaleNew??arbScaleOf(ch)} unit="" decimals={0}/>
                <div style={{display:'flex',gap:4,marginTop:8}}>
                  <button className="tbtn" style={{flex:1,fontSize:10,opacity:arbScaleNew!=null?1:0.35}} disabled={arbScaleNew==null}
                    title="Use this click scale for this car's ARBs. Saved with the chassis and shared in its build code."
                    onClick={()=>setCh(p=>({...p,useMeasuredArbClick:true,measuredArbClick:Math.round(arbScaleNew),
                      measuredArbNat:p.measuredNatBal,measuredArbNatHz:p.measuredNatBalHz??NAT_BAL_REF_HZ}))}>APPLY</button>
                  <button className="tbtn" style={{flex:1,fontSize:10,opacity:ch.useMeasuredArbClick?1:0.35}} disabled={!ch.useMeasuredArbClick}
                    title={`Go back to the default click scale (${ARB_RS_SCALE}).`}
                    onClick={()=>setCh(p=>({...p,useMeasuredArbClick:false,measuredArbClick:null,measuredArbNat:null,measuredArbNatHz:null}))}>RESET</button>
                </div>
                <div style={{fontSize:10,color:'#475569',letterSpacing:1,marginTop:6}}>
                  {ch.useMeasuredArbClick?`MEASURED ${Math.round(arbScaleOf(ch))}`:`DEFAULT ${ARB_RS_SCALE}`}
                  {arbScaleStale(ch)&&<span style={{color:'#f59e0b'}}> · RE-MEASURE</span>}</div>
                {arbScaleStale(ch)&&<div style={{fontSize:10,color:'#f59e0b',lineHeight:1.5,marginTop:4}}>
                  MEAS. NAT BAL has changed since this scale was measured ({ch.measuredArbNat.toFixed(2)} at {(ch.measuredArbNatHz??NAT_BAL_REF_HZ).toFixed(2)} Hz).
                  It's still in use; take both readings again and APPLY.</div>}
              </>}
            </Card>
          </div>}
        </div>
      </div>
    </div>
  );
};
