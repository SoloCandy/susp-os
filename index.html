  const bChassis=-100*(gripNeutralSplitOf(ch)-natOffset-(1-nf));
  // Roll-stiffness rear fraction — matches what Forza displays as "Mech Balance".
  const rsKf=rsSpF+rsAbF,rsKr=rsSpR+rsAbR;
  const rsBalance=rsKf+rsKr>0?rsKr/(rsKf+rsKr):1-ch.frontBias/100;
  // What Forza displays: in the Forza modes each tyre sits in series with its axle (displayRsBalance),
  // which the solvers above don't model — solveTune closes that gap for the target-seeking modes.
  // Physical modes stay suspension-only. Both add the tyre-width and MEASURE NAT BAL corrections.
  const mechBalance=Math.max(0,Math.min(1,physUnits?rsBalance+tireCorr+natOffset
    :displayRsBalance(ch,rsKf,rsKr)+tireCorr+displayNatOffsetOf(ch)));
  // Physical at-limit balance from the LLT model. The grip model wants the REAL car's split, and
  // rsBalance is model space, so the measured offset goes back on (natRsOf does the same).
  const gripBalance=balanceFromRsBal(ch,rsBalance+natOffset);
  // MAN ARB stiffness bypasses the budget/split solve entirely (see arbMode==='man' branch
  // above), so a leftover arbBalMode of mech/coSolve from before switching to MAN must not
  // trigger this "target unreachable" warning — nothing is actually solving toward it.
  const mechBalClamped=arbMode!=='man'&&(arbBalMode==='mech'||arbBalMode==='coSolve')&&Math.abs(mechBalance-arbBalTarget)>0.01;
  // "ARB maxed, can't fully cancel" only means something against a ceiling. Physical modes
  // can always supply whatever roll stiffness NEUTRAL asks for, so the warning never fires.
  const neutralClamped=!physUnits&&arbBalMode==='neutral'&&(arbF<=1||arbF>=lim.arb||arbR<=1||arbR>=lim.arb);
  const settleF=settleTimeFromZeta(zetaF,fHz);
  const settleR=settleTimeFromZeta(zetaR,effectiveRHz);
  // CO-SOLVE contribution breakdown: how much of balance correction came from springs vs ARBs
  const rsBalSp=rsSpF+rsSpR>0?rsSpR/(rsSpF+rsSpR):0; // spring-only roll balance (after CO-SOLVE Hz adjustment)
  const coSolveSpCorr=arbBalMode==='coSolve'&&coSolveR_baseline!=null?rsBalSp-coSolveR_baseline:null;
  const coSolveAbCorr=arbBalMode==='coSolve'&&coSolveR_baseline!=null?rsBalance-rsBalSp:null;
  const coSolveLiftRisk=arbBalMode==='coSolve'&&effectiveRHz>fHz*1.20;
  // 0.1 is the resolution of a Forza damper click. It means nothing for an N·s/m
  // coefficient, so physical modes return full precision and let the display layer
  // decide how many decimals to show.
  const r1=v=>physUnits?v:Math.round(v*10)/10;
  return{springF,springR,
         rebF:r1(rebF),rebR:r1(rebR),
         bumpF:r1(bumpF),bumpR:r1(bumpR),
         arbF,arbR,
         fHz,rHz:effectiveRHz,settleF,settleR,rollDeg,rollTarget:arbTargetRoll,rollClamped,shareClamped,arbShareTol,mechBalClamped,neutralClamped,dampingClamped,
         arbShare:arbShareOut,
         bSp,bAb,bTot,bChassis,mechBalance,gripBalance,
         rsSpF,rsSpR,rsAbF,rsAbR,
         balArbSplit:(arbBalMode==='mech'||arbBalMode==='coSolve'||arbBalMode==='neutral'||arbBalMode==='chassis')?Math.round(rF*100):null,
         zetaF,zetaR,bumpZetaF,bumpZetaR,
         coSolveAutoS,coSolveSpCorr,coSolveAbCorr,coSolveLiftRisk};
};

// The whole solve: feelToPhysics then computeTune. In the Forza modes the solvers work in suspension
// space while the reported balance is the tyre-series display, so a target-seeking mode would land
// short of its target. This re-runs the solve with an adjusted internal target (secant) until the
// DISPLAYED balance meets the one asked for, or gets as close as the springs and bars allow — then
// judges mechBalClamped against the target the user asked for. Physical (BeamNG) modes run the same
// loop: there is no display offset there, but the 500 N/m spring snap and the front-Hz snap after
// CO-SOLVE's rear solve still move the final balance off the target the solvers aimed at. fe must be feEffective (absolute
// arbBalTarget). Every caller goes through here so Vehicle DNA and the live tune agree.
// RANGE and GRIP modes in a Forza mode aim at the grip neutral (or the RANGE band built from it) at
// each run's own roll stiffness (see gripNeutralOf) rather than at fe.arbBalTarget, which was
// resolved at the probe springs; the value it ended up aiming at comes back as `target`. Physical
// modes' neutral has no stiffness term. `build` is dr.buildType, which RANGE's band needs.
const solveTune=(ch,fe,gameMode,build)=>{
  const run=tgt=>{const f=tgt==null?fe:{...fe,arbBalTarget:tgt};const physics=feelToPhysics(ch,f);
    return{physics,tune:computeTune(ch,physics,gameMode)};};
  const first=run(null);
  if(fe.arbBalTarget==null||!hasBalTargetSolve(fe))return first;
  const anchored=balTargetAnchoredMode(fe)&&!isPhysical(gameMode);
  const wantOf=anchored?t=>balTargetAnchoredOf(ch,fe,gameMode,build,rollKOf(t))
    :(w=>()=>w)(clampBalTarget(fe.arbBalTarget));
  const errOf=r=>r.tune.mechBalance-wantOf(r.tune);
  let best=first,bestErr=Math.abs(errOf(first));
  let x0=clampBalTarget(fe.arbBalTarget),y0=errOf(first),x1=clampBalTarget(x0-y0);
  for(let i=0;i<8&&bestErr>0.0005;i++){
    const r=run(x1),y1=errOf(r);
    if(Math.abs(y1)<bestErr){best=r;bestErr=Math.abs(y1);}
    if(Math.abs(y1-y0)<1e-9)break;
    const x2=clampBalTarget(x1-y1*(x1-x0)/(y1-y0));
    if(x2===x1)break;
    x0=x1;y0=y1;x1=x2;
  }
  const clamped=(fe.arbMode??'auto')!=='man'&&(fe.arbBalMode==='mech'||fe.arbBalMode==='coSolve')&&bestErr>0.01;
  return{physics:best.physics,tune:{...best.tune,mechBalClamped:clamped},target:wantOf(best.tune)};
};
const computeAlignment=(ch,tune,layout,buildType)=>{
  const{fHz,rHz,rollDeg}=tune;
  const build=buildType??'track';
  const isDrift=build==='drift';
  const isStreet=build==='street';
  const isRally=build==='rally';
  const isOffroad=build==='offroad';
  const isDrag=build==='drag';

  const camberGain=Math.max(0.55,Math.min(0.85,1.05-(ch.cgHeight??0.45)*0.8));
  const rearGainMult=layout==='FWD'?0.50:layout==='AWD'?0.70:0.75;
  const fwdReduction=layout==='FWD'?0.3:0.0;

  // Drift wants more static camber than Track for sustained high-slip-angle grip; Drag wants
  // near-zero for a flat straight-line contact patch. Both now scale with actual roll/CG like
  // every other build instead of being frozen constants (see docs/HISTORY.md).
  const optimalCamber=isDrift?-2.5:isDrag?-0.2:isOffroad?-0.3:isRally?-0.8:isStreet?-1.0:-1.5;
  const recCamberF=Math.round(Math.max(-4.0,Math.min(0.0,
    optimalCamber - rollDeg*camberGain + fwdReduction))*10)/10;
  const recCamberR=Math.round(Math.max(-3.5,Math.min(0.0,
    optimalCamber - rollDeg*camberGain*rearGainMult))*10)/10;

  const toeFByBuild={
    street:  layout==='FWD'?0.05:0.0,
    track:   layout==='FWD'?0.05:-0.05,
    drift:   layout==='FWD'?0.0:-0.10,
    rally:   0.0,
    offroad: 0.05,
    drag:    0.0,
  }[build]??-0.05;
  const recToeF=Math.round(Math.max(-0.20,Math.min(0.15,
    toeFByBuild+(ch.frontBias-50)*-0.003+(fHz-1.8)*0.010))*10)/10;

  const toeRByBuild={
    street:  {RWD:0.15,AWD:0.08,FWD:0.05},
    track:   {RWD:0.10,AWD:0.08,FWD:0.05},
    drift:   {RWD:0.05,AWD:0.05,FWD:0.05},
    rally:   {RWD:0.10,AWD:0.08,FWD:0.05},
    offroad: {RWD:0.15,AWD:0.15,FWD:0.10},
    drag:    {RWD:0.0, AWD:0.0, FWD:0.0},
  }[build]??{RWD:0.10,AWD:0.08,FWD:0.05};
  const toeRBase=toeRByBuild[layout]??toeRByBuild.RWD;
  const recToeR=Math.round(Math.max(0.0,Math.min(0.25,
    toeRBase+((1-ch.frontBias/100)-0.5)*0.20+Math.max(0,rHz-fHz)*-0.03))*10)/10;

  const casterBase=isDrift?4.8:isDrag?4.0:isOffroad?4.5:isStreet?5.2:5.8;
  const recCaster=parseFloat(Math.max(4.0,Math.min(7.5,
    casterBase+(fHz-1.8)*0.4+(ch.frontBias-50)*0.04+(layout==='FWD'?-0.5:0))).toFixed(1));

  return{recCamberF,recCamberR,recToeF,recToeR,recCaster};
};

const DIFF_BIAS_SCALE=0.14; // slightly higher — AWD contributions now split by center fraction
const DIFF_TYPE_ENC={'race':0,'sport':1,'rally':2,'offroad':3,'drift':4};
const DIFF_TYPE_DEC=['race','sport','rally','offroad','drift'];
// Community-estimated scale factors: same lock % on Race produces more effective lock than Rally/Offroad.
// Rally ≈ 76% of Race, Offroad ≈ 52% of Race. Sport is accel-only and slightly softer than Race.
// Drift is more aggressive than Race — faster lock engagement, tuned for rotation over stability.
// So a scale is EFFECTIVE lock per lock %: effective = % × scale, and the % that gives a wanted
// effective lock is effective ÷ scale. computeDiff's AUTO divides by it and its balance multiplies
// by it; DIFF_TYPE_RANGES below are Race's ranges divided by it. AUTO used to MULTIPLY, which
// asked a gentler diff for LESS % and compounded the softness (see docs/HISTORY.md).
const DIFF_TYPE_SCALE={race:1.00,sport:0.88,rally:0.76,offroad:0.52,drift:1.10};
const DIFF_TYPE_RANGES={
  race:   {accel:[25,60],frontAccel:[18,32],rearAccel:[25,60],decel:[8,25]},
  sport:  {accel:[28,68],frontAccel:[20,36],rearAccel:[28,68],decel:null},
  rally:  {accel:[33,79],frontAccel:[24,42],rearAccel:[33,79],decel:[11,33]},
  offroad:{accel:[48,90],frontAccel:[35,62],rearAccel:[48,90],decel:[15,48]},
  drift:  {accel:[23,55],frontAccel:[16,29],rearAccel:[23,55],decel:[0,8]},
};

const computeDiff=(ch,fe,dr,natMechBalOverride=null)=>{
  const rB=1-ch.frontBias/100;
  const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,Math.round(v)));
  const biasExit=dr.diffBiasExit??0;       // rear exit intent (−50=grip, +50=rotate)
  const biasEntry=dr.diffBiasEntry??0;     // entry intent (−50=loose, +50=stable)
  const frontExitBias=dr.diffFrontExitBias??0; // AWD front exit push intent
  const build=dr.buildType??'track';
  const diffType=dr.diffType??'race';
  const typeScale=DIFF_TYPE_SCALE[diffType]??1.0;
  // AUTO works in effective (Race-equivalent) lock: each formula below, and its clamp, is the
  // lock a Race diff would need. lockPct turns that into the % to enter on the fitted diff type.
  // Race (scale 1) comes out exactly as cl() would round it.
  const clE=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const lockPct=eff=>Math.min(100,Math.round(eff/typeScale));

  // MATCH CHASSIS: bias the auto-solver's intent toward the chassis mech target.
  // Off by default; manual mode bypasses it entirely.
  let effBiasExit=biasExit, effBiasEntry=biasEntry;
  // Only while something solves toward the Balance Target. Otherwise the target is hidden (the
  // PRO BALANCE section says it does not apply) and resolves to the MECH_BALANCE_TARGET fallback,
  // so MATCH CHASSIS would bias the diff toward a number the user cannot see or set.
  if(dr.diffComplement&&!dr.diffManual&&hasBalTargetSolve(fe)){
    // The target is display space, so the natural it is measured from must be too. This used to
    // fall back to an inline GEOMETRY copy whenever the caller passed nothing — the app passed the
    // reading only when measured — so an unmeasured GRIP-mode gap was off by tireCorr and the
    // tyre-series compression. The override is kept for tests that pin a natural directly.
    const natMechBal=natMechBalOverride!=null?natMechBalOverride:natDisplayOf(ch,fe.gameMode);
    const tgt=fe.arbBalTarget; // fe is feEffective here — already resolved for every Balance Target mode
    const gap=tgt-natMechBal; // positive = user wants more rear/oversteer than natural
    // Cap correction so it can't dominate explicit user slider input
    const correction=Math.max(-25,Math.min(25,gap*150));
    // FWD's diffBiasExit/Entry are polarity-inverted vs RWD/AWD: more front lock means more
    // UNDERSTEER on a FWD car (see bDiffAccel/bDiffDecel in the balance formulas below), so
    // the correction must flip sign there or "more oversteer" targets would push FWD toward
    // more understeer instead.
    const signedCorrection=ch.layout==='FWD'?-correction:correction;
    effBiasExit =Math.max(-50,Math.min(50,biasExit +signedCorrection));
    effBiasEntry=Math.max(-50,Math.min(50,biasEntry+signedCorrection*0.5));
  }

  let vals;
  if(dr.diffManual){
    vals=ch.layout==='AWD'
      ?{layout:'AWD',
        frontAccel:dr.diffFrontAccel??25, frontDecel:dr.diffFrontDecel??0,
        rearAccel: dr.diffRearAccel??50,  rearDecel: dr.diffRearDecel??10,
        center:    dr.diffCenter??65}
      :{layout:ch.layout,
        accel:dr.diffAccel??35, decel:dr.diffDecel??10};
  } else if(ch.layout==='AWD'){
    const center=cl(dr.diffCenter??65,45,80); // slider-driven; default 65 is sensible across builds
    vals={layout:'AWD',
      frontAccel:lockPct(clE(28-effBiasExit*0.10+frontExitBias*0.12,10,40)),
      frontDecel:0,
      rearAccel: lockPct(clE(48+effBiasExit*0.25,20,70)),
      rearDecel: diffType==='sport'?0:lockPct(clE(8+(rB-0.5)*15+effBiasEntry*0.15,0,20)),
      center};
  } else {
    const isRWD=ch.layout==='RWD';
    const accelBase=isRWD
      ?{street:28,track:35,drift:48,rally:25,offroad:18,drag:65}[build]??35
      :{street:15,track:20,drift:12,rally:12,offroad:10,drag:20}[build]??20;
    const decelBase=isRWD
      ?{street:15,track:12,drift:3,rally:8,offroad:5,drag:0}[build]??12
      :{street:8, track:5, drift:2,rally:4,offroad:2,drag:0}[build]??5;
    // FWD's +effBiasExit*0.15 is intentionally the SAME sign as RWD's — do not flip it.
    // FWD's EXIT slider UI already inverts the stored value (the EXIT FeelSlider's value/onChange) so
    // "more effBiasExit" means the same thing (more lock) on every layout; the UI flip is
    // what makes the slider's right side mean oversteer-leaning despite FWD's opposite
    // lock-to-balance polarity. Flipping the sign here too would double-cancel that fix.
    const accel=isRWD
      ? lockPct(clE(accelBase+effBiasExit*0.20, 10, 65))
      : lockPct(clE(accelBase+effBiasExit*0.15,  5, 35));
    const decel=diffType==='sport'?0:lockPct(clE(decelBase+(rB-0.5)*(isRWD?15:5)+effBiasEntry*0.15, 0, isRWD?30:15));
    vals={layout:ch.layout,accel,decel};
  }

  const nf=ch.frontBias/100;
  let bDiffAccel=0, bDiffDecel=0, bDiffFront=0, bDiffRear=0;
  // The balance reads EFFECTIVE lock (% × the type's scale), in AUTO and MANUAL alike, so the same
  // % counts for less on a Rally or Offroad diff and AUTO's type conversion is balance-neutral.
  const bs=DIFF_BIAS_SCALE*typeScale;
  // positive = oversteer tendency, negative = understeer tendency
  if(vals.layout==='AWD'){
    const C=Math.max(0,Math.min(1,(vals.center??65)/100));
    const bFA=-vals.frontAccel*nf*(1-C)*bs;   // front accel → understeer (−)
    const bRA= vals.rearAccel*(1-nf)*C*bs;    // rear accel  → oversteer  (+)
    const bFD=-vals.frontDecel*nf*(1-C)*bs;   // front decel → understeer (−)
    const bRD=-vals.rearDecel*(1-nf)*C*bs;    // rear decel  → understeer (−) — resists lift-off oversteer
    bDiffFront=bFA+bFD;
    bDiffRear =bRA+bRD;
    bDiffAccel=bFA+bRA;
    bDiffDecel=bFD+bRD;
  } else if(vals.layout==='RWD'){
    bDiffAccel= vals.accel*(1-nf)*bs;  // rear accel → oversteer (+)
    bDiffDecel=-vals.decel*(1-nf)*bs;  // rear decel → understeer (−) — resists lift-off oversteer
  } else {
    bDiffAccel=-vals.accel*nf*bs;  // front accel → understeer (−)
    bDiffDecel=-vals.decel*nf*bs;  // front decel → understeer (−)
  }

  return{...vals,bDiffAccel,bDiffDecel,bDiffFront,bDiffRear};
};

// SOFT | ROAD | FIRM | RACE band boundaries (Hz). Single source of truth shared by
// the hzCtx badge, the RIDE spring dial zones, and the Ride Stiffness slider markers —
// change here and all three stay in sync.
const HZ_BANDS=[1.2,1.8,2.5];
const HZ_BAND_COLS=['#60a5fa','#22c55e','#f59e0b','#ef4444']; // SOFT, ROAD, FIRM, RACE
const hzCtx=hz=>{
  if(hz<HZ_BANDS[0])return['SOFT',HZ_BAND_COLS[0]];
  if(hz<HZ_BANDS[1])return['ROAD',HZ_BAND_COLS[1]];
  if(hz<HZ_BANDS[2])return['FIRM',HZ_BAND_COLS[2]];
  return['RACE',HZ_BAND_COLS[3]];
};
// Slider ticks at each band boundary, labelled with the band that begins there
// (SOFT is the implicit floor). Colour matches that band's hzCtx colour.
const HZ_MARKERS=HZ_BANDS.map((v,i)=>({value:v,color:HZ_BAND_COLS[i+1],
  label:['ROAD','FIRM','RACE'][i]}));
// ── Vehicle DNA ─────────────────────────────────────────────────────────────
// A chassis-portable handling personality: axis TARGETS, compiled into ordinary fe/dr fields in
// PRO's target modes, never a change to feelToPhysics/computeTune. Core only — App does not call
// any of this yet; tests-dna.js is its consumer until the UI lands. docs/DNA.md is the spec and
// carries the reasoning behind every mode choice below.

// Each range is the sanitizeTune clamp of the field the axis compiles into, so a compiled patch is
// always a sanitizeTune fixed point (tests-dna.js asserts it). Defaults match DEF_FE; they are
// literals because DEF_FE is declared further down and this table evaluates at load.
const DNA_AXES={
  platformHz:   {min:HZ_MIN,max:HZ_MAX,def:1.75},  // front wheel Hz          → rideStiffness
  pitchRatio:   {min:0.50,max:3.00,def:1.20},      // rear Hz / front Hz      → rearHzMult
  arbShare:     {min:0,max:80,def:15},             // % of roll stiffness from bars → arbShareMan
  balanceOffset:{min:-0.20,max:0.20,def:0},        // mech balance past grip-neutral, + = OS → arbBalDelta
  reboundZeta:  {min:10,max:200,def:70},           // % at the front anchor   → reboundZeta
  bumpRatio:    {min:10,max:100,def:56},           // bump ζ as % of rebound  → bumpRatio
  dampBias:     {min:-50,max:50,def:0},            // slider value, + = REAR  → dampingBias (negated)
  diffExit:     {min:-50,max:50,def:0},            // slider value, + = ROTATE → diffBiasExit (negated on FWD)
  diffEntry:    {min:-50,max:50,def:0},            // slider value, + = LOOSE → diffBiasEntry (negated)
};
// The axes that can give way when targets conflict — the only ones a DNA's `keep` order ranks.
// Bump ratio and the setting axes never trade against another axis. This order is also the
// fallback `keep` for a DNA that doesn't supply a complete one.
const DNA_YIELDABLE=['platformHz','balanceOffset','arbShare','pitchRatio','reboundZeta'];
// SLACK — how far an outcome axis may land from its target and still count as met, on top of the
// quantisation allowance dnaTolerances computes. A target says what the car should do; slack says
// how much of it the personality actually needs. Without it every axis is a point target, and a
// value that cannot be reached everywhere has to be seeded at the tightest game's limit rather
// than where it belongs — which is why the archetype shares were fitted to Motorsport's 40-click
// bars. Default 0, so a DNA that sets none behaves exactly as before.
// Only outcome axes take it: the setting axes are written verbatim and always land.
const DNA_SLACK_AXES=['platformHz','pitchRatio','arbShare','balanceOffset','reboundZeta','bumpRatio'];
// Half the axis range is the ceiling: past that a "target" spans everything reachable and stops
// meaning anything.
const dnaSlackMax=k=>(DNA_AXES[k].max-DNA_AXES[k].min)/2;
const DNA_MAX_MOVES=4;
// Stored fields that are the negation of their slider. Avoids writing -0, which survives JSON as 0
// but fails Object.is against it.
const dnaNeg=v=>v===0?0:-v;

// The single choke point for a DNA from anywhere — storage, a file, an archetype. Out-of-range or
// non-numeric axes fall back to their range or default; `keep` is repaired into a permutation of
// DNA_YIELDABLE with any missing axes appended in that order.
// v2 replaced v1's rollDegPerG with arbShare. Roll depends on CG height, which the app only
// estimates, so a roll value can't be converted without a chassis — a v1 DNA takes the arbShare
// default, and its keep order carries the rank across.
const sanitizeDNA=raw=>{
  const ax=raw?.axes??{};
  const keepIn=(Array.isArray(raw?.keep)?raw.keep:[]).map(k=>k==='rollDegPerG'?'arbShare':k);
  const axes=Object.fromEntries(Object.entries(DNA_AXES).map(([k,{min,max,def}])=>{
    const v=ax[k];
    return[k,(typeof v==='number'&&isFinite(v))?Math.max(min,Math.min(max,v)):def];
  }));
  // Sparse: an axis with no slack is simply absent, so a DNA that uses none stores `slack:{}`
  // and the archetype literals stay a sanitizeDNA fixed point without six zeroes each.
  const slack=Object.fromEntries(DNA_SLACK_AXES
    .map(k=>[k,raw?.slack?.[k]])
    .filter(([,v])=>typeof v==='number'&&isFinite(v)&&v>0)
    .map(([k,v])=>[k,Math.min(v,dnaSlackMax(k))]));
  const seen=new Set();
  const keep=[...keepIn,...DNA_YIELDABLE]
    .filter(k=>DNA_YIELDABLE.includes(k)&&!seen.has(k)&&seen.add(k));
  return{v:2,name:(typeof raw?.name==='string'&&raw.name.trim())?raw.name:'Untitled',axes,slack,keep};
};

// ── DNA share codes ─────────────────────────────────────────────────────────
// A DNA travels on its OWN code, not in CODEC_FIELDS. A DNA is not a tune: threading a DNA group
// through DEF_GROUPS/encodeTune/decodeTune/sanitizeTune would spend permanent tune-codec ids on an
// object no solver reads, and tune ids can never be reused (see docs/CODEC.md). A separate table
// with its own prefix, its own version and its own ids costs nothing on that side — and it is the
// only way a personality travels at all, since the stamped tune a share code carries is
// chassis-specific, which is the exact thing a DNA exists to escape.
//
// Same shape as the tune codec otherwise: `version|id:value|…`, base64, fields still at their
// default omitted, unknown ids ignored so a newer app's extra axis does not break an older one.
// THESE IDS ARE PERMANENT. Retire, never reuse.
const DNA_CODEC_VERSION=1;
const DNA_CODE_PREFIX='DNA-';            // so a DNA code is never mistaken for a tune code
const DNA_CODEC_IDS={platformHz:1,pitchRatio:2,arbShare:3,balanceOffset:4,reboundZeta:5,
  bumpRatio:6,dampBias:7,diffExit:8,diffEntry:9};
const DNA_CODEC_NAME=10;                 // encodeURIComponent'd, so it cannot contain | or :
const DNA_CODEC_KEEP=11;                 // DNA_YIELDABLE indices in keep order, one digit each
const DNA_CODEC_SLACK=20;                // an axis's slack id is its axis id + this

const encodeDNA=raw=>{
  const d=sanitizeDNA(raw);
  const parts=[DNA_CODEC_VERSION];
  if(d.name&&d.name!=='Untitled')parts.push(`${DNA_CODEC_NAME}:${encodeURIComponent(d.name)}`);
  for(const[k,id]of Object.entries(DNA_CODEC_IDS)){
    if(Math.abs(d.axes[k]-DNA_AXES[k].def)>1e-9)parts.push(`${id}:${d.axes[k]}`);
    const sl=d.slack[k];
    if(sl>0)parts.push(`${id+DNA_CODEC_SLACK}:${sl}`);
  }
  const keep=d.keep.map(k=>DNA_YIELDABLE.indexOf(k)).join('');
  if(keep!==DNA_YIELDABLE.map((_,i)=>i).join(''))parts.push(`${DNA_CODEC_KEEP}:${keep}`);
  return DNA_CODE_PREFIX+btoa(parts.join('|'));
};

// Returns a sanitizeDNA shape, so every downstream reader gets the same object a saved DNA is.
const decodeDNA=code=>{
  const t=String(code??'').trim();
  if(!t.toUpperCase().startsWith(DNA_CODE_PREFIX))throw new Error('Not a DNA code — DNA codes start with DNA-.');
  const parts=atob(t.slice(DNA_CODE_PREFIX.length)).split('|');
  if(parseInt(parts[0],10)!==DNA_CODEC_VERSION)throw new Error('Outdated or invalid DNA code — ask for a new one.');
  const axes={},slack={};let name,keep;
  for(let i=1;i<parts.length;i++){
    const ci=parts[i].indexOf(':');
    if(ci<0)continue;
    const id=Number(parts[i].slice(0,ci)),v=parts[i].slice(ci+1);
    if(id===DNA_CODEC_NAME){name=decodeURIComponent(v);continue;}
    if(id===DNA_CODEC_KEEP){keep=[...v].map(c=>DNA_YIELDABLE[Number(c)]).filter(Boolean);continue;}
    const axis=Object.keys(DNA_CODEC_IDS).find(k=>DNA_CODEC_IDS[k]===id);
    if(axis){axes[axis]=Number(v);continue;}
    const sl=Object.keys(DNA_CODEC_IDS).find(k=>DNA_CODEC_IDS[k]+DNA_CODEC_SLACK===id);
    if(sl)slack[sl]=Number(v);
    // anything else is an id this version doesn't know — ignored, like the tune codec does
  }
  return sanitizeDNA({name,axes,slack,keep});
};

// Axes → a patch spread over the current fe/dr, so everything not named here (gameMode,
// targetSpeed, the MAN ARB fields, buildType, diffType) survives. Every axis lands on one field in
// a mode where that field already IS a target. Not CO-SOLVE: its rear/front ratio is exactly 1 at
// spring share 0 and can only move the way the balance correction points, so pitch would not be
// an independent axis. FRONT ride reference because SYNC holds the reference axle's ζ exactly.
const compileDNA=(ch,fe,dr,axes)=>({
  fe:{...fe,
    rideRef:'front',rideStiffMode:'hz',
    // DNA_AXES.platformHz has a 0.01 step and every archetype seed is written to 2dp, so the
    // compiler rounds to 0.01 — deliberately coarser than sanitizeTune's 0.001 Hz grid, which
    // 0.01 is a subset of, so the patch is still a sanitizeTune fixed point. dnaTolerances'
    // 0.005 platformHz allowance is half of THIS step, not of the sanitize grid.
    rideStiffness:Math.round(axes.platformHz*100)/100,
    rearHzMode:'multiplier',rearHzMult:axes.pitchRatio,
    arbMode:'share',arbShareMan:axes.arbShare,
    arbBalMode:'mech',arbBalTargetMode:'grip',arbBalDelta:axes.balanceOffset,
    dampCharMode:'zeta',reboundZeta:axes.reboundZeta,
    dampingMode:'ratio',bumpRatio:axes.bumpRatio,
    dampBalMode:'sync',dampingBias:dnaNeg(axes.dampBias)},
  dr:{...dr,diffManual:false,
    diffBiasExit:ch.layout==='FWD'?dnaNeg(axes.diffExit):axes.diffExit,
    diffBiasEntry:dnaNeg(axes.diffEntry)},
});

// The inverse of compileDNA, readable against ANY tune. The six outcome axes come from `tune`, so
// they mean the same whatever modes produced it. The three setting axes only mean the same under
// the modes compileDNA sets, so they read null otherwise — the UI says "mode differs" rather than
// comparing two quantities that merely share a name.
const measureDNA=(ch,tune,fe,dr)=>({
  platformHz:tune.fHz,
  pitchRatio:tune.rHz/tune.fHz,
  arbShare:tune.arbShare,
  // Same scale as gripBalTarget: both carry the tyre-width and MEASURE NAT BAL corrections.
  balanceOffset:tune.mechBalance-gripNeutralOf(ch,fe.gameMode??DEF_FE.gameMode,rollKOf(tune)),
  reboundZeta:tune.zetaF,
  bumpRatio:100*tune.bumpZetaF/tune.zetaF,
  dampBias:fe.dampBalMode==='sync'?dnaNeg(fe.dampingBias??0):null,
  diffExit:dr.diffManual?null:(ch.layout==='FWD'?dnaNeg(dr.diffBiasExit??0):(dr.diffBiasExit??0)),
  // Sport has no decel lock in-game, so ENTRY is inexpressible there, not merely different.
  diffEntry:dr.diffManual||dr.diffType==='sport'?null:dnaNeg(dr.diffBiasEntry??0),
});

// measureDNA turned into a DNA you can edit and apply — what TUNE CHECK's IMPORT AS DNA button
// and any future "make a DNA out of this" path go through. Two things a plain reading can't do:
//   * A setting axis that reads null (the tune is in a mode where that field means something
//     else) falls back to `from`, the axes already in the editor. Inventing a number the tune
//     never stated would be worse than leaving the draft's value alone.
//   * The damper split is converted rather than dropped. dampBias is only defined under SYNC, so
//     invert settleZetas' front-reference solve — rate(zR)·rHz = rate(zF)·fHz·biasMult with
//     biasMult = 2^(bias/50) — to get the bias that reproduces THIS tune's front/rear ζ split
//     whatever mode produced it. That inverts SYNC's own forward formula exactly, except where
//     rateToZeta clamped an axle at critical damping; the range clamp below absorbs the rest.
// Everything is clamped to DNA_AXES, so the result is a sanitizeDNA fixed point.
const dnaReadBack=(ch,fe,dr,tune,from)=>{
  const m=measureDNA(ch,tune,fe,dr);
  const rF=dampRate(tune.zetaF),rR=dampRate(tune.zetaR);
  const biasMult=(rF>0&&rR>0&&tune.fHz>0&&tune.rHz>0)?(rR*tune.rHz)/(rF*tune.fHz):1;
  return Object.fromEntries(Object.entries(DNA_AXES).map(([k,{min,max,def}])=>{
    const v=k==='dampBias'?50*Math.log2(biasMult):m[k];
    return[k,(typeof v==='number'&&isFinite(v))
      ?Math.max(min,Math.min(max,v))
      :(from?.[k]??def)];
  }));
};

// How far a measured axis may sit from its target and still count as hit. Each allowance is half
// of one quantisation step of whatever produced the number, so rounding the game imposes is never
// reported as a miss: compileDNA's own 0.01 Hz rounding (coarser than sanitizeTune's 0.001 Hz
// grid, and the one the compiled value actually lands on), BeamNG's 500 N/m spring and 100 N/m/s damper grids,
// Forza's 0.1-click damper step. Share and balance reuse shareClamped's and mechBalClamped's own
// thresholds, which already sit downstream of ARB click rounding.
const dnaTolerances=(tune,gameMode)=>{
  const phys=isPhysical(gameMode);
  const hzRel=lbIn=>phys?(PHYS_SNAP.spring/2)/(2*lbIn*LB_IN_TO_NM):0;   // ΔHz/Hz = ½·Δk/k
  const dHalf=phys?PHYS_SNAP.damp/2:0.05;
  const relF=hzRel(tune.springF),relR=hzRel(tune.springR);
  const ratio=tune.bumpZetaF/tune.zetaF;
  return{
    platformHz:0.005+tune.fHz*relF+1e-9,
    pitchRatio:(tune.rHz/tune.fHz)*(relF+relR)+1e-6,
    arbShare:tune.arbShareTol,
    balanceOffset:0.01,
    reboundZeta:tune.zetaF*dHalf/Math.max(1e-9,tune.rebF)+1e-6,
    bumpRatio:100*ratio*(dHalf/Math.max(1e-9,tune.rebF)+dHalf/Math.max(1e-9,tune.bumpF))+1e-6,
    dampBias:1e-9,diffExit:1e-9,diffEntry:1e-9,
  };
};

// One forward solve of a set of axis values, through exactly the path App takes.
const dnaEvaluate=(ch,fe,dr,axes)=>{
  const c=compileDNA(ch,fe,dr,axes);
  const gameMode=c.fe.gameMode??DEF_FE.gameMode;
  const tune=solveTune(ch,resolveFeEffective(ch,c.fe,c.dr.buildType),gameMode,c.dr.buildType).tune;
  return{fe:c.fe,dr:c.dr,tune,measured:measureDNA(ch,tune,c.fe,c.dr),tol:dnaTolerances(tune,gameMode)};
};

// Compile, then give way where the game's limits make the targets conflict. Each row names the
// axes a limit can make miss and the axes that could move to recover them, in dependency order —
// balance depends on the bar budget SHARE sets (MECH can only split what the budget supplies, and a
// bar pinned at its floor or ceiling misses both together), so share is resolved first. For a miss, the candidates are tried
// least-protected first; reaching the missed axis itself means everything left is more protected,
// so the miss is accepted instead. A candidate is searched toward BOTH ends of its range and the
// nearest value that clears the miss wins — no per-axis direction table to get backwards. Every
// move and every accepted miss is returned, so the app never presents a compromise as the target.
const applyDNA=(ch,fe,dr,dnaRaw)=>{
  const dna=sanitizeDNA(dnaRaw);
  const rank=k=>dna.keep.indexOf(k);                       // lower = more protected
  const work={...dna.axes};
  // Quantisation allowance plus the DNA's own slack. `accept` below reports the sum, so a caller
  // never has to add the two itself and then disagree with the resolver about what counts as met.
  const accept=(e,k)=>e.tol[k]+(dna.slack[k]??0);
  const hit=(e,w,k)=>e.measured[k]==null||Math.abs(e.measured[k]-w[k])<=accept(e,k);
  const ROWS=[
    {id:'pitch',axes:['pitchRatio'],cands:['pitchRatio','platformHz'],
     // Detected from the band itself rather than physics.rearHzClamped: the raw rear this DNA asks
     // for is the thing being judged, and the flag only covers the derived axle of the active ref.
     cause:e=>{const r=e.fe.rideStiffness*work.pitchRatio;
       return r>HZ_MAX||r<HZ_MIN?'rear axle outside the Hz band':'spring rate snapping';}},
    {id:'damping',axes:['reboundZeta','bumpRatio'],own:'reboundZeta',cands:['reboundZeta','platformHz'],
     cause:e=>e.tune.dampingClamped?'damper click range':'damper rounding'},
    // Platform is the only other lever: bars add a fixed stiffness per click while springs scale
    // with Hz, so a softer platform raises the share the bars can reach and a stiffer one lowers it.
    {id:'share',axes:['arbShare'],cands:['arbShare','platformHz'],
     cause:e=>!e.tune.shareClamped?'rounding'
       :e.measured.arbShare<work.arbShare?'anti-roll bars at their limit'
       :'anti-roll bars at their 1-click minimum'},
    {id:'balance',axes:['balanceOffset'],cands:['balanceOffset','pitchRatio','arbShare'],
     cause:e=>{const t=gripNeutralOf(ch,e.fe.gameMode??DEF_FE.gameMode,rollKOf(e.tune))+work.balanceOffset;
       return t<BAL_TARGET_MIN||t>BAL_TARGET_MAX?`target outside the ${BAL_TARGET_MIN.toFixed(2)}–${BAL_TARGET_MAX.toFixed(2)} balance range`
         :e.tune.mechBalClamped?'anti-roll bars cannot reach the split':'rounding';}},
  ];
  // Axes more protected than `cand` that currently hit must still hit after it moves — a move may
  // only spend axes ranked below itself. Bump ratio shares reboundZeta's rank (the damping row).
  const guardedBy=cand=>Object.keys(DNA_AXES).filter(k=>{
    const r=rank(k==='bumpRatio'?'reboundZeta':k);
    return r>=0&&r<rank(cand)&&hit(ev,work,k);
  });
  // `release` names axes the caller intends to move itself in a moment, so this search may break
  // them. Only the pair pass passes it; a plain single move never releases anything.
  const tryMove=(cand,protectedAxes,release)=>{
    const v0=work[cand],{min,max}=DNA_AXES[cand],
      guard=guardedBy(cand).filter(k=>!release?.includes(k));
    const clears=v=>{
      const w={...work,[cand]:v},e=dnaEvaluate(ch,fe,dr,w);
      return[...protectedAxes,...guard,cand].every(k=>hit(e,w,k));
    };
    // Scan outward from the current value before bisecting. Testing only the range ends is not
    // enough: a candidate's own valid region can be interior — pitch misses itself once
    // platform·pitch leaves the Hz band — and the clearing window can be narrow. Raising pitch to
    // fix balance also moves the springs the share budget is sized from, so a front-heavy chassis may clear only
    // across ~0.07 of pitch. 12 steps walked straight over windows like that; 96 steps is 1/96 of
    // the axis range. A window narrower than one step can still be missed — it is then reported
    // as a miss, never hidden.
    const STEPS=96;
    let best=null;
    for(const bound of [min,max]){
      if(bound===v0)continue;
      let prev=v0;
      for(let s=1;s<=STEPS;s++){
        const v=v0+(bound-v0)*s/STEPS;
        if(!clears(v)){prev=v;continue;}
        let ok=v,bad=prev;
        for(let i=0;i<14;i++){const mid=(ok+bad)/2;if(clears(mid))ok=mid;else bad=mid;}
        if(best==null||Math.abs(ok-v0)<Math.abs(best-v0))best=ok;
        break;
      }
    }
    return best;
  };
  // Two candidates moving together, tried only after every single candidate has failed. The case
  // it exists for: on a front-heavy or staggered chassis TAIL-HAPPY's balance is reachable by
  // raising pitch, but raising pitch breaks share, which TAIL-HAPPY ranks above pitch — so the
  // single pass rejects the pitch move and share alone cannot reach balance, and a miss was
  // accepted that both axes together can clear.
  //
  // It is not a 2-D search. The less protected axis `b` moves first with `a` RELEASED from its
  // guard — that is, allowed to break — and then `a` moves to repair itself while holding `b`'s
  // new value and the axes that were missing. Two 1-D searches, ~4 ms, instead of a grid.
  //
  // The cost of the pair is the cost of its MORE protected member: `a` moving alone would already
  // have been allowed to spend everything ranked below `a`, and that is exactly what the guard on
  // `b` is relaxed to. So the invariant holds unchanged — nothing ranked above every moved axis
  // is broken, and both members are still ranked below the axis they are protecting.
  const tryPair=(row,own,cands)=>{
    for(const b of cands){
      for(const a of cands){
        if(rank(a)>=rank(b))continue;                       // `a` is the more protected member
        const toB=tryMove(b,row.axes,[a]);
        if(toB==null)continue;
        const v0b=work[b],ev0=ev;
        work[b]=toB;ev=dnaEvaluate(ch,fe,dr,work);
        const toA=tryMove(a,[...row.axes,b]);
        if(toA!=null)return[{axis:b,to:toB,from:v0b},{axis:a,to:toA,from:work[a]}];
        work[b]=v0b;ev=ev0;                                 // no repair — put `b` back
      }
    }
    return null;
  };
  const moves=[],accepted=new Set();
  let ev=dnaEvaluate(ch,fe,dr,work);
  while(moves.length<DNA_MAX_MOVES){
    const row=ROWS.find(r=>!accepted.has(r.id)&&r.axes.some(k=>!hit(ev,work,k)));
    if(!row)break;
    const own=row.own??row.axes[0];
    // Least protected first; reaching the missed axis itself means everything left is more
    // protected than it, so nothing beyond this point may move for it.
    const cands=[...row.cands].sort((a,b)=>rank(b)-rank(a));
    const eligible=cands.slice(0,cands.indexOf(own)<0?cands.length:cands.indexOf(own));
    let moved=false;
    for(const cand of eligible){
      const to=tryMove(cand,row.axes);
      if(to==null)continue;
      moves.push({axis:cand,from:work[cand],to,protects:own,cause:row.cause(ev)});
      work[cand]=to;
      ev=dnaEvaluate(ch,fe,dr,work);
      moved=true;
      break;
    }
    // Only when no single axis could do it, and only if there is room for both moves.
    if(!moved&&eligible.length>1&&moves.length+2<=DNA_MAX_MOVES){
      const pair=tryPair(row,own,eligible);
      if(pair){
        const cause=row.cause(ev);
        // `with` marks the two halves of one joint move, so a readout can say they moved together
        // rather than showing two unrelated concessions.
        for(const m of pair)moves.push({...m,protects:own,cause,with:pair.find(o=>o!==m).axis});
        for(const m of pair)work[m.axis]=m.to;
        ev=dnaEvaluate(ch,fe,dr,work);
        moved=true;
      }
    }
    // A move can unblock a miss accepted earlier — lowering pitch for balance can make a share
    // miss that no platform value could fix become fixable — so every accepted miss is judged
    // again against the new state. DNA_MAX_MOVES still bounds the loop. Without this a resolved
    // DNA was not a fixed point: applying its own result could move again.
    if(moved)accepted.clear();else accepted.add(row.id);
  }
  const rowOf=k=>ROWS.find(r=>r.axes.includes(k));
  return{
    dna,fe:ev.fe,dr:ev.dr,tune:ev.tune,measured:ev.measured,tol:ev.tol,work,moves,
    accept:Object.fromEntries(Object.keys(DNA_AXES).map(k=>[k,accept(ev,k)])),
    misses:Object.keys(DNA_AXES).filter(k=>!hit(ev,work,k))
      .map(k=>({axis:k,target:work[k],achieved:ev.measured[k],cause:rowOf(k)?.cause(ev)??null})),
    inexpressible:Object.keys(DNA_AXES).filter(k=>ev.measured[k]==null),
  };
};
// ── Output unit formatting ──────────────────────────────────────────────────
// The Forza modes emit clicks on a 1..lim scale, so their readouts want a "/ N"
// denominator and a near-the-ceiling warning. Physical modes emit real units and
// want neither. These helpers are the single place that difference is decided, so no
// readout has to branch on the game mode itself.
//
// UNITS ARE COPIED FROM BEAMNG'S OWN TUNING SLIDERS, verified against a screenshot of
// a stock vehicle's defaults — do not "tidy" them into more conventional SI spellings:
//   Spring Rate            N/m     (NOT N/mm — a 1000× error if confused)
//   Bump/Rebound Damping   N/m/s   (identical to N·s/m; this is BeamNG's spelling)
//   Anti-Roll Spring Rate  N/m     (a LINEAR rate, not torsional N·m/rad — see arbOut)
// LB_IN_TO_NM is already N/m per lb/in, so physical modes need no separate constant —
// NMM_PER_LBIN is the UNITS modal's N/mm conversion and is unrelated here.
//
// MOTION RATIO is applied here, at the display layer, and deliberately not inside the balance
// model: Hz, roll stiffness and every balance figure are wheel-rate quantities and must not
// move by rate/mr² just because a motion ratio was entered. `mrDiv`/`roundTo`/`PHYS_SNAP` now
// live up with the calibration constants, because computeTune snaps to the same grid before
// deriving the physics it reports. The rounding below is therefore normally a no-op
// re-application of a snap already performed upstream — kept deliberately, because it is the
// last thing standing between a raw coefficient and the UI, and the paths that do not run
// through computeTune (TUNE CHECK, the ARB MAN field's own round-trip) still land here.
const springOut=(lbIn,gameMode,su,mr=1)=>isPhysical(gameMode)
  ? {value:roundTo(lbIn*LB_IN_TO_NM/mrDiv(mr),500),unit:'N/m',decimals:0}
  : {value:lbIn*su.f,unit:su.label,decimals:su.dp};
const dampOut=(v,lim,mr=1)=>lim.damping==null
  ? {value:roundTo(v/mrDiv(mr),100),unit:'N/m/s',decimals:0}
  : {value:v,unit:`/ ${lim.damping}`,decimals:1};
// Roll stiffness (N·m/rad) → the linear anti-roll rate BeamNG asks for, by the same
// rs = k·track²/2 relationship the spring side uses, inverted. No motion-ratio term
// yet, but not because the question is open: BeamNG specifies the rate at the bar's
// own lever rather than at the wheel, so a real inboard bar needs a higher number by
// (track/arm)². BeamNG exposes no arm length and the coefficient convention is still
// unsettled, so the divisor comes from the user as ARB Motion Ratio F/R (arm/track, default
// 1.0 = the old acts-at-the-wheel assumption). See docs/KNOWN_ISSUES.md for the research.
const arbOut=(v,lim,track=1.55,mr=1)=>lim.arb==null
  ? {value:roundTo(2*v/(track*track*mrDiv(mr)),1000),unit:'N/m',decimals:0}
  : {value:v,unit:`/ ${lim.arb}`,decimals:1};
const warnOver=(v,ceiling)=>ceiling==null?false:v>ceiling*0.88;
// "how close to the game's ceiling" — meaningless without one, so callers in physical
// modes get null back and render no badge rather than an invented band.
const arbCtx=(arb,limit)=>{
  if(limit==null)return null;
  const p=(arb-1)/(limit-1);
  if(p<0.50)return['LOW','#60a5fa'];
  if(p<0.75)return['MED','#f59e0b'];
  if(p<0.90)return['HIGH','#f97316'];
  return['MAX','#ef4444'];
};
const diffCtx=v=>{
  if(v===0)return['OFF','#94a3b8'];
  if(v<20)return['LOW','#cbd5e1'];
  if(v<45)return['MED','#94a3b8'];
  if(v<70)return['HIGH','#f59e0b'];
  return['MAX','#ef4444'];
};

// Inverse of the solve: read Hz and damping ratios back out of in-game values.
// `calib` undoes whatever the forward path applied — DAMPING_CALIBRATION for the click-based
// Forza modes, 1 for physical modes where the entered number is already the N·s/m coefficient.
// This is the one click-scale dependency in the checker that carries no `lim.*` reference,
// so it is easy to miss when adding a mode.
const computeCheck=(spr,damp,masses,calib=DAMPING_CALIBRATION)=>{
  const wrF=spr.f*LB_IN_TO_NM,wrR=spr.r*LB_IN_TO_NM;
  const hF=wrF>0?Math.sqrt(wrF/masses.front)/(2*Math.PI):0;
  const hR=wrR>0?Math.sqrt(wrR/masses.rear)/(2*Math.PI):0;
  const ccF=2*Math.sqrt(wrF*masses.front),ccR=2*Math.sqrt(wrR*masses.rear);
  return{hF,hR,
    zRebF:ccF>0?(damp.rebF/calib/ccF)*100:0,zRebR:ccR>0?(damp.rebR/calib/ccR)*100:0,
    zBmpF:ccF>0?(damp.bumpF/calib/ccF)*100:0,zBmpR:ccR>0?(damp.bumpR/calib/ccR)*100:0};
};

// NOTE: arrays fall through to `parsed` verbatim — there is deliberately no
// per-element merging. Array-valued persisted keys (the GARAGE entry list) therefore
// get NO default-filling from usePersist and must be normalized on read instead —
// see normalizeEntry below, and the array-key section in docs/PERSISTENCE.md.
// Fills keys the stored object is MISSING. A key that is present but invalid wins over its
// default — there is no per-key validation here, unlike sanitizeTune on the codec path. A caller
// that needs one passes usePersist a `repair` (only fe does, for gameMode — see repairFe). See
// docs/KNOWN_ISSUES.md, "rehydration still validates only one persisted enum".
const mergeDefaults=(initial,parsed)=>
  (initial&&typeof initial==='object'&&!Array.isArray(initial)
    &&parsed&&typeof parsed==='object'&&!Array.isArray(parsed))
    ?{...initial,...parsed}:parsed;
// `repair`, when given, runs ONCE on the rehydrated value before the first render. mergeDefaults
// fills MISSING keys but never validates the ones that are present, so a persisted enum holding a
// nonsense value beats its DEF_* and wins every reload. Repairing here rather than in a mount
// effect is deliberate: `set` below closes over the render-time value, so two effects writing the
// same key in one tick clobber each other (see the NOTE), and an effect-based repair lost that
// race to the ARB ceiling effect, which also runs on mount and also writes fe. This happens before
// any render, so nothing can race it. It does not rewrite localStorage — the stored value stays
// bad until the next ordinary write to the key, which is harmless because the repair is
// idempotent and runs on every load.
const usePersist=(key,initial,repair)=>{
  const[val,setVal]=useState(()=>{
    try{const s=localStorage.getItem(key);
      const v=s?mergeDefaults(initial,JSON.parse(s)):initial;
      return repair?repair(v):v;}
    catch(e){return initial;} // private browsing or parse error — use defaults
  });
  // NOTE: `set` closes over the render-time `val`, so two set() calls on the SAME key
  // within one tick clobber each other (the second computes from the stale value).
  // Callers that need to combine multiple sources must build the full next value first
  // and issue exactly ONE set() — see the GARAGE migration and the restore handler.
  const set=v=>{
    const next=typeof v==='function'?v(val):v;
    setVal(next);
    try{localStorage.setItem(key,JSON.stringify(next));}catch{}
  };
  return[val,set];
};

// Lights the header's GitHub button once a newer index.html is live on GitHub Pages, so a tab
// left open across a push is told to reload. document.lastModified is the Last-Modified header of
// the copy THIS tab loaded (from the browser cache too, which is why it beats a baseline fetched

// Last-Modified) → document.lastModified is "now" and the HEAD's date parses NaN, so nothing fires.
// Checked every 5 min while visible and whenever the tab comes back, at most once a minute; stops
// for good once it fires. Any Pages redeploy moves the date, a docs-only push included — see

const DEPLOY_CHECK_MS=5*60*1000;
const useDeployCheck=()=>{
  const[updateReady,setUpdateReady]=useState(false);
  useEffect(()=>{
    if(!/^https?:$/.test(location.protocol))return;
    const loaded=Date.parse(document.lastModified);
    if(!isFinite(loaded))return;
    let last=0,done=false;
    const check=async()=>{
      if(done||document.hidden||Date.now()-last<60000)return;
      last=Date.now();
      try{
        const r=await fetch(location.pathname,{method:'HEAD',cache:'no-store'});
        const live=Date.parse(r.headers.get('last-modified')||'');
        if(r.ok&&live>loaded&&!done){done=true;setUpdateReady(true);}
      }catch{} // offline or blocked — try again next tick
    };
    const timer=setInterval(check,DEPLOY_CHECK_MS);
    const onShow=()=>{if(!document.hidden)check();};
    document.addEventListener('visibilitychange',onShow);
    window.addEventListener('focus',onShow);
    return()=>{done=true;clearInterval(timer);
      document.removeEventListener('visibilitychange',onShow);window.removeEventListener('focus',onShow);};
  },[]);
  return updateReady;
};

// ── Undo / redo history ─────────────────────────────────────────────────────
// Pure core, no React — App owns one instance in a ref and drives it (see "Undo / redo wiring").
// An entry is a whole-state snapshot {ch,fe,dr,al,dnaApplied} plus the label of the action that
// moved away from it. Whole snapshots rather than diffs: a few KB each, and a restore can never
// reassemble a state that didn't exist.
//
// Two ways in. A discrete action (a load, APPLY, an import, RESET) calls commit() and is always its
// own step. A continuous edit calls record() on every change: only the first change of a BURST
// saves the state from before it, so one slider drag is one step. App ends a burst on pointerdown,
// pointerup, focusout, or 600 ms without a change.
//
// A step whose snapshot equals the current state would undo to nothing — a click on a toggle that
// was already on. close() drops one once the state has rendered; undo()/redo() skip any left over.
// close() compares by identity first: App builds a fresh `cur` object on every render, so the SAME
// object means nothing has rendered since record(), and an equal-looking state is stale, not a no-op.
const HISTORY_CAP=100;
const sameSnap=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const makeHistory=(cap=HISTORY_CAP)=>{
  const past=[],future=[];
  let open=false;
  const top=a=>a[a.length-1];
  const push=(snap,label)=>{
    past.push({snap,label});
    if(past.length>cap)past.shift();
    future.length=0;
  };
  return{
    // True when this change opened a new step.
    record(cur){if(open)return false;push(cur,'change');open=true;return true;},
    commit(cur,label){open=false;push(cur,label);},
    // True when a no-op step was dropped.
    close(cur){
      open=false;
      const t=top(past);
      if(t&&t.snap!==cur&&sameSnap(t.snap,cur)){past.pop();return true;}
      return false;
    },
    // Both return the snapshot to restore, or null.
    undo(cur){
      open=false;
      while(past.length&&sameSnap(top(past).snap,cur))past.pop();
      if(!past.length)return null;
      const e=past.pop();
      future.push({snap:cur,label:e.label});
      return e.snap;
    },
    redo(cur){
      open=false;
      while(future.length&&sameSnap(top(future).snap,cur))future.pop();
      if(!future.length)return null;
      const e=future.pop();
      past.push({snap:cur,label:e.label});
      return e.snap;
    },
    get canUndo(){return past.length>0;},
    get canRedo(){return future.length>0;},
    get undoLabel(){return top(past)?.label??null;},
    get redoLabel(){return top(future)?.label??null;},
  };
};

// ── GARAGE entry model ──────────────────────────────────────────────────────
// One unified entry replaces the old split chassis-only GARAGE and tune-only MY BUILDS
// lists. An entry carries any combination of ch / fe+dr payloads; its "kind" is DERIVED
// from which payloads are present, never stored — a stored kind would desync the moment
// an entry is rewritten with different data.
const kindOf=e=>{
  const hasCh=!!e?.ch, hasBuild=!!(e?.fe||e?.dr);
  // A saved Vehicle DNA carries only `dna`. A `dna` beside fe/dr is a build's provenance and
  // doesn't change its kind.
  return hasCh&&hasBuild?'car':hasCh?'chassis':hasBuild?'build'
    :e?.dna?.axes&&typeof e.dna.axes==='object'?'dna':'empty';
};
// 'empty' is the corrupt/hand-edited case. It renders as a deletable card rather than
// crashing — a `ch:null` entry used to take the whole app down via the ErrorBoundary,
// because the old garage card read s.ch.weight with no guard.

// Timestamp resolution. Old entries have no createdAt/updatedAt, but their `id` is a
// Date.now() from when they were saved, so it doubles as a creation stamp. The 1e12
// guard (~Sept 2001) rejects small ints from hand-edited files and array indices.
// The legacy `savedAt` field is a toLocaleDateString() STRING and is unsortable — it is
// no longer written, only tolerated on read; dates are formatted from this number at
// render time instead (which also fixes stale formatting if the user changes locale).
const stampOf=e=>e?.updatedAt??e?.createdAt
  ??(Number.isFinite(e?.id)&&e.id>1e12?e.id:Date.now());

// The single choke point for everything entering the entry list (migration, legacy file
// import, v2 file import). Because mergeDefaults skips arrays, this is what makes missing
// fields survivable without every render site needing its own ?? defaulting.
const normalizeEntry=raw=>{
  const t=stampOf(raw??{});
  return{
    id:        Number.isFinite(raw?.id)?raw.id:Date.now(),
    name:      (typeof raw?.name==='string'&&raw.name.trim())?raw.name:'Untitled',
    // omit absent payloads rather than storing null — kindOf keys off truthiness, and
    // absent keys keep backup files smaller
    ...(raw?.ch?{ch:raw.ch}:{}),
    ...(raw?.fe?{fe:raw.fe}:{}),
    ...(raw?.dr?{dr:raw.dr}:{}),
    // Beside fe/dr: which DNA a build was stamped from. Alone: a saved DNA (kind 'dna').
    ...(raw?.dna&&typeof raw.dna==='object'
      &&((raw.fe||raw.dr)||(!raw.ch&&raw.dna.axes&&typeof raw.dna.axes==='object'))?{dna:raw.dna}:{}),
    // Absent on every entry saved before tiers were recorded, and on anything restored
    // from an older backup — omitted rather than defaulted, so the card can stay silent
    // instead of asserting a tier nobody chose.
    ...(tierOf(raw?.tier)?{tier:raw.tier}:{}),
    tags:      Array.isArray(raw?.tags)?raw.tags.filter(x=>typeof x==='string'):[],
    notes:     typeof raw?.notes==='string'?raw.notes:'',
    createdAt: Number.isFinite(raw?.createdAt)?raw.createdAt:t,
    updatedAt: Number.isFinite(raw?.updatedAt)?raw.updatedAt:t,
  };
};

// Merges the two legacy lists into one. Pure and module-scope because it has TWO callers:
// the one-time localStorage migration, and the legacy-backup-file import path. Inlining it
// into the migration effect would guarantee the file-import copy rots, since that's the one
// with no daily users exercising it.
const unifyLegacy=(garageArr,buildsArr)=>{
  const used=new Set();
  const take=e=>{
    let nid=Number.isFinite(e?.id)?e.id:Date.now();
    // Both legacy lists id by Date.now(), so the same id can appear in both. Duplicate
    // React keys cause silent render corruption, so bump — but keep the ORIGINAL id as the
    // timestamp, or a collision would quietly rewrite that entry's date and its sort order.
    while(used.has(nid))nid++;
    used.add(nid);
    const t=stampOf(e??{});
    return normalizeEntry({...e,id:nid,createdAt:t,updatedAt:t});
  };
  return[
    ...(Array.isArray(garageArr)?garageArr:[]).map(take),
    ...(Array.isArray(buildsArr)?buildsArr:[]).map(take),
  // sort into one timeline — concatenating by source would show "all chassis, then all
  // builds", which reads as broken to someone who just saved a build
  ].sort((a,b)=>b.createdAt-a.createdAt);
};

// Backup-file parser. Returns a normalized entry array, or null if unrecognizable.
// Checks `entries` BEFORE branching on `version` so a v2 file whose version field got
// corrupted still imports — version is documentation and future dispatch, not a gate.
// The legacy branch reuses unifyLegacy verbatim, so the old-file path is exercised by the
// same code every existing user runs once at migration and therefore can't silently rot.
const parseBackup=parsed=>{
  if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))return null;
  if(Array.isArray(parsed.entries))return parsed.entries.map(normalizeEntry);           // v2
  if(Array.isArray(parsed.garage)||Array.isArray(parsed.builds))                        // v1
    return unifyLegacy(parsed.garage,parsed.builds);
  return null;
};

// Auto-tags: DERIVED at render, never stored. Storing them would leave old entries
// showing stale labels the moment a threshold is retuned. Each tag is only produced when
// the entry actually carries the payload it reads from, so a chassis-only entry gets no
// Hz/build tag and a build-only entry gets no layout/balance tag.
const NOTES_MAX=2000;
const autoTagsOf=e=>{
  const out=[];
  if(e?.ch){
    out.push({label:e.ch.layout??'RWD',color:'#94a3b8'});
    const fb=e.ch.frontBias??52;
    // frontBias is an integer 30–70, so ±2 is a 5-value band around even
    if(Math.abs(fb-50)<=2)out.push({label:'BALANCED',color:'#22c55e'});
    else out.push({label:fb>50?'NOSE HEAVY':'TAIL HEAVY',color:'#64748b'});
  }
  if(e?.fe){
    // rsToHz FIRST — it auto-converts the legacy 0–100 rideStiffness scale. Skipping it
    // silently misclassifies old entries (a legacy 50 would read RACE instead of ROAD).
    const[lbl,col]=hzCtx(rsToHz(e.fe.rideStiffness??1.75));
    out.push({label:lbl,color:col});   // reuses the HZ_BANDS single source of truth
  }
  if(e?.dr)out.push({label:(e.dr.buildType??'track').toUpperCase(),color:'#94a3b8'});
  // Last so it reads as a provenance note after the tune's own descriptors, and absent
  // entirely on pre-tier entries rather than guessed.
  if(tierOf(e?.tier))out.push({label:TIER_LABEL[e.tier]+' TIER',color:'#818cf8'});
  return out;
};

// suspos_units_v2 so an existing metric user starts all-metric. BeamNG springs, dampers
// and ARBs ignore the spring choice — they are always N/m, BeamNG's own unit.

// Summary line. Takes metricUnits because the old garage card hardcoded imperial and
// ignored the units setting entirely. Wheelbase stays in metres in both unit systems,
// matching how it's displayed everywhere else in the app.
const entrySummary=(e,metric)=>{
  if(e?.dna&&!e.ch&&!e.fe&&!e.dr){
    const a=sanitizeDNA(e.dna).axes;
    return['platformHz','arbShare','balanceOffset','reboundZeta'].map(k=>dnaFmt(k,a[k])).join(' · ');
  }
  const bits=[];
  if(e?.ch){
    bits.push(metric?`${Math.round(e.ch.weight/KG_TO_LB)}kg`:`${Math.round(e.ch.weight)}lb`);
    bits.push(`${e.ch.frontBias}% F`);
    bits.push(`${e.ch.wheelbase}m wb`);
  }
  if(e?.fe){
    const hz=rsToHz(e.fe.rideStiffness??1.75);
    bits.push(`${hz.toFixed(2)} Hz`);
    if(e.ch){
      // Car entries carry their own chassis, so the actual bottom-out g (not just the
      // stored target) can be computed on THIS entry's ride height — same sag model as
      // the SAG vs LOAD chart / BOTTOM G's stiffness mode. Shown regardless of which
      // stiffness mode was active when saved, since the chassis context makes it a real
      // reading either way, not just an aspiration.
      const rRef=e.fe.rideRef??'front';
      const rhPrimary_mm=rRef==='rear'?(e.ch.rideHeightR??0.12)*1000
        :rRef==='shared'?((e.ch.rideHeightF??0.13)+(e.ch.rideHeightR??0.12))/2*1000
        :(e.ch.rideHeightF??0.13)*1000;
      const g=rhPrimary_mm*Math.pow(2*Math.PI*hz,2)/9810;
      bits.push(`${g.toFixed(2)} g`);
    }else if(e.fe.rideStiffMode==='bottomG'&&e.fe.rideBottomG!=null){
      // Build entries have no chassis, so there's no ride height to compute a real bottom-out
      // g from — but if BOTTOM G's mode was selected, the stored target itself is still
      // meaningful (it's what re-solves Hz on whatever chassis the build gets applied to).
      bits.push(`${e.fe.rideBottomG.toFixed(2)} g target`);
    }
    bits.push(`${e.fe.reboundZeta??70}% ζ`);
    bits.push((e.fe.dampingMode??'ratio')==='independent'
      ?`${e.fe.bumpZeta??39}% bump ζ`
      :`${e.fe.bumpRatio??56}% bump`);
  }
  if(e?.dr)bits.push((e.dr.diffType??'race').toUpperCase());
  return bits.join(' · ');
};
