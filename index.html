// Appending 'beamng':2 needs no codec version bump: encodeTune omits fields still at
// their default (so horizon codes never carry id 10 at all), decodeTune ignores ids it
// doesn't know, and sanitizeTune's GAME_MODE_DEC.includes() check drops an out-of-range
// value back to horizon. An older client fed a beamng code degrades to horizon instead
// of throwing. Values are permanent — never renumber.
const GAME_MODE_ENC={'horizon':0,'motorsport':1,'beamng':2};
const GAME_MODE_DEC=['horizon','motorsport','beamng'];
const DAMPING_MODE_ENC={'ratio':0,'independent':1};
const DAMPING_MODE_DEC=['ratio','independent'];
const REAR_HZ_MODE_ENC={'flatRide':0,'independent':1,'multiplier':2,'mech':3,'shared':4};
const REAR_HZ_MODE_DEC=['flatRide','independent','multiplier','mech','shared'];
const ARB_MODE_ENC={'auto':0,'roll':1,'share':2,'man':4,'basic':5};
const ARB_MODE_DEC=['auto','roll','share','auto','man','basic']; // index 3 was legacy 'balance' → auto; index 4 = MAN (moved from ARB_BAL_MODE — see sanitizeTune migration)
const ARB_BAL_MODE_ENC={'weight':0,'mech':1,'coSolve':2,'man':3,'neutral':4,'chassis':5,'manual':6};
const ARB_BAL_MODE_DEC=['weight','mech','coSolve','man','neutral','chassis','manual']; // 'man' kept for old-code decode only — see sanitizeTune migration
// 'manual': invisible placeholder used when Stiffness Mode is MAN — behaves identically to
// 'weight' everywhere (see feelToPhysics/computeTune) but never lights up a Balance Mode
// button, so switching Stiffness Mode away from MAN doesn't look like the user chose WEIGHT.
const RIDE_REF_ENC={'front':0,'rear':1,'shared':2};
const RIDE_REF_DEC=['front','rear','shared'];
const DAMP_BAL_MODE_ENC={'standard':0,'sync':1,'neutral':2,'hybrid':3};
const DAMP_BAL_MODE_DEC=['standard','sync','neutral','hybrid']; // UI: sync = TIME SYNC, neutral = EQUAL FORCE, hybrid = HYBRID — all SYNC sub-modes; indices are permanent
// Settle Sync (boolean settleMode + its own settleBias field) → dampBalMode + the unified
// dampingBias. Shared by every path that can hand the app a raw, possibly-legacy fe object:
// sanitizeTune (LOAD CODE), the one-time persisted-state migration effect, and garageLoadBuild
// (a GARAGE entry saved before this feature existed carries the legacy fields verbatim, same
// as a legacy localStorage blob — a plain `{...DEF_FE,...e.fe}` merge doesn't migrate them).
// IMPORTANT: `fe.dampBalMode` being present/valid is NOT a reliable "already migrated" signal
// on its own — decodeTune pre-fills every CODEC_FIELD (including id 62, dampBalMode) with its
// default before overlaying whatever ids the code actually carries, and mergeDefaults spreads
// DEF_FE the same way for persisted state. So a legacy fe object that still carries settleMode
// ALSO arrives here with dampBalMode already sitting at 'standard' (inherited, not chosen) — a
// naive `DAMP_BAL_MODE_DEC.includes(fe.dampBalMode)` check would treat that as "already
// migrated" and silently ignore the real settleMode/settleBias values (this shipped broken
// once already — see the git history for the fix). settleMode is only ever present on a
// pre-migration object (nothing in this app writes it anymore), so its mere presence — not
// dampBalMode's — is the only reliable "this needs migrating" signal.
const migrateDampBalMode=fe=>{
  const clBias=v=>Math.max(-50,Math.min(50,(typeof v==='number'&&isFinite(v))?v:DEF_FE.dampingBias));
  if(fe?.settleMode!=null){
    const legacyActive=!!fe.settleMode&&fe.settleBias!=null;
    return{
      dampBalMode:fe.settleMode?'sync':'standard',
      dampingBias:clBias(legacyActive?-fe.settleBias:fe?.dampingBias),
    };
  }
  return{
    dampBalMode:DAMP_BAL_MODE_DEC.includes(fe?.dampBalMode)?fe.dampBalMode:'standard',
    dampingBias:clBias(fe?.dampingBias),
  };
};
const LAYOUT_ENC={'FWD':0,'RWD':1,'AWD':2};
const LAYOUT_DEC=['FWD','RWD','AWD'];
const BUILD_ENC={'street':0,'track':1,'drift':2,'rally':3,'offroad':4,'drag':5};
const BUILD_DEC=['street','track','drift','rally','offroad','drag'];

// ── Share codec ──────────────────────────────────────────────────────────
// Single source of truth: each live field is one entry below (stable id,
// never reassigned once shipped — retire dead ids by deleting the entry,
// never reuse the number). encodeTune/decodeTune are generic loops over
// this table, so adding a field later never touches existing codes or
// requires a length guard — codes are sparse "id:value" pairs, defaults
// are omitted, and unknown ids are ignored on decode (forward-compatible).
const CODEC_VERSION=1;
const DEF_GROUPS={ch:DEF_CH,fe:DEF_FE,dr:DEF_DR};
const CODEC_FIELDS=[
  {id:1, group:'ch',key:'weight'},
  {id:2, group:'ch',key:'frontBias'},
  {id:3, group:'ch',key:'wheelbase'},
  {id:4, group:'ch',key:'cgHeight'},
  {id:5, group:'ch',key:'trackF'},
  {id:6, group:'ch',key:'trackR'},
  {id:7, group:'fe',key:'rideStiffness'},
  {id:8, group:'fe',key:'arbBias'},
  {id:9, group:'fe',key:'targetSpeed'},
  {id:10,group:'fe',key:'gameMode',enc:GAME_MODE_ENC,dec:GAME_MODE_DEC},
  {id:11,group:'fe',key:'dampingMode',enc:DAMPING_MODE_ENC,dec:DAMPING_MODE_DEC},
  {id:12,group:'fe',key:'reboundZeta'},
  {id:13,group:'fe',key:'bumpRatio'},
  {id:14,group:'fe',key:'bumpZeta'},
  {id:15,group:'fe',key:'arbMode',enc:ARB_MODE_ENC,dec:ARB_MODE_DEC},
  {id:16,group:'fe',key:'arbTargetRollMan'},
  {id:17,group:'fe',key:'arbShareMan'},
  {id:57,group:'fe',key:'arbBasicMan'},
  {id:18,group:'ch',key:'layout',enc:LAYOUT_ENC,dec:LAYOUT_DEC},
  {id:19,group:'dr',key:'buildType',enc:BUILD_ENC,dec:BUILD_DEC},
  {id:20,group:'dr',key:'diffManual',bool:true},
  {id:21,group:'dr',key:'diffBiasExit'},
  {id:22,group:'dr',key:'diffAccel'},
  {id:23,group:'dr',key:'diffDecel'},
  {id:24,group:'dr',key:'diffFrontAccel'},
  {id:25,group:'dr',key:'diffFrontDecel'},
  {id:26,group:'dr',key:'diffRearAccel'},
  {id:27,group:'dr',key:'diffRearDecel'},
  {id:28,group:'dr',key:'diffCenter'},
  {id:29,group:'dr',key:'diffBiasEntry'},
  {id:30,group:'fe',key:'rearHzMode',enc:REAR_HZ_MODE_ENC,dec:REAR_HZ_MODE_DEC},
  {id:31,group:'fe',key:'rearHzMan'},
  {id:32,group:'fe',key:'rearHzMult'},
  {id:33,group:'fe',key:'dampingBias'},
  {id:34,tyre:'F',part:'width',def:265},
  {id:35,tyre:'R',part:'width',def:265},
  {id:36,tyre:'F',part:'aspectRatio',def:35},
  {id:37,tyre:'F',part:'rimDiameter',def:18},
  {id:38,tyre:'R',part:'aspectRatio',def:35},
  {id:39,tyre:'R',part:'rimDiameter',def:18},
  {id:40,group:'fe',key:'arbBalTarget'},
  {id:41,group:'fe',key:'arbBalMode',enc:ARB_BAL_MODE_ENC,dec:ARB_BAL_MODE_DEC},
  {id:42,group:'dr',key:'diffFrontExitBias'},
  {id:43,group:'fe',key:'springShare'},
  {id:44,group:'fe',key:'rideRef',enc:RIDE_REF_ENC,dec:RIDE_REF_DEC},
  {id:45,group:'dr',key:'diffComplement',bool:true},
  {id:46,group:'fe',key:'arbManF'},
  {id:47,group:'fe',key:'arbManR'},
  // 48/49: retired — Settle Sync's boolean on/off + its own bias field, replaced by
  // dampBalMode (id 62) + the unified dampingBias (id 33). Kept for old-code decode only —
  // sanitizeTune migrates them into dampBalMode/dampingBias.
  {id:48,group:'fe',key:'settleBias'},
  {id:49,group:'fe',key:'settleMode',bool:true},
  {id:50,group:'fe',key:'settleTarget'},
  {id:51,group:'fe',key:'dampCharMode',enc:{zeta:0,settle:1},dec:['zeta','settle']},
  {id:52,group:'dr',key:'diffType',enc:DIFF_TYPE_ENC,dec:DIFF_TYPE_DEC},
  {id:53,group:'fe',key:'arbBalTargetMode',enc:{manual:0,grip:1},dec:['manual','grip']},
  {id:54,group:'fe',key:'arbBalDelta'},
  {id:55,group:'fe',key:'springShareAuto',bool:true},
  {id:56,group:'fe',key:'arbSplitOpposite',bool:true},
  // 58/59: motion ratios. group:'ch' because they describe the car's suspension geometry,
  // so they travel with a chassis entry rather than a tune — same reasoning as id 18.
  // (57 is arbBasicMan, declared above out of numeric order.)
  {id:58,group:'ch',key:'motionRatioF'},
  {id:59,group:'ch',key:'motionRatioR'},
  {id:68,group:'ch',key:'arbMotionRatioF'},
  {id:69,group:'ch',key:'arbMotionRatioR'},
  // 60/61: measured natural balance calibration. group:'ch' — travels with the chassis,
  // same reasoning as motionRatioF/R. Unlike useRideHeightCG (whose resulting cgHeight
  // already travels via id 4), arbBalTarget/arbBalDelta store DELTAS from
  // naturalMechBalanceOf(ch), so the baseline itself must travel too or a shared build
  // re-targets against the wrong (geometry-only) natural balance. See docs/CODEC.md.
  {id:60,group:'ch',key:'useMeasuredNatBal',bool:true},
  {id:61,group:'ch',key:'measuredNatBal'},
  {id:62,group:'fe',key:'dampBalMode',enc:DAMP_BAL_MODE_ENC,dec:DAMP_BAL_MODE_DEC},
  // 63/64: BOTTOM G's stiffness-input mode. rideBottomG is a stored TARGET, not a
  // calibration input to a value that already travels — it's meant to actively re-solve
  // rideStiffness (id 7) against whatever chassis it's applied to. See docs/CODEC.md.
  {id:63,group:'fe',key:'rideStiffMode',enc:{'hz':0,'bottomG':1},dec:['hz','bottomG']},
  {id:64,group:'fe',key:'rideBottomG'},
  // 65/66: rideHeightF/R. Previously excluded on the assumption they were pure calibration
  // inputs to cgHeight (id 4), which already travels — true for that one consumer, but ids
  // 63/64 (added later) re-solve rideStiffness from rideBottomG against ch.rideHeightF/R
  // directly, regardless of the CG toggle. Without these two ids that resolve ran against
  // whichever ride height happened to be local on the receiving device, silently landing a
  // different Hz than the sender tuned even though the g-target read the same. Same class of
  // bug as ids 60/61 (measuredNatBal) — see docs/CODEC.md.
  {id:65,group:'ch',key:'rideHeightF'},
  {id:66,group:'ch',key:'rideHeightR'},
  {id:67,group:'fe',key:'arbNeutralEqual',bool:true},
  // 73/74: MEASURE ARB's per-car click scale. group:'ch' — a calibration of this car's
  // Forza slider, and a shared build's ARB clicks only mean the same stiffness against it.
  // 72: the Hz MEASURE NAT BAL was read at — the tyre-series display's equal-Hz balance moves a
  // little with Hz, so displayNatOffsetOf needs it. null = NAT_BAL_REF_HZ (older readings).
  {id:72,group:'ch',key:'measuredNatBalHz'},
  {id:73,group:'ch',key:'useMeasuredArbClick',bool:true},
  {id:74,group:'ch',key:'measuredArbClick'},
  // 75/76: the MEAS. NAT BAL and its Hz that 74 was measured against, so arbScaleStale can flag it.
  {id:75,group:'ch',key:'measuredArbNat'},
  {id:76,group:'ch',key:'measuredArbNatHz'},
  // Retired ids — never reuse: 70/71 (useMeasuredArbScale/measuredArbScale) — a click scale measured
  // without the tyre term, about half what 73/74 mean; decoding drops them (unknown id) rather than
  // misread a stale scale as half-stiff bars. See docs/CODEC.md.
];
const codecFieldDefault=f=>f.tyre?f.def:DEF_GROUPS[f.group][f.key];
const codecReadField=(src,f)=>{
  if(f.tyre){
    const t=parseTyre(f.tyre==='F'?src.ch.tyreF:src.ch.tyreR);
    return t?.[f.part]??f.def;
  }
  return src[f.group][f.key];
};

const encodeTune=(ch,fe,dr)=>{
  const src={ch,fe,dr};
  const same=(a,b)=>typeof a==='number'&&typeof b==='number'?Math.abs(a-b)<1e-9:a===b;
  const parts=[CODEC_VERSION];
  for(const f of CODEC_FIELDS){
    const enc=x=>f.enc?f.enc[x]:(f.bool?(x?1:0):x);
    const raw=enc(codecReadField(src,f)), defRaw=enc(codecFieldDefault(f));
    if(same(raw,defRaw))continue;
    parts.push(`${f.id}:${raw}`);
  }
  return btoa(parts.join('|'));
};

const decodeTune=(code)=>{
  const parts=atob(code.trim()).split('|');
  const version=parseInt(parts[0],10);
  if(version!==CODEC_VERSION)throw new Error('Outdated or invalid tune code — ask for a new one.');
  const ch={},fe={},dr={};
  const tyreParts={F:{},R:{}};
  const dest=f=>f.group==='ch'?ch:f.group==='fe'?fe:dr;
  for(const f of CODEC_FIELDS){
    if(f.tyre)tyreParts[f.tyre][f.part]=f.def;
    else dest(f)[f.key]=codecFieldDefault(f);
  }
  for(let i=1;i<parts.length;i++){
    const ci=parts[i].indexOf(':');
    if(ci<0)continue;
    const id=Number(parts[i].slice(0,ci)),raw=parts[i].slice(ci+1);
    const f=CODEC_FIELDS.find(x=>x.id===id);
    if(!f)continue; // unknown id (e.g. from a newer app version) — safely ignored
    const val=f.enc?(f.dec[Number(raw)]??codecFieldDefault(f)):(f.bool?raw==='1':Number(raw));
    if(f.tyre)tyreParts[f.tyre][f.part]=val;
    else dest(f)[f.key]=val;
  }
  ch.tyreF=`${tyreParts.F.width}/${tyreParts.F.aspectRatio}R${tyreParts.F.rimDiameter}`;
  ch.tyreR=`${tyreParts.R.width}/${tyreParts.R.aspectRatio}R${tyreParts.R.rimDiameter}`;
  return{ch,fe,dr};
};

const sanitizeTune=({ch,fe,dr})=>{
  const n=(v,def)=>(typeof v==='number'&&isFinite(v))?v:def;
  const cl=(v,lo,hi,def)=>Math.max(lo,Math.min(hi,n(v,def)));
  const sch={
      weight:       cl(ch?.weight,        100,  18000, DEF_CH.weight),
      frontBias:    cl(ch?.frontBias,      30,   70,   DEF_CH.frontBias),
      wheelbase:    cl(ch?.wheelbase,      0.4,  4.0,  DEF_CH.wheelbase),
      cgHeight:     cl(ch?.cgHeight,       0.2,  1.5,  DEF_CH.cgHeight),
      trackF:       cl(ch?.trackF,         1.0,  2.2,  DEF_CH.trackF),
      trackR:       cl(ch?.trackR,         1.0,  2.2,  DEF_CH.trackR),
      // Bounds mirror the Ride Height F/R Field inputs' min/max (0.5in/48in imperial,
      // 1.3cm/122cm metric) — see docs/CODEC.md ids 65/66.
      rideHeightF:  cl(ch?.rideHeightF,    0.0127, 1.22, DEF_CH.rideHeightF),
      rideHeightR:  cl(ch?.rideHeightR,    0.0127, 1.22, DEF_CH.rideHeightR),
      tyreF: parseTyre(ch?.tyreF)?ch.tyreF:DEF_CH.tyreF,
      tyreR: parseTyre(ch?.tyreR)?ch.tyreR:DEF_CH.tyreR,
      layout:       LAYOUT_DEC.includes(ch?.layout)?ch.layout:DEF_CH.layout,
      // Travels with the chassis so a shared build's arbBalTarget/arbBalDelta (deltas from
      // naturalMechBalanceOf(ch)) re-expand against the sender's actual calibrated baseline
      // instead of silently falling back to geometry — see docs/CODEC.md id 60/61.
      useMeasuredNatBal: !!(ch?.useMeasuredNatBal),
      measuredNatBal:    ch?.useMeasuredNatBal&&ch?.measuredNatBal!=null?cl(ch.measuredNatBal,0.10,0.90,null):null,
      measuredNatBalHz:  ch?.useMeasuredNatBal&&ch?.measuredNatBalHz!=null?cl(ch.measuredNatBalHz,HZ_MIN,HZ_MAX,null):null,
      // useMeasuredArbScale/measuredArbScale (pre-tyre-model, retired codec ids 70/71) are
      // deliberately not carried over: read as the new scale they would halve the bars.
      useMeasuredArbClick: !!(ch?.useMeasuredArbClick),
      measuredArbClick:  ch?.useMeasuredArbClick&&ch?.measuredArbClick!=null?cl(ch.measuredArbClick,ARB_SCALE_MIN,ARB_SCALE_MAX,null):null,
      measuredArbNat:    ch?.useMeasuredArbClick&&ch?.measuredArbNat!=null?cl(ch.measuredArbNat,0.10,0.90,null):null,
      measuredArbNatHz:  ch?.useMeasuredArbClick&&ch?.measuredArbNatHz!=null?cl(ch.measuredArbNatHz,HZ_MIN,HZ_MAX,null):null,
      // Floor at 0.2 rather than 0: mrDiv squares this, so a near-zero ratio would
      // scale the displayed rate toward infinity.
      motionRatioF: cl(ch?.motionRatioF,    0.2,  1.5,  DEF_CH.motionRatioF),
      motionRatioR: cl(ch?.motionRatioR,    0.2,  1.5,  DEF_CH.motionRatioR),
      arbMotionRatioF: cl(ch?.arbMotionRatioF, 0.2, 1.5, DEF_CH.arbMotionRatioF),
      arbMotionRatioR: cl(ch?.arbMotionRatioR, 0.2, 1.5, DEF_CH.arbMotionRatioR),
  };
  // arbBalTarget is a delta from naturalMechBalanceOf(sch) (see id 40 in docs/CODEC.md) —
  // clamp it to the same range the live Field allows (0.20-0.90 absolute), not a flat
  // approximation, so a decoded delta can't silently get truncated differently than the UI.
  const _snb=naturalMechBalanceOf(sch);
  return{
    ch: sch,
    fe:{
      rideStiffness:    (()=>{const rs=n(fe?.rideStiffness,DEF_FE.rideStiffness);const hz=rs>6?0.8+(rs/100)*2.7:rs;return clampHz(Math.round(hz*100)/100);})(),
      arbBias:          cl(fe?.arbBias,          -50,   50,  DEF_FE.arbBias),
      arbBalTarget:     fe?.arbBalTarget==null?null:cl(fe.arbBalTarget,0.20-_snb,0.90-_snb,0),
      arbBalMode:       (()=>{
                          const bm=ARB_BAL_MODE_DEC.includes(fe?.arbBalMode)?fe.arbBalMode:DEF_FE.arbBalMode;
                          // MAN moved from Balance Mode to Stiffness Mode (arbMode) — old saves/share
                          // codes with arbBalMode:'man' fall back to the invisible 'manual' placeholder
                          // here; the arbMode migration below picks up the actual MAN behavior so old
                          // manual-click tunes still work.
                          return bm==='man'?'manual':bm;
                        })(),
      springShare:      cl(fe?.springShare,         0,  100, DEF_FE.springShare),
      springShareAuto:  fe?.springShareAuto!==false,
      arbSplitOpposite: !!fe?.arbSplitOpposite,
      arbNeutralEqual:  !!fe?.arbNeutralEqual,
      // migrateDampBalMode covers the legacy Settle Sync boolean + its own settleBias field —
      // see docs/CODEC.md ids 48/49/62.
      ...migrateDampBalMode(fe),
      targetSpeed:      cl(fe?.targetSpeed,       60,  200,  DEF_FE.targetSpeed),
      gameMode:         GAME_MODE_DEC.includes(fe?.gameMode)?fe.gameMode:DEF_FE.gameMode,
      dampingMode:      DAMPING_MODE_DEC.includes(fe?.dampingMode)?fe.dampingMode:DEF_FE.dampingMode,
      reboundZeta:      cl(fe?.reboundZeta,       10,  200,  DEF_FE.reboundZeta),
      bumpRatio:        cl(fe?.bumpRatio,         10,  100,  DEF_FE.bumpRatio),
      bumpZeta:         cl(fe?.bumpZeta,          10,  115,  DEF_FE.bumpZeta),
      arbMode:          (()=>{
                          const am=ARB_MODE_DEC.includes(fe?.arbMode)?fe.arbMode:DEF_FE.arbMode;
                          // Migrate old saves/share codes where MAN was a Balance Mode value.
                          return (am===DEF_FE.arbMode&&fe?.arbBalMode==='man')?'man':am;
                        })(),
      arbTargetRollMan: cl(fe?.arbTargetRollMan,  0.3,  5.0, DEF_FE.arbTargetRollMan),
      arbShareMan:      cl(fe?.arbShareMan,        0,   80,  DEF_FE.arbShareMan),
      arbBasicMan:      cl(fe?.arbBasicMan,        0,  100,  DEF_FE.arbBasicMan),
      rearHzMode:       REAR_HZ_MODE_DEC.includes(fe?.rearHzMode)?fe.rearHzMode:DEF_FE.rearHzMode,
      rearHzMan:        cl(fe?.rearHzMan,          HZ_MIN, HZ_MAX, DEF_FE.rearHzMan),
      rearHzMult:       cl(fe?.rearHzMult,         0.5,  3.0, DEF_FE.rearHzMult),
      rideRef:          ['front','rear','shared'].includes(fe?.rideRef)?fe.rideRef:'front',
      rideStiffMode:    ['hz','bottomG'].includes(fe?.rideStiffMode)?fe.rideStiffMode:'hz',
      rideBottomG:      (typeof fe?.rideBottomG==='number'&&isFinite(fe.rideBottomG)&&fe.rideBottomG>0)?fe.rideBottomG:null,
      arbManF:          cl(fe?.arbManF,             1,   65,   20),
      arbManR:          cl(fe?.arbManR,             1,   65,   20),
      settleTarget:     cl(fe?.settleTarget,      0.10,  1.50,  DEF_FE.settleTarget),
      dampCharMode:     fe?.dampCharMode==='settle'?'settle':'zeta',
      arbBalTargetMode: ['manual','grip'].includes(fe?.arbBalTargetMode)?fe.arbBalTargetMode:DEF_FE.arbBalTargetMode,
      arbBalDelta:      cl(fe?.arbBalDelta,       -0.20, 0.20, DEF_FE.arbBalDelta),
    },
    dr:{
      buildType:      BUILD_DEC.includes(dr?.buildType)?dr.buildType:DEF_DR.buildType,
      diffType:       DIFF_TYPE_DEC.includes(dr?.diffType)?dr.diffType:DEF_DR.diffType,
      diffManual:     typeof dr?.diffManual==='boolean'?dr.diffManual:dr?.diffManual===1,
      diffComplement: typeof dr?.diffComplement==='boolean'?dr.diffComplement:false,
      diffBiasExit:      cl(dr?.diffBiasExit,      -50, 50, DEF_DR.diffBiasExit),
      diffBiasEntry:     cl(dr?.diffBiasEntry,     -50, 50, DEF_DR.diffBiasEntry),
      diffFrontExitBias: cl(dr?.diffFrontExitBias, -50, 50, DEF_DR.diffFrontExitBias),
      diffAccel:      cl(dr?.diffAccel,       0,  100,  DEF_DR.diffAccel),
      diffDecel:      cl(dr?.diffDecel,       0,  100,  DEF_DR.diffDecel),
      diffFrontAccel: cl(dr?.diffFrontAccel,  0,  100,  DEF_DR.diffFrontAccel),
      diffFrontDecel: cl(dr?.diffFrontDecel,  0,  100,  DEF_DR.diffFrontDecel),
      diffRearAccel:  cl(dr?.diffRearAccel,   0,  100,  DEF_DR.diffRearAccel),
      diffRearDecel:  cl(dr?.diffRearDecel,   0,  100,  DEF_DR.diffRearDecel),
      diffCenter:     cl(dr?.diffCenter,      0,  100,  DEF_DR.diffCenter),
    },
  };
};

const useTwoTap=(callback,delay=2000)=>{
  const[pending,setPending]=useState(false);
  const timer=useRef(null);
  useEffect(()=>()=>clearTimeout(timer.current),[]);
  const handle=()=>{
    if(pending){clearTimeout(timer.current);setPending(false);callback();}
    else{setPending(true);timer.current=setTimeout(()=>setPending(false),delay);}
  };
  return[pending,handle];
};

const OverwriteBtn=({onConfirm})=>{
  const[pending,handle]=useTwoTap(onConfirm);
  return(
    <button onClick={handle}
      style={{background:'none',border:'none',cursor:'pointer',fontSize:12,lineHeight:1,
              padding:'0 0 0 3px',flexShrink:0,color:pending?'#f59e0b':'#374151'}}
      title={pending?'Click again to overwrite':'Overwrite with current data'}>↺</button>
  );
};

const copyToClipboard=(text,onDone)=>{
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onDone).catch(()=>{});
  } else {
    const ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    onDone();
  }
};

// One garage entry. Takes a props object rather than positional args — the old inline
// card() helper had 7 positionals and this needs roughly twice that.
const EntryCard=({entry,metricUnits,onLoadChassis,onLoadBuild,onLoadDna,onRewrite,onDelete,onRename,onNotes,onAddTag,onRemoveTag,allTags})=>{
  const kind=kindOf(entry);
  const km=KIND_META[kind];
  const[editing,setEditing]=useState(false);
  const[draft,setDraft]=useState(entry.name);
  const[openNotes,setOpenNotes]=useState(false);
  const[rwOpen,setRwOpen]=useState(false);
  const[codeCopied,setCodeCopied]=useState(false);
  const[tagDraft,setTagDraft]=useState('');
  const[delPending,delHandle]=useTwoTap(()=>onDelete(entry.id));
  const auto=autoTagsOf(entry);
  const chip=(label,color,onX,key)=>(
    <span key={key} style={{display:'inline-flex',alignItems:'center',gap:3,fontSize:8,
      letterSpacing:0.5,padding:'1px 4px',borderRadius:2,border:`1px solid ${color}44`,
      color,background:`${color}14`,whiteSpace:'nowrap'}}>
      {label}
      {onX&&<span onClick={onX} style={{cursor:'pointer',color:'#64748b',fontSize:9,lineHeight:1}}>×</span>}
    </span>
  );
  const sug=allTags.filter(t=>t.toLowerCase().startsWith(tagDraft.trim().toLowerCase())
    &&!(entry.tags||[]).includes(t)&&tagDraft.trim()).slice(0,4);
  const commitTag=v=>{const t=(v??tagDraft).trim();if(!t)return;onAddTag(entry.id,t);setTagDraft('');};
  return(
    <div style={{background:'#0f172a',border:'1px solid #1e293b',borderRadius:2,
                 padding:'7px 8px',display:'flex',flexDirection:'column',gap:5,marginBottom:6}}>
      {/* header */}
      <div style={{display:'flex',alignItems:'center',gap:5,minWidth:0}}>
        <span style={{fontSize:8,letterSpacing:1,padding:'1px 4px',borderRadius:2,flexShrink:0,
          color:km.color,border:`1px solid ${km.color}55`,background:`${km.color}14`}}>{km.label}</span>
        {editing
          ?<input autoFocus value={draft} onChange={e=>setDraft(e.target.value)}
             onBlur={()=>{onRename(entry.id,draft);setEditing(false);}}
             onKeyDown={e=>{if(e.key==='Enter')e.target.blur();if(e.key==='Escape'){setDraft(entry.name);setEditing(false);}}}
             style={{flex:1,minWidth:0,background:'#020617',border:'1px solid #334155',borderRadius:2,
                     padding:'2px 5px',fontSize:11,color:'#e2e8f0',outline:'none',fontFamily:'inherit'}}/>
          :<span onClick={()=>{setDraft(entry.name);setEditing(true);}} title="Click to rename"
             style={{flex:1,minWidth:0,fontSize:11,color:'#cbd5e1',fontWeight:600,cursor:'text',
                     overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{entry.name}</span>}
        <span style={{fontSize:8,color:'#334155',flexShrink:0}}>{new Date(stampOf(entry)).toLocaleDateString()}</span>
        <button onClick={()=>setRwOpen(o=>!o)} title="Rewrite with current setup"
          style={{background:'none',border:'none',cursor:'pointer',fontSize:12,lineHeight:1,
                  padding:'0 2px',flexShrink:0,color:rwOpen?'#f59e0b':'#374151'}}>↺</button>
        <button onClick={delHandle} title={delPending?'Click again to delete':'Delete'}
          style={{background:'none',border:'none',cursor:'pointer',fontSize:12,lineHeight:1,
                  padding:'0 2px',flexShrink:0,color:delPending?'#ef4444':'#374151'}}>{delPending?'✓':'×'}</button>
      </div>
      {/* rewrite: explicit three-way, so promoting a chassis entry to a car is one click and
          nothing has to guess which payloads the user meant to overwrite */}
      {rwOpen&&<div style={{display:'flex',gap:3,alignItems:'center'}}>
        <span style={{fontSize:8,color:'#64748b',letterSpacing:1,flexShrink:0}}>REWRITE</span>
        {(kind==='dna'?[['dna','WITH EDITOR DNA']]:[['chassis','CHASSIS'],['build','BUILD'],['both','BOTH']]).map(([k,l])=>(
          <button key={k} className="tbtn" style={{fontSize:9,padding:'2px 5px'}}
            onClick={()=>{onRewrite(entry.id,k);setRwOpen(false);}}>{l}</button>
        ))}
      </div>}
      {kind!=='empty'&&<span style={{fontSize:9,color:'#475569'}}>{entrySummary(entry,metricUnits)}</span>}
      {kind==='empty'&&<span style={{fontSize:9,color:'#f59e0b'}}>Corrupt entry — no data. Delete it.</span>}
      {/* tags */}
      <div style={{display:'flex',flexWrap:'wrap',gap:3,alignItems:'center'}}>
        {auto.map((t,i)=>chip(t.label,t.color,null,'a'+i))}
        {(entry.tags||[]).map((t,i)=>chip(t,'#818cf8',()=>onRemoveTag(entry.id,t),'m'+i))}
      </div>
      <div style={{position:'relative'}}>
        <input value={tagDraft} onChange={e=>setTagDraft(e.target.value)}
          onKeyDown={e=>{if(e.key==='Enter')commitTag();if(e.key==='Escape')setTagDraft('');}}
          placeholder="+ tag"
          style={{width:'100%',background:'#020617',border:'1px solid #1e293b',borderRadius:2,
                  padding:'2px 5px',fontSize:9,color:'#e2e8f0',outline:'none',fontFamily:'inherit'}}/>
        {sug.length>0&&<div style={{display:'flex',gap:3,marginTop:3,flexWrap:'wrap'}}>
          {sug.map(t=>(
            <button key={t} onClick={()=>commitTag(t)} className="tbtn"
              style={{fontSize:8,padding:'1px 4px'}}>{t}</button>
          ))}
        </div>}
      </div>
      {/* notes */}
      {openNotes
        ?<div>
           <textarea value={entry.notes||''} autoFocus
             onChange={e=>onNotes(entry.id,e.target.value.slice(0,NOTES_MAX))}
             onBlur={()=>setOpenNotes(false)}
             rows={3}
             style={{width:'100%',background:'#020617',border:'1px solid #334155',borderRadius:2,
                     padding:'4px 5px',fontSize:10,color:'#e2e8f0',outline:'none',
                     fontFamily:'inherit',resize:'vertical'}}/>
           <div style={{fontSize:8,color:(entry.notes||'').length>NOTES_MAX*0.9?'#f59e0b':'#334155',textAlign:'right'}}>
             {(entry.notes||'').length}/{NOTES_MAX}
           </div>
         </div>
        :<span onClick={()=>setOpenNotes(true)} title="Click to edit notes"
           style={{fontSize:9,color:entry.notes?'#64748b':'#334155',cursor:'text',
                   overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
           {entry.notes?entry.notes.split('\n')[0]:'+ notes'}
         </span>}
      {/* load buttons — only for payloads this entry actually carries */}
      {kind==='dna'&&<div style={{display:'flex',gap:4}}>
        <button className="tbtn" style={{flex:1,fontSize:9}} onClick={()=>onLoadDna(entry)}>LOAD DNA</button>
      </div>}
      {kind!=='empty'&&kind!=='dna'&&<div style={{display:'flex',gap:4}}>
        {entry.ch&&<button className="tbtn" style={{flex:1,fontSize:9}}
          onClick={()=>onLoadChassis(entry)}>LOAD CHASSIS</button>}
        {(entry.fe||entry.dr)&&<button className="tbtn" style={{flex:1,fontSize:9}}
          onClick={()=>onLoadBuild(entry)}>LOAD BUILD</button>}
        <button className={`tbtn${codeCopied?' saved':''}`} style={{flex:1,fontSize:9}}
          onClick={()=>copyToClipboard(
            encodeTune(entry.ch||DEF_CH,entry.fe||DEF_FE,entry.dr||DEF_DR),
            ()=>{setCodeCopied(true);setTimeout(()=>setCodeCopied(false),1500);}
          )}>{codeCopied?'COPIED':'COPY CODE'}</button>
      </div>}
    </div>
  );
};

class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  render(){
    if(this.state.err)return(
      <div style={{padding:24,color:'#ef4444',fontFamily:'var(--font-mono)',fontSize:12,background:'#020617',minHeight:'100vh'}}>
        <div style={{marginBottom:8,color:'#e2e8f0',fontSize:14}}>SUSP.OS — Failed to load</div>
        <div style={{marginBottom:16,color:'#94a3b8'}}>An error occurred. Try reloading the page.</div>
        <div style={{background:'#0f172a',padding:12,borderRadius:4,border:'1px solid #1e293b',
                     whiteSpace:'pre-wrap',wordBreak:'break-all',lineHeight:1.6}}>
          {this.state.err.toString()}
        </div>
        <button onClick={()=>window.location.reload()}
          style={{marginTop:16,padding:'8px 16px',background:'#0f172a',border:'1px solid #1e293b',
                  color:'#e2e8f0',borderRadius:4,cursor:'pointer',fontFamily:'var(--font-mono)',fontSize:12}}>
          RELOAD
        </button>
      </div>
    );
    return this.props.children;
  }
}

// The path a guide is running: the whole array, or only its quick:true steps (QUICK START on a
// pathChoice card). A filtered view, not a second array — reordering or trimming steps in
// TUTORIALS reshapes the quick path with no other edit.
const tutSteps=(mode,quick)=>{const all=TUTORIALS[mode]??[];return quick?all.filter(x=>x.quick):all;};

// Standalone reference — unlike TUTORIALS this isn't a guided sequence, it's an
// always-available lookup for anyone who forgets what a term means. Not tier-gated:
// every term is shown regardless of BEG/INT/PRO, since a BEG user can still run into
// these words in a hint or a shared tune. Grouped to match how the app's own sections
// are organized, not alphabetically — easier to scan when you roughly know the area.
const GLOSSARY=[
  {group:'Ride & Springs',terms:[
    {term:'Hz (Ride Frequency)',def:'How many times per second a corner would bounce if pushed down and released. Higher Hz = stiffer spring, faster response, more control at the cost of compliance. Street cars usually run 1.0–1.8 Hz (the app\'s SOFT and ROAD bands); track cars 1.8–2.6 Hz (FIRM into RACE).'},
    {term:'Spring Rate (lb/in, N/mm or kgf/mm)',def:"The force needed to compress a spring by one unit of travel. SUSP.OS derives it from your Ride Stiffness (Hz) target and each axle's corner mass — you don't set it directly."},
    {term:'Flat Ride',def:"A rear Hz set slightly higher than front so a bump hits the rear axle just as the front axle's response is finishing, cancelling pitch (nose-dive/squat) at a chosen target speed. One of three ways to set the secondary axle's Hz, alongside MULTIPLIER (fixed ratio) and INDEPENDENT (manual)."},
    {term:'Corner Mass',def:"The weight resting on one wheel — total weight split by front/rear bias, then by two for each side. Drives spring rate and damping calculations, since a heavier corner needs more force to move the same amount."},
    {term:'Sag',def:"How far the suspension compresses under the car's own static weight, before any cornering or bumps. Softer springs sag more. The SAG vs LOAD chart in the VISUALS card plots it against increasing vertical load so you can see how much travel is left."},
    {term:'Bottoming',def:'Running out of suspension travel — the wheel compresses as far as it can go and the chassis takes the hit directly, which spikes grip loss mid-corner. Raising ride height or stiffening springs both buy travel back.'},
  ]},
  {group:'Damping',terms:[
    {term:'ζ (Zeta / Damping Ratio)',def:"How quickly a bounce dies out, expressed as a percentage of critical damping. 100% = critically damped (returns to rest in one smooth motion, no overshoot). SUSP.OS defaults to 70% (Butterworth) — one small overshoot of about 4%, then done, without feeling harsh. Below ~40% feels bouncy and underdamped; above ~100% feels sluggish and overdamped. No single ζ is best at everything: ≈59% gives the quickest settle after one bump, ≈70% the flattest response to a continuous road surface, 100% the quickest with no overshoot at all."},
    {term:'Critical Damping',def:"The exact amount of damping that stops a spring's oscillation as fast as possible without overshooting past rest. It's the reference point damping ratio (ζ) is measured against — ζ is always a percentage of this value, not an absolute number."},
    {term:'Butterworth (≈70% ζ)',def:"The damping ratio (≈0.707, rounded to 70% here) that gives the flattest, smoothest response with no resonant peak — borrowed from Butterworth filter design. That is a frequency-domain property — no road frequency the suspension amplifies more than the rest, which is what keeps a rough surface from setting the body rocking. It is not a settling-time claim: a single bump at 70% ζ overshoots about 4%, and the quickest ±10% settle actually sits nearer 59%. Butterworth gives up only a few hundredths of a second against that, which is why SUSP.OS defaults Rebound ζ to 70%: firm enough to control the car, soft enough not to feel harsh over bumps."},
    {term:'Rebound',def:'Damping resistance as the suspension extends — the wheel dropping back down after being compressed. Controls how fast the wheel returns to full extension after a bump or during weight transfer.'},
    {term:'Bump (Compression)',def:'Damping resistance as the suspension compresses — the wheel moving up into a bump or under load transfer. Usually softer than rebound; Bump Ratio expresses it as a percentage of the rebound value.'},
    {term:'Settle Time',def:'Seconds until the suspension is back inside ±10% of ride height after a disturbance and stays there — the standard settling-time definition. Short feels planted and controlled; long is more compliant over rough surfaces but can leave the car still moving mid-corner. Two readouts use the name: the DAMPERS rows show a quick estimate from rebound ζ and spring frequency alone, while the DYNAMICS chart measures its drawn curve, so it also sees your bump damping. They can differ — the chart is the one describing the trace beside it.'},
    {term:'Damping Balance Mode',def:'Sets how the Damping Bias slider splits rebound/bump ζ front to rear — independent of REBOUND MODE, which only decides how the anchor ζ is obtained (typed under CHARACTER, back-solved from a target time under SETTLE TIME). STANDARD biases the anchor directly by percentage. SYNC derives the other axle from its own Hz, using one of three Sync Methods: TIME SYNC, HYBRID or EQUAL FORCE. The slider itself never resets when you switch modes.'},
    {term:'TIME SYNC (Sync Method)',def:'Solves the front/rear damping split so both axles finish settling at the same time. Hz-aware, but ignores corner mass.'},
    {term:'EQUAL FORCE (Sync Method)',def:'Solves the front/rear damping split so both axles push the same actual damping force. Accounts for corner mass as well as Hz — useful when TIME SYNC’s equal timing still leaves one end feeling harsher.'},
    {term:'HYBRID (Sync Method)',def:'Each axle’s damping sits halfway between the TIME SYNC and EQUAL FORCE solutions — close to equal settle time and close to equal damping force, without fully committing to either.'},
  ]},
  {group:'Roll & Anti-Roll Bars',terms:[
    {term:'Roll Stiffness',def:"Total resistance to body lean in a corner, supplied by springs and ARBs together. How it's split front-to-rear — not its total amount — is what determines understeer/oversteer tendency."},
    {term:'ARB (Anti-Roll Bar)',def:"A bar linking the left and right wheels on one axle that resists body roll without stiffening the ride vertically (it only engages when one side compresses relative to the other). The front/rear ARB split is the main lever for mechanical handling balance."},
    {term:'Mech(anical) Balance',def:"The rear axle's fraction of total roll stiffness (springs + ARBs), on a 0–1 scale where 0.50 is perfectly even. Higher = more rear roll resistance = more oversteer tendency. Lower = more front resistance = more understeer tendency. Forza's own \"Mech Balance\" reading also counts the tyres, which flex in series with the suspension (see Tyre Compliance), so it moves less than the raw spring and bar split. Targets, MECH and CO-SOLVE all aim at the number Forza displays."},
    {term:'Tyre Compliance',def:"Tyres flex too, and that flex adds to the suspension's the way two springs stacked end to end do. The stiffer an axle's springs and bars get, the more the tyre limits it — so doubling a spring rate moves Forza's Mech Balance less than you'd expect. The app models this so its balance matches the game."},
    {term:'ARB Scale',def:"How much roll stiffness one ARB click is worth. It varies by car; the app uses a default unless you run ARB SCALE SETUP in Tune Check's MEASURE tab, which works it out from two in-game Mech Balance readings."},
    {term:'Natural (Mech) Balance',def:"What your mech balance would be from springs alone, at equal front/rear Hz (2.5 Hz, or the Hz you measured at), before any ARB is added — derived from track width and corner mass, or from an in-game MEASURE NAT BAL reading. The baseline everything else is compared against."},
  ]},
  {group:'ARB Modes',terms:[
    {term:'Stiffness Mode',def:'Sets how much total ARB the solver hands out, before any front/rear split. AUTO derives it from the car\'s natural roll tendency. BASIC sets an overall level directly (0% ≈ softest, 100% ≈ the stiffest bars the game allows). ROLL ° solves for a target body roll angle. SHARE % sets ARBs as a fraction of total roll stiffness. MAN (PRO) bypasses all of it and takes ARB clicks directly.'},
    {term:'Balance Mode',def:'Sets how the total ARB stiffness is split front to rear — the lever that actually moves handling balance. WEIGHT and NEUTRAL are available at INT; CHASSIS, MECH and CO-SOLVE unlock at PRO. Hidden while Stiffness Mode is MAN, since MAN sets both bars directly.'},
    {term:'WEIGHT (Balance Mode)',def:"Splits front/rear ARB from the car's raw weight distribution, then nudges it by the ARB Bias slider. The default, and the right choice before you've customised geometry or measured anything in-game."},
    {term:'NEUTRAL (Balance Mode)',def:"Solves the split so the ARBs exactly cancel the springs' contribution to the handling balance bar, bringing the car back to neutral regardless of how the springs are set. ARB Bias then nudges away from that neutral point rather than away from weight distribution."},
    {term:'CHASSIS (Balance Mode)',def:"WEIGHT's formula anchored to the car's actual natural mech balance — track-width-corrected geometry, or your MEASURE NAT BAL reading when one is set — instead of raw weight %. Use it once you've entered real geometry or measured in-game."},
    {term:'MECH (Balance Mode)',def:'Solves the ARB split alone to hit your Mech Balance Target exactly, as Forza displays it, leaving spring rates untouched. The most direct way to reach a specific target, at the cost of whatever ARB stiffness that demands.'},
    {term:'CO-SOLVE (Balance Mode)',def:'Adjusts rear spring Hz and the ARB split together to reach the Mech Balance Target as Forza displays it, so neither has to move as far alone. Spring Share controls how much of the correction each one carries.'},
    {term:'Spring Share',def:'In CO-SOLVE, how much of the balance correction comes from rear spring stiffness versus the ARB split. Higher = springs do more of the work and the bars stay softer; lower = the reverse. AUTO picks the split that keeps both within range.'},
  ]},
  {group:'Handling Balance',terms:[
    {term:'Understeer (US)',def:"The front tyres lose grip before the rear — the car doesn't turn as much as the steering input asks for. Feels stable and safe, but resists rotation."},
    {term:'Oversteer (OS)',def:'The rear tyres lose grip before the front — the car rotates more than the steering input asks for. Feels lively and rotates freely, but can snap if overdone.'},
    {term:'Grip Bias',def:"The car's physical at-the-limit handling tendency — derived from tyre load sensitivity and lateral load transfer, not just roll stiffness split. Distinct from Mech Balance: two cars with identical mech balance can have different grip bias if their tyre widths or load transfer differ."},
    {term:'Load Transfer',def:'Weight shifting onto the outside tyres as a car corners. More transfer on an axle reduces that axle\'s total available grip (since tyres lose grip faster than they gain load). Wider track and lower CG height both reduce it.'},
    {term:'Grip-Neutral',def:"The mech balance target that exactly opposes the car's natural grip tendency, shown as a row in the Balance Guide. Targeting it cancels the chassis's built-in push or looseness rather than reinforcing it — GRIP target mode aims here automatically."},
    {term:'Response (Planted / Reactive)',def:'A separate bar from US/OS, rating transient character — how quickly the car reacts to steering rather than which end lets go. PLANTED is settled and damped: predictable, slower to change direction. REACTIVE is quick to turn in but can feel nervous. A car can be perfectly neutral and still sit at either extreme. Weighted from front Hz (35%), rear Hz (20%), front toe (15%), caster (10%), front rebound damping (12%), and rear rebound damping (8%). Bump damping is deliberately absent — its effect on transient feel reverses between smooth and rough surfaces, which a single damping ratio cannot express.'},
  ]},
  {group:'Differential',terms:[
    {term:'Accel Lock',def:"How much the differential locks the driven wheels together under throttle. More lock forces both wheels to spin at closer to the same speed — more traction putting power down, but can add understeer (RWD/AWD) or resist rotation (FWD)."},
    {term:'Decel Lock',def:'Locking under lift-off or braking. More lock resists sudden weight-transfer oversteer on corner entry (lift-off oversteer); less lock allows freer rotation trail-braking into a corner.'},
  ]},
  {group:'Alignment',terms:[
    {term:'Camber',def:"The wheel's tilt viewed from the front — negative camber leans the top inward. Keeps more of the tyre's contact patch flat on the road once the body rolls in a corner."},
    {term:'Toe',def:'The angle the wheels point relative to straight-ahead, viewed from above. Toe-in (wheels angled inward) adds stability; toe-out adds sharper turn-in response at the cost of some straight-line stability.'},
    {term:'Caster',def:"The steering axis's forward/backward tilt. More caster adds self-centering feel and increases camber gain while turning (the outside tyre gains negative camber as you turn into a corner), at the cost of heavier steering effort."},
  ]},
];

const TutorialPanel=({mode,step,quick=false,onQuick,onNext,onPrev,onClose,onDone,zoom=1,units,setUnits,appState,notice})=>{
  const steps=tutSteps(mode,quick);
  const total=steps.length;
  const t=steps[step];
  // Optional step task: snapshot appState when the step opens so "changed" means
  // changed during this step, then latch done once check(appState,snap) passes.
  // Never gates NEXT — it's a nudge, not a lock.
  const task=t?.task;
  const taskSnap=useRef(null);
  const[taskDone,setTaskDone]=useState(false);
  useEffect(()=>{taskSnap.current=appState;setTaskDone(false);},[mode,step]); // eslint-disable-line
  useEffect(()=>{
    if(!task||taskDone||!appState||!taskSnap.current)return;
    try{if(task.check(appState,taskSnap.current))setTaskDone(true);}catch(e){}
  },[appState,task,taskDone]);
  // balance mode always anchors to the balance bar zone even though its steps have focus:null
  const focusKey=mode==='balance'?'balance-bar':(t?.focus?.[0]??null);
  // Widen on desktop: at the mobile width this stays 264 (unchanged), but a fixed
  // 264px card in a monospace font forces heavy line-wrapping on wide screens even
  // when the surrounding panel has plenty of room — a 4-sentence step can end up
  // needing a scrollbar purely from wrap count, not from actually being too long.
  const CARD_W=Math.round(Math.min(380,Math.max(264,(window.innerWidth/zoom)*0.24)));
  // pos: {top,left?,right?,arrowDir,arrowOff} or null = centred
  const[pos,setPos]=useState(null);
  const cardRef=useRef(null);
  const bodyRef=useRef(null);
  const[showMore,setShowMore]=useState(false);
  const checkOverflow=()=>{
    const el=bodyRef.current;
    setShowMore(!!el&&el.scrollHeight-el.scrollTop-el.clientHeight>4);
  };

  useEffect(()=>{
    const el=focusKey?document.getElementById('zone-'+focusKey):null;
    // Scroll sidebar so element is visible — use direct scrollTop rather than
    // scrollIntoView which can target the wrong scroll container on mobile
    if(el){
      const sidebar=document.querySelector('.sidebar-scroll');
      if(sidebar){
        const sr=sidebar.getBoundingClientRect();
        const er=el.getBoundingClientRect();
        if(er.top<sr.top+40||er.bottom>sr.bottom-40){
          const relTop=er.top-sr.top+sidebar.scrollTop;
          // Instant, not smooth — an in-flight smooth scroll wouldn't be done yet
          // when measure() reads positions below, leaving the card pointing at
          // where the target *used to* be instead of where it ends up.
          sidebar.scrollTo({top:Math.max(0,relTop-80),behavior:'auto'});
        }
      }
    }
    const measure=()=>{
      if(!el){setPos(null);return;}
      // Anchor to every spotlit zone, not just the first — a step spotlighting two
      // stacked controls would otherwise place the card over the second one.
      const keys=mode==='balance'?['balance-bar']:(t?.focus??[focusKey]);
      const rects=keys.map(k=>document.getElementById('zone-'+k)?.getBoundingClientRect())
        .filter(b=>b&&(b.width||b.height)&&b.right>0);
      // Hidden element (sidebar collapsed on desktop, or the mobile drawer parked off-screen
      // at translateX(-100%) — it stays mounted there so it can slide) → centre card
      if(!rects.length){setPos(null);return;}
      const raw={top:Math.min(...rects.map(b=>b.top)),bottom:Math.max(...rects.map(b=>b.bottom)),
        left:Math.min(...rects.map(b=>b.left)),right:Math.max(...rects.map(b=>b.right))};
      // getBoundingClientRect() returns visual (viewport) pixels, but position:fixed
      // coordinates inside a CSS-zoomed container are in zoomed units (divide by zoom).
      const r={top:raw.top/zoom,bottom:raw.bottom/zoom,left:raw.left/zoom,right:raw.right/zoom};
      const vw=window.innerWidth/zoom;
      // Use the *visible* viewport height (excludes the iOS address bar/toolbar).
      const vh=((window.visualViewport&&window.visualViewport.height)||window.innerHeight)/zoom;
      const midY=(r.top+r.bottom)/2;
      const midX=(r.left+r.right)/2;
      // Beside the sidebar only when the card fits there. On phones the sidebar is
      // nearly full-width, so the clamp below would drop the card on top of the very
      // control it points at — fall through to above/below placement instead.
      const sbEl=document.querySelector('.sidebar-scroll');
      const sbRight=sbEl?sbEl.getBoundingClientRect().right/zoom:r.right;
      if(midX<vw/2&&sbRight+10+CARD_W<=vw-8){
        // LEFT panel: float card just past the sidebar's right edge, sized to its
        // actual content rather than a fixed offset from the target's midpoint —
        // a target sitting low in a long sidebar section (e.g. a tall BALANCE
        // section) shouldn't pin the card low too and starve it of height the
        // (mostly empty, since it's just dimmed background above) rest of the
        // screen has plenty of. Ceiling is near-full viewport height; the card
        // then only takes what its own content actually needs, centred on the
        // target and clamped to stay fully on-screen.
        const left=sbRight+10;
        const maxH=Math.max(140,vh-16);
        const rawCardH=cardRef.current?.getBoundingClientRect().height;
        const cardH=Math.min(rawCardH?rawCardH/zoom:maxH,maxH);
        const top=Math.max(8,Math.min(vh-cardH-8,midY-cardH/2));
        const arrowOff=Math.max(16,Math.min(cardH-16,midY-top));
        setPos({top,left,arrowDir:'left',arrowOff,maxH});
      } else {
        // RIGHT panel (output, balance-bar), or a sidebar target with no room beside
        // the sidebar (phones): float the card above or below the
        // element, whichever side has more room — hugging its actual rendered
        // height rather than filling all available space on that side, but a
        // target sitting near the top of the viewport (little room above, most
        // of the screen free below it) shouldn't get starved into a short box
        // above it when the space below goes unused.
        const GAP=10;
        const availAbove=r.top-8-GAP;
        const availBelow=vh-r.bottom-GAP-8;
        const below=availBelow>availAbove;
        const availH=below?availBelow:availAbove;
        // cardRef's rect is raw (post-zoom) viewport pixels, but everything else in this
        // branch (r.top, maxH, vh) is pre-zoom — must divide by zoom before mixing them,
        // or the card renders too tall/low and can push off the bottom of the viewport
        // at any zoom level other than 100% (the default is 110%, so this hit everyone).
        // Reads the card's *unconstrained* height from its last render — steps always
        // render once via the centred fallback (generous ~100dvh cap) before this first
        // measure() runs, so this reflects what the content actually needs, not last
        // step's clamped leftovers.
        const rawCardH=cardRef.current?.getBoundingClientRect().height;
        const naturalH=rawCardH?rawCardH/zoom:null;
        // Some right-panel targets (zone-output) span nearly the full panel height,
        // starting almost at the very top — leaving no real room to float a card
        // above OR below them. Picking whichever sliver is merely the *larger* of
        // two bad options still forces a scrollbar on content that would fit fine
        // centred with the ~full-viewport room that fallback gets. Centre instead
        // whenever neither side can actually fit what the card needs.
        const MIN_USABLE=180;
        const need=naturalH?Math.min(naturalH,vh-24):MIN_USABLE;
        if(availH<MIN_USABLE||availH<need){
          // A sidebar section taller than the screen (phones): no side is free, and
          // centring covers the middle of it. Pin to the bottom edge instead so the
          // section header and its first controls — where the sidebar scroll put
          // them — stay in view.
          if(midX<vw/2){
            const maxH=Math.max(140,vh-24);
            const cardH=Math.min(naturalH??maxH,maxH);
            setPos({top:vh-cardH-8,left:Math.max(8,(vw-CARD_W)/2),arrowDir:'none',maxH});
            return;
          }
          setPos(null); return;
        }
        const maxH=Math.max(140,Math.min(availH,vh-24));
        const cardH=Math.min(naturalH??maxH,maxH);
        const top=below?Math.min(vh-cardH-8,r.bottom+GAP):Math.max(8,r.top-cardH-GAP);
        const left=Math.max(8,Math.min(vw-CARD_W-8,midX-CARD_W/2));
        const arrowOff=Math.max(12,Math.min(CARD_W-24,midX-left));
        setPos({top,left,arrowDir:below?'up':'down',arrowOff,maxH});
      }
    };
    // Slight delay lets the accordion open/collapse reflow settle before we measure
    const tid=setTimeout(measure,60);
    // Again once the mobile drawer's .2s slide has finished — at 60ms it is still moving.
    const tid2=setTimeout(measure,260);
    window.addEventListener('resize',measure);
    if(window.visualViewport)window.visualViewport.addEventListener('resize',measure);
    return()=>{clearTimeout(tid);clearTimeout(tid2);window.removeEventListener('resize',measure);
      if(window.visualViewport)window.visualViewport.removeEventListener('resize',measure);};
  },[focusKey,step]); // eslint-disable-line

  // Detect body text overflowing its scrollable area (can happen when the target sits
  // low enough that maxH gets clamped small) so we can show a "more below" affordance —
  // otherwise clipped content has no visual cue that it's there at all.
  useEffect(()=>{
    // Two staggered checks: pos settling (measure()'s own 60ms delay) doesn't guarantee
    // the body div's final scrollHeight is painted yet, so re-check once more shortly
    // after — cheap, and avoids a "false: fits" read that hides a real overflow.
    const t1=setTimeout(checkOverflow,120);
    const t2=setTimeout(checkOverflow,320);
    window.addEventListener('resize',checkOverflow);
    return()=>{clearTimeout(t1);clearTimeout(t2);window.removeEventListener('resize',checkOverflow);};
  },[step,pos]); // eslint-disable-line

  if(!t)return null;
  // 'HANDLING' (not 'BALANCE') — this tutorial mode walks through the Handling Balance
  // results bar, which would otherwise render as "BALANCE GUIDE" and collide with the
  // sidebar's actual BALANCE section, which has its own unrelated "BALANCE GUIDE" widget.
  const mLabel={beginner:'BEG',intermediate:'INT',pro:'PRO',balance:'HANDLING'}[mode]??mode.toUpperCase();
  const btnStyle={background:'none',border:'1px solid #1e293b',borderRadius:2,color:'#9ca3af',
    fontFamily:'var(--font-mono)',fontSize:10,padding:'4px 10px',cursor:'pointer',letterSpacing:1};

  const cardBase={position:'fixed',zIndex:700,width:CARD_W,
    maxHeight:'calc(100dvh - 40px)',display:'flex',flexDirection:'column',
    background:'#0f172a',border:'1px solid #334155',borderRadius:4,
    padding:'16px 16px 14px',boxShadow:'0 8px 40px #000d',fontFamily:'var(--font-mono)'};
  const cardStyle=pos
    ?{...cardBase,top:pos.top,...(pos.left!==undefined?{left:pos.left}:{right:pos.right}),
       maxHeight:pos.maxH}
    :{...cardBase,top:'50%',left:'50%',transform:'translate(-50%,-50%)'};

  const arrow=(()=>{
    if(!pos||pos.arrowDir==='none')return null;
    const base={position:'absolute',width:0,height:0};
    if(pos.arrowDir==='left') return(<>
      <div style={{...base,left:-8,top:pos.arrowOff-8,
        borderTop:'8px solid transparent',borderBottom:'8px solid transparent',borderRight:'8px solid #334155'}}/>
      <div style={{...base,left:-6,top:pos.arrowOff-7,
        borderTop:'7px solid transparent',borderBottom:'7px solid transparent',borderRight:'7px solid #0f172a'}}/>
    </>);
    if(pos.arrowDir==='up') return(<>
      <div style={{...base,top:-8,left:pos.arrowOff-8,
        borderLeft:'8px solid transparent',borderRight:'8px solid transparent',borderBottom:'8px solid #334155'}}/>
      <div style={{...base,top:-6,left:pos.arrowOff-7,
        borderLeft:'7px solid transparent',borderRight:'7px solid transparent',borderBottom:'7px solid #0f172a'}}/>
    </>);
    return(<>
      <div style={{...base,bottom:-8,left:pos.arrowOff-8,
        borderLeft:'8px solid transparent',borderRight:'8px solid transparent',borderTop:'8px solid #334155'}}/>
      <div style={{...base,bottom:-6,left:pos.arrowOff-7,
        borderLeft:'7px solid transparent',borderRight:'7px solid transparent',borderTop:'7px solid #0f172a'}}/>
    </>);
  })();

  return(
    <div ref={cardRef} style={cardStyle}>
      {arrow}
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:6}}>
        <div>
          <span style={{fontSize:10,color:'#94a3b8',letterSpacing:2}}>{mLabel} GUIDE  ·  {step+1} / {total}</span>
          <div style={{fontSize:13,color:'#e2e8f0',fontWeight:700,marginTop:3,letterSpacing:0.5}}>{t.title}</div>
        </div>
        <button onClick={onClose} style={{...btnStyle,padding:'3px 8px',marginTop:2,color:'#94a3b8'}}>✕</button>
      </div>
      {/* progress bar */}
      <div style={{display:'flex',gap:3,marginBottom:10}}>
        {steps.map((_,i)=>(
          <div key={i} style={{height:2,flex:1,borderRadius:1,transition:'background .2s',
            background:i<step?'#334155':i===step?'#6366f1':'#1e293b'}}/>
        ))}
      </div>
      <div style={{position:'relative',flex:1,minHeight:0,display:'flex',flexDirection:'column'}}>
        {notice&&step===0&&(
          <div style={{fontSize:11,color:'#fbbf24',border:'1px solid #78350f',background:'#1c1206',
                       borderRadius:2,padding:'6px 8px',margin:'0 0 8px',lineHeight:1.5}}>🔒 {notice}</div>
        )}
        <div ref={bodyRef} onScroll={checkOverflow}
             style={{fontSize:11,color:'#94a3b8',lineHeight:1.65,margin:'0 0 10px',
                 overflowY:'auto',flex:1,minHeight:0,
                 WebkitOverflowScrolling:'touch',overscrollBehavior:'contain'}}>
          {t.terms
            ? t.terms.map(x=>(
                <div key={x.term} style={{marginBottom:8}}>
                  <div style={{fontSize:12,fontWeight:700,color:'#e2e8f0',marginBottom:2,
                               fontFamily:'var(--font-mono)'}}>{x.term}</div>
                  <div>{x.def}</div>
                </div>
              ))
            : t.body}
          {quick&&step===total-1&&<div style={{marginTop:10,color:'#818cf8'}}>That's the quick start. Tap ? in the header any time to replay the full tour.</div>}
          {t.units&&units&&<div style={{marginTop:10}}><UnitsPicker units={units} setUnits={setUnits}/></div>}
          {task&&<div data-tut-task={taskDone?'done':'pending'}
               style={{marginTop:10,padding:'6px 8px',border:'1px solid '+(taskDone?'#166534':'#312e81'),
                 borderRadius:2,display:'flex',gap:8,alignItems:'flex-start',
                 color:taskDone?'#4ade80':'#c7d2fe',transition:'color .2s,border-color .2s'}}>
            <span style={{fontWeight:700,flexShrink:0}}>{taskDone?'✓':'○'}</span>
            <span><span style={{letterSpacing:1,fontSize:9,opacity:.8}}>TRY IT · </span>{task.text}</span>
          </div>}
        </div>
        {showMore&&<div style={{position:'absolute',left:0,right:0,bottom:10,height:26,
             background:'linear-gradient(transparent,#0f172a)',pointerEvents:'none',
             display:'flex',alignItems:'flex-end',justifyContent:'center'}}>
          <span style={{fontSize:9,color:'#818cf8',letterSpacing:1,paddingBottom:1}}>▼ SCROLL FOR MORE</span>
        </div>}
      </div>
      <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
        {step>0&&<button style={btnStyle} onClick={onPrev}>← PREV</button>}
        {t.pathChoice&&!quick&&onQuick
          ?<><button style={btnStyle} onClick={onQuick}>QUICK START</button>
             <button style={{...btnStyle,borderColor:'#4f46e5',color:'#818cf8'}} onClick={onNext}>FULL TOUR →</button></>
          :step<total-1
          ?<button style={{...btnStyle,borderColor:'#4f46e5',color:'#818cf8'}} onClick={onNext}>NEXT →</button>
          :<button style={{...btnStyle,borderColor:'#16a34a',color:'#4ade80'}} onClick={onDone??onClose}>DONE ✓</button>}
      </div>
    </div>
  );
};

// ────────────────────────────────────────────────────────────────────────────
function App(){
  // The *Raw setters bypass undo history. Only effects that DERIVE state (migrations, the RIDE
  // HEIGHT → CG sync, tier fallbacks, BOTTOM G, ARB unit conversion) and the restore itself use
  // them. Everything a user does goes through setCh/setFe/setDr/setAl below, which record.
  const[ch,setChRaw]=usePersist('suspos_ch_v8',DEF_CH);
  const[fe,setFeRaw]=usePersist('suspos_fe_v8',DEF_FE);
  const[dr,setDrRaw]=usePersist('suspos_dr_v8',DEF_DR);
  const[al,setAlRaw]=usePersist('suspos_al_v2',DEF_AL);
  // Declared this early because the tier effects below list restoreTick as a dependency, and
  // Babel's const→var would read it as undefined further down. Wiring: "Undo / redo wiring".
  const histRef=useRef(null);
  if(!histRef.current)histRef.current=makeHistory();
  const[,bumpHist]=useReducer(x=>x+1,0);
  const[restoreTick,setRestoreTick]=useState(0);
  const restoringRef=useRef(false);
  const recordChangeRef=useRef(()=>{});
  const recordChange=()=>recordChangeRef.current();
  const setCh=v=>{recordChange();setChRaw(v);};
  const setFe=v=>{recordChange();setFeRaw(v);};
  const setDr=v=>{recordChange();setDrRaw(v);};
  const setAl=v=>{recordChange();setAlRaw(v);};
  const[units,setUnits]=usePersist('suspos_units_v2',legacyUnits());
  const mMass=units.mass==='kg',mSpring=springUnit(units.spring),mLen=units.length==='cm',mSpeed=units.speed==='kmh';
  const[showUnits,setShowUnits]=useState(false);
  const[saves]=usePersist('suspos_saves_v9',PRESET_SAVES); // read-only: legacy slots, source for one-time MY BUILDS migration
  const[uiMode,setUiMode]=usePersist('suspos_uimode_v1','beginner');
  // Read-only since the header zoom buttons were removed — the persisted value is still
  // honoured (anyone who had set a custom zoom keeps it) but the app no longer writes it.
  // Browser zoom (Ctrl +/-) covers the same need.
  const[uiZoom]=usePersist('suspos_zoom_v1',1.1);
  const[tutSeen,setTutSeen]=usePersist('suspos_tutorial_seen_v1',{beginner:false,intermediate:false,pro:false});
  const[balTutSeen,setBalTutSeen]=usePersist('suspos_baltut_seen_v1',false);
  // Last step reached per tier guide, so ? can offer RESUME. 0 = nothing to resume;
  // cleared on DONE and by RESET (Tutorials). Clamped on read — steps get added and removed.
  const[tutProgress,setTutProgress]=usePersist('suspos_tutorial_step_v1',{beginner:0,intermediate:0,pro:0});
  const[balTutOpen,setBalTutOpen]=useState(false);
  const[balTutStep,setBalTutStep]=useState(0);
  const openBalTut=()=>{setBalTutStep(0);setBalTutOpen(true);};
  const closeBalTut=()=>setBalTutOpen(false);
  const[onboardSeen,setOnboardSeen]=usePersist('suspos_onboard_v1',true);
  // LEGACY — still read by the saves_v9 migration below and by the Beginner builds drawer.
  // The suspos_builds_v1 KEY itself is also a migration source for the unified garage; see
  // the note on that effect. Do not remove.
  const[myBuilds,setMyBuilds]=usePersist('suspos_builds_v1',[]);
  // Unified GARAGE entry list — chassis / build / car entries in one place.
  const[entries,setEntries]=usePersist('suspos_garage_v2',[]);
  // Standalone, deliberately NOT a key in `open`: the SECTIONS −/+ buttons blanket-toggle
  // every key in that object, which would fling a full-height overlay across the results
  // with no visible cause.
  const[garagePanelOpen,setGaragePanelOpen]=useState(false);
  const[entryName,setEntryName]=useState('');
  // Filter and sort are stable preferences worth persisting. Deliberately an OBJECT-valued
  // key, so mergeDefaults actually merges it — unlike the entry array, a new field added
  // here later gets its default for free. Search text is intentionally NOT persisted: a
  // search box that silently hides most of the garage after a reload, with the reason
  // scrolled out of view, is a bug factory.
  const[garageUI,setGarageUI]=usePersist('suspos_garage_ui_v1',{filter:'all',sort:'recent'});
  const[garageSearch,setGarageSearch]=useState('');
  // Vehicle DNA. `draft` is the DNA modal's editor; `applied` is the last APPLY — its name, the
  // axis targets, and what measureDNA read straight after, which is the baseline drift is judged
  // against. Cleared by anything that replaces the tune wholesale, and before leaving PRO.
  const[dnaStore,setDnaStore]=usePersist('suspos_dna_v1',{draft:DNA_ARCHETYPES[0],applied:null});
  const[dnaTierWarn,setDnaTierWarn]=useState(null);
  const[dnaEntryName,setDnaEntryName]=useState('');
  const[showDnaModal,setShowDnaModal]=useState(false);
  // One-time migration: pull any customized old preset slots (suspos_saves_v9) into MY BUILDS.
  // The 6 factory slots that match their defaults are skipped; only renamed/overwritten slots move.
  // Non-destructive (old key left intact); guarded by a flag so it runs at most once per browser.
  useEffect(()=>{
    try{
      if(localStorage.getItem('suspos_builds_migrated_v1'))return;
      const migrated=[];
      for(let i=1;i<=6;i++){
        const s=saves[i],def=PRESET_SAVES[i];
        if(!s||!def)continue;
        const customized=s.name!==def.name||JSON.stringify(s.fe)!==JSON.stringify(def.fe)||JSON.stringify(s.dr)!==JSON.stringify(def.dr);
        if(!customized)continue;
        // skip if MY BUILDS already has an identical entry (idempotency safety)
        const dup=myBuilds.some(b=>b.name===s.name&&JSON.stringify(b.fe)===JSON.stringify(s.fe)&&JSON.stringify(b.dr)===JSON.stringify(s.dr));
        if(dup)continue;
        migrated.push({id:Date.now()+i,name:s.name,fe:{...DEF_FE,...s.fe},dr:{...DEF_DR,...s.dr},savedAt:'imported'});
      }
      if(migrated.length)setMyBuilds(b=>[...migrated,...b]);
      localStorage.setItem('suspos_builds_migrated_v1','1');
    }catch(e){/* corrupt/unavailable storage — skip migration, never block load */}
  },[]); // eslint-disable-line
  // One-time migration: fold the two legacy lists (chassis-only GARAGE + tune-only MY BUILDS)
  // into the unified suspos_garage_v2 entry list. Third link in the chain
  // suspos_saves_v9 → suspos_builds_v1 → suspos_garage_v2, so it must run AFTER the effect
  // above or it would miss slots that migration just pulled in.
  //
  // Reads localStorage directly rather than the `garage`/`myBuilds` state: both effects run
  // on the same mount pass, so the state variables still hold their render-time (pre-migration)
  // values, while localStorage is already current — usePersist's setter writes synchronously.
  useEffect(()=>{
    try{
      // NOTE: suspos_garage_v1 and suspos_builds_v1 no longer have any UI or React binding —
      // these two getItem calls are their ONLY remaining readers. They look like dead keys to
      // a search-based audit; deleting them (or this effect) silently loses every saved
      // chassis and build for anyone who hasn't opened the app since the unification.
      if(localStorage.getItem('suspos_garage_unified_v2'))return;
      const rd=k=>{try{const v=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(v)?v:[];}catch{return[];}};
      const migrated=unifyLegacy(rd('suspos_garage_v1'),rd('suspos_builds_v1'));
      if(migrated.length){
        const sig=e=>JSON.stringify([e.name,e.ch??null,e.fe??null,e.dr??null]);
        const seen=new Set(entries.map(sig));
        const fresh=migrated.filter(e=>!seen.has(sig(e)));
        // exactly ONE set call — see the usePersist note; combining two would clobber
        if(fresh.length)setEntries([...fresh,...entries]);
      }
      localStorage.setItem('suspos_garage_unified_v2','1');
    }catch(e){/* corrupt/unavailable storage — skip migration, never block load */}
  },[]); // eslint-disable-line
  // One-time migration: MAN moved from Balance Mode (arbBalMode) to Stiffness Mode (arbMode).
  // sanitizeTune carries the matching fix for LOAD CODE imports; this covers plain persisted
  // state from before the move (self-guarding — once fixed, the condition never matches again).
  useEffect(()=>{
    if(fe.arbBalMode==='man'&&fe.arbMode!=='man'){
      setFeRaw(p=>({...p,arbBalMode:'manual',arbMode:'man'}));
    }
  },[]); // eslint-disable-line
  // One-time migration: Settle Sync (boolean settleMode + its own settleBias field) replaced
  // by dampBalMode (STANDARD/SYNC/NEUTRAL) + the unified dampingBias. sanitizeTune carries the
  // matching fix for LOAD CODE imports; this covers plain persisted state from before the move.
  // mergeDefaults spreads DEF_FE under the persisted blob, so a legacy save still carries
  // settleMode/settleBias verbatim (DEF_FE no longer defines those keys to override them) —
  // self-guarding, since destructuring them out here means the condition never matches again.
  useEffect(()=>{
    if(fe.settleMode!=null){
      setFeRaw(p=>{
        const{settleMode:_sm,settleBias:_sb,...rest}=p;
        return{...rest,...migrateDampBalMode(p)};
      });
    }
  },[]); // eslint-disable-line
  const[showComplexity,setShowComplexity]=useState(false);
  const closeOnboard=()=>{setOnboardSeen(true);setShowComplexity(false);};
  const[tutMode,setTutMode]=useState(null);
  const[tutStep,setTutStep]=useState(0);
  const[tutQuick,setTutQuick]=useState(false); // QUICK START chosen on a pathChoice card — see tutSteps
  const[tutResume,setTutResume]=useState(null); // {mode, step} while the RESUME / START OVER choice is up
  const savedTutStep=mode=>{
    const n=+tutProgress?.[mode]||0,len=TUTORIALS[mode]?.length??0;
    return len?Math.max(0,Math.min(Math.floor(n),len-1)):0;
  };
  const openTut=(mode,step=0)=>{
    setTutMode(mode);setTutStep(step);setTutQuick(false);
    // The opening step's sidebar is driven by its own metadata; default to open otherwise.
    // The [tutMode, tutStep] effect below then applies sections/garage/sidebar for that step.
    if(!TUTORIALS[mode]?.[step]?.sidebar)setSidebarOpen(true);
  };
  // Header ?: offer to resume where this tier's guide was left, if anywhere past step 0
  const askTut=mode=>{
    const n=savedTutStep(mode);
    if(n>0)setTutResume({mode,step:n});else openTut(mode);
  };
  useEffect(()=>{
    if(tutMode&&tutMode!=='balance'&&!tutQuick&&(tutProgress?.[tutMode]??0)!==tutStep)
      setTutProgress(p=>({...p,[tutMode]:tutStep}));
  },[tutMode,tutStep,tutQuick]); // eslint-disable-line
  // One-shot note on the guide's first card explaining a locked-tier redirect; cleared on close
  const[tutNotice,setTutNotice]=useState(null);

  const finishTut=()=>{const m=tutMode;setTutProgress(p=>({...p,[m]:0}));closeTutEnd();};

  // Gating: INT requires BEG completion, PRO requires INT completion
  const canAccessMode=m=>{

  // `open` holds two unrelated kinds of flag: the collapsible SIDEBAR SECTIONS (SECTION_KEYS
  // below — exactly one per <Sec>, all nine of them, `visuals` included), and flags that are
  // not sections at all — balanceExpanded (the balance detail overlay), factoryOpen (the
  // GARAGE factory list) and the vis* cards NESTED INSIDE the VISUALS section. The SECTIONS
  // −/+ buttons used to blanket-toggle `Object.keys(p)`, which reached all of those: + popped
  // the balance overlay and every visualisation card open, − closed the factory list. They
  // now walk SECTION_KEYS, so they move exactly what their label says.
  //
  // Keep SECTION_KEYS and this initialiser in step when adding a <Sec> — grep the Sec call
  // sites for the authoritative list. A section missing from EITHER is skipped by expand-all while
  // still collapsing and toggling normally, which is how `alignment` hid: absent from the
  // initialiser, it read as falsy and `tog` worked, so nothing looked broken until + failed
  // to open that one section, in PRO only.
  const SECTION_KEYS=['chassis','build','balance','ride','dampers','arb','drivetrain','alignment','visuals'];
  const[open,setOpen]=useState({chassis:false,build:false,balance:false,ride:false,dampers:false,arb:false,drivetrain:false,alignment:false,balanceExpanded:false,factoryOpen:true,dnaSavedOpen:true,visuals:false,visDna:true,visArb:true,visRideDampers:true,visDynamics:true,visSag:true});
  // RIDE HEIGHT → CG: when active, keep ch.cgHeight in sync with the ride-height/tyre-radius
  // estimate instead of leaving it as a plain manual field. Only writes when both tyre sizes
  // parse to a full radius, and only when the rounded-mm result actually changed, so this

  useEffect(()=>{
    if(!ch.useRideHeightCG)return;

    const rideHeightAvg=(ch.rideHeightF*1000)*(ch.frontBias/100)+(ch.rideHeightR*1000)*(1-ch.frontBias/100);

  },[ch.useRideHeightCG,ch.rideHeightF,ch.rideHeightR,ch.tyreF,ch.tyreR,ch.frontBias,ch.cgHeight]); // eslint-disable-line
  const[showChecker,setShowChecker]=useState(false);
  const[checkerInitMode,setCheckerInitMode]=useState('decode');

  // Auto-scale chassis geometry with weight in BEG/INT modes

  useEffect(()=>{

      // and (INT) edit it same as AUTO/ROLL/SHARE, so it's deliberately left out of this reset.
      const arbOk=p.arbBalMode!=='mech'&&p.arbBalMode!=='coSolve'&&p.arbBalMode!=='man';
      const hzOk=p.rearHzMode!=='mech';

    // toggle visible renders the whole DRIVETRAIN diff section blank at BEG/INT.
    setDrRaw(p=>p.diffManual?{...p,diffManual:false}:p);
  },[uiMode,restoreTick]); // eslint-disable-line

  // sidebar grows with the display: 300px baseline, up to 440px at very wide screens.
  // Mobile: 88% of the screen capped at 360, so small phones keep a tappable backdrop strip
  // and large phones get the room.
  const sidebarWidth=isMobile?Math.min(360,Math.floor(windowWidth*0.88)):Math.min(440,Math.max(340,Math.floor(windowWidth*0.25)));

  // Below this width the units / game-mode / tier groups move out of header row 1 and into
  // header row 2 and the top of the sidebar. THREE gate sites read this flag and must stay in
  // sync — header row 1, header row 2, sidebar top — or those controls become unreachable in
  // the gap. Deliberately NOT folded into isMobile, which also drives the sidebar overlay, the
  // backdrop, sidebarWidth and the brand sizing; this flag decides placement only.
  // Do not lower 1000 without re-measuring the GARAGE button's right edge against the viewport
  // (it was flush at exactly 960). Full measurement and rationale: docs/CODE_MAP.md.
  const headerCompact=windowWidth<1000;

  const pCh=k=>v=>setCh(p=>({...p,[k]:v}));
  const pFe=k=>v=>setFe(p=>({...p,[k]:v}));
  const pDr=k=>v=>setDr(p=>({...p,[k]:v}));
  const pAl=k=>v=>setAl(p=>({...p,[k]:v}));
  const tog=k=>()=>setOpen(p=>({...p,[k]:!p[k]}));

  // ─── Undo / redo wiring ─────────────────────────────────────────────────────
  // makeHistory holds the stacks; this drives it. snapRef is rebuilt on every render, so it is
  // always the settled state, and its identity tells close() whether a render has happened.
  // dnaApplied rides along so undoing APPLY also removes the DNA link, and redo restores it.
  const snapRef=useRef(null);
  snapRef.current={ch,fe,dr,al,dnaApplied:dnaStore.applied??null};
  const burstTimerRef=useRef(null);
  const pointerDownRef=useRef(false);
  const inCommitRef=useRef(false);
  const endBurst=()=>{
    clearTimeout(burstTimerRef.current);
    if(histRef.current.close(snapRef.current))bumpHist();
  };
  // A pause with the pointer still held (a slow drag) doesn't end the burst; release does.
  const armBurstTimer=()=>{
    clearTimeout(burstTimerRef.current);

  };
  recordChangeRef.current=()=>{
    if(inCommitRef.current)return;
    if(histRef.current.record(snapRef.current))bumpHist();
    armBurstTimer();
  };
  // A discrete action: one labelled step, whatever the setters inside `fn` do. The raw and
  // recording setters behave the same inside it.
  const commit=(label,fn)=>{
    clearTimeout(burstTimerRef.current);
    histRef.current.commit(snapRef.current,label);
    inCommitRef.current=true;
    try{fn();}finally{inCommitRef.current=false;}
    bumpHist();
  };
  // restoringRef tells the effects that react to a CHANGE (ARB unit conversion on physMode, BOTTOM G's
  // RIDE REF mirror) that this change is a restore: the snapshot already holds their output, and
  // running them again would convert twice. The last effect in App clears it. restoreTick re-runs the
  // tier effects instead, because a snapshot taken in PRO can be restored while in BEG or INT.
  const restoreSnap=s=>{

  };

    clearTimeout(burstTimerRef.current);

  };
  const redo=()=>{
    clearTimeout(burstTimerRef.current);
    const s=histRef.current.redo(snapRef.current);

  const canUndo=histRef.current.canUndo,canRedo=histRef.current.canRedo;
  const histTitle=(verb,label,can)=>!can?`Nothing to ${verb.toLowerCase()}`

    };

    const up=()=>{pointerDownRef.current=false;histKeysRef.current.endBurst();};
    const blur=()=>histKeysRef.current.endBurst();

    window.addEventListener('pointerdown',down,true);
    window.addEventListener('pointerup',up,true);
    window.addEventListener('pointercancel',up,true);
    window.addEventListener('focusout',blur,true);
    return()=>{
      window.removeEventListener('keydown',onKey);
      window.removeEventListener('pointerdown',down,true);
      window.removeEventListener('pointerup',up,true);
      window.removeEventListener('pointercancel',up,true);
      window.removeEventListener('focusout',blur,true);
    };
  },[]);

  const cm=useMemo(()=>cornerMasses(ch),[ch]);
  const dispMass=kg=>mMass?`${Math.round(kg)} kg`:`${Math.round(kg/KG_TO_LB)} lb`;
  const natGripBalance=balanceFromRsBal(ch,naturalMechBalanceOf(ch));
  // The single TARGET/GRIP resolution funnel — see resolveFeEffective.
  const feEffective=resolveFeEffective(ch,fe);
  const solved=useMemo(()=>solveTune(ch,feEffective,fe.gameMode),[ch,feEffective,fe.gameMode]);
  const physics=solved.physics,tune=solved.tune;
  const dnaDraft=useMemo(()=>sanitizeDNA(dnaStore.draft),[dnaStore.draft]);
  // sanitizeDNA drops `base`, so read it off the stored draft. An edited archetype applies under
  // its own name plus "(edited)", so the sidebar never claims a stock GT3 that isn't one.
  // `ref` is what the draft was loaded from: an archetype by name, or a saved DNA by entry id.
  // A saved one is read live, so renaming or rewriting the entry is reflected at once; if it was
  // deleted, the snapshot taken at load stands in.
  const dnaRef=(()=>{
    const r=dnaStore.draft?.ref;
    if(r?.id!=null){
      const e=entries.find(x=>x.id===r.id&&kindOf(x)==='dna');
      return e?{id:e.id,name:e.name,axes:sanitizeDNA(e.dna).axes}:(r.axes?{name:r.name,axes:r.axes}:null);
    }
    const a=DNA_ARCHETYPES.find(x=>x.name===(r?.name??dnaStore.draft?.base??dnaStore.draft?.name));
    return a?{name:a.name,axes:a.axes}:null;
  })();
  const dnaEdited=!!dnaRef&&DNA_AXIS_UI.some(({k})=>Math.abs((dnaRef.axes[k]??NaN)-dnaDraft.axes[k])>1e-9||!isFinite(dnaRef.axes[k]));
  const dnaName=dnaRef?(dnaEdited?dnaRef.name+' (edited)':dnaRef.name):dnaDraft.name;
  // Only solved while the editor is on screen — the resolver runs many forward solves.
  const dnaPreview=useMemo(()=>uiMode==='pro'&&showDnaModal?applyDNA(ch,fe,dr,dnaDraft):null,

  const dnaLink=useMemo(()=>{
    const a=dnaStore.applied;
    if(!a||uiMode!=='pro')return null;

    const rows=DNA_AXIS_UI.map(({k})=>{
      const was=a.achieved?.[k],cur=now[k];
      const drift=was==null?cur!=null:cur==null||Math.abs(cur-was)>tol[k];

  const dnaSave=()=>{
    const now=Date.now(),name=dnaEntryName.trim()||dnaName;
