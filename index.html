  // without the tyre term, about half what 73/74 mean; decoding drops them (unknown id) rather than
  // misread a stale scale as half-stiff bars. See docs/CODEC.md.
];
const codecFieldDefault=f=>f.tyre?f.def:DEF_GROUPS[f.group][f.key];
const codecReadField=(src,f)=>{
  if(f.tyre){
    const t=parseTyre(f.tyre==='F'?src.ch.tyreF:src.ch.tyreR);
    return t?.[f.part]??f.def;
  }
  return src[f.group][f.key];
};

const encodeTune=(ch,fe,dr,tier)=>{
  const src={ch,fe,dr,meta:{tier:tierOf(tier)}};
  const same=(a,b)=>typeof a==='number'&&typeof b==='number'?Math.abs(a-b)<1e-9:a===b;
  const parts=[CODEC_VERSION];
  for(const f of CODEC_FIELDS){
    const enc=x=>f.enc?f.enc[x]:(f.bool?(x?1:0):x);
    const raw=enc(codecReadField(src,f)), defRaw=enc(codecFieldDefault(f));
    if(same(raw,defRaw))continue;
    parts.push(`${f.id}:${raw}`);
  }
  return btoa(parts.join('|'));
};

const decodeTune=(code)=>{
  // A DNA rides on its own codec, so its code reaches every tune-decoding path looking like
  // corruption. Naming it here covers all of them at once — TUNE CHECK, LOAD CODE and the tier
  // probe — instead of each guessing at "invalid".
  if(String(code??'').trim().toUpperCase().startsWith(DNA_CODE_PREFIX))
    throw new Error('That is a DNA code — paste it into the DNA editor (PRO), not here.');
  const parts=atob(code.trim()).split('|');
  const version=parseInt(parts[0],10);
  if(version!==CODEC_VERSION)throw new Error('Outdated or invalid tune code — ask for a new one.');
  const ch={},fe={},dr={},meta={};
  const tyreParts={F:{},R:{}};
  const dest=f=>f.group==='ch'?ch:f.group==='fe'?fe:f.group==='meta'?meta:dr;
  for(const f of CODEC_FIELDS){
    if(f.tyre)tyreParts[f.tyre][f.part]=f.def;
    else dest(f)[f.key]=codecFieldDefault(f);
  }
  for(let i=1;i<parts.length;i++){
    const ci=parts[i].indexOf(':');
    if(ci<0)continue;
    const id=Number(parts[i].slice(0,ci)),raw=parts[i].slice(ci+1);
    const f=CODEC_FIELDS.find(x=>x.id===id);
    if(!f)continue; // unknown id (e.g. from a newer app version) — safely ignored
    const val=f.enc?(f.dec[Number(raw)]??codecFieldDefault(f)):(f.bool?raw==='1':Number(raw));
    if(f.tyre)tyreParts[f.tyre][f.part]=val;
    else dest(f)[f.key]=val;
  }
  ch.tyreF=`${tyreParts.F.width}/${tyreParts.F.aspectRatio}R${tyreParts.F.rimDiameter}`;
  ch.tyreR=`${tyreParts.R.width}/${tyreParts.R.aspectRatio}R${tyreParts.R.rimDiameter}`;
  // meta rides alongside ch/fe/dr rather than inside them: sanitizeTune takes {ch,fe,dr}
  // and every caller destructures those three, so an extra key is inert for anyone not
  // asking for it.
  return{ch,fe,dr,meta};
};


// ---- Share parts ----
// A decoded code is APPLIED IN PIECES. The wire format is untouched — a code
// still carries every field — but which of them reach the live tune is the
// reader's choice, so someone can take a friend's dampers without losing their
// own ARBs. See docs/CODEC.md "Parts".
//
// Why these five. ch and dr are the codec's own groups and split no further:
// a chassis is one car, a drivetrain is one build. fe is split three ways
// because it is the only group where a reader plausibly wants half of it —
// springs, dampers and bars are the three things tuners trade separately, and
// they are the three sections the sidebar already shows. The split also keeps
// every sanitizeTune migration inside one part: settleMode/settleBias →
// dampBalMode is entirely within `damp`, and arbBalMode:'man' → arbMode:'man'
// is entirely within `arb`, so no partial apply can land half a migration.
//   - gameMode/targetSpeed ride with `ride`: targetSpeed feeds nothing but the
//     flat-ride rear-Hz solve, and gameMode picks the limits and units the
//     frequency solve is expressed in.
//   - springShare/springShareAuto ride with `arb`: the SHARE % slider splits
//     roll stiffness between springs and bars, and lives in the ARB section.
//   - meta.tier is a part with `applies:false` — it is listed so the reader
//     sees what the code records, but it has no tickbox and mergeTune never
//     writes it. Applying a sender's tier would rewrite the tune being loaded
//     (the BEG/INT fallback effects) and can demand a tier the reader cannot
//     reach; see docs/CODEC.md id 77. Every CODEC_FIELDS entry still belongs to
//     exactly one part, which tests-share.js enforces.
const codecFieldGroup=f=>f.tyre?'ch':f.group;
const codecFieldKey=f=>f.tyre?(f.tyre==='F'?'tyreF':'tyreR'):f.key;
const SHARE_PARTS=[
  {id:'ch',group:'ch',label:'CHASSIS',sub:'Weight · bias · tyres · geometry · layout',
   keys:['weight','frontBias','wheelbase','cgHeight','trackF','trackR','layout','tyreF','tyreR',
         'rideHeightF','rideHeightR','motionRatioF','motionRatioR','arbMotionRatioF','arbMotionRatioR',
         'useMeasuredNatBal','measuredNatBal','measuredNatBalHz','measuredNatBalRef',
         'useMeasuredArbClick','measuredArbClick','measuredArbNat','measuredArbNatHz']},
  {id:'ride',group:'fe',label:'SPRINGS',sub:'Ride stiffness · rear Hz · game mode',
   keys:['rideStiffness','rideStiffMode','rideBottomG','rideRef',
         'rearHzMode','rearHzMan','rearHzMult','gameMode','targetSpeed']},
  {id:'damp',group:'fe',label:'DAMPERS',sub:'Rebound · bump · damping balance',
   keys:['dampingMode','dampCharMode','dampBalMode','dampingBias',
         'reboundZeta','bumpRatio','bumpZeta','settleTarget','settleBias','settleMode']},
  {id:'arb',group:'fe',label:'ARB',sub:'Bar stiffness · balance · spring/bar share',
   keys:['arbBias','arbMode','arbTargetRollMan','arbShareMan','arbBasicMan',
         'arbBalMode','arbBalTarget','arbBalTargetMode','arbBalDelta','arbBalAbs',
         'arbManF','arbManR','arbSplitOpposite','arbNeutralEqual','springShare','springShareAuto']},
  {id:'dr',group:'dr',label:'DRIVETRAIN',sub:'Build type · diff',
   keys:['buildType','diffType','diffManual','diffComplement','diffBiasEntry','diffBiasExit',
         'diffFrontExitBias','diffAccel','diffDecel','diffFrontAccel','diffFrontDecel',
         'diffRearAccel','diffRearDecel','diffCenter']},
  {id:'tier',group:'meta',label:'TIER',sub:'Recorded, never applied',applies:false,keys:['tier']},
];
const SHARE_PART_IDS=SHARE_PARTS.filter(p=>p.applies!==false).map(p=>p.id);
// The current tune with only the ticked parts taken from a decoded one. `parts` is a
// {partId:bool} map; an empty or missing map changes nothing. Pure — `current` is never
// mutated, and a key the incoming object does not carry is left alone (fields the codec
// does not travel with, e.g. useRideHeightCG, stay as the reader set them).
const mergeTune=(current,incoming,parts)=>{
  const out={ch:{...current.ch},fe:{...current.fe},dr:{...current.dr}};
  for(const p of SHARE_PARTS){
    if(p.applies===false||!parts||!parts[p.id])continue;
    const src=incoming?.[p.group];
    if(!src)continue;
    for(const k of p.keys)if(k in src)out[p.group][k]=src[k];
  }
  return out;
};
// True when a part of the incoming code carries anything different from the live tune, so
// the picker can tag the parts that are already the same.
const partDiffers=(current,incoming,partId)=>{
  const p=SHARE_PARTS.find(x=>x.id===partId);
  if(!p||p.applies===false)return false;
  const a=current?.[p.group],b=incoming?.[p.group];
  if(!a||!b)return false;
  return p.keys.some(k=>k in b&&a[k]!==b[k]);
};

// sanitizeTune's counterpart for PLAIN PERSISTED state, which never passes through it. Only
// gameMode, deliberately: every persisted enum has the same rehydration hole (arbMode,
// arbBalMode, dampBalMode, rearHzMode, rideStiffMode, uiMode...), but gameMode is the only one
// whose bad value CRASHED rather than falling through to a default branch, because it is the only
// one that indexes a table whose result is dereferenced unguarded. limitsOf now stops that being
// fatal; this stops the bad value being live at all. Widening this into a per-key validator for
// every persisted key is the general fix, and is a decision about every key — see
// docs/KNOWN_ISSUES.md.
const repairFe=fe=>GAME_MODE_DEC.includes(fe?.gameMode)?fe:{...fe,gameMode:DEF_FE.gameMode};

const sanitizeTune=({ch,fe,dr})=>{
  const n=(v,def)=>(typeof v==='number'&&isFinite(v))?v:def;
  const cl=(v,lo,hi,def)=>Math.max(lo,Math.min(hi,n(v,def)));
  // Resolved here rather than inline below, because arbManF/arbManR need it too.
  const sgm=GAME_MODE_DEC.includes(fe?.gameMode)?fe.gameMode:DEF_FE.gameMode;
  // arbManF/arbManR are the one pair of fe fields whose UNITS depend on gameMode: Forza clicks
  // in a click mode, roll stiffness in a physical one (App's conversion effect multiplies by
  // arbScaleOf(ch)*track^2, so 20 clicks becomes ~26,000). Clamping both to a hardcoded 1..65
  // silently destroyed every shared BeamNG tune with ARB mode MAN -- the bars arrived at 65 and
  // nothing said so, because gameMode and arbMode themselves survived the trip. That same
  // constant was also Horizon's ceiling applied to MOTORSPORT, whose limit is 40, leaving a MAN
  // field displaying a value computeTune then clamped back out of the output. Bounds mirror the
  // MAN entry Field's own min/max, so what a code can carry and what the UI can type are one
  // range. See docs/HISTORY.md and docs/CODEC.md ids 46/47.
  const arbManB=isPhysical(sgm)
    ?{lo:0,hi:200000,def:0}                                 // physical: computeTune reads Math.max(0,arbManF??0)
    :{lo:1,hi:GAME_LIMITS[sgm].arb,def:DEF_FE.arbManF};     // clicks: THIS mode's ceiling, not Horizon's
  const sch={
      weight:       cl(ch?.weight,        100,  18000, DEF_CH.weight),
      frontBias:    cl(ch?.frontBias,      30,   70,   DEF_CH.frontBias),
      wheelbase:    cl(ch?.wheelbase,      0.4,  4.0,  DEF_CH.wheelbase),
      cgHeight:     cl(ch?.cgHeight,       0.2,  1.5,  DEF_CH.cgHeight),
      trackF:       cl(ch?.trackF,         1.0,  2.2,  DEF_CH.trackF),
      trackR:       cl(ch?.trackR,         1.0,  2.2,  DEF_CH.trackR),
      // Bounds mirror the Ride Height F/R Field inputs' min/max (0.5in/48in imperial,
      // 1.3cm/122cm metric) — see docs/CODEC.md ids 65/66.
      rideHeightF:  cl(ch?.rideHeightF,    0.0127, 1.22, DEF_CH.rideHeightF),
      rideHeightR:  cl(ch?.rideHeightR,    0.0127, 1.22, DEF_CH.rideHeightR),
      tyreF: parseTyre(ch?.tyreF)?ch.tyreF:DEF_CH.tyreF,
      tyreR: parseTyre(ch?.tyreR)?ch.tyreR:DEF_CH.tyreR,
      layout:       LAYOUT_DEC.includes(ch?.layout)?ch.layout:DEF_CH.layout,
      // Travels with the chassis so a shared build's arbBalTarget/arbBalDelta (deltas from
      // natDisplayOf / gripNeutralOf) re-expand against the sender's actual calibrated baseline
      // instead of silently falling back to geometry — see docs/CODEC.md id 60/61.
      useMeasuredNatBal: !!(ch?.useMeasuredNatBal),
      measuredNatBal:    ch?.useMeasuredNatBal&&ch?.measuredNatBal!=null?cl(ch.measuredNatBal,0.10,0.90,null):null,
      measuredNatBalHz:  ch?.useMeasuredNatBal&&ch?.measuredNatBalHz!=null?cl(ch.measuredNatBalHz,HZ_MIN,HZ_MAX,null):null,
      // Same flag-off-means-null invariant as the rest of the measured block. Bounds are the
      // reading's own 0.10..0.90 plus room for the tyre term, which can push the prediction
      // slightly outside it on a car with very uneven tyre widths.
      measuredNatBalRef: ch?.useMeasuredNatBal&&ch?.measuredNatBalRef!=null?cl(ch.measuredNatBalRef,0.00,1.00,null):null,
      // useMeasuredArbScale/measuredArbScale (pre-tyre-model, retired codec ids 70/71) are
      // deliberately not carried over: read as the new scale they would halve the bars.
      useMeasuredArbClick: !!(ch?.useMeasuredArbClick),
      measuredArbClick:  ch?.useMeasuredArbClick&&ch?.measuredArbClick!=null?cl(ch.measuredArbClick,ARB_SCALE_MIN,ARB_SCALE_MAX,null):null,
      measuredArbNat:    ch?.useMeasuredArbClick&&ch?.measuredArbNat!=null?cl(ch.measuredArbNat,0.10,0.90,null):null,
      measuredArbNatHz:  ch?.useMeasuredArbClick&&ch?.measuredArbNatHz!=null?cl(ch.measuredArbNatHz,HZ_MIN,HZ_MAX,null):null,
      // Floor at 0.2 rather than 0: mrDiv squares this, so a near-zero ratio would
      // scale the displayed rate toward infinity.
      motionRatioF: cl(ch?.motionRatioF,    0.2,  1.5,  DEF_CH.motionRatioF),
      motionRatioR: cl(ch?.motionRatioR,    0.2,  1.5,  DEF_CH.motionRatioR),
      arbMotionRatioF: cl(ch?.arbMotionRatioF, 0.2, 1.5, DEF_CH.arbMotionRatioF),
      arbMotionRatioR: cl(ch?.arbMotionRatioR, 0.2, 1.5, DEF_CH.arbMotionRatioR),
  };
  // arbBalTarget is a delta from natDisplayOf(sch,sgm) (see id 40 in docs/CODEC.md) —
  // clamp it to the same range the live Field allows (BAL_TARGET_MIN..MAX absolute), not a flat
  // approximation, so a decoded delta can't silently get truncated differently than the UI.
  // Same natural resolveArbBalTarget adds back, in the same game mode, or the clamp and the
  // resolve disagree about where the band is.
  const _snb=natDisplayOf(sch,sgm);
  return{
    ch: sch,
    fe:{
      rideStiffness:    (()=>{const rs=n(fe?.rideStiffness,DEF_FE.rideStiffness);const hz=rs>6?0.8+(rs/100)*2.7:rs;return clampHz(Math.round(hz*1000)/1000);})(),
      arbBias:          cl(fe?.arbBias,          -50,   50,  DEF_FE.arbBias),
      arbBalTarget:     fe?.arbBalTarget==null?null:cl(fe.arbBalTarget,BAL_TARGET_MIN-_snb,BAL_TARGET_MAX-_snb,0),
      arbBalMode:       (()=>{
                          const bm=ARB_BAL_MODE_DEC.includes(fe?.arbBalMode)?fe.arbBalMode:DEF_FE.arbBalMode;
                          // MAN moved from Balance Mode to Stiffness Mode (arbMode) — old saves/share
                          // codes with arbBalMode:'man' fall back to the invisible 'manual' placeholder
                          // here; the arbMode migration below picks up the actual MAN behavior so old
                          // manual-click tunes still work.
                          return bm==='man'?'manual':bm;
                        })(),
      springShare:      cl(fe?.springShare,         0,  100, DEF_FE.springShare),
      springShareAuto:  fe?.springShareAuto!==false,
      arbSplitOpposite: !!fe?.arbSplitOpposite,
      arbNeutralEqual:  !!fe?.arbNeutralEqual,
      // migrateDampBalMode covers the legacy Settle Sync boolean + its own settleBias field —
      // see docs/CODEC.md ids 48/49/62.
      ...migrateDampBalMode(fe),
      targetSpeed:      cl(fe?.targetSpeed,       60,  200,  DEF_FE.targetSpeed),
      gameMode:         sgm,
      dampingMode:      DAMPING_MODE_DEC.includes(fe?.dampingMode)?fe.dampingMode:DEF_FE.dampingMode,
      reboundZeta:      cl(fe?.reboundZeta,       10,  200,  DEF_FE.reboundZeta),
      bumpRatio:        cl(fe?.bumpRatio,         10,  100,  DEF_FE.bumpRatio),
      bumpZeta:         cl(fe?.bumpZeta,          10,  115,  DEF_FE.bumpZeta),
      arbMode:          (()=>{
                          const am=ARB_MODE_DEC.includes(fe?.arbMode)?fe.arbMode:DEF_FE.arbMode;
                          // Migrate old saves/share codes where MAN was a Balance Mode value.
                          return (am===DEF_FE.arbMode&&fe?.arbBalMode==='man')?'man':am;
                        })(),
      arbTargetRollMan: cl(fe?.arbTargetRollMan,  0.3,  5.0, DEF_FE.arbTargetRollMan),
      arbShareMan:      cl(fe?.arbShareMan,        0,   80,  DEF_FE.arbShareMan),
      arbBasicMan:      cl(fe?.arbBasicMan,        0,  100,  DEF_FE.arbBasicMan),
      rearHzMode:       REAR_HZ_MODE_DEC.includes(fe?.rearHzMode)?fe.rearHzMode:DEF_FE.rearHzMode,
      rearHzMan:        cl(fe?.rearHzMan,          HZ_MIN, HZ_MAX, DEF_FE.rearHzMan),
      rearHzMult:       cl(fe?.rearHzMult,         0.5,  3.0, DEF_FE.rearHzMult),
      rideRef:          ['front','rear','shared'].includes(fe?.rideRef)?fe.rideRef:'front',
      rideStiffMode:    ['hz','bottomG'].includes(fe?.rideStiffMode)?fe.rideStiffMode:'hz',
      rideBottomG:      (typeof fe?.rideBottomG==='number'&&isFinite(fe.rideBottomG)&&fe.rideBottomG>0)?fe.rideBottomG:null,
      arbManF:          cl(fe?.arbManF, arbManB.lo, arbManB.hi, arbManB.def),
      arbManR:          cl(fe?.arbManR, arbManB.lo, arbManB.hi, arbManB.def),
      settleTarget:     cl(fe?.settleTarget,      0.10,  1.50,  DEF_FE.settleTarget),
      dampCharMode:     fe?.dampCharMode==='settle'?'settle':'zeta',
      arbBalTargetMode: balTargetModeOf(fe??{}),
      arbBalAbs:        cl(fe?.arbBalAbs, BAL_TARGET_MIN, BAL_TARGET_MAX, DEF_FE.arbBalAbs),
      arbBalDelta:      cl(fe?.arbBalDelta,       -0.20, 0.20, DEF_FE.arbBalDelta),
    },
    dr:{
      buildType:      BUILD_DEC.includes(dr?.buildType)?dr.buildType:DEF_DR.buildType,
      diffType:       DIFF_TYPE_DEC.includes(dr?.diffType)?dr.diffType:DEF_DR.diffType,
      diffManual:     typeof dr?.diffManual==='boolean'?dr.diffManual:dr?.diffManual===1,
      diffComplement: typeof dr?.diffComplement==='boolean'?dr.diffComplement:false,
      diffBiasExit:      cl(dr?.diffBiasExit,      -50, 50, DEF_DR.diffBiasExit),
      diffBiasEntry:     cl(dr?.diffBiasEntry,     -50, 50, DEF_DR.diffBiasEntry),
      diffFrontExitBias: cl(dr?.diffFrontExitBias, -50, 50, DEF_DR.diffFrontExitBias),
      diffAccel:      cl(dr?.diffAccel,       0,  100,  DEF_DR.diffAccel),
      diffDecel:      cl(dr?.diffDecel,       0,  100,  DEF_DR.diffDecel),
      diffFrontAccel: cl(dr?.diffFrontAccel,  0,  100,  DEF_DR.diffFrontAccel),
      diffFrontDecel: cl(dr?.diffFrontDecel,  0,  100,  DEF_DR.diffFrontDecel),
      diffRearAccel:  cl(dr?.diffRearAccel,   0,  100,  DEF_DR.diffRearAccel),
      diffRearDecel:  cl(dr?.diffRearDecel,   0,  100,  DEF_DR.diffRearDecel),
      diffCenter:     cl(dr?.diffCenter,      0,  100,  DEF_DR.diffCenter),
    },
  };
};

const useTwoTap=(callback,delay=2000)=>{
  const[pending,setPending]=useState(false);
  const timer=useRef(null);
  useEffect(()=>()=>clearTimeout(timer.current),[]);
  const handle=()=>{
    if(pending){clearTimeout(timer.current);setPending(false);callback();}
    else{setPending(true);timer.current=setTimeout(()=>setPending(false),delay);}
  };
  return[pending,handle];
};

// A full-width two-tap button, for an action that cannot be undone. OverwriteBtn below is the
// same idea as a glyph; this one is for a labelled button that has to say what it is about to do,
// and it exists as a component because useTwoTap is a hook and the callers are IIFEs inside a
// render. `label` reads normally, `confirm` is what the armed tap says (SURE?, matching the
// section RESET buttons).
const ConfirmBtn=({label,confirm='SURE?',onConfirm,disabled=false,title,style})=>{
  const[pending,handle]=useTwoTap(onConfirm);
  return(
    <button className={'tbtn'+(pending?'':' on')} disabled={disabled}
      onClick={handle}
      title={pending?'Click again to confirm':title}
      style={{fontSize:11,...style,
              ...(pending?{color:'#f59e0b',borderColor:'#f59e0b44'}:null)}}>
      {pending?confirm:label}</button>
  );
};

const OverwriteBtn=({onConfirm})=>{
  const[pending,handle]=useTwoTap(onConfirm);
  return(
    <button onClick={handle}
      style={{background:'none',border:'none',cursor:'pointer',fontSize:12,lineHeight:1,
              padding:'0 0 0 3px',flexShrink:0,color:pending?'#f59e0b':'#374151'}}
      title={pending?'Click again to overwrite':'Overwrite with current data'}>↺</button>
  );
};

const copyToClipboard=(text,onDone)=>{
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onDone).catch(()=>{});
  } else {
    const ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    onDone();
  }
};

// One garage entry. Takes a props object rather than positional args — the old inline
// card() helper had 7 positionals and this needs roughly twice that.
const EntryCard=({entry,metricUnits,onLoadChassis,onLoadBuild,onLoadDna,onRewrite,onDelete,onRename,onNotes,onAddTag,onRemoveTag,allTags})=>{
  const kind=kindOf(entry);
  const km=KIND_META[kind];
  const[editing,setEditing]=useState(false);
  const[draft,setDraft]=useState(entry.name);
  const[openNotes,setOpenNotes]=useState(false);
  const[rwOpen,setRwOpen]=useState(false);
  const[codeCopied,setCodeCopied]=useState(false);
  const[tagDraft,setTagDraft]=useState('');
  const[delPending,delHandle]=useTwoTap(()=>onDelete(entry.id));
  const auto=autoTagsOf(entry);
  const chip=(label,color,onX,key)=>(
    <span key={key} style={{display:'inline-flex',alignItems:'center',gap:3,fontSize:8,
      letterSpacing:0.5,padding:'1px 4px',borderRadius:2,border:`1px solid ${color}44`,
      color,background:`${color}14`,whiteSpace:'nowrap'}}>
      {label}
      {onX&&<span onClick={onX} style={{cursor:'pointer',color:'#64748b',fontSize:9,lineHeight:1}}>×</span>}
    </span>
  );
  const sug=allTags.filter(t=>t.toLowerCase().startsWith(tagDraft.trim().toLowerCase())
    &&!(entry.tags||[]).includes(t)&&tagDraft.trim()).slice(0,4);
  const commitTag=v=>{const t=(v??tagDraft).trim();if(!t)return;onAddTag(entry.id,t);setTagDraft('');};
  return(
    <div style={{background:'#0f172a',border:'1px solid #1e293b',borderRadius:2,
                 padding:'7px 8px',display:'flex',flexDirection:'column',gap:5,marginBottom:6}}>
      {/* header */}
      <div style={{display:'flex',alignItems:'center',gap:5,minWidth:0}}>
        <span style={{fontSize:8,letterSpacing:1,padding:'1px 4px',borderRadius:2,flexShrink:0,
          color:km.color,border:`1px solid ${km.color}55`,background:`${km.color}14`}}>{km.label}</span>
        {editing
          ?<input autoFocus value={draft} onChange={e=>setDraft(e.target.value)}
             onBlur={()=>{onRename(entry.id,draft);setEditing(false);}}
             onKeyDown={e=>{if(e.key==='Enter')e.target.blur();if(e.key==='Escape'){setDraft(entry.name);setEditing(false);}}}
             style={{flex:1,minWidth:0,background:'#020617',border:'1px solid #334155',borderRadius:2,
                     padding:'2px 5px',fontSize:11,color:'#e2e8f0',outline:'none',fontFamily:'inherit'}}/>
          :<span onClick={()=>{setDraft(entry.name);setEditing(true);}} title="Click to rename"
             style={{flex:1,minWidth:0,fontSize:11,color:'#cbd5e1',fontWeight:600,cursor:'text',
                     overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{entry.name}</span>}
        <span style={{fontSize:8,color:'#334155',flexShrink:0}}>{new Date(stampOf(entry)).toLocaleDateString()}</span>
        <button onClick={()=>setRwOpen(o=>!o)} title="Rewrite with current setup"
          style={{background:'none',border:'none',cursor:'pointer',fontSize:12,lineHeight:1,
                  padding:'0 2px',flexShrink:0,color:rwOpen?'#f59e0b':'#374151'}}>↺</button>
        <button onClick={delHandle} title={delPending?'Click again to delete':'Delete'}
          style={{background:'none',border:'none',cursor:'pointer',fontSize:12,lineHeight:1,
                  padding:'0 2px',flexShrink:0,color:delPending?'#ef4444':'#374151'}}>{delPending?'✓':'×'}</button>
      </div>
      {/* rewrite: explicit three-way, so promoting a chassis entry to a car is one click and
          nothing has to guess which payloads the user meant to overwrite */}
      {rwOpen&&<div style={{display:'flex',gap:3,alignItems:'center'}}>
        <span style={{fontSize:8,color:'#64748b',letterSpacing:1,flexShrink:0}}>REWRITE</span>
        {(kind==='dna'?[['dna','WITH EDITOR DNA']]:[['chassis','CHASSIS'],['build','BUILD'],['both','BOTH']]).map(([k,l])=>(
          <button key={k} className="tbtn" style={{fontSize:9,padding:'2px 5px'}}
            onClick={()=>{onRewrite(entry.id,k);setRwOpen(false);}}>{l}</button>
        ))}
      </div>}
      {kind!=='empty'&&<span style={{fontSize:9,color:'#475569'}}>{entrySummary(entry,metricUnits)}</span>}
      {kind==='empty'&&<span style={{fontSize:9,color:'#f59e0b'}}>Corrupt entry — no data. Delete it.</span>}
      {/* tags */}
      <div style={{display:'flex',flexWrap:'wrap',gap:3,alignItems:'center'}}>
        {auto.map((t,i)=>chip(t.label,t.color,null,'a'+i))}
        {(entry.tags||[]).map((t,i)=>chip(t,'#818cf8',()=>onRemoveTag(entry.id,t),'m'+i))}
      </div>
      <div style={{position:'relative'}}>
        <input value={tagDraft} onChange={e=>setTagDraft(e.target.value)}
          onKeyDown={e=>{if(e.key==='Enter')commitTag();if(e.key==='Escape')setTagDraft('');}}
          placeholder="+ tag"
          style={{width:'100%',background:'#020617',border:'1px solid #1e293b',borderRadius:2,
                  padding:'2px 5px',fontSize:9,color:'#e2e8f0',outline:'none',fontFamily:'inherit'}}/>
        {sug.length>0&&<div style={{display:'flex',gap:3,marginTop:3,flexWrap:'wrap'}}>
          {sug.map(t=>(
            <button key={t} onClick={()=>commitTag(t)} className="tbtn"
              style={{fontSize:8,padding:'1px 4px'}}>{t}</button>
          ))}
        </div>}
      </div>
      {/* notes */}
      {openNotes
        ?<div>
           <textarea value={entry.notes||''} autoFocus
             onChange={e=>onNotes(entry.id,e.target.value.slice(0,NOTES_MAX))}
             onBlur={()=>setOpenNotes(false)}
             rows={3}
             style={{width:'100%',background:'#020617',border:'1px solid #334155',borderRadius:2,
                     padding:'4px 5px',fontSize:10,color:'#e2e8f0',outline:'none',
                     fontFamily:'inherit',resize:'vertical'}}/>
           <div style={{fontSize:8,color:(entry.notes||'').length>NOTES_MAX*0.9?'#f59e0b':'#334155',textAlign:'right'}}>
             {(entry.notes||'').length}/{NOTES_MAX}
           </div>
         </div>
        :<span onClick={()=>setOpenNotes(true)} title="Click to edit notes"
           style={{fontSize:9,color:entry.notes?'#64748b':'#334155',cursor:'text',
                   overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
           {entry.notes?entry.notes.split('\n')[0]:'+ notes'}
         </span>}
      {/* load buttons — only for payloads this entry actually carries */}
      {kind==='dna'&&<div style={{display:'flex',gap:4}}>
        <button className="tbtn" style={{flex:1,fontSize:9}} onClick={()=>onLoadDna(entry)}>LOAD DNA</button>
      </div>}
      {kind!=='empty'&&kind!=='dna'&&<div style={{display:'flex',gap:4}}>
        {entry.ch&&<button className="tbtn" style={{flex:1,fontSize:9}}
          onClick={()=>onLoadChassis(entry)}>LOAD CHASSIS</button>}
        {(entry.fe||entry.dr)&&<button className="tbtn" style={{flex:1,fontSize:9}}
          onClick={()=>onLoadBuild(entry)}>LOAD BUILD</button>}
        <button className={`tbtn${codeCopied?' saved':''}`} style={{flex:1,fontSize:9}}
          onClick={()=>copyToClipboard(
            encodeTune(entry.ch||DEF_CH,entry.fe||DEF_FE,entry.dr||DEF_DR,entry.tier),
            ()=>{setCodeCopied(true);setTimeout(()=>setCodeCopied(false),1500);}
          )}>{codeCopied?'COPIED':'COPY CODE'}</button>
      </div>}
    </div>
  );
};

class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  render(){
    if(this.state.err)return(
      <div style={{padding:24,color:'#ef4444',fontFamily:'var(--font-mono)',fontSize:12,background:'#020617',minHeight:'100vh'}}>
        <div style={{marginBottom:8,color:'#e2e8f0',fontSize:14}}>SUSP.OS — Failed to load</div>
        <div style={{marginBottom:16,color:'#94a3b8'}}>An error occurred. Try reloading the page.</div>
        <div style={{background:'#0f172a',padding:12,borderRadius:4,border:'1px solid #1e293b',
                     whiteSpace:'pre-wrap',wordBreak:'break-all',lineHeight:1.6}}>
          {this.state.err.toString()}
        </div>
        <button onClick={()=>window.location.reload()}
          style={{marginTop:16,padding:'8px 16px',background:'#0f172a',border:'1px solid #1e293b',
                  color:'#e2e8f0',borderRadius:4,cursor:'pointer',fontFamily:'var(--font-mono)',fontSize:12}}>
          RELOAD
        </button>
      </div>
    );
    return this.props.children;
  }
}

// The path a guide is running: the whole array, or only its quick:true steps (QUICK START on a
// pathChoice card). A filtered view, not a second array — reordering or trimming steps in
// TUTORIALS reshapes the quick path with no other edit.
const tutSteps=(mode,quick)=>{const all=TUTORIALS[mode]??[];return quick?all.filter(x=>x.quick):all;};

// Standalone reference — unlike TUTORIALS this isn't a guided sequence, it's an
// always-available lookup for anyone who forgets what a term means. Each entry's tier is
// the lowest tier that meets it, and a "[INT] "/"[PRO] " paragraph applies from that tier
// up. The modal opens on ALL (a BEG user can still meet these words in a shared tune) and
// can filter to a tier. Grouped to match the app's own sections, not alphabetically.
const GLOSSARY=[
  {group:'Geometry & Weight',terms:[
    {id:'layout',term:'Layout (FWD / RWD / AWD)',tier:'beginner',def:"Which wheels the engine drives: FWD the fronts, RWD the rears, AWD all four. The recommendations follow each layout's needs: FWD protects front grip, RWD rear traction, and AWD sits between. Layout sets how the differential is calculated and shifts the alignment targets. FWD and RWD have one differential, shown as Accel Lock and Decel Lock. AWD has front, rear and centre differentials, so the DIFFERENTIAL card lists both axles and a Center Split.\n\nThe BEG panel warns when Front Weight Bias is unusual for the layout. Typical is 55–70% on FWD, 38–55% on RWD and 45–58% on AWD.\n\n[INT] AWD unlocks FRONT AXLE EXIT and CENTER POWER SPLIT in DRIVETRAIN. On FWD, more front accel lock means more push, so the EXIT slider works in reverse there: right means more rotation on every layout.\n\n[PRO] Layout also picks the Balance Guide's RANGE band and, in the phase readout, which axle carries the drive on EXIT.",see:['build-type','front-weight-bias','accel-lock','power-split']},
    {id:'build-type',term:'Build Type',tier:'beginner',def:"The car's intended use: STREET (the default), TRACK, DRIFT, RALLY, OFFROAD or DRAG. It shifts the alignment targets, the differential's automatic locks on FWD and RWD, and the brake balance recommendation. For brakes it adds front bias: TRACK +3, DRIFT −5, OFFROAD −3, DRAG −8, and 0 points for STREET and RALLY. It also picks which FACTORY preset gets the ★ FOR YOUR BUILD mark.\n\n[INT] The DIFFERENTIAL card's RECOMMENDED diff type comes from it: Street suggests Sport, Track and Drag suggest Race, and the others suggest the type of the same name. On AWD it is also the starting point for the recommended CENTER SPLIT.\n\n[PRO] It picks the Balance Guide's recommended RANGE band, which RANGE target mode aims at.",see:['layout','diff-type','brake-balance','target-range']},
    {id:'weight',term:'Weight',tier:'beginner',def:"Total vehicle weight. Take it from the car's stat page or car selection screen, not the tuning menu. The box takes 100–18000 lb (45–8165 kg); the default is 3200 lb. Weight sets each corner's mass, so it directly scales spring rates, damper forces and ARB stiffness. Ride frequency in Hz stays put, because spring rate scales with corner mass times Hz squared.\n\nThe BEG panel warns outside the typical Forza range of 1600–6500 lb (725–2950 kg). Treat that as a prompt to recheck the stat screen, not as a limit.\n\nIn BEG and INT, changing Weight also rescales wheelbase and track widths from the default car. CG Height is rescaled too, unless it is estimated from ride height.\n\n[PRO] PRO keeps the wheelbase, track widths and CG you enter. Dropping to INT or BEG rescales them from Weight again.",see:['front-weight-bias','corner-mass','spring-rate','cg-height']},
    {id:'front-weight-bias',term:'Front Weight Bias',tier:'beginner',def:"The share of total weight on the front axle, 30–70% in 1% steps; the default is 52%. Take it from the car selection screen, not the tuning menu. 50% is an even split, and most front-engined cars sit at 52–58%. The BEG panel flags a value outside the usual range for the layout: 55–70% on FWD, 38–55% on RWD and 45–58% on AWD.\n\nIt splits the weight into front and rear corner masses. Those set each axle's spring and damper rates and the car's natural balance. It is the base of the brake balance recommendation and, in BEG, of the ARB split. More rear weight also raises the automatic decel lock.\n\n[INT] WEIGHT balance mode splits the ARBs from it. On AWD the recommended CENTER SPLIT moves about 3% rearward for every 10% of extra rear weight.",see:['weight','corner-mass','layout','bal-weight']},
    {id:'cg-source',term:'CG Height Source',tier:'intermediate',def:"Chooses where CG height comes from. RIDE HEIGHT, the default, estimates it from the front and rear ride heights Forza shows, plus tyre radius. MANUAL takes a CG Height you type in.\n\nThe estimate is the average tyre radius plus the two ride heights weighted by Front Weight Bias. It is held inside 200–1500 mm. It is a rough heuristic, because real CG also depends on engine position, body height and mass distribution, which the app has no inputs for. It still beats a guess. It needs valid tyre sizes. At INT an invalid size can't be fixed in place: switch to PRO, where tyres are edited, or use MANUAL.\n\nRIDE HEIGHT also enables STIFFNESS BOTTOM G's and SHARED Hz mode in RIDE, and the SAG vs LOAD chart in VISUALS.\n\n[PRO] The FIT? badge flags CG when the raw estimate falls outside 200–1500 mm. Past that point, ride-height edits stop moving CG.",see:['cg-height','ride-height','tyre-size','sag-vs-load']},
    {id:'ride-height',term:'Ride Height',tier:'intermediate',def:"Front and rear ride height as Forza shows it on the car's stat or tuning screen. It is entered in inches (0.5–48) or centimetres (1.3–122) and shown only when CG Height Source is RIDE HEIGHT. With tyre radius it gives the CG height estimate.\n\nIt is also the travel available before bottoming. The BOTTOM G's stiffness mode and the SAG vs LOAD chart measure static sag and cornering compression against it.",see:['cg-source','sag','bottoming','sag-vs-load']},
    {id:'cg-height',term:'CG Height',tier:'intermediate',def:"Height of the centre of gravity above the ground. The game doesn't show it, so it is either estimated from ride height or typed under MANUAL (200–1500 mm, 5 mm steps). With RIDE HEIGHT as the source, the estimate shows as CG HEIGHT (EST.). Guide values: 400–460 mm for sports cars, 480–550 mm for sedans, 580–700 mm for SUVs and 800–1100 mm for lifted off-roaders.\n\nA higher CG gives a bigger roll moment: body mass times CG height above the roll centre, which sits at 20% of CG height. The body then rolls more, AUTO asks for stiffer ARBs, and more load moves to the outside tyres. CG over wheelbase sets how much weight moves forward under braking, which front-biases the brake recommendation.\n\n[PRO] The same ratio sets the ENTRY and EXIT reference splits in the phase readout.",see:['cg-source','roll-stiffness','load-transfer','brake-balance']},
    {id:'tyre-size',term:'Tyre Size',tier:'pro',def:"Front and rear tyre size as on the sidewall, e.g. 265/35R18, the default. Any separator works. Width must be 50–500 mm, aspect 10–100 and rim 8–30 in. A blank box uses a 265 mm width, and = FRONT copies the front size to the rear.\n\nWidth sets each axle's grip at the limit. Wider means more grip on that end, rising less than proportionally. It moves GRIP BIAS, GRIP TARGET and the Balance Guide's AGILE-to-PLANTED tag, but not roll stiffness. Forza's displayed Mech Balance does add a small width term, 0.08 × ln(rear width ÷ front width), which the app includes in displayed balances and removes from targets.\n\nAspect and rim give the diameter and radius. These feed the RIDE HEIGHT CG estimate and the AWD AVG RADIUS readout. They also feed the recommended CENTER SPLIT: a larger rear diameter moves it rearward. The FIT? badge flags widths outside the 215–335 mm the model was fitted on.",see:['grip-bias','target-grip','cg-source','power-split']},
    {id:'wheelbase',term:'Wheelbase',tier:'pro',def:"Distance between the front and rear axles, 400–4000 mm in 5 mm steps; typical cars run 2400–2900 mm. FLAT RIDE uses it to time the rear Hz to your Target Speed. With CG height it sets the forward weight transfer under braking. That feeds the brake balance recommendation and the ENTRY and EXIT phase readouts. It stays in use when a MEASURE NAT BAL reading replaces the track widths.\n\nBelow PRO it isn't an input: it is scaled from Weight, and leaving PRO rescales it.",see:['flat-ride','brake-balance','cg-height','track-width']},
    {id:'track-width',term:'Track Width',tier:'pro',def:"Distance between the left and right wheels on each axle, 1000–2600 mm in 5 mm steps. Typical is 1400–1800 mm, and the rear is often slightly wider. An axle's roll stiffness grows with track squared, so a wider track resists roll more on the same springs and transfers less load. Track also scales what one ARB click is worth.\n\nTrack widths and corner masses give the predicted natural balance. A wider rear or narrower front raises the rear's share of roll stiffness, toward oversteer. GEOMETRY GAP suggests track changes toward your target.\n\nThe fields hide while a MEASURE NAT BAL reading is in use, because the game's reading already reflects the real geometry, track width upgrades included. Below PRO they are scaled from Weight, and leaving PRO rescales them.",see:['natural-balance','roll-stiffness','arb-scale','grip-gap']},
    {id:'motion-ratio',term:'Motion Ratio',tier:'pro',def:"How far the spring and damper move per unit of wheel travel, 0.2–1.5. It is BeamNG only: Forza shows wheel rate, so the fields are hidden there. The default 1.0 is direct-acting, like a strut on the hub. Lower means the spring sits inboard on a control arm and must be stiffer for the same wheel rate. Spring and damper outputs are divided by the ratio squared, so 0.7 roughly doubles them.\n\nBeamNG's sliders act at the spring, so this is what makes the numbers match. It does not change Hz, roll stiffness or handling balance. Leave it at 1.0 unless you know the car's geometry.",see:['arb-motion-ratio','spring-rate']},
    {id:'arb-motion-ratio',term:'ARB Motion Ratio',tier:'pro',def:"The anti-roll bar's arm as a fraction of track: where the drop link attaches, not where the spring does. It is BeamNG only and separate from Motion Ratio. The range is 0.2–1.5 and the default is 1.0. At 1.0 the app assumes the bar acts at the wheels, so the printed N/m reads low, roughly 4–6× soft on a sampled vehicle. A typical inboard link is about 0.4–0.5 (arm ÷ track), which raises the printed rate by (1/ratio)².\n\nIt affects only ARB display and MAN entry. The roll stiffness the app solves, the balance bar and Hz are unchanged.",see:['motion-ratio','arb']},
  ]},
  {group:'Differential',terms:[
    {id:'accel-lock',term:'Accel Lock',tier:'beginner',def:"How much the differential locks the driven wheels together under throttle. More lock puts more power down, but it also changes how the car rotates on exit. On a driven rear axle (RWD, AWD rear), more accel lock gives more power-on oversteer. On a driven front axle (FWD, AWD front), it resists rotation, giving more exit understeer and push.\n\nThe DIFFERENTIAL card's value is a starting point; fine-tune by feel in 1% steps. Its tag reads OFF at 0, LOW below 20%, MED below 45%, HIGH below 70% and MAX above that. The Handling Balance DIFF row counts rear accel lock toward oversteer and front toward understeer. Each is weighted by that axle's share of the weight and, on AWD, by the centre split.\n\n[INT] AUTO sets it from layout, diff type, the EXIT sliders and, on FWD and RWD, build type, within 10–65% on RWD, 5–35% on FWD, and 10–40% front and 20–70% rear on AWD.\n\n[PRO] MANUAL takes 0–100%, with the diff type's typical range under each field.",see:['decel-lock','exit-bias','diff-type','power-split']},
    {id:'decel-lock',term:'Decel Lock',tier:'beginner',def:"Locking under lift-off and braking. More decel lock resists rotation on corner entry, so the car is steadier on lift-off but understeers more on entry. Less lock lets the car rotate more freely into the corner and under trail-braking. On a rear-drive axle that includes more lift-off oversteer. On a front-drive axle, less means less entry understeer. On AWD the automatic front decel stays at 0, because any front decel strongly adds entry understeer.\n\nA SPORT diff has no decel lock, so its decel rows read N/A. The Handling Balance DIFF row counts decel lock on either axle toward understeer.\n\n[INT] AUTO sets it from the ENTRY slider plus a little with rear weight; on FWD and RWD also from build type and diff type. The limits are 0–30% on RWD, 0–15% on FWD and 0–20% on the AWD rear.\n\n[PRO] MANUAL takes 0–100%. Typical decel is 8–25% for Race, 11–33% for Rally, 15–48% for Offroad and 0–8% for Drift.",see:['accel-lock','entry-bias','diff-type']},
    {id:'diff-type',term:'Diff Type',tier:'beginner',def:"The differential fitted to the car: Race, Sport, Rally, Offroad or Drift, named in the DIFFERENTIAL card's header. Each has its own lock curve, so the same lock % gives a different effective lock. Race is aggressive, and Drift is more so, for maximum rotation. Rally and Offroad are gentler, suited to low-traction surfaces. Sport is accel-only, with no decel lock and no centre split, so those rows read N/A.\n\nThe automatic lock values are scaled per type: Race 1.00, Sport 0.88, Rally 0.76, Offroad 0.52 and Drift 1.10.\n\n[INT] Choose it under DIFF TYPE in DRIVETRAIN; the default is SPORT. The card's RECOMMENDED box suggests a type from Build Type, and → USE applies it. A Race suggestion becomes Sport when the Handling Balance total is above +8. BeamNG has no diff-type recommendation.\n\n[PRO] MANUAL's typical ranges run higher for Rally and Offroad, because their gentler curves need more % for the same lock.",see:['accel-lock','decel-lock','diff-mode','build-type']},
    {id:'diff-mode',term:'Differential Mode (AUTO / MANUAL)',tier:'pro',short:'Diff mode',def:"Chooses whether the differential's locks are calculated or typed in. AUTO, the default, works out every lock value from layout, build type, weight bias, diff type and the EXIT, ENTRY and POWER SPLIT sliders. MANUAL hides those sliders and shows each lock % instead. FWD and RWD get Accel Lock and Decel Lock. AWD gets Front and Rear Accel and Decel, plus Center Split. The diff type's typical range sits under each field.\n\nSwitching to MANUAL copies in the current AUTO values, so nothing jumps. MATCH CHASSIS has no effect in MANUAL. Leaving PRO returns the diff to AUTO, because MANUAL's fields exist only in PRO.",see:['accel-lock','decel-lock','match-chassis','diff-type']},
    {id:'exit-bias',term:'EXIT (Diff Slider)',tier:'intermediate',short:'Diff EXIT',def:"The automatic differential's on-throttle intent, from GRIP (left) to ROTATE (right), −50 to +50, default 0. Right means more rotation on every layout, but the lock moves differently. On RWD and AWD, ROTATE adds rear accel lock for more power oversteer, and GRIP removes it for cleaner exit traction. On FWD, GRIP adds front accel lock for exit traction at the cost of push. ROTATE removes it for a freer pivot and less understeer. On AWD, ROTATE also trims front accel lock.\n\nAWD adds a second EXIT under FRONT AXLE, from PUSH to NEUTRAL. Toward PUSH adds front accel lock, for more front pull and exit understeer. It suits AWD cars with strong rear rotation. Each slider shows the resulting lock %, and the Handling Balance DIFF row moves with it.\n\n[PRO] MATCH CHASSIS can add a further offset from your Mech Balance Target.",see:['accel-lock','entry-bias','match-chassis','power-split']},
    {id:'entry-bias',term:'ENTRY (Diff Slider)',tier:'intermediate',short:'Diff ENTRY',def:"The automatic differential's lift-off and trail-braking intent, from STABLE (left) to LOOSE (right), −50 to +50, default 0. Toward STABLE raises decel lock. On RWD and AWD that resists lift-off oversteer; on FWD it adds entry understeer. Toward LOOSE lowers it for freer rotation into the corner. It moves the rear decel lock on RWD and AWD and the front decel on FWD. AWD front decel stays at 0. It is hidden for a SPORT diff, which has no decel lock.\n\n[PRO] MATCH CHASSIS adds half its offset here.",see:['decel-lock','exit-bias','match-chassis']},
    {id:'power-split',term:'Center Power Split',tier:'beginner',short:'Center split',def:"On AWD, the share of drive torque sent to the rear axle, shown as Center Split in % rear. More rear means more oversteer tendency. It also gives the rear diff's locks more weight in the Handling Balance DIFF row, and the front's less. A SPORT diff has no centre lock, so it reads N/A.\n\n[INT] CENTER POWER SPLIT in DRIVETRAIN sets it: 20–80% rear, default 65%, with 60–70% typical for track. The calculation uses 45–80%, and the slider shows the value in use (→) when yours falls outside that. The card's CENTER SPLIT box recommends a value, and → USE applies it. The recommendation starts from Build Type: Street 65, Track 70, Drift 80, Rally 60, Offroad 55, Drag 75. It adds about 3% per 10% of extra rear weight and moves rearward with larger rear tyres. It comes 2% forward for every 0.1 of natural balance above 0.50.\n\n[PRO] The box lists that breakdown. MANUAL takes 0–100%.",see:['layout','accel-lock','natural-balance','tyre-size']},
    {id:'match-chassis',term:'MATCH CHASSIS',tier:'pro',def:"An automatic-differential option, off by default. When on, it biases the diff by how far your Mech Balance Target sits from natural balance. A target set for more oversteer leans the diff toward rotation, and one set for understeer leans it toward stability. The offset is 150× that gap, capped at ±25 points. It is added to the EXIT intent, and half of it to ENTRY. It is flipped on FWD, because more lock there means more push. The sliders don't move; their hints say when the bias is on.\n\nIt acts only while an ARB or Hz mode solves toward the target; otherwise the button dims and the diff is unchanged. It has no effect in MANUAL. Leaving PRO turns it off. If a share code or garage load brings it in below PRO, the EXIT and ENTRY hints say so.",see:['mech-balance-target','natural-balance','exit-bias','entry-bias']},
  ]},
  {group:'Balance Target (PRO)',terms:[
    {id:'mech-balance-target',term:'Mech Balance Target',tier:'pro',def:"The Mech Balance the solvers aim for, as the game displays it. MECH and CO-SOLVE ARB balance modes solve toward it, and so does Hz MODE MECH. Above 0.50 is rear-biased roll stiffness (oversteer tendency), and below is front-biased (understeer tendency). It stays inside 0.05–0.95 in 0.005 steps, and a fresh build targets 0.60. A target the car can't reach is flagged under the ANTI-ROLL BARS card.\n\nIt applies only when ARB Balance Mode is MECH or CO-SOLVE (with Stiffness Mode not MAN), or when Hz MODE is MECH. Otherwise the controls hide and the Balance Guide shows CURRENT balance. CHASSIS anchors on natural balance and doesn't solve to it.\n\nThe mode sets what it is measured from. NATURAL is an offset from natural balance, so it follows the chassis. RANGE and GRIP add Balance Offset to their anchor. MANUAL is a raw value, e.g. 0.60, that stays put. Switching modes keeps the target where it is. MATCH CHASSIS and the alignment MECH nudge also read it.",see:['mech-balance','balance-offset','target-range','target-grip']},
    {id:'target-range',term:'RANGE (Balance Target Mode)',tier:'pro',short:'RANGE target',def:"A Balance Target mode that aims at the middle of the Balance Guide's RANGE band, plus Balance Offset. The band is the recommended target for your layout and build. It is set as a fraction of the gap from NATURAL toward GRIP TARGET, not as a flat offset. So the further a chassis sits from grip-neutral, the further its band sits from natural. TRACK, for example, uses 0.55–0.95 of that gap on FWD and RWD, and 0.45–0.80 on AWD.\n\nDRIFT (0.90–1.55, AWD 0.75–1.30) and RWD DRAG (0.60–1.05) deliberately go past grip-neutral toward oversteer. The band is at least 0.03 wide and stays inside 0.05–0.95. On most mid- and rear-engined cars, grip-neutral sits below natural. The RANGE row shows the band, with its edges as deltas from NAT.",see:['balance-offset','target-grip','grip-neutral','balance-guide']},
    {id:'target-grip',term:'GRIP (Balance Target Mode)',tier:'pro',short:'GRIP target',def:"A Balance Target mode that aims at GRIP TARGET plus Balance Offset. GRIP TARGET is the mech balance at which the grip model reads exactly neutral for this chassis. At 0 offset the suspension cancels the chassis's own understeer or oversteer tendency instead of reinforcing it. GRIP TARGET is not GRIP BIAS mirrored about 0.50. The two use different units, and the model isn't symmetric enough for a mirror to land on neutral.\n\nIn Forza modes each tyre flexes in series with its axle, so GRIP TARGET shifts slightly with total roll stiffness. The solver uses the value at the tune's own stiffness. When GRIP TARGET falls outside the RANGE band, GRIP GAP appears.",see:['grip-neutral','grip-bias','balance-offset','grip-gap']},
    {id:'balance-offset',term:'Balance Offset',tier:'pro',def:"In RANGE and GRIP target modes, how far the Mech Balance Target sits from that mode's anchor: −0.20 to +0.20 in 0.005 steps, default 0. Positive means more rear roll stiffness (oversteer tendency), and negative more front (understeer tendency). At 0 it is the middle of the recommended band in RANGE, or grip-neutral in GRIP.\n\nThe two modes share one value. Switching modes re-seeds it so the target doesn't move, but a target more than 0.20 from the new anchor lands at the cap. The Balance Guide shows the resulting target.",see:['target-range','target-grip','mech-balance-target']},
    {id:'balance-guide',term:'Balance Guide',tier:'pro',def:"The panel in PRO's BALANCE section that compares your suspension's mech balance with the chassis's natural balance. Its strip spans 0.05–0.95. A grey bar marks NATURAL, a blue triangle GRIP BIAS, a teal dot GRIP TARGET and a green band RANGE. The top marker is TARGET, or CURRENT when nothing solves toward a target. It is green inside the band, orange above it (the oversteer side) and blue below.\n\nThe TARGET/CURRENT row gives the value with ✓, ↑ or ↓ against the band, and its Δ from NAT, marked OS, US or ≈nat (within 0.015). GRIP BIAS carries a stability tag: AGILE below 0.85, BALANCED below 0.97, STABLE below 1.10, otherwise PLANTED. The tag's index is the square root of (average track ÷ 1.6 m) × (average tyre width ÷ 265 mm).",see:['natural-balance','grip-bias','grip-neutral','target-range']},
    {id:'grip-gap',term:'GRIP GAP / GEOMETRY GAP',tier:'pro',short:'Geometry gap',def:"A panel under the Balance Guide that suggests chassis changes toward the target. In GRIP target mode it is GRIP GAP. It appears when GRIP TARGET sits more than 0.005 outside the RANGE band. It gives the extra front or rear tyre width that brings it inside, in 5 mm steps up to 80 mm. A wider front lowers GRIP TARGET, and a wider rear raises it. Beyond that reach, use Balance Offset.\n\nIn the other modes it is GEOMETRY GAP. It appears when the target is more than 0.015 from natural balance; when nothing solves toward a target, 0.50 stands in. It suggests track changes within ±65 mm, in 5 mm steps. A wider rear track or narrower front raises rear roll stiffness, and the reverse raises the front's. Beyond that, use ARBs or tyre widths.",see:['target-grip','track-width','tyre-size','balance-offset']},
  ]},
  {group:'Roll & Anti-Roll Bars',terms:[
    {id:'roll-stiffness',term:'Roll Stiffness',tier:'beginner',def:"Total resistance to body lean in a corner, from springs and ARBs together. The front/rear split, not the total, sets understeer or oversteer tendency. The axle with the larger share takes more of the cornering load transfer, and because tyre grip falls off with load, that axle lets go first. The total sets how far the body leans. The ANTI-ROLL BARS card header gives body roll at 1 g.\n\nAn axle's spring roll stiffness grows with ride frequency squared, corner mass and track width squared. ARBs add to it without stiffening the ride. What it resists is the roll moment: body mass times CG height above the roll centre. Heavier or taller cars need more.\n\n[INT] In the ANTI-ROLL BARS section, ROLL ° solves the bars for a target roll angle and SHARE % sets the ARB fraction of the total. VISUALS draws the front/rear split.",see:['arb','mech-balance','load-transfer','stiffness-mode']},
    {id:'arb',term:'ARB (Anti-Roll Bar)',tier:'beginner',def:"A bar linking the left and right wheels on one axle. It resists body roll without stiffening the ride vertically, because it only engages when one side compresses relative to the other. Stiffer bars mean less roll, but less compliance when one wheel hits a bump. The front/rear ARB split is the main lever for mechanical handling balance. A stiffer front gives more understeer and a stiffer rear more oversteer. In BEG the Balance slider moves it.\n\nIn Forza the card gives clicks from 1 up to the game's limit: 65 in Horizon, 40 in Motorsport. A LOW/MED/HIGH/MAX tag shows where each sits, and values above 88% of the limit turn amber. Each row also shows the bar's % of that axle's roll stiffness and the axle's % of total ARB. BeamNG gives Anti-Roll Spring Rate in N/m instead.\n\n[INT] In the ANTI-ROLL BARS section, Stiffness Mode sets the total and Balance Mode the split. MAN takes clicks directly.",see:['roll-stiffness','arb-scale','stiffness-mode','balance-mode']},
    {id:'mech-balance',term:'Mech(anical) Balance',tier:'beginner',short:'Mech Balance',def:"The rear axle's share of total roll stiffness (springs + ARBs), on a 0–1 scale where 0.50 is an even split. Higher means more rear roll resistance and more oversteer tendency; lower means more front and more understeer. Forza displays it as Mech Balance, and Tune Check's MEASURE steps ask you to type it in.\n\nForza's reading also counts each tyre flexing in series with the suspension, plus a small tyre-width term. So it moves less than the raw spring and bar split, and the app reports it the same way. It describes roll stiffness, not grip.\n\n[INT] The VISUALS roll split puts its divide where this reading sits.\n\n[PRO] GRIP BIAS is the separate at-the-limit grip tendency. The MECH chip shows Mech Balance with its Δ from natural: blue is more rear-biased than natural, amber more front-biased. The Mech Balance Target, MECH, CO-SOLVE and Hz MECH all aim at the displayed figure.",see:['natural-balance','tyre-compliance','mech-balance-target','grip-bias']},
    {id:'tyre-compliance',term:'Tyre Compliance',tier:'pro',def:"The tyre's own flex, acting like a spring. In Forza it adds to the suspension's the way two springs stacked end to end do, so an axle reads K·Kt/(K+Kt). The stiffer an axle's springs and bars, the more the tyre limits it, which compresses front/rear differences. Doubling a spring rate therefore moves Forza's Mech Balance less than you'd expect. The app models the tyre as a 3.94 Hz spring on a 269 kg corner, stiffening with the square root of load. That was fitted to 33 in-game readings on three cars, and tyre width showed no measurable effect. BeamNG stays suspension-only.\n\nThe FIT? badge on the Handling Balance bar shows where figures are extrapolated rather than wrong: spring Hz outside 2.5–3.5, corner mass outside 269–476 kg, or tyre width outside 215–335 mm. LIFT means an inside wheel unloads at 1 g, so more bar on that end stops moving the balance. CG (amber) means the ride-height CG estimate is clamped. Every reading holds only at the tyre pressures it was taken at.",see:['mech-balance','natural-balance','arb-scale']},
    {id:'arb-scale',term:'ARB Scale',tier:'beginner',def:"How much roll stiffness one ARB click is worth. Forza scales its ARB slider differently on every car. Unless you measure yours, the app uses a shared default of 540 (N·m/rad per click per m² of track). The scale turns solved roll stiffness into clicks, so a measured scale moves the ARB outputs.\n\nMeasure it with STEP 2 · ARB SCALE SETUP in Tune Check's MEASURE tab. It is Forza only and comes after step 1. Keep step 1's springs, ride height and tyres. Set front 1 and rear at the game limit, then the reverse, and type the Mech Balance shown each time. Each reading solves its own scale (150–1500), and the two are averaged. A gap over 45% is flagged, though rounding alone can spread them by a quarter. MEASURED on SCALE IN USE applies it, and DEFAULT returns to 540. It saves with the chassis; scales from before the tyre-model update were cleared.\n\nIt turns RE-MEASURE when the natural balance reading changes or is cleared.\n\n[PRO] The BALANCE section then also shows ARB SCALE: RE-MEASURE.",see:['arb','natural-balance','tune-check']},
    {id:'natural-balance',term:'Natural (Mech) Balance',tier:'beginner',short:'Natural balance',def:"The Mech Balance a car shows on equal front/rear ride frequency with the ARBs backed off: the chassis's own lean, and the baseline for everything else. Unmeasured, the app predicts it at 2.2 Hz springs from track widths, corner masses and tyres. A MEASURE NAT BAL reading, taken at your chosen Hz, replaces that.\n\nTo measure, open STEP 1 · NAT BAL SETUP in Tune Check's MEASURE tab. Set the listed springs for Measure Hz (1.0–3.5, default 2.20; softer pins it more precisely), with ARBs at 1. Then type the Mech Balance shown (0.30–0.90). It saves with its Hz, and CLEAR returns to the prediction. It turns RE-MEASURE once chassis edits move the prediction by 0.01 or more. A reading shifts the Handling Balance bar's CHAS contributor.\n\n[INT] VISUALS marks it as the NAT tick, and it trims the AWD CENTER SPLIT recommendation.\n\n[PRO] It is the Balance Guide's NATURAL row and anchors NATURAL target mode, CHASSIS balance mode and MATCH CHASSIS; GRIP BIAS is read there. A reading hides the track widths; wheelbase stays.",see:['mech-balance','arb-scale','bal-chassis','balance-guide']},
  ]},
  {group:'ARB Modes',terms:[
    {id:'stiffness-mode',term:'Stiffness Mode',tier:'intermediate',def:"Stiffness Mode sets how much total anti-roll bar stiffness the solver hands out, before Balance Mode splits it front to rear. AUTO sizes the bars from how far the car would roll on its springs alone at 1g: about 7% ARB share per degree, kept between 5% and 50% of total roll stiffness, so a taller CG, a narrower track or softer springs get more bar. Weight alone does not change it, since spring rates already scale with corner mass. BASIC sets an overall level, SHARE % a fixed fraction of roll stiffness, ROLL ° a target body roll. Switching modes starts the new control from the car as it stands, so the bars do not jump.\n\nMAN takes front and rear values directly and bypasses the budget and the split, which is why Balance Mode and ARB Bias are hidden while it is on. It takes clicks up to the game mode's limit (65 in Horizon, 40 in Motorsport); in BeamNG it takes the anti-roll spring rate in N/m with no ceiling, stored as roll stiffness, so a track-width or ARB Motion Ratio change moves the number shown.",see:['balance-mode','arb-share','target-roll','arb-basic','arb-motion-ratio']},
    {id:'arb-basic',term:'ARB Stiffness (BASIC)',tier:'intermediate',short:'ARB Stiffness',def:"ARB Stiffness is the overall anti-roll bar level set directly in Stiffness Mode BASIC: roughly 1 click at 0% up to the game mode's click limit at 100%, per axle at an even front/rear split. It defaults to 50%; switching into BASIC starts it near the level of the bars already on the car. Unlike SHARE %, it does not scale with spring rate, so moving the springs leaves the level alone. Balance Mode still splits it, and unequal track widths keep the clicks per side off the exact percentage.\n\nBeamNG has no click ceiling to scale against, so BASIC is not offered there and a BASIC tune falls back to AUTO.\n\n[PRO] When MECH or CO-SOLVE cannot reach the Mech Balance Target under BASIC, raising ARB Stiffness gives the bars a larger budget to split.",see:['stiffness-mode','arb-share','arb']},
    {id:'arb-share',term:'ARB Share (SHARE %)',tier:'intermediate',short:'ARB Share',def:"ARB Share is the fraction of total roll stiffness the anti-roll bars supply, set directly in Stiffness Mode SHARE %. 0% leaves all roll resistance to the springs; 20–30% is typical for a sport setup. The slider runs 0–80% (default 15%), and switching into SHARE % starts it at the car's current share. Higher means stiffer bars relative to the springs and more abrupt load transfer. Because the bar budget is a share of the total, stiffening the springs stiffens the bars with them, unlike BASIC.\n\n[PRO] When MECH or CO-SOLVE cannot reach the Mech Balance Target under SHARE %, raising the share gives the bars a larger budget to split.",see:['stiffness-mode','roll-stiffness','arb-basic']},
    {id:'target-roll',term:'Target Roll Angle (ROLL °)',tier:'intermediate',short:'Target Roll Angle',def:"Target Roll Angle is the body roll, in degrees at 1g of cornering, that Stiffness Mode ROLL ° solves the anti-roll bars to allow. Low values around 0.5–1° mean stiff bars and flat cornering; high values around 3–5° mean soft bars that let the suspension articulate over rough ground. It runs 0.3–5.0° in 0.01° steps, and switching into ROLL ° starts it at the car's current roll.\n\nThe bars only add to what the springs give. If the springs alone already roll less than the target, the bars cannot loosen it further; if the bars reach the game's click ceiling first, the car rolls more than asked. Either way the ANTI-ROLL BARS card reports the roll achieved and which way to move the springs.\n\n[PRO] When MECH or CO-SOLVE cannot reach the Mech Balance Target under ROLL °, a lower Target Roll Angle gives the bars a larger budget to split.",see:['stiffness-mode','roll-stiffness']},
    {id:'balance-mode',term:'Balance Mode',tier:'intermediate',def:"Balance Mode sets how the anti-roll bar stiffness from Stiffness Mode is split front to rear — the lever that moves handling balance most directly. WEIGHT follows the car's weight distribution. NEUTRAL works from the springs instead: CANCEL solves the bars to cancel the springs' effect on the balance bar, EQUAL ROLL splits them in the springs' own proportion. ARB Bias then nudges either split. Balance Mode is hidden while Stiffness Mode is MAN, since MAN sets both bars directly.\n\n[PRO] CHASSIS is WEIGHT anchored on the car's natural mech balance instead of raw weight %. MECH solves the bar split alone to hit the Mech Balance Target; CO-SOLVE moves rear spring Hz and the bar split together toward it and hides Hz MODE, since it solves rear Hz itself. MECH and CO-SOLVE set the split themselves, so ARB Bias is not shown. A target the car cannot reach within the game's limits is flagged.",see:['bal-weight','bal-neutral','bal-chassis','bal-mech','bal-cosolve','arb-bias']},
    {id:'bal-weight',term:'WEIGHT (Balance Mode)',tier:'intermediate',def:"WEIGHT splits the anti-roll bars by the car's raw weight distribution. With the default SAME split direction the front bar's share matches the front weight %, so a front-heavy car gets a front-heavy split that reinforces its natural tendency; OPPOSITE mirrors it. ARB Bias moves the split up to 20 points either way at its ends, and the result stays between 20% and 80% front. It is the default, the mode Beginner always runs, and the right choice before you have entered real geometry or measured anything in-game.\n\nWEIGHT does not look at the springs, so a stiffer rear spring still shifts the balance on top of whatever the bars do. NEUTRAL is the mode that accounts for them.",see:['balance-mode','split-direction','arb-bias','bal-neutral']},
    {id:'split-direction',term:'Split Direction (SAME / OPPOSITE)',tier:'intermediate',short:'Split Direction',def:"Split Direction sets whether the anti-roll bar split follows the reference balance or mirrors it. SAME, the default, tracks it directly, so a front-heavy car gets a front-heavy bar split that reinforces its natural tendency. OPPOSITE mirrors the split around 50/50, so the bars counteract that tendency instead of following it. ARB Bias still nudges from whichever baseline this picks. It applies to WEIGHT, whose reference is raw weight %.\n\n[PRO] It applies the same way to CHASSIS, whose reference is the calibrated natural balance.",see:['bal-weight','bal-chassis','arb-bias']},
    {id:'bal-neutral',term:'NEUTRAL (Balance Mode)',tier:'intermediate',def:"NEUTRAL splits the anti-roll bars with reference to the springs rather than the weight, by one of two methods. CANCEL, the default, solves the split so the bars exactly cancel the springs' contribution to the handling balance bar; the readout shows SPRINGS → ARB and the NET left over. EQUAL ROLL splits the bars in the springs' own front/rear proportion, so each axle's bar carries the same share of that axle's roll stiffness: the bars add stiffness without moving the springs' balance, shown as ARB ROLL % F / R. It is also the only split under which front and rear can match in both ride and roll damping.\n\nARB Bias moves either point by up to 50 points at its ends, so under CANCEL it can swing the bars to front-only or rear-only. Under AUTO stiffness with ARB Bias at 0, CANCEL may enlarge the bar budget, up to the springs' own roll stiffness, to reach an exact cancel; past that it cancels only partly. A bar pinned at the game's click floor or ceiling is flagged: ARB MAXED under CANCEL, ARB AT LIMIT under EQUAL ROLL.",see:['balance-mode','arb-bias','damper-table']},
    {id:'bal-chassis',term:'CHASSIS (Balance Mode)',tier:'pro',def:"CHASSIS is WEIGHT's formula anchored on the car's natural mech balance instead of raw weight %: the track-width-corrected geometry estimate, or your MEASURE NAT BAL reading once one is set. Use it once you have entered real geometry or measured the car in-game; it is the balance mode that carries a MEASURE NAT BAL reading into the bar split without a target. Split Direction and ARB Bias work as in WEIGHT: SAME follows the natural balance, OPPOSITE mirrors it, bias moves up to 20 points at the ends, and the split stays between 20% and 80%. With bias centred it matches the calibrated natural balance.\n\nIt does not solve toward the Mech Balance Target; MECH, CO-SOLVE and Hz MECH do.",see:['bal-weight','natural-balance','split-direction','arb-bias']},
    {id:'bal-mech',term:'MECH (Balance Mode)',tier:'pro',def:"MECH solves the anti-roll bar split alone to hit your Mech Balance Target exactly as Forza displays it, leaving spring rates untouched; the solved split shows as ARB SPLIT F / R. It is the most direct way to reach a specific target, at the cost of whatever bar stiffness that demands.\n\nUnder AUTO stiffness it may enlarge the bar budget, up to the springs' own roll stiffness, when the natural budget cannot reach the target; ROLL °, SHARE % and BASIC budgets stay as you set them. If the target is still out of reach, the ANTI-ROLL BARS card names the bar at its floor or ceiling and the fix: change the rear/front spring ratio, set Hz MODE to MECH so the springs aim at the target too, or give the bars more budget (a lower Target Roll Angle, a higher ARB Share or a higher ARB Stiffness).",see:['mech-balance-target','bal-cosolve','hz-mode','mech-balance']},
    {id:'bal-cosolve',term:'CO-SOLVE (Balance Mode)',tier:'pro',def:"CO-SOLVE moves rear spring Hz and the anti-roll bar split together to reach the Mech Balance Target as Forza displays it, so neither has to travel as far alone. Spring Share sets how much of the correction each carries. Readouts show ARB SPLIT, SOLVED REAR Hz, and the spring and bar corrections, SPR CORR and ARB CORR.\n\nBecause it solves rear Hz itself, Hz MODE is hidden; RIDE REF. still works, with the stiffness slider inverted so it keeps controlling the axle you chose. If the solve leaves the rear springs well stiffer than the front, the SPRINGS card warns of inside-rear wheel lift. A target still out of reach is flagged on the ANTI-ROLL BARS card, which suggests raising Spring Share, turning AUTO off first if it is on, to move more of the correction into the springs.",see:['spring-share','bal-mech','mech-balance-target','ride-ref']},
    {id:'spring-share',term:'Spring Share',tier:'pro',def:"Spring Share, in CO-SOLVE, is how much of the balance correction comes from rear spring stiffness rather than the anti-roll bar split, from ARB ONLY (0%) to SPRING ONLY (100%); the readout gives the bars' part. Higher puts more of the work on the springs, leaving the bar split less to correct; lower does the reverse.\n\nAUTO, the default and the right choice for most builds, searches for the share at which the springs and the bars are equally close to their limits, counting a bar that would need less than the game's 1-click minimum as strained too. Turning AUTO off starts the manual slider at the share AUTO had found, so nothing jumps.",see:['bal-cosolve','mech-balance-target']},
    {id:'arb-bias',term:'ARB Bias',tier:'intermediate',def:"ARB Bias nudges the front/rear anti-roll bar split away from the point Balance Mode picks. FRONT HEAVY (left) adds front bar stiffness for more understeer; REAR HEAVY (right) adds rear bar stiffness for more oversteer and rotation. Centre leaves the mode's own split: the weight balance under WEIGHT, the springs-cancelling point under NEUTRAL CANCEL, the springs' own proportion under NEUTRAL EQUAL ROLL. The readout shows the resulting F / R split.\n\nIts reach depends on the mode: up to 20 points at the ends under WEIGHT, but up to 50 under NEUTRAL, where the extremes can reach a front-only or rear-only split. It is hidden while Stiffness Mode is MAN. In Beginner the Balance slider drives it.\n\n[PRO] Under CHASSIS, centre matches the calibrated natural mech balance (geometry, or your MEASURE NAT BAL reading) and the reach is 20 points, as in WEIGHT. MECH and CO-SOLVE set the split themselves and do not show it.",see:['balance-mode','balance-slider','understeer','oversteer']},
    {id:'balance-slider',term:'Balance Slider',tier:'beginner',def:"The Balance slider shifts overall handling balance in Beginner. Right (OVERSTEER) stiffens the rear for more rotation and a freer rear end; left (UNDERSTEER) stiffens the front for stability on corner entry. Within 10 either side of centre the readout says NEUTRAL. Centre is neutral for your weight distribution and suits most builds; drift builds usually want more right, street and GT builds mild left, and track builds vary with layout and taste.\n\nIt nudges rather than resets: it moves the front/rear anti-roll bar split by up to 20 points at its ends and the rear-to-front spring frequency ratio by up to 4%, starting from whatever ratio is already set, such as a loaded preset's.\n\n[INT] Beginner always runs ARB Balance Mode WEIGHT and Hz MODE MULTIPLIER; this slider is WEIGHT's ARB Bias plus a nudge to the MULTIPLIER ratio.",see:['understeer','oversteer','arb-bias','bal-weight']},
  ]},
  {group:'Ride & Springs',terms:[
    {id:'hz',term:'Hz (Ride Frequency)',tier:'beginner',def:"Ride frequency, in Hz, is how many times per second a corner would bounce if pushed down and released — spring stiffness measured against the weight it carries. Higher Hz means a stiffer spring, faster response and more body control, at the cost of compliance over bumps. Working in Hz rather than spring rate means the same number gives the same feel on a light or a heavy car. Street cars usually run 1.0–1.8 Hz (the app's SOFT and ROAD bands); track cars 1.8–2.6 Hz (FIRM into RACE). The bands split at 1.2, 1.8 and 2.5 Hz, and the app works between 0.8 and 5.5 Hz.\n\n[INT] Each axle has its own Hz: RIDE REF. picks the axle the stiffness slider sets and Hz MODE derives the other. A higher rear-to-front ratio adds rear roll stiffness and leans toward oversteer; a lower one leans toward understeer.",see:['ride-stiffness','spring-rate','corner-mass','hz-mode']},
    {id:'spring-rate',term:'Spring Rate (lb/in, N/mm or kgf/mm)',tier:'beginner',def:"Spring rate is the force needed to compress a spring by one unit of travel — the number you enter in the game's spring menu. SUSP.OS derives it from each axle's ride frequency and corner mass; you never set it directly. Rate rises with the square of Hz, so ×1.20 in frequency is ×1.44 in rate, and a heavier corner needs a proportionally stiffer spring for the same Hz. The unit follows your UNITS choice; BeamNG uses N/m.\n\nThe SPRINGS card lists each axle's rate with its SOFT / ROAD / FIRM / RACE badge and Hz; REAR × in its header is rear Hz ÷ front Hz, however that ratio was derived.\n\n[INT] The SPR F / SPR R strip in the RIDE section shows the same values as the SPRINGS card.",see:['hz','corner-mass','ride-stiffness']},
    {id:'corner-mass',term:'Corner Mass',tier:'intermediate',def:"Corner mass is the weight resting on one wheel: total weight split by front weight bias, then halved for each side. It turns a ride frequency into a spring rate and a damping ratio into a damper value, since a heavier corner needs more force to move the same way. It is also why EQUAL FORCE damping differs from TIME SYNC: equal force weighs each axle's ζ by corner mass × Hz, while equal settle time ignores mass.",see:['spring-rate','equal-force','time-sync']},
    {id:'sag',term:'Sag',tier:'intermediate',def:"Sag is how far the suspension compresses under the car's own weight at rest, before any cornering or bumps. In this model it depends only on ride frequency: static sag is 9810 ÷ (2π·Hz)² mm, so softer springs sag more and doubling Hz cuts sag to a quarter, whatever the car weighs. More vertical load sags it proportionally further.\n\nThe SAG vs LOAD chart in VISUALS plots it against vertical load, with an outside-wheel line that adds cornering load transfer, and shows how much travel is left before bottoming. It needs RIDE HEIGHT → CG on in CHASSIS and valid tyre sizes.",see:['bottoming','sag-vs-load','bottom-g']},
    {id:'bottoming',term:'Bottoming',tier:'beginner',def:"Bottoming is running out of suspension travel: the wheel compresses as far as it can and the chassis takes the hit directly, which spikes grip loss mid-corner. Raising ride height or stiffening springs both buy travel back. Saved car entries in the garage show the load, in g, at which that car bottoms out on its own ride height.\n\n[INT] The model treats static ride height as the travel available and bottoms a corner when its sag under load reaches it, so the bottom-out load, in g, is ride height in mm × (2π·Hz)² ÷ 9810. STIFFNESS → BOTTOM G's lets you set the stiffness slider in those terms, and the SAG vs LOAD chart grades the risk from LOW to BOTTOMED.",see:['sag','bottom-g','sag-vs-load']},
  ]},
  {group:'Ride Setup',terms:[
    {id:'ride-stiffness',term:'Ride Stiffness',tier:'beginner',def:"Ride Stiffness sets the suspension's ride frequency in Hz — the main stiffness control. Its readout names the band: SOFT (below 1.2 Hz) for a comfortable street ride or rough surfaces, ROAD (1.2–1.8) balanced, FIRM (1.8–2.5) responsive and sporty, RACE (2.5 and up) stiff, for smooth circuits only. FIRM is the best starting point for most builds: sharp response with good body control. It runs 0.8–5.5 Hz and starts at 1.75.\n\nIt sets one axle directly, normally the front, and the other follows at a set ratio.\n\n[INT] RIDE REF. picks the axle it sets, and its label follows: Ride Stiffness (front), Rear Stiffness, or Avg Stiffness (the average of both, with Hz MODE holding the split). Beginner keeps whichever reference an Intermediate or Pro session left. With RIDE HEIGHT → CG on, STIFFNESS can switch it to a bottom-out load in g.",see:['hz','ride-ref','hz-mode','bottom-g']},
    {id:'ride-ref',term:'Ride Reference (RIDE REF.)',tier:'intermediate',short:'RIDE REF.',def:"RIDE REF. chooses which axle the stiffness slider controls. FRONT: the slider sets front Hz and Hz MODE derives the rear. REAR: the slider sets rear Hz and the front is derived. SHARED: the slider sets the average of both, and Hz MODE sets the front/rear split around it. Switching never changes the actual front or rear frequencies, only which one the slider follows; a Hz mode the new reference cannot offer (INDEPENDENT under SHARED, the SHARED Hz mode outside it) becomes MULTIPLIER at the ratio the car already runs.\n\nThe reference axle also anchors damping: TIME SYNC, HYBRID and EQUAL FORCE hold it at your ζ and derive the other axle (under SHARED they balance both around it), SETTLE TIME back-solves on it, and STANDARD Damping Bias swings the other axle, or both half as far under SHARED.\n\n[PRO] It works in CO-SOLVE too: the slider is inverted through the solved rear/front ratio.",see:['ride-stiffness','hz-mode','damping-bias','bottom-g']},
    {id:'bottom-g',term:'STIFFNESS (HZ / BOTTOM G\'s)',tier:'intermediate',short:'BOTTOM G\'s',def:"STIFFNESS picks what the stiffness slider sets. HZ sets spring frequency directly. BOTTOM G's sets the vertical load, in g, at which the RIDE REF. axle bottoms out, from its static ride height and 1g sag (the SAG vs LOAD chart's model), and back-solves the Hz that produces it; the slider's range is whatever 0.8–5.5 Hz gives on that axle's ride height. It needs RIDE HEIGHT → CG on in CHASSIS.\n\nThe g target is saved with the build and share code and keeps re-solving Hz: change the ride height, or apply the build to a different chassis, and the Hz moves to hold the same g. Switching between HZ and BOTTOM G's carries the current value across, so the car does not jump. With RIDE REF. SHARED it also unlocks the SHARED Hz mode, which solves each axle to bottom out at the same g; leaving BOTTOM G's swaps that mode for MULTIPLIER at the current ratio.",see:['bottoming','sag','ride-ref','hz-mode']},
    {id:'hz-mode',term:'Hz Mode',tier:'intermediate',def:"Hz MODE sets how the second axle's ride frequency is derived from the one the stiffness slider sets. MULTIPLIER, the default, holds a fixed ratio. FLAT RIDE picks the ratio that reduces pitch bounce over bumps at your Target Speed. INDEPENDENT lets you set the other axle's Hz by hand, free of the first; it is not offered with RIDE REF. SHARED. SHARED appears only with RIDE REF. SHARED and STIFFNESS BOTTOM G's, and solves both axles to bottom out at the same g from their own ride heights. Switching to MULTIPLIER or INDEPENDENT starts from the Hz the car already has.\n\nThe FRONT / REAR strip below shows both frequencies and their ratio in every mode; a derived axle held at the 0.8–5.5 Hz limit turns amber, and the SHARED readout adds CLAMPED.\n\n[PRO] A fifth mode, MECH, derives the second axle from the Mech Balance Target so the springs carry the balance, under any ARB Balance Mode except CO-SOLVE, and shows the solved Hz (CLAMPED if it hits the limit). Hz MODE is hidden in CO-SOLVE, which solves rear Hz itself.",see:['hz-multiplier','flat-ride','ride-ref','bal-cosolve']},
