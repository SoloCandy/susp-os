<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--font-mono:'JetBrains Mono','Courier New',monospace;}
html{height:100%;height:-webkit-fill-available;height:100dvh;}
body{background:#020617;color:#cbd5e1;font-family:var(--font-mono);overflow:hidden;
     -webkit-text-size-adjust:100%;height:100%;height:-webkit-fill-available;height:100dvh;}
@media(max-width:768px){
  body{overflow:auto}
  .tog{padding:9px 0;min-height:40px}
  .tbtn{padding:11px 14px;min-height:40px}
}
@media(max-width:480px){
  /* Fluid number inputs so a label + two fields don't overflow a ~375px row.
     Keep font-size:16px (set on .num) — lowering it makes iOS zoom on focus. */
  .num{width:62px;min-width:0}
}
/* BeamNG output layout: fixed 2 columns (front/rear), collapsing to 1 below ~580px of the
   OUTPUT PANEL'S OWN width — a container query rather than a viewport media query, since the
   panel's rendered width depends on sidebar state, not window size (docs/CODE_MAP.md's
   headerCompact section covers why this codebase avoids reusing viewport-width flags for
   container-shaped decisions). auto-fit was tried first and rejected:
   on wide monitors minmax(280px,1fr) grows to 3-4 columns, which breaks the front/rear
   grouping the whole layout exists for — a fixed 2-column template with a container-query
   fallback is the only way to cap it at exactly 2 without an unwanted maxWidth margin cap. */
.beamng-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@container (max-width:580px){
  .beamng-grid{grid-template-columns:1fr}
}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#0a0f1a}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:2px}
.sidebar-scroll::-webkit-scrollbar{width:12px}
.sidebar-scroll::-webkit-scrollbar-track{background:#0a0f1a;border-left:1px solid #0f172a}
.sidebar-scroll::-webkit-scrollbar-thumb{background:#1e293b;border-radius:2px;border:3px solid #0a0f1a}
.sidebar-scroll::-webkit-scrollbar-thumb:hover{background:#334155}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.num{width:80px;background:transparent;border:1px solid #1e293b;border-radius:2px;
     color:#e2e8f0;font-family:var(--font-mono);font-size:16px;padding:1px 2px;
     outline:none;text-align:right;transition:border-color .12s,background .12s}
.num:hover{border-color:#334155}

.sli::-webkit-slider-thumb:hover{transform:scale(1.2)}

.tbtn.saved{border-color:#e2e8f022;color:#9ca3af}
.tbtn.undo-btn:disabled{opacity:0.28;cursor:default}

<body>
<div id="root">
  <!-- Shown only if React fails to mount -->
  <div id="pre-load" style="padding:24px;color:#6b7280;font-family:var(--font-mono);font-size:12px;background:#020617;min-height:100vh">
    <div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">SUSP.OS</div>
    <div style="margin-bottom:16px">Loading...</div>
  </div>
</div>
<script>
// Global error catcher — fires before React/Babel, shows error on blank screen
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById('pre-load');
  if(d){
    d.innerHTML='<div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">SUSP.OS — Failed to load</div>'
      +'<div style="color:#6b7280;margin-bottom:12px">JavaScript error on line '+line+'</div>'
      +'<div style="background:#0f172a;padding:12px;border-radius:4px;color:#ef4444;word-break:break-all;line-height:1.6">'+(msg||'Unknown error')+'</div>'
      +'<button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#0f172a;border:1px solid #1e293b;color:#e2e8f0;border-radius:4px;cursor:pointer;font-family:var(--font-mono);font-size:12px">RELOAD</button>';
  }
};
// Hide the pre-load message once React takes over
window.addEventListener('DOMContentLoaded',function(){
  setTimeout(function(){
    var d=document.getElementById('pre-load');
    if(d&&d.innerHTML.indexOf('Loading')>-1)d.style.display='none';
  },5000);
});
</script>
<script id="app-source" type="text/plain">
const {useState,useMemo,useRef,useEffect,useLayoutEffect,useReducer}=React;

const KG_TO_LB=2.204622622,LB_IN_TO_NM=175.126790921,MPH_TO_MS=0.44704,IN_TO_MM=25.4;
const KMH_PER_MPH=1.60934;
// Forza's "N/mm" per lb/in, for the UNITS modal's spring choice. FORZA'S METRIC SPRING LABEL IS
// 10× TRUE N/mm: the number it shows is really N/cm (1 lbf/in = 1.75127). Verified in-game —
// a spring the app showed as 190.4 true N/mm, Forza displayed as 1903.7 "N/mm". The app
// mirrors the game's number so it can be typed straight in, so the divisor is 100, not the
// physically-correct 1000. Do not "fix" it to 1000 again — see docs/HISTORY.md.
// Physical-unit game modes don't use this at all: BeamNG's slider is N/m (LB_IN_TO_NM).
const NMM_PER_LBIN=LB_IN_TO_NM/100;
// Forza's "kgf/mm" per lb/in. Same quirk as its N/mm: the number is 10× true kgf/mm
// (really kgf/cm) — confirmed in-game. Mirrors the game, so do not drop the ×10.
const KGFMM_PER_LBIN=10/KG_TO_LB/IN_TO_MM;
// Spring display units for the Forza modes: factor from lb/in, label, decimals, input step.
const SPRING_UNITS={
  lbin:{f:1,label:'lb/in',dp:0,step:1},
  nmm:{f:NMM_PER_LBIN,label:'N/mm',dp:1,step:0.1},
  kgfmm:{f:KGFMM_PER_LBIN,label:'kgf/mm',dp:1,step:0.1},
};
const springUnit=k=>SPRING_UNITS[k]??SPRING_UNITS.lbin;
// Forza ARB click → roll stiffness per m² of track (N·m/rad), at the suspension (before the tyre —
// see TYRE_HZ). Fitted to an in-game MAN bar sweep on three cars under the tyre-series model:
// ~579 (MX-5 Cup), ~438 (Ultima Evo), ~626 (Scirocco R). Forza normalises its 1–N slider per car,
// so no one value fits every car within its 2dp readout; 540 is the compromise default and
// MEASURE ARB (ch.measuredArbClick, read via arbScaleOf) replaces it per car. Was 240, then 285,
// both fitted without the tyre term. See docs/PHYSICS.md.
const ARB_RS_SCALE=540;
// The click scale for this chassis: the MEASURE ARB reading when one is set, else the default.
const arbScaleOf=ch=>ch.useMeasuredArbClick&&ch.measuredArbClick!=null
  ?Math.max(ARB_SCALE_MIN,Math.min(ARB_SCALE_MAX,ch.measuredArbClick)):ARB_RS_SCALE;
// A measured click scale is solved against MEAS. NAT BAL on springs at its Hz, so it goes stale
// when either changes. measuredArbNat/measuredArbNatHz record what it was measured against;
// null (scales applied before they existed) = unknown, never flagged.
const arbScaleStale=ch=>!!(ch.useMeasuredArbClick&&ch.measuredArbNat!=null&&(!ch.useMeasuredNatBal
  ||ch.measuredNatBal!==ch.measuredArbNat||(ch.measuredNatBalHz??NAT_BAL_REF_HZ)!==(ch.measuredArbNatHz??NAT_BAL_REF_HZ)));
const ARB_SCALE_MIN=150,ARB_SCALE_MAX=1500;
// MEASURE ARB's two readings each solve for a scale on their own. Past this fractional gap between
// them the pair is flagged rather than quietly averaged — see arbScaleSpread.
// 0.45, not the 0.25 this was first set to. That figure was reasoned rather than measured and
// sat BELOW the noise floor: 2-decimal rounding alone, on a car the model fits exactly, already
// spreads the two solves by up to 29.5% (swept over eight cars at the 2.20 Hz default — the two
// bar configs have different sensitivities, so the same ±0.005 lands very differently in scale
// space). A front/rear scale asymmetry the single-scale model can't express adds to that: ~34%
// at 5%, ~38% at 10%. Probing at the ceiling widens it again, since any nonlinearity in Forza's
// slider shows up as A/B disagreement. A real mistake is far louder — a mistyped reading runs
// 70%+ — so the threshold sits where it catches those without crying at a legitimately
// asymmetric car. A warning that fires on good data is a warning people learn to ignore.
const ARB_SCALE_SPREAD_WARN=0.45;
const rollCenterHeight=ch=>ch.cgHeight*0.20; // scales with CG height; ~0.09m for typical sports cars
// ARB Stiffness Mode AUTO: the bars' fraction (0.05–0.50) of total roll stiffness, from the
// roll angle the springs alone would give — 7% per degree. One definition for every solver
// (feelToPhysics, resolveCoSolveSpringShare, computeTune) so the share each one assumes agrees.
// One axle's spring roll stiffness (N·m/rad) from its ride frequency: wheel rate (2πf)²·m
// across the track, k·t²/2. Not hzToRs, which is the legacy Ride Stiffness slider mapping.
const axleRollStiffness=(hz,mass,track)=>Math.pow(hz*2*Math.PI,2)*mass*track*track/2;
// Body roll moment at 1 g lateral (N·m): mass × sprung-CG height above the roll centre.
const rollMomentOf=ch=>(ch.weight/KG_TO_LB)*9.81*(ch.cgHeight-rollCenterHeight(ch));
const autoArbShare=springRollDeg=>Math.max(5,Math.min(50,springRollDeg*7))/100;
// Forza's displayed mech balance counts each tyre as a spring in series with its suspension: an
// axle shows K·Kt/(K+Kt), so front/rear differences are compressed, more so the stiffer the
// suspension. Fitted to 33 in-game readings on three cars (MX-5 Cup, Ultima Evo, Scirocco R;
// springs split front/rear at 2.5–3.5 Hz, plus equal-Hz natural readings): the tyre behaves like a
// 3.94 Hz spring on a 269 kg corner and stiffens with the square root of its load. Tyre width had
// no measurable effect. Forza modes only; physical modes stay suspension-only. docs/PHYSICS.md.
const TYRE_HZ=3.94,TYRE_REF_MASS=269;
const tyreRollStiffness=(mass,track)=>axleRollStiffness(TYRE_HZ,Math.sqrt(mass*TYRE_REF_MASS),track);
const inSeries=(k,kt)=>k>0?k*kt/(k+kt):0;
// The rear fraction of roll stiffness Forza displays, from each axle's suspension roll stiffness.
const displayRsBalance=(ch,kF,kR)=>{
  const mc=cornerMasses(ch);
  const eF=inSeries(kF,tyreRollStiffness(mc.front,ch.trackF)),eR=inSeries(kR,tyreRollStiffness(mc.rear,ch.trackR));
  return eF+eR>0?eR/(eF+eR):1-ch.frontBias/100;
};
// MEASURE NAT BAL readings taken before the Hz was recorded were taken at this Hz — it was the
// card's default at the time. The card now defaults to 2.20; this constant is frozen history and
// must not follow it, or every legacy reading is reinterpreted at springs it was never taken on.
const NAT_BAL_REF_HZ=2.5;
// The equal-spring Hz MEASURE NAT BAL asks for by default — the protocol a reading is taken
// under. natDisplayModelOf evaluates the UNMEASURED natural here, so the app's prediction is a
// prediction of what that procedure would read. NOT the same as NAT_BAL_REF_HZ, which is frozen
// history for readings that never recorded their Hz; see the MEASURE card's probeHz.
const NAT_BAL_PROBE_HZ=2.20;
const DAMPING_CALIBRATION=0.00135;
// Mech-balance model (tyre load sensitivity). See mechBalanceLLT.
const TIRE_LOAD_SENS=0.15;   // grip falloff per unit Fz/Fz_ref (tyre load sensitivity)
const MECH_BAL_GAIN=1.8;     // axle capacity delta → balance offset (calibrated to legacy 0.5-neutral scale)
const WIDTH_GRIP_EXP=0.4;    // tyre width → grip capacity, sub-linear
const TIRE_MECH_SCALE=0.08;  // tyre width rear/front log-ratio → mech balance correction (calibrated from Forza telemetry)
// Default absolute Mech Balance Target. The Forza tuning community's published window for
// road/circuit work is 0.55–0.65, with ~0.60 the neutral baseline; 0.62–0.65 is specifically
// a rotation-biased (touge) setting and >0.65 reads as instability. This shipped at 0.65 from
// its introducing commit (a8c94e1) and was never revisited, so a fresh build defaulted to the
// rotation-biased edge of that window while presenting itself as neutral. Now 0.60.
const MECH_BALANCE_TARGET=0.60;
// Forza hides its real internal units, so both Forza modes express springs/dampers/ARBs
// as abstract "clicks" on a fixed 1–N scale (DAMPING_CALIBRATION and ARB_RS_SCALE were
// reverse-engineered to map real physics onto those ranges — see docs/PHYSICS.md).
// BeamNG generates its tuning sliders per-vehicle from the car's Jbeam `variables` block,
// so there is no universal scale to calibrate against. Instead of inventing a third click
// range, `physical:true` modes skip the click-compression step entirely and emit the real
// values the solver already computes upstream, in BeamNG's own slider units: N/m springs,
// N/m/s damping, and a linear N/m anti-roll rate. `damping`/`arb` are
// null because there is genuinely no ceiling — every consumer must null-check rather than
// assume a number (no clamping, no "/ N" suffix, no percentage-of-max warnings).
const GAME_LIMITS={horizon:{damping:20,arb:65},motorsport:{damping:40,arb:40},
                   beamng:{damping:null,arb:null,physical:true}};
// Branch on the capability, never on the string 'beamng' — a fourth physical-unit game
// should cost nothing but a GAME_LIMITS entry.
const isPhysical=gm=>!!GAME_LIMITS[gm]?.physical;
// GAME_LIMITS for a mode, falling back to the default mode's entry when `gm` names no mode at
// all. Only a corrupt PERSISTED value reaches that branch — both writers of fe.gameMode are
// constrained (the header select offers three options, sanitizeTune gates a decoded code through
// GAME_MODE_DEC) — but computeTune and App both dereference the result unguarded, so `undefined`
// there is a blank page on every reload until localStorage is edited by hand. App's repair effect
// fixes the stored value; this keeps the render that happens FIRST from throwing, which a
// useEffect cannot do. Not merged into isPhysical: that one already answers false for an unknown
// mode, which is the right answer for a fallback to a click mode. See docs/HISTORY.md.
const limitsOf=gm=>GAME_LIMITS[gm]??GAME_LIMITS[DEF_FE.gameMode];
// Nominal full-scale used ONLY as CO-SOLVE's utilisation denominator when the game mode
// has no click ceiling. It is NOT a reintroduced limit and nothing is clamped to it —
// see the derivation at the Auto Spring Share binary search for why the value cancels.
const ARB_UTIL_REF=65;
// Display labels for the game-mode dropdown. Both the desktop header and the mobile
// sidebar read this.
const GAME_MODE_LABEL={horizon:'HORIZON',motorsport:'MOTORSPORT',beamng:'BEAMNG'};

const cornerMasses=ch=>{
  const kg=ch.weight/KG_TO_LB;
  return{front:(kg*(ch.frontBias/100))/2,rear:(kg*(1-ch.frontBias/100))/2};
};
// Section widths in mm; 265 stands in for an unparseable or blank tyre size.
const tyreWidths=ch=>({twF:parseTyre(ch.tyreF)?.width??265,twR:parseTyre(ch.tyreR)?.width??265});
// Forza's mech-balance display includes a small tyre-width term; solvers subtract it from the target.
const tireCorrOf=ch=>{const{twF,twR}=tyreWidths(ch);return TIRE_MECH_SCALE*Math.log(twR/twF);};
const parseTyre=str=>{
  const s=String(str??'').trim();
  if(!s)return null;
  // Tolerant of whatever sits between the numbers — "265/35R18", "265x35r18",
  // "265-35-18", "265 35 18" all parse the same way. Only the digit groups
  // themselves matter; separators are just noise. Sanity-bounded so unrelated
  // text (e.g. stray numbers) doesn't get misread as a plausible tyre size.
  const tokens=s.match(/\d+(?:\.\d+)?/g);
  if(!tokens||!tokens.length)return null;
  const width=+tokens[0];
  if(!(width>=50&&width<=500))return null;
  if(tokens.length===1)return{width,aspectRatio:null,rimDiameter:null,diameter:null,radius:null};
  const aspect=+tokens[1];
  if(!(aspect>=10&&aspect<=100))return null;
  if(tokens.length===2)return{width,aspectRatio:aspect,rimDiameter:null,diameter:null,radius:null};
  const rim=+tokens[2];
  if(!(rim>=8&&rim<=30))return null;
  const diameter=rim*25.4+2*(width*aspect/100);
  return{width,aspectRatio:aspect,rimDiameter:rim,diameter,radius:diameter/2};
};
// ── Natural balance: two spaces, named ─────────────────────────────────────────
// "Natural" is the chassis's own balance at equal springs and no bars. It lives in two spaces,
// and until they were split one function, naturalMechBalanceOf, answered in whichever space its
// input happened to be in: the Forza DISPLAY reading when MEASURE NAT BAL was set (tyre term and
// tyre-series compression included), plain suspension GEOMETRY when it was not. Consumers that
// wanted one space got the other depending on a checkbox — a 0-delta target asked the solver for
// a correction on staggered tyres, and gripNeutralOf fed a display reading into a model that
// expects a roll-stiffness fraction. So there is no unqualified "natural" any more:
//
//   natRsOf(ch)                 roll-stiffness space — the REAL car's rear roll-stiffness fraction.
//                               For the grip model (balanceFromRsBal/mechBalanceLLT) and for
//                               ARB stiffness splits.
//   natDisplayOf(ch, gameMode)  display space — what the game SHOWS for the natural setup. For
//                               anything compared against a Mech Balance Target or tune.mechBalance:
//                               the stored target delta, the Balance Guide, MATCH CHASSIS, the MECH
//                               alignment nudge, the VISUALS roll-split NAT tick.
//
// Measured, the two differ by exactly tireCorr and natDisplayOf returns the reading verbatim.
// Unmeasured, natDisplayOf is the model's prediction of what MEASURE NAT BAL would read.
// docs/PHYSICS.md "Natural balance".
//
// The track-width/corner-mass estimate — the model's own natural in the solvers' roll-stiffness
// space, before any measurement. Also natBalRefOf's staleness fingerprint.
const natGeomOf=ch=>{
  const mc=cornerMasses(ch);
  return mc.rear*ch.trackR*ch.trackR/(mc.front*ch.trackF*ch.trackF+mc.rear*ch.trackR*ch.trackR);
};
// The MEAS. NAT BAL reading, clamped, or null. A Forza display reading — it is display space.
const measuredNatBalOf=ch=>ch.useMeasuredNatBal&&ch.measuredNatBal!=null
  ?Math.max(0.10,Math.min(0.90,ch.measuredNatBal)):null;
// The model's display-space natural, ignoring any measurement. Physical modes display the
// suspension fraction plus the tyre-width term (computeTune's physUnits mechBalance); Forza shows
// each tyre in series with its axle (displayRsBalance), so the prediction is taken at the equal
// springs MEASURE NAT BAL would ask for. Separate from natDisplayOf because REACH needs it for
// hypothetical track widths, where a measured reading — which ignores the chassis — would be flat.

  return {zF:refZeta, zR:rateToZeta(target*biasMult/rHz)};
};
// Settle time (10%-envelope) from ζ (%) and Hz, via dampRate's piecewise rate. WITHIN THIS
// ENVELOPE MODEL ζ=100% is the fastest settle and pushing past it is slower, not faster — the
// old single-branch rate=ζ got that backwards above 100%. "Within this model" is load-bearing:
// the envelope drops the response's own 1/√(1-ζ²) and (1+ωn·t) factors, so it is NOT a bound in
// either direction, and the real quickest ±10% settle sits nearer ζ≈59%. Full derivation, the
// error figures per ζ, and why the DYNAMICS chart measures its drawn curve instead of calling
// this: docs/PHYSICS.md.
const settleTimeFromZeta=(zetaPct,hz)=>{
  if(zetaPct<=0||hz<=0) return 99;
  return 2.302/(dampRate(zetaPct)*hz*2*Math.PI); // ln(10)/(rate·ωn)
};
// Equal damping FORCE: weight is mass·Hz (force ∝ ζ·m·Hz — see solveDampRaw), so this also
// corrects for corner-mass asymmetry that settleZetas ignores. Unlike settle time, damping force
// at a given velocity is linear in ζ regardless of over/underdamped, so the plain linear solve
// (balancedZetas) is correct here as-is — no rate-space treatment needed.
const forceZetas=(rideRef,mF,fHz,mR,rHz,refZeta,biasMult)=>balancedZetas(rideRef,mF*fHz,mR*rHz,refZeta,biasMult);
// Damping Balance Mode's front/rear solve, picked by mode. Both SYNC and NEUTRAL are just
// "anchor refZeta at the ride-reference axle, derive the other so <metric> matches" — so the
// anchor is a parameter, and the same call splits the rebound anchor and (in INDEPENDENT bump
// mode) the typed bump anchor. Callers still clamp the result; this returns it unclamped.
// HYBRID (a peer mode, like the other three) is the per-axle arithmetic mean of the SYNC and NEUTRAL solves —
// halfway between equal settle time and equal damping force. Both parents hold the anchor axle
// at refZeta, so the mean does too.
const balModeZetas=(mode,rideRef,mF,fHz,mR,rHz,refZeta,biasMult)=>{
  if(mode==='neutral')return forceZetas(rideRef,mF,fHz,mR,rHz,refZeta,biasMult);
  const s=settleZetas(rideRef,fHz,rHz,refZeta,biasMult);
  if(mode!=='hybrid')return s;
  const f=forceZetas(rideRef,mF,fHz,mR,rHz,refZeta,biasMult);
  return{zF:(s.zF+f.zF)/2,zR:(s.zR+f.zR)/2};
};

// ── Mech balance — steady-state US/OS from physics ───────────────────────────
// Derived from lateral-load-transfer distribution (set by the front/rear roll-
// stiffness RATIO), tyre load sensitivity (grip falls as vertical load rises —
// the mechanism by which roll stiffness shifts balance), and tyre width as a
// sub-linear grip-capacity multiplier. 0.5 = neutral, >0.5 = oversteer.
// Only Kf/Kr ratio matters for LLTD, so callers may pass relative stiffnesses.
// Lateral load transfer per corner (N) at 1g lateral accel — shared by mechBalanceLLT
// and the SAG vs LOAD outside-wheel line.
const latLoadTransfer=(ch,Kf,Kr)=>{
  const g=9.81,a=1.0;
  const m=cornerMasses(ch),Mf=m.front*2,Mr=m.rear*2,Mt=Mf+Mr,RC=rollCenterHeight(ch);
  const Mphi=Mt*g*a*(ch.cgHeight-RC),sF=Kf/(Kf+Kr);     // sprung roll couple; front elastic share
  const dWf=Mphi*sF/ch.trackF+Mf*g*a*RC/ch.trackF;       // front lateral load transfer (N): elastic + geometric
  const dWr=Mphi*(1-sF)/ch.trackR+Mr*g*a*RC/ch.trackR;   // rear
  return{dWf,dWr,Mf,Mr};
};
// The grip model's core: each axle's lateral capacity per unit of its own static weight — the
// lateral g that axle can hold at 1 g of lateral load transfer. Steady cornering asks each axle
// for lateral force in proportion to its static mass, so whichever axle has the smaller figure
// runs out first. mechBalanceLLT maps the difference onto 0-1; gripMargin states it in percent.
//
// ax (in g, + = accelerating, − = braking) moves load between the axles by Mt·ax·h/L, and the
// longitudinal force it takes — split by fxF, the front axle's share — comes out of each axle's
// capacity by the friction circle. At ax=0 neither step runs, so mechBalanceLLT's figures are
// exactly what they were before this function existed.
const axleLatG=(ch,Kf,Kr,ax=0,fxF=0)=>{
  const g=9.81;
  const{twF,twR}=tyreWidths(ch);
  const{dWf,dWr,Mf,Mr}=latLoadTransfer(ch,Kf,Kr);
  const FzRef=(Mf+Mr)*g/4;                                // avg static wheel load
  // Tyre grip falls as vertical load rises. Hyperbolic, not the linear 1-k*(z/FzRef-1) this was
  // until the lift fix: same VALUE and same SLOPE at FzRef, so TIRE_LOAD_SENS keeps its exact
  // meaning and MECH_BAL_GAIN needed no refit, but it saturates instead of turning over. The
  // linear form peaked at z/FzRef=(1+k)/2k (~3.8) and went negative past 1+1/k (~7.7), each
  // caught by a Math.max(0,...) — two clamps standing in for physics at the edge of a model
  // whose entire job is the edge. Neither is reachable in the tunable band, so this half of the
  // change is a latent-cliff fix; the cap below is the half that fixed a live bug.
  // Denominator is (1-k)+k*z/FzRef, positive for any k<1 and any z>=0.
  const fy=Fz=>Fz/(1+TIRE_LOAD_SENS*(Fz/FzRef-1));
  // static wheel loads, then the pitch transfer — capped at the axle's own load for the reason the
  // lateral cap below gives
  let wF=Mf*g/2,wR=Mr*g/2;
  if(ax){const dL=Math.max(-wR,Math.min(wF,(Mf+Mr)*g*ax*ch.cgHeight/ch.wheelbase/2));wF-=dL;wR+=dL;}
  // An axle cannot transfer more load than it carries: at dW = w the inside wheel is already off
  // the ground and there is nothing left to move. Without this cap the model went on
  // "transferring" past lift, which only added load to the outside wheel and made the axle GAIN
  // capacity — so more rear roll stiffness came back as LESS oversteer, backwards, from rsBalance
  // 0.555 on a tall-CG car. It costs nothing on a chassis that never lifts: there the cap is
  // inactive to the last bit. docs/HISTORY.md.
  //
  // Capped HERE and not in latLoadTransfer, whose other consumer (the SAG vs LOAD outside-wheel
  // line) wants the uncapped compression the springs would see. fy therefore no longer needs a
  // max(0,Fz) floor either — with the cap, w-t is zero at worst, never negative.
  const tF=Math.min(dWf,wF),tR=Math.min(dWr,wR);
  let FyF=Math.pow(twF/265,WIDTH_GRIP_EXP)*(fy(wF+tF)+fy(wF-tF));
  let FyR=Math.pow(twR/265,WIDTH_GRIP_EXP)*(fy(wR+tR)+fy(wR-tR));
  if(ax){
    // Friction circle per axle: what the brakes or the drive take is not there for cornering.
    // An axle asked for more than its whole capacity has locked or spun up, with nothing lateral left.
    const Fx=(Mf+Mr)*g*Math.abs(ax),xF=Fx*fxF,xR=Fx*(1-fxF);
    FyF=Math.sqrt(Math.max(0,FyF*FyF-xF*xF));
    FyR=Math.sqrt(Math.max(0,FyR*FyR-xR*xR));
  }
  return{gF:FyF/(Mf*g),gR:FyR/(Mr*g)};
};
const mechBalanceLLT=(ch,Kf,Kr)=>{
  const{gF,gR}=axleLatG(ch,Kf,Kr);
  return Math.max(0,Math.min(1,0.5+MECH_BAL_GAIN*(gF-gR)));
};
// Grip margin: how much more lateral g the front axle has to spare than the rear, as a percent of
// the two axles' mean. + = the rear runs out first (oversteer). PRO's Handling Balance unit. It is
// the grip model's own difference with MECH_BAL_GAIN left out — the gain only rescales that
// difference onto 0-1, and nothing has calibrated it (docs/KNOWN_ISSUES.md), so a unit that skips it
// claims nothing the model does not. rs is the REAL rear roll-stiffness fraction, as for
// balanceFromRsBal, and the ratio is built the same way so the two always share a sign.
const gripMargin=(ch,rs,ax=0,fxF=0)=>{
  const r=Math.max(1e-4,Math.min(1-1e-4,rs));
  const{gF,gR}=axleLatG(ch,1,r/(1-r),ax,fxF);
  return gF+gR>0?200*(gF-gR)/(gF+gR):0;
};
// The reference longitudinal loads ENTRY and EXIT are read at. Arbitrary but stated, and shown
// beside the figures: how hard someone trail-brakes or feeds in throttle is the driver's choice,
// not the tune's, and the absolute ENTRY/EXIT margins scale with it far more than with any setting
// (docs/FORMULAS.md "Phase margins"). Low enough that BRK and DRIVE stay readable.
const ENTRY_G=0.3,EXIT_G=0.2;
// PRO's Handling Balance, by phase, in grip-margin percent. MID is the grip model alone at the
// tune's stiffness split; ENTRY adds what brake bias does to it, EXIT what the drive split does.
// Each is measured against the load-proportional ("ideal") split at that phase's reference load,
// so BRK and DRIVE are zero when the axles share the work in proportion to what they carry.
// PITCH — the car's own weight transfer at that load — is reported but NOT added to the phase
// total: it is not tunable, and at any realistic load it outweighs everything that is.
//
// MID is split into CHAS/SPR/ARB the way the bar splits its units: CHAS is the margin at the
// weight-matched split, and the rest is shared between springs and ARBs in proportion to
// bSp/bAb, which are exactly how far each moves the split (their sum is 100·(rsBalance−(1−nf))).
// Diff lock and damping have no calibrated size (DIFF_BIAS_SCALE is a guess; damping acts only in
// transients a steady-state model cannot size), so the readout gives them a direction only and
// reads that from the BEG/INT bar terms.
const phaseMargins=(ch,tune,brakeBias,diff)=>{
  const nf=ch.frontBias/100,off=natOffsetOf(ch),hL=ch.cgHeight/ch.wheelbase;
  const Kf=tune.rsSpF+tune.rsAbF,Kr=tune.rsSpR+tune.rsAbR;
  const rs=(Kf+Kr>0?Kr/(Kf+Kr):1-nf)+off;
  const mid=gripMargin(ch,rs),chas=gripMargin(ch,1-nf+off);
  const bs=tune.bSp??0,ba=tune.bAb??0,moved=mid-chas;
  const sp=Math.abs(bs+ba)>1e-9?moved*bs/(bs+ba):0,ab=moved-sp;
  const idealBrakeF=Math.max(0,Math.min(1,nf+ENTRY_G*hL));
  const idealDriveF=Math.max(0,Math.min(1,nf-EXIT_G*hL));
  const driveF=diff?.layout==='FWD'?1:diff?.layout==='AWD'?1-Math.max(0,Math.min(1,(diff.center??65)/100)):0;
  const eRef=gripMargin(ch,rs,-ENTRY_G,idealBrakeF),xRef=gripMargin(ch,rs,EXIT_G,idealDriveF);
  const brk=gripMargin(ch,rs,-ENTRY_G,brakeBias/100)-eRef;
  const drive=gripMargin(ch,rs,EXIT_G,driveF)-xRef;
  return{
    mid:{total:mid,chas,sp,ab},
    entry:{total:mid+brk,brk,pitch:eRef-mid,idealBias:idealBrakeF*100},
    exit:{total:mid+drive,drive,pitch:xRef-mid,driveF,idealDriveF},
  };
};
// pure roll-stiffness rear fraction Kr/(Kf+Kr) → balance
const balanceFromRsBal=(ch,rsBal)=>{
  const r=Math.max(1e-4,Math.min(1-1e-4,rsBal));
  return mechBalanceLLT(ch,1,r/(1-r));
};
// The rear roll-stiffness fraction at which the grip model reads exactly neutral (0.5) for this
// chassis — where its tyres, track widths, CG and weight split balance out. A bracketed root: since the
// lift fix balanceFromRsBal is monotone, so the root is unique when it exists. It fails to exist
// only when the grip model sits on one side of neutral across the whole range; the answer then
// saturates at that end, which says "no stiffness split neutralises this car" in the only way a
// split can.
//
// Independent of MECH_BAL_GAIN: 0.5 is where front and rear capacity are EQUAL, and the gain only
// scales the difference between them. That is what lets the Handling Balance bar use it before
// the gain is calibrated (docs/IDEAS.md item 2 / KNOWN_ISSUES).
const gripNeutralSplitOf=ch=>{
  let lo=1e-4,hi=1-1e-4;
  let fLo=balanceFromRsBal(ch,lo)-0.5,fHi=balanceFromRsBal(ch,hi)-0.5;
  if(fLo>=0)return lo;
  if(fHi<=0)return hi;
  // Illinois (bracketed regula falsi): converges in about ten model evaluations where plain
  // bisection took fifty, and it always keeps the root bracketed. The speed matters because GRIP
  // mode reaches this three times per solve (target, bChassis, DNA's balance axis) and applyDNA
  // solves dozens of candidates per keystroke — it held its 50 ms budget with one bisection, not three.
  let side=0;
  for(let i=0;i<100&&hi-lo>1e-12;i++){
    const m=(lo*fHi-hi*fLo)/(fHi-fLo),fm=balanceFromRsBal(ch,m)-0.5;
    if(fm===0)return m;
    if(fm<0){lo=m;fLo=fm;if(side===-1)fHi/=2;side=-1;}
    else{hi=m;fHi=fm;if(side===1)fLo/=2;side=1;}
  }
  return (lo+hi)/2;
};
// ── Calibration envelope ─────────────────────────────────────────────────────
// Every constant in the mech-balance chain was fitted on a bounded set of cars and states:
// TYRE_HZ/TYRE_REF_MASS on three cars with springs split 2.5-3.5 Hz and corners of 269-476 kg,
// TIRE_MECH_SCALE on section widths 215-335 (docs/PHYSICS.md, docs/KNOWN_ISSUES.md "the
// tyre-series model's reach"). Outside those bounds the model still returns a number, and the
// app used to present it with exactly the confidence of one inside. These bounds belong to the
// FIT, not to the physics: nothing is clamped to them, and a tune outside one is not wrong,
// only unverified. Stated here once so the badge and the docs cannot drift apart.
const FIT_HZ=[2.5,3.5],FIT_CORNER_KG=[269,476],FIT_TYRE_W=[215,335];
// The unclamped RIDE HEIGHT -> CG estimate in mm, or null when either tyre size is too partial
// to give a radius. App's sync effect clamps this into the CG Height field's range; the
// envelope needs the raw value, because saturation is precisely the case worth flagging —
// past the cap, CG stops responding to ride-height edits while the load-transfer model keeps
// running on the clamped value. Both callers read this one expression.
const CG_EST_MIN=200,CG_EST_MAX=1500;
const cgEstMmOf=ch=>{
  const pF=parseTyre(ch.tyreF),pR=parseTyre(ch.tyreR);
  if(pF?.radius==null||pR?.radius==null)return null;
  return (pF.radius+pR.radius)/2
    +(ch.rideHeightF*1000)*(ch.frontBias/100)+(ch.rideHeightR*1000)*(1-ch.frontBias/100);
};
// Which fitted bounds this tune sits outside — [] means every input is inside the calibrated
// set. `tag` is for the badge, `detail` for its tooltip, and `hard` separates two different
// claims that would otherwise share one colour:
//   hard:false — EXTRAPOLATION. The model is behaving; it just has no measurements this far
//     out, so the figure is unverified rather than suspect. The fitted Hz band is narrow
//     (2.5-3.5) against the app's own 0.8-5.5 range, so an ordinary street tune at 2.2 Hz is
//     legitimately outside it. Common, and shown muted for exactly that reason.
//   hard:true — the model has stopped answering correctly at this input (see LIFT and CG).
// Amber is reserved for the second kind. A badge that is amber on a default build teaches
// people to ignore amber, which would cost more than it says. The Hz / corner-mass / tyre-width
// checks belong to the tyre-series display model (displayRsBalance), which only the Forza
// modes run — physical modes stay suspension-only — so they are skipped for a physical game
// mode. The CG check is not skipped: the LLT model behind GRIP targets, the Balance Guide and
// the SAG chart runs in every mode. Tyre pressure is deliberately NOT a check: the whole fit
// is pressure-conditional in every state, so a flag that is always on would say nothing. That
// caveat lives in the badge's tooltip text instead.
const balanceEnvelope=(ch,tune,gameMode)=>{
  const out=[];
  const outside=([lo,hi],...vs)=>vs.some(v=>v<lo||v>hi);
  if(!isPhysical(gameMode)){
    const mc=cornerMasses(ch),{twF,twR}=tyreWidths(ch);
    if(tune&&outside(FIT_HZ,tune.fHz,tune.rHz))out.push({tag:'HZ',hard:false,
      detail:`spring frequencies ${tune.fHz.toFixed(2)}/${tune.rHz.toFixed(2)} Hz vs the fitted ${FIT_HZ[0]}-${FIT_HZ[1]} Hz`});
    if(outside(FIT_CORNER_KG,mc.front,mc.rear))out.push({tag:'MASS',hard:false,
      detail:`corner masses ${Math.round(mc.front)}/${Math.round(mc.rear)} kg vs the fitted ${FIT_CORNER_KG[0]}-${FIT_CORNER_KG[1]} kg`});
    if(outside(FIT_TYRE_W,twF,twR))out.push({tag:'TYRE',hard:false,
      detail:`section widths ${twF}/${twR} mm vs the sampled ${FIT_TYRE_W[0]}-${FIT_TYRE_W[1]} mm`});
  }
  // Inside-wheel lift. This used to be a HARD flag, because past lift the model reversed
  // direction; mechBalanceLLT now caps transfer at the axle's static load and stays monotone
  // through it, so the figures are sound again and the flag is soft. It is still worth saying,
  // for a reason that belongs to the car rather than the model: an axle with a wheel in the air
  // has stopped responding to roll stiffness at all, so further bar or spring on that end buys
  // nothing and the balance curve goes flat. Flagged in every game mode — the LLT model is not
  // Forza-specific. docs/HISTORY.md.
  if(tune){
    const kF=(tune.rsSpF??0)+(tune.rsAbF??0),kR=(tune.rsSpR??0)+(tune.rsAbR??0);
    if(kF+kR>0){
      const{dWf,dWr,Mf,Mr}=latLoadTransfer(ch,kF,kR);
      const liftF=dWf>=Mf*9.81/2,liftR=dWr>=Mr*9.81/2;
      if(liftF||liftR)out.push({tag:'LIFT',hard:false,
        detail:`at 1 g lateral the ${liftF&&liftR?'inside wheels of both axles':(liftF?'front':'rear')+' inside wheel'} unload completely, so more bar or spring on that end will not move the balance`});
    }
  }
  const est=ch.useRideHeightCG?cgEstMmOf(ch):null;
  if(est!=null&&(est<CG_EST_MIN||est>CG_EST_MAX))out.push({tag:'CG',hard:true,
    detail:`the ride-height CG estimate (${Math.round(est)} mm) is outside the ${CG_EST_MIN}-${CG_EST_MAX} mm CG Height range, so it is clamped and ride-height edits no longer move CG`});
  return out;
};
// Balance Guide RANGE / GRIP GAP band edge: how far from NATURAL one fraction of the
// NATURAL→GRIP TARGET gap sits. Both widgets call this so their bands cannot drift apart.
//
// frac ≤ 1 interpolates from natural toward grip-neutral and is direction-correct under
// either sign of gap — it is a partial correction of whatever the chassis does.
// frac > 1 is a different thing: DRIFT (0.90–1.55) and RWD DRAG (0.60–1.05) use it to
// recommend overshooting *past* grip-neutral into rotation, which is a direction, not a
// magnitude. Plain frac*gap carried gap's sign, so on a negative gap it aimed that
// overshoot at understeer instead — backwards, and on the DRIFT band large enough to
// invert the whole build table (see docs/HISTORY.md). Anchoring the overshoot at
// grip-neutral and adding |gap| keeps it pointed at oversteer whatever the sign.
//
// A negative gap is ordinary, not an edge case: the sign tracks front weight bias and
// flips just under 50% front (about 49.5% on DEF_CH — it moves with calibration, so no exact figure is kept), so every mid- and rear-engined car is
// on that side, as is any chassis a wide front tyre stagger puts there. docs/PHYSICS.md
// carries the crossover measurements.
//
// The gap>=0 guard is load-bearing, not decoration: the overshoot branch spells |gap|
// as -gap, which is the absolute value only on the branch that runs it. The guard-free
// Math.abs form is algebraically identical for gap>=0 but not bit-identical (~1 ULP),
// and keeping the positive branch on the literal frac*gap means no band that exists
// today can move, .toFixed(2) rounding boundaries included.
const balanceBandDelta=(frac,gap)=>frac<=1||gap>=0?frac*gap:gap+(frac-1)*(-gap);
// The delta range a fraction PAIR covers: [lowest, highest] over every fraction from fracLo to
// fracHi. Both widgets call this rather than taking min/max of the two endpoint deltas, because
// on a negative gap balanceBandDelta is V-shaped in frac and bottoms out at frac=1 (grip-neutral):
// a pair that straddles 1 has its low extreme BETWEEN its endpoints. Endpoint min/max dropped
// grip-neutral from DRIFT's band (0.90–1.55 / AWD 0.75–1.30) and RWD DRAG's (0.60–1.05) on every
// rear-biased chassis, and the 0.03 minimum width then pushed the truncated band further toward
// oversteer — AWD DRIFT at 45% front shipped 0.457–0.487 when its fractions only reach 0.430–0.463

// endpoint deltas, so min/max still return those endpoints exactly: no front-biased band moves.
const balanceBandRange=(fracLo,fracHi,gap)=>{
  const ds=[balanceBandDelta(fracLo,gap),balanceBandDelta(fracHi,gap)];
  if(fracLo<1&&fracHi>1)ds.push(balanceBandDelta(1,gap));
  return[Math.min(...ds),Math.max(...ds)];
};
// Per-layout/build fraction pair for the Balance Guide RANGE band and the GRIP GAP widget.
// One table so the two widgets cannot disagree on what "in range" means. Fractions >1
// (DRIFT, RWD DRAG) overshoot past grip-neutral on purpose — see docs/PHYSICS.md.
const BALANCE_BAND_FRACS={
  FWD:{street:[0.35,0.65],track:[0.55,0.95],drift:[0.90,1.55],rally:[0.30,0.55],offroad:[0.15,0.35],drag:[0.45,0.80]},

  AWD:{street:[0.30,0.55],track:[0.45,0.80],drift:[0.75,1.30],rally:[0.25,0.45],offroad:[0.12,0.28],drag:[0.35,0.65]},
};
const balanceBandFracs=(layout,build)=>((BALANCE_BAND_FRACS[layout]??BALANCE_BAND_FRACS.RWD)[build])??[0.55,0.95];
// Rear Hz Mode MECH (outside CO-SOLVE): the part both Ride Reference paths of feelToPhysics
// share. Converts the absolute ARB Balance target into a physical spring rsBalance target,
// works out how much of it weight/manual-split ARBs will dilute (share p), and returns the
// rear/front Hz ratio the springs need. hzPairFor(mult) gives the front/rear Hz the caller
// would assume for a trial ratio (null = before any ratio is known), so AUTO's share can be
// estimated from the same Hz the caller will actually produce. MAN ARB's closed-form solves

const mechSpringSplit=(ch,fe,arbBalModeEarly,hzPairFor)=>{
  const m_m=cornerMasses(ch);

  // Solve springs to a higher ratio so combined (springs + weight ARBs) still hits rsBalTgt:
  //   combined = (1-p)*b_sp + p*rsBalNat = rsBalTgt  →  b_sp = (rsBalTgt - p*rsBalNat)/(1-p)
  // Roll-stiffness fractions are width-independent (width is a grip effect, not stiffness).

  // a physical rsBalance target the same way: pre-compensate tyre-width and MEASURE NAT BAL
  // calibration offsets so a target sitting exactly on NAT collapses back to rsBalNat and
  // needs no spring correction. See resolveCoSolveSpringShare for the full rationale.
  const natOffset=natOffsetOf(ch);
  const rsBalTgt=Math.max(0.05,Math.min(0.95,arbBalTgt-tireCorrOf(ch)-natOffset));
  const multFor=p=>{
    const eff=p>0?Math.max(0.05,Math.min(0.95,(rsBalTgt-p*rsBalNat)/(1-p))):rsBalTgt;
    const R=eff/(1-eff);
    return Math.sqrt(R*m_m.front*ch.trackF*ch.trackF/(m_m.rear*ch.trackR*ch.trackR));
  };
  let p=0;
  if(arbBalModeEarly==='weight'||arbBalModeEarly==='manual'){
    const arbMode=fe.arbMode??'auto';
    if(arbMode==='share') p=Math.max(0,Math.min(0.99,(fe.arbShareMan??20)/100));
    else if(arbMode==='auto'){
      // Two-pass: the first pass assumes the caller's no-ratio Hz; the second uses the
      // corrected Hz so the auto share assumed here matches what computeTune will settle on.
      let hz=hzPairFor(null);
      for(let i=0;i<2;i++){

    // target respectively), not a share fraction of spring stiffness — p stays 0

const feelToPhysics=(ch,fe)=>{

  const arbBalModeEarly=ARB_BAL_MODE_DEC.includes(fe.arbBalMode)?fe.arbBalMode:'weight';
  const uiRideRef=['front','rear','shared'].includes(fe.rideRef)?fe.rideRef:'front';

    // target sitting exactly on NAT does and does not collapse to.
    const natOffset=natOffsetOf(ch);
    const rst=Math.max(0.001,Math.min(0.999,abt-tireCorr-natOffset));
    const springShareAuto=fe.springShareAuto!==false;
    const csArbMode=fe.arbMode??'auto';
    const csOpts={arbBalTarget:abt,arbMode:csArbMode,
      arbShareMan:Math.max(0,Math.min(80,fe.arbShareMan??15)),
      arbBasicMan:Math.max(0,Math.min(100,fe.arbBasicMan??50)),
      arbTargetRoll:csArbMode==='roll'?Math.max(0.3,Math.min(5.0,fe.arbTargetRollMan)):0,
      springShareAuto,springShareManual:fe.springShare??50};

  // multiplier below 1 printed an out-of-band front Hz with nothing flagged; and the multiplier
  // path reported clamped:false unconditionally, hiding a rear pinned at HZ_MAX (avg 5.0 Hz
  // × 3.00 asks for 7.50 and silently delivers a 2.2 ratio instead of the 3.0 requested).
  // Testing the raws rather than the clamped results also stops a solve that legitimately

  const splitAvgHz=(avgHz,mult)=>{

      // axle's own static ride height and 1g sag (same model as the SAG vs LOAD chart /
      // BOTTOM G's stiffness mode). frontHz=avgHz*sqrt(rhAvg/rhF) makes gF=rhF*(2π*frontHz)²/9810
      // collapse to rhAvg*(2π*avgHz)²/9810 — i.e. the g the Avg Bottom-Out slider shows —
      // and the same substitution for rearHz makes gR match it too.
      const rhF_mm=(ch.rideHeightF??0.13)*1000,rhR_mm=(ch.rideHeightR??0.12)*1000;
      const rhAvg_mm=(rhF_mm+rhR_mm)/2;
      const rawF=avgHz*Math.sqrt(rhAvg_mm/Math.max(1e-6,rhF_mm));
      const rawR=avgHz*Math.sqrt(rhAvg_mm/Math.max(1e-6,rhR_mm));
      frontHz=clampHz(rawF);
      rearHz=clampHz(rawR);
      rearHzClamped=rawF<HZ_MIN||rawF>HZ_MAX||rawR<HZ_MIN||rawR>HZ_MAX;
    } else { // flatRide (independent collapses to equal in shared mode)
      const res=flatRideSharedHz(avgHz,ch.wheelbase,fe.targetSpeed);
      frontHz=res.fHz;rearHz=res.rHz;rearHzClamped=res.clamped;
    }
  } else {
    const primaryHz=frontHz; // frontHz = rsToHz(fe.rideStiffness)
    let secondaryHz,secondaryHzClamped;
    if(rearHzMode==='independent'){
      secondaryHz=clampHz(fe.rearHzMan??1.5);
      secondaryHzClamped=false;
    } else if(rearHzMode==='multiplier'){
      const mult=fe.rearHzMult??1.20;
      const raw=rideRef==='front'?primaryHz*mult:primaryHz/mult;
      secondaryHz=clampHz(raw);
      secondaryHzClamped=raw<HZ_MIN||raw>HZ_MAX;
    } else if(rearHzMode==='mech'&&arbBalModeEarly!=='coSolve'){
      const mech=mechSpringSplit(ch,fe,arbBalModeEarly,mult=>{
        const sec=mult==null?primaryHz
          :clampHz(rideRef==='front'?primaryHz*mult:primaryHz/mult);
        return rideRef==='rear'?[sec,primaryHz]:[primaryHz,sec];
      });
      let _manSolved_fr=false;
      if(arbBalModeEarly==='man'){
        const m_m=cornerMasses(ch);
        const rsAbF_m=(fe.arbManF??20)*arbScaleOf(ch)*ch.trackF*ch.trackF;
        const rsAbR_m=(fe.arbManR??20)*arbScaleOf(ch)*ch.trackR*ch.trackR;
        const T=mech.rsBalTgt;
        let mult_man=null;
        if(rideRef==='front'){
          const Sf=axleRollStiffness(primaryHz,m_m.front,ch.trackF);
          const numer=T*(Sf+rsAbF_m)-(1-T)*rsAbR_m;
          const denom=Sf*(1-T)*(mech.W/mech.V);
          if(numer>0&&denom>0) mult_man=Math.sqrt(numer/denom);
        } else {
          const Sr=axleRollStiffness(primaryHz,m_m.rear,ch.trackR);
          const numer=Sr*(mech.V/mech.W)*T;
          const denom=Sr*(1-T)-(T*rsAbF_m-(1-T)*rsAbR_m);
          if(numer>0&&denom>0) mult_man=Math.sqrt(numer/denom);
        }
        if(mult_man!=null){
          const raw_man=rideRef==='front'?primaryHz*mult_man:primaryHz/mult_man;
          secondaryHz=clampHz(raw_man);
          secondaryHzClamped=raw_man<HZ_MIN||raw_man>HZ_MAX;
          _manSolved_fr=true;
        }
      }
      if(!_manSolved_fr){
        const raw_m=rideRef==='front'?primaryHz*mech.mult:primaryHz/mech.mult;
        secondaryHz=clampHz(raw_m);
        secondaryHzClamped=raw_m<HZ_MIN||raw_m>HZ_MAX;
      }
    } else { // flatRide
      if(rideRef==='front'){
        const res=flatRideRearHz(primaryHz,ch.wheelbase,fe.targetSpeed);
        secondaryHz=res.hz;secondaryHzClamped=res.clamped;
      } else {
        // Inverse flat ride: given rearHz, solve frontHz. Single traverse-time offset —
        // must mirror flatRideRearHz/flatRideSharedHz's `t`, not `2*t` (see the note above them).
        if(fe.targetSpeed>=200){

        } else {

    // guarded, but it means "the DERIVED axle was clamped" — under a REAR reference that axle
    // is the front, so it must still carry secondaryHzClamped. Hard-coding false here silently
    // swallowed every front-axle clamp under REAR (inverse FLAT RIDE at a low Target Speed
    // floors the front at HZ_MIN), leaving the banner, the warnBox and the CLAMPED badge all
    // dark while the reference axle itself, which is never clamped, was the only one reported.
    if(rideRef==='front'){
      rearHz=secondaryHz;rearHzClamped=secondaryHzClamped;
    } else {

      frontHz=secondaryHz; // re-assign: secondary is now front
    }

  // 'sync' (TIME SYNC), 'hybrid' (mean of TIME SYNC and EQUAL FORCE), 'neutral' (EQUAL FORCE). STANDARD biases
  // the anchor ζ directly by percentage (Hz-agnostic). SYNC (formerly the "Settle Sync" toggle)
  // solves so both axles finish settling at the same time (Hz-aware, ignores corner mass).
  // NEUTRAL solves so both axles push the same actual damping FORCE (Hz- and mass-aware) —
  // see forceZetas. One Damping Bias slider drives the F/R split in all three; only the
  // formula interpreting it changes, so switching modes never resets or jumps the slider.
  // This is independent of REBOUND MODE (below), which only decides how the anchor ζ itself
  // is obtained — the two compose freely, not one dictating the other.
  const dampBalMode=['standard','sync','hybrid','neutral'].includes(fe.dampBalMode)?fe.dampBalMode:'standard';
  // REBOUND MODE: CHARACTER types the anchor ζ directly (Rebound ζ slider). SETTLE TIME instead
  // back-solves it from an absolute target time at the ride-reference axle's Hz — see baseZeta
  // below. Whichever axle Damping Balance Mode treats as "the anchor" (rideRef for SYNC/NEUTRAL;
  // whichever side the Damping Bias slider leaves unbiased for STANDARD) is the one guaranteed
  // to actually hit that target; the other axle's real settle time is whatever falls out of the
  // chosen Balance Mode, same as it would from a typed Rebound ζ.
  const dampCharMode=fe.dampCharMode??'zeta';
  const settleTarget=Math.max(0.10,Math.min(1.50,fe.settleTarget??0.80));
  const reboundZeta=Math.max(10,Math.min(200,fe.reboundZeta??70));
  const bumpRatioVal=Math.max(10,Math.min(100,fe.bumpRatio??56));

  const sB=Math.max(-50,Math.min(50,-(fe.dampingBias??0)));
  const biasMult=Math.pow(2,sB/50);
  const dampMasses=cornerMasses(ch);
  let zetaF,zetaR,bumpZetaF,bumpZetaR,bumpZeta;
  const baseZeta=dampCharMode==='settle'
    ? (()=>{
        const refHz=uiRideRef==='rear'?rearHz:uiRideRef==='shared'?(frontHz+rearHz)/2:frontHz;
        // Clamp at 100% (critical damping), not 200% — in the envelope model this back-solve
        // inverts, ζ=100% is the fastest settle (see settleTimeFromZeta above), so an unreachable
        // target should stop there rather than overshoot into overdamped territory where zeta
        // climbing higher makes it settle SLOWER. Against the real trace the quickest ±10% settle
        // sits nearer ζ≈59%, so this clamp is self-consistent with what it inverts rather than
        // physically optimal — deliberate, and recorded in docs/HISTORY.md.
        return Math.max(10,Math.min(100,refHz>0?2.302/(settleTarget*refHz*2*Math.PI)*100:70));

  // must anchor to baseZeta (not the raw reboundZeta) — otherwise bump output stays frozen at
  // the CHARACTER-mode default under SETTLE TIME, never tracking a Hz or Settle Target change.
  bumpZeta=dampingMode==='ratio'
    ? Math.max(10,Math.min(baseZeta,baseZeta*bumpRatioVal/100))
    : Math.max(10,Math.min(115,fe.bumpZeta??39));

    const{zF,zR}=balModeZetas(dampBalMode,uiRideRef,dampMasses.front,frontHz,dampMasses.rear,rearHz,baseZeta,biasMult);
    zetaF=Math.max(10,Math.min(200,zF));
    zetaR=Math.max(10,Math.min(200,zR));
    // RATIO bump gets its front/rear split for free — scaling both rebound zetas by one
    // percentage preserves whatever split the balance mode solved. A typed (INDEPENDENT) bump ζ
    // has no such link to rebound, so it runs through the same solver a second time as its own
    // anchor: SYNC/NEUTRAL then shapes the bump stroke exactly as it shapes rebound, and the
    // Damping Bias slider moves both. Clamped to the same 10..200 as STANDARD's independent
    // branch, deliberately NOT to the axle's rebound ζ — bump above rebound is a warned-but-
    // allowed state everywhere else (the slider reaches 115 and the readout says CROSSED). The
    // old `min(zetaF/zetaR, bumpZeta)` did both wrong things at once: it fed the same typed ζ
    // to both axles (so Damping Bias moved rebound only, and SYNC/NEUTRAL's whole premise
    // applied to half the damper), then silently clipped whichever axle's rebound sat lower,
    // making the only surviving bump split an artifact of that clipping.
    const bumpSplit=dampingMode==='ratio'
      ? {zF:zetaF*bumpRatioVal/100,zR:zetaR*bumpRatioVal/100}
      : balModeZetas(dampBalMode,uiRideRef,dampMasses.front,frontHz,dampMasses.rear,rearHz,bumpZeta,biasMult);
    bumpZetaF=Math.max(10,Math.min(200,bumpSplit.zF));
    bumpZetaR=Math.max(10,Math.min(200,bumpSplit.zR));
  }else{
    // STANDARD's exact-anchor axle now follows Ride Reference (not the Damping Bias slider's
    // sign): FRONT ref holds zetaF at baseZeta for both bias directions and swings zetaR; REAR
    // ref mirrors that onto zetaF; SHARED splits the swing across both axles (half-magnitude
    // each) so neither is a fixed anchor, matching balancedZetas' shared-ref symmetry.
    const dampingBias=fe.dampingBias??0;
    if(uiRideRef==='rear'){
      zetaF=Math.max(10,Math.min(200,baseZeta*(1+dampingBias/100)));
      zetaR=baseZeta;
      bumpZetaF=Math.max(10,Math.min(200,bumpZeta*(1+dampingBias/100)));
      bumpZetaR=bumpZeta;
    }else if(uiRideRef==='shared'){
      zetaF=Math.max(10,Math.min(200,baseZeta*(1+dampingBias/200)));
      zetaR=Math.max(10,Math.min(200,baseZeta*(1-dampingBias/200)));
      bumpZetaF=Math.max(10,Math.min(200,bumpZeta*(1+dampingBias/200)));
      bumpZetaR=Math.max(10,Math.min(200,bumpZeta*(1-dampingBias/200)));
    }else{
      zetaF=baseZeta;
      zetaR=Math.max(10,Math.min(200,baseZeta*(1-dampingBias/100)));
      bumpZetaF=bumpZeta;
      bumpZetaR=Math.max(10,Math.min(200,bumpZeta*(1-dampingBias/100)));
    }

  // front-heavy ARB split, reinforcing its natural tendency. OPPOSITE mirrors around 50%
  // instead, so the bars counteract the weight distribution rather than follow it.
  const arbSplitOpposite=!!fe.arbSplitOpposite;
  const arbBalance=Math.max(20,Math.min(80,(arbSplitOpposite?ch.frontBias:(100-ch.frontBias))+fe.arbBias*0.4));
  const arbMode=fe.arbMode??'auto';
  // arbTargetRoll is only consumed by the roll-mode solver in computeTune.
  // The else branch is never used — pass a harmless 0 so the field is defined.
  const arbTargetRoll=arbMode==='roll'
    ? Math.max(0.3,Math.min(5.0,fe.arbTargetRollMan))
    : 0;
  const arbShareMan=Math.max(0,Math.min(80,fe.arbShareMan??15));
  const arbBasicMan=Math.max(0,Math.min(100,fe.arbBasicMan??50));
  const arbBalTarget=clampBalTarget(fe.arbBalTarget??MECH_BALANCE_TARGET);
  const arbBalMode=ARB_BAL_MODE_DEC.includes(fe.arbBalMode)?fe.arbBalMode:'weight';
  const springShare=Math.max(0,Math.min(100,fe.springShare??50));
  // coSolve overrides rearHz in computeTune via effectiveRHz; flat-ride fallthrough can
  // set rearHzClamped spuriously. mechBalClamped covers coSolve limits instead.
  if(arbBalModeEarly==='coSolve') rearHzClamped=false;
  return{frontHz,rearHz,rearHzClamped,rearHzMode,rideRef:uiRideRef,reboundZeta,baseZeta,bumpZeta,zetaF,zetaR,bumpZetaF,bumpZetaR,dampingMode,dampBalMode,dampCharMode,dampingBias:fe.dampingBias??0,bumpRatioVal,arbBalance,arbBias:fe.arbBias??0,arbTargetRoll,arbMode,arbShareMan,arbBasicMan,arbBalTarget,arbBalMode,arbSplitOpposite,arbNeutralEqual:!!fe.arbNeutralEqual,springShare,springShareAuto:fe.springShareAuto!==false,arbManF:fe.arbManF,arbManR:fe.arbManR};
};

// CO-SOLVE spring-share (S) resolution — shared by feelToPhysics (Kcs slider pre-inversion)
// and computeTune (effectiveRHz) so both agree on the same S. Auto Spring Share has no closed
// form (it's a search), so feelToPhysics can't approximate it independently without the two
// diverging — see docs/HISTORY.md.
const resolveCoSolveSpringShare=(ch,fHz,opts,gameMode)=>{
  const{arbBalTarget,arbMode,arbShareMan,arbBasicMan,arbTargetRoll,springShareAuto,springShareManual}=opts;
  const lim=GAME_LIMITS[gameMode],utilRef=lim?.arb??ARB_UTIL_REF;
  const m=cornerMasses(ch);
  const tireCorr=tireCorrOf(ch);
  const rsSpF_cs=axleRollStiffness(fHz,m.front,ch.trackF);
  const rsSpR_base=axleRollStiffness(fHz,m.rear,ch.trackR);
  const R_baseline=rsSpR_base/(rsSpF_cs+rsSpR_base); // geometric equal-Hz, zero-ARB ratio — the real "no correction" spring state
  // A MEAS. NAT BAL reading moves the natural away from the geometric estimate above (the real
  // car's roll stiffness includes factors the track/mass formula can't see). Treat the gap as a
  // constant offset — same treatment as tireCorr below — so CO-SOLVE doesn't "fix" a gap between
  // our geometry estimate and the reading that isn't a real tuning need.
  //
  // What a target sitting exactly on NAT (0 delta, so natDisplayOf) converts to here: exactly
  // R_baseline when measured, and in physical modes, where natDisplay is geometry + tireCorr.
  // Unmeasured in a Forza mode it lands within the tyre-series compression of R_baseline — the
  // natural Forza DISPLAYS is not the geometric fraction, because each tyre sits in series with
  // its axle — which is a few thousandths on an ordinary car and solveTune's display-space pass
  // closes. Before natural was split into its two spaces this missed by tireCorr as well, about
  // 0.02 on staggered tyres, because the target was taken from geometry. docs/PHYSICS.md.
  const natOffset=natOffsetOf(ch);
  const targetRsBalance=Math.max(0.001,Math.min(0.999,arbBalTarget-tireCorr-natOffset));
  let S;
  if(springShareAuto){
    // See computeTune's prior inline version (moved here unchanged) for the full derivation.
    const _rm=rollMomentOf(ch);
    const _rsTotTgt=_rm/(arbTargetRoll*(Math.PI/180));
    const arbScale=arbScaleOf(ch);
    const _basicBudget=arbScale*(ch.trackF*ch.trackF+ch.trackR*ch.trackR)*(1+(utilRef-1)*arbBasicMan/100);
    const _K=targetRsBalance/(1-targetRsBalance);
    const simUtil=(sVal)=>{
      const R_sp_s=Math.max(0.001,Math.min(0.999,R_baseline+sVal*(targetRsBalance-R_baseline)));
      const rsSpR_s=R_sp_s*rsSpF_cs/(1-R_sp_s);
      const eRHz=clampHz(Math.sqrt(2*rsSpR_s/(m.rear*ch.trackR*ch.trackR))/(2*Math.PI));
      const rsSpRs=axleRollStiffness(eRHz,m.rear,ch.trackR);
      // Measured from the clamped Hz: once clampHz bites, the unclamped rsSpR_s overstates
      // what springs deliver and the search would hand them correction they can't make.
      const spUtil=Math.min(1,Math.abs(rsSpRs-rsSpR_base)/(arbScale*ch.trackR*ch.trackR*utilRef));
      const rsSp_s=rsSpF_cs+rsSpRs;
      const nRoll=rsSp_s>0?(_rm/rsSp_s)*(180/Math.PI):5;
      const autoSh=autoArbShare(nRoll);
      const sh=arbMode==='share'?arbShareMan/100:autoSh;
      const budget_s=arbMode==='roll'?Math.max(0,_rsTotTgt-rsSp_s)
        :arbMode==='basic'?_basicBudget
        :rsSp_s*(sh/(1-sh));
      // No ARB budget (ROLL mode once springs alone meet the roll target) means ARB can deliver
      // none of the correction — not that it is relaxed. Reporting 0 made the search back off
      // to where the bars are floored and useless; unbounded strain hands it all to springs.
      if(budget_s<=0) return{spUtil,abUtil:Infinity};
      const rF_s=Math.max(0,Math.min(1,(_K*(rsSpF_cs+budget_s)-rsSpRs)/(budget_s*(1+_K))));
