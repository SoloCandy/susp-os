         reboundZeta:57.5,bumpRatio:39,dampBias:5,diffExit:-5,diffEntry:15},
   slack:{},keep:['platformHz','balanceOffset','reboundZeta','pitchRatio','arbShare']},
  {v:2,name:'GT3',
   axes:{platformHz:3.30,pitchRatio:0.96,arbShare:4.5,balanceOffset:-0.025,
         reboundZeta:45.5,bumpRatio:63,dampBias:-10,diffExit:5,diffEntry:-5},
   slack:{},keep:['platformHz','arbShare','pitchRatio','balanceOffset','reboundZeta']},
  {v:2,name:'TAIL-HAPPY RWD',
   axes:{platformHz:2.20,pitchRatio:1.225,arbShare:7.0,balanceOffset:0.010,
         reboundZeta:41,bumpRatio:47,dampBias:10,diffExit:20,diffEntry:10},
   slack:{},keep:['balanceOffset','arbShare','reboundZeta','platformHz','pitchRatio']},
];

// Presentation for the DNA modal, the sidebar marks and the VISUALS match card, in the
// order they render. `step` is fine enough to hit every archetype seed exactly.
const DNA_AXIS_UI=[
  {k:'platformHz',   label:'PLATFORM',   unit:' Hz',step:0.01,  dp:2},
  {k:'pitchRatio',   label:'PITCH',      unit:'×',  step:0.005, dp:3},
  {k:'arbShare',     label:'ARB SHARE',  unit:'%',  step:0.5,   dp:1},
  {k:'balanceOffset',label:'BALANCE',    unit:'',   step:0.0025,dp:4,signed:true},
  {k:'reboundZeta',  label:'REBOUND ζ',  unit:'%',  step:0.5,   dp:1},
  {k:'bumpRatio',    label:'BUMP RATIO', unit:'%',  step:1,     dp:0},
  {k:'dampBias',     label:'DAMP BIAS',  unit:'',   step:1,     dp:0,signed:true},
  {k:'diffExit',     label:'DIFF EXIT',  unit:'',   step:1,     dp:0,signed:true},
  {k:'diffEntry',    label:'DIFF ENTRY', unit:'',   step:1,     dp:0,signed:true},
];
const dnaFmt=(k,v)=>{
  if(v==null||!isFinite(v))return'—';
  const u=DNA_AXIS_UI.find(a=>a.k===k);
  return(u.signed&&v>0?'+':'')+v.toFixed(u.dp)+u.unit;
};
// A width, not a position: never takes the +/- a signed axis puts on a value, because it already
// follows a "±".
const dnaFmtWidth=(k,v)=>{
  const u=DNA_AXIS_UI.find(a=>a.k===k);
  return Math.abs(v).toFixed(u.dp)+u.unit;
};
// The modes compileDNA forces. The editor lists the ones that differ before APPLY, because the
// user may have chosen the current ones on purpose.
const DNA_MODE_FIELDS=[
  ['fe','rideRef','RIDE REF'],['fe','rideStiffMode','STIFFNESS'],['fe','rearHzMode','REAR HZ'],
  ['fe','arbMode','ARB'],['fe','arbBalMode','ARB BALANCE'],['fe','arbBalTargetMode','BAL TARGET'],
  ['fe','dampCharMode','DAMP CHARACTER'],['fe','dampingMode','BUMP'],['fe','dampBalMode','DAMP BALANCE'],
  ['dr','diffManual','DIFF MANUAL'],
];

const Hint=({text,term=null})=>{
  const[pos,setPos]=useState(null);
  const ref=useRef(null);
  const tipRef=useRef(null);
  const ptrType=useRef(null);   // last pointer type seen on the ⓘ: 'mouse' | 'touch' | 'pen'
  const closeT=useRef(null);    // pending hover-close timer
  const keyAt=useRef(-1e9);     // when onKeyDown last handled Enter/Space, to drop a follow-up click
  const downAt=useRef(-1e9);    // when a pointer last pressed the ⓘ
  const openedAt=useRef(0);
  // React 18 always has useId; the counter only covers an older React.
  const autoId=React.useId?React.useId():null;
  const tipIdRef=useRef(null);
  if(!tipIdRef.current)tipIdRef.current=autoId||`hint-tip-${++hintIdSeq}`;
  const tipId=tipIdRef.current;

  const calcPos=()=>{
    if(!ref.current)return null;
    const r=ref.current.getBoundingClientRect();
    const PAD=8,GAP=6;
    const TW=Math.min(260,window.innerWidth-PAD*2);
    const TH=240; // generous estimate — ensures correct above/below decision for long tooltips
    // Prefer below; fall back to above. Clamp both so tooltip never leaves viewport.
    const showBelow=r.bottom+GAP+TH<=window.innerHeight;
    const top=Math.max(PAD,showBelow?r.bottom+GAP:r.top-TH-GAP);
    // Centre on icon, then clamp to viewport edges
    const iconCx=(r.left+r.right)/2;
    const left=Math.max(PAD,Math.min(iconCx-TW/2,window.innerWidth-TW-PAD));
    return{top,left,width:TW};
  };

  const clearClose=()=>{ if(closeT.current){clearTimeout(closeT.current);closeT.current=null;} };
  const close=()=>{ clearClose(); setPos(null); };
  const open=()=>{ clearClose(); openedAt.current=performance.now(); setPos(p=>p||calcPos()); };
  const toggle=()=>{ clearClose(); openedAt.current=performance.now(); setPos(p=>p?null:calcPos()); };
  // Mouse hover closes on a short delay so the pointer can cross the gap onto a TERMS link.
  const scheduleClose=()=>{ clearClose(); closeT.current=setTimeout(()=>{closeT.current=null;setPos(null);},150); };
  useEffect(()=>()=>clearClose(),[]);

  const openGlossary=keyboard=>{
    close();
    glossaryBridge.open&&glossaryBridge.open(term,{from:ref.current,keyboard});
  };

  const onPointerEnter=e=>{ ptrType.current=e.pointerType; if(e.pointerType==='mouse')open(); };
  const onPointerLeave=e=>{ if(e.pointerType==='mouse')scheduleClose(); };
  const onPointerDown=e=>{ ptrType.current=e.pointerType; downAt.current=performance.now(); };

  const onClick=e=>{
    e.stopPropagation(); // Hints sit inside clickable headers and toggles
    if(e.detail===0){
      // A span fires no click for Enter/Space, but guard anyway; any other detail-0 click is an
      // assistive-tech activation, which toggles like a tap.
      if(performance.now()-keyAt.current<500)return;
      toggle();return;
    }
    if(ptrType.current==='mouse')open(); // hover already opened it; a mouse click never closes
    else toggle();                       // touch / pen tap
  };

  const onFocus=e=>{
    // Keyboard focus opens; the focus a mouse click or tap gives the ⓘ does not (onClick handles
    // those). The press-time check covers a browser whose :focus-visible matches after a press,
    // where opening here would let the click that follows toggle it shut.
    let fv=true;
    try{fv=e.currentTarget.matches(':focus-visible');}catch(_){}
    if(fv&&performance.now()-downAt.current>800)open();
  };
  const onBlur=e=>{
    const to=e.relatedTarget;
    if(to&&tipRef.current&&tipRef.current.contains(to))return;
    close();
  };

  const onKeyDown=e=>{
    if(e.key==='Enter'){
      e.preventDefault();e.stopPropagation();keyAt.current=performance.now();
      if(!pos)open();
      else if(term)openGlossary(true);
      else close();
    }else if(e.key===' '){
      e.preventDefault();e.stopPropagation();keyAt.current=performance.now();
      toggle();
    }else if(e.key==='Escape'){
      if(pos){e.stopPropagation();close();}
    }
  };

  useEffect(()=>{
    if(!pos)return;
    // Capture phase, so a handler that stops propagation cannot keep the tooltip open.
    const onDown=e=>{
      const t=e.target;
      if(ref.current&&ref.current.contains(t))return;
      if(tipRef.current&&tipRef.current.contains(t))return;
      close();
    };
    // The tooltip is position:fixed, so it would drift off its ⓘ. A scroll right after opening is
    // the browser bringing a keyboard-focused ⓘ into view, so that one re-places it instead.
    const onScroll=()=>{
      if(performance.now()-openedAt.current<300){const p=calcPos();if(p)setPos(p);}
      else close();
    };
    document.addEventListener('pointerdown',onDown,true);
    window.addEventListener('scroll',onScroll,{passive:true,capture:true});
    window.addEventListener('resize',close,{passive:true});
    return()=>{
      document.removeEventListener('pointerdown',onDown,true);
      window.removeEventListener('scroll',onScroll,{passive:true,capture:true});
      window.removeEventListener('resize',close,{passive:true});
    };
  },[pos]);

  // React portals bubble synthetic events to the Hint's React ancestors; keep tooltip presses there.
  const stop=e=>e.stopPropagation();

  return(
    <span ref={ref} role="button" tabIndex={0} aria-label="Help"
          style={{display:'inline-block',cursor:'help',WebkitTapHighlightColor:'transparent'}}
          onPointerEnter={onPointerEnter} onPointerLeave={onPointerLeave} onPointerDown={onPointerDown}
          onFocus={onFocus} onBlur={onBlur}
          onKeyDown={onKeyDown}
          onClick={onClick} aria-describedby={pos?tipId:undefined} data-term={term||undefined}>
      <span style={{fontSize:12,color:'#94a3b8'}}>ⓘ</span>
      {pos&&ReactDOM.createPortal(
        <div style={{position:'fixed',top:pos.top,left:pos.left,zIndex:1000,width:pos.width??220,
                     background:'#0f172a',border:'1px solid #e2e8f011',borderRadius:2,
                     padding:'7px 9px',fontSize:11,color:'#94a3b8',lineHeight:1.6,
                     pointerEvents:term?'auto':'none',boxShadow:'0 4px 16px #00000088'}}
             ref={tipRef} role="tooltip" id={tipId}
             onClick={stop} onPointerDown={stop} onMouseDown={stop} onTouchStart={stop}
             onPointerEnter={e=>{if(e.pointerType==='mouse')clearClose();}}
             onPointerLeave={e=>{
               // Straight back onto the ⓘ: React fires no enter on it (the tooltip is its child in the
               // React tree), so don't schedule a close it would never cancel.
               const to=e.relatedTarget;
               if(e.pointerType==='mouse'&&!(to&&ref.current&&ref.current.contains(to)))scheduleClose();
             }}>
          {text}
          {term&&(
            <button type="button" tabIndex={-1} data-hint-term={term}
                    style={{...TERM_LINK_STYLE,display:'block',marginTop:5}}
                    // Keep focus on the ⓘ: a blur with no in-tooltip relatedTarget (Safari does not
                    // focus clicked buttons) would unmount the tooltip before this click lands.
                    onMouseDown={e=>e.preventDefault()}
                    onClick={()=>openGlossary(false)}>
              TERMS: {glossaryLabel(term)} ›
            </button>
          )}
        </div>,
        document.body
      )}
    </span>
  );
};
// Inline "TERMS: <entry> ›" link for footers and notes that have no ⓘ. Opens the glossary at that entry.
const TermLink=({id,label=null})=>(
  <button type="button" data-term-link={id}
          style={{...TERM_LINK_STYLE,display:'inline',whiteSpace:'nowrap'}}
          onClick={e=>{
            e.stopPropagation();
            glossaryBridge.open&&glossaryBridge.open(id,{from:e.currentTarget,keyboard:e.detail===0});
          }}>
    TERMS: {label||glossaryLabel(id)} ›
  </button>
);
// Shared by Hint's tooltip TERMS link and TermLink; each adds its own display.
const TERM_LINK_STYLE={padding:0,background:'none',border:'none',color:'#818cf8',fontSize:10,
  letterSpacing:1,fontFamily:'var(--font-mono)',cursor:'pointer',textAlign:'left'};
let hintIdSeq=0; // Hint's tooltip-id fallback when React.useId is missing

// The unit label beside a `.num` box. Field and every readout that embeds a `.num` share it, so
// all typed-entry boxes read the same: CHASSIS's weight, the Hz fields, BOTTOM G, FeelSlider's.
const NUM_UNIT_STYLE={fontSize:10,color:'#94a3b8',fontFamily:'var(--font-mono)',whiteSpace:'nowrap'};
const Field=({label,value,onChange,min,max,step=0.01,unit='',hint=null,logScale=false,logMid=null,noSlider=false,stacked=false,hintTerm=null})=>{
  const mid=logMid??Math.sqrt(min*max);
  const valToT=v=>{
    if(!logScale)return(v-min)/(max-min);
    if(v<=mid)return 0.5*Math.log(Math.max(v,min)/min)/Math.log(mid/min);
    return 0.5+0.5*Math.log(v/mid)/Math.log(max/mid);
  };
  const tToVal=t=>{
    if(!logScale)return min+(max-min)*t;
    if(t<=0.5)return min*Math.pow(mid/min,t*2);
    return mid*Math.pow(max/mid,(t-0.5)*2);
  };
  const t=Math.max(0,Math.min(1,valToT(value)));
  const pct=t*100;
  const clamp=v=>Math.max(min,Math.min(max,v));
  const [draft,setDraft]=useState(null);
  const focused=draft!==null;
  const commit=()=>{
    if(draft===null)return;
    const v=parseFloat(draft);
    onChange(isNaN(v)?value:clamp(v));
    setDraft(null);
  };
  const numRef=useRef(null), sliRef=useRef(null);
  const valRef=useRef(value);
  const draftRef=useRef(draft);
  const onChangeRef=useRef(onChange); useLayoutEffect(()=>{onChangeRef.current=onChange;},[onChange]);
  useLayoutEffect(()=>{valRef.current=value;},[value]);
  useLayoutEffect(()=>{draftRef.current=draft;},[draft]);
  const stepBy=dir=>{
    const base=draftRef.current!==null&&!isNaN(parseFloat(draftRef.current))
      ? parseFloat(draftRef.current) : valRef.current;
    const dynStep=logScale?(base<6000?1:Math.max(1,Math.round((base-6000)/600))):step;
    const next=clamp(base+dir*dynStep);
    const snapped=logScale?Math.round(next):Math.round(next/step)*step;
    onChangeRef.current(parseFloat(snapped.toFixed(6)));
    if(draftRef.current!==null)setDraft(null);
  };
  useEffect(()=>{
    const onWheel=e=>{
      const focused=document.activeElement===numRef.current||document.activeElement===sliRef.current;
      if(!focused)return;
      e.preventDefault();
      e.stopPropagation();
      stepBy(e.deltaY<0?1:-1);
    };
    const n=numRef.current, s=sliRef.current;
    n&&n.addEventListener('wheel',onWheel,{passive:false});
    s&&s.addEventListener('wheel',onWheel,{passive:false});
    return()=>{
      n&&n.removeEventListener('wheel',onWheel);
      s&&s.removeEventListener('wheel',onWheel);
    };
  },[min,max,step,logScale]);
  return(
    <div style={{marginBottom:10,minWidth:0}}>
      {/* `stacked` puts the box under its label, for paired F/R fields sharing a row. */}
      <div style={stacked?{display:'flex',flexDirection:'column',alignItems:'flex-start',gap:3,marginBottom:3}
                         :{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
        <span style={{fontSize:12,color:'#9ca3af',minWidth:0,maxWidth:'100%',overflow:'hidden',
                      textOverflow:'ellipsis',whiteSpace:'nowrap',marginRight:6}}>
          {label}{hint&&<Hint text={hint} term={hintTerm}/>}
        </span>
        <div style={{display:'flex',alignItems:'center',gap:3,flexShrink:0}}>
          <input ref={numRef} type="number" className="num" min={min} max={max} step={logScale?1:step}
            value={focused?draft:value}
            onFocus={()=>setDraft(String(value))}
            onChange={e=>setDraft(e.target.value)}
            onBlur={commit}
            onKeyDown={e=>{if(e.key==='Enter')e.target.blur();}}/>
          {unit&&<span style={NUM_UNIT_STYLE}>{unit}</span>}
        </div>
      </div>
      {!noSlider&&<input ref={sliRef} type="range" className="sli" min={0} max={1} step={0.0001}
        value={logScale?t:undefined}
        {...(!logScale&&{min,max,step,value})}
        style={{background:`linear-gradient(to right,#e2e8f0 ${pct}%,#1e293b ${pct}%)`}}
        onChange={e=>onChange(logScale
          ?Math.round(clamp(tToVal(parseFloat(e.target.value))))
          :parseFloat(e.target.value))}/>}
    </div>
  );
};


// Field's always-visible number box on its own — the one every FeelSlider shows (see its `box`
// prop). Same behaviour as Field's input: it shows the value, typing edits a draft, Enter or
// blur commits clamped to min/max, Escape cancels. A draft left unedited never commits, so
// focusing and leaving can't nudge a value. While it's focused and unedited it follows the value,
// so the slider's own wheel stepping stays visible in the box.
const NumBox=({value,onCommit,min,max,dp=0,unit,label,disabled=false,placeholder})=>{
  const fmt=v=>{
    if(!Number.isFinite(v))return'';
    const raw=String(parseFloat(v.toFixed(6)));
    return v.toFixed(Math.max(dp,(raw.split('.')[1]||'').length));
  };
  const[draft,setDraft]=useState(null);
  const openedRef=useRef(null);
  const cancelRef=useRef(false);
  useEffect(()=>{
    if(draft!==null&&draft===openedRef.current){const t=fmt(value);openedRef.current=t;setDraft(t);}
  },[value]); // eslint-disable-line
  const commit=()=>{
    const v=parseFloat(draft);
    if(!cancelRef.current&&draft!==openedRef.current&&!isNaN(v))
      onCommit(parseFloat(Math.max(min,Math.min(max,v)).toFixed(6)));
    cancelRef.current=false;
    setDraft(null);
  };
  return(
    <span style={{display:'flex',alignItems:'center',gap:3}}>
      {/* Every .num box keeps its border, so an empty one still shows where it is. */}
      <input type="number" className="num" aria-label={label} min={min} max={max} disabled={disabled} placeholder={placeholder}
        step={dp>0?Number((1/10**dp).toFixed(dp)):1}
        value={draft??fmt(value)}
        onFocus={e=>{const t=fmt(value);openedRef.current=t;setDraft(t);e.target.select();}}
        onChange={e=>setDraft(e.target.value)}
        onBlur={commit}
        onKeyDown={e=>{
          if(e.key==='Enter')e.target.blur();
          else if(e.key==='Escape'){cancelRef.current=true;e.target.blur();}
        }}/>
      {unit&&<span style={NUM_UNIT_STYLE}>{unit}</span>}
    </span>
  );
};

// Every FeelSlider carries Field's number box (NumBox) beside its label, as CHASSIS does, so any
// slider can be typed. `box` configures it: `unit`, and `value`/`onCommit`/`min`/`max`/`dp`
// overrides where the stored field isn't the slider's (Target Speed, displayed inverted and in mph
// or km/h; POWER SPLIT, centred on 50). `readout` is secondary text to the left of the box.
const FeelSlider=({label,value,onChange,min,max,step=1,leftLabel,rightLabel,readout=null,locked=false,hint=null,markers=null,box={},noSlider=false,hintTerm=null})=>{
  const pct=((value-min)/(max-min))*100;
  const bg=`linear-gradient(to right,#e2e8f0 ${pct}%,#1e293b ${pct}%)`;
  const wrapRef=useRef(null);
  const valRef=useRef(value);
  useLayoutEffect(()=>{valRef.current=value;},[value]);
  const lockRef=useRef(locked); lockRef.current=locked;
  const onChangeRef=useRef(onChange); useLayoutEffect(()=>{onChangeRef.current=onChange;},[onChange]);
  const dp=Math.min(6,(String(step).split('.')[1]||'').length);
  useEffect(()=>{
    const onWheel=e=>{
      if(document.activeElement!==wrapRef.current&&!wrapRef.current?.contains(document.activeElement))return;
      e.preventDefault();
      e.stopPropagation();
      if(lockRef.current)return;
      const dir=e.deltaY<0?1:-1;
      const next=Math.max(min,Math.min(max,valRef.current+dir*step));
      const snapped=Math.round(next/step)*step;
      onChangeRef.current(parseFloat(snapped.toFixed(6)));
    };
    const w=wrapRef.current;
    w&&w.addEventListener('wheel',onWheel,{passive:false});
    return()=>{w&&w.removeEventListener('wheel',onWheel);};
  },[min,max,step]);
  return(
    <div ref={wrapRef} style={{marginBottom:markers&&markers.some(m=>m.label)?18:10,opacity:locked?0.38:1,transition:'opacity .15s'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
        <span style={{fontSize:12,color:'#9ca3af',minWidth:0,overflow:'hidden',
                      textOverflow:'ellipsis',whiteSpace:'nowrap',marginRight:6}}>{label}{hint&&<Hint text={hint} term={hintTerm}/>}</span>
        <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
          {locked&&<span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>MANUAL</span>}
          {readout&&(typeof readout==='string'
            ?<span style={{fontSize:11,color:'#9ca3af',fontFamily:'var(--font-mono)',whiteSpace:'nowrap'}}>{readout}</span>
            :readout)}
          <NumBox value={box.value??value} onCommit={box.onCommit??onChange}
            min={box.min??min} max={box.max??max} dp={box.dp??dp} unit={box.unit}
            disabled={locked} label={typeof label==='string'&&label?label:undefined}/>
        </div>
      </div>
      {!noSlider&&<><div style={{position:'relative'}}>
        <input type="range" className="sli" min={min} max={max} step={step} value={value}
          style={{background:bg,cursor:locked?'not-allowed':'pointer',pointerEvents:locked?'none':'auto'}}
          onChange={e=>!locked&&onChange(parseFloat(e.target.value))}/>
        {markers&&markers.map(m=>{
          const pct=(m.value-min)/(max-min);
          const left=`calc(${pct*100}% + ${(0.5-pct)*14}px)`;
          const active=m.lessThan?value<m.value:value>=m.value;
          return(
            <div key={m.value} style={{position:'absolute',left,top:'50%',
                transform:'translate(-50%,-50%)',pointerEvents:'none',
                display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
              <div style={{width:1.5,height:8,borderRadius:1,
                           background:active?m.color:'#1e293b',
                           transition:'background .15s'}}/>
              {m.label&&<span style={{fontSize:10,color:active?m.color:'#94a3b8',
                                      letterSpacing:0.5,whiteSpace:'nowrap',
                                      transition:'color .15s',marginTop:2}}>
                {m.label}
              </span>}
            </div>
          );
        })}
      </div>
      <div style={{display:'flex',justifyContent:'space-between',marginTop:4}}>
        <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>{leftLabel}</span>
        <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>{rightLabel}</span>
      </div></>}
    </div>
  );
};

// ── VISUALS: ride · roll · damping tracks ──────────────────────────────────
// Replaced SpringDial / ArbDial / DampingDial (three 120px arc dials whose values showed only
// on hover). Everything here is a straight track in the DYNAMICS / SAG chart frame: front and
// rear share one scale per quantity, so they are compared by position, and every value is
// printed. Colours follow the SAG chart's COL_F / COL_R.
const VIS_COL_F='#60a5fa',VIS_COL_R='#fb923c';
const VIS_W=280,VIS_TX0=16,VIS_TX1=218; // track spans x 16..218; values right-aligned at 280
const VIS_MONO='JetBrains Mono, monospace';

// Ghost positions: where the DERIVED axle (the one the ride ref isn't) would sit for this
// component's own F/R split to carry a given rear roll-stiffness fraction. `sqrt` is true for
// springs (roll stiffness ∝ Hz², so Hz scales by √ratio) and false for ARBs (∝ clicks). These are
// the same formulas the old dials' ghost rings used, unchanged.
const visGhost=(frac,{vF,vR,rsF,rsR,rideRef,sqrt,lo,hi})=>{
  if(frac==null||rsF<=0||rsR<=0)return null;
  const f=Math.max(0.05,Math.min(0.95,frac));
  const k=rideRef==='rear'?((1-f)/f*rsR)/rsF:(f/(1-f)*rsF)/rsR;
  const v=(rideRef==='rear'?vF:vR)*(sqrt?Math.sqrt(k):k);
  return(v>=lo&&v<=hi)?v:null;
};

// One quantity, two rows (F, R) on a shared zone-tinted track. `bands` is [[from,to,colour]…];
// `rows` items: {v, v2?, text, warn, ghosts:[{v,col}]}. v2 draws a second, hollow marker joined
// to v by a bar — the damper rows use it for bump (hollow) against rebound (filled).
const VisTrack=({title,summary,summaryWarn,lo,hi,bands,rows,hint,hintTerm=null})=>{
  const RY=[7,21],H=bands.some(b=>b[3])?36:28;
  const x=v=>VIS_TX0+(Math.min(Math.max(v,lo),hi)-lo)/(hi-lo)*(VIS_TX1-VIS_TX0);
  return(
    <div>
      <div style={{display:'flex',alignItems:'center',gap:6,fontFamily:'var(--font-mono)',fontSize:9,marginBottom:1}}>
        <span style={{color:'#64748b',letterSpacing:1.5}}>{title}</span>
        {hint&&<Hint text={hint} term={hintTerm}/>}
        <span style={{marginLeft:'auto',color:summaryWarn?'#f59e0b':'#cbd5e1'}}>{summary}</span>
      </div>
      <svg viewBox={`0 0 ${VIS_W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
        {rows.map((r,i)=>{
          const y=RY[i],col=i?VIS_COL_R:VIS_COL_F;
          return(<g key={i}>
            <rect x={VIS_TX0} y={y-2} width={VIS_TX1-VIS_TX0} height={4} fill="#1e293b"/>
            {bands.map(([a,b,c],j)=><rect key={j} x={x(a)} y={y-2} width={Math.max(0,x(b)-x(a))} height={4} fill={c} opacity={0.28}/>)}
            <text x={0} y={y+3} fontSize={9} fill={col} fontFamily={VIS_MONO}>{i?'R':'F'}</text>
            {(r.ghosts||[]).map((g,j)=>g.v==null?null:
              <circle key={j} cx={x(g.v)} cy={y} r={3.6} fill="none" stroke={g.col} strokeWidth={1.3} opacity={0.85}/>)}
            {r.v2!=null&&<>
              <line x1={x(r.v2)} y1={y} x2={x(r.v)} y2={y} stroke={r.crossed?'#f59e0b':col} strokeWidth={2} opacity={0.7}/>
              <circle cx={x(r.v2)} cy={y} r={3.4} fill="#0a0f1a" stroke={r.crossed?'#f59e0b':col} strokeWidth={1.4}/>
            </>}
            <circle cx={x(r.v)} cy={y} r={4} fill={r.warn?'#f59e0b':col} stroke="#0a0f1a" strokeWidth={1}/>
            <text x={VIS_W} y={y+3} textAnchor="end" fontSize={9} fill={r.warn?'#f59e0b':'#e2e8f0'} fontFamily={VIS_MONO}>{r.text}</text>
          </g>);
        })}
        {bands.map(([a,b,c,lbl],j)=>lbl&&x(b)-x(a)>=24?
          <text key={j} x={(x(a)+x(b))/2} y={H-1} textAnchor="middle" fontSize={6.5} fill="#64748b" fontFamily={VIS_MONO} letterSpacing={0.5}>{lbl}</text>:null)}
      </svg>
    </div>
  );
};

// The card's headline: the whole car's F/R roll-stiffness split in the display space the MECH
// BALANCE strip uses (`mechBalance` = rear fraction as the game shows it), so its divide lands
// exactly where that strip's CUR does and the NAT / TGT ticks mean the same thing on both.
// Each end is then shaded springs vs ARBs by that axle's own model-space stiffnesses — a share
// OF that end, not a second balance, so the two spaces never get compared with each other.
const VisRollSplit=({mechBal,natBal,target,rsSpF,rsAbF,rsSpR,rsAbR,rollDeg,rollClamped,rollTarget,arbShare})=>{
  const H=30,Y=4,BH=10,x=v=>Math.min(1,Math.max(0,v))*VIS_W;
  const rear=Math.min(1,Math.max(0,mechBal)),divX=x(1-rear);
  const spFracF=rsSpF+rsAbF>0?rsSpF/(rsSpF+rsAbF):1,spFracR=rsSpR+rsAbR>0?rsSpR/(rsSpR+rsAbR):1;
  // Springs sit at the outer ends, ARBs toward the divide, so the ARB contribution reads as
  // the part that moves the divide.
  const fSpW=divX*spFracF,rSpW=(VIS_W-divX)*spFracR;
  const tick=(v,col,w,key)=>v==null?null:<line key={key} x1={x(1-v)} y1={Y-3} x2={x(1-v)} y2={Y+BH+3} stroke={col} strokeWidth={w}/>;
  const showTgt=target!=null&&(natBal==null||Math.abs(target-natBal)>=0.005);
  return(
    <div>
      <div style={{display:'flex',alignItems:'center',gap:6,fontFamily:'var(--font-mono)',fontSize:9,marginBottom:1}}>
        <span style={{color:'#64748b',letterSpacing:1.5}}>ROLL SPLIT</span>
        <Hint text="The car's front/rear share of roll stiffness: solid = springs, light = ARBs, grey tick = natural balance. Divide right of grey = more front stiffness (toward understeer), left = toward oversteer." term="ride-roll-damping"/>
        <span style={{marginLeft:'auto',color:'#cbd5e1'}}>F {Math.round((1-rear)*100)} · R {Math.round(rear*100)}</span>
      </div>
      <svg viewBox={`0 0 ${VIS_W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
        <rect x={0} y={Y} width={fSpW} height={BH} fill={VIS_COL_F} opacity={0.85}/>
        <rect x={fSpW} y={Y} width={divX-fSpW} height={BH} fill={VIS_COL_F} opacity={0.35}/>
        <rect x={divX} y={Y} width={VIS_W-divX-rSpW} height={BH} fill={VIS_COL_R} opacity={0.35}/>
        <rect x={VIS_W-rSpW} y={Y} width={rSpW} height={BH} fill={VIS_COL_R} opacity={0.85}/>
        <line x1={divX} y1={Y-1} x2={divX} y2={Y+BH+1} stroke="#0a0f1a" strokeWidth={1.5}/>
        {tick(natBal,'#94a3b8',1.2,'nat')}
        {showTgt&&tick(target,'#4ade80',1.8,'tgt')}
        <text x={0} y={H-1} fontSize={8} fill={rollClamped?'#f59e0b':'#94a3b8'} fontFamily={VIS_MONO}>roll {rollDeg.toFixed(2)}°{rollTarget!=null&&<tspan fill="#64748b"> / {rollTarget.toFixed(2)}</tspan>}</text>
        <text x={VIS_W/2} y={H-1} textAnchor="middle" fontSize={8} fontFamily={VIS_MONO}>
          <tspan fill="#94a3b8">nat</tspan><tspan fill="#64748b"> {natBal!=null?natBal.toFixed(2):'—'}</tspan>
          {showTgt&&<><tspan fill="#4ade80">  tgt</tspan><tspan fill="#64748b"> {target.toFixed(2)}</tspan></>}
        </text>
        <text x={VIS_W} y={H-1} textAnchor="end" fontSize={8} fill="#94a3b8" fontFamily={VIS_MONO}>
          spr {Math.round(100-arbShare)} · arb {Math.round(arbShare)}%</text>
      </svg>
    </div>
  );
};

// `arbLimit` is the ARB track's full scale. In the Forza modes that's the game's click
// ceiling, which is what makes the 50/75/90% bands and the amber >88% warning meaningful.
// Physical modes have no ceiling, so the caller passes a dynamic scale and sets `physical` —
// the track then reads purely as an F/R comparison, and the bands, which would otherwise imply
// a limit that doesn't exist, are suppressed. `dispF`/`dispR` carry the N/m the ARB card
// prints in physical mode, so the printed value can't contradict what you'd type in.
const VisSuspTracks=({tune,physics,natBal,target,arbLimit,physical,dispF,dispR,hzClamped})=>{
  const{fHz,rHz,rsSpF,rsSpR,rsAbF,rsAbR,arbF,arbR}=tune;
  const ref=physics.rideRef;
  const ghostSet=(o,tol)=>{
    const n=visGhost(natBal,o),t=visGhost(target,o);
    return[{v:n,col:'#94a3b8'},{v:t!=null&&(n==null||Math.abs(t-n)>tol)?t:null,col:'#4ade80'}];
  };
  const hzO={vF:fHz,vR:rHz,rsF:rsSpF,rsR:rsSpR,rideRef:ref,sqrt:true,lo:HZ_MIN,hi:HZ_MAX};
  const abO={vF:arbF,vR:arbR,rsF:rsAbF,rsR:rsAbR,rideRef:ref,sqrt:false,lo:0,hi:arbLimit};
  const hzG=ghostSet(hzO,0.03),abG=ghostSet(abO,arbLimit*0.02);
  const derivedR=ref!=='rear';
  const warnF=!physical&&arbF>arbLimit*0.88,warnR=!physical&&arbR>arbLimit*0.88;
  const Lim=arbLimit;
  const zF=physics.zetaF,zR=physics.zetaR,bF=physics.bumpZetaF,bR=physics.bumpZetaR;
  const pctBR=(b,r)=>r>0?Math.round(b/r*100):0;
  const crossF=bF>zF,crossR=bR>zR;
  const HZ_ZONES=[[HZ_MIN,HZ_BANDS[0],HZ_BAND_COLS[0],'SOFT'],[HZ_BANDS[0],HZ_BANDS[1],HZ_BAND_COLS[1],'ROAD'],
                  [HZ_BANDS[1],HZ_BANDS[2],HZ_BAND_COLS[2],'FIRM'],[HZ_BANDS[2],HZ_MAX,HZ_BAND_COLS[3],'RACE']];
  const ZETA_ZONES=[[10,40,'#60a5fa','UNDER'],[40,70,'#22c55e','→BW'],[70,100,'#f59e0b','BWORTH+'],[100,200,'#ef4444','OVER']];
  const ARB_ZONES=physical?[]:[[Lim*0.5,Lim*0.75,'#f59e0b'],[Lim*0.75,Lim*0.9,'#f97316'],[Lim*0.9,Lim,'#ef4444']];
  const fmtArb=(v,d)=>physical?Math.round(d??v).toString():v.toFixed(1);
  return(
    <div style={{display:'flex',flexDirection:'column',gap:7}}>
      <VisTrack title="RIDE Hz" lo={HZ_MIN} hi={HZ_MAX} bands={HZ_ZONES}
        summary={fHz>0?`R/F ×${(rHz/fHz).toFixed(2)}`:'—'} summaryWarn={hzClamped}
        hint={`Front and rear ride frequency on one SOFT→RACE scale (${HZ_MIN}–${HZ_MAX} Hz). Amber = an axle's Hz hit a limit.`}
        rows={[
          {v:fHz,text:fHz.toFixed(2),ghosts:derivedR?[]:hzG},
          {v:rHz,text:rHz.toFixed(2),warn:hzClamped,ghosts:derivedR?hzG:[]},
        ]} hintTerm="ride-roll-damping"/>
      <VisTrack title="ARB" lo={0} hi={Lim} bands={ARB_ZONES}
        summary={physical?'N/m':`of ${Lim}`} summaryWarn={warnF||warnR}
        hint={physical?"Front and rear bar stiffness in N/m on one shared scale. BeamNG has no ceiling, so there are no warning bands."
          :"Front and rear ARB clicks from 0 to the game's ceiling. Bands mark 50 / 75 / 90% of it; a dot turns amber past 88%."}
        rows={[
          {v:arbF,text:fmtArb(arbF,dispF),warn:warnF,ghosts:derivedR?[]:abG},
          {v:arbR,text:fmtArb(arbR,dispR),warn:warnR,ghosts:derivedR?abG:[]},
        ]} hintTerm="ride-roll-damping"/>
      <VisTrack title="DAMPING ζ" lo={10} hi={200} bands={ZETA_ZONES}
        summary={`B/R ${pctBR(bF,zF)}% · ${pctBR(bR,zR)}%`} summaryWarn={crossF||crossR}
        hint="Rebound (filled dot) and bump (hollow dot) damping ratio per axle, 10–200%. Bump normally sits below rebound; the bar turns amber if it crosses above."
        rows={[
          {v:zF,v2:bF,crossed:crossF,text:`${Math.round(bF)}/${Math.round(zF)}`},
          {v:zR,v2:bR,crossed:crossR,text:`${Math.round(bR)}/${Math.round(zR)}`},
        ]} hintTerm="ride-roll-damping"/>
    </div>
  );
};


const Toggle=({label,value,onChange,options,hint,hintTerm=null})=>(
  <div style={{marginBottom:9}}>
    {label&&<span style={{fontSize:12,color:'#9ca3af',display:'flex',alignItems:'center',gap:4,marginBottom:3}}>{label}{hint&&<Hint text={hint} term={hintTerm}/>}</span>}
    <div style={{display:'flex',gap:3}}>
      {options.map(o=><button key={o.value} className={`tog${value===o.value?' on':''}`}
        onClick={()=>onChange(o.value)}>{o.label}</button>)}
    </div>
  </div>
);

const Sec=({title,open,onToggle,onReset,children})=>{
  const[pending,setPending]=useState(false);
  const timer=useRef(null);
  const handleReset=e=>{
    e.stopPropagation();
    if(pending){clearTimeout(timer.current);setPending(false);onReset();}
    else{setPending(true);timer.current=setTimeout(()=>setPending(false),2000);}
  };
  useEffect(()=>()=>clearTimeout(timer.current),[]);
  // The header is a div (not a <button>) because RESET needs to be a real,
  // independently focusable <button> nested inside it — buttons can't nest
  // inside buttons in valid HTML. role="button"+tabIndex+onKeyDown restores
  // the same Enter/Space keyboard activation a native button gets for free.
  return(
    <div style={{borderBottom:'1px solid #0f172a',marginBottom:8}}>
      <div className={`stog${open?' stog-open':''}`} role="button" tabIndex={0}
           onClick={onToggle}
           onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onToggle();}}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:2,height:10,borderRadius:1,flexShrink:0,
                       background:open?'#e2e8f0':'#1e293b',transition:'background .12s'}}/>
          <span>{title}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          {onReset&&<button type="button"
            onClick={handleReset}
            title={pending?'Click again to confirm':'Reset to defaults'}
            style={{fontSize:10,color:pending?'#f59e0b':'#94a3b8',padding:'1px 5px',borderRadius:2,
                    background:'none',fontFamily:'inherit',
                    border:`1px solid ${pending?'#f59e0b44':'#1e293b'}`,lineHeight:1.4,cursor:'pointer',
                    transition:'color .12s,border-color .12s',userSelect:'none'}}>
            {pending?'SURE?':'RESET'}
          </button>}
          <span style={{fontSize:11,color:open?'#e2e8f0':'#94a3b8',transition:'color .12s'}}>
            {open?'▲':'▼'}
          </span>
        </div>
      </div>
      {open&&<div style={{padding:'8px 12px 10px'}}>{children}</div>}
    </div>
  );
};

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:1}}>
      <div className="rl">{label}</div>
      {ctx&&<span style={{fontSize:10,color:ctx[1],letterSpacing:1,
                          background:ctx[1]+'18',border:`1px solid ${ctx[1]}44`,
                          borderRadius:2,padding:'1px 4px',lineHeight:1.4}}>
        {ctx[0]}
      </span>}
    </div>
    <div style={{display:'flex',alignItems:'baseline',gap:3}}>
      <span className={primary?'rv-lg':'rv'} style={{color:warn?'#f59e0b':'#e2e8f0'}}>
        {typeof value==='number'?value.toFixed(decimals):value}
      </span>
      {unit&&<span className="ru" style={{marginTop:0}}>{unit}</span>}

// ── Output rows ─────────────────────────────────────────────────────────────
// The output panel is a "read it, type it into the game" checklist, so each value
// gets one full-width line rather than a bordered mini-card (Readout, still used by
// Tune Check and the sidebar). Label left, optional mono meta in the middle, value
// hard right — which is where the eye lands when transcribing into a tuning menu.
// Deliberately no per-value hint icon and no boxed context badge: section-level
// hints live on Card, and ctx reads as inline text here instead.
const OutRow=({label,meta=[],value,unit,decimals=1,warn=false,note=null,noteColor='#f59e0b'})=>(
  <div style={{display:'flex',alignItems:'baseline',gap:10,padding:'7px 10px'}}>
    <span style={{fontSize:11,color:'#cbd5e1',letterSpacing:0.5,flexShrink:0}}>{label}</span>
    {(Array.isArray(meta)?meta:[meta]).filter(Boolean).map((m,i)=>(
      <span key={i} style={{fontSize:10,color:'#64748b',fontFamily:'var(--font-mono)',
                            whiteSpace:'nowrap'}}>{m}</span>
    ))}
    <span style={{flex:1,minWidth:8}}/>
    {note&&<span style={{fontSize:10,color:noteColor,whiteSpace:'nowrap'}}>{note}</span>}
    <span style={{fontFamily:'var(--font-mono)',fontSize:15,fontWeight:700,
                  color:warn?'#f59e0b':'#e2e8f0',whiteSpace:'nowrap'}}>
      {typeof value==='number'?value.toFixed(decimals):value}
    </span>
    {unit&&<span style={{fontSize:10,color:'#64748b',whiteSpace:'nowrap'}}>{unit}</span>}
  </div>
);
// Bordered wrapper grouping related OutRows (Camber F+R, Toe F+R, …), mirroring the
// nested boxes in the wireframe. No internal dividers — the grouping is the signal.
// Background matches the DIFFERENTIAL card's RECOMMENDED / CENTER SPLIT call-outs so
// every boxed element in the output panel sits on one surface colour.
const RowGroup=({children,style})=>(
  <div style={{border:'1px solid #1e293b',borderRadius:2,marginBottom:5,
               background:'#0f172a',...style}}>{children}</div>
);

const Stat=({label,value,unit,decimals=2})=>(
  <div className="sr">
    <span className="sl">{label}</span>
    <span className="sv">{typeof value==='number'?value.toFixed(decimals):value}
      <span className="su">{unit}</span></span>

// ── BeamNG output cards ─────────────────────────────────────────────────────
// physMode-only presentational shells for the two-column output layout (see
// docs/CODE_MAP.md). All three take pre-computed OutRow prop objects/elements —
// the row math itself still comes from the same arbOut/springOut/dampOut/diffCtx
// functions the Forza cards above use, just assembled differently: one card per
// axle instead of one card per subsystem (ARB+Spring+Damper merge into
// SuspensionCard; Caster is front-only on AlignCard, matching BeamNG's actual
// menu — there is no rear caster slider).
const SuspensionCard=({side,arbRow,springRow,dampRebRow,dampBumpRow,arbCaveat,hint,hintTerm=null})=>(
  <Card title={`${side} SUSPENSION`} accent hint={hint} hintTerm={hintTerm}>
    <RowGroup><OutRow {...arbRow}/></RowGroup>
    {arbCaveat&&<div style={{fontSize:10,color:'#f59e0b',lineHeight:1.6,margin:'-2px 0 6px'}}>{arbCaveat}</div>}
    <RowGroup><OutRow {...springRow}/></RowGroup>
    <RowGroup style={{marginBottom:0}}>
      <OutRow {...dampRebRow}/>
      <OutRow {...dampBumpRow}/>
    </RowGroup>
  </Card>
);
const AlignCard=({side,camber,toe,caster,hint,hintTerm=null})=>(
  <Card title={`${side} ALIGNMENT`} hint={hint} hintTerm={hintTerm}>
    <RowGroup><OutRow label="Camber" value={camber} unit="°"/></RowGroup>
    <RowGroup style={caster==null?{marginBottom:0}:{}}><OutRow label="Toe" value={toe} unit="°"/></RowGroup>
    {caster!=null&&<RowGroup style={{marginBottom:0}}><OutRow label="Caster" value={caster} unit="°"/></RowGroup>}
  </Card>
);
const DiffCard=({title,rows})=>(
  <Card title={title}><RowGroup style={{marginBottom:0}}>{rows}</RowGroup></Card>
);

// scale: the value at which the bar fills its half. dead: below this it reads as nothing. The
// defaults are the BEG/INT points; PhaseVerdict passes grip-margin percent figures. muted greys a
// row that is context rather than something to tune (PRO's PITCH).
const BiasSeg=({label,val,hint,primary,totalAbs,scale=15,dead=0.5,muted,hintTerm=null})=>{
  // positive = oversteer (red/right), negative = understeer (blue/left)
  const c=muted?'#64748b':val>dead?'#ef4444':val<-dead?'#3b82f6':'#cbd5e1';
  const pct=Math.min(50,Math.abs(val)/scale*50);
  const barStyle=val>=0?{left:'50%',width:`${pct}%`}:{right:'50%',width:`${pct}%`};
  const pctOfTotal=totalAbs>dead?Math.round(Math.abs(val)/totalAbs*100):null;
  return(
    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3,
                 ...(primary?{background:'#0a0f1a',borderLeft:'2px solid '+(val>0?'#ef444466':'#3b82f666'),
                               borderRadius:2,padding:'3px 0 3px 4px',margin:'0 -2px 3px -4px'}:{})}}>
      <div style={{width:80,display:'flex',alignItems:'center',gap:2,flexShrink:0}}>
        <span style={{fontSize:10,color:primary?'#cbd5e1':'#94a3b8',letterSpacing:1,lineHeight:1.2,
                       whiteSpace:'nowrap',fontWeight:primary?700:400}}>{label}</span>
        {hint&&<Hint text={hint} term={hintTerm}/>}
      </div>
      <div style={{flex:1,position:'relative',height:8,background:'#0f172a',borderRadius:2}}>
        <div style={{position:'absolute',left:'50%',top:0,bottom:0,width:1,background:'#1e293b'}}/>
        {Math.abs(val)>dead&&<div style={{position:'absolute',top:1,bottom:1,borderRadius:1,
          background:c+(primary?'ee':'99'),...barStyle}}/>}
      </div>
      <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:c,width:34,textAlign:'right',flexShrink:0,
                     fontWeight:primary?700:400}}>
        {val>=0?'+':''}{val.toFixed(1)}
      </span>
      <span style={{fontSize:10,color:pctOfTotal>40?c:'#475569',width:28,textAlign:'right',flexShrink:0}}>
        {pctOfTotal!=null?`${pctOfTotal}%`:''}
      </span>
    </div>
  );
};

// Why a MECH/CO-SOLVE balance target was missed, and what would reach it — the text after
// "achieved x" in both mechBalClamped warnings (ARB card and the warnings list). The split misses
// in one of two ways: the bar on the side the target leans away from is on its floor and the
// springs alone already carry too much of that end's roll stiffness, or the bar on the other side
// is on its click ceiling. More bar budget cures the first and not the second; spring balance
// cures both. MECH on AUTO grows its own budget (computeTune) up to half the roll stiffness, so a
// miss there already means the springs are the lever. arbLim is null in physical modes (no ceiling).
const mechReachNote=({tune,target,arbMode,arbBalMode,springShareAuto,arbLim})=>{
  const tooRear=tune.mechBalance>target;
  const far=tooRear?'rear':'front',near=tooRear?'front':'rear';
  const atCeil=arbLim!=null&&(tooRear?tune.arbF:tune.arbR)>=arbLim-0.05;
  const cause=atCeil
    ?` The ${near} bar is at its ${arbLim}-click ceiling.`
    :` The ${far} bar is at its floor and the ${far} springs alone carry too much roll stiffness for the target.`;
  const springs=arbBalMode==='coSolve'
    ?(springShareAuto?' Disable AUTO Spring Share and raise it.'
                     :' Raise Spring Share.')
    :` ${tooRear?'Soften':'Stiffen'} the rear springs relative to the front (RIDE multiplier), or set Hz MODE to MECH.`;
  const budget=atCeil?''
    :arbMode==='roll'?' Or lower Target Roll Angle for a bigger bar budget.'
    :arbMode==='share'?' Or raise ARB Share % for a bigger bar budget.'
    :arbMode==='basic'?' Or raise ARB Stiffness for a bigger bar budget.'
    :'';

const HandlingVerdict=({total,bChassis,bSp,bAb,bDiffAccel,bDiffDecel,bDiffFront,bDiffRear,diffLayout,bBrakeEntry,bDampBias,gripBalance,uiMode})=>{
  const abs=Math.abs(total);
  // positive = oversteer, negative = understeer
  const label=abs<3?'NEUTRAL':total>0?'OVERSTEER':'UNDERSTEER';
  const col=abs<3?'#e2e8f0':total>0?'#ef4444':'#3b82f6';
  const isAWD=diffLayout==='AWD';
  const contributors=[
    {name:'chassis',val:bChassis??0},
    {name:'springs',val:bSp??0},{name:'ARB',val:bAb??0},
    ...(isAWD
      ?[{name:'diff front',val:bDiffFront??0},{name:'diff rear',val:bDiffRear??0}]
      :[{name:'diff exit',val:bDiffAccel??0},{name:'diff entry',val:bDiffDecel??0}]),
    {name:'brakes',val:bBrakeEntry??0},{name:'damping',val:bDampBias??0}
  ];
  const totalAbs=contributors.reduce((s,c)=>s+Math.abs(c.val),0);
  // Sort by magnitude so dominant driver appears first
  const sorted=[...contributors].sort((a,b)=>Math.abs(b.val)-Math.abs(a.val));
  const dom=sorted[0];
  const domBig=Math.abs(dom.val)>2;
  // Actionable tip per dominant contributor. Only BEG and INT reach this panel (PRO renders
  // PhaseVerdict), so every tip names a control those tiers can see: BEG has one Balance slider
  // for all of the springs/bars/damping split and no diff sliders, INT has ARB Bias, the RIDE
  // multiplier, Damping Bias and the diff EXIT/ENTRY sliders. Directions follow each slider's own
  // end labels, which are laid out so right always leans oversteer.
  const beg=uiMode==='beginner';
  const os=total>0;
  const begBal=os?'Move Balance toward UNDERSTEER to counter it.':'Move Balance toward OVERSTEER to counter it.';
  const begDiff='At BEG the diff lock is set by Build and Layout, not tuned directly.';
  const domTips={
    chassis:   os?'The car itself leans toward oversteer before any tuning. Move the balance toward the front to counter it.'
                 :'The car itself leans toward understeer before any tuning. Move the balance toward the rear to counter it.',
    springs:   beg?(os?'The rear springs are stiff for the weight they carry. ':'The front springs are stiff for the weight they carry. ')+begBal
                  :(os?'Rear springs are stiff for their load. Lower the rear Hz relative to the front (RIDE multiplier), or move ARB Bias toward FRONT HEAVY.'
                      :'Front springs are stiff for their load. Raise the rear Hz relative to the front (RIDE multiplier), or move ARB Bias toward REAR HEAVY.'),
    ARB:       beg?(os?'The rear bar carries more than its share. ':'The front bar carries more than its share. ')+begBal
                  :(os?'Move ARB Bias toward FRONT HEAVY (in MAN, raise ARB F relative to ARB R).'
                      :'Move ARB Bias toward REAR HEAVY (in MAN, raise ARB R relative to ARB F).'),
    'diff exit':  beg?begDiff:(os?'Move EXIT toward GRIP — less lock on throttle calms exit rotation.':'Move EXIT toward ROTATE to add rotation under power.'),
    'diff entry': beg?begDiff:(os?'Move ENTRY toward STABLE — more decel lock resists lift-off rotation.':'Move ENTRY toward LOOSE to allow freer rotation on entry.'),
    'diff front': beg?begDiff:(os?'Move the FRONT AXLE EXIT toward PUSH — more front lock pulls the nose out of the corner.':'Move the FRONT AXLE EXIT toward NEUTRAL to free the front on throttle.'),
    'diff rear':  beg?begDiff:(os?'Move the REAR AXLE EXIT toward GRIP, or ENTRY toward STABLE.':'Move the REAR AXLE EXIT toward ROTATE to add rotation under power.'),
    brakes:    (bBrakeEntry??0)>0?'The BRAKES card\'s brake bias sits below 50% front, which this bar reads as oversteer. It is computed for this car, not a setting to chase.'
                 :'The BRAKES card\'s brake bias sits above 50% front, which this bar reads as understeer. It is computed for this car, not a setting to chase.',
    damping:   beg?begBal
                  :(os?'Move Damping Bias toward FRONT — firmer front damping resists weight transfer off the front.'
                      :'Move Damping Bias toward REAR to let the front take weight more freely.'),
  };
  const tip=abs<3
    ? 'Setup is well balanced.'+(domBig?' Keep an eye on '+dom.name.toUpperCase()+' if the car feels inconsistent.':'')
    : (domBig?(domTips[dom.name]||'Adjust the dominant contributor.'):(beg?'Adjust the Balance slider.':'Adjust ARB Bias.'));
  const hints={
    chassis:'The car\'s own lean at the limit, before any tuning. − = toward understeer, + = toward oversteer.',
    springs:'The front/rear spring split compared with the weight split. + = rear springs relatively stiffer (toward oversteer), − = front stiffer (toward understeer).',
    ARB:'The front/rear anti-roll bar split compared with the weight split. + = rear bars relatively stiffer (toward oversteer), − = front stiffer (toward understeer).',
    'diff front':'Front diff lock, on and off throttle combined. More front lock = toward understeer (−).',
    'diff rear':'Rear diff lock, on and off throttle combined. On-throttle lock pushes toward oversteer (+), off-throttle lock toward understeer (−).',
    'diff exit':diffLayout==='FWD'?'Front accel lock on-throttle exit. Higher lock = more understeer (−).':'Rear accel lock on-throttle exit. Higher lock = more oversteer (+).',
    'diff entry':diffLayout==='FWD'?'Front decel lock off-throttle entry. Higher lock = more entry understeer (−).':'Rear decel lock off-throttle entry. Higher lock resists lift-off oversteer, pushing understeer (−).',
    brakes:'The computed brake bias measured against 50/50. Above 50% front reads as entry understeer (−), below as oversteer (+).',
    damping:'The front/rear damping split. Firmer front = toward understeer (−), firmer rear = toward oversteer (+).',
  };
  // Glossary entry per contributor row, keyed like `hints`: the tooltip's TERMS link.
  const hintTerms={chassis:'balance-contributors',springs:'balance-contributors',ARB:'balance-contributors','diff front':'accel-lock','diff rear':'accel-lock','diff exit':'accel-lock','diff entry':'decel-lock',brakes:'brake-balance',damping:'balance-contributors'};
  const labelMap={chassis:'CHASSIS','diff front':'DIFF F','diff rear':'DIFF R','diff exit':'DIFF EXIT','diff entry':'DIFF ENTRY','brakes':'BRAKES','damping':'DAMP'};
  const MECH=['chassis','springs','ARB'];
  const mechGroup=contributors.filter(c=>MECH.includes(c.name));
  const dynGroup=contributors.filter(c=>!MECH.includes(c.name));

    <div style={{marginBottom:6}}>
      <div style={{fontSize:9,color:'#475569',letterSpacing:2,marginBottom:3,paddingBottom:2,
                   borderBottom:'1px solid #0f172a'}}>{title}</div>

      })}

  );
  return(
    <div>
      {/* tip first — most actionable info at the top */}
      <div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6,padding:'6px 8px',marginBottom:8,
                   background:'#020617',borderRadius:2,border:'1px solid #0f172a'}}>{tip} <TermLink id="handling-verdict"/></div>
      {/* contributors grouped: MECHANICAL (intentional setup) vs DYNAMIC (phase/behaviour) */}
      {/* Called, not rendered as <GroupSection/>: a component defined in this body is a new type
          every render, so each App render would remount the rows and their ⓘ, closing an open
          tooltip and dropping the glossary's return focus. */}
      {GroupSection({title:'MECHANICAL',items:mechGroup})}
      {GroupSection({title:'DYNAMIC',items:dynGroup})}
      <div style={{fontSize:10,color:'#475569',lineHeight:1.5,marginTop:4}}>
        Alignment is not counted, though it also affects balance.
      </div>
    </div>
  );
};

const PHASE_NEUTRAL=1;   // ±% grip margin that reads NEUTRAL — PRO's counterpart of the ±3-point band

const PhaseVerdict=({phase,diffLayout,bDiffAccel,bDiffDecel,bDampBias,brakeBias,gripBalance})=>{
  const{mid,entry,exit}=phase;
  const isAWD=diffLayout==='AWD';
  const tips=[];
  if(Math.abs(mid.total)>=PHASE_NEUTRAL){
    const os=mid.total>0;
    const dom=[['chassis',mid.chas],['springs',mid.sp],['ARB',mid.ab]].filter(([,v])=>Math.sign(v)===Math.sign(mid.total))
      .sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))[0]?.[0]??'chassis';
    tips.push({chassis:os?'Mid-corner: the chassis itself leans toward oversteer. Counter it with more front roll stiffness, or narrow a front-favouring tyre stagger.'
                          :'Mid-corner: the chassis itself leans toward understeer. Counter it with more rear roll stiffness, or narrow a rear-favouring tyre stagger.',
               springs:os?'Mid-corner oversteer, mostly from the springs. Lower the Mech Balance Target, or use CO-SOLVE.':'Mid-corner understeer, mostly from the springs. Raise the Mech Balance Target, or use CO-SOLVE.',
               ARB:os?'Mid-corner oversteer, mostly from the bars. Lower the Mech Balance Target or move ARB Bias toward the front.':'Mid-corner understeer, mostly from the bars. Raise the Mech Balance Target or move ARB Bias toward the rear.'}[dom]);
  }
  if(Math.abs(entry.brk)>=PHASE_NEUTRAL)
    tips.push(entry.brk>0
      ?`Entry: brake bias ${brakeBias}% sits behind the entry-load ideal (≈${Math.round(entry.idealBias)}%), so the rear brakes more than its share.`
      :`Entry: brake bias ${brakeBias}% sits forward of the entry-load ideal (≈${Math.round(entry.idealBias)}%). The BRAKES card counts more weight transfer, so it usually reads this way.`);
  if(Math.abs(exit.drive)>=PHASE_NEUTRAL)
    tips.push(isAWD
      ?(exit.drive>0?'Exit: the centre diff sends the rear more than its share of drive. Shift it toward the front to settle power-on oversteer.'
                    :'Exit: the centre diff sends the front more than its share of drive. Shift it toward the rear for more rotation under power.')
      :(exit.drive>0?'Exit: rear drive takes lateral grip from the rear under power. Only throttle and exit diff lock manage it.'
                    :'Exit: front drive takes lateral grip from the front under power. Only throttle and exit diff lock manage it.'));
  const hints={
    chas:'The car\'s own mid-corner lean at the weight-matched stiffness split, before springs and bars move it.',
    sp:'How far the springs move the MID margin from CHASSIS, by shifting the roll-stiffness split.',
    ab:'How far the anti-roll bars move the MID margin from CHASSIS, by shifting the roll-stiffness split.',
    brk:`Brake bias vs the entry-load ideal at ${ENTRY_G} g braking (${Math.round(entry.idealBias)}% front on this car). + = the rear brakes more than its share (toward oversteer).`,
    ePitch:`Load moving forward at ${ENTRY_G} g braking adds front grip and takes rear grip. Not tunable, so it is left out of the ENTRY figure.`,
    drive:`The drive split vs the load-proportional one at ${EXIT_G} g of drive (${Math.round((1-exit.idealDriveF)*100)}% rear on this car). + = the rear carries more than its share (toward oversteer).`,
    xPitch:`Load moving rearward at ${EXIT_G} g of drive. Not tunable, so it is left out of the EXIT figure.`,
    dEntry:'Off-throttle lock resists the car rotating on entry. Direction only: nothing has calibrated how much.',
    dExit:'On-throttle lock: whether it pushes the car wide or rotates it depends on the layout. Direction only.',
    damp:'Front vs rear damping. It acts only while load is moving, so it shows a direction only.',
  };
  // Glossary entry per row, keyed like `hints`: the tooltip's TERMS link.
  const hintTerms={chas:'phase-verdict',sp:'phase-verdict',ab:'phase-verdict',brk:'brake-balance',ePitch:'phase-verdict',drive:'phase-verdict',xPitch:'phase-verdict',dEntry:'decel-lock',dExit:'accel-lock',damp:'damping-bias'};
  const Head=({title,sub,val})=>(
    <div style={{display:'flex',alignItems:'baseline',gap:6,fontSize:9,color:'#475569',letterSpacing:2,
                 marginBottom:3,paddingBottom:2,borderBottom:'1px solid #0f172a'}}>
      <span>{title}</span><span style={{letterSpacing:1,flex:1}}>{sub}</span>
      {val!=null&&<span style={{fontFamily:'var(--font-mono)',fontSize:11,letterSpacing:0,fontWeight:700,
        color:Math.abs(val)<PHASE_NEUTRAL?'#e2e8f0':val>0?'#ef4444':'#3b82f6'}}>{fmtPct(val)}</span>}
    </div>

    <div>
      <div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6,padding:'6px 8px',marginBottom:8,

        {tips.length?tips.map((t,i)=><div key={i}>{t}</div>):'Balanced through every phase the model reads.'}

      <div style={{marginBottom:6}}>
        <Head title="TRANSIENT" sub="· turn-in, direction changes"/>

      </div>
      <div style={{fontSize:10,color:'#475569',lineHeight:1.5,marginTop:4}}>
        Grip margin: + = the rear gives up first. GRIP BIAS {gripBalance?.toFixed(2)} is the same model on its 0–1 scale; alignment is not counted. <TermLink id="phase-verdict"/>
      </div>
    </div>
  );

// Tune Check's step vocabulary, shared by both tabs. Defined here rather than inside the MEASURE
// block that first grew them, because DECODE is now numbered steps too and the two tabs have to

const CkPhase=({children})=>(
  <div style={{fontSize:9,letterSpacing:1.5,color:'#64748b',margin:'10px 0 4px',

const CkChip=({on,warn,children})=>(

// The paragraph that opens each tab: what the procedure is for, before any control.
