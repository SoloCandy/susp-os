<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--font-mono:'JetBrains Mono','Courier New',monospace;}
html{height:100%;height:-webkit-fill-available;height:100dvh;}
body{background:#020617;color:#cbd5e1;font-family:var(--font-mono);overflow:hidden;
     -webkit-text-size-adjust:100%;height:100%;height:-webkit-fill-available;height:100dvh;}
@media(max-width:768px){
  body{overflow:auto}
  .tog{padding:9px 0;min-height:40px}
  .tbtn{padding:11px 14px;min-height:40px}
  .nudge-btn{display:inline-flex!important}
}
@media(max-width:480px){
  /* Fluid number inputs so a label + two fields don't overflow a ~375px row.
     Keep font-size:16px (set on .num) — lowering it makes iOS zoom on focus. */
  .num{width:62px;min-width:0}
}
/* BeamNG output layout: fixed 2 columns (front/rear), collapsing to 1 below ~580px of the
   OUTPUT PANEL'S OWN width — a container query rather than a viewport media query, since the
   panel's rendered width depends on sidebar state, not window size (docs/CODE_MAP.md's
   headerCompact section covers why this codebase avoids reusing viewport-width flags for
   container-shaped decisions). auto-fit was tried first and rejected:
   on wide monitors minmax(280px,1fr) grows to 3-4 columns, which breaks the front/rear
   grouping the whole layout exists for — a fixed 2-column template with a container-query
   fallback is the only way to cap it at exactly 2 without an unwanted maxWidth margin cap. */
.beamng-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@container (max-width:580px){
  .beamng-grid{grid-template-columns:1fr}
}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#0a0f1a}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:2px}
.sidebar-scroll::-webkit-scrollbar{width:12px}
.sidebar-scroll::-webkit-scrollbar-track{background:#0a0f1a;border-left:1px solid #0f172a}
.sidebar-scroll::-webkit-scrollbar-thumb{background:#1e293b;border-radius:2px;border:3px solid #0a0f1a}
.sidebar-scroll::-webkit-scrollbar-thumb:hover{background:#334155}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

     outline:none;text-align:right;transition:border-color .12s,background .12s}

<body>
<div id="root">
  <!-- Shown only if React fails to mount -->
  <div id="pre-load" style="padding:24px;color:#6b7280;font-family:var(--font-mono);font-size:12px;background:#020617;min-height:100vh">
    <div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">SUSP.OS</div>
    <div style="margin-bottom:16px">Loading...</div>
  </div>
</div>
<script>
// Global error catcher — fires before React/Babel, shows error on blank screen
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById('pre-load');
  if(d){
    d.innerHTML='<div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">SUSP.OS — Failed to load</div>'
      +'<div style="color:#6b7280;margin-bottom:12px">JavaScript error on line '+line+'</div>'
      +'<div style="background:#0f172a;padding:12px;border-radius:4px;color:#ef4444;word-break:break-all;line-height:1.6">'+(msg||'Unknown error')+'</div>'
      +'<button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#0f172a;border:1px solid #1e293b;color:#e2e8f0;border-radius:4px;cursor:pointer;font-family:var(--font-mono);font-size:12px">RELOAD</button>';
  }
};
// Hide the pre-load message once React takes over
window.addEventListener('DOMContentLoaded',function(){
  setTimeout(function(){
    var d=document.getElementById('pre-load');
    if(d&&d.innerHTML.indexOf('Loading')>-1)d.style.display='none';
  },5000);
});
</script>
<script id="app-source" type="text/plain">
const {useState,useMemo,useRef,useEffect,useLayoutEffect,useReducer}=React;

const KG_TO_LB=2.204622622,LB_IN_TO_NM=175.126790921,MPH_TO_MS=0.44704,IN_TO_MM=25.4;
const KMH_PER_MPH=1.60934;
// Forza's "N/mm" per lb/in, for the UNITS modal's spring choice. FORZA'S METRIC SPRING LABEL IS
// 10× TRUE N/mm: the number it shows is really N/cm (1 lbf/in = 1.75127). Verified in-game —
// a spring the app showed as 190.4 true N/mm, Forza displayed as 1903.7 "N/mm". The app
// mirrors the game's number so it can be typed straight in, so the divisor is 100, not the
// physically-correct 1000. Do not "fix" it to 1000 again — see docs/HISTORY.md.
// Physical-unit game modes don't use this at all: BeamNG's slider is N/m (LB_IN_TO_NM).
const NMM_PER_LBIN=LB_IN_TO_NM/100;
// Forza's "kgf/mm" per lb/in. Same quirk as its N/mm: the number is 10× true kgf/mm
// (really kgf/cm) — confirmed in-game. Mirrors the game, so do not drop the ×10.
const KGFMM_PER_LBIN=10/KG_TO_LB/IN_TO_MM;
// Spring display units for the Forza modes: factor from lb/in, label, decimals, input step.
const SPRING_UNITS={
  lbin:{f:1,label:'lb/in',dp:0,step:1},
  nmm:{f:NMM_PER_LBIN,label:'N/mm',dp:1,step:0.1},
  kgfmm:{f:KGFMM_PER_LBIN,label:'kgf/mm',dp:1,step:0.1},
};
const springUnit=k=>SPRING_UNITS[k]??SPRING_UNITS.lbin;
// Forza ARB click → roll stiffness per m² of track (N·m/rad), at the suspension (before the tyre —
// see TYRE_HZ). Fitted to an in-game MAN bar sweep on three cars under the tyre-series model:
// ~579 (MX-5 Cup), ~438 (Ultima Evo), ~626 (Scirocco R). Forza normalises its 1–N slider per car,
// so no one value fits every car within its 2dp readout; 540 is the compromise default and
// MEASURE ARB (ch.measuredArbClick, read via arbScaleOf) replaces it per car. Was 240, then 285,
// both fitted without the tyre term. See docs/PHYSICS.md.
const ARB_RS_SCALE=540;
// The click scale for this chassis: the MEASURE ARB reading when one is set, else the default.
const arbScaleOf=ch=>ch.useMeasuredArbClick&&ch.measuredArbClick!=null
  ?Math.max(ARB_SCALE_MIN,Math.min(ARB_SCALE_MAX,ch.measuredArbClick)):ARB_RS_SCALE;
// A measured click scale is solved against MEAS. NAT BAL on springs at its Hz, so it goes stale
// when either changes. measuredArbNat/measuredArbNatHz record what it was measured against;
// null (scales applied before they existed) = unknown, never flagged.
const arbScaleStale=ch=>!!(ch.useMeasuredArbClick&&ch.measuredArbNat!=null&&(!ch.useMeasuredNatBal
  ||ch.measuredNatBal!==ch.measuredArbNat||(ch.measuredNatBalHz??NAT_BAL_REF_HZ)!==(ch.measuredArbNatHz??NAT_BAL_REF_HZ)));
const ARB_SCALE_MIN=150,ARB_SCALE_MAX=1500;
const rollCenterHeight=ch=>ch.cgHeight*0.20; // scales with CG height; ~0.09m for typical sports cars
// ARB Stiffness Mode AUTO: the bars' fraction (0.05–0.50) of total roll stiffness, from the
// roll angle the springs alone would give — 7% per degree. One definition for every solver
// (feelToPhysics, resolveCoSolveSpringShare, computeTune) so the share each one assumes agrees.
// One axle's spring roll stiffness (N·m/rad) from its ride frequency: wheel rate (2πf)²·m
// across the track, k·t²/2. Not hzToRs, which is the legacy Ride Stiffness slider mapping.
const axleRollStiffness=(hz,mass,track)=>Math.pow(hz*2*Math.PI,2)*mass*track*track/2;
// Body roll moment at 1 g lateral (N·m): mass × sprung-CG height above the roll centre.
const rollMomentOf=ch=>(ch.weight/KG_TO_LB)*9.81*(ch.cgHeight-rollCenterHeight(ch));
const autoArbShare=springRollDeg=>Math.max(5,Math.min(50,springRollDeg*7))/100;
// Forza's displayed mech balance counts each tyre as a spring in series with its suspension: an
// axle shows K·Kt/(K+Kt), so front/rear differences are compressed, more so the stiffer the
// suspension. Fitted to 33 in-game readings on three cars (MX-5 Cup, Ultima Evo, Scirocco R;
// springs split front/rear at 2.5–3.5 Hz, plus equal-Hz natural readings): the tyre behaves like a
// 3.94 Hz spring on a 269 kg corner and stiffens with the square root of its load. Tyre width had
// no measurable effect. Forza modes only; physical modes stay suspension-only. docs/PHYSICS.md.
const TYRE_HZ=3.94,TYRE_REF_MASS=269;
const tyreRollStiffness=(mass,track)=>axleRollStiffness(TYRE_HZ,Math.sqrt(mass*TYRE_REF_MASS),track);
const inSeries=(k,kt)=>k>0?k*kt/(k+kt):0;
// The rear fraction of roll stiffness Forza displays, from each axle's suspension roll stiffness.
const displayRsBalance=(ch,kF,kR)=>{
  const mc=cornerMasses(ch);
  const eF=inSeries(kF,tyreRollStiffness(mc.front,ch.trackF)),eR=inSeries(kR,tyreRollStiffness(mc.rear,ch.trackR));
  return eF+eR>0?eR/(eF+eR):1-ch.frontBias/100;
};
// MEASURE NAT BAL readings taken before the Hz was recorded were taken at this Hz (the card's default).
const NAT_BAL_REF_HZ=2.5;
const DAMPING_CALIBRATION=0.00135;
// Mech-balance model (tyre load sensitivity). See mechBalanceLLT.
const TIRE_LOAD_SENS=0.15;   // grip falloff per unit Fz/Fz_ref (tyre load sensitivity)
const MECH_BAL_GAIN=1.8;     // axle capacity delta → balance offset (calibrated to legacy 0.5-neutral scale)
const WIDTH_GRIP_EXP=0.4;    // tyre width → grip capacity, sub-linear
const TIRE_MECH_SCALE=0.08;  // tyre width rear/front log-ratio → mech balance correction (calibrated from Forza telemetry)
// Default absolute Mech Balance Target. The Forza tuning community's published window for
// road/circuit work is 0.55–0.65, with ~0.60 the neutral baseline; 0.62–0.65 is specifically
// a rotation-biased (touge) setting and >0.65 reads as instability. This shipped at 0.65 from
// its introducing commit (a8c94e1) and was never revisited, so a fresh build defaulted to the
// rotation-biased edge of that window while presenting itself as neutral. Now 0.60.
const MECH_BALANCE_TARGET=0.60;
// Forza hides its real internal units, so both Forza modes express springs/dampers/ARBs
// as abstract "clicks" on a fixed 1–N scale (DAMPING_CALIBRATION and ARB_RS_SCALE were
// reverse-engineered to map real physics onto those ranges — see docs/PHYSICS.md).
// BeamNG generates its tuning sliders per-vehicle from the car's Jbeam `variables` block,
// so there is no universal scale to calibrate against. Instead of inventing a third click
// range, `physical:true` modes skip the click-compression step entirely and emit the real
// values the solver already computes upstream, in BeamNG's own slider units: N/m springs,
// N/m/s damping, and a linear N/m anti-roll rate. `damping`/`arb` are
// null because there is genuinely no ceiling — every consumer must null-check rather than
// assume a number (no clamping, no "/ N" suffix, no percentage-of-max warnings).
const GAME_LIMITS={horizon:{damping:20,arb:65},motorsport:{damping:40,arb:40},
                   beamng:{damping:null,arb:null,physical:true}};
// Branch on the capability, never on the string 'beamng' — a fourth physical-unit game
// should cost nothing but a GAME_LIMITS entry.
const isPhysical=gm=>!!GAME_LIMITS[gm]?.physical;
// Nominal full-scale used ONLY as CO-SOLVE's utilisation denominator when the game mode
// has no click ceiling. It is NOT a reintroduced limit and nothing is clamped to it —
// see the derivation at the Auto Spring Share binary search for why the value cancels.
const ARB_UTIL_REF=65;
// Display labels for the game-mode dropdown. Both the desktop header and the mobile
// sidebar read this.
const GAME_MODE_LABEL={horizon:'HORIZON',motorsport:'MOTORSPORT',beamng:'BEAMNG'};

const cornerMasses=ch=>{
  const kg=ch.weight/KG_TO_LB;
  return{front:(kg*(ch.frontBias/100))/2,rear:(kg*(1-ch.frontBias/100))/2};
};
// Section widths in mm; 265 stands in for an unparseable or blank tyre size.
const tyreWidths=ch=>({twF:parseTyre(ch.tyreF)?.width??265,twR:parseTyre(ch.tyreR)?.width??265});
// Forza's mech-balance display includes a small tyre-width term; solvers subtract it from the target.
const tireCorrOf=ch=>{const{twF,twR}=tyreWidths(ch);return TIRE_MECH_SCALE*Math.log(twR/twF);};
const parseTyre=str=>{
  const s=String(str??'').trim();
  if(!s)return null;
  // Tolerant of whatever sits between the numbers — "265/35R18", "265x35r18",
  // "265-35-18", "265 35 18" all parse the same way. Only the digit groups
  // themselves matter; separators are just noise. Sanity-bounded so unrelated
  // text (e.g. stray numbers) doesn't get misread as a plausible tyre size.
  const tokens=s.match(/\d+(?:\.\d+)?/g);
  if(!tokens||!tokens.length)return null;
  const width=+tokens[0];
  if(!(width>=50&&width<=500))return null;
  if(tokens.length===1)return{width,aspectRatio:null,rimDiameter:null,diameter:null,radius:null};
  const aspect=+tokens[1];
  if(!(aspect>=10&&aspect<=100))return null;
  if(tokens.length===2)return{width,aspectRatio:aspect,rimDiameter:null,diameter:null,radius:null};
  const rim=+tokens[2];
  if(!(rim>=8&&rim<=30))return null;
  const diameter=rim*25.4+2*(width*aspect/100);
  return{width,aspectRatio:aspect,rimDiameter:rim,diameter,radius:diameter/2};
};
// Natural mech balance for this chassis — pure roll-stiffness rear fraction at equal springs,
// no ARBs (matches chassisAnalysis.natBal / the "NAT" reference the Balance Guide already uses).
// Uses the measured reading in place of the geometry prediction when MEASURE NAT BAL is active.
// Mech Balance Target/Balance Offset are stored as deltas from this value so a saved/shared
// build re-targets correctly against whatever chassis it's applied to.
const naturalMechBalanceOf=ch=>{
  if(ch.useMeasuredNatBal&&ch.measuredNatBal!=null)return Math.max(0.10,Math.min(0.90,ch.measuredNatBal));
  const mc=cornerMasses(ch);
  return mc.rear*ch.trackR*ch.trackR/(mc.front*ch.trackF*ch.trackF+mc.rear*ch.trackR*ch.trackR);
};
// MEASURE NAT BAL's gap from the geometric estimate, as a constant rsBalance-space offset. The
// measured value is read off Forza's display, which already includes the tyre-width effect, so
// tireCorr is taken out here — every caller adds tireCorr back separately, and leaving it in
// counted it twice on cars with different front/rear tyre widths. 0 when not measuring.
const natOffsetOf=ch=>{
  if(!(ch.useMeasuredNatBal&&ch.measuredNatBal!=null))return 0;
  const mc=cornerMasses(ch);
  const geom=mc.rear*ch.trackR*ch.trackR/(mc.front*ch.trackF*ch.trackF+mc.rear*ch.trackR*ch.trackR);
  return naturalMechBalanceOf(ch)-geom-tireCorrOf(ch);
};
// MEASURE NAT BAL's offset for the Forza display (displayRsBalance): the reading minus what the
// tyre-series model shows at equal springs of the Hz it was measured at, minus tireCorr (already
// inside the reading). The model's equal-Hz balance moves slightly with Hz, which is why the Hz
// is stored with the reading. natOffsetOf stays the solvers' suspension-space offset. 0 unmeasured.
const displayNatOffsetOf=ch=>{
  if(!(ch.useMeasuredNatBal&&ch.measuredNatBal!=null))return 0;
  const mc=cornerMasses(ch),hz=ch.measuredNatBalHz??NAT_BAL_REF_HZ;
  return naturalMechBalanceOf(ch)-tireCorrOf(ch)
    -displayRsBalance(ch,axleRollStiffness(hz,mc.front,ch.trackF),axleRollStiffness(hz,mc.rear,ch.trackR));
};
// MEASURE ARB: the click scale that makes the display model read what Forza showed with bars f/r
// at equal springs of hz. Bisection — the tyre term leaves no closed form, and the balance moves
// monotonically with the scale for a fixed f/r. Needs MEASURE NAT BAL for the offset. null when the
// reading can't come from any scale in ARB_SCALE_MIN..MAX (wrong side of natural, or too far).
const solveArbScale=(ch,hz,f,r,reading)=>{
  const mc=cornerMasses(ch);
  const spF=axleRollStiffness(hz,mc.front,ch.trackF),spR=axleRollStiffness(hz,mc.rear,ch.trackR);
  const off=tireCorrOf(ch)+displayNatOffsetOf(ch);
  const bal=sc=>displayRsBalance(ch,spF+f*sc*ch.trackF*ch.trackF,spR+r*sc*ch.trackR*ch.trackR)+off;
  let lo=ARB_SCALE_MIN,hi=ARB_SCALE_MAX,bLo=bal(lo);
  const bHi=bal(hi);
  if(Math.abs(bHi-bLo)<1e-9||(reading-bLo)*(reading-bHi)>0)return null;
  for(let i=0;i<50;i++){const mid=(lo+hi)/2,bm=bal(mid);if((reading-bLo)*(reading-bm)<=0)hi=mid;else{lo=mid;bLo=bm;}}
  return (lo+hi)/2;
};
// The ARB Balance Target's stored range. Every resolve and every solver funnels through here,
// so the band is stated once. sanitizeTune clamps the STORED delta instead (0.20-nat..0.90-nat).
const clampBalTarget=v=>Math.max(0.20,Math.min(0.90,v));
const resolveArbBalTarget=(ch,fe)=>fe.arbBalTarget==null
  ?MECH_BALANCE_TARGET
  :clampBalTarget(naturalMechBalanceOf(ch)+fe.arbBalTarget);
// Grip-neutral mech balance: the mech balance that cancels this chassis's natural at-limit grip
// tendency (the Balance Guide's GRIP TARGET). GRIP mode's Balance Offset and Vehicle DNA's
// balanceOffset axis are both measured from here.
const gripNeutralOf=ch=>1-balanceFromRsBal(ch,naturalMechBalanceOf(ch));
// fe.arbBalTarget is stored as a delta from naturalMechBalanceOf(ch) (null = untouched, falls back
// to MECH_BALANCE_TARGET) so a saved/shared build re-targets against whatever chassis it's applied
// to. This is the single funnel that resolves both TARGET and GRIP modes to the absolute value the

// compiler needed the identical resolution — keep one copy, not two (docs/DNA.md).
const resolveFeEffective=(ch,fe)=>(fe.arbBalTargetMode??'manual')==='grip'
  ?{...fe,arbBalTarget:clampBalTarget(gripNeutralOf(ch)+(fe.arbBalDelta??0))}
  :{...fe,arbBalTarget:resolveArbBalTarget(ch,fe)};
// Is anything actually solving toward the Balance Target? MECH/CO-SOLVE ARB balance modes do,
// and Rear Hz Mode MECH does even under MAN ARB stiffness (it still aims spring Hz at the
// target). MAN ARB stiffness otherwise bypasses arbBalMode's solve entirely, so a leftover
// mech/coSolve from before the switch to MAN must not count — a fix that once reached only
// some of this predicate's three inline copies (see docs/HISTORY.md). The arbBalMode default
// ('weight') is neither mech nor coSolve, so testing the raw field is the same test.
const hasBalTargetSolve=fe=>((fe.arbMode??'auto')!=='man'&&(fe.arbBalMode==='mech'||fe.arbBalMode==='coSolve'))
  ||(fe.rearHzMode??'flatRide')==='mech';
// rideStiffness now stores Hz directly (HZ_MIN–HZ_MAX).
// Old saves/shares stored integers 0–100 — detect and auto-migrate.
// Single source of truth for the spring-frequency operating band. Change here to
// retune the whole app — physics clamps, codec, slot-scaling, and UI sliders all read these.
const HZ_MIN=0.8,HZ_MAX=5.5;
// BeamNG's tuning sliders snap to fixed increments (confirmed in-game): Spring Rate 500 N/m,
// Anti-Roll Spring Rate 1000 N/m, Bump/Rebound Damping 100 N/m/s. This is the physical-unit
// analogue of Forza's 1..N click grid, and computeTune treats it the same way: the value is
// quantised to the grid, and the reported physics (Hz, ζ, settle time, roll stiffness, the
// balance bar) is then derived from the quantised value, so every figure printed beside an
// output row describes the tune you can actually dial in rather than the pre-snap target.
// Defined up here rather than beside the output helpers because the solver needs them too.
// See docs/PHYSICS.md.
const PHYS_SNAP={spring:500,arb:1000,damp:100};
const roundTo=(v,step)=>Math.round(v/step)*step;
// MOTION RATIO divisor. The solver works in wheel rate; BeamNG's sliders act at the
// spring/damper, so an inboard spring needs rate/mr² to give the same wheel rate.
const mrDiv=mr=>{const v=Number(mr);return v>0?v*v:1;};
// Snap a wheel-rate quantity to the grid. Deliberately snapped in WHEEL-RATE space, with no
// motion-ratio term: mr is display-only by design (see mrDiv's note at the output helpers,
// and the `motion ratio never reaches the physics` guard in tests-beamng.js), so letting it
// pick the snap point would make Hz and the balance bar move when a motion ratio is entered.
// Consequence at mr != 1: the printed number is re-snapped by the output helper after the
// /mr² division, so it can sit up to half a step off the rate these physics describe. At the
// default mr of 1.0 — and so for every tune that does not opt into the advanced field — the
// two coincide exactly. See docs/HISTORY.md.
const snapPhys=(v,step)=>roundTo(v,step);
const rsToHz=rs=>rs>6?0.8+(rs/100)*2.7:rs;
// Clamp a solved frequency into the operating band. Every solve that can land outside it
// funnels through here; callers that also REPORT the clamp still test their own raw value,
// since a solve landing exactly on a bound is not clamped (see splitAvgHz).
const clampHz=hz=>Math.max(HZ_MIN,Math.min(HZ_MAX,hz));
const hzToRs=hz=>Math.round(clampHz(hz)*100)/100;
// Flat ride (Olley): the rear wheel meets a bump `t = wheelbase/speed` seconds after the
// front, so the rear's period is shortened by exactly that much — rearPeriod = frontPeriod − t
// — and the two axles come back into phase, cancelling pitch.
//
// The offset is ONE traverse time, not two. It was `2*t` until it was checked against real
// flat-ride practice, and the doubled version drifted further out of band the harder you
// tuned. Every ratio in this area is a FREQUENCY ratio, never a spring-rate one — rate goes
// as Hz², so ×1.20 in frequency is ×1.44 in rate, and reading one as the other is how the
// original error survived review in the first place.
// docs/PHYSICS.md carries Olley's rule, the practitioner band, the before/after ratio table
// and the sources; docs/HISTORY.md has the incident and the behaviour-change note.
const flatRideRearHz=(fHz,wb,mph)=>{
  if(mph>=200)return{hz:fHz,clamped:false};
  const ms=mph*MPH_TO_MS;
  if(ms<1)return{hz:fHz*1.2,clamped:false};
  const t=wb/ms,d=(1/fHz)-t;
  const raw=d>0.05?1/d:fHz*1.2;
  const clamped=raw>HZ_MAX;
  return{hz:Math.min(raw,HZ_MAX),clamped};
};
const computeOscillation=(hz,zetaReb100,zetaBump100,durationSec,nPts=300)=>{
  const wn=2*Math.PI*hz,dt=durationSec/nPts;
  const pts=[];let x=1.0,v=0.0;
  for(let i=0;i<=nPts;i++){
    pts.push({t:i*dt,x});
    const zeta=(v<=0?zetaReb100:zetaBump100)/100;
    const a=-wn*wn*x-2*zeta*wn*v;
    v+=a*dt;x+=v*dt;
  }
  return pts;
};
// ±10%-band settle time measured off computeOscillation's trace (last band exit, interpolated).
// Unlike settleTimeFromZeta it sees bump ζ, because the trace alternates rebound/bump by velocity
// sign. Shared by the DYNAMICS chart (dashed markers) and the DAMPERS summary's MEASURED row so
// the two quote the same number. estF/estR are the analytic settle figures, used only to size
// the window: nPts is fixed, so dt — and with it the Euler trace — depends on window length, and
// the final measurement is taken from the final points so it matches the polyline drawn.
const SETTLE_ENV=0.1;

  let i=pts.length-1;                          // trace starts at x=1, so i lands >=0
  while(i>0&&Math.abs(pts[i].x)<SETTLE_ENV)i--;
  if(i>=pts.length-1)return null;              // still ringing at the window edge
  const a=pts[i],b=pts[i+1];
  return a.t+(b.t-a.t)*((Math.abs(a.x)-SETTLE_ENV)/(Math.abs(a.x)-Math.abs(b.x)));

const measureSettle=(fHz,fReb,fBmp,rHz,rReb,rBmp,estF,estR)=>{
  const fitDur=s=>Math.min(4,Math.max(1.5,s*1.8));
  const probeDur=fitDur(Math.max(estF??2,estR??2));
  const probeF=computeOscillation(fHz,fReb,fBmp,probeDur);
  const probeR=computeOscillation(rHz,rReb,rBmp,probeDur);
  const durSec=fitDur(Math.max(curveSettle(probeF)??probeDur,curveSettle(probeR)??probeDur));

// Shared ref: given avgHz = (fHz+rHz)/2 and the flat-ride constraint, solve fHz.
// Must invert the SAME relationship flatRideRearHz uses, so this moved from a 2t to a
// single-offset derivation alongside it. Substituting rHz = 1/(1/fHz − t):
//   2·avg = fHz + fHz/(1 − t·fHz)
//   → t·fHz² − fHz·(2 + 2·avg·t) + 2·avg = 0   →  smaller root = frontHz
const flatRideSharedHz=(avgHz,wb,mph)=>{
  if(mph>=200)return{fHz:avgHz,rHz:avgHz,clamped:false};
  const ms=mph*MPH_TO_MS;
  if(ms<1){const fHz=Math.max(HZ_MIN,avgHz/1.1);return{fHz,rHz:Math.max(HZ_MIN,2*avgHz-fHz),clamped:false};}
  const t=wb/ms;
  const B=-(2+2*avgHz*t),disc=B*B-8*t*avgHz;
  if(disc<0)return{fHz:avgHz,rHz:avgHz,clamped:true};
  const fHz=Math.max(HZ_MIN,(-B-Math.sqrt(disc))/(2*t));

const solveSpring=(hz,mass,mr)=>{
  const wr=Math.pow(hz*2*Math.PI,2)*mass;
  return(wr/Math.pow(mr,2))/LB_IN_TO_NM;
};
// `cc*(z/100)` is the real damping coefficient in N·s/m (cc=2√(wr·mass) has units kg/s ≡ N·s/m).
// DAMPING_CALIBRATION only exists to compress that into Forza's click range, so physical-unit
// modes pass calib=1 and get the genuine coefficient back — no calibration constant involved.
const solveDampRaw=(hz,mass,z,calib=DAMPING_CALIBRATION)=>{
  const wr=Math.pow(hz*2*Math.PI,2)*mass,cc=2*Math.sqrt(wr*mass);
  return cc*(z/100)*calib; // truly unclamped — bounds applied after proportional scaling
};
// Inverse of solveDampRaw: the ζ that a given click/coefficient value actually represents, at
// this axle's Hz and mass. Used to back-calculate ζ from the final, clamped/rounded damper
// value rather than trust the pre-clamp target — same reasoning as computeTune recomputing
// rsAbF/rsAbR from the clamped ARB click values instead of the pre-clamp roll-stiffness target
// (see docs/PHYSICS.md): the ζ% shown should describe what the displayed click value actually
// does, not what was originally asked for before Forza's 1..lim.damping range clipped it.
const impliedZeta=(v,hz,mass,calib=DAMPING_CALIBRATION)=>{
  const wr=Math.pow(hz*2*Math.PI,2)*mass,cc=2*Math.sqrt(wr*mass);
  return cc>0&&calib>0?v*100/(cc*calib):0;
};
// Equal-<metric> damping ratios anchored to the ride-reference axle, generalized over whatever
// per-axle "weight" wF/wR the caller wants zeta·weight held equal against. The reference axle
// (the one the stiffness slider anchors) holds refZeta; the other axle's zeta is derived so
// zF·wF = zR·wR at biasMult=1. biasMult>1 shifts the balance toward the rear side, preserved
// across all rideRefs. Returns unclamped {zF,zR}. Linear in zeta throughout — correct for any
// weight that's genuinely proportional to zeta itself (see forceZetas below), but NOT for
// settle time past critical damping — see settleZetas, which needs its own rate-aware version.
const balancedZetas=(rideRef,wF,wR,refZeta,biasMult)=>{

  if(rideRef==='rear')   return {zR:refZeta, zF:refZeta*(wR/wF)/biasMult};
  if(rideRef==='shared'){const avg=(wF+wR)/2,b=Math.sqrt(biasMult);
                         return {zF:refZeta*(avg/wF)/b, zR:refZeta*(avg/wR)*b};}
  return {zF:refZeta, zR:refZeta*(wF/wR)*biasMult}; // front (default)
};
// Settle-time decay rate from ζ% — see settleTimeFromZeta below for the physical reasoning.

const dampRate=zPct=>{const z=zPct/100;return z<=1?z:z-Math.sqrt(z*z-1);};

// rate≥1 has no solution at all (critical damping's rate=1 is the fastest anything can decay),
// so that end just clamps at 100%.
const rateToZeta=rate=>rate>=1?100:Math.max(0,rate)*100;
// Equal settle TIME, ζ- and Hz-aware. Naively holding ζ·Hz constant (the old approach) only
// means equal settle time while both axles stay underdamped — past critical damping the real
// decay rate is ζ-√(ζ²-1), not ζ, so that naive rule quietly stops matching real settle time the
// moment it pushes an axle over 100% (a Hz mismatch, a Damping Bias skew, or simply a high
// Rebound ζ/Settle Target anchor can all do this). This solves in rate-space instead: the
// reference axle's real rate·Hz product becomes the shared target, and the other axle's rate
// (hence zeta) is derived to match it exactly, skewed by biasMult the same way balancedZetas
// skews a linear ratio. Falls back to critical damping (100%) when the other axle's Hz is too
// low to ever physically reach the reference's real settle time. Reduces to the exact old
// linear-ζ formula whenever both axles stay underdamped (refZeta≤100% and the result ≤100%).
const settleZetas=(rideRef,fHz,rHz,refZeta,biasMult)=>{
  if(fHz<=0||rHz<=0) return {zF:refZeta,zR:refZeta};
  const refRate=dampRate(refZeta);
  if(rideRef==='rear'){
    const target=refRate*rHz;
    return {zR:refZeta, zF:rateToZeta(target/(fHz*biasMult))};

  if(rideRef==='shared'){
    const avg=(fHz+rHz)/2,b=Math.sqrt(biasMult),target=refRate*avg;
    return {zF:rateToZeta(target/(fHz*b)), zR:rateToZeta(target*b/rHz)};

  return {zF:refZeta, zR:rateToZeta(target*biasMult/rHz)};

// Settle time (10%-envelope) from ζ (%) and Hz, via dampRate's piecewise rate. WITHIN THIS
// ENVELOPE MODEL ζ=100% is the fastest settle and pushing past it is slower, not faster — the
// old single-branch rate=ζ got that backwards above 100%. "Within this model" is load-bearing:
// the envelope drops the response's own 1/√(1-ζ²) and (1+ωn·t) factors, so it is NOT a bound in
// either direction, and the real quickest ±10% settle sits nearer ζ≈59%. Full derivation, the
// error figures per ζ, and why the DYNAMICS chart measures its drawn curve instead of calling
// this: docs/PHYSICS.md.
const settleTimeFromZeta=(zetaPct,hz)=>{
  if(zetaPct<=0||hz<=0) return 99;
  return 2.302/(dampRate(zetaPct)*hz*2*Math.PI); // ln(10)/(rate·ωn)

// Equal damping FORCE: weight is mass·Hz (force ∝ ζ·m·Hz — see solveDampRaw), so this also
// corrects for corner-mass asymmetry that settleZetas ignores. Unlike settle time, damping force
// at a given velocity is linear in ζ regardless of over/underdamped, so the plain linear solve
// (balancedZetas) is correct here as-is — no rate-space treatment needed.
const forceZetas=(rideRef,mF,fHz,mR,rHz,refZeta,biasMult)=>balancedZetas(rideRef,mF*fHz,mR*rHz,refZeta,biasMult);
// Damping Balance Mode's front/rear solve, picked by mode. Both SYNC and NEUTRAL are just
// "anchor refZeta at the ride-reference axle, derive the other so <metric> matches" — so the
// anchor is a parameter, and the same call splits the rebound anchor and (in INDEPENDENT bump
// mode) the typed bump anchor. Callers still clamp the result; this returns it unclamped.
// HYBRID (a SYNC sub-mode) is the per-axle arithmetic mean of the SYNC and NEUTRAL solves —
// halfway between equal settle time and equal damping force. Both parents hold the anchor axle
// at refZeta, so the mean does too.
const balModeZetas=(mode,rideRef,mF,fHz,mR,rHz,refZeta,biasMult)=>{
  if(mode==='neutral')return forceZetas(rideRef,mF,fHz,mR,rHz,refZeta,biasMult);

  const f=forceZetas(rideRef,mF,fHz,mR,rHz,refZeta,biasMult);
  return{zF:(s.zF+f.zF)/2,zR:(s.zR+f.zR)/2};
};

// ── Mech balance — steady-state US/OS from physics ───────────────────────────
// Derived from lateral-load-transfer distribution (set by the front/rear roll-
// stiffness RATIO), tyre load sensitivity (grip falls as vertical load rises —
// the mechanism by which roll stiffness shifts balance), and tyre width as a
// sub-linear grip-capacity multiplier. 0.5 = neutral, >0.5 = oversteer.
// Only Kf/Kr ratio matters for LLTD, so callers may pass relative stiffnesses.
// Lateral load transfer per corner (N) at 1g lateral accel — shared by mechBalanceLLT
// and the SAG vs LOAD outside-wheel line.
const latLoadTransfer=(ch,Kf,Kr)=>{
  const g=9.81,a=1.0;
  const m=cornerMasses(ch),Mf=m.front*2,Mr=m.rear*2,Mt=Mf+Mr,RC=rollCenterHeight(ch);
  const Mphi=Mt*g*a*(ch.cgHeight-RC),sF=Kf/(Kf+Kr);     // sprung roll couple; front elastic share
  const dWf=Mphi*sF/ch.trackF+Mf*g*a*RC/ch.trackF;       // front lateral load transfer (N): elastic + geometric
  const dWr=Mphi*(1-sF)/ch.trackR+Mr*g*a*RC/ch.trackR;   // rear
  return{dWf,dWr,Mf,Mr};
};
const mechBalanceLLT=(ch,Kf,Kr)=>{

  const fy=Fz=>{const z=Math.max(0,Fz);return z*Math.max(0,1-TIRE_LOAD_SENS*(z/FzRef-1));};

};
// pure roll-stiffness rear fraction Kr/(Kf+Kr) → balance
const balanceFromRsBal=(ch,rsBal)=>{
  const r=Math.max(1e-4,Math.min(1-1e-4,rsBal));
  return mechBalanceLLT(ch,1,r/(1-r));
};
// Balance Guide RANGE / GRIP GAP band edge: how far from NATURAL one fraction of the
// NATURAL→GRIP TARGET gap sits. Both widgets call this so their bands cannot drift apart.
//
// frac ≤ 1 interpolates from natural toward grip-neutral and is direction-correct under
// either sign of gap — it is a partial correction of whatever the chassis does.
// frac > 1 is a different thing: DRIFT (0.90–1.55) and RWD DRAG (0.60–1.05) use it to
// recommend overshooting *past* grip-neutral into rotation, which is a direction, not a
// magnitude. Plain frac*gap carried gap's sign, so on a negative gap it aimed that
// overshoot at understeer instead — backwards, and on the DRIFT band large enough to
// invert the whole build table (see docs/HISTORY.md). Anchoring the overshoot at
// grip-neutral and adding |gap| keeps it pointed at oversteer whatever the sign.
//
// A negative gap is ordinary, not an edge case: the sign tracks front weight bias and
// flips just under 50% front (49.51% on DEF_CH), so every mid- and rear-engined car is
// on that side, as is any chassis a wide front tyre stagger puts there. docs/PHYSICS.md

//

// as -gap, which is the absolute value only on the branch that runs it. The guard-free
// Math.abs form is algebraically identical for gap>=0 but not bit-identical (~1 ULP),

const balanceBandFracs=(layout,build)=>((BALANCE_BAND_FRACS[layout]??BALANCE_BAND_FRACS.RWD)[build])??[0.55,0.95];

// rear/front Hz ratio the springs need. hzPairFor(mult) gives the front/rear Hz the caller
// would assume for a trial ratio (null = before any ratio is known), so AUTO's share can be

      // corrected Hz so the auto share assumed here matches what computeTune will settle on.

    }
  } else {

    } else if(rearHzMode==='multiplier'){

    } else if(rearHzMode==='mech'&&arbBalModeEarly!=='coSolve'){

        const sec=mult==null?primaryHz
          :clampHz(rideRef==='front'?primaryHz*mult:primaryHz/mult);

      });
      let _manSolved_fr=false;
      if(arbBalModeEarly==='man'){
        const m_m=cornerMasses(ch);
        const rsAbF_m=(fe.arbManF??20)*arbScaleOf(ch)*ch.trackF*ch.trackF;
        const rsAbR_m=(fe.arbManR??20)*arbScaleOf(ch)*ch.trackR*ch.trackR;
        const T=mech.rsBalTgt;

        if(rideRef==='front'){

  const arbBasicMan=Math.max(0,Math.min(100,fe.arbBasicMan??50));

// CO-SOLVE spring-share (S) resolution — shared by feelToPhysics (Kcs slider pre-inversion)

  // as a constant offset — same treatment as tireCorr below — so a target sitting exactly on NAT

  // a gap between our geometry estimate and the measured reading that isn't a real tuning need.

      // an axle near zero, which clk() later floors up to the game's 1-click minimum — real,
      // extra stiffness this split never asked for, that quietly steals back part of whatever
      // correction ARB was supposed to deliver. Nothing above catches that, so the search can
      // settle on an S that looks comfortable here but gets distorted once the real floor
      // clamps it. Treat "wants below 1 click" the same as "wants above the ceiling" — both mean
      // ARB can't cleanly express this split — so the search hands more to springs instead.
      const floorStrain=1/Math.max(0.05,Math.min(abF_s,abR_s))-1; // unbounded, like a ceiling overshoot, as an axle nears 0

  const isDrift=build==='drift';
  const isStreet=build==='street';
  const isRally=build==='rally';
  const isOffroad=build==='offroad';
  const isDrag=build==='drag';

  const camberGain=Math.max(0.55,Math.min(0.85,1.05-(ch.cgHeight??0.45)*0.8));
  const rearGainMult=layout==='FWD'?0.50:layout==='AWD'?0.70:0.75;
  const fwdReduction=layout==='FWD'?0.3:0.0;

  // Drift wants more static camber than Track for sustained high-slip-angle grip; Drag wants
  // near-zero for a flat straight-line contact patch. Both now scale with actual roll/CG like
  // every other build instead of being frozen constants (see docs/HISTORY.md).
  const optimalCamber=isDrift?-2.5:isDrag?-0.2:isOffroad?-0.3:isRally?-0.8:isStreet?-1.0:-1.5;
  const recCamberF=Math.round(Math.max(-4.0,Math.min(0.0,
    optimalCamber - rollDeg*camberGain + fwdReduction))*10)/10;
  const recCamberR=Math.round(Math.max(-3.5,Math.min(0.0,
    optimalCamber - rollDeg*camberGain*rearGainMult))*10)/10;

  const toeFByBuild={
    street:  layout==='FWD'?0.05:0.0,
    track:   layout==='FWD'?0.05:-0.05,
    drift:   layout==='FWD'?0.0:-0.10,
    rally:   0.0,
    offroad: 0.05,
    drag:    0.0,
  }[build]??-0.05;
  const recToeF=Math.round(Math.max(-0.20,Math.min(0.15,
    toeFByBuild+(ch.frontBias-50)*-0.003+(fHz-1.8)*0.010))*10)/10;

  const toeRByBuild={
    street:  {RWD:0.15,AWD:0.08,FWD:0.05},
    track:   {RWD:0.10,AWD:0.08,FWD:0.05},
    drift:   {RWD:0.05,AWD:0.05,FWD:0.05},
    rally:   {RWD:0.10,AWD:0.08,FWD:0.05},
    offroad: {RWD:0.15,AWD:0.15,FWD:0.10},
    drag:    {RWD:0.0, AWD:0.0, FWD:0.0},
  }[build]??{RWD:0.10,AWD:0.08,FWD:0.05};
  const toeRBase=toeRByBuild[layout]??toeRByBuild.RWD;
  const recToeR=Math.round(Math.max(0.0,Math.min(0.25,
    toeRBase+((1-ch.frontBias/100)-0.5)*0.20+Math.max(0,rHz-fHz)*-0.03))*10)/10;

  const casterBase=isDrift?4.8:isDrag?4.0:isOffroad?4.5:isStreet?5.2:5.8;
  const recCaster=parseFloat(Math.max(4.0,Math.min(7.5,
    casterBase+(fHz-1.8)*0.4+(ch.frontBias-50)*0.04+(layout==='FWD'?-0.5:0))).toFixed(1));

  return{recCamberF,recCamberR,recToeF,recToeR,recCaster};
};

const DIFF_BIAS_SCALE=0.14; // slightly higher — AWD contributions now split by center fraction
const DIFF_TYPE_ENC={'race':0,'sport':1,'rally':2,'offroad':3,'drift':4};
const DIFF_TYPE_DEC=['race','sport','rally','offroad','drift'];
// Community-estimated scale factors: same lock % on Race produces more effective lock than Rally/Offroad.
// Rally ≈ 76% of Race, Offroad ≈ 52% of Race. Sport is accel-only and slightly softer than Race.
// Drift is more aggressive than Race — faster lock engagement, tuned for rotation over stability.
const DIFF_TYPE_SCALE={race:1.00,sport:0.88,rally:0.76,offroad:0.52,drift:1.10};
const DIFF_TYPE_RANGES={
  race:   {accel:[25,60],frontAccel:[18,32],rearAccel:[25,60],decel:[8,25]},
  sport:  {accel:[28,68],frontAccel:[20,36],rearAccel:[28,68],decel:null},
  rally:  {accel:[33,79],frontAccel:[24,42],rearAccel:[33,79],decel:[11,33]},
  offroad:{accel:[48,90],frontAccel:[35,62],rearAccel:[48,90],decel:[15,48]},
  drift:  {accel:[23,55],frontAccel:[16,29],rearAccel:[23,55],decel:[0,8]},
};

const computeDiff=(ch,fe,dr,natMechBalOverride=null)=>{
  const rB=1-ch.frontBias/100;
  const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,Math.round(v)));
  const biasExit=dr.diffBiasExit??0;       // rear exit intent (−50=grip, +50=rotate)
  const biasEntry=dr.diffBiasEntry??0;     // entry intent (−50=loose, +50=stable)
  const frontExitBias=dr.diffFrontExitBias??0; // AWD front exit push intent
  const build=dr.buildType??'track';
  const diffType=dr.diffType??'race';
  const typeScale=DIFF_TYPE_SCALE[diffType]??1.0;

  // MATCH CHASSIS: bias the auto-solver's intent toward the chassis mech target.
  // Off by default; manual mode bypasses it entirely.
  let effBiasExit=biasExit, effBiasEntry=biasEntry;
  if(dr.diffComplement&&!dr.diffManual){
    const cm=cornerMasses(ch);
    // Use measured nat balance when provided (measured mode active), else compute from geometry
    const natMechBal=natMechBalOverride!=null
      ?natMechBalOverride
      :(cm.rear*ch.trackR*ch.trackR)/(cm.front*ch.trackF*ch.trackF+cm.rear*ch.trackR*ch.trackR);
    const tgt=fe.arbBalTarget; // fe is feEffective here — already resolved for TARGET/GRIP mode
    const gap=tgt-natMechBal; // positive = user wants more rear/oversteer than natural
    // Cap correction so it can't dominate explicit user slider input
    const correction=Math.max(-25,Math.min(25,gap*150));
    // FWD's diffBiasExit/Entry are polarity-inverted vs RWD/AWD: more front lock means more
    // UNDERSTEER on a FWD car (see bDiffAccel/bDiffDecel in the balance formulas below), so
    // the correction must flip sign there or "more oversteer" targets would push FWD toward
    // more understeer instead.
    const signedCorrection=ch.layout==='FWD'?-correction:correction;
    effBiasExit =Math.max(-50,Math.min(50,biasExit +signedCorrection));
    effBiasEntry=Math.max(-50,Math.min(50,biasEntry+signedCorrection*0.5));
  }

  let vals;
  if(dr.diffManual){
    vals=ch.layout==='AWD'
      ?{layout:'AWD',
        frontAccel:dr.diffFrontAccel??25, frontDecel:dr.diffFrontDecel??0,
        rearAccel: dr.diffRearAccel??50,  rearDecel: dr.diffRearDecel??10,
        center:    dr.diffCenter??65}
      :{layout:ch.layout,
        accel:dr.diffAccel??35, decel:dr.diffDecel??10};
  } else if(ch.layout==='AWD'){
    const center=cl(dr.diffCenter??65,45,80); // slider-driven; default 65 is sensible across builds
    vals={layout:'AWD',
      frontAccel:cl((28-effBiasExit*0.10+frontExitBias*0.12)*typeScale,10,40),
      frontDecel:0,
      rearAccel: cl((48+effBiasExit*0.25)*typeScale,20,70),
      rearDecel: diffType==='sport'?0:cl(8+(rB-0.5)*15+effBiasEntry*0.15,0,20),
      center};
  } else {
    const isRWD=ch.layout==='RWD';
    const accelBase=isRWD
      ?{street:28,track:35,drift:48,rally:25,offroad:18,drag:65}[build]??35
      :{street:15,track:20,drift:12,rally:12,offroad:10,drag:20}[build]??20;
    const decelBase=isRWD
      ?{street:15,track:12,drift:3,rally:8,offroad:5,drag:0}[build]??12
      :{street:8, track:5, drift:2,rally:4,offroad:2,drag:0}[build]??5;
    // FWD's +effBiasExit*0.15 is intentionally the SAME sign as RWD's — do not flip it.
    // FWD's EXIT slider UI already inverts the stored value (~index.html:3444-3445) so
    // "more effBiasExit" means the same thing (more lock) on every layout; the UI flip is
    // what makes the slider's right side mean oversteer-leaning despite FWD's opposite
    // lock-to-balance polarity. Flipping the sign here too would double-cancel that fix.
    const accel=isRWD
      ? cl(accelBase*typeScale+effBiasExit*0.20, 10, 65)
      : cl(accelBase*typeScale+effBiasExit*0.15,  5, 35);
    const decel=diffType==='sport'?0:cl(decelBase*typeScale+(rB-0.5)*(isRWD?15:5)+effBiasEntry*0.15, 0, isRWD?30:15);
    vals={layout:ch.layout,accel,decel};
  }

  const nf=ch.frontBias/100;
  let bDiffAccel=0, bDiffDecel=0, bDiffFront=0, bDiffRear=0;
  // positive = oversteer tendency, negative = understeer tendency
  if(vals.layout==='AWD'){
    const C=Math.max(0,Math.min(1,(vals.center??65)/100));
    const bFA=-vals.frontAccel*nf*(1-C)*DIFF_BIAS_SCALE;   // front accel → understeer (−)
    const bRA= vals.rearAccel*(1-nf)*C*DIFF_BIAS_SCALE;    // rear accel  → oversteer  (+)
    const bFD=-vals.frontDecel*nf*(1-C)*DIFF_BIAS_SCALE;   // front decel → understeer (−)
    const bRD=-vals.rearDecel*(1-nf)*C*DIFF_BIAS_SCALE;    // rear decel  → understeer (−) — resists lift-off oversteer
    bDiffFront=bFA+bFD;
    bDiffRear =bRA+bRD;
    bDiffAccel=bFA+bRA;
    bDiffDecel=bFD+bRD;
  } else if(vals.layout==='RWD'){
    bDiffAccel= vals.accel*(1-nf)*DIFF_BIAS_SCALE;  // rear accel → oversteer (+)
    bDiffDecel=-vals.decel*(1-nf)*DIFF_BIAS_SCALE;  // rear decel → understeer (−) — resists lift-off oversteer
  } else {
    bDiffAccel=-vals.accel*nf*DIFF_BIAS_SCALE;  // front accel → understeer (−)
    bDiffDecel=-vals.decel*nf*DIFF_BIAS_SCALE;  // front decel → understeer (−)
  }

  return{...vals,bDiffAccel,bDiffDecel,bDiffFront,bDiffRear};
};

// SOFT | ROAD | FIRM | RACE band boundaries (Hz). Single source of truth shared by
// the hzCtx badge, the RIDE spring dial zones, and the Ride Stiffness slider markers —
// change here and all three stay in sync.
const HZ_BANDS=[1.2,1.8,2.5];
const HZ_BAND_COLS=['#60a5fa','#22c55e','#f59e0b','#ef4444']; // SOFT, ROAD, FIRM, RACE
const hzCtx=hz=>{
  if(hz<HZ_BANDS[0])return['SOFT',HZ_BAND_COLS[0]];
  if(hz<HZ_BANDS[1])return['ROAD',HZ_BAND_COLS[1]];
  if(hz<HZ_BANDS[2])return['FIRM',HZ_BAND_COLS[2]];
  return['RACE',HZ_BAND_COLS[3]];
};
// Slider ticks at each band boundary, labelled with the band that begins there
// (SOFT is the implicit floor). Colour matches that band's hzCtx colour.
const HZ_MARKERS=HZ_BANDS.map((v,i)=>({value:v,color:HZ_BAND_COLS[i+1],
  label:['ROAD','FIRM','RACE'][i]}));
// ── Vehicle DNA ─────────────────────────────────────────────────────────────
// A chassis-portable handling personality: axis TARGETS, compiled into ordinary fe/dr fields in
// PRO's target modes, never a change to feelToPhysics/computeTune. Core only — App does not call
// any of this yet; tests-dna.js is its consumer until the UI lands. docs/DNA.md is the spec and
// carries the reasoning behind every mode choice below.

// Each range is the sanitizeTune clamp of the field the axis compiles into, so a compiled patch is
// always a sanitizeTune fixed point (tests-dna.js asserts it). Defaults match DEF_FE; they are
// literals because DEF_FE is declared further down and this table evaluates at load.
const DNA_AXES={
  platformHz:   {min:HZ_MIN,max:HZ_MAX,def:1.75},  // front wheel Hz          → rideStiffness
  pitchRatio:   {min:0.50,max:3.00,def:1.20},      // rear Hz / front Hz      → rearHzMult
  arbShare:     {min:0,max:80,def:15},             // % of roll stiffness from bars → arbShareMan
  balanceOffset:{min:-0.20,max:0.20,def:0},        // mech balance past grip-neutral, + = OS → arbBalDelta
  reboundZeta:  {min:10,max:200,def:70},           // % at the front anchor   → reboundZeta
  bumpRatio:    {min:10,max:100,def:56},           // bump ζ as % of rebound  → bumpRatio
  dampBias:     {min:-50,max:50,def:0},            // slider value, + = REAR  → dampingBias (negated)
  diffExit:     {min:-50,max:50,def:0},            // slider value, + = ROTATE → diffBiasExit (negated on FWD)
  diffEntry:    {min:-50,max:50,def:0},            // slider value, + = LOOSE → diffBiasEntry (negated)
};
// The axes that can give way when targets conflict — the only ones a DNA's `keep` order ranks.
// Bump ratio and the setting axes never trade against another axis. This order is also the
// fallback `keep` for a DNA that doesn't supply a complete one.
const DNA_YIELDABLE=['platformHz','balanceOffset','arbShare','pitchRatio','reboundZeta'];
const DNA_MAX_MOVES=4;
// Stored fields that are the negation of their slider. Avoids writing -0, which survives JSON as 0
// but fails Object.is against it.
const dnaNeg=v=>v===0?0:-v;

// The single choke point for a DNA from anywhere — storage, a file, an archetype. Out-of-range or
// non-numeric axes fall back to their range or default; `keep` is repaired into a permutation of
// DNA_YIELDABLE with any missing axes appended in that order.
// v2 replaced v1's rollDegPerG with arbShare. Roll depends on CG height, which the app only
// estimates, so a roll value can't be converted without a chassis — a v1 DNA takes the arbShare
// default, and its keep order carries the rank across.
const sanitizeDNA=raw=>{
  const ax=raw?.axes??{};
  const keepIn=(Array.isArray(raw?.keep)?raw.keep:[]).map(k=>k==='rollDegPerG'?'arbShare':k);
  const axes=Object.fromEntries(Object.entries(DNA_AXES).map(([k,{min,max,def}])=>{
    const v=ax[k];
    return[k,(typeof v==='number'&&isFinite(v))?Math.max(min,Math.min(max,v)):def];
  }));
  const seen=new Set();
  const keep=[...keepIn,...DNA_YIELDABLE]
    .filter(k=>DNA_YIELDABLE.includes(k)&&!seen.has(k)&&seen.add(k));
  return{v:2,name:(typeof raw?.name==='string'&&raw.name.trim())?raw.name:'Untitled',axes,keep};
};

// Axes → a patch spread over the current fe/dr, so everything not named here (gameMode,
// targetSpeed, the MAN ARB fields, buildType, diffType) survives. Every axis lands on one field in
// a mode where that field already IS a target. Not CO-SOLVE: its rear/front ratio is exactly 1 at
// spring share 0 and can only move the way the balance correction points, so pitch would not be
// an independent axis. FRONT ride reference because SYNC holds the reference axle's ζ exactly.
const compileDNA=(ch,fe,dr,axes)=>({
  fe:{...fe,
    rideRef:'front',rideStiffMode:'hz',
    // sanitizeTune rounds rideStiffness to 0.01 — round here too, or the patch is not a fixed point.
    rideStiffness:Math.round(axes.platformHz*100)/100,
    rearHzMode:'multiplier',rearHzMult:axes.pitchRatio,
    arbMode:'share',arbShareMan:axes.arbShare,
    arbBalMode:'mech',arbBalTargetMode:'grip',arbBalDelta:axes.balanceOffset,
    dampCharMode:'zeta',reboundZeta:axes.reboundZeta,
    dampingMode:'ratio',bumpRatio:axes.bumpRatio,
    dampBalMode:'sync',dampingBias:dnaNeg(axes.dampBias)},
  dr:{...dr,diffManual:false,
    diffBiasExit:ch.layout==='FWD'?dnaNeg(axes.diffExit):axes.diffExit,
    diffBiasEntry:dnaNeg(axes.diffEntry)},
});

// The inverse of compileDNA, readable against ANY tune. The six outcome axes come from `tune`, so
// they mean the same whatever modes produced it. The three setting axes only mean the same under
// the modes compileDNA sets, so they read null otherwise — the UI says "mode differs" rather than
// comparing two quantities that merely share a name.
const measureDNA=(ch,tune,fe,dr)=>({
  platformHz:tune.fHz,
  pitchRatio:tune.rHz/tune.fHz,
  arbShare:tune.arbShare,
  // Same scale as gripBalTarget: both carry the tyre-width and MEASURE NAT BAL corrections.
  balanceOffset:tune.mechBalance-gripNeutralOf(ch),
  reboundZeta:tune.zetaF,
  bumpRatio:100*tune.bumpZetaF/tune.zetaF,
  dampBias:fe.dampBalMode==='sync'?dnaNeg(fe.dampingBias??0):null,
  diffExit:dr.diffManual?null:(ch.layout==='FWD'?dnaNeg(dr.diffBiasExit??0):(dr.diffBiasExit??0)),
  // Sport has no decel lock in-game, so ENTRY is inexpressible there, not merely different.
  diffEntry:dr.diffManual||dr.diffType==='sport'?null:dnaNeg(dr.diffBiasEntry??0),
});

// measureDNA turned into a DNA you can edit and apply — what TUNE CHECK's IMPORT AS DNA button
// and any future "make a DNA out of this" path go through. Two things a plain reading can't do:
//   * A setting axis that reads null (the tune is in a mode where that field means something
//     else) falls back to `from`, the axes already in the editor. Inventing a number the tune
//     never stated would be worse than leaving the draft's value alone.
//   * The damper split is converted rather than dropped. dampBias is only defined under SYNC, so
//     invert settleZetas' front-reference solve — rate(zR)·rHz = rate(zF)·fHz·biasMult with
//     biasMult = 2^(bias/50) — to get the bias that reproduces THIS tune's front/rear ζ split
//     whatever mode produced it. That inverts SYNC's own forward formula exactly, except where
//     rateToZeta clamped an axle at critical damping; the range clamp below absorbs the rest.
// Everything is clamped to DNA_AXES, so the result is a sanitizeDNA fixed point.
const dnaReadBack=(ch,fe,dr,tune,from)=>{
  const m=measureDNA(ch,tune,fe,dr);
  const rF=dampRate(tune.zetaF),rR=dampRate(tune.zetaR);
  const biasMult=(rF>0&&rR>0&&tune.fHz>0&&tune.rHz>0)?(rR*tune.rHz)/(rF*tune.fHz):1;
  return Object.fromEntries(Object.entries(DNA_AXES).map(([k,{min,max,def}])=>{
    const v=k==='dampBias'?50*Math.log2(biasMult):m[k];
    return[k,(typeof v==='number'&&isFinite(v))
      ?Math.max(min,Math.min(max,v))
      :(from?.[k]??def)];
  }));
};

// How far a measured axis may sit from its target and still count as hit. Each allowance is half
// of one quantisation step of whatever produced the number, so rounding the game imposes is never
// reported as a miss: sanitizeTune's 0.01 Hz, BeamNG's 500 N/m spring and 100 N/m/s damper grids,
// Forza's 0.1-click damper step. Share and balance reuse shareClamped's and mechBalClamped's own
// thresholds, which already sit downstream of ARB click rounding.
const dnaTolerances=(tune,gameMode)=>{
  const phys=isPhysical(gameMode);
  const hzRel=lbIn=>phys?(PHYS_SNAP.spring/2)/(2*lbIn*LB_IN_TO_NM):0;   // ΔHz/Hz = ½·Δk/k
  const dHalf=phys?PHYS_SNAP.damp/2:0.05;
  const relF=hzRel(tune.springF),relR=hzRel(tune.springR);
  const ratio=tune.bumpZetaF/tune.zetaF;
  return{
    platformHz:0.005+tune.fHz*relF+1e-9,
    pitchRatio:(tune.rHz/tune.fHz)*(relF+relR)+1e-6,
    arbShare:tune.arbShareTol,
    balanceOffset:0.01,
    reboundZeta:tune.zetaF*dHalf/Math.max(1e-9,tune.rebF)+1e-6,
    bumpRatio:100*ratio*(dHalf/Math.max(1e-9,tune.rebF)+dHalf/Math.max(1e-9,tune.bumpF))+1e-6,
    dampBias:1e-9,diffExit:1e-9,diffEntry:1e-9,
  };
};

// One forward solve of a set of axis values, through exactly the path App takes.
const dnaEvaluate=(ch,fe,dr,axes)=>{
  const c=compileDNA(ch,fe,dr,axes);
  const gameMode=c.fe.gameMode??DEF_FE.gameMode;
  const tune=solveTune(ch,resolveFeEffective(ch,c.fe),gameMode).tune;
  return{fe:c.fe,dr:c.dr,tune,measured:measureDNA(ch,tune,c.fe,c.dr),tol:dnaTolerances(tune,gameMode)};
};

// Compile, then give way where the game's limits make the targets conflict. Each row names the
// axes a limit can make miss and the axes that could move to recover them, in dependency order —
// balance depends on the bar budget SHARE sets (MECH can only split what the budget supplies, and a
// bar pinned at its floor or ceiling misses both together), so share is resolved first. For a miss, the candidates are tried
// least-protected first; reaching the missed axis itself means everything left is more protected,
// so the miss is accepted instead. A candidate is searched toward BOTH ends of its range and the
// nearest value that clears the miss wins — no per-axis direction table to get backwards. Every
// move and every accepted miss is returned, so the app never presents a compromise as the target.
const applyDNA=(ch,fe,dr,dnaRaw)=>{
  const dna=sanitizeDNA(dnaRaw);
  const rank=k=>dna.keep.indexOf(k);                       // lower = more protected
  const work={...dna.axes};
  const hit=(e,w,k)=>e.measured[k]==null||Math.abs(e.measured[k]-w[k])<=e.tol[k];
  const ROWS=[
    {id:'pitch',axes:['pitchRatio'],cands:['pitchRatio','platformHz'],
     // MULTIPLIER under a FRONT reference clamps the rear axle with rearHzClamped forced false, so
     // this one is detected from the band itself rather than from a flag.
     cause:e=>{const r=e.fe.rideStiffness*work.pitchRatio;
       return r>HZ_MAX||r<HZ_MIN?'rear axle outside the Hz band':'spring rate snapping';}},
    {id:'damping',axes:['reboundZeta','bumpRatio'],own:'reboundZeta',cands:['reboundZeta','platformHz'],
     cause:e=>e.tune.dampingClamped?'damper click range':'damper rounding'},
    // Platform is the only other lever: bars add a fixed stiffness per click while springs scale
    // with Hz, so a softer platform raises the share the bars can reach and a stiffer one lowers it.
    {id:'share',axes:['arbShare'],cands:['arbShare','platformHz'],
     cause:e=>!e.tune.shareClamped?'rounding'
       :e.measured.arbShare<work.arbShare?'anti-roll bars at their limit'
       :'anti-roll bars at their 1-click minimum'},
    {id:'balance',axes:['balanceOffset'],cands:['balanceOffset','pitchRatio','arbShare'],
     cause:e=>{const t=gripNeutralOf(ch)+work.balanceOffset;
       return t<0.20||t>0.90?'target outside the 0.20–0.90 balance range'
         :e.tune.mechBalClamped?'anti-roll bars cannot reach the split':'rounding';}},
  ];
  // Axes more protected than `cand` that currently hit must still hit after it moves — a move may
  // only spend axes ranked below itself. Bump ratio shares reboundZeta's rank (the damping row).
  const guardedBy=cand=>Object.keys(DNA_AXES).filter(k=>{
    const r=rank(k==='bumpRatio'?'reboundZeta':k);
    return r>=0&&r<rank(cand)&&hit(ev,work,k);
  });
  const tryMove=(cand,protectedAxes)=>{
    const v0=work[cand],{min,max}=DNA_AXES[cand],guard=guardedBy(cand);
    const clears=v=>{
      const w={...work,[cand]:v},e=dnaEvaluate(ch,fe,dr,w);
      return[...protectedAxes,...guard,cand].every(k=>hit(e,w,k));
    };
    // Scan outward from the current value before bisecting. Testing only the range ends is not
    // enough: a candidate's own valid region can be interior — pitch misses itself once
    // platform·pitch leaves the Hz band — and the clearing window can be narrow. Raising pitch to
    // fix balance also moves the springs the share budget is sized from, so a front-heavy chassis may clear only
    // across ~0.07 of pitch. 12 steps walked straight over windows like that; 96 steps is 1/96 of
    // the axis range. A window narrower than one step can still be missed — it is then reported
    // as a miss, never hidden.
    const STEPS=96;
    let best=null;
    for(const bound of [min,max]){
      if(bound===v0)continue;
      let prev=v0;
      for(let s=1;s<=STEPS;s++){
        const v=v0+(bound-v0)*s/STEPS;
        if(!clears(v)){prev=v;continue;}
        let ok=v,bad=prev;
        for(let i=0;i<14;i++){const mid=(ok+bad)/2;if(clears(mid))ok=mid;else bad=mid;}
        if(best==null||Math.abs(ok-v0)<Math.abs(best-v0))best=ok;
        break;
      }
    }
    return best;
  };
  const moves=[],accepted=new Set();
  let ev=dnaEvaluate(ch,fe,dr,work);
  while(moves.length<DNA_MAX_MOVES){
    const row=ROWS.find(r=>!accepted.has(r.id)&&r.axes.some(k=>!hit(ev,work,k)));
    if(!row)break;
    const own=row.own??row.axes[0];
    let moved=false;
    for(const cand of [...row.cands].sort((a,b)=>rank(b)-rank(a))){
      if(cand===own)break;
      const to=tryMove(cand,row.axes);
      if(to==null)continue;
      moves.push({axis:cand,from:work[cand],to,protects:own,cause:row.cause(ev)});
      work[cand]=to;
      ev=dnaEvaluate(ch,fe,dr,work);
      moved=true;
      // A move can unblock a miss accepted earlier — lowering pitch for balance can make a roll
      // miss that no platform value could fix become fixable — so every accepted miss is judged
      // again against the new state. DNA_MAX_MOVES still bounds the loop. Without this a resolved
      // DNA was not a fixed point: applying its own result could move again.
      accepted.clear();
      break;
    }
    if(!moved)accepted.add(row.id);
  }
  const rowOf=k=>ROWS.find(r=>r.axes.includes(k));
  return{
    dna,fe:ev.fe,dr:ev.dr,tune:ev.tune,measured:ev.measured,tol:ev.tol,work,moves,
    misses:Object.keys(DNA_AXES).filter(k=>!hit(ev,work,k))
      .map(k=>({axis:k,target:work[k],achieved:ev.measured[k],cause:rowOf(k)?.cause(ev)??null})),
    inexpressible:Object.keys(DNA_AXES).filter(k=>ev.measured[k]==null),
  };
};
// ── Output unit formatting ──────────────────────────────────────────────────
// The Forza modes emit clicks on a 1..lim scale, so their readouts want a "/ N"
// denominator and a near-the-ceiling warning. Physical modes emit real units and
// want neither. These helpers are the single place that difference is decided, so no
// readout has to branch on the game mode itself.
//
// UNITS ARE COPIED FROM BEAMNG'S OWN TUNING SLIDERS, verified against a screenshot of
// a stock vehicle's defaults — do not "tidy" them into more conventional SI spellings:
//   Spring Rate            N/m     (NOT N/mm — a 1000× error if confused)
//   Bump/Rebound Damping   N/m/s   (identical to N·s/m; this is BeamNG's spelling)
//   Anti-Roll Spring Rate  N/m     (a LINEAR rate, not torsional N·m/rad — see arbOut)
// LB_IN_TO_NM is already N/m per lb/in, so physical modes need no separate constant —
// NMM_PER_LBIN is the UNITS modal's N/mm conversion and is unrelated here.
//
// MOTION RATIO is applied here, at the display layer, and deliberately not inside the balance
// model: Hz, roll stiffness and every balance figure are wheel-rate quantities and must not
// move by rate/mr² just because a motion ratio was entered. `mrDiv`/`roundTo`/`PHYS_SNAP` now
// live up with the calibration constants, because computeTune snaps to the same grid before
// deriving the physics it reports. The rounding below is therefore normally a no-op
// re-application of a snap already performed upstream — kept deliberately, because it is the
// last thing standing between a raw coefficient and the UI, and the paths that do not run
// through computeTune (TUNE CHECK, the ARB MAN field's own round-trip) still land here.
const springOut=(lbIn,gameMode,su,mr=1)=>isPhysical(gameMode)
  ? {value:roundTo(lbIn*LB_IN_TO_NM/mrDiv(mr),500),unit:'N/m',decimals:0}
  : {value:lbIn*su.f,unit:su.label,decimals:su.dp};
const dampOut=(v,lim,mr=1)=>lim.damping==null
  ? {value:roundTo(v/mrDiv(mr),100),unit:'N/m/s',decimals:0}
  : {value:v,unit:`/ ${lim.damping}`,decimals:1};
// Roll stiffness (N·m/rad) → the linear anti-roll rate BeamNG asks for, by the same
// rs = k·track²/2 relationship the spring side uses, inverted. No motion-ratio term
// yet, but not because the question is open: BeamNG specifies the rate at the bar's
// own lever rather than at the wheel, so a real inboard bar needs a higher number by
// (track/arm)². BeamNG exposes no arm length and the coefficient convention is still
// unsettled, so the divisor comes from the user as ARB Motion Ratio F/R (arm/track, default
// 1.0 = the old acts-at-the-wheel assumption). See docs/KNOWN_ISSUES.md for the research.
const arbOut=(v,lim,track=1.55,mr=1)=>lim.arb==null
  ? {value:roundTo(2*v/(track*track*mrDiv(mr)),1000),unit:'N/m',decimals:0}
  : {value:v,unit:`/ ${lim.arb}`,decimals:1};
const warnOver=(v,ceiling)=>ceiling==null?false:v>ceiling*0.88;
// "how close to the game's ceiling" — meaningless without one, so callers in physical
// modes get null back and render no badge rather than an invented band.
const arbCtx=(arb,limit)=>{
  if(limit==null)return null;
  const p=(arb-1)/(limit-1);
  if(p<0.50)return['LOW','#60a5fa'];
  if(p<0.75)return['MED','#f59e0b'];
  if(p<0.90)return['HIGH','#f97316'];
  return['MAX','#ef4444'];
};
const diffCtx=v=>{
  if(v===0)return['OFF','#94a3b8'];
  if(v<20)return['LOW','#cbd5e1'];
  if(v<45)return['MED','#94a3b8'];
  if(v<70)return['HIGH','#f59e0b'];
  return['MAX','#ef4444'];
};

// Inverse of the solve: read Hz and damping ratios back out of in-game values.
// `calib` undoes whatever the forward path applied — DAMPING_CALIBRATION for the click-based
// Forza modes, 1 for physical modes where the entered number is already the N·s/m coefficient.
// This is the one click-scale dependency in the checker that carries no `lim.*` reference,
// so it is easy to miss when adding a mode.
const computeCheck=(spr,damp,masses,calib=DAMPING_CALIBRATION)=>{
  const wrF=spr.f*LB_IN_TO_NM,wrR=spr.r*LB_IN_TO_NM;
  const hF=wrF>0?Math.sqrt(wrF/masses.front)/(2*Math.PI):0;
  const hR=wrR>0?Math.sqrt(wrR/masses.rear)/(2*Math.PI):0;
  const ccF=2*Math.sqrt(wrF*masses.front),ccR=2*Math.sqrt(wrR*masses.rear);
  return{hF,hR,
    zRebF:ccF>0?(damp.rebF/calib/ccF)*100:0,zRebR:ccR>0?(damp.rebR/calib/ccR)*100:0,
    zBmpF:ccF>0?(damp.bumpF/calib/ccF)*100:0,zBmpR:ccR>0?(damp.bumpR/calib/ccR)*100:0};
};

// NOTE: arrays fall through to `parsed` verbatim — there is deliberately no
// per-element merging. Array-valued persisted keys (the GARAGE entry list) therefore
// get NO default-filling from usePersist and must be normalized on read instead —
// see normalizeEntry below, and the array-key section in docs/PERSISTENCE.md.
const mergeDefaults=(initial,parsed)=>
  (initial&&typeof initial==='object'&&!Array.isArray(initial)
    &&parsed&&typeof parsed==='object'&&!Array.isArray(parsed))
    ?{...initial,...parsed}:parsed;
const usePersist=(key,initial)=>{
  const[val,setVal]=useState(()=>{
    try{const s=localStorage.getItem(key);
      return s?mergeDefaults(initial,JSON.parse(s)):initial;}
    catch(e){return initial;} // private browsing or parse error — use defaults
  });
  // NOTE: `set` closes over the render-time `val`, so two set() calls on the SAME key
  // within one tick clobber each other (the second computes from the stale value).
  // Callers that need to combine multiple sources must build the full next value first
  // and issue exactly ONE set() — see the GARAGE migration and the restore handler.
  const set=v=>{
    const next=typeof v==='function'?v(val):v;
    setVal(next);
    try{localStorage.setItem(key,JSON.stringify(next));}catch{}
  };
  return[val,set];
};

// ── Undo / redo history ─────────────────────────────────────────────────────
// Pure core, no React — App owns one instance in a ref and drives it (see "Undo / redo wiring").
// An entry is a whole-state snapshot {ch,fe,dr,al,dnaApplied} plus the label of the action that
// moved away from it. Whole snapshots rather than diffs: a few KB each, and a restore can never
// reassemble a state that didn't exist.
//
// Two ways in. A discrete action (a load, APPLY, an import, RESET) calls commit() and is always its
// own step. A continuous edit calls record() on every change: only the first change of a BURST
// saves the state from before it, so one slider drag is one step. App ends a burst on pointerdown,
// pointerup, focusout, or 600 ms without a change.
//
// A step whose snapshot equals the current state would undo to nothing — a click on a toggle that
// was already on. close() drops one once the state has rendered; undo()/redo() skip any left over.
// close() compares by identity first: App builds a fresh `cur` object on every render, so the SAME
// object means nothing has rendered since record(), and an equal-looking state is stale, not a no-op.
const HISTORY_CAP=100;
const sameSnap=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const makeHistory=(cap=HISTORY_CAP)=>{
  const past=[],future=[];
  let open=false;
  const top=a=>a[a.length-1];
  const push=(snap,label)=>{
    past.push({snap,label});
    if(past.length>cap)past.shift();
    future.length=0;
  };
  return{
    // True when this change opened a new step.
    record(cur){if(open)return false;push(cur,'change');open=true;return true;},
    commit(cur,label){open=false;push(cur,label);},
    // True when a no-op step was dropped.
    close(cur){
      open=false;
      const t=top(past);
      if(t&&t.snap!==cur&&sameSnap(t.snap,cur)){past.pop();return true;}
      return false;
    },
    // Both return the snapshot to restore, or null.
    undo(cur){
      open=false;
      while(past.length&&sameSnap(top(past).snap,cur))past.pop();
      if(!past.length)return null;
      const e=past.pop();
      future.push({snap:cur,label:e.label});
      return e.snap;
    },
    redo(cur){
      open=false;
      while(future.length&&sameSnap(top(future).snap,cur))future.pop();
      if(!future.length)return null;
      const e=future.pop();
      past.push({snap:cur,label:e.label});
      return e.snap;
    },
    get canUndo(){return past.length>0;},
    get canRedo(){return future.length>0;},
    get undoLabel(){return top(past)?.label??null;},
    get redoLabel(){return top(future)?.label??null;},
  };
};

// ── GARAGE entry model ──────────────────────────────────────────────────────
// One unified entry replaces the old split chassis-only GARAGE and tune-only MY BUILDS
// lists. An entry carries any combination of ch / fe+dr payloads; its "kind" is DERIVED
// from which payloads are present, never stored — a stored kind would desync the moment
// an entry is rewritten with different data.
const kindOf=e=>{
  const hasCh=!!e?.ch, hasBuild=!!(e?.fe||e?.dr);
  // A saved Vehicle DNA carries only `dna`. A `dna` beside fe/dr is a build's provenance and
  // doesn't change its kind.
  return hasCh&&hasBuild?'car':hasCh?'chassis':hasBuild?'build'
    :e?.dna?.axes&&typeof e.dna.axes==='object'?'dna':'empty';
};
// 'empty' is the corrupt/hand-edited case. It renders as a deletable card rather than
// crashing — a `ch:null` entry used to take the whole app down via the ErrorBoundary,
// because the old garage card read s.ch.weight with no guard.

// Timestamp resolution. Old entries have no createdAt/updatedAt, but their `id` is a
// Date.now() from when they were saved, so it doubles as a creation stamp. The 1e12
// guard (~Sept 2001) rejects small ints from hand-edited files and array indices.
// The legacy `savedAt` field is a toLocaleDateString() STRING and is unsortable — it is
// no longer written, only tolerated on read; dates are formatted from this number at
// render time instead (which also fixes stale formatting if the user changes locale).
const stampOf=e=>e?.updatedAt??e?.createdAt
  ??(Number.isFinite(e?.id)&&e.id>1e12?e.id:Date.now());

// The single choke point for everything entering the entry list (migration, legacy file
// import, v2 file import). Because mergeDefaults skips arrays, this is what makes missing
// fields survivable without every render site needing its own ?? defaulting.
const normalizeEntry=raw=>{
  const t=stampOf(raw??{});
  return{
    id:        Number.isFinite(raw?.id)?raw.id:Date.now(),
    name:      (typeof raw?.name==='string'&&raw.name.trim())?raw.name:'Untitled',
    // omit absent payloads rather than storing null — kindOf keys off truthiness, and
    // absent keys keep backup files smaller
    ...(raw?.ch?{ch:raw.ch}:{}),
    ...(raw?.fe?{fe:raw.fe}:{}),
    ...(raw?.dr?{dr:raw.dr}:{}),
    // Beside fe/dr: which DNA a build was stamped from. Alone: a saved DNA (kind 'dna').
    ...(raw?.dna&&typeof raw.dna==='object'
      &&((raw.fe||raw.dr)||(!raw.ch&&raw.dna.axes&&typeof raw.dna.axes==='object'))?{dna:raw.dna}:{}),
    tags:      Array.isArray(raw?.tags)?raw.tags.filter(x=>typeof x==='string'):[],
    notes:     typeof raw?.notes==='string'?raw.notes:'',
    createdAt: Number.isFinite(raw?.createdAt)?raw.createdAt:t,
    updatedAt: Number.isFinite(raw?.updatedAt)?raw.updatedAt:t,
  };
};

// Merges the two legacy lists into one. Pure and module-scope because it has TWO callers:
// the one-time localStorage migration, and the legacy-backup-file import path. Inlining it
// into the migration effect would guarantee the file-import copy rots, since that's the one
// with no daily users exercising it.
const unifyLegacy=(garageArr,buildsArr)=>{
  const used=new Set();
  const take=e=>{
    let nid=Number.isFinite(e?.id)?e.id:Date.now();
    // Both legacy lists id by Date.now(), so the same id can appear in both. Duplicate
    // React keys cause silent render corruption, so bump — but keep the ORIGINAL id as the
    // timestamp, or a collision would quietly rewrite that entry's date and its sort order.
    while(used.has(nid))nid++;
    used.add(nid);
    const t=stampOf(e??{});
    return normalizeEntry({...e,id:nid,createdAt:t,updatedAt:t});
  };
  return[
    ...(Array.isArray(garageArr)?garageArr:[]).map(take),
    ...(Array.isArray(buildsArr)?buildsArr:[]).map(take),
  // sort into one timeline — concatenating by source would show "all chassis, then all
  // builds", which reads as broken to someone who just saved a build
  ].sort((a,b)=>b.createdAt-a.createdAt);
};

// Backup-file parser. Returns a normalized entry array, or null if unrecognizable.
// Checks `entries` BEFORE branching on `version` so a v2 file whose version field got
// corrupted still imports — version is documentation and future dispatch, not a gate.
// The legacy branch reuses unifyLegacy verbatim, so the old-file path is exercised by the
// same code every existing user runs once at migration and therefore can't silently rot.
const parseBackup=parsed=>{
  if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))return null;
  if(Array.isArray(parsed.entries))return parsed.entries.map(normalizeEntry);           // v2
  if(Array.isArray(parsed.garage)||Array.isArray(parsed.builds))                        // v1
    return unifyLegacy(parsed.garage,parsed.builds);
  return null;
};

// Auto-tags: DERIVED at render, never stored. Storing them would leave old entries
// showing stale labels the moment a threshold is retuned. Each tag is only produced when
// the entry actually carries the payload it reads from, so a chassis-only entry gets no
// Hz/build tag and a build-only entry gets no layout/balance tag.
const NOTES_MAX=2000;
const autoTagsOf=e=>{
  const out=[];
  if(e?.ch){
    out.push({label:e.ch.layout??'RWD',color:'#94a3b8'});
    const fb=e.ch.frontBias??52;
    // frontBias is an integer 30–70, so ±2 is a 5-value band around even
    if(Math.abs(fb-50)<=2)out.push({label:'BALANCED',color:'#22c55e'});
    else out.push({label:fb>50?'NOSE HEAVY':'TAIL HEAVY',color:'#64748b'});
  }
  if(e?.fe){
    // rsToHz FIRST — it auto-converts the legacy 0–100 rideStiffness scale. Skipping it
    // silently misclassifies old entries (a legacy 50 would read RACE instead of ROAD).
    const[lbl,col]=hzCtx(rsToHz(e.fe.rideStiffness??1.75));
    out.push({label:lbl,color:col});   // reuses the HZ_BANDS single source of truth
  }
  if(e?.dr)out.push({label:(e.dr.buildType??'track').toUpperCase(),color:'#94a3b8'});
  return out;
};

// ── units ──
// Per-category display units, chosen in the UNITS modal. Replaced the single IMP/MET
// toggle (suspos_units_v1, a boolean), which is still read once as the default for
// suspos_units_v2 so an existing metric user starts all-metric. BeamNG springs, dampers
// and ARBs ignore the spring choice — they are always N/m, BeamNG's own unit.
const UNIT_GROUPS=[
  {k:'mass',label:'Weight',opts:[['lb','lb'],['kg','kg']]},
  {k:'spring',label:'Spring rate',opts:[['lbin','lb/in'],['nmm','N/mm'],['kgfmm','kgf/mm']],
   note:"Pick whichever Forza is set to. Forza's N/mm and kgf/mm are both 10× the true unit, as the game shows them. BeamNG is always N/m."},
  {k:'length',label:'Ride height',opts:[['in','in'],['cm','cm']]},
  {k:'speed',label:'Speed',opts:[['mph','mph'],['kmh','km/h']]},
];
const UNITS_IMP={mass:'lb',spring:'lbin',length:'in',speed:'mph'};
// ALL METRIC picks kgf/mm for springs because that is Forza's own metric default.
const UNITS_MET={mass:'kg',spring:'kgfmm',length:'cm',speed:'kmh'};
const legacyUnits=()=>{
  try{return JSON.parse(localStorage.getItem('suspos_units_v1'))===true?UNITS_MET:UNITS_IMP;}
  catch(e){return UNITS_IMP;}
};

// Summary line. Takes metricUnits because the old garage card hardcoded imperial and
// ignored the units setting entirely. Wheelbase stays in metres in both unit systems,
// matching how it's displayed everywhere else in the app.
const entrySummary=(e,metric)=>{
  if(e?.dna&&!e.ch&&!e.fe&&!e.dr){
    const a=sanitizeDNA(e.dna).axes;
    return['platformHz','arbShare','balanceOffset','reboundZeta'].map(k=>dnaFmt(k,a[k])).join(' · ');
  }
  const bits=[];
  if(e?.ch){
    bits.push(metric?`${Math.round(e.ch.weight/KG_TO_LB)}kg`:`${Math.round(e.ch.weight)}lb`);
    bits.push(`${e.ch.frontBias}% F`);
    bits.push(`${e.ch.wheelbase}m wb`);
  }
  if(e?.fe){
    const hz=rsToHz(e.fe.rideStiffness??1.75);
    bits.push(`${hz.toFixed(2)} Hz`);
    if(e.ch){
      // Car entries carry their own chassis, so the actual bottom-out g (not just the
      // stored target) can be computed on THIS entry's ride height — same sag model as
      // the SAG vs LOAD chart / BOTTOM G's stiffness mode. Shown regardless of which
      // stiffness mode was active when saved, since the chassis context makes it a real
      // reading either way, not just an aspiration.
      const rRef=e.fe.rideRef??'front';
      const rhPrimary_mm=rRef==='rear'?(e.ch.rideHeightR??0.12)*1000
        :rRef==='shared'?((e.ch.rideHeightF??0.13)+(e.ch.rideHeightR??0.12))/2*1000
        :(e.ch.rideHeightF??0.13)*1000;
      const g=rhPrimary_mm*Math.pow(2*Math.PI*hz,2)/9810;
      bits.push(`${g.toFixed(2)} g`);
    }else if(e.fe.rideStiffMode==='bottomG'&&e.fe.rideBottomG!=null){
      // Build entries have no chassis, so there's no ride height to compute a real bottom-out
      // g from — but if BOTTOM G's mode was selected, the stored target itself is still
      // meaningful (it's what re-solves Hz on whatever chassis the build gets applied to).
      bits.push(`${e.fe.rideBottomG.toFixed(2)} g target`);
    }
    bits.push(`${e.fe.reboundZeta??70}% ζ`);
    bits.push((e.fe.dampingMode??'ratio')==='independent'
      ?`${e.fe.bumpZeta??39}% bump ζ`
      :`${e.fe.bumpRatio??56}% bump`);
  }
  if(e?.dr)bits.push((e.dr.diffType??'race').toUpperCase());
  return bits.join(' · ');
};

const KIND_META={
  chassis:{label:'CH', color:'#60a5fa'},
  build:  {label:'BLD',color:'#a78bfa'},
  car:    {label:'CAR',color:'#4ade80'},
  dna:    {label:'DNA',color:'#818cf8'},
  empty:  {label:'⚠',  color:'#f59e0b'},
};

const DEF_CH={weight:3200,frontBias:52,wheelbase:2.7,cgHeight:0.45,

              useMeasuredNatBal:false,measuredNatBal:null,layout:'RWD',
              measuredNatBalHz:null,useMeasuredArbClick:false,measuredArbClick:null,measuredArbNat:null,measuredArbNatHz:null,
              useRideHeightCG:true,rideHeightF:0.13,rideHeightR:0.12,

              // in the physics reads them, see the note at springOut.
              motionRatioF:1.0,motionRatioR:1.0,
              // ARB drop-link arm as a fraction of track. The solver works in roll stiffness;
              // BeamNG's ARB slider sets the rate at the bar's own lever, so a bar attaching
              // inboard needs a higher N/m by (track/arm)². SEPARATE from motionRatioF/R — the
              // spring mount and the drop link are independent geometry. 1.0 = the old

              arbMotionRatioF:1.0,arbMotionRatioR:1.0};

              arbManF:20,arbManR:20,

              rideStiffMode:'hz',rideBottomG:null};
// buildType:'street' pairs with diffType:'sport' — recommendedDiffType maps
// street→sport, track→race (index.html, search recommendedDiffType), so these two
// must move together or a fresh INT/PRO install shows a spurious RECOMMENDED
// mismatch banner on the DIFFERENTIAL card. diffCenter:65 already equals
// _baseCenterLookup.street, so no change needed there for the (AWD-only) center
// split recommendation to stay matched.
const DEF_DR={buildType:'street',diffType:'sport',
              diffManual:false,diffComplement:false,
              diffBiasExit:0,diffBiasEntry:0,diffFrontExitBias:0,
              diffAccel:35,diffDecel:10,
              diffFrontAccel:28,diffFrontDecel:0,
              diffRearAccel:48,diffRearDecel:8,diffCenter:65};
const DEF_AL={alignManual:false,
              camberF:-2.3,camberR:-1.8,toeF:-0.1,toeR:0.1,caster:5.5,
              mode:'build',nudgeStrength:50};
const ALIGN_MODE_DEC=['build','mech','grip','manual'];
const BRAKE_BIAS_SCALE=0.20;

// Every preset authors damping as rebound ζ (CHARACTER), never as a Settle Target. Beginner's
// loadPreset forces dampCharMode:'zeta', so a SETTLE preset silently fell back to DEF_FE's 70%
// there while INT/PRO back-solved its target — STREET gave ζ≈30% in INT/PRO and 70% in BEG.
// The one-decimal values below are what the old targets back-solved to (STREET 0.55s, TRACK
